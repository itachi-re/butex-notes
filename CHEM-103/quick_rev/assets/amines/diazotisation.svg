<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 240" width="420" height="240" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="420" height="240" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
  </marker>
  <marker id="arrow-curve" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
  </marker>
</defs>
<text x="210.0" y="34" font-size="20" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Diazotisation</text>
<line x1="33.6" y1="46" x2="386.40000000000003" y2="46" stroke="#222" stroke-width="1.5"/>
<text x="90" y="110" font-size="16" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">ArNH₂</text>
<line x1="160" y1="110" x2="270" y2="110" stroke="#000" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="215.0" y="102" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">NaNO₂, 2HCl</text>
<text x="215.0" y="128" font-size="10" text-anchor="middle" font-weight="normal" font-style="italic" fill="#333333" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">0–5°C</text>
<text x="330" y="110" font-size="15" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">ArN₂⁺Cl⁻</text>
<text x="210.0" y="165" font-size="10.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#555" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Low temperature is essential: diazonium salts</text>
<text x="210.0" y="181" font-size="10.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#555" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">decompose readily above ~5°C</text>
</svg>
