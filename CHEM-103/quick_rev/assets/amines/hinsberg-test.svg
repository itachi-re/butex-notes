<text x="230" y="190" font-size="15" text-anchor="middle" font-weight="bold" font-style="normal" fill="#2c5aa0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">2°</text>
<text x="230" y="210" font-size="10.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">R₂NSO₂C₆H₅</text>
<text x="230" y="226" font-size="9.5" text-anchor="middle" font-weight="normal" font-style="italic" fill="#555" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">no acidic H</text>
<rect x="160" y="240" width="140" height="55" fill="#fbfbfb" stroke="#333" stroke-width="1.2" rx="4"/>
