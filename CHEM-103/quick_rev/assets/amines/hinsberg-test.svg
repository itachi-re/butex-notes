<text x="390" y="190" font-size="15" text-anchor="middle" font-weight="bold" font-style="normal" fill="#2c5aa0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">3°</text>
<text x="390" y="210" font-size="10.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">no reaction</text>
<text x="390" y="226" font-size="9.5" text-anchor="middle" font-weight="normal" font-style="italic" fill="#555" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">no N–H to substitute</text>
