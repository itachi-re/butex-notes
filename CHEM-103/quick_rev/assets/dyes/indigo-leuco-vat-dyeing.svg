<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="420" height="220" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="420" height="220" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
  </marker>
  <marker id="arrow-curve" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
  </marker>
</defs>
<text x="210.0" y="34" font-size="18.330170777988616" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Indigo ↔ Leuco-indigo (Vat Dyeing)</text>
<line x1="33.6" y1="46" x2="386.40000000000003" y2="46" stroke="#222" stroke-width="1.5"/>
<text x="90" y="110" font-size="13" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Indigo (insoluble)</text>
<line x1="200" y1="104" x2="300" y2="104" stroke="#000" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="300" y1="116" x2="200" y2="116" stroke="#000" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="250" y="90" font-size="10" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Na₂S₂O₄ / air</text>
<text x="370" y="110" font-size="12" text-anchor="end" font-weight="normal" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Leuco-indigo</text>
<text x="370" y="128" font-size="10" text-anchor="end" font-weight="normal" font-style="normal" fill="#555" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">(soluble)</text>
<rect x="20" y="160" width="380" height="45" fill="#fbfbfb" stroke="#333" stroke-width="1.2" rx="4"/>
<text x="210.0" y="182.0" font-size="10.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Fabric absorbs the soluble leuco form; air then</text>
<text x="210.0" y="198.5" font-size="10.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">re-oxidises it to insoluble blue indigo in situ.</text>
</svg>
