<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" width="300" height="220" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="300" height="220" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>

<defs>
