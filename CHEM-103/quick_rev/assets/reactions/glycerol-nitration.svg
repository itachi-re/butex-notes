<text x="150.0" y="34" font-size="12.71889400921659" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Glycerol Nitration (Structure Only)</text>
<line x1="24.0" y1="46" x2="276.0" y2="46" stroke="#222" stroke-width="1.5"/>
<text x="150.0" y="64" font-size="12.637362637362637" text-anchor="middle" font-weight="normal" font-style="italic" fill="#444444" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Academic reaction scheme — see source text</text>
<text x="90" y="110" font-size="14" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">C₃H₅(OH)₃</text>
<line x1="170" y1="110" x2="250" y2="110" stroke="#000" stroke-width="1.8" marker-end="url(#arrow)"/>
