<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="420" height="260" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="420" height="260" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
  </marker>
  <marker id="arrow-curve" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
  </marker>
</defs>
<text x="210.0" y="34" font-size="20" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Electrophilic Addition</text>
<line x1="33.6" y1="46" x2="386.40000000000003" y2="46" stroke="#222" stroke-width="1.5"/>
<text x="210.0" y="64" font-size="13" text-anchor="middle" font-weight="normal" font-style="italic" fill="#444444" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Electron-rich π-bond attacked by an electrophile</text>
<text x="90" y="110" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">CH₂=CH₂</text>
<text x="90" y="128" font-size="13" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">+ HBr</text>
<path d="M120,100 Q140.0,67.5 160,75" fill="none" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow-curve)"/>
<line x1="160" y1="110" x2="250" y2="110" stroke="#000" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="205.0" y="102" font-size="10.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">H⁺ attacks π-bond</text>
<text x="320" y="110" font-size="14" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">CH₃CH₂⁺</text>
<text x="320" y="128" font-size="10" text-anchor="middle" font-weight="normal" font-style="normal" fill="#555" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">(carbocation)</text>
<line x1="320" y1="140" x2="320" y2="185" stroke="#000" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="330" y="158.5" font-size="10" text-anchor="start" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Br⁻ attacks</text>
<text x="320" y="210" font-size="15" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">CH₃CH₂Br</text>
</svg>
