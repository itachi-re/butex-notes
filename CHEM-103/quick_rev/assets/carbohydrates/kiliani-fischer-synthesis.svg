<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" width="320" height="300" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="320" height="300" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
  </marker>
  <marker id="arrow-curve" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
  </marker>
</defs>
<text x="160.0" y="34" font-size="18.993548387096777" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Kiliani–Fischer Synthesis</text>
<line x1="25.6" y1="46" x2="294.40000000000003" y2="46" stroke="#222" stroke-width="1.5"/>
<text x="160.0" y="64" font-size="12.867132867132868" text-anchor="middle" font-weight="normal" font-style="italic" fill="#444444" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Chain extension: aldose → next-higher aldose</text>
<text x="160.0" y="100" font-size="13" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Aldose (n carbons)</text>
<line x1="160.0" y1="115" x2="160.0" y2="155" stroke="#000" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="170.0" y="131.0" font-size="11" text-anchor="start" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">HCN</text>
<text x="160.0" y="175" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">cyanohydrin (n+1 C)</text>
<line x1="160.0" y1="190" x2="160.0" y2="230" stroke="#000" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="170.0" y="206.0" font-size="10" text-anchor="start" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">hydrolyse, then reduce</text>
<text x="160.0" y="250" font-size="13" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Next-higher aldose</text>
<text x="160.0" y="270" font-size="10" text-anchor="middle" font-weight="normal" font-style="normal" fill="#555" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">e.g. D-glyceraldehyde → D-arabinose + D-ribose</text>
</svg>
