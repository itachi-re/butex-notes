<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 340" width="380" height="340" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="380" height="340" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
  </marker>
  <marker id="arrow-curve" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
  </marker>
</defs>
<text x="190.0" y="34" font-size="12.258064516129032" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Evidence for the Cyclic Structure of D-Glucose</text>
<line x1="30.400000000000002" y1="46" x2="349.6" y2="46" stroke="#222" stroke-width="1.5"/>
<text x="30" y="90" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">1. Fails typical free-aldehyde tests (no Schiff's colour)</text>
<text x="30" y="130" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">2. Mutarotation: rotation drifts to a constant equilibrium value</text>
<text x="30" y="170" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">3. Two distinct crystalline anomers (α and β) exist</text>
<text x="30" y="210" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">4. Forms a PENTAacetate (5 –OH groups, incl. ring –OH at C1)</text>
<text x="30" y="250" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">5. Forms a stable methyl glycoside — no longer reducing</text>
</svg>
