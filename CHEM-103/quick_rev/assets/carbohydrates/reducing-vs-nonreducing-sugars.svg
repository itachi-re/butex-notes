<text x="170.0" y="119.0" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">REDUCING: free/potential anomeric –OH</text>
<text x="170.0" y="136.5" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">can open to a reactive –CHO</text>
<text x="170.0" y="154.0" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">e.g. glucose, fructose, maltose, lactose</text>
