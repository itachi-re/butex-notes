<text x="170.0" y="34" font-size="16.274713839750262" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Reducing vs Non-reducing Sugars</text>
<line x1="27.2" y1="46" x2="312.8" y2="46" stroke="#222" stroke-width="1.5"/>
<rect x="20" y="85" width="300" height="80" fill="#fbfbfb" stroke="#333" stroke-width="1.2" rx="4"/>
