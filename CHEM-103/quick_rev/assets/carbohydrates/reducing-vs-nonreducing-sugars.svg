<text x="170.0" y="196" font-size="12" text-anchor="middle" font-weight="bold" font-style="normal" fill="#555555" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">NON-REDUCING SUGARS</text>
<text x="170.0" y="214.0" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">NON-REDUCING: both anomeric carbons</text>
<text x="170.0" y="231.5" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">engaged in the glycosidic bond</text>
<text x="170.0" y="249.0" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">e.g. sucrose, trehalose</text>
