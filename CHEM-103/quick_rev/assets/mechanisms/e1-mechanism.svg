<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="720" height="300" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
  </marker>
  <marker id="arrow-curve" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
  </marker>
</defs>
<text x="360.0" y="34" font-size="20" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">E1 Mechanism — Unimolecular Elimination</text>
<line x1="57.6" y1="46" x2="662.4" y2="46" stroke="#222" stroke-width="1.5"/>
<text x="360.0" y="64" font-size="13" text-anchor="middle" font-weight="normal" font-style="italic" fill="#444444" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Two steps: ionisation, then loss of a β-H</text>
<circle cx="50" cy="100" r="11" fill="#2c5aa0"/>
<text x="50" y="104.5" font-size="12" text-anchor="middle" font-weight="bold" font-style="normal" fill="#ffffff" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">1</text>
<text x="68" y="105" font-size="13.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Slow: ionisation (rate-determining)</text>
<text x="150" y="150" font-size="19" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">R–X</text>
<line x1="190" y1="150" x2="280" y2="150" stroke="#000" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="330" y="150" font-size="19" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">R⁺</text>
<text x="380" y="150" font-size="16" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">+ X⁻</text>
<circle cx="450" cy="100" r="11" fill="#2c5aa0"/>
<text x="450" y="104.5" font-size="12" text-anchor="middle" font-weight="bold" font-style="normal" fill="#ffffff" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">2</text>
<text x="468" y="105" font-size="13.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Fast: base removes β-H</text>
<path d="M470,138 Q495.0,176.5 520,165" fill="none" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow-curve)"/>
<line x1="500" y1="150" x2="590" y2="150" stroke="#000" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="650" y="150" font-size="19" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Alkene</text>
<rect x="150" y="200" width="220" height="55" fill="#eef4ff" stroke="#2c5aa0" stroke-width="1.3" rx="4"/>
<text x="260.0" y="220" font-size="12.5" text-anchor="middle" font-weight="bold" font-style="normal" fill="#2c5aa0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Rate law</text>
<text x="260.0" y="242" font-size="15" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Rate = k[RX]  (1st order)</text>
<text x="650" y="200" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#333" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">C=C forms as β-H</text>
<text x="650" y="216" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#333" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">is abstracted by base</text>
</svg>
