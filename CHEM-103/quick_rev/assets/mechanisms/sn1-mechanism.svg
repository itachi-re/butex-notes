<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="760" height="480" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
  </marker>
  <marker id="arrow-curve" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
  </marker>
</defs>
<text x="380.0" y="34" font-size="20" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">SN1 Mechanism — Unimolecular Nucleophilic Substitution</text>
<line x1="60.800000000000004" y1="46" x2="699.2" y2="46" stroke="#222" stroke-width="1.5"/>
<text x="380.0" y="64" font-size="13" text-anchor="middle" font-weight="normal" font-style="italic" fill="#444444" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Two mechanistic steps; rate depends on substrate only</text>
<circle cx="60" cy="100" r="11" fill="#2c5aa0"/>
<text x="60" y="104.5" font-size="12" text-anchor="middle" font-weight="bold" font-style="normal" fill="#ffffff" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">1</text>
<text x="78" y="105" font-size="13.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Slow, rate-determining: ionisation</text>
<text x="160" y="150" font-size="20" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">R–X</text>
<path d="M185,138 Q207.5,98.0 230,118" fill="none" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow-curve)"/>
<line x1="230" y1="150" x2="340" y2="150" stroke="#000" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="400" y="150" font-size="20" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">R⁺</text>
<text x="400" y="172" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#555" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">(planar, sp², empty p-orbital)</text>
<text x="470" y="150" font-size="18" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">+</text>
<text x="520" y="150" font-size="20" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">X⁻</text>
<rect x="560" y="118" width="170" height="62" fill="#eef4ff" stroke="#2c5aa0" stroke-width="1.3" rx="4"/>
<text x="645.0" y="138" font-size="12.5" text-anchor="middle" font-weight="bold" font-style="normal" fill="#2c5aa0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Rate law (step 1)</text>
<text x="645.0" y="160" font-size="15" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Rate = k[RX]</text>
<circle cx="60" cy="250" r="11" fill="#2c5aa0"/>
<text x="60" y="254.5" font-size="12" text-anchor="middle" font-weight="bold" font-style="normal" fill="#ffffff" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">2</text>
<text x="78" y="255" font-size="13.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Fast: nucleophile attacks the planar carbocation from either face</text>
<text x="160" y="300" font-size="20" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">R⁺</text>
<text x="220" y="300" font-size="18" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">+</text>
<text x="270" y="300" font-size="20" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Nu⁻</text>
<path d="M295,288 Q317.5,253.0 340,268" fill="none" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow-curve)"/>
<line x1="340" y1="300" x2="450" y2="300" stroke="#000" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="520" y="300" font-size="20" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">R–Nu</text>
<text x="340" y="340" font-size="12.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#333" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Attack from both faces of the flat cation → racemisation at a stereocentre</text>
<rect x="60" y="385" width="640" height="80" fill="#fbfbfb" stroke="#333" stroke-width="1.2" rx="4"/>
<text x="380.0" y="407.0" font-size="12.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Overall: two distinct steps (ionisation, then combination).</text>
<text x="380.0" y="425.5" font-size="12.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Favoured by 3° substrates (stable carbocation) and polar protic solvents.</text>
<text x="380.0" y="444.0" font-size="12.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">No inversion required — racemisation is typical.</text>
</svg>
