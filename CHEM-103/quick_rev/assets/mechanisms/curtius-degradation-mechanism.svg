<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="800" height="260" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
  </marker>
  <marker id="arrow-curve" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
  </marker>
</defs>
<text x="400.0" y="34" font-size="20" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Curtius Degradation — Acyl Azide → Amine (one carbon less)</text>
<line x1="64.0" y1="46" x2="736.0" y2="46" stroke="#222" stroke-width="1.5"/>
<text x="80" y="140" font-size="16" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">RCOCl</text>
<line x1="122" y1="140" x2="242" y2="140" stroke="#000" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="182.0" y="132" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">NaN₃</text>
<text x="300" y="140" font-size="16" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">RCON₃</text>
<text x="300" y="160" font-size="10.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#555" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">(acyl azide)</text>
<line x1="342" y1="140" x2="462" y2="140" stroke="#000" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="402.0" y="132" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Δ, –N₂</text>
<text x="520" y="140" font-size="16" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">R–N=C=O</text>
<text x="520" y="160" font-size="10.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#555" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">(isocyanate)</text>
<line x1="562" y1="140" x2="652" y2="140" stroke="#000" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="607.0" y="132" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">H₂O</text>
<text x="710" y="140" font-size="16" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">RNH₂ + CO₂</text>
<rect x="50" y="190" width="700" height="55" fill="#fbfbfb" stroke="#333" stroke-width="1.2" rx="4"/>
<text x="400.0" y="212" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Curtius and Hofmann degradation share a common ISOCYANATE (R–N=C=O)</text>
<text x="400.0" y="230" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">intermediate, formed by the same 1,2-migration of R from carbon to nitrogen.</text>
</svg>
