<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="800" height="300" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
  </marker>
  <marker id="arrow-curve" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
  </marker>
</defs>
<text x="400.0" y="34" font-size="20" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Hofmann Degradation — Amide → Amine (one carbon less)</text>
<line x1="64.0" y1="46" x2="736.0" y2="46" stroke="#222" stroke-width="1.5"/>
<text x="400.0" y="64" font-size="13" text-anchor="middle" font-weight="normal" font-style="italic" fill="#444444" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">RCONH2 + Br2 + 4NaOH → RNH2 + 2NaBr + Na2CO3 + 2H2O</text>
<text x="70" y="150" font-size="14" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">RCONH₂</text>
<line x1="112" y1="150" x2="178" y2="150" stroke="#000" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="145.0" y="142" font-size="10.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Br₂/NaOH</text>
<text x="230" y="150" font-size="14" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">RCONHBr</text>
<text x="230" y="168" font-size="10" text-anchor="middle" font-weight="normal" font-style="normal" fill="#555" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">(N-bromoamide)</text>
<line x1="272" y1="150" x2="348" y2="150" stroke="#000" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="310.0" y="142" font-size="10.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">R migrates</text>
<text x="400" y="150" font-size="14" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">R–N=C=O</text>
<text x="400" y="168" font-size="10" text-anchor="middle" font-weight="normal" font-style="normal" fill="#555" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">(isocyanate)</text>
<line x1="442" y1="150" x2="518" y2="150" stroke="#000" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="480.0" y="142" font-size="10.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">H₂O</text>
<text x="570" y="150" font-size="14" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">RNHCOOH</text>
<text x="570" y="168" font-size="10" text-anchor="middle" font-weight="normal" font-style="normal" fill="#555" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">(carbamic acid)</text>
<line x1="612" y1="150" x2="668" y2="150" stroke="#000" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="640.0" y="142" font-size="10.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">–CO₂</text>
<text x="720" y="150" font-size="14" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">RNH₂ + CO₂</text>
<rect x="40" y="220" width="720" height="55" fill="#fbfbfb" stroke="#333" stroke-width="1.2" rx="4"/>
<text x="400.0" y="242" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Note the KEY step: R migrates from carbonyl carbon to the electron-deficient</text>
<text x="400.0" y="260" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">nitrogen as bromide leaves — the product amine has ONE FEWER carbon than the amide.</text>
</svg>
