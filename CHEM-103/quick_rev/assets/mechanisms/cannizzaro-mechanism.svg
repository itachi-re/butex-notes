<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" width="820" height="560" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="820" height="560" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
  </marker>
  <marker id="arrow-curve" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
  </marker>
</defs>
<text x="410.0" y="34" font-size="20" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Cannizzaro Reaction — Full Mechanism</text>
<line x1="65.6" y1="46" x2="754.4" y2="46" stroke="#222" stroke-width="1.5"/>
<text x="410.0" y="64" font-size="13" text-anchor="middle" font-weight="normal" font-style="italic" fill="#444444" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Aldehydes with NO α-hydrogen (e.g. HCHO, C6H5CHO) + conc. NaOH/KOH</text>
<circle cx="50" cy="105" r="11" fill="#2c5aa0"/>
<text x="50" y="109.5" font-size="12" text-anchor="middle" font-weight="bold" font-style="normal" fill="#ffffff" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">1</text>
<text x="68" y="110" font-size="13.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">OH⁻ adds to the carbonyl carbon of one aldehyde molecule</text>
<text x="230" y="160" font-size="17" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">R–CHO  +  OH⁻</text>
<path d="M320,150 Q340.0,121.0 360,128" fill="none" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow-curve)"/>
<line x1="430" y1="160" x2="520" y2="160" stroke="#000" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="600" y="160" font-size="16" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">R–CH(O⁻)(OH)</text>
<text x="600" y="180" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#555" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">tetrahedral alkoxide intermediate</text>
<circle cx="50" cy="230" r="11" fill="#2c5aa0"/>
<text x="50" y="234.5" font-size="12" text-anchor="middle" font-weight="bold" font-style="normal" fill="#ffffff" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">2</text>
<text x="68" y="235" font-size="13.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">This intermediate donates a HYDRIDE (H⁻) to a 2nd aldehyde</text>
<text x="230" y="280" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">R–CH(O⁻)(OH)</text>
<text x="400" y="280" font-size="16" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">+</text>
<text x="440" y="280" font-size="16" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">R–CHO</text>
<path d="M280,272 Q370.0,238.0 460,248" fill="none" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow-curve)"/>
<line x1="510" y1="280" x2="600" y2="280" stroke="#000" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="700" y="280" font-size="16" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">R–COOH</text>
<text x="700" y="300" font-size="14" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">+  R–CH₂O⁻</text>
<circle cx="50" cy="350" r="11" fill="#2c5aa0"/>
<text x="50" y="354.5" font-size="12" text-anchor="middle" font-weight="bold" font-style="normal" fill="#ffffff" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">3</text>
<text x="68" y="355" font-size="13.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Rapid proton transfer gives the final products</text>
<text x="280" y="395" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">R–COOH  +  R–CH₂O⁻</text>
<line x1="480" y1="395" x2="570" y2="395" stroke="#000" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="700" y="395" font-size="15" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">R–COO⁻  +  R–CH₂OH</text>
<rect x="50" y="450" width="720" height="80" fill="#f5f7fb" stroke="#333" stroke-width="1.2" rx="4"/>
<text x="410.0" y="472.0" font-size="13.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Net (self oxidation–reduction / disproportionation):</text>
<text x="410.0" y="491.5" font-size="13.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">2 RCHO  +  NaOH  →  RCOONa  (carboxylate salt)  +  RCH₂OH  (alcohol)</text>
<text x="410.0" y="511.0" font-size="13.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Example: 2 HCHO + NaOH → CH₃OH + HCOONa</text>
</svg>
