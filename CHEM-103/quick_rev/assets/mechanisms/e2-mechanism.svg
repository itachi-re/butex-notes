<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="800" height="340" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
  </marker>
  <marker id="arrow-curve" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
  </marker>
</defs>
<text x="400.0" y="34" font-size="20" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">E2 Mechanism — Bimolecular Elimination</text>
<line x1="64.0" y1="46" x2="736.0" y2="46" stroke="#222" stroke-width="1.5"/>
<text x="400.0" y="64" font-size="13" text-anchor="middle" font-weight="normal" font-style="italic" fill="#444444" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">One concerted, anti-periplanar step</text>
<text x="150" y="150" font-size="18" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Base:</text>
<text x="260" y="150" font-size="18" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">H–C–C–X</text>
<path d="M190,138 Q225.0,99.0 260,110" fill="none" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow-curve)"/>
<path d="M300,138 Q320.0,99.0 340,110" fill="none" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow-curve)"/>
<path d="M350,145 Q385.0,181.5 420,168" fill="none" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow-curve)"/>
<line x1="460" y1="150" x2="560" y2="150" stroke="#000" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="630" y="150" font-size="20" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">C=C</text>
<text x="630" y="172" font-size="13" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">+ Base-H + X⁻</text>
<rect x="110" y="220" width="580" height="80" fill="#fbfbfb" stroke="#333" stroke-width="1.2" rx="4"/>
<text x="400.0" y="242.0" font-size="12.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Base removes the β-hydrogen as the C–X bond breaks</text>
<text x="400.0" y="260.5" font-size="12.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">and the π-bond forms — all in one step.</text>
<text x="400.0" y="279.0" font-size="12.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Anti-periplanar geometry preferred.  Rate = k[RX][Base]  (2nd order)</text>
</svg>
