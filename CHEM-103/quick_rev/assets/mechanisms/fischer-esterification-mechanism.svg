<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 620" width="560" height="620" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="560" height="620" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
  </marker>
  <marker id="arrow-curve" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
  </marker>
</defs>
<text x="280.0" y="34" font-size="20" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Fischer Esterification — Mechanism</text>
<line x1="44.800000000000004" y1="46" x2="515.2" y2="46" stroke="#222" stroke-width="1.5"/>
<text x="280.0" y="64" font-size="13" text-anchor="middle" font-weight="normal" font-style="italic" fill="#444444" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">RCOOH + R'OH ↔ RCOOR' + H2O, conc. H2SO4, Δ (reversible)</text>
<circle cx="40" cy="90" r="11" fill="#2c5aa0"/>
<text x="40" y="94.5" font-size="12" text-anchor="middle" font-weight="bold" font-style="normal" fill="#ffffff" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">1</text>
<text x="58" y="95" font-size="13.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Protonation of the carbonyl oxygen (H⁺ from H₂SO₄) activates the carbon</text>
<circle cx="40" cy="136" r="11" fill="#2c5aa0"/>
<text x="40" y="140.5" font-size="12" text-anchor="middle" font-weight="bold" font-style="normal" fill="#ffffff" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">2</text>
<text x="58" y="141" font-size="13.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Alcohol oxygen attacks the activated carbon → tetrahedral intermediate</text>
<circle cx="40" cy="182" r="11" fill="#2c5aa0"/>
<text x="40" y="186.5" font-size="12" text-anchor="middle" font-weight="bold" font-style="normal" fill="#ffffff" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">3</text>
<text x="58" y="187" font-size="13.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Proton transfer between the two oxygens</text>
<circle cx="40" cy="228" r="11" fill="#2c5aa0"/>
<text x="40" y="232.5" font-size="12" text-anchor="middle" font-weight="bold" font-style="normal" fill="#ffffff" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">4</text>
<text x="58" y="233" font-size="13.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Loss of water from the tetrahedral intermediate (elimination)</text>
<circle cx="40" cy="274" r="11" fill="#2c5aa0"/>
<text x="40" y="278.5" font-size="12" text-anchor="middle" font-weight="bold" font-style="normal" fill="#ffffff" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">5</text>
<text x="58" y="279" font-size="13.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Deprotonation gives the neutral ester</text>
<line x1="280" y1="300" x2="280" y2="340" stroke="#000" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80" y="350" width="400" height="90" fill="#fbfbfb" stroke="#333" stroke-width="1.2" rx="4"/>
<text x="280.0" y="366" font-size="12" text-anchor="middle" font-weight="bold" font-style="normal" fill="#555555" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">INTERMEDIATE PATHWAY (SCHEMATIC)</text>
<text x="280.0" y="384" font-size="13" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">R–C(=OH⁺)–OH  +  R'OH  →  tetrahedral intermediate</text>
<text x="280.0" y="403" font-size="13" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">→  –H₂O  →  R–C(=OH⁺)–OR'  →  –H⁺  →  R–COOR'</text>
<rect x="80" y="460" width="400" height="60" fill="#eef4ff" stroke="#333" stroke-width="1.2" rx="4"/>
<text x="280.0" y="482" font-size="14" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Overall equilibrium:</text>
<text x="280.0" y="502" font-size="14" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">RCOOH + R'OH  ↔(H2SO4, Δ)  RCOOR' + H2O</text>
<text x="280" y="560" font-size="12.5" text-anchor="middle" font-weight="normal" font-style="italic" fill="#555" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Driven forward by excess alcohol or removing water</text>
</svg>
