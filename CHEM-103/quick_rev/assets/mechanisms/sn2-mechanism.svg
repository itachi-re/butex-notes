<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="820" height="400" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
  </marker>
  <marker id="arrow-curve" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
  </marker>
</defs>
<text x="410.0" y="34" font-size="20" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">SN2 Mechanism — Bimolecular Nucleophilic Substitution</text>
<line x1="65.6" y1="46" x2="754.4" y2="46" stroke="#222" stroke-width="1.5"/>
<text x="410.0" y="64" font-size="13" text-anchor="middle" font-weight="normal" font-style="italic" fill="#444444" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">One concerted step; back-side attack with inversion</text>
<text x="90" y="160" font-size="20" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Nu⁻</text>
<text x="150" y="160" font-size="18" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">+</text>
<text x="230" y="160" font-size="20" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">R–X</text>
<path d="M105,148 Q187.5,89.0 270,120" fill="none" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow-curve)"/>
<path d="M255,160 Q282.5,200.0 310,190" fill="none" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow-curve)"/>
<line x1="300" y1="160" x2="400" y2="160" stroke="#000" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="410" y="110" width="190" height="100" fill="#fbfbfb" stroke="#333" stroke-width="1.2" rx="4"/>
<text x="505.0" y="126" font-size="12" text-anchor="middle" font-weight="bold" font-style="normal" fill="#555555" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">TRANSITION STATE</text>
<text x="505.0" y="144" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">[Nu···C···X]‡</text>
<text x="505.0" y="165" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">pentacoordinate</text>
<text x="505.0" y="186" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">transition state</text>
<line x1="610" y1="160" x2="700" y2="160" stroke="#000" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="730" y="160" font-size="20" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Nu–R</text>
<text x="730" y="182" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">+ X⁻</text>
<text x="730" y="202" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#555" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">(inverted)</text>
<rect x="90" y="250" width="220" height="62" fill="#eef4ff" stroke="#2c5aa0" stroke-width="1.3" rx="4"/>
<text x="200.0" y="270" font-size="12.5" text-anchor="middle" font-weight="bold" font-style="normal" fill="#2c5aa0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Rate law</text>
<text x="200.0" y="292" font-size="15" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Rate = k[RX][Nu⁻]</text>
<rect x="340" y="250" width="460" height="100" fill="#f5f7fb" stroke="#333" stroke-width="1.2" rx="4"/>
<text x="570.0" y="272.0" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">• Nucleophile attacks from the face opposite the leaving group</text>
<text x="570.0" y="289.5" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">• C–Nu bond forms as C–X bond breaks — simultaneously</text>
<text x="570.0" y="307.0" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">• Single transition state → second order overall</text>
<text x="570.0" y="324.5" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">• Result: Walden inversion (configuration is inverted)</text>
</svg>
