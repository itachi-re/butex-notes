<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 280" width="460" height="280" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="460" height="280" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
  </marker>
  <marker id="arrow-curve" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
  </marker>
</defs>
<text x="230.0" y="34" font-size="15.87396849212303" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Carboxylic Acid Strength (Inductive Effect)</text>
<line x1="36.800000000000004" y1="46" x2="423.20000000000005" y2="46" stroke="#222" stroke-width="1.5"/>
<text x="230.0" y="110" font-size="15" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">ClCH₂COOH  &gt;  CH₃COOH  &gt;  C₂H₅COOH</text>
<text x="230.0" y="135" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#555" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">(pKa: 2.86)      (pKa: 4.76)     (pKa: 4.87)</text>
<rect x="20" y="160" width="420" height="95" fill="#f5f7fb" stroke="#333" stroke-width="1.2" rx="4"/>
<text x="230.0" y="182" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Cl is strongly –I (withdraws e⁻) → stabilises carboxylate</text>
<text x="230.0" y="199" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">→ STRONGEST acid.  CH₃/C₂H₅ are +I (donate e⁻) →</text>
<text x="230.0" y="216" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">destabilise carboxylate → weaker acid. Larger alkyl (ethyl)</text>
<text x="230.0" y="233" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">donates more → propionic acid is the WEAKEST of the three.</text>
</svg>
