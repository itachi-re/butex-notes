<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 380" width="460" height="380" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="460" height="380" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
  </marker>
  <marker id="arrow-curve" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
  </marker>
</defs>
<text x="230.0" y="34" font-size="18.44812554489974" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Zwitterion and Isoelectric Point (pI)</text>
<line x1="36.800000000000004" y1="46" x2="423.20000000000005" y2="46" stroke="#222" stroke-width="1.5"/>
<text x="90" y="105" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#555" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Cationic</text>
<text x="90" y="120" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#555" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">(low pH)</text>
<text x="90" y="150" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">H₃N⁺–CHR–COOH</text>
<line x1="180" y1="150" x2="250" y2="150" stroke="#000" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="215.0" y="142" font-size="10" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">–H⁺</text>
<text x="340" y="105" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#2c5aa0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Zwitterion</text>
<text x="340" y="120" font-size="10" text-anchor="middle" font-weight="normal" font-style="normal" fill="#2c5aa0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">(pH = pI, net charge 0)</text>
<text x="340" y="150" font-size="12" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">H₃N⁺–CHR–COO⁻</text>
<line x1="340" y1="175" x2="340" y2="220" stroke="#000" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="350" y="193.5" font-size="10" text-anchor="start" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">–H⁺</text>
<text x="340" y="245" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">H₂N–CHR–COO⁻</text>
<text x="340" y="265" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#555" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Anionic (high pH)</text>
<rect x="30" y="295" width="400" height="65" fill="#eef4ff" stroke="#333" stroke-width="1.2" rx="4"/>
<text x="230.0" y="317.0" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Isoelectric point: pI = (pKa₁ + pKa₂) / 2</text>
<text x="230.0" y="334.5" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">(average of –COOH and –NH₃⁺ pKa values,</text>
<text x="230.0" y="352.0" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">simple neutral amino acid)</text>
</svg>
