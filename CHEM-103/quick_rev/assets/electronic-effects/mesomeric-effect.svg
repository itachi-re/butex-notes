<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" width="460" height="320" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="460" height="320" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
  </marker>
  <marker id="arrow-curve" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
  </marker>
</defs>
<text x="230.0" y="34" font-size="20" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Mesomeric (Resonance) Effect</text>
<line x1="36.800000000000004" y1="46" x2="423.20000000000005" y2="46" stroke="#222" stroke-width="1.5"/>
<text x="230.0" y="64" font-size="13" text-anchor="middle" font-weight="normal" font-style="italic" fill="#444444" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Permanent delocalisation through a conjugated system</text>
<text x="230.0" y="130" font-size="17" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">CH₂=CH–OCH₃</text>
<line x1="120" y1="164" x2="340" y2="164" stroke="#000" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="340" y1="176" x2="120" y2="176" stroke="#000" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="230.0" y="210" font-size="16" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">⁻CH₂–CH=O⁺HCH₃</text>
<text x="230.0" y="235" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#555" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">(+M example: lone pair on O donated into the π system)</text>
<rect x="20" y="255" width="420" height="55" fill="#fbfbfb" stroke="#333" stroke-width="1.2" rx="4"/>
<text x="230.0" y="277" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Denoted +M (electron-donating: –NH₂,–OH,–OR, halogens)</text>
<text x="230.0" y="294" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">or –M (electron-withdrawing: –NO₂,–CHO,–COOH,–CN).</text>
</svg>
