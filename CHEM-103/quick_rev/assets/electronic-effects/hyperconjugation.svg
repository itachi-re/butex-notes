<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" width="440" height="300" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="440" height="300" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
  </marker>
  <marker id="arrow-curve" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
  </marker>
</defs>
<text x="220.0" y="34" font-size="20" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Hyperconjugation</text>
<line x1="35.2" y1="46" x2="404.8" y2="46" stroke="#222" stroke-width="1.5"/>
<text x="220.0" y="64" font-size="13" text-anchor="middle" font-weight="normal" font-style="italic" fill="#444444" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">σ(C–H) → empty p-orbital; “no-bond resonance”</text>
<text x="220.0" y="140" font-size="17" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">CH₃–CH₂⁺</text>
<line x1="100" y1="174" x2="340" y2="174" stroke="#000" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="340" y1="186" x2="100" y2="186" stroke="#000" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="220.0" y="220" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">CH₂=CH₂ ··· H⁺</text>
<rect x="15" y="240" width="410" height="55" fill="#fbfbfb" stroke="#333" stroke-width="1.2" rx="4"/>
<text x="220.0" y="262" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">More α-hydrogens → more hyperconjugation → greater</text>
<text x="220.0" y="279" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">cation/alkene stabilisation (Baker–Nathan effect).</text>
</svg>
