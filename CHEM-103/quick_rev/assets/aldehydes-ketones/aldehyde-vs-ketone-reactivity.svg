<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 330" width="460" height="330" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="460" height="330" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
  </marker>
  <marker id="arrow-curve" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
  </marker>
</defs>
<text x="230.0" y="34" font-size="15.513196480938415" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Why Aldehydes Are More Reactive Than Ketones</text>
<line x1="36.800000000000004" y1="46" x2="423.20000000000005" y2="46" stroke="#222" stroke-width="1.5"/>
<rect x="30" y="80" width="190" height="150" fill="#fbfbfb" stroke="#333" stroke-width="1.2" rx="4"/>
<text x="125.0" y="96" font-size="12" text-anchor="middle" font-weight="bold" font-style="normal" fill="#555555" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">ALDEHYDE</text>
<text x="125.0" y="114" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">R–CHO</text>
<text x="125.0" y="132" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif"></text>
<text x="125.0" y="150" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">One H + one alkyl group</text>
<text x="125.0" y="168" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">on carbonyl carbon:</text>
<text x="125.0" y="186" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">less steric hindrance,</text>
<text x="125.0" y="204" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">more electrophilic C</text>
<rect x="240" y="80" width="190" height="150" fill="#fbfbfb" stroke="#333" stroke-width="1.2" rx="4"/>
<text x="335.0" y="96" font-size="12" text-anchor="middle" font-weight="bold" font-style="normal" fill="#555555" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">KETONE</text>
<text x="335.0" y="114" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">R–CO–R'</text>
<text x="335.0" y="132" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif"></text>
<text x="335.0" y="150" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Two alkyl groups:</text>
<text x="335.0" y="168" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">+I donation lowers</text>
<text x="335.0" y="186" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">electrophilicity;</text>
<text x="335.0" y="204" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">more steric hindrance</text>
<text x="230.0" y="260" font-size="12.5" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Result: nucleophiles attack the aldehyde carbonyl faster</text>
<text x="230.0" y="280" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#555" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">(less hindrance + more δ+ on carbon)</text>
</svg>
