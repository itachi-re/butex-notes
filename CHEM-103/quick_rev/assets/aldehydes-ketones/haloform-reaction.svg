  </marker>
</defs>
<text x="230.0" y="34" font-size="20" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Haloform (Iodoform) Reaction</text>
<line x1="36.800000000000004" y1="46" x2="423.20000000000005" y2="46" stroke="#222" stroke-width="1.5"/>
<text x="90" y="110" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">CH₃COCH₃</text>
<line x1="180" y1="110" x2="280" y2="110" stroke="#000" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="230.0" y="102" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">3 I₂ / 4 NaOH</text>
<text x="340" y="100" font-size="15" text-anchor="middle" font-weight="bold" font-style="normal" fill="#8a4b00" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">CHI₃↓</text>
<text x="340" y="120" font-size="10.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#555" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">(yellow ppt.)</text>
<text x="340" y="140" font-size="13" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">+ CH₃COONa</text>
<rect x="20" y="165" width="420" height="55" fill="#fbfbfb" stroke="#333" stroke-width="1.2" rx="4"/>
<text x="230.0" y="187" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Diagnostic for CH₃CO– or CH₃CH(OH)– groups</text>
<text x="230.0" y="204" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">(methyl ketones / 2° alcohols with a terminal CH₃).</text>
