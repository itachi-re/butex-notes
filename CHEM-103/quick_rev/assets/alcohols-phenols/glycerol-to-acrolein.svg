<text x="200.0" y="34" font-size="17.98631476050831" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Glycerol → Acrolein (Dehydration)</text>
