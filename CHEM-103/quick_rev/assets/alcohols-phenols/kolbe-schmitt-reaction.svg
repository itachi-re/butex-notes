<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 220" width="460" height="220" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="460" height="220" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
  </marker>
  <marker id="arrow-curve" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
  </marker>
</defs>
<text x="230.0" y="34" font-size="20" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Kolbe–Schmitt Reaction</text>
<line x1="36.800000000000004" y1="46" x2="423.20000000000005" y2="46" stroke="#222" stroke-width="1.5"/>
<text x="80" y="110" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">C₆H₅ONa</text>
<line x1="160" y1="110" x2="260" y2="110" stroke="#000" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="210.0" y="102" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">CO₂</text>
<text x="210.0" y="128" font-size="11" text-anchor="middle" font-weight="normal" font-style="italic" fill="#333333" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">125°C, 4–7 atm</text>
<text x="330" y="110" font-size="14" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">salicylate</text>
<line x1="360" y1="110" x2="400" y2="110" stroke="#000" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="380.0" y="102" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">H⁺</text>
<text x="430" y="110" font-size="13" text-anchor="end" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">→ salicylic acid</text>
</svg>
