<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" width="540" height="360" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="540" height="360" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
  </marker>
  <marker id="arrow-curve" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
  </marker>
</defs>
<text x="270.0" y="34" font-size="20" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Lucas Test — 1° / 2° / 3° Alcohol</text>
<line x1="43.2" y1="46" x2="496.8" y2="46" stroke="#222" stroke-width="1.5"/>
<text x="270.0" y="64" font-size="13" text-anchor="middle" font-weight="normal" font-style="italic" fill="#444444" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">ZnCl2 / conc. HCl (Lucas reagent)</text>
<text x="90" y="110" font-size="15" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Alcohol</text>
<text x="310.0" y="110" font-size="13" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">+  Lucas reagent (ZnCl₂/HCl)</text>
<text x="60" y="160" font-size="15" text-anchor="middle" font-weight="bold" font-style="normal" fill="#2c5aa0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">1°</text>
<line x1="90" y1="156" x2="160" y2="156" stroke="#000" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="175" y="160" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">No turbidity in the cold; needs heating</text>
<text x="60" y="200" font-size="15" text-anchor="middle" font-weight="bold" font-style="normal" fill="#2c5aa0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">2°</text>
<line x1="90" y1="196" x2="160" y2="196" stroke="#000" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="175" y="200" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Turbidity appears in 5–10 minutes</text>
<text x="60" y="240" font-size="15" text-anchor="middle" font-weight="bold" font-style="normal" fill="#2c5aa0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">3°</text>
<line x1="90" y1="236" x2="160" y2="236" stroke="#000" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="175" y="240" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Turbidity IMMEDIATELY</text>
<rect x="30" y="280" width="480" height="55" fill="#fbfbfb" stroke="#333" stroke-width="1.2" rx="4"/>
<text x="270.0" y="302.0" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Mechanism: relative rate reflects carbocation stability</text>
<text x="270.0" y="319.5" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">(SN1-type) — 3° &gt; 2° &gt; 1°.</text>
</svg>
