<text x="280.0" y="34" font-size="20" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Phenol Acidity — Phenoxide Resonance</text>
<line x1="44.800000000000004" y1="46" x2="515.2" y2="46" stroke="#222" stroke-width="1.5"/>
<text x="280.0" y="120" font-size="14" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">C₆H₅O⁻  ↔  (charge delocalised into ring: o,p positions)</text>
<rect x="20" y="150" width="520" height="85" fill="#f5f7fb" stroke="#333" stroke-width="1.2" rx="4"/>
<text x="280.0" y="172.0" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Loss of the phenolic H⁺ gives a phenoxide ion whose negative charge</text>
<text x="280.0" y="189.5" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">is delocalised by resonance into the aromatic ring — this stabilisation</text>
<text x="280.0" y="207.0" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">is NOT possible for a simple alkoxide (ROH), so phenol (pKa ≈ 10) is</text>
<text x="280.0" y="224.5" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">far more acidic than a simple alcohol (pKa ≈ 16–18).</text>
</svg>
