<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 270" width="320" height="270" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="320" height="270" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
  </marker>
  <marker id="arrow-curve" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
  </marker>
</defs>
<text x="160.0" y="34" font-size="16.958525345622125" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Alcohol Oxidation — 1°/2°/3°</text>
<line x1="25.6" y1="46" x2="294.40000000000003" y2="46" stroke="#222" stroke-width="1.5"/>
<text x="60" y="100" font-size="14" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">1° ROH</text>
<line x1="140" y1="100" x2="220" y2="100" stroke="#000" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="180.0" y="92" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">[O]</text>
<text x="260" y="100" font-size="14" text-anchor="start" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">RCHO</text>
<text x="60" y="130" font-size="11" text-anchor="start" font-weight="normal" font-style="normal" fill="#555" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">→ further [O] → RCOOH</text>
<text x="60" y="165" font-size="14" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">2° ROH</text>
<line x1="140" y1="165" x2="220" y2="165" stroke="#000" stroke-width="1.8" marker-end="url(#arrow)"/>
