<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 270" width="300" height="270" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="300" height="270" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
  </marker>
  <marker id="arrow-curve" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
  </marker>
</defs>
<text x="150.0" y="34" font-size="20" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Reformatsky Reaction</text>
<line x1="24.0" y1="46" x2="276.0" y2="46" stroke="#222" stroke-width="1.5"/>
<text x="150.0" y="100" font-size="13.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">RCHO + BrCH₂COOC₂H₅</text>
<line x1="150.0" y1="120" x2="150.0" y2="175" stroke="#000" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="160.0" y="143.5" font-size="13" text-anchor="start" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Zn</text>
<text x="150.0" y="200" font-size="13" text-anchor="middle" font-weight="bold" font-style="normal" fill="#111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">RCH(OH)CH₂COOC₂H₅</text>
<text x="150.0" y="218" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#555" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">β-hydroxy ester</text>
<rect x="15" y="232" width="270" height="30" fill="#fbfbfb" stroke="#333" stroke-width="1.2" rx="4"/>
<text x="150.0" y="254.0" font-size="10.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Organozinc analogue of the aldol reaction</text>
</svg>
