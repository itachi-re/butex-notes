<text x="200.0" y="350.0" fill="#1b1b1b" font-size="18" text-anchor="middle">E = IR + L dI/dt</text>
<text x="620.0" y="350.0" fill="#1b1b1b" font-size="18" text-anchor="middle">0 = IR + L dI/dt</text>
