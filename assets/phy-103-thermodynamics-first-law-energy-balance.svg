<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="First law of thermodynamics: heat Q supplied to a gas goes into internal energy and work done by the gas" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>First law of thermodynamics: heat Q supplied to a gas goes into internal energy and work done by the gas</title>
<defs>
<marker id="a222222" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker>
<marker id="s222222" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#222222"/></marker>
<marker id="a1f5fbf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker>
<marker id="s1f5fbf" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f5fbf"/></marker>
<marker id="ac0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
<marker id="sc0392b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker>
<marker id="a2e7d32" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
<marker id="s2e7d32" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e7d32"/></marker>
<marker id="a777777" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#777777"/></marker>
<marker id="s777777" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#777777"/></marker>
</defs>
<rect x="0" y="0" width="760" height="420" fill="#ffffff"/>
<text x="180.9" y="30.0" font-size="18" fill="#222222" font-weight="bold" font-style="normal"><tspan>First law: energy balance of a gas in a cylinder</tspan></text>
<rect x="282" y="188" width="156" height="130" rx="0" fill="#1f5fbf" fill-opacity="0.1" stroke="#222222" stroke-width="0"/>
<line x1="280.0" y1="120.0" x2="280.0" y2="320.0" stroke="#222222" stroke-width="4" stroke-linecap="round"/>
<line x1="440.0" y1="120.0" x2="440.0" y2="320.0" stroke="#222222" stroke-width="4" stroke-linecap="round"/>
<line x1="278.0" y1="320.0" x2="442.0" y2="320.0" stroke="#222222" stroke-width="4" stroke-linecap="round"/>
<rect x="284" y="168" width="152" height="18" rx="2" fill="#777777" fill-opacity="0.35" stroke="#222222" stroke-width="2"/>
<line x1="360.0" y1="168.0" x2="360.0" y2="128.0" stroke="#222222" stroke-width="4" stroke-linecap="round"/>
<text x="345.4" y="258.0" font-size="17" fill="#222222" font-weight="bold" font-style="normal"><tspan>gas</tspan></text>
<text x="302.9" y="282.0" font-size="15" fill="#222222" font-weight="normal" font-style="normal"><tspan>internal energy U</tspan></text>
<line x1="360.0" y1="122.0" x2="360.0" y2="66.0" stroke="#1f5fbf" stroke-width="4" marker-end="url(#a1f5fbf)" stroke-linecap="round"/>
<text x="374.0" y="84.0" font-size="15" fill="#1f5fbf" font-weight="normal" font-style="normal"><tspan>W (work done by gas)</tspan></text>
<line x1="360.0" y1="390.0" x2="360.0" y2="330.0" stroke="#c0392b" stroke-width="4" marker-end="url(#ac0392b)" stroke-linecap="round"/>
<text x="374.0" y="382.0" font-size="15" fill="#c0392b" font-weight="normal" font-style="normal"><tspan>Q (heat supplied)</tspan></text>
<text x="40.0" y="190.0" font-size="21" fill="#222222" font-weight="bold" font-style="normal"><tspan>ΔU = Q − W</tspan></text>
<text x="40.0" y="226.0" font-size="17" fill="#222222" font-weight="normal" font-style="normal"><tspan>dQ = dU + P dV</tspan></text>
<text x="40.0" y="262.0" font-size="15" fill="#777777" font-weight="normal" font-style="normal"><tspan>U is a state function</tspan></text>
<text x="490.0" y="170.0" font-size="15" fill="#222222" font-weight="normal" font-style="normal"><tspan>Q &gt; 0 : heat absorbed by gas</tspan></text>
<text x="490.0" y="198.0" font-size="15" fill="#222222" font-weight="normal" font-style="normal"><tspan>W &gt; 0 : work done by gas</tspan></text>
<text x="490.0" y="226.0" font-size="15" fill="#222222" font-weight="normal" font-style="normal"><tspan>ΔU &gt; 0 : gas gets hotter</tspan></text>
<text x="490.0" y="262.0" font-size="15" fill="#222222" font-weight="normal" font-style="normal"><tspan>Isolated system: Q = W = 0,</tspan></text>
<text x="490.0" y="282.0" font-size="15" fill="#222222" font-weight="normal" font-style="normal"><tspan>so U stays constant.</tspan></text>
</svg>
