<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 335" width="800" height="335" role="img" aria-label="Slow versus rapid cooling of austenite schematic" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Slow versus rapid cooling of austenite schematic</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#333" stroke-width="2"/></pattern><pattern id="hatch2" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)"><line x1="0" y1="0" x2="0" y2="5" stroke="#e67e22" stroke-width="2"/></pattern></defs><rect x="0.5" y="0.5" width="799" height="334" fill="#ffffff" stroke="#cfd4da"/><text x="400.0" y="26.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2933" font-family="Helvetica, Arial, sans-serif">From austenite: slow cooling vs rapid cooling (schematic, not to scale)</text><rect x="15.0" y="45.0" width="375.0" height="245.0" rx="6" fill="#f6fbf6" stroke="#a5d6a7" stroke-width="1.2"/><rect x="410.0" y="45.0" width="375.0" height="245.0" rx="6" fill="#fdf5f5" stroke="#e6a5a5" stroke-width="1.2"/><text x="202.0" y="68.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#2e7d32" font-family="Helvetica, Arial, sans-serif">Slow cooling: time for diffusion</text><text x="597.0" y="68.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#c0392b" font-family="Helvetica, Arial, sans-serif">Rapid cooling: no time for diffusion</text><rect x="40.0" y="110.0" width="80.0" height="80.0" rx="6" fill="#fff8e1" stroke="#c9a227" stroke-width="1.2"/><circle cx="60.0" cy="130.0" r="7" fill="#9fb4c9" stroke="#334" stroke-width="1.2"/><circle cx="100.0" cy="130.0" r="7" fill="#9fb4c9" stroke="#334" stroke-wid