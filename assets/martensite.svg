e cx="273.0" cy="150.0" r="7" fill="#9fb4c9" stroke="#334" stroke-width="1.2"/><text x="273.0" y="208.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f2933" font-family="Helvetica, Arial, sans-serif">BCC ferrite (+ cementite)</text><text x="202.0" y="232.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#5f6b7a" font-family="Helvetica, Arial, sans-serif">gamma to alpha is time-dependent</text><text x="202.0" y="250.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#5f6b7a" font-family="Helvetica, Arial, sans-serif">soft product, equilibrium-like</text><line x1="523.0" y1="150.0" x2="600.0" y2="150.0" stroke="#444" stroke-width="1.5" marker-end="url(#ar)"/><text x="561.0" y="132.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#5f6b7a" font-family="Helvetica, Arial, sans-serif">carbon trapped;</text><text x="561.0" y="146.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#5f6b7a" font-family="Helvetica, Arial, sans-serif">diffusionless</text><rect x="630.0" y="112.0" width="76.0" height="76.0" rx="0" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/><rect x="630.0" y="100.0" width="76.0" height="88.0" rx="0" fill="#ffffff" stroke="#333" stroke-width="1.6"/><circle cx="630.0" cy="100.0" r="7" fill="#9fb4c9" stroke="#334" stroke-width="1.2"/><circle cx="706.0" cy="100.0" r="7" fill="#9fb4c9" stroke="#334" stroke-width="1.2"/><circle cx="630.0" cy="188.0" r="7" fill="#9fb4c9" stroke="#334" stroke-width="1.2"/><circle cx="706.0" cy="188.0" r="7" fill="#9fb4c9" stroke="#334" stroke-width="1.2"/><circle cx="668.0" cy="144.0" r="7" fill="#9fb4c9" stroke="#334" stroke-width="1.2"/><circle cx="668.0" cy="144.0" r="5" fill="#e74c3c" stroke="#7b241c" stroke-width="1.2"/><text x="668.0" y="208.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f2933" font-family="Helvetica, Arial, sans-serif">martensite: BCT, a = b &lt; c</text><text x="668.0" y="96.0" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#5f6b7a" font-family="Helvetica, Arial, sans-serif">c expanded</text><text x="597.0" y="232.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#5f6b7a" font-family="Helvetica, Arial, sans-serif">supersaturated solid solution of carbon</text><text x="597.0" y="250.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#5f6b7a" font-family="Helvetica, Arial, sans-serif">distorted lattice = very hard, brittle, high stress</text><rect x="230.0" y="305.0" width="12.0" height="12.0" rx="6" fill="#9fb4c9" stroke="#334" stroke-width="1.2"/><text x="248.0" y="316.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1f2933" font-family="Helvetica, Arial, sans-serif">iron atom</text><rect x="330.0" y="305.0" width="12.0" height="12.0" rx="6" fill="#e74c3c" stroke="#7b241c" stroke-width="1.2"/><text x="348.0" y="316.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1f2933" font-family="Helvetica, Arial, sans-serif">carbon atom</text><text x="560.0" y="316.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#5f6b7a" font-family="Helvetica, Arial, sans-serif">Positions of atoms are illustrative only.</text></svg>