<svg xmlns="http://www.w3.org/2000/svg" width="860" height="225" viewBox="0 0 860 225" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Reading from input.txt and writing to output.txt in C" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Reading from input.txt and writing to output.txt in C</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker></defs>
<rect x="0.5" y="0.5" width="859" height="224" fill="#ffffff" stroke="#cfd8dc" rx="8"/>
<text x="430" y="29.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#1a1a1a" ><tspan x="430" dy="0">File handling: read two numbers, write their sum</tspan></text><rect x="25" y="75" width="150" height="70" fill="#eceff1" stroke="#607d8b" stroke-width="1.5"/><text x="100.0" y="106.15" font-size="14" text-anchor="middle" font-weight="normal" fill="#1a1a1a" font-family="Consolas, Menlo, monospace"><tspan x="100.0" dy="0">input.txt</tspan><tspan x="100.0" dy="17.5">10 20</tspan></text><rect x="355" y="75" width="150" height="70" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/><text x="430.0" y="98.3" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="430.0" dy="0">Program memory</tspan><tspan x="430.0" dy="16.25">a = 10, b = 20</tspan><tspan x="430.0" dy="16.25">sum = 30</tspan></text><rect x="685" y="75" width="150" height="70" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="760.0" y="106.15" font-size="14" text-anchor="middle" font-weight="normal" fill="#1a1a1a" font-family="Consolas, Menlo, monospace"><tspan x="760.0" dy="0">output.txt</tspan><tspan x="760.0" dy="17.5">30</tspan></text><polyline points="177,110 353,110" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><text x="265" y="102.2" font-size="12" text-anchor="middle" font-weight="bold" fill="#b71c1c" ><tspan x="265" dy="0">fscanf(fp1, …)</tspan></text><polyline points="507,110 683,110" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><text x="595" y="102.2" font-size="12" text-anchor="middle" font-weight="bold" fill="#b71c1c" ><tspan x="595" dy="0">fprintf(fp2, …)</tspan></text><text x="100" y="173.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#1a1a1a" font-family="Consolas, Menlo, monospace"><tspan x="100" dy="0">fp1 = fopen("input.txt","r")</tspan></text><text x="760" y="173.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#1a1a1a" font-family="Consolas, Menlo, monospace"><tspan x="760" dy="0">fp2 = fopen("output.txt","w")</tspan></text><text x="100" y="193.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#1a1a1a" font-family="Consolas, Menlo, monospace"><tspan x="100" dy="0">fclose(fp1)</tspan></text><text x="760" y="193.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#1a1a1a" font-family="Consolas, Menlo, monospace"><tspan x="760" dy="0">fclose(fp2)</tspan></text>
</svg>