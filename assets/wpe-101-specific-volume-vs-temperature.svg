<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">Specific volume versus temperature</title>
<desc id="d">Specific volume against temperature for an amorphous polymer showing a change in slope at Tg, a crystalline polymer showing a sharp jump at Tm, and a semi-crystalline polymer showing both.</desc>
<rect x="0" y="0" width="800" height="520" fill="#ffffff"/>
<text xml:space="preserve" x="400.0" y="32.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="22.0" font-weight="bold" fill="#111111" text-anchor="middle">Specific volume vs temperature: Tg and Tm</text>
<line x1="100.0" y1="440.0" x2="732.8" y2="440.0" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
<polygon points="740.0,440.0 731.6,443.3 731.6,436.7" fill="#111111" stroke="#111111" stroke-width="1" stroke-linejoin="round"/>
<line x1="100.0" y1="440.0" x2="100.0" y2="87.2" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
<polygon points="100.0,80.0 103.3,88.4 96.7,88.4" fill="#111111" stroke="#111111" stroke-width="1" stroke-linejoin="round"/>
<text xml:space="preserve" x="420.0" y="476.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14.0" font-weight="normal" fill="#111111" text-anchor="middle">Temperature, T  →</text>
<text xml:space="preserve" x="60.0" y="260.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14.0" font-weight="normal" fill="#111111" text-anchor="middle" transform="rotate(-90 60.0 260.0)">Specific volume, v</text>
<path d="M130.0,345.0 L280.0,300.0 L700.0,105.0" fill="none" stroke="#1f5fa8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M130.0,380.0 L480.0,345.0 L480,206.9 L700,105" fill="none" stroke="#2a7d4f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 5"/>
<path d="M130.0,365.0 L280.0,335.0 L480.0,255.0 L480.0,206.9 L700.0,105.0" fill="none" stroke="#d9620f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 5"/>
<line x1="280.0" y1="440.0" x2="280.0" y2="90.0" stroke="#888888" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/>
<text xml:space="preserve" x="272.5" y="460.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15.0" font-weight="normal" fill="#111111" text-anchor="start">T</text>
<text xml:space="preserve" x="281.7" y="463.3" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10.5" font-weight="normal" fill="#111111" text-anchor="start">g</text>
<line x1="480.0" y1="440.0" x2="480.0" y2="90.0" stroke="#888888" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/>
<text xml:space="preserve" x="471.0" y="460.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15.0" font-weight="normal" fill="#111111" text-anchor="start">T</text>
<text xml:space="preserve" x="480.2" y="463.3" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10.5" font-weight="normal" fill="#111111" text-anchor="start">m</text>
<text xml:space="preserve" x="150.0" y="130.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14.0" font-weight="bold" fill="#1f5fa8" text-anchor="start">Amorphous: slope changes at Tg</text>
<text xml:space="preserve" x="150.0" y="152.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.0" font-weight="normal" fill="#555555" text-anchor="start">(glass → rubber, no jump)</text>
<text xml:space="preserve" x="150.0" y="182.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14.0" font-weight="bold" fill="#d9620f" text-anchor="start">Semi-crystalline: Tg (kink) and Tm (smaller jump)</text>
<text xml:space="preserve" x="150.0" y="206.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14.0" font-weight="bold" fill="#2a7d4f" text-anchor="start">Highly crystalline: sharp jump at Tm only</text>
