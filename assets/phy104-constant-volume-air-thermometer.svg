<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="720" height="420" fill="#ffffff"/>
  <text x="360" y="26" font-size="18" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Constant-Volume Air (Gas) Thermometer</text>

  <!-- Gas bulb inside bath -->
  <rect x="60" y="80" width="220" height="180" rx="8" fill="#eef4fb" stroke="#2b6cb0" stroke-width="2"/>
  <text x="170" y="72" font-size="12" text-anchor="middle" fill="#2b6cb0">Constant-temperature bath (θ)</text>
  <circle cx="170" cy="170" r="55" fill="#f9c784" stroke="#a67c00" stroke-width="2"/>
  <text x="170" y="175" font-size="11" text-anchor="middle" fill="#333">Gas bulb B</text>
  <text x="170" y="235" font-size="10" text-anchor="middle" fill="#333">(fixed volume V)</text>

  <!-- Capillary to manometer -->
  <line x1="225" y1="170" x2="330" y2="170" stroke="#555" stroke-width="3"/>
  <text x="278" y="160" font-size="10" text-anchor="middle" fill="#333">capillary</text>

  <!-- Mercury manometer, movable limb with reference mark -->
  <rect x="330" y="60" width="18" height="300" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.5"/>
  <rect x="420" y="90" width="18" height="270" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.5"/>
  <path d="M330 340 Q384 380 420 340" fill="none" stroke="#2b6cb0" stroke-width="1.5"/>
  <rect x="330" y="230" width="18" height="110" fill="#c0c0c0"/>
  <rect x="420" y="150" width="18" height="210" fill="#c0c0c0"/>
  <line x1="330" y1="230" x2="360" y2="230" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="300" y="228" font-size="10" text-anchor="end" fill="#c0392b">fixed mark N (constant V)</text>

  <text x="384" y="50" font-size="12" text-anchor="middle" fill="#333">Mercury manometer (movable reservoir)</text>
  <text x="384" y="395" font-size="11" text-anchor="middle" fill="#555">Reservoir raised/lowered to bring mercury back to mark N; pressure = h + atmospheric</text>

  <!-- scale -->
  <line x1="450" y1="90" x2="450" y2="360" stroke="#333" stroke-width="1"/>
  <text x="470" y="225" font-size="11" fill="#333" transform="rotate(90 470 225)">scale (h)</text>

  <!-- pressure graph -->
  <line x1="530" y1="360" x2="700" y2="360" stroke="#333" stroke-width="1.5"/>
  <line x1="530" y1="360" x2="530" y2="80" stroke="#333" stroke-width="1.5"/>
  <path d="M540 330 L680 110" stroke="#c0392b" stroke-width="2" fill="none"/>
  <text x="615" y="380" font-size="11" text-anchor="middle" fill="#333">Temperature θ (°C)</text>
  <text x="500" y="220" font-size="11" text-anchor="middle" fill="#333" transform="rotate(-90 500 220)">Pressure p</text>
  <text x="615" y="95" font-size="10" text-anchor="middle" fill="#555">extrapolated intercept → p₀, γₚ from slope</text>
</svg>
