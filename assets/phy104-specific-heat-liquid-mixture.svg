<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="700" height="400" fill="#ffffff"/>
  <text x="350" y="26" font-size="18" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Method of Mixtures — Specific Heat of a Liquid</text>

  <!-- Heated liquid vessel -->
  <rect x="70" y="90" width="130" height="90" rx="6" fill="#eef4fb" stroke="#2b6cb0" stroke-width="2"/>
  <text x="135" y="82" font-size="12" text-anchor="middle" fill="#2b6cb0">Heating bath</text>
  <ellipse cx="135" cy="140" rx="35" ry="22" fill="#f9c784" stroke="#a67c00" stroke-width="1.5"/>
  <text x="135" y="200" font-size="11" text-anchor="middle" fill="#333">Test liquid, mass m₂, θ₁</text>

  <!-- Arrow -->
  <line x1="205" y1="140" x2="330" y2="140" stroke="#333" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="265" y="130" font-size="11" text-anchor="middle" fill="#333">poured quickly</text>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>

  <!-- Calorimeter with water -->
  <rect x="340" y="120" width="160" height="150" rx="4" fill="#f5f5f5" stroke="#555" stroke-width="2"/>
  <rect x="355" y="135" width="130" height="120" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.5"/>
  <rect x="368" y="150" width="104" height="95" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="420" y="112" font-size="12" text-anchor="middle" fill="#333">Calorimeter + water, mass m₁, θ₀</text>

  <line x1="450" y1="130" x2="450" y2="240" stroke="#7a5c2e" stroke-width="3"/>
  <line x1="395" y1="130" x2="395" y2="80" stroke="#c0392b" stroke-width="3"/>
  <circle cx="395" cy="75" r="7" fill="#c0392b"/>
  <text x="395" y="65" font-size="11" text-anchor="middle" fill="#c0392b">Thermometer</text>

  <text x="420" y="290" font-size="11" text-anchor="middle" fill="#333">Equilibrium (corrected) temperature θ</text>
</svg>
