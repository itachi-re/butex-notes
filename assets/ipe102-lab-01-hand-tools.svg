<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
<style>.lbl{font-size:15px;fill:#222} .t{font-size:18px;font-weight:bold;fill:#111} .ln{stroke:#333;stroke-width:2;fill:none} .m{stroke:#333;stroke-width:1.5;fill:#eee}</style>
<rect x="0" y="0" width="900" height="620" fill="#ffffff"/>
<text x="450" y="30" text-anchor="middle" class="t">Common Workshop Hand Tools — Identification Sheet</text>

<!-- Steel Rule -->
<g transform="translate(30,60)">
<rect x="0" y="10" width="180" height="16" class="m"/>
<line x1="10" y1="10" x2="10" y2="18" class="ln"/><line x1="30" y1="10" x2="30" y2="20" class="ln"/><line x1="50" y1="10" x2="50" y2="18" class="ln"/>
<text x="90" y="45" text-anchor="middle" class="lbl">Steel Rule</text>
</g>

<!-- Scriber -->
<g transform="translate(240,60)">
<line x1="0" y1="18" x2="150" y2="18" stroke="#333" stroke-width="4"/>
<polygon points="150,14 165,18 150,22" fill="#333"/>
<text x="80" y="45" text-anchor="middle" class="lbl">Scriber</text>
</g>

<!-- Punch -->
<g transform="translate(420,60)">
<rect x="60" y="0" width="14" height="30" fill="#666"/>
<polygon points="60,30 74,30 67,50" fill="#666"/>
<text x="67" y="65" text-anchor="middle" class="lbl">Punch</text>
</g>

<!-- Hammer -->
<g transform="translate(540,55)">
<rect x="20" y="10" width="10" height="60" fill="#8a5a2b"/>
<rect x="0" y="0" width="50" height="16" fill="#555"/>
<text x="25" y="90" text-anchor="middle" class="lbl">Hammer</text>
</g>

<!-- Try Square -->
<g transform="translate(660,55)">
<rect x="0" y="0" width="10" height="70" fill="#444"/>
<rect x="0" y="0" width="70" height="10" fill="#444"/>
<text x="35" y="90" text-anchor="middle" class="lbl">Try Square</text>
</g>

<!-- Hacksaw -->
<g transform="translate(760,55)">
<rect x="0" y="30" width="100" height="6" fill="#333"/>
<rect x="0" y="0" width="6" height="60" fill="#333"/>
<rect x="94" y="0" width="6" height="60" fill="#333"/>
<rect x="-30" y="20" width="35" height="16" rx="4" fill="#8a5a2b"/>
<text x="40" y="90" text-anchor="middle" class="lbl">Hacksaw</text>
</g>

<!-- Files -->
<g transform="translate(30,170)">
<rect x="20" y="0" width="120" height="12" fill="#999"/>
<rect x="0" y="0" width="20" height="12" fill="#8a5a2b"/>
<text x="70" y="35" text-anchor="middle" class="lbl">Flat File</text>
</g>

<!-- Pliers -->
<g transform="translate(220,150)">
<line x1="10" y1="0" x2="40" y2="40" stroke="#444" stroke-width="6"/>
<line x1="70" y1="0" x2="40" y2="40" stroke="#444" stroke-width="6"/>
<line x1="40" y1="40" x2="10" y2="80" stroke="#444" stroke-width="6"/>
<line x1="40" y1="40" x2="70" y2="80" stroke="#444" stroke-width="6"/>
<circle cx="40" cy="40" r="5" fill="#222"/>
<text x="40" y="100" text-anchor="middle" class="lbl">Combination Pliers</text>
</g>

<!-- Screwdriver -->
<g transform="translate(360,150)">
<rect x="0" y="20" width="60" height="8" fill="#555"/>
<rect x="60" y="14" width="20" height="20" rx="6" fill="#c33"/>
<text x="40" y="55" text-anchor="middle" class="lbl">Screwdriver</text>
</g>

<!-- Spanner -->
<g transform="translate(480,150)">
<path d="M0,20 Q10,0 30,10 L70,10 Q90,0 100,20 Q90,40 70,30 L30,30 Q10,40 0,20 Z" fill="none" stroke="#333" stroke-width="4"/>
<text x="50" y="55" text-anchor="middle" class="lbl">Open-end Spanner</text>
</g>

<!-- Bench Vice -->
<g transform="translate(650,140)">
<rect x="0" y="40" width="120" height="20" fill="#666"/>
<rect x="0" y="0" width="16" height="40" fill="#888"/>
<rect x="90" y="0" width="16" height="40" fill="#888"/>
<rect x="40" y="0" width="16" height="40" fill="#aaa"/>
<line x1="60" y1="20" x2="90" y2="20" stroke="#333" stroke-width="4"/>
<circle cx="95" cy="20" r="6" fill="#333"/>
<text x="60" y="80" text-anchor="middle" class="lbl">Bench Vice (plan)</text>
</g>

<!-- Carpentry: Chisel & Mallet -->
<g transform="translate(30,270)">
<rect x="0" y="10" width="70" height="8" fill="#8a5a2b"/>
<polygon points="70,6 90,14 70,22" fill="#999"/>
<text x="45" y="40" text-anchor="middle" class="lbl">Wood Chisel</text>
</g>
<g transform="translate(180,260)">
<rect x="10" y="0" width="10" height="40" fill="#8a5a2b"/>
<rect x="-10" y="35" width="50" height="20" fill="#a3723d"/>
<text x="15" y="75" text-anchor="middle" class="lbl">Mallet</text>
</g>

<!-- Carpentry saw -->
<g transform="translate(300,270)">
<path d="M0,20 L100,0 L100,30 Z" fill="#ccc" stroke="#333"/>
<rect x="-40" y="5" width="40" height="18" rx="6" fill="#8a5a2b"/>
<text x="30" y="55" text-anchor="middle" class="lbl">Carpentry Hand Saw</text>
</g>

<!-- Reamer -->
<g transform="translate(500,255)">
<rect x="0" y="10" width="80" height="10" fill="#bbb"/>
<line x1="0" y1="10" x2="80" y2="10" stroke="#555" stroke-width="1"/>
<line x1="5" y1="8" x2="5" y2="22" stroke="#666"/><line x1="20" y1="8" x2="20" y2="22" stroke="#666"/>
<line x1="35" y1="8" x2="35" y2="22" stroke="#666"/><line x1="50" y1="8" x2="50" y2="22" stroke="#666"/>
<rect x="80" y="12" width="20" height="6" fill="#888"/>
<text x="50" y="45" text-anchor="middle" class="lbl">Reamer (fluted)</text>
</g>

<!-- Tap and Die -->
<g transform="translate(660,255)">
<rect x="0" y="12" width="60" height="8" fill="#999"/>
<rect x="60" y="8" width="14" height="16" fill="#777"/>
<text x="35" y="45" text-anchor="middle" class="lbl">Tap (on wrench)</text>
</g>
<g transform="translate(780,255)">
<circle cx="30" cy="20" r="22" fill="none" stroke="#333" stroke-width="4"/>
<circle cx="30" cy="20" r="8" fill="none" stroke="#333" stroke-width="2"/>
<text x="30" y="60" text-anchor="middle" class="lbl">Die</text>
</g>

<text x="20" y="400" class="t" font-size="16">Measuring Instruments</text>
<!-- Vernier caliper simplified -->
<g transform="translate(30,420)">
<rect x="0" y="0" width="200" height="14" fill="#ccc" stroke="#333"/>
<rect x="0" y="14" width="16" height="40" fill="#999" stroke="#333"/>
<rect x="140" y="14" width="16" height="40" fill="#999" stroke="#333"/>
<text x="100" y="75" text-anchor="middle" class="lbl">Vernier Caliper</text>
</g>

<!-- Micrometer simplified -->
<g transform="translate(280,410)">
<rect x="0" y="20" width="90" height="8" fill="#aaa"/>
<circle cx="90" cy="24" r="24" fill="none" stroke="#333" stroke-width="4"/>
<rect x="-10" y="18" width="14" height="12" fill="#888"/>
<text x="45" y="70" text-anchor="middle" class="lbl">Outside Micrometer</text>
</g>

<!-- carpentry model making -->
<g transform="translate(500,405)">
<rect x="0" y="30" width="80" height="40" fill="#d8b98b" stroke="#8a5a2b"/>
<text x="40" y="90" text-anchor="middle" class="lbl">Model / Job Blank</text>
</g>
<g transform="translate(650,405)">
<rect x="0" y="0" width="120" height="70" fill="none" stroke="#333" stroke-dasharray="4,3"/>
<text x="60" y="90" text-anchor="middle" class="lbl">Finished Model</text>
</g>
</svg>
