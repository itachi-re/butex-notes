<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>E1 mechanism</title><desc>tert-Butyl bromide ionises slowly to a carbocation; a base then removes a beta hydrogen to form 2-methylpropene.</desc><defs><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c0392b"/></marker><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#24292f"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0969da"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1a7f37"/></marker><marker id="mgy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#57606a"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#bc4c00"/></marker></defs><rect width="900" height="600" fill="#ffffff"/><text x="30.0" y="36.0" font-size="16" text-anchor="start" fill="#57606a" font-weight="bold" xml:space="preserve"><tspan>Step 1 (slow, rate-determining): ionisation – exactly the same first step as SN1</tspan></text><text x="150.0" y="137.7" font-size="22" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>C</tspan></text><line x1="138.0" y1="130.0" x2="102.0" y2="130.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="98.0" y="137.7" font-size="22" text-anchor="end" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="22.0">H</tspan><tspan dy="6.6" font-size="15.4">3</tspan><tspan dy="-6.6" font-size="22.0">C</tspan></text><line x1="162.0" y1="130.0" x2="198.0" y2="130.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="202.0" y="137.7" font-size="22" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>Br</tspan></text><line x1="150.0" y1="116.0" x2="150.0" y2="80.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="150.0" y="74.0" font-size="22" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="22.0">CH</tspan><tspan dy="6.6" font-size="15.4">3</tspan></text><line x1="150.0" y1="144.0" x2="150.0" y2="180.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="150.0" y="201.8" font-size="22" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="22.0">CH</tspan><tspan dy="6.6" font-size="15.4">3</tspan></text><line x1="290.0" y1="130.0" x2="390.0" y2="130.0" stroke="#24292f" stroke-width="2.8" stroke-linecap="round" marker-end="url(#mk)"/><text x="340.0" y="118.0" font-size="15" text-anchor="middle" fill="#c0392b" font-weight="bold" xml:space="preserve"><tspan>slow</tspan></text><text x="540.0" y="137.7" font-size="22" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="22.0">C</tspan><tspan dy="-9.9" font-size="15.4">+</tspan></text><line x1="523.0" y1="130.0" x2="487.0" y2="130.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="483.0" y="137.7" font-size="22" text-anchor="end" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="22.0">H</tspan><tspan dy="6.6" font-size="15.4">3</tspan><tspan dy="-6.6" font-size="22.0">C</tspan></text><line x1="540.0" y1="116.0" x2="540.0" y2="80.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="540.0" y="74.0" font-size="22" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="22.0">CH</tspan><tspan dy="6.6" font-size="15.4">3</tspan></text><line x1="540.0" y1="144.0" x2="540.0" y2="180.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="540.0" y="201.8" font-size="22" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="22.0">CH</tspan><tspan dy="6.6" font-size="15.4">3</tspan></text><text x="630.0" y="138.0" font-size="24" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>+</tspan></text><text x="690.0" y="138.0" font-size="24" text-anchor="middle" fill="#0969da" font-weight="normal" xml:space="preserve"><tspan font-size="24.0">Br</tspan><tspan dy="-10.8" font-size="16.8">−</tspan></text><text x="540.0" y="235.0" font-size="14" text-anchor="middle" fill="#57606a" font-weight="normal" xml:space="preserve"><tspan>carbocation</tspan></text><text x="30.0" y="275.0" font-size="16" text-anchor="start" fill="#57606a" font-weight="bold" xml:space="preserve"><tspan>Step 2 (fast): a base (here HO⁻ or the solvent) removes a β-hydrogen → C=C forms</tspan></text><text x="210.0" y="422.7" font-size="22" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="22.0">C</tspan><tspan dy="-9.9" font-size="15.4">+</tspan></text><line x1="193.0" y1="415.0" x2="157.0" y2="415.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="153.0" y="422.7" font-size="22" text-anchor="end" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="22.0">H</tspan><tspan dy="6.6" font-size="15.4">3</tspan><tspan dy="-6.6" font-size="22.0">C</tspan></text><line x1="210.0" y1="429.0" x2="210.0" y2="465.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="210.0" y="486.8" font-size="22" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="22.0">CH</tspan><tspan dy="6.6" font-size="15.4">3</tspan></text><line x1="227.0" y1="415.0" x2="263.0" y2="415.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="267.0" y="423.0" font-size="22" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="22.0">CH</tspan><tspan dy="6.6" font-size="15.4">2</tspan></text><line x1="287.2" y1="401.0" x2="287.2" y2="369.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="287.2" y="361.0" font-size="22" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>H</tspan></text><text x="269.2" y="365.0" font-size="13" text-anchor="end" fill="#57606a" font-weight="normal" xml:space="preserve"><tspan>β-H</tspan></text><text x="399.2" y="345.0" font-size="24" text-anchor="middle" fill="#0969da" font-weight="normal" xml:space="preserve"><tspan font-size="24.0">HO</tspan><tspan dy="-10.8" font-size="16.8">−</tspan></text><circle cx="357.2" cy="331.8" r="2" fill="#0969da"/><circle cx="357.2" cy="338.2" r="2" fill="#0969da"/><path d="M353.2,327.0 Q325.2,315.0 296.2,353.0" fill="none" stroke="#0969da" stroke-width="2.2" stroke-linecap="round" marker-end="url(#mb)"/><path d="M291.2,387.0 Q273.2,399.0 245.0,408.0" fill="none" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round" marker-end="url(#mr)"/><line x1="520.0" y1="415.0" x2="620.0" y2="415.0" stroke="#24292f" stroke-width="2.8" stroke-linecap="round" marker-end="url(#mk)"/><text x="570.0" y="403.0" font-size="15" text-anchor="middle" fill="#0969da" font-weight="bold" xml:space="preserve"><tspan>fast</tspan></text><text x="760.0" y="422.7" font-size="22" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>C</tspan></text><line x1="748.0" y1="415.0" x2="712.0" y2="415.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="708.0" y="422.7" font-size="22" text-anchor="end" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="22.0">H</tspan><tspan dy="6.6" font-size="15.4">3</tspan><tspan dy="-6.6" font-size="22.0">C</tspan></text><line x1="772.0" y1="418.6" x2="808.0" y2="418.6" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><line x1="772.0" y1="411.4" x2="808.0" y2="411.4" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="812.0" y="422.7" font-size="22" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="22.0">CH</tspan><tspan dy="6.6" font-size="15.4">2</tspan></text><line x1="760.0" y1="429.0" x2="760.0" y2="465.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="760.0" y="486.8" font-size="22" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="22.0">CH</tspan><tspan dy="6.6" font-size="15.4">3</tspan></text><text x="780.0" y="515.0" font-size="14" text-anchor="middle" fill="#57606a" font-weight="normal" xml:space="preserve"><tspan>2-methylpropene (isobutene)</tspan></text><text x="30.0" y="550.0" font-size="14" text-anchor="start" fill="#c0392b" font-weight="bold" xml:space="preserve"><tspan>Overall: (CH₃)₃CBr + HO⁻ → (CH₃)₂C=CH₂ + H₂O + Br⁻      Rate = k[(CH₃)₃CBr]  (first order; base not in the slow step)</tspan></text><text x="30.0" y="575.0" font-size="14" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>E1 competes with SN1 (same carbocation); high temperature, a weak base and a polar protic solvent favour E1.</tspan></text></svg>