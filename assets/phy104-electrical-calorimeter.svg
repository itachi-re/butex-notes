<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .lbl { font-size: 15px; fill: #1a1a1a; }
    .small { font-size: 12px; fill: #333333; }
    .wire { stroke: #1a1a1a; stroke-width: 2; fill: none; }
    .thin { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
  </style>

  <!-- Outer wooden/felt jacket -->
  <rect x="60" y="90" width="200" height="220" rx="10" fill="#f2e3c9" stroke="#6b4f2a" stroke-width="2"/>
  <text x="80" y="80" class="lbl">Insulating jacket</text>

  <!-- Air gap -->
  <rect x="80" y="110" width="160" height="180" rx="8" fill="#eaf4fb" stroke="#8fb8cf" stroke-width="1.5"/>

  <!-- Copper calorimeter vessel -->
  <rect x="100" y="140" width="120" height="140" rx="6" fill="#dba86b" stroke="#7a4c1e" stroke-width="2"/>
  <text x="98" y="298" class="small">Copper calorimeter</text>
  <text x="98" y="312" class="small">(with water)</text>

  <!-- Water level -->
  <line x1="100" y1="170" x2="220" y2="170" stroke="#3a7bbf" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="225" y="174" class="small">water level</text>

  <!-- Wooden lid -->
  <rect x="90" y="130" width="140" height="12" fill="#a97c50" stroke="#6b4f2a" stroke-width="1.5"/>

  <!-- Heating coil -->
  <path d="M130 150 q8 10 0 20 q-8 10 0 20 q8 10 0 20 q-8 10 0 20 q8 10 0 20" class="thin" stroke="#c0392b"/>
  <text x="140" y="270" class="small" fill="#c0392b">Heater coil</text>

  <!-- Stirrer -->
  <line x1="180" y1="132" x2="180" y2="270" class="thin"/>
  <rect x="172" y="260" width="16" height="10" fill="#888888"/>
  <text x="192" y="150" class="small">Stirrer</text>

  <!-- Thermometer -->
  <line x1="205" y1="122" x2="205" y2="250" class="thin" stroke="#555555"/>
  <circle cx="205" cy="255" r="6" fill="#e74c3c"/>
  <text x="208" y="120" class="small">Thermometer</text>

  <!-- Terminals from heater to circuit -->
  <line x1="112" y1="150" x2="112" y2="95" class="wire"/>
  <line x1="148" y1="150" x2="148" y2="95" class="wire"/>

  <!-- Circuit box -->
  <text x="330" y="80" class="lbl">Electrical circuit</text>
  <line x1="112" y1="95" x2="112" y2="60" class="wire"/>
  <line x1="148" y1="95" x2="148" y2="60" class="wire"/>

  <!-- battery -->
  <line x1="330" y1="40" x2="330" y2="60" class="wire"/>
  <line x1="315" y1="45" x2="345" y2="45" class="wire"/>
  <line x1="320" y1="55" x2="340" y2="55" class="wire" stroke-width="4"/>
  <text x="352" y="52" class="small">Battery eliminator / DC source</text>

  <!-- rheostat -->
  <rect x="400" y="40" width="70" height="18" fill="none" class="wire"/>
  <line x1="435" y1="30" x2="435" y2="40" class="wire"/>
  <text x="405" y="30" class="small">Rheostat</text>

  <!-- ammeter -->
  <circle cx="520" cy="49" r="18" class="wire"/>
  <text x="513" y="54" class="lbl">A</text>

  <!-- key -->
  <line x1="570" y1="49" x2="600" y2="49" class="wire"/>
  <line x1="580" y1="49" x2="595" y2="35" class="wire"/>
  <text x="565" y="30" class="small">Key K</text>

  <!-- Wiring loop -->
  <line x1="112" y1="60" x2="112" y2="45" class="wire"/>
  <line x1="112" y1="45" x2="315" y2="45" class="wire"/>
  <line x1="345" y1="45" x2="400" y2="45" class="wire"/>
  <line x1="470" y1="45" x2="502" y2="49" class="wire"/>
  <line x1="538" y1="49" x2="570" y2="49" class="wire"/>
  <line x1="600" y1="49" x2="630" y2="49" class="wire"/>
  <line x1="630" y1="49" x2="630" y2="150" class="wire"/>

  <!-- voltmeter across heater -->
  <circle cx="270" cy="115" r="17" class="wire"/>
  <text x="263" y="120" class="lbl">V</text>
  <line x1="112" y1="95" x2="112" y2="115" class="wire" stroke-dasharray="3,3"/>
  <line x1="112" y1="115" x2="253" y2="115" class="wire" stroke-dasharray="3,3"/>
  <line x1="287" y1="115" x2="330" y2="115" class="wire" stroke-dasharray="3,3"/>
  <line x1="330" y1="115" x2="330" y2="60" class="wire" stroke-dasharray="3,3"/>
  <text x="245" y="105" class="small">V across heater</text>

  <!-- close loop back to heater -->
  <line x1="630" y1="150" x2="148" y2="150" class="wire"/>
  <line x1="148" y1="150" x2="148" y2="95" class="wire"/>

  <text x="330" y="360" class="lbl">Circuit: DC source &#8594; rheostat &#8594; ammeter (A) &#8594; key (K) &#8594; heater coil,</text>
  <text x="330" y="380" class="lbl">with voltmeter (V) connected directly across the heater coil.</text>
</svg>
