<svg viewBox="0 0 520 320" xmlns="http://www.w3.org/2000/svg" font-family="Arial" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<text x="260" y="25" text-anchor="middle" font-weight="bold">Cellulose — repeating unit (β-1,4-glycosidic linkage)</text>
<!-- ring 1 -->
<polygon points="90,80 130,110 118,160 62,160 30,110 60,80" fill="none" stroke="black" stroke-width="2"/>
<text x="130" y="108" text-anchor="middle" font-size="12">C1</text>
<text x="30" y="108" text-anchor="middle" font-size="12">C4</text>
<line x1="130" y1="110" x2="190" y2="110" stroke="black" stroke-width="2"/>
<text x="160" y="102" text-anchor="middle">O</text>
<text x="160" y="128" text-anchor="middle" font-size="11">(β, equatorial)</text>
<!-- ring 2 -->
<polygon points="270,80 310,110 298,160 242,160 210,110 240,80" fill="none" stroke="black" stroke-width="2"/>
<text x="210" y="108" text-anchor="middle" font-size="12">C4</text>
<text x="310" y="108" text-anchor="middle" font-size="12">C1</text>
<text x="120" y="185" text-anchor="middle" font-size="12">[glucose]ₙ — straight, extended chains (H-bonded, fibrous, indigestible by humans)</text>
<line x1="0" y1="200" x2="30" y2="110" stroke="black" stroke-dasharray="4"/>
<line x1="330" y1="110" x2="360" y2="200" stroke="black" stroke-dasharray="4"/>

<text x="260" y="230" text-anchor="middle" font-weight="bold">Starch (amylose) — repeating unit (α-1,4-glycosidic linkage)</text>
<polygon points="90,270" fill="none"/>
<polygon points="90,270 130,300 118,300 62,300 40,270 60,250" fill="none" stroke="none"/>
<!-- simplified second pair below with alpha linkage -->
<polygon points="100,260 140,280 128,310 82,310 60,280 80,260" fill="none" stroke="black" stroke-width="2"/>
<polygon points="260,260 300,280 288,310 242,310 220,280 240,260" fill="none" stroke="black" stroke-width="2"/>
<line x1="140" y1="280" x2="220" y2="280" stroke="black" stroke-width="2"/>
<text x="180" y="272" text-anchor="middle">O</text>
<text x="180" y="298" text-anchor="middle" font-size="11">(α, axial → causes helical coil)</text>
<text x="180" y="318" text-anchor="middle" font-size="12">[glucose]ₙ — coiled helix (digestible; amylose = unbranched, amylopectin = 1,6-branched)</text>
</svg>
