<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Martensite crystal structure" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Martensite crystal structure</title><desc>FCC austenite to body-centered tetragonal martensite with trapped carbon</desc><defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker><pattern id="lam" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#f3e3c3"/><line x1="0" y1="3" x2="6" y2="3" stroke="#6b3d10" stroke-width="1.6"/></pattern><pattern id="lamf" width="3.5" height="3.5" patternUnits="userSpaceOnUse"><rect width="3.5" height="3.5" fill="#f3e3c3"/><line x1="0" y1="1.7" x2="3.5" y2="1.7" stroke="#6b3d10" stroke-width="1.2"/></pattern><pattern id="lamc" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f3e3c3"/><line x1="0" y1="5" x2="10" y2="5" stroke="#6b3d10" stroke-width="2.2"/></pattern></defs><rect width="100%" height="100%" fill="#fff"/><text x="490.0" y="26" font-size="17" text-anchor="middle" fill="#0b2a55" font-weight="bold"><tspan x="490.0" dy="0.0">Austenite → Martensite: Lattice Distortion by Trapped Carbon</tspan></text><text x="490.0" y="44" font-size="11.5" text-anchor="middle" fill="#555" font-style="italic"><tspan x="490.0" dy="0.0">Schematic – not to scale</tspan></text><rect x="115" y="185" width="130" height="130" fill="#fff3b0" stroke="#555" stroke-width="1.5" opacity="0.6"/><rect x="70" y="230" width="130" height="130" fill="#fff3b0" stroke="#111" stroke-width="2" opacity="1"/><line x1="70" y1="230" x2="115" y2="185" stroke="#555" stroke-width="1.5"/><line x1="200" y1="230" x2="245" y2="185" stroke="#555" stroke-width="1.5"/><line x1="70" y1="360" x2="115" y2="315" stroke="#555" stroke-width="1.5"/><line x1="200" y1="360" x2="245" y2="315" stroke="#555" stroke-width="1.5"/><text x="135.0" y="384" font-size="12.5" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="135.0" dy="0.0">Austenite (FCC, γ)</tspan></text><circle cx="135" cy="295" r="7" fill="#c0392b" stroke="none"/><text x="70" y="150" font-size="11" text-anchor="start" fill="#c0392b"><tspan x="70" dy="0.0">● carbon dissolved in</tspan></text><text x="70" y="166" font-size="11" text-anchor="start" fill="#c0392b"><tspan x="70" dy="0.0">octahedral sites (large solubility)</tspan></text><line x1="290" y1="300" x2="420" y2="300" stroke="#333" stroke-width="3" marker-end="url(#ar)"/><text x="355" y="275" font-size="12" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="355" dy="0.0">rapid quench</tspan></text><text x="355" y="330" font-size="11.5" text-anchor="middle" fill="#111"><tspan x="355" dy="0.0">diffusionless</tspan></text><text x="355" y="346" font-size="11.5" text-anchor="middle" fill="#111"><tspan x="355" dy="0.0">(carbon can’t escape)</tspan></text><rect x="540" y="165" width="110" height="170" fill="#fdd9d9" stroke="#555" stroke-width="1.5" opacity="0.6"/><rect x="500" y="205" width="110" height="170" fill="#fdd9d9" stroke="#111" stroke-width="2" opacity="1"/><line x1="500" y1="205" x2="540" y2="165" stroke="#555" stroke-width="1.5"/><line x1="610" y1="205" x2="650" y2="165" stroke="#555" stroke-width="1.5"/><line x1="500" y1="375" x2="540" y2="335" stroke="#555" stroke-width="1.5"/><line x1="610" y1="375" x2="650" y2="335" stroke="#555" stroke-width="1.5"/><text x="555.0" y="399" font-size="12.5" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="555.0" dy="0.0">Martensite (BCT, α′)</tspan></text><circle cx="555" cy="290" r="7" fill="#c0392b" stroke="none"/><line x1="480" y1="375" x2="480" y2="205" stroke="#1a3c6e" stroke-width="1.6" marker-end="url(#ar)"/><text x="470" y="290" font-size="14" text-anchor="end" fill="#1a3c6e" font-weight="bold"><tspan x="470" dy="0.0">c</tspan></text><line x1="500" y1="432" x2="610" y2="432" stroke="#1a3c6e" stroke-width="1.6" marker-end="url(#ar)"/><text x="555" y="450" font-size="14" text-anchor="middle" fill="#1a3c6e" font-weight="bold"><tspan x="555" dy="0.0">a</tspan></text><text x="668" y="230" font-size="15" text-anchor="start" fill="#1a3c6e" font-weight="bold"><tspan x="668" dy="0.0">Unit cell:  a = b &lt; c</tspan></text><text x="668" y="254" font-size="12.5" text-anchor="start" fill="#1a3c6e"><tspan x="668" dy="0.0">(tetragonal, c/a &gt; 1)</tspan></text><text x="668" y="285" font-size="12" text-anchor="start" fill="#111"><tspan x="668" dy="0.0">Trapped carbon expands the 3rd</tspan></text><text x="668" y="302" font-size="12" text-anchor="start" fill="#111"><tspan x="668" dy="0.0">dimension → distorted lattice</tspan></text><text x="668" y="322" font-size="12" text-anchor="start" fill="#111" font-weight="bold"><tspan x="668" dy="0.0">→ slip is hindered → very high hardness</tspan></text><text x="668" y="352" font-size="12" text-anchor="start" fill="#111"><tspan x="668" dy="0.0">Expansion also creates localized</tspan></text><text x="668" y="369" font-size="12" text-anchor="start" fill="#111"><tspan x="668" dy="0.0">stresses → possible plastic deformation</tspan></text><rect x="650" y="395" width="270" height="100" fill="#fafafa" stroke="#999" stroke-width="1.2" opacity="1"/><line x1="670" y1="470" x2="760" y2="410" stroke="#222" stroke-width="3"/><line x1="700" y1="480" x2="800" y2="425" stroke="#222" stroke-width="3"/><line x1="740" y1="485" x2="840" y2="420" stroke="#222" stroke-width="3"/><line x1="790" y1="480" x2="900" y2="440" stroke="#222" stroke-width="3"/><line x1="820" y1="470" x2="905" y2="415" stroke="#222" stroke-width="3"/><line x1="690" y1="440" x2="730" y2="410" stroke="#222" stroke-width="3"/><text x="785" y="510" font-size="11" text-anchor="middle" fill="#111" font-style="italic"><tspan x="785" dy="0.0">Acicular (needle-like) martensite – schematic</tspan></text><text x="40" y="470" font-size="12.5" text-anchor="start" fill="#111" font-weight="bold"><tspan x="40" dy="0.0">Martensite = supersaturated solid solution of carbon in iron (non-equilibrium).</tspan></text><text x="40" y="490" font-size="12" text-anchor="start" fill="#111"><tspan x="40" dy="0.0">Also seen in Fe–Ni, Cu–Zn and Cu–Al systems (lecture note).</tspan></text></svg>