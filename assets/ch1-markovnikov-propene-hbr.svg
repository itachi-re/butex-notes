<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Markovnikov addition of HBr to propene</title><desc>Propene plus HBr can form a secondary or a primary carbocation; the secondary is more stable so 2-bromopropane is the major product.</desc><defs><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c0392b"/></marker><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#24292f"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0969da"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1a7f37"/></marker><marker id="mgy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#57606a"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#bc4c00"/></marker></defs><rect width="960" height="450" fill="#ffffff"/><text x="30.0" y="36.0" font-size="17" text-anchor="start" fill="#57606a" font-weight="bold" xml:space="preserve"><tspan>Markovnikov's rule: HBr + propene (via the more stable carbocation)</tspan></text><text x="30.0" y="252.7" font-size="22" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="22.0">H</tspan><tspan dy="6.6" font-size="15.4">3</tspan><tspan dy="-6.6" font-size="22.0">C</tspan></text><line x1="73.3" y1="245.0" x2="101.3" y2="245.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="104.3" y="252.7" font-size="22" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>CH</tspan></text><line x1="139.0" y1="248.6" x2="167.0" y2="248.6" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><line x1="139.0" y1="241.4" x2="167.0" y2="241.4" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="170.0" y="252.7" font-size="22" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="22.0">CH</tspan><tspan dy="6.6" font-size="15.4">2</tspan></text><text x="232.3" y="253.0" font-size="24" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>+</tspan></text><text x="254.3" y="252.7" font-size="22" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>H</tspan></text><line x1="273.1" y1="245.0" x2="301.1" y2="245.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="304.1" y="252.7" font-size="22" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>Br</tspan></text><line x1="351.6" y1="233.0" x2="395.0" y2="140.0" stroke="#1a7f37" stroke-width="2.8" stroke-linecap="round" marker-end="url(#mg)"/><line x1="351.6" y1="257.0" x2="395.0" y2="360.0" stroke="#57606a" stroke-width="2.8" stroke-linecap="round" marker-end="url(#mgy)"/><text x="430.0" y="78.0" font-size="15" text-anchor="start" fill="#1a7f37" font-weight="bold" xml:space="preserve"><tspan>Path A: H⁺ adds to terminal CH₂</tspan></text><text x="420.0" y="147.7" font-size="22" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="22.0">H</tspan><tspan dy="6.6" font-size="15.4">3</tspan><tspan dy="-6.6" font-size="22.0">C</tspan></text><line x1="463.3" y1="140.0" x2="491.3" y2="140.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="494.3" y="147.7" font-size="22" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="22.0">C</tspan><tspan dy="-9.9" font-size="15.4">+</tspan><tspan dy="9.9" font-size="22.0">H</tspan></text><line x1="537.9" y1="140.0" x2="565.9" y2="140.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="568.9" y="147.7" font-size="22" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="22.0">CH</tspan><tspan dy="6.6" font-size="15.4">3</tspan></text><text x="420.0" y="188.0" font-size="14" text-anchor="start" fill="#1a7f37" font-weight="normal" xml:space="preserve"><tspan>2° carbocation – more stable</tspan></text><line x1="627.2" y1="140.0" x2="679.2" y2="140.0" stroke="#24292f" stroke-width="2.8" stroke-linecap="round" marker-end="url(#mk)"/><text x="653.2" y="128.0" font-size="15" text-anchor="middle" fill="#0969da" font-weight="bold" xml:space="preserve"><tspan font-size="15.0">Br</tspan><tspan dy="-6.8" font-size="10.5">−</tspan></text><text x="697.2" y="147.7" font-size="22" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="22.0">H</tspan><tspan dy="6.6" font-size="15.4">3</tspan><tspan dy="-6.6" font-size="22.0">C</tspan></text><line x1="740.5" y1="140.0" x2="768.5" y2="140.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="771.5" y="147.7" font-size="22" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>CH</tspan></text><line x1="806.2" y1="140.0" x2="834.2" y2="140.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="837.2" y="147.7" font-size="22" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="22.0">CH</tspan><tspan dy="6.6" font-size="15.4">3</tspan></text><line x1="787.4" y1="126.0" x2="787.4" y2="102.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="787.4" y="95.0" font-size="22" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>Br</tspan></text><text x="697.2" y="188.0" font-size="15" text-anchor="start" fill="#1a7f37" font-weight="bold" xml:space="preserve"><tspan>2-bromopropane  (MAJOR)</tspan></text><text x="430.0" y="283.0" font-size="15" text-anchor="start" fill="#57606a" font-weight="bold" xml:space="preserve"><tspan>Path B: H⁺ adds to the middle CH</tspan></text><text x="420.0" y="352.7" font-size="22" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="22.0">H</tspan><tspan dy="6.6" font-size="15.4">3</tspan><tspan dy="-6.6" font-size="22.0">C</tspan></text><line x1="463.3" y1="345.0" x2="491.3" y2="345.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="494.3" y="352.7" font-size="22" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="22.0">CH</tspan><tspan dy="6.6" font-size="15.4">2</tspan></text><line x1="537.6" y1="345.0" x2="565.6" y2="345.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="568.6" y="352.7" font-size="22" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="22.0">C</tspan><tspan dy="-9.9" font-size="15.4">+</tspan><tspan dy="9.9" font-size="22.0">H</tspan><tspan dy="6.6" font-size="15.4">2</tspan></text><text x="420.0" y="393.0" font-size="14" text-anchor="start" fill="#57606a" font-weight="normal" xml:space="preserve"><tspan>1° carbocation – less stable</tspan></text><line x1="631.8" y1="345.0" x2="679.8" y2="345.0" stroke="#24292f" stroke-width="2.8" stroke-linecap="round" marker-end="url(#mk)"/><text x="655.8" y="333.0" font-size="15" text-anchor="middle" fill="#0969da" font-weight="bold" xml:space="preserve"><tspan font-size="15.0">Br</tspan><tspan dy="-6.8" font-size="10.5">−</tspan></text><text x="693.8" y="352.7" font-size="22" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="22.0">H</tspan><tspan dy="6.6" font-size="15.4">3</tspan><tspan dy="-6.6" font-size="22.0">C</tspan></text><line x1="737.1" y1="345.0" x2="765.1" y2="345.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="768.1" y="352.7" font-size="22" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="22.0">CH</tspan><tspan dy="6.6" font-size="15.4">2</tspan></text><line x1="811.5" y1="345.0" x2="839.5" y2="345.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="842.5" y="352.7" font-size="22" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="22.0">CH</tspan><tspan dy="6.6" font-size="15.4">2</tspan></text><line x1="885.8" y1="345.0" x2="913.8" y2="345.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="916.8" y="352.7" font-size="22" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>Br</tspan></text><text x="693.8" y="393.0" font-size="15" text-anchor="start" fill="#57606a" font-weight="bold" xml:space="preserve"><tspan>1-bromopropane  (minor)</tspan></text><text x="30.0" y="425.0" font-size="14" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>Rule: in HX + unsymmetrical alkene, H goes to the carbon that already has more H atoms; X goes to the carbon with fewer H atoms.</tspan></text></svg>