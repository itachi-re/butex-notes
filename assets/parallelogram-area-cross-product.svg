<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" width="520" height="260" font-family="Arial, Helvetica, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Parallelogram with sides A and B</title>
  <rect width="520" height="260" fill="#ffffff"/>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1f3a8a"/></marker>
  </defs>
  <polygon points="60,210 280,210 370,100 150,100" fill="#dbeafe" stroke="#1f3a8a" stroke-width="2"/>
  <line x1="60" y1="210" x2="280" y2="210" stroke="#1f3a8a" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="60" y1="210" x2="150" y2="100" stroke="#b91c1c" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="150" y1="100" x2="150" y2="210" stroke="#555" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="150" y="198" width="12" height="12" fill="none" stroke="#555"/>
  <path d="M95,210 A35,35 0 0 0 85,185" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="165" y="232" fill="#1f3a8a" font-weight="bold">A (base)</text>
  <text x="85" y="140" fill="#b91c1c" font-weight="bold">B</text>
  <text x="102" y="204" fill="#333">θ</text>
  <text x="156" y="160" fill="#555">h = |B| sin θ</text>
  <circle cx="450" cy="150" r="16" fill="none" stroke="#047857" stroke-width="2"/>
  <circle cx="450" cy="150" r="3" fill="#047857"/>
  <text x="400" y="190" fill="#047857">A × B (out of page)</text>
  <text x="330" y="40" fill="#333">Area = |A| · h = |A × B|</text>
</svg>
