<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300">
    <rect width="500" height="300" fill="#ffffff"/>
    
    <!-- Beaker 1: Bathtub -->
    <path d="M 50,100 L 50,250 L 250,250 L 250,100" fill="none" stroke="#333" stroke-width="3"/>
    <path d="M 50,130 L 250,130" stroke="#333" stroke-width="1"/>
    <rect x="52" y="130" width="196" height="118" fill="#0072b2" opacity="0.5"/>
    <text x="150" y="190" font-family="sans-serif" font-size="16" text-anchor="middle">Large Mass (Bathtub)</text>
    <text x="150" y="210" font-family="sans-serif" font-size="14" text-anchor="middle">40°C</text>
    <text x="150" y="230" font-family="sans-serif" font-size="14" text-anchor="middle">High total heat</text>
    
    <!-- Beaker 2: Coffee cup -->
    <path d="M 330,150 L 330,250 L 430,250 L 430,150" fill="none" stroke="#333" stroke-width="3"/>
    <path d="M 330,170 L 430,170" stroke="#333" stroke-width="1"/>
    <rect x="332" y="170" width="96" height="78" fill="#d55e00" opacity="0.5"/>
    <text x="380" y="200" font-family="sans-serif" font-size="16" text-anchor="middle">Coffee Cup</text>
    <text x="380" y="220" font-family="sans-serif" font-size="14" text-anchor="middle">80°C</text>
    <text x="380" y="240" font-family="sans-serif" font-size="14" text-anchor="middle">Low total heat</text>
    
    <!-- Direction of Heat Flow -->
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 Z" fill="#d55e00"/>
        </marker>
    </defs>
    <path d="M 370,120 Q 250,50 150,120" stroke="#d55e00" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <text x="260" y="70" font-family="sans-serif" font-size="16" fill="#d55e00" text-anchor="middle">Heat flow (80°C to 40°C)</text>
</svg>