<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
<style>.lbl{font-size:13px;fill:#222} .t{font-size:18px;font-weight:bold;fill:#111}</style>
<rect width="700" height="300" fill="#fff"/>
<text x="350" y="26" text-anchor="middle" class="t">Bending / Folding a Flat Blank</text>

<g transform="translate(40,60)">
<rect x="0" y="60" width="200" height="10" fill="#999"/>
<rect x="0" y="40" width="200" height="16" fill="#d0d0d0" stroke="#333"/>
<text x="100" y="110" text-anchor="middle" class="lbl">1. Blank clamped in folding bar</text>
</g>

<g transform="translate(300,60)">
<rect x="0" y="60" width="200" height="10" fill="#999"/>
<path d="M0,56 L140,56 L200,-10" fill="none" stroke="#333" stroke-width="4"/>
<rect x="0" y="40" width="140" height="16" fill="#d0d0d0" stroke="#333"/>
<text x="100" y="110" text-anchor="middle" class="lbl">2. Mallet forms the bend upward</text>
</g>

<g transform="translate(560,60)">
<path d="M0,50 L0,0 L100,0" fill="none" stroke="#333" stroke-width="6"/>
<text x="50" y="110" text-anchor="middle" class="lbl">3. Finished right-angle fold</text>
</g>
</svg>
