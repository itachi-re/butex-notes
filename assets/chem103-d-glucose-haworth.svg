<svg viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .lbl{font-size:13px;fill:#1a1a1a;}
    .small{font-size:11.5px;fill:#333;}
    .ring{stroke:#33475b;stroke-width:2;fill:none;}
    .arrow{stroke:#33475b;stroke-width:2;marker-end:url(#ah7);fill:none;}
  </style>
  <defs>
    <marker id="ah7" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#33475b"/>
    </marker>
  </defs>

  <text x="450" y="24" text-anchor="middle" font-size="17" font-weight="bold">Haworth Projections: α- and β-D-Glucopyranose (Mutarotation)</text>

  <!-- alpha ring -->
  <g transform="translate(90,60)">
    <polygon class="ring" points="0,60 40,90 140,90 180,60 140,40 40,40"/>
    <circle cx="140" cy="40" r="3" fill="#33475b"/>
    <text x="10" y="55" class="small">O</text>
    <text x="-15" y="105" class="small">CH2OH(C6)</text>
    <text x="0" y="110" class="small">C5</text>
    <text x="40" y="105" class="small">C4-OH</text>
    <text x="90" y="105" class="small">C3-OH</text>
    <text x="140" y="105" class="small">C2-OH</text>
    <text x="140" y="20" class="small">C1-OH (α, down)</text>
    <text x="60" y="140" text-anchor="middle" font-weight="bold">α-D-glucopyranose</text>
  </g>

  <text x="450" y="120" text-anchor="middle" font-size="20">⇌</text>
  <text x="450" y="140" text-anchor="middle" class="small">(open-chain aldehyde form, via C1-C5 hemiacetal ring opening)</text>

  <!-- beta ring -->
  <g transform="translate(560,60)">
    <polygon class="ring" points="0,60 40,90 140,90 180,60 140,40 40,40"/>
    <circle cx="140" cy="40" r="3" fill="#33475b"/>
    <text x="10" y="55" class="small">O</text>
    <text x="-15" y="105" class="small">CH2OH(C6)</text>
    <text x="0" y="110" class="small">C5</text>
    <text x="40" y="105" class="small">C4-OH</text>
    <text x="90" y="105" class="small">C3-OH</text>
    <text x="140" y="105" class="small">C2-OH</text>
    <text x="140" y="25" class="small">C1-OH (β, up)</text>
    <text x="60" y="140" text-anchor="middle" font-weight="bold">β-D-glucopyranose</text>
  </g>

  <text x="450" y="220" text-anchor="middle" font-weight="bold" font-size="14">Mutarotation</text>
  <text x="450" y="245" text-anchor="middle" class="small">A freshly prepared solution of pure α-D-glucose ([α]D +112°) or pure β-D-glucose ([α]D +18.7°)</text>
  <text x="450" y="265" text-anchor="middle" class="small">slowly changes optical rotation to an equilibrium value of +52.7°, via the open-chain form —</text>
  <text x="450" y="285" text-anchor="middle" class="small">this spontaneous change in specific rotation on standing is called mutarotation.</text>
  <text x="450" y="315" text-anchor="middle" class="small" font-style="italic">Asymmetric carbon: a carbon bonded to four different groups (e.g. C2-C5 of glucose); source of optical isomerism.</text>
</svg>
