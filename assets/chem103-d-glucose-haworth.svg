<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 340' width='760' height='340' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width='760' height='340' fill='white'/>
<defs><marker id='arrow' markerWidth='10' markerHeight='10' refX='8' refY='3' orient='auto' markerUnits='strokeWidth'><path d='M0,0 L0,6 L9,3 z' fill='#111'/></marker></defs>
<text x='380.0' y='24' font-size='15' font-family='Arial,Helvetica,sans-serif' font-weight='700'  fill='#111' text-anchor='middle'>D-Glucose: Open Chain ⇌ Cyclic Pyranose (α / β)</text>
<text x='90' y='60' font-size='13' font-family='Arial,Helvetica,sans-serif'   fill='#111' text-anchor='middle'>CHO</text>
<text x='90' y='82' font-size='12' font-family='Arial,Helvetica,sans-serif'   fill='#111' text-anchor='middle'>H–C–OH</text>
<text x='90' y='104' font-size='12' font-family='Arial,Helvetica,sans-serif'   fill='#111' text-anchor='middle'>HO–C–H</text>
<text x='90' y='126' font-size='12' font-family='Arial,Helvetica,sans-serif'   fill='#111' text-anchor='middle'>H–C–OH</text>
<text x='90' y='148' font-size='12' font-family='Arial,Helvetica,sans-serif'   fill='#111' text-anchor='middle'>H–C–OH</text>
<text x='90' y='170' font-size='12' font-family='Arial,Helvetica,sans-serif'   fill='#111' text-anchor='middle'>CH₂OH</text>
<text x='90' y='202' font-size='10' font-family='Arial,Helvetica,sans-serif'  font-style='italic' fill='#555' text-anchor='middle'>open-chain D-glucose</text>
<line x1='180' y1='130' x2='240' y2='130' stroke='#111' stroke-width='2' marker-end='url(#arrow)'/>
<text x='210.0' y='122' font-size='11' font-family='Arial,Helvetica,sans-serif'   fill='#111' text-anchor='middle'>cyclize</text>
<polygon points='350,140 385,115 455,115 490,140 455,175 385,175' fill='none' stroke='#111' stroke-width='2'/>
<text x='470' y='105' font-size='13' font-family='Arial,Helvetica,sans-serif' font-weight='700'  fill='#111' text-anchor='middle'>O</text>
<text x='385' y='105' font-size='10' font-family='Arial,Helvetica,sans-serif'   fill='#555' text-anchor='middle'>C5</text>
<text x='345' y='135' font-size='10' font-family='Arial,Helvetica,sans-serif'   fill='#555' text-anchor='middle'>C4</text>
<text x='380' y='190' font-size='10' font-family='Arial,Helvetica,sans-serif'   fill='#555' text-anchor='middle'>C3</text>
<text x='455' y='190' font-size='10' font-family='Arial,Helvetica,sans-serif'   fill='#555' text-anchor='middle'>C2</text>
<text x='500' y='135' font-size='10' font-family='Arial,Helvetica,sans-serif' font-weight='700'  fill='#b00' text-anchor='middle'>C1</text>
<line x1='490' y1='140' x2='515' y2='160' stroke='#111' stroke-width='2'/>
<text x='550' y='165' font-size='11' font-family='Arial,Helvetica,sans-serif'   fill='#b00' text-anchor='start'>OH (α: down / β: up)</text>
<text x='420' y='220' font-size='11' font-family='Arial,Helvetica,sans-serif'  font-style='italic' fill='#b00' text-anchor='middle'>anomeric carbon = C1</text>
<text x='420' y='250' font-size='13' font-family='Arial,Helvetica,sans-serif' font-weight='700'  fill='#111' text-anchor='middle'>α-D-glucopyranose  ⇌  (open-chain)  ⇌  β-D-glucopyranose</text>
<text x='420' y='272' font-size='11' font-family='Arial,Helvetica,sans-serif'   fill='#555' text-anchor='middle'>α: +112°        equilibrium: +52.7°        β: +18.7°</text>
<text x='420' y='300' font-size='11' font-family='Arial,Helvetica,sans-serif'  font-style='italic' fill='#111' text-anchor='middle'>Mutarotation: optical rotation of freshly dissolved pure anomer drifts to the equilibrium value</text>
</svg>
