<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 426" width="820" height="426" role="img" aria-label="Tempering temperature ranges" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Tempering temperature ranges</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#333" stroke-width="2"/></pattern><pattern id="hatch2" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)"><line x1="0" y1="0" x2="0" y2="5" stroke="#e67e22" stroke-width="2"/></pattern></defs><rect x="0.5" y="0.5" width="819" height="425" fill="#ffffff" stroke="#cfd4da"/><text x="400.0" y="26.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2933" font-family="Helvetica, Arial, sans-serif">Tempering temperature ranges given in the lectures (schematic bars, not to scale)</text><text x="60.0" y="60.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933" font-family="Helvetica, Arial, sans-serif">General tempering range: 400-800 °F</text><rect x="254.3" y="66.0" width="194.3" height="18.0" rx="3" fill="#e0e0e0" stroke="#666" stroke-width="1.2"/><text x="60.0" y="110.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933" font-family="Helvetica, Arial, sans-serif">Black martensite: epsilon carbide + low-carbon martensite   (R/c 60-64)</text><rect x="108.6" y="116.0" width="145.7" height="18.0" rx="3" fill="#eceff1" stroke="#37474f" stroke-width="1.2"/><text x="60.0" y="160.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933" font-family="Helvetica, Arial, sans-serif">Troostite: cementite + BCC ferrite; retained austenite to lower bainite   (R/c 40-60)</text><rect x="278.6" y="166.0" width="145.7" height="18.0" rx="3" fill="#ffe0b2" stroke="#e65100" stroke-width="1.2"/><text x="60.0" y="210.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933" font-family="Helvetica, Arial, sans-serif">Sorbite / sorbate: cementite grows, more ferrite   (R/c 20-40; 125-200 ksi)</text><rect x="424.3" y="216.0" width="218.6" height="18.0" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.2"/><text x="60.0" y="260.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933" font-family="Helvetica, Arial, sans-serif">Large globular cementite: very soft and tough (spheroidized-like)</text><rect x="642.9" y="266.0" width="64.6" height="18.0" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1.2"/><text x="60.0" y="310.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933" font-family="Helvetica, Arial, sans-serif">Temper brittleness: tempered here, then slowly cooled</text><rect x="545.7" y="316.0" width="121.4" height="18.0" rx="3" fill="#f8bbd0" stroke="#ad1457" stroke-width="1.2"/><line x1="60.0" y1="352.0" x2="740.0" y2="352.0" stroke="#444" stroke-width="1.6"/><line x1="60.0" y1="352.0" x2="60.0" y2="357.0" stroke="#444" stroke-width="1"/><text x="60.0" y="371.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#5f6b7a" font-family="Helvetica, Arial, sans-serif">0</text><line x1="157.1" y1="352.0" x2="157.1" y2="357.0" stroke="#444" stroke-width="1"/><text x="157.1" y="371.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#5f6b7a" font-family="Helvetica, Arial, sans-serif">200</text><line x1="254.3" y1="352.0" x2="254.3" y2="357.0" stroke="#444" stroke-width="1"/><text x="254.3" y="371.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#5f6b7a" font-family="Helvetica, Arial, sans-serif">400</text><line x1="351.4" y1="352.0" x2="351.4" y2="357.0" stroke="#444" stroke-width="1"/><text x="351.4" y="371.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#5f6b7a" font-family="Helvetica, Arial, sans-serif">600</text><line x1="448.6" y1="352.0" x2="448.6" y2="357.0" stroke="#444" stroke-width="1"/><text x="448.6" y="371.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#5f6b7a" font-family="Helvetica, Arial, sans-serif">800</text><line x1="545.7" y1="352.0" x2="545.7" y2="357.0" stroke="#444" stroke-width="1"/><text x="545.7" y="371.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#5f6b7a" font-family="Helvetica, Arial, sans-serif">1000</text><line x1="642.9" y1="352.0" x2="642.9" y2="357.0" stroke="#444" stroke-width="1"/><text x="642.9" y="371.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#5f6b7a" font-family="Helvetica, Arial, sans-serif">1200</text><line x1="740.0" y1="352.0" x2="740.0" y2="357.0" stroke="#444" stroke-width="1"/><text x="740.0" y="371.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#5f6b7a" font-family="Helvetica, Arial, sans-serif">1400</text><text x="400.0" y="390.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2933" font-family="Helvetica, Arial, sans-serif">Tempering temperature (°F)</text><line x1="707.5" y1="48.0" x2="707.5" y2="352.0" stroke="#2471a3" stroke-width="1" stroke-dasharray="5,4"/><text x="711.5" y="60.0" font-size="10.5" text-anchor="start" font-weight="normal" fill="#2471a3" font-family="Helvetica, Arial, sans-serif">A1 = 1333 °F</text><text x="400.0" y="410.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#5f6b7a" font-family="Helvetica, Arial, sans-serif">Ranges overlap or differ slightly between slides (see section 12 and the source-issue log).</text></svg>