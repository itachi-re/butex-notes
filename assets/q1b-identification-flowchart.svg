<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-label="Flowchart to identify formic, acetic, oxalic and benzoic acid">
<title>Flowchart to identify formic, acetic, oxalic and benzoic acid</title>
<desc>Flowchart to identify formic, acetic, oxalic and benzoic acid</desc>
<rect width="1000" height="660" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<text x="500.0" y="34.0" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="22" text-anchor="middle" font-weight="bold" fill="#1f2328" >Q1(b): Identifying an unknown acid</text><text x="500.0" y="58.0" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#57606a" >Follow the tests from the top; each result box names the acid</text><rect x="360.0" y="78.0" width="280" height="44" rx="10" fill="#eef6ff" stroke="#3b82f6" stroke-width="1.8"/><text x="500.0" y="95.8" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2328" >Unknown acid sample</text><text x="500.0" y="114.0" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2328" >(one of the four)</text><polyline points="500,122 500,150" fill="none" stroke="#444" stroke-width="1.9" stroke-linejoin="round" marker-end="url(#ah)"/><polygon points="500,150.0 640.0,200 500,250.0 360.0,200" fill="#fff8e1" stroke="#f59e0b" stroke-width="1.8"/><text x="500.0" y="195.8" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2328" >Physical state at</text><text x="500.0" y="214.0" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2328" >room temperature?</text><polyline points="360,200 310,200 310,262" fill="none" stroke="#444" stroke-width="1.9" stroke-linejoin="round" marker-end="url(#ah)"/><text x="335.0" y="190.0" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#374151" >Liquid</text><polygon points="310,262.0 435.0,320 310,378.0 185.0,320" fill="#fff8e1" stroke="#f59e0b" stroke-width="1.8"/><text x="310.0" y="307.7" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2328" >Warm with Tollens'</text><text x="310.0" y="324.6" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2328" >reagent: silver</text><text x="310.0" y="341.5" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2328" >mirror formed?</text><polyline points="185,320 150,320" fill="none" stroke="#444" stroke-width="1.9" stroke-linejoin="round" marker-end="url(#ah)"/><text x="168.0" y="310.0" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#374151" >Yes</text><rect x="15.0" y="297.0" width="130" height="46" rx="10" fill="#e8f7ec" stroke="#16a34a" stroke-width="1.8"/><text x="80.0" y="324.9" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2328" >FORMIC ACID</text><polyline points="310,378 310,440" fill="none" stroke="#444" stroke-width="1.9" stroke-linejoin="round" marker-end="url(#ah)"/><text x="326.0" y="410.0" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#374151" >No</text><polygon points="310,440.0 435.0,498 310,556.0 185.0,498" fill="#fff8e1" stroke="#f59e0b" stroke-width="1.8"/><text x="249.3" y="494.1" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="13.0" text-anchor="start" font-weight="normal" fill="#1f2328" >Neutral FeCl</text><text x="322.3" y="497.2" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="9.1" text-anchor="start" font-weight="normal" fill="#1f2328" >3</text><text x="327.3" y="494.1" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="13.0" text-anchor="start" font-weight="normal" fill="#1f2328" > added:</text><text x="310.0" y="511.0" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2328" >blood-red colour?</text><polyline points="185,498 150,498" fill="none" stroke="#444" stroke-width="1.9" stroke-linejoin="round" marker-end="url(#ah)"/><text x="168.0" y="488.0" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#374151" >Yes</text><rect x="15.0" y="475.0" width="130" height="46" rx="10" fill="#e8f7ec" stroke="#16a34a" stroke-width="1.8"/><text x="80.0" y="502.9" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2328" >ACETIC ACID</text><polyline points="310,556 310,596" fill="none" stroke="#444" stroke-width="1.9" stroke-linejoin="round" marker-end="url(#ah)"/><text x="326.0" y="580.0" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#374151" >No</text><rect x="200.0" y="600.0" width="220" height="36" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.8"/><text x="310.0" y="622.5" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2328" >Re-check the sample</text><polyline points="640,200 690,200 690,262" fill="none" stroke="#444" stroke-width="1.9" stroke-linejoin="round" marker-end="url(#ah)"/><text x="665.0" y="190.0" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#374151" >Solid</text><polygon points="690,262.0 815.0,320 690,378.0 565.0,320" fill="#fff8e1" stroke="#f59e0b" stroke-width="1.8"/><text x="634.4" y="307.7" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="13.0" text-anchor="start" font-weight="normal" fill="#1f2328" >CaCl</text><text x="663.3" y="310.8" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="9.1" text-anchor="start" font-weight="normal" fill="#1f2328" >2</text><text x="668.3" y="307.7" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="13.0" text-anchor="start" font-weight="normal" fill="#1f2328" > added: white</text><text x="690.0" y="324.6" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2328" >ppt insoluble in</text><text x="690.0" y="341.5" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2328" >acetic acid?</text><polyline points="815,320 850,320" fill="none" stroke="#444" stroke-width="1.9" stroke-linejoin="round" marker-end="url(#ah)"/><text x="832.0" y="310.0" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#374151" >Yes</text><rect x="855.0" y="297.0" width="130" height="46" rx="10" fill="#e8f7ec" stroke="#16a34a" stroke-width="1.8"/><text x="920.0" y="324.9" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2328" >OXALIC ACID</text><polyline points="690,378 690,440" fill="none" stroke="#444" stroke-width="1.9" stroke-linejoin="round" marker-end="url(#ah)"/><text x="706.0" y="410.0" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#374151" >No</text><polygon points="690,440.0 815.0,498 690,556.0 565.0,498" fill="#fff8e1" stroke="#f59e0b" stroke-width="1.8"/><text x="629.3" y="494.1" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="13.0" text-anchor="start" font-weight="normal" fill="#1f2328" >Neutral FeCl</text><text x="702.3" y="497.2" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="9.1" text-anchor="start" font-weight="normal" fill="#1f2328" >3</text><text x="707.3" y="494.1" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="13.0" text-anchor="start" font-weight="normal" fill="#1f2328" > added:</text><text x="690.0" y="511.0" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2328" >buff / pinkish ppt?</text><polyline points="815,498 850,498" fill="none" stroke="#444" stroke-width="1.9" stroke-linejoin="round" marker-end="url(#ah)"/><text x="832.0" y="488.0" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#374151" >Yes</text><rect x="855.0" y="475.0" width="130" height="46" rx="10" fill="#e8f7ec" stroke="#16a34a" stroke-width="1.8"/><text x="920.0" y="502.9" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2328" >BENZOIC ACID</text><polyline points="690,556 690,596" fill="none" stroke="#444" stroke-width="1.9" stroke-linejoin="round" marker-end="url(#ah)"/><text x="706.0" y="580.0" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#374151" >No</text><rect x="580.0" y="600.0" width="220" height="36" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.8"/><text x="690.0" y="622.5" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2328" >Re-check the sample</text><text x="80.0" y="358.7" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#57606a" >also reduces Fehling's</text><text x="54.9" y="373.0" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="11.0" text-anchor="start" font-weight="normal" fill="#57606a" >and HgCl</text><text x="100.8" y="375.6" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="7.7" text-anchor="start" font-weight="normal" fill="#57606a" >2</text><text x="80.0" y="536.7" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#57606a" >vinegar smell,</text><text x="80.0" y="551.0" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#57606a" >fruity ester</text><text x="920.0" y="358.7" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#57606a" >decolourises warm</text><text x="880.6" y="373.0" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="11.0" text-anchor="start" font-weight="normal" fill="#57606a" >acidified KMnO</text><text x="955.1" y="375.6" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="7.7" text-anchor="start" font-weight="normal" fill="#57606a" >4</text><text x="920.0" y="536.7" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#57606a" >m.p. 122 °C,</text><text x="920.0" y="551.0" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#57606a" >sublimes</text></svg>