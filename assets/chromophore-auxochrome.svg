<svg viewBox="0 0 460 180" xmlns="http://www.w3.org/2000/svg" font-family="Arial" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<text x="230" y="20" text-anchor="middle" font-weight="bold">Chromophore and Auxochrome (Azobenzene example)</text>
<!-- benzene ring 1 -->
<polygon points="60,80 90,60 120,80 120,115 90,135 60,115" fill="none" stroke="black" stroke-width="2"/>
<!-- N=N chromophore -->
<line x1="120" y1="80" x2="160" y2="80" stroke="red" stroke-width="3"/>
<text x="140" y="70" text-anchor="middle" fill="red" font-weight="bold">N=N</text>
<!-- benzene ring 2 -->
<polygon points="160,80 190,60 220,80 220,115 190,135 160,115" fill="none" stroke="black" stroke-width="2"/>
<!-- auxochrome NH2 -->
<line x1="220" y1="97" x2="255" y2="97" stroke="blue" stroke-width="2"/>
<text x="290" y="102" text-anchor="middle" fill="blue" font-weight="bold">–NH₂ (auxochrome)</text>

<text x="90" y="150" text-anchor="middle" font-size="11">Benzene rings</text>
<text x="140" y="45" text-anchor="middle" fill="red" font-size="11">chromophore</text>
<text x="230" y="165" text-anchor="middle" font-size="12">Chromophore (–N=N–) gives colour; auxochrome (–NH₂/–OH) deepens/intensifies colour and aids dyeing (via salt/H-bond formation)</text>
</svg>
