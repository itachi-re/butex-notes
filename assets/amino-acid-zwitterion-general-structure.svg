<svg viewBox="0 0 560 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="560" height="260" fill="#ffffff"/>
<text x="280" y="24" text-anchor="middle" font-size="16" font-weight="bold">Amino Acid &#8211; Neutral vs Zwitterion Form</text>

<text x="140" y="60" text-anchor="middle" font-size="13" font-weight="bold">Un-ionised (textbook) form</text>
<text x="140" y="110" text-anchor="middle" font-size="16">H&#8322;N&#8211;CH(R)&#8211;COOH</text>
<line x1="140" y1="120" x2="140" y2="90" stroke="none"/>

<text x="140" y="150" text-anchor="middle" font-size="11">amino group   R = side chain   carboxyl group</text>

<line x1="260" y1="100" x2="320" y2="100" stroke="#333" stroke-width="2" marker-end="url(#a2)"/>
<text x="290" y="90" text-anchor="middle" font-size="11">intramolecular</text>
<text x="290" y="118" text-anchor="middle" font-size="11">proton transfer</text>

<text x="430" y="60" text-anchor="middle" font-size="13" font-weight="bold">Zwitterion (actual form, pH ~7 / at pI)</text>
<text x="430" y="110" text-anchor="middle" font-size="16">H&#8323;N&#8314;&#8211;CH(R)&#8211;COO&#8315;</text>
<text x="430" y="150" text-anchor="middle" font-size="11">overall neutral, but carries + and &#8211; charge</text>

<rect x="330" y="175" width="200" height="60" rx="6" fill="#eef5ff" stroke="#1f5fa8"/>
<text x="430" y="197" text-anchor="middle" font-size="12" font-weight="bold">Isoelectric point (pI)</text>
<text x="430" y="217" text-anchor="middle" font-size="11">pH at which the amino acid</text>
<text x="430" y="230" text-anchor="middle" font-size="11">exists purely as the zwitterion (net charge = 0)</text>

<defs><marker id="a2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#333"/></marker></defs>
</svg>
