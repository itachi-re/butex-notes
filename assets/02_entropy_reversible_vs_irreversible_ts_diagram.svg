<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow02" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#222222"/>
    </marker>
  </defs>
  <rect width="700" height="400" fill="#ffffff"/>

  <!-- axes -->
  <line x1="90" y1="330" x2="620" y2="330" stroke="#222222" stroke-width="2" marker-end="url(#arrow02)"/>
  <line x1="90" y1="330" x2="90" y2="50" stroke="#222222" stroke-width="2" marker-end="url(#arrow02)"/>
  <text x="630" y="335" font-size="15" fill="#222222">S</text>
  <text x="80" y="42" font-size="15" fill="#222222">T</text>

  <!-- state points -->
  <circle cx="180" cy="260" r="5" fill="#111111"/>
  <text x="165" y="285" font-size="13" fill="#111111">1 (S₁, T₁)</text>

  <circle cx="470" cy="130" r="5" fill="#111111"/>
  <text x="480" y="120" font-size="13" fill="#111111">2 (S₂, T₂)</text>

  <!-- reversible path: solid smooth curve -->
  <path d="M180,260 C 280,240 350,180 470,130" fill="none" stroke="#2166ac" stroke-width="3"/>
  <text x="330" y="185" font-size="13" fill="#2166ac" font-weight="bold">reversible path (solid)</text>

  <!-- irreversible path: dashed, different route, same endpoints -->
  <path d="M180,260 C 240,300 400,300 470,130" fill="none" stroke="#b2182b" stroke-width="3" stroke-dasharray="9,6"/>
  <text x="300" y="320" font-size="13" fill="#b2182b" font-weight="bold">irreversible path (dashed)</text>

  <!-- projections onto S axis -->
  <line x1="180" y1="260" x2="180" y2="330" stroke="#888888" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="470" y1="130" x2="470" y2="330" stroke="#888888" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="180" y="348" text-anchor="middle" font-size="12" fill="#555555">S₁</text>
  <text x="470" y="348" text-anchor="middle" font-size="12" fill="#555555">S₂</text>

  <!-- bracket showing equal delta S -->
  <line x1="180" y1="365" x2="470" y2="365" stroke="#333333" stroke-width="1.5"/>
  <line x1="180" y1="360" x2="180" y2="370" stroke="#333333" stroke-width="1.5"/>
  <line x1="470" y1="360" x2="470" y2="370" stroke="#333333" stroke-width="1.5"/>
  <text x="325" y="390" text-anchor="middle" font-size="13" fill="#222222">ΔS = S₂ − S₁ (same value, whichever path is used to compute it)</text>
</svg>
