<svg xmlns="http://www.w3.org/2000/svg" width="740" height="650" viewBox="0 0 740 650" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Flowchart to find the maximum of 10 integers" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Flowchart to find the maximum of 10 integers</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker></defs>
<rect x="0.5" y="0.5" width="739" height="649" fill="#ffffff" stroke="#cfd8dc" rx="8"/>
<rect x="190.0" y="12.0" width="120" height="36" rx="18.0" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/><text x="250" y="34.55" font-size="13" text-anchor="middle" font-weight="bold" fill="#1a1a1a" ><tspan x="250" dy="0">Start</tspan></text><polyline points="250,48 250,75" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><polygon points="174.0,75.0 340.0,75.0 326.0,115.0 160.0,115.0" fill="#ffe0b2" stroke="#ef6c00" stroke-width="1.5"/><text x="250" y="99.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="250" dy="0">Read first number x</tspan></text><polyline points="250,115 250,143" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><rect x="165.0" y="143.0" width="170" height="44" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/><text x="250" y="161.425" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="250" dy="0">max = x</tspan><tspan x="250" dy="16.25">count = 1</tspan></text><polyline points="250,187 250,220" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><polygon points="250,220.0 335.0,255 250,290.0 165.0,255" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/><text x="250" y="259.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="250" dy="0">count &lt; 10 ?</tspan></text><polyline points="250,290 250,325" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><text x="266" y="314.2" font-size="12" text-anchor="start" font-weight="bold" fill="#b71c1c" ><tspan x="266" dy="0">Yes</tspan></text><polygon points="174.0,325.0 340.0,325.0 326.0,365.0 160.0,365.0" fill="#ffe0b2" stroke="#ef6c00" stroke-width="1.5"/><text x="250" y="349.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="250" dy="0">Read next x</tspan></text><polyline points="250,365 250,400" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><polygon points="250,400.0 335.0,435 250,470.0 165.0,435" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/><text x="250" y="439.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="250" dy="0">x &gt; max ?</tspan></text><polyline points="250,470 250,505" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><text x="266" y="494.2" font-size="12" text-anchor="start" font-weight="bold" fill="#b71c1c" ><tspan x="266" dy="0">No</tspan></text><rect x="165.0" y="505.0" width="170" height="40" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/><text x="250" y="529.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="250" dy="0">count = count + 1</tspan></text><polyline points="335,435 425,435" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><text x="380" y="430.2" font-size="12" text-anchor="middle" font-weight="bold" fill="#b71c1c" ><tspan x="380" dy="0">Yes</tspan></text><rect x="425.0" y="415.0" width="150" height="40" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/><text x="500" y="439.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="500" dy="0">max = x</tspan></text><polyline points="500,455 500,525 335,525" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><polyline points="165,525 60,525 60,255 165,255" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><polyline points="335,255 545,255" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><text x="440" y="250.2" font-size="12" text-anchor="middle" font-weight="bold" fill="#b71c1c" ><tspan x="440" dy="0">No</tspan></text><rect x="545.0" y="235.0" width="150" height="40" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/><text x="620" y="259.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="620" dy="0">Print max</tspan></text><polyline points="620,275 620,610" fill="none" stroke="#37474f" stroke-width="1.6"/><polyline points="620,610 310,610" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><rect x="190.0" y="592.0" width="120" height="36" rx="18.0" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/><text x="250" y="614.55" font-size="13" text-anchor="middle" font-weight="bold" fill="#1a1a1a" ><tspan x="250" dy="0">End</tspan></text>
</svg>