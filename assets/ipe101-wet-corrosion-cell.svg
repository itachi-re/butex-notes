<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" font-family="DejaVu Sans, Verdana, Arial, sans-serif" role="img" aria-label="Wet (electrochemical) corrosion of iron under a water drop"><title>Wet (electrochemical) corrosion of iron under a water drop</title><defs><marker id="m1b5e20" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#1b5e20"/></marker><marker id="me65100" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#e65100"/></marker><marker id="mb71c1c" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#b71c1c"/></marker></defs><rect width="920" height="500" fill="#ffffff"/><text x="460.0" y="28.0" font-size="17" text-anchor="middle" fill="#222" font-weight="bold">Wet (electrochemical) corrosion of iron under a water drop</text><text x="460.0" y="46.0" font-size="12" text-anchor="middle" fill="#555" font-weight="normal">differential aeration: oxygen-poor centre = anode, oxygen-rich rim = cathode</text><rect x="60.0" y="300.0" width="800.0" height="70.0" rx="0" fill="#b0bec5" stroke="#37474f" stroke-width="2"/><text x="110.0" y="345.0" font-size="13" text-anchor="start" fill="#37474f" font-weight="bold">iron / steel</text><path d="M250,300 C260,160 660,160 670,300 Z" fill="#bbdefb" fill-opacity="0.8" stroke="#1565c0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="460.0" y="200.0" font-size="12" text-anchor="middle" fill="#0d47a1" font-weight="normal">water drop (electrolyte: dissolved CO₂, salts)</text><path d="M400,300 C410,325 510,325 520,300 Z" fill="#78909c" stroke="#37474f" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="460.0" y="262.0" font-size="13" text-anchor="middle" fill="#b71c1c" font-weight="bold">ANODE (O₂-poor)</text><text x="460.0" y="280.0" font-size="12" text-anchor="middle" fill="#b71c1c" font-weight="normal">Fe → Fe²⁺ + 2e⁻   (oxidation)</text><text x="290.0" y="262.0" font-size="12" text-anchor="middle" fill="#1b5e20" font-weight="bold">CATHODE</text><text x="290.0" y="278.0" font-size="11" text-anchor="middle" fill="#1b5e20" font-weight="normal">(O₂-rich)</text><text x="630.0" y="262.0" font-size="12" text-anchor="middle" fill="#1b5e20" font-weight="bold">CATHODE</text><text x="630.0" y="278.0" font-size="11" text-anchor="middle" fill="#1b5e20" font-weight="normal">(O₂-rich)</text><line x1="290.0" y1="110.0" x2="290.0" y2="180.0" stroke="#1b5e20" stroke-width="3" marker-end="url(#m1b5e20)" stroke-linecap="round"/><line x1="630.0" y1="110.0" x2="630.0" y2="180.0" stroke="#1b5e20" stroke-width="3" marker-end="url(#m1b5e20)" stroke-linecap="round"/><text x="290.0" y="100.0" font-size="12" text-anchor="middle" fill="#1b5e20" font-weight="bold">O₂ from air</text><text x="630.0" y="100.0" font-size="12" text-anchor="middle" fill="#1b5e20" font-weight="bold">O₂ from air</text><line x1="440.0" y1="340.0" x2="310.0" y2="340.0" stroke="#e65100" stroke-width="3" marker-end="url(#me65100)" stroke-linecap="round"/><line x1="480.0" y1="340.0" x2="610.0" y2="340.0" stroke="#e65100" stroke-width="3" marker-end="url(#me65100)" stroke-linecap="round"/><text x="375.0" y="360.0" font-size="13" text-anchor="middle" fill="#e65100" font-weight="bold">e⁻</text><text x="545.0" y="360.0" font-size="13" text-anchor="middle" fill="#e65100" font-weight="bold">e⁻</text><line x1="450.0" y1="296.0" x2="360.0" y2="222.0" stroke="#b71c1c" stroke-width="1.8" marker-end="url(#mb71c1c)" stroke-linecap="round"/><text x="380.0" y="215.0" font-size="12" text-anchor="start" fill="#b71c1c" font-weight="bold">Fe²⁺</text><line x1="300.0" y1="296.0" x2="355.0" y2="225.0" stroke="#1b5e20" stroke-width="1.8" marker-end="url(#m1b5e20)" stroke-linecap="round"/><text x="325.0" y="235.0" font-size="12" text-anchor="start" fill="#1b5e20" font-weight="bold">OH⁻</text><circle cx="350.0" cy="296.0" r="5.0" fill="#8d4a1c" stroke="#5d2a0c" stroke-width="1"/><circle cx="365.0" cy="292.0" r="5.0" fill="#8d4a1c" stroke="#5d2a0c" stroke-width="1"/><circle cx="375.0" cy="297.0" r="5.0" fill="#8d4a1c" stroke="#5d2a0c" stroke-width="1"/><circle cx="545.0" cy="296.0" r="5.0" fill="#8d4a1c" stroke="#5d2a0c" stroke-width="1"/><circle cx="560.0" cy="292.0" r="5.0" fill="#8d4a1c" stroke="#5d2a0c" stroke-width="1"/><circle cx="572.0" cy="297.0" r="5.0" fill="#8d4a1c" stroke="#5d2a0c" stroke-width="1"/><text x="360.0" y="318.0" font-size="11" text-anchor="middle" fill="#8d4a1c" font-weight="bold">rust ring</text><text x="560.0" y="318.0" font-size="11" text-anchor="middle" fill="#8d4a1c" font-weight="bold">rust ring</text><rect x="60.0" y="395.0" width="800.0" height="90.0" rx="6" fill="#fffde7" stroke="#f9a825" stroke-width="1.5"/><text x="76.0" y="418.0" font-size="12.5" text-anchor="start" fill="#222" font-weight="normal">Cathode:   O₂ + 2H₂O + 4e⁻ → 4OH⁻</text><text x="76.0" y="440.0" font-size="12.5" text-anchor="start" fill="#222" font-weight="normal">Overall:     2Fe + O₂ + 2H₂O → 2Fe(OH)₂      then      4Fe(OH)₂ + O₂ + 2H₂O → 4Fe(OH)₃</text><text x="76.0" y="462.0" font-size="12.5" text-anchor="start" fill="#222" font-weight="normal">Rust:        Fe(OH)₃ → Fe₂O₃·xH₂O  (hydrated iron(III) oxide, flaky and non-protective)</text></svg>