<svg viewBox="0 0 500 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
  <style>.lbl{font-size:13px;fill:#111827;}</style>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/></marker></defs>
  <line x1="40" y1="130" x2="460" y2="130" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
  <text x="400" y="120" class="lbl" fill="#2563eb">B</text>
  <g transform="translate(250,130) rotate(-35)">
    <rect x="-70" y="-40" width="140" height="80" fill="none" stroke="#111827" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="-90" stroke="#dc2626" stroke-width="2" marker-end="url(#a)"/>
    <text x="8" y="-80" class="lbl" fill="#dc2626">m</text>
    <line x1="70" y1="-40" x2="70" y2="40" stroke="#059669" stroke-width="3"/>
    <line x1="-70" y1="-40" x2="-70" y2="40" stroke="#059669" stroke-width="3"/>
  </g>
  <text x="60" y="30" class="lbl">theta = angle between m and B; couple on the two green sides gives torque</text>
</svg>
