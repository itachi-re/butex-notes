<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img" aria-label="Thermodynamic square with corners V, T, S, P and sides F, G, H, U giving the four Maxwell relations" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Thermodynamic square with corners V, T, S, P and sides F, G, H, U giving the four Maxwell relations</title>
<defs>
<marker id="a222222" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker>
<marker id="s222222" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#222222"/></marker>
<marker id="a1f5fbf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker>
<marker id="s1f5fbf" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f5fbf"/></marker>
<marker id="ac0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
<marker id="sc0392b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker>
<marker id="a2e7d32" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
<marker id="s2e7d32" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e7d32"/></marker>
<marker id="a777777" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#777777"/></marker>
<marker id="s777777" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#777777"/></marker>
</defs>
<rect x="0" y="0" width="880" height="440" fill="#ffffff"/>
<text x="65.4" y="34.0" font-size="18" fill="#222222" font-weight="bold" font-style="normal"><tspan>Thermodynamic square (Maxwell relations)</tspan></text>
<rect x="130" y="100" width="250" height="250" rx="0" fill="none" fill-opacity="1" stroke="#222222" stroke-width="3"/>
<line x1="130.0" y1="350.0" x2="380.0" y2="100.0" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 5" stroke-linecap="round"/>
<line x1="130.0" y1="100.0" x2="380.0" y2="350.0" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 5" stroke-linecap="round"/>
<circle cx="130.0" cy="100.0" r="6" fill="#222222"/>
<circle cx="380.0" cy="100.0" r="6" fill="#222222"/>
<circle cx="130.0" cy="350.0" r="6" fill="#222222"/>
<circle cx="380.0" cy="350.0" r="6" fill="#222222"/>
<text x="101.3" y="102.0" font-size="22" fill="#222222" font-weight="bold" font-style="normal"><tspan>V</tspan></text>
<text x="394.0" y="102.0" font-size="22" fill="#222222" font-weight="bold" font-style="normal"><tspan>T</tspan></text>
<text x="101.3" y="358.0" font-size="22" fill="#222222" font-weight="bold" font-style="normal"><tspan>S</tspan></text>
<text x="394.0" y="358.0" font-size="22" fill="#222222" font-weight="bold" font-style="normal"><tspan>P</tspan></text>
<text x="248.3" y="132.0" font-size="22" fill="#1f5fbf" font-weight="bold" font-style="normal"><tspan>F</tspan></text>
<text x="338.9" y="233.0" font-size="22" fill="#1f5fbf" font-weight="bold" font-style="normal"><tspan>G</tspan></text>
<text x="247.1" y="330.0" font-size="22" fill="#1f5fbf" font-weight="bold" font-style="normal"><tspan>H</tspan></text>
<text x="154.0" y="233.0" font-size="22" fill="#1f5fbf" font-weight="bold" font-style="normal"><tspan>U</tspan></text>
<text x="70.3" y="396.0" font-size="15" fill="#222222" font-weight="normal" font-style="normal"><tspan>Side = potential; its two corners = its natural variables.</tspan></text>
<text x="150.4" y="418.0" font-size="15" fill="#222222" font-weight="normal" font-style="normal"><tspan>U(S,V)  F(T,V)  G(T,P)  H(S,P)</tspan></text>
<text x="480.0" y="64.0" font-size="17" fill="#222222" font-weight="bold" font-style="normal"><tspan>Differentials</tspan></text>
<text x="480.0" y="94.0" font-size="16" fill="#222222" font-weight="normal" font-style="normal"><tspan>dU = T dS − P dV</tspan></text>
<text x="480.0" y="122.0" font-size="16" fill="#222222" font-weight="normal" font-style="normal"><tspan>dH = T dS + V dP</tspan></text>
<text x="480.0" y="150.0" font-size="16" fill="#222222" font-weight="normal" font-style="normal"><tspan>dF = −S dT − P dV</tspan></text>
<text x="480.0" y="178.0" font-size="16" fill="#222222" font-weight="normal" font-style="normal"><tspan>dG = −S dT + V dP</tspan></text>
<text x="480.0" y="232.0" font-size="17" fill="#222222" font-weight="bold" font-style="normal"><tspan>Maxwell relations</tspan></text>
<text x="480.0" y="262.0" font-size="16" fill="#222222" font-weight="normal" font-style="normal"><tspan>(∂T/∂V)</tspan><tspan dy="4" font-size="14">S</tspan><tspan dy="-4"> = −(∂P/∂S)</tspan><tspan dy="4" font-size="14">V</tspan></text>
<text x="730.0" y="262.0" font-size="15" fill="#1f5fbf" font-weight="normal" font-style="normal"><tspan>from U</tspan></text>
<text x="480.0" y="292.0" font-size="16" fill="#222222" font-weight="normal" font-style="normal"><tspan>(∂T/∂P)</tspan><tspan dy="4" font-size="14">S</tspan><tspan dy="-4"> = (∂V/∂S)</tspan><tspan dy="4" font-size="14">P</tspan></text>
<text x="730.0" y="292.0" font-size="15" fill="#1f5fbf" font-weight="normal" font-style="normal"><tspan>from H</tspan></text>
<text x="480.0" y="322.0" font-size="16" fill="#222222" font-weight="normal" font-style="normal"><tspan>(∂S/∂V)</tspan><tspan dy="4" font-size="14">T</tspan><tspan dy="-4"> = (∂P/∂T)</tspan><tspan dy="4" font-size="14">V</tspan></text>
<text x="730.0" y="322.0" font-size="15" fill="#1f5fbf" font-weight="normal" font-style="normal"><tspan>from F</tspan></text>
<text x="480.0" y="352.0" font-size="16" fill="#222222" font-weight="normal" font-style="normal"><tspan>(∂S/∂P)</tspan><tspan dy="4" font-size="14">T</tspan><tspan dy="-4"> = −(∂V/∂T)</tspan><tspan dy="4" font-size="14">P</tspan></text>
<text x="730.0" y="352.0" font-size="15" fill="#1f5fbf" font-weight="normal" font-style="normal"><tspan>from G</tspan></text>
</svg>
