<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" width="980" height="430" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Process annealing flow" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Process annealing flow</title><desc>Cold work, process annealing, recrystallization, restored ductility</desc><defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker><pattern id="lam" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#f3e3c3"/><line x1="0" y1="3" x2="6" y2="3" stroke="#6b3d10" stroke-width="1.6"/></pattern><pattern id="lamf" width="3.5" height="3.5" patternUnits="userSpaceOnUse"><rect width="3.5" height="3.5" fill="#f3e3c3"/><line x1="0" y1="1.7" x2="3.5" y2="1.7" stroke="#6b3d10" stroke-width="1.2"/></pattern><pattern id="lamc" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f3e3c3"/><line x1="0" y1="5" x2="10" y2="5" stroke="#6b3d10" stroke-width="2.2"/></pattern></defs><rect width="100%" height="100%" fill="#fff"/><text x="490.0" y="26" font-size="17" text-anchor="middle" fill="#0b2a55" font-weight="bold"><tspan x="490.0" dy="0.0">Process Annealing: Cold Work → Recrystallization → Restored Ductility</tspan></text><text x="490.0" y="44" font-size="11.5" text-anchor="middle" fill="#555" font-style="italic"><tspan x="490.0" dy="0.0">Schematic – not to scale</tspan></text><rect x="25" y="70" width="200" height="90" rx="8" fill="#fdd9d9" stroke="#1a3c6e" stroke-width="1.6"/><text x="125.0" y="103.75" font-size="12.5" text-anchor="middle" fill="#111"><tspan x="125.0" dy="0.0">COLD WORKING</tspan><tspan x="125.0" dy="15.6">(sheet / wire drawing)</tspan><tspan x="125.0" dy="15.6">hardness ↑ ductility ↓</tspan></text><line x1="225" y1="115" x2="265" y2="115" stroke="#333" stroke-width="2" marker-end="url(#ar)"/><rect x="265" y="70" width="200" height="90" rx="8" fill="#fde8d0" stroke="#1a3c6e" stroke-width="1.6"/><text x="365.0" y="103.75" font-size="12.5" text-anchor="middle" fill="#111"><tspan x="365.0" dy="0.0">PROCESS ANNEAL</tspan><tspan x="365.0" dy="15.6">below lower critical</tspan><tspan x="365.0" dy="15.6">1000–1250 °F</tspan></text><line x1="465" y1="115" x2="505" y2="115" stroke="#333" stroke-width="2" marker-end="url(#ar)"/><rect x="505" y="70" width="200" height="90" rx="8" fill="#fff3b0" stroke="#1a3c6e" stroke-width="1.6"/><text x="605.0" y="103.75" font-size="12.5" text-anchor="middle" fill="#111"><tspan x="605.0" dy="0.0">RECRYSTALLIZATION</tspan><tspan x="605.0" dy="15.6">new strain-free</tspan><tspan x="605.0" dy="15.6">equiaxed grains</tspan></text><line x1="705" y1="115" x2="745" y2="115" stroke="#333" stroke-width="2" marker-end="url(#ar)"/><rect x="745" y="70" width="200" height="90" rx="8" fill="#d9f2e6" stroke="#1a3c6e" stroke-width="1.6"/><text x="845.0" y="103.75" font-size="12.5" text-anchor="middle" fill="#111"><tspan x="845.0" dy="0.0">SOFT, DUCTILE</tspan><tspan x="845.0" dy="15.6">ready for further</tspan><tspan x="845.0" dy="15.6">working</tspan></text><text x="120" y="200" font-size="12" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="120" dy="0.0">Elongated, distorted grains</tspan></text><ellipse cx="50" cy="235" rx="14" ry="30" fill="#dfe9f7" stroke="#555"/><ellipse cx="82" cy="247" rx="14" ry="30" fill="#dfe9f7" stroke="#555"/><ellipse cx="114" cy="235" rx="14" ry="30" fill="#dfe9f7" stroke="#555"/><ellipse cx="146" cy="247" rx="14" ry="30" fill="#dfe9f7" stroke="#555"/><ellipse cx="178" cy="235" rx="14" ry="30" fill="#dfe9f7" stroke="#555"/><ellipse cx="210" cy="247" rx="14" ry="30" fill="#dfe9f7" stroke="#555"/><text x="600" y="200" font-size="12" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="600" dy="0.0">New equiaxed grains</tspan></text><circle cx="520" cy="232" r="17" fill="#e6f5d0" stroke="#555"/><circle cx="520" cy="272" r="17" fill="#e6f5d0" stroke="#555"/><circle cx="560" cy="232" r="17" fill="#e6f5d0" stroke="#555"/><circle cx="560" cy="272" r="17" fill="#e6f5d0" stroke="#555"/><circle cx="600" cy="232" r="17" fill="#e6f5d0" stroke="#555"/><circle cx="600" cy="272" r="17" fill="#e6f5d0" stroke="#555"/><circle cx="640" cy="232" r="17" fill="#e6f5d0" stroke="#555"/><circle cx="640" cy="272" r="17" fill="#e6f5d0" stroke="#555"/><rect x="20" y="320" width="940" height="90" fill="#fafafa" stroke="#999" stroke-width="1.2" opacity="1"/><text x="35" y="345" font-size="13" text-anchor="start" fill="#111" font-weight="bold"><tspan x="35" dy="0.0">Key ideas:</tspan></text><text x="35" y="366" font-size="12.5" text-anchor="start" fill="#111"><tspan x="35" dy="0.0">• Softening by recrystallization – ductility restored so the metal can be worked further.</tspan></text><text x="35" y="386" font-size="12.5" text-anchor="start" fill="#111"><tspan x="35" dy="0.0">• Used in sheet and wire industries; typically for low-carbon steels; temperature stays below the lower critical line (no austenite).</tspan></text><text x="35" y="404" font-size="12.5" text-anchor="start" fill="#111"><tspan x="35" dy="0.0">• Very similar cycle to stress-relief annealing; the goal differs (restore ductility vs remove residual stress).</tspan></text></svg>