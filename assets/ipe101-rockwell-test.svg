<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" font-family="DejaVu Sans, Verdana, Arial, sans-serif" role="img" aria-label="Rockwell hardness test: depth-measuring method"><title>Rockwell hardness test: depth-measuring method</title><defs><marker id="md62828" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#d62828"/></marker></defs><rect width="1000" height="420" fill="#ffffff"/><text x="500.0" y="28.0" font-size="17" text-anchor="middle" fill="#222" font-weight="bold">Rockwell hardness test: depth-measuring method</text><text x="500.0" y="46.0" font-size="12" text-anchor="middle" fill="#555" font-weight="normal">indenter: diamond cone 120° (C, A, D scales) or ball (B, F, G scales)</text><rect x="40.0" y="250.0" width="280.0" height="80.0" rx="0" fill="#cfd8dc" stroke="#37474f" stroke-width="2"/><polygon points="171.9,250.0 188.1,250.0 180.0,264.0" fill="#ffffff" stroke="#37474f" stroke-width="1.5" stroke-linejoin="round"/><polygon points="160.0,198.0 200.0,198.0 200.0,242.0 185.0,264.0 175.0,264.0 160.0,242.0" fill="#78909c" fill-opacity="0.9" stroke="#263238" stroke-width="1.5" stroke-linejoin="round"/><line x1="180.0" y1="90.0" x2="180.0" y2="196.0" stroke="#d62828" stroke-width="3" marker-end="url(#md62828)" stroke-linecap="round"/><text x="190.0" y="112.0" font-size="14" text-anchor="start" fill="#d62828" font-weight="bold">F₀</text><text x="180.0" y="70.0" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">① minor load F₀ = 10 kgf</text><text x="180.0" y="355.0" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">sets zero datum (seats the indenter)</text><line x1="35.0" y1="264.0" x2="325.0" y2="264.0" stroke="#2a9d8f" stroke-width="1" stroke-dasharray="5 3" stroke-linecap="round"/><rect x="360.0" y="250.0" width="280.0" height="80.0" rx="0" fill="#cfd8dc" stroke="#37474f" stroke-width="2"/><polygon points="468.1,250.0 531.9,250.0 500.0,305.0" fill="#ffffff" stroke="#37474f" stroke-width="1.5" stroke-linejoin="round"/><polygon points="480.0,239.0 520.0,239.0 520.0,283.0 505.0,305.0 495.0,305.0 480.0,283.0" fill="#78909c" fill-opacity="0.9" stroke="#263238" stroke-width="1.5" stroke-linejoin="round"/><line x1="500.0" y1="90.0" x2="500.0" y2="237.0" stroke="#d62828" stroke-width="3" marker-end="url(#md62828)" stroke-linecap="round"/><text x="510.0" y="112.0" font-size="14" text-anchor="start" fill="#d62828" font-weight="bold">F₀ + F₁</text><text x="500.0" y="70.0" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">② major load F₁ added</text><text x="500.0" y="355.0" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">total load F₀ + F₁ (60 / 100 / 150 kgf)</text><line x1="355.0" y1="264.0" x2="645.0" y2="264.0" stroke="#2a9d8f" stroke-width="1" stroke-dasharray="5 3" stroke-linecap="round"/><rect x="680.0" y="250.0" width="280.0" height="80.0" rx="0" fill="#cfd8dc" stroke="#37474f" stroke-width="2"/><polygon points="802.6,250.0 837.4,250.0 820.0,280.0" fill="#ffffff" stroke="#37474f" stroke-width="1.5" stroke-linejoin="round"/><polygon points="800.0,214.0 840.0,214.0 840.0,258.0 825.0,280.0 815.0,280.0 800.0,258.0" fill="#78909c" fill-opacity="0.9" stroke="#263238" stroke-width="1.5" stroke-linejoin="round"/><line x1="820.0" y1="90.0" x2="820.0" y2="212.0" stroke="#d62828" stroke-width="3" marker-end="url(#md62828)" stroke-linecap="round"/><text x="830.0" y="112.0" font-size="14" text-anchor="start" fill="#d62828" font-weight="bold">F₀</text><text x="820.0" y="70.0" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">③ F₁ removed, F₀ remains</text><text x="820.0" y="355.0" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">permanent depth e is read on the dial</text><line x1="675.0" y1="264.0" x2="965.0" y2="264.0" stroke="#2a9d8f" stroke-width="1" stroke-dasharray="5 3" stroke-linecap="round"/><text x="45.0" y="280.0" font-size="11" text-anchor="start" fill="#2a9d8f" font-weight="normal">datum</text><line x1="715.0" y1="264.0" x2="965.0" y2="264.0" stroke="#2a9d8f" stroke-width="1" stroke-dasharray="5 3" stroke-linecap="round"/><line x1="930.0" y1="272.0" x2="930.0" y2="264.0" stroke="#d62828" stroke-width="1.2" marker-end="url(#md62828)" stroke-linecap="round"/><line x1="930.0" y1="272.0" x2="930.0" y2="280.0" stroke="#d62828" stroke-width="1.2" marker-end="url(#md62828)" stroke-linecap="round"/><text x="938.0" y="280.0" font-size="14" text-anchor="start" fill="#d62828" font-weight="bold">e</text><text x="500.0" y="395.0" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">HR = N − e / 0.002 mm      (N = 100 for diamond cone, 130 for ball indenters)</text></svg>