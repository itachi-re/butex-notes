<text x="410.0" y="270.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" font-style="normal" fill="#666666" text-anchor="middle">...—O— repeats to give a long, linear, unbranched chain</text>
<text x="410.0" y="288.5" font-family="DejaVu Sans" font-size="11.5" font-weight="normal" font-style="italic" fill="#666666" text-anchor="middle">β-linkage lets neighbouring chains lie flat and hydrogen-bond extensively side-by-side, giving cellulose's rigid, fibrous,</text>
<text x="410.0" y="304.0" font-family="DejaVu Sans" font-size="11.5" font-weight="normal" font-style="italic" fill="#666666" text-anchor="middle">linear character (unlike the helical α-linked chains of starch).</text>
