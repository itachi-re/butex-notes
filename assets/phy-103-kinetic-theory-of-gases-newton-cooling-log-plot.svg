<text x="450.0" y="36" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#263238" text-anchor="middle" font-weight="bold">Logarithmic form of Newton cooling</text>
<line x1="120" y1="430" x2="800" y2="430" stroke="#263238" stroke-width="2" marker-end="url(#arrow)"/><line x1="120" y1="430" x2="120" y2="90" stroke="#263238" stroke-width="2" marker-end="url(#arrow)"/><text x="82" y="100" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#263238" text-anchor="middle" font-weight="normal">ln(T − T₀)</text><text x="805" y="455" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#263238" text-anchor="middle" font-weight="normal">t</text><line x1="160" y1="120" x2="720" y2="405" stroke="#1976D2" stroke-width="4"/><text x="470" y="145" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1976D2" text-anchor="middle" font-weight="normal">slope = −k</text><text x="160" y="405" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#263238" text-anchor="middle" font-weight="normal">0</text><text x="770" y="405" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#263238" text-anchor="middle" font-weight="normal">t</text><text x="500" y="485" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#263238" text-anchor="middle" font-weight="normal">Straight line confirms exponential cooling.</text>
