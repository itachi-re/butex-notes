<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" font-family="Helvetica,Arial,sans-serif">
  <rect width="780" height="320" fill="#ffffff"/>
  <text x="390" y="28" text-anchor="middle" font-size="18" font-weight="bold">Open, Closed, and Isolated Systems</text>

  <!-- Open system -->
  <g>
    <rect x="30" y="60" width="220" height="200" fill="#eef3ff" stroke="#2255aa" stroke-width="2"/>
    <text x="140" y="85" text-anchor="middle" font-size="14" font-weight="bold">Open System</text>
    <line x1="10" y1="130" x2="30" y2="130" stroke="#333" stroke-width="2" marker-end="url(#a1)"/>
    <text x="0" y="120" font-size="10">matter</text>
    <line x1="250" y1="130" x2="270" y2="130" stroke="#333" stroke-width="2" marker-end="url(#a1)"/>
    <line x1="10" y1="190" x2="30" y2="190" stroke="#c0392b" stroke-width="2" marker-end="url(#a1)"/>
    <text x="0" y="180" font-size="10">Q</text>
    <line x1="250" y1="190" x2="270" y2="190" stroke="#1e8449" stroke-width="2" marker-end="url(#a1)"/>
    <text x="255" y="180" font-size="10">W</text>
    <text x="140" y="245" text-anchor="middle" font-size="11">Exchanges BOTH</text>
    <text x="140" y="258" text-anchor="middle" font-size="11">matter and energy</text>
  </g>

  <!-- Closed system -->
  <g>
    <rect x="280" y="60" width="220" height="200" fill="#fff7e6" stroke="#cc7a00" stroke-width="2"/>
    <text x="390" y="85" text-anchor="middle" font-size="14" font-weight="bold">Closed System</text>
    <line x1="530" y1="130" x2="550" y2="130" stroke="#c0392b" stroke-width="2" marker-end="url(#a1)"/>
    <text x="535" y="120" font-size="10">Q</text>
    <line x1="530" y1="190" x2="550" y2="190" stroke="#1e8449" stroke-width="2" marker-end="url(#a1)"/>
    <text x="535" y="180" font-size="10">W</text>
    <line x1="260" y1="160" x2="280" y2="160" stroke="#999" stroke-width="2"/>
    <line x1="270" y1="150" x2="270" y2="170" stroke="#999" stroke-width="2"/>
    <text x="390" y="245" text-anchor="middle" font-size="11">Exchanges energy ONLY</text>
    <text x="390" y="258" text-anchor="middle" font-size="11">(mass fixed)</text>
  </g>

  <!-- Isolated system -->
  <g>
    <rect x="530" y="60" width="220" height="200" fill="#eafaf1" stroke="#1e8449" stroke-width="2"/>
    <text x="640" y="85" text-anchor="middle" font-size="14" font-weight="bold">Isolated System</text>
    <text x="640" y="160" text-anchor="middle" font-size="11">No matter, no energy</text>
    <text x="640" y="175" text-anchor="middle" font-size="11">crosses the boundary</text>
    <text x="640" y="245" text-anchor="middle" font-size="11">U and mass strictly constant</text>
  </g>

  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
</svg>
