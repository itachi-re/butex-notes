elvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#1b2733" text-anchor="middle" >vapour</text><line x1="220.0" y1="240.0" x2="323.0" y2="240.0" stroke="#1b2733" stroke-width="2.4" /><polygon points="330.0,240.0 321.0,235.9 321.0,244.1" fill="#1b2733"/><text x="275.0" y="232.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#b32020" text-anchor="middle" >up to 170 °C</text><rect x="338.0" y="202.0" width="636.0" height="76.0" rx="12" fill="#fff7cf" stroke="#b59a63" stroke-width="1.4" /><text x="356.0" y="226.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.0" font-weight="700" fill="#17375e" text-anchor="start" >Light oil (benzol)</text><text x="356.0" y="246.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" fill="#1b2733" text-anchor="start" >benzene, toluene, xylenes</text><text x="356.0" y="265.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#6b3d00" text-anchor="start" >→ nitrobenzene, aniline, toluidines</text><line x1="220.0" y1="336.0" x2="323.0" y2="336.0" stroke="#1b2733" stroke-width="2.4" /><polygon points="330.0,336.0 321.0,331.9 321.0,340.1" fill="#1b2733"/><text x="275.0" y="328.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#b32020" text-anchor="middle" >170–230 °C</text><rect x="338.0" y="298.0" width="636.0" height="76.0" rx="12" fill="#ffeaa8" stroke="#b59a63" stroke-width="1.4" /><text x="356.0" y="322.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.0" font-weight="700" fill="#17375e" text-anchor="start" >Middle (carbolic) oil</text><text x="356.0" y="342.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" fill="#1b2733" text-anchor="start" >phenol, cresols, naphthalene, pyridine bases</text><text x="356.0" y="361.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#6b3d00" text-anchor="start" >→ phenol, picric acid, naphthalene products</text><line x1="220.0" y1="432.0" x2="323.0" y2="432.0" stroke="#1b2733" stroke-width="2.4" /><polygon points="330.0,432.0 321.0,427.9 321.0,436.1" fill="#1b2733"/><text x="275.0" y="424.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#b32020" text-anchor="middle" >230–270 °C</text><rect x="338.0" y="394.0" width="636.0" height="76.0" rx="12" fill="#f8d58a" stroke="#b59a63" stroke-width="1.4" /><text x="356.0" y="418.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.0" font-weight="700" fill="#17375e" text-anchor="start" >Heavy (creosote) oil</text><text x="356.0" y="438.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" fill="#1b2733" text-anchor="start" >naphthalene, methylnaphthalenes, quinoline, cresols</text><text x="356.0" y="457.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#6b3d00" text-anchor="start" >→ β-naphthol, naphthylamines, naphthionic acid</text><line x1="220.0" y1="528.0" x2="323.0" y2="528.0" stroke="#1b2733" stroke-width="2.4" /><polygon points="330.0,528.0 321.0,524.0 321.0,532.0" fill="#1b2733"/><text x="275.0" y="520.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#b32020" text-anchor="middle" >270–360 °C</text><rect x="338.0" y="490.0" width="636.0" height="76.0" rx="12" fill="#e9b96b" stroke="#b59a63" stroke-width="1.4" /><text x="356.0" y="514.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.0" font-weight="700" fill="#17375e" text-anchor="start" >Anthracene (green) oil</text><text x="356.0" y="534.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" fill="#1b2733" text-anchor="start" >anthracene, phenanthrene, carbazole</text><text x="356.0" y="553.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#6b3d00" text-anchor="start" >→ anthraquinone → alizarin, vat dyes; carbazole dyes</text><line x1="220.0" y1="624.0" x2="323.0" y2="624.0" stroke="#1b2733" stroke-width="2.4" /><polygon points="330.0,624.0 321.0,620.0 321.0,628.0" fill="#1b2733"/><text x="275.0" y="616.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#b32020" text-anchor="middle" >&gt; 360 °C</text><rect x="338.0" y="586.0" width="636.0" height="76.0" rx="12" fill="#c9a47a" stroke="#b59a63" stroke-width="1.4" /><text x="356.0" y="610.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.0" font-weight="700" fill="#17375e" text-anchor="start" >Pitch (residue, ≈ 50 %)</text><text x="356.0" y="630.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" fill="#1b2733" text-anchor="start" >roofing, road tar, electrode binder</text><text x="356.0" y="649.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#6b3d00" text-anchor="start" >not used for dyes</text></svg>