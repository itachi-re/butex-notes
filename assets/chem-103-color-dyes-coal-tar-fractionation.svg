<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-label="Coal tar fractional distillation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Coal tar fractional distillation</title><desc>Flow from coal through carbonisation to coal tar and its distillation fractions with their dye-related products</desc><rect width="1000" height="720" fill="#ffffff"/><path d="M1,66 V15 Q1,1 15,1 H985 Q999,1 999,15 V66 Z" fill="#17375e"/><rect x="1" y="1" width="998" height="718" rx="14" fill="none" stroke="#cfd8e3" stroke-width="2"/><text x="24.0" y="31.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20.0" font-weight="700" fill="#ffffff" text-anchor="start" >Coal tar: the main source of dye raw materials</text><text x="24.0" y="53.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" fill="#c9d6e6" text-anchor="start" >Fractional distillation separates the crudes by boiling range</text><text x="982.0" y="710.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#8fa0b3" text-anchor="end" >CHEM-103 · Colour, Dyes &amp; Pigments</text><rect x="24.0" y="84.0" width="130.0" height="62.0" rx="10" fill="#eef4ff" stroke="#8fa9d6" stroke-width="1.4" /><text x="89.0" y="120.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="600" fill="#1b2733" text-anchor="middle" >Coal</text><line x1="158.0" y1="115.0" x2="177.0" y2="115.0" stroke="#1b2733" stroke-width="2.2" /><polygon points="184.0,115.0 175.0,111.0 175.0,119.0" fill="#1b2733"/><rect x="190.0" y="84.0" width="200.0" height="62.0" rx="10" fill="#eef4ff" stroke="#8fa9d6" stroke-width="1.4" /><text x="290.0" y="110.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="600" fill="#1b2733" text-anchor="middle" >Carbonisation</text><text x="290.0" y="125.4" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="600" fill="#1b2733" text-anchor="middle" >(coke ovens, 1000–1300 °C,</text><text x="290.0" y="140.7" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="600" fill="#1b2733" text-anchor="middle" >no air)</text><line x1="394.0" y1="115.0" x2="407.0" y2="115.0" stroke="#1b2733" stroke-width="2.2" /><polygon points="414.0,115.0 405.0,111.0 405.0,119.0" fill="#1b2733"/><rect x="420.0" y="84.0" width="200.0" height="62.0" rx="10" fill="#eef4ff" stroke="#8fa9d6" stroke-width="1.4" /><text x="520.0" y="110.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="600" fill="#1b2733" text-anchor="middle" >Coal tar (≈ 3–4 % of coal)</text><text x="520.0" y="125.4" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="600" fill="#1b2733" text-anchor="middle" >+ coke + coal gas</text><text x="520.0" y="140.7" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="600" fill="#1b2733" text-anchor="middle" >+ ammoniacal liquor</text><line x1="624.0" y1="115.0" x2="697.0" y2="115.0" stroke="#1b2733" stroke-width="2.2" /><polygon points="704.0,115.0 695.0,111.0 695.0,119.0" fill="#1b2733"/><rect x="710.0" y="84.0" width="200.0" height="62.0" rx="10" fill="#eef4ff" stroke="#8fa9d6" stroke-width="1.4" /><text x="810.0" y="110.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="600" fill="#1b2733" text-anchor="middle" >Fractional distillation</text><text x="810.0" y="125.4" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="600" fill="#1b2733" text-anchor="middle" >of the tar</text><rect x="70.0" y="176.0" width="150.0" height="506.0" rx="22" fill="#e8ee