<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="640" height="240" fill="#ffffff"/>
<text x="320" y="24" text-anchor="middle" font-size="16" font-weight="bold">Peptide (Amide) Bond Formation: Gly + Ala &#8594; Gly-Ala</text>

<text x="140" y="65" text-anchor="middle" font-size="14">H&#8322;N&#8211;CH&#8322;&#8211;COOH</text>
<text x="140" y="85" text-anchor="middle" font-size="12" fill="#555">Glycine (R = H)</text>

<text x="180" y="65" font-size="20">+</text>

<text x="330" y="65" text-anchor="middle" font-size="14">H&#8322;N&#8211;CH(CH&#8323;)&#8211;COOH</text>
<text x="330" y="85" text-anchor="middle" font-size="12" fill="#555">Alanine (R = CH&#8323;)</text>

<line x1="250" y1="110" x2="250" y2="140" stroke="#333" stroke-width="2" marker-end="url(#a3)"/>
<text x="300" y="130" font-size="12">&#8722; H&#8322;O (condensation)</text>

<rect x="60" y="150" width="500" height="60" rx="6" fill="#e8ffe8" stroke="#2e7d32"/>
<text x="310" y="172" text-anchor="middle" font-size="15">H&#8322;N&#8211;CH&#8322;&#8211;CO&#8211;NH&#8211;CH(CH&#8323;)&#8211;COOH</text>
<text x="310" y="192" text-anchor="middle" font-size="12">peptide (amide) bond &#8595; here: &#8211;CO&#8211;NH&#8211;   (Gly-Ala dipeptide)</text>
<line x1="235" y1="172" x2="275" y2="172" stroke="#a83232" stroke-width="3"/>

<text x="20" y="230" font-size="11" fill="#555">The &#8211;COOH of Gly condenses with the &#8211;NH&#8322; of Ala, expelling water and forming the &#8211;CO&#8211;NH&#8211; (peptide) linkage.</text>

<defs><marker id="a3" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#333"/></marker></defs>
</svg>
