<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#263238"/></marker><marker id="blueArrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#1976D2"/></marker></defs>
<rect x="0" y="0" width="900" height="520" fill="#FFFFFF"/>
<text x="450.0" y="36" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#263238" text-anchor="middle" font-weight="bold">Isobaric expansion and translational kinetic energy</text>
<text x="450" y="80" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#263238" text-anchor="middle" font-weight="normal">Isobaric expansion: pressure stays constant while the gas warms</text><rect x="90" y="150" width="330" height="265" rx="10" fill="#FFFFFF" stroke="#1976D2" stroke-width="3"/><rect x="105" y="285" width="300" height="115" rx="3" fill="#FFFFFF" stroke="#1976D2" stroke-width="0"/><line x1="90" y1="285" x2="420" y2="285" stroke="#263238" stroke-width="4"/><text x="255" y="130" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1976D2" text-anchor="middle" font-weight="normal">Initial state (V₁,T₁)</text><line x1="255" y1="285" x2="255" y2="170" stroke="#EF6C00" stroke-width="3" marker-end="url(#arrow)"/><text x="255" y="165" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#EF6C00" text-anchor="middle" font-weight="normal">piston rises</text><circle cx="150" cy="330" r="6" fill="#1976D2" stroke="#263238" stroke-width="1.5"/><line x1="150" y1="330" x2="168" y2="320" stroke="#1976D2" stroke-width="2" marker-end="url(#arrow)"/><circle cx="220" cy="350" r="6" fill="#1976D2" stroke="#263238" stroke-width="1.5"/><line x1="220" y1="350" x2="238" y2="340" stroke="#1976D2" stroke-width="2" marker-end="url(#arrow)"/><circle cx="285" cy="325" r="6" fill="#1976D2" stroke="#263238" stroke-width="1.5"/><line x1="285" y1="325" x2="303" y2="315" stroke="#1976D2" stroke-width="2" marker-end="url(#arrow)"/><circle cx="360" cy="350" r="6" fill="#1976D2" stroke="#263238" stroke-width="1.5"/><line x1="360" y1="350" x2="378" y2="340" stroke="#1976D2" stroke-width="2" marker-end="url(#arrow)"/><circle cx="180" cy="375" r="6" fill="#1976D2" stroke="#263238" stroke-width="1.5"/><line x1="180" y1="375" x2="198" y2="365" stroke="#1976D2" stroke-width="2" marker-end="url(#arrow)"/><circle cx="330" cy="375" r="6" fill="#1976D2" stroke="#263238" stroke-width="1.5"/><line x1="330" y1="375" x2="348" y2="365" stroke="#1976D2" stroke-width="2" marker-end="url(#arrow)"/><rect x="500" y="150" width="310" height="265" rx="10" fill="#FFFFFF" stroke="#EF6C00" stroke-width="3"/><rect x="515" y="245" width="280" height="155" rx="3" fill="#FFFFFF" stroke="#EF6C00" stroke-width="0"/><line x1="500" y1="245" x2="810" y2="245" stroke="#263238" stroke-width="4"/><text x="655" y="130" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#EF6C00" text-anchor="middle" font-weight="normal">Final state (V₂,T₂)</text><text x="655" y="195" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#EF6C00" text-anchor="middle" font-weight="normal">P = constant</text><text x="655" y="355" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#263238" text-anchor="middle" font-weight="normal">W = P(V₂ − V₁)</text><text x="655" y="385" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1976D2" text-anchor="middle" font-weight="normal">= (2/3)ΔE_K</text><line x1="425" y1="280" x2="490" y2="280" stroke="#EF6C00" stroke-width="3" marker-end="url(#arrow)"/><text x="455" y="255" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#EF6C00" text-anchor="middle" font-weight="normal">heating</text>
</svg>