<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" role="img" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Compton shift versus scattering angle</title>
<desc>Graph of wavelength shift against scattering angle following lambda c times one minus cosine phi, zero at 0 degrees, lambda c at 90 degrees and 2 lambda c at 180 degrees.</desc>
<defs><marker id="ad" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 z" fill="#222222"/></marker><marker id="ab" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 z" fill="#1f5fbf"/></marker><marker id="ar" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 z" fill="#c0392b"/></marker><marker id="ag" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 z" fill="#2e7d32"/></marker></defs>
<rect x="0" y="0" width="720" height="460" fill="#ffffff"/>
<text x="20" y="30" text-anchor="start" font-size="18" fill="#222222" font-weight="bold"><tspan>Compton shift versus scattering angle</tspan></text>
<line x1="100.0" y1="380.0" x2="680.0" y2="380.0" stroke="#222222" stroke-width="2" marker-end="url(#ad)"/>
<line x1="100.0" y1="380.0" x2="100.0" y2="56.0" stroke="#222222" stroke-width="2" marker-end="url(#ad)"/>
<text x="112" y="66" text-anchor="start" font-size="17" fill="#222222" font-weight="normal"><tspan>Δλ = λ′ − λ</tspan></text>
<text x="680" y="438" text-anchor="end" font-size="17" fill="#222222" font-weight="normal"><tspan>Scattering angle φ</tspan></text>
<path d="M100.0,380.0 L109.0,379.8 L118.0,379.2 L127.0,378.3 L136.0,376.9 L145.0,375.2 L154.0,373.1 L163.0,370.7 L172.0,367.9 L181.0,364.7 L190.0,361.2 L199.0,357.4 L208.0,353.3 L217.0,348.8 L226.0,344.0 L235.0,339.0 L244.0,333.7 L253.0,328.1 L262.0,322.3 L271.0,316.2 L280.0,310.0 L289.0,303.6 L298.0,296.9 L307.0,290.2 L316.0,283.3 L325.0,276.2 L334.0,269.1 L343.0,261.9 L352.0,254.6 L361.0,247.3 L370.0,240.0 L379.0,232.7 L388.0,225.4 L397.0,218.1 L406.0,210.9 L415.0,203.8 L424.0,196.7 L433.0,189.8 L442.0,183.1 L451.0,176.4 L460.0,170.0 L469.0,163.8 L478.0,157.7 L487.0,151.9 L496.0,146.3 L505.0,141.0 L514.0,136.0 L523.0,131.2 L532.0,126.7 L541.0,122.6 L550.0,118.8 L559.0,115.3 L568.0,112.1 L577.0,109.3 L586.0,106.9 L595.0,104.8 L604.0,103.1 L613.0,101.7 L622.0,100.8 L631.0,100.2 L640.0,100.0" fill="none" stroke="#1f5fbf" stroke-width="3.5"/>
<line x1="100.0" y1="375.0" x2="100.0" y2="386.0" stroke="#222222" stroke-width="2"/>
<text x="100.0" y="408" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal"><tspan>0°</tspan></text>
<line x1="235.0" y1="375.0" x2="235.0" y2="386.0" stroke="#222222" stroke-width="2"/>
<text x="235.0" y="408" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal"><tspan>45°</tspan></text>
<line x1="370.0" y1="375.0" x2="370.0" y2="386.0" stroke="#222222" stroke-width="2"/>
<text x="370.0" y="408" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal"><tspan>90°</tspan></text>
<line x1="505.0" y1="375.0" x2="505.0" y2="386.0" stroke="#222222" stroke-width="2"/>
<text x="505.0" y="408" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal"><tspan>135°</tspan></text>
<line x1="640.0" y1="375.0" x2="640.0" y2="386.0" stroke="#222222" stroke-width="2"/>
<text x="640.0" y="408" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal"><tspan>180°</tspan></text>
<line x1="94.0" y1="380.0" x2="105.0" y2="380.0" stroke="#222222" stroke-width="2"/>
<text x="88" y="386" text-anchor="end" font-size="16" fill="#222222" font-weight="normal"><tspan>0</tspan></text>
<line x1="94.0" y1="240.0" x2="105.0" y2="240.0" stroke="#222222" stroke-width="2"/>
<text x="73.0" y="246" text-anchor="start" font-size="16" fill="#222222" font-weight="normal"><tspan>λ</tspan><tspan dy="5" font-size="14">c</tspan></text>
<line x1="94.0" y1="100.0" x2="105.0" y2="100.0" stroke="#222222" stroke-width="2"/>
<text x="64.1" y="106" text-anchor="start" font-size="16" fill="#222222" font-weight="normal"><tspan>2λ</tspan><tspan dy="5" font-size="14">c</tspan></text>
<circle cx="100.0" cy="380" r="6" fill="#c0392b" stroke="#c0392b" stroke-width="2"/>
<circle cx="370.0" cy="240" r="6" fill="#c0392b" stroke="#c0392b" stroke-width="2"/>
<circle cx="640.0" cy="100" r="6" fill="#c0392b" stroke="#c0392b" stroke-width="2"/>
<line x1="100.0" y1="240.0" x2="370.0" y2="240.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="370.0" y1="240.0" x2="370.0" y2="380.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="100.0" y1="100.0" x2="640.0" y2="100.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="380" y="330" text-anchor="start" font-size="16" fill="#222222" font-weight="normal"><tspan>φ = 0°: Δλ = 0 (no shift)</tspan></text>
<text x="380" y="354" text-anchor="start" font-size="16" fill="#222222" font-weight="normal"><tspan>φ = 90°: Δλ = λ</tspan><tspan dy="5" font-size="14">c</tspan><tspan dy="-5"> ≈ 2.43 pm</tspan></text>
<text x="625" y="62" text-anchor="end" font-size="16" fill="#c0392b" font-weight="normal"><tspan>Maximum at φ = 180°:</tspan></text>
<text x="488.6" y="84" text-anchor="start" font-size="16" fill="#c0392b" font-weight="normal"><tspan>Δλ = 2λ</tspan><tspan dy="5" font-size="14">c</tspan><tspan dy="-5"> ≈ 4.85 pm</tspan></text>
<text x="170" y="150" text-anchor="start" font-size="17" fill="#1f5fbf" font-weight="bold"><tspan>Δλ = λ</tspan><tspan dy="5" font-size="14">c</tspan><tspan dy="-5">(1 − cos φ)</tspan></text>
<text x="170" y="174" text-anchor="start" font-size="15" fill="#1f5fbf" font-weight="normal"><tspan>independent of λ and of the target</tspan></text>
</svg>
