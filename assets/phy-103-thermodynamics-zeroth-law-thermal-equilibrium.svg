<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="Zeroth law: A and B are each in thermal equilibrium with C, so A and B are in equilibrium with each other" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Zeroth law: A and B are each in thermal equilibrium with C, so A and B are in equilibrium with each other</title>
<defs>
<marker id="a222222" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker>
<marker id="s222222" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#222222"/></marker>
<marker id="a1f5fbf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker>
<marker id="s1f5fbf" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f5fbf"/></marker>
<marker id="ac0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
<marker id="sc0392b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker>
<marker id="a2e7d32" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
<marker id="s2e7d32" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e7d32"/></marker>
<marker id="a777777" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#777777"/></marker>
<marker id="s777777" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#777777"/></marker>
</defs>
<rect x="0" y="0" width="760" height="380" fill="#ffffff"/>
<text x="193.4" y="28.0" font-size="18" fill="#222222" font-weight="bold" font-style="normal"><tspan>Zeroth law: thermal equilibrium is transitive</tspan></text>
<rect x="300" y="50" width="160" height="80" rx="6" fill="#1f5fbf" fill-opacity="0.1" stroke="#222222" stroke-width="2"/>
<text x="341.3" y="86.0" font-size="17" fill="#222222" font-weight="bold" font-style="normal"><tspan>System C</tspan></text>
<text x="332.5" y="110.0" font-size="15" fill="#222222" font-weight="normal" font-style="normal"><tspan>(thermometer)</tspan></text>
<rect x="40" y="230" width="170" height="80" rx="6" fill="#c0392b" fill-opacity="0.1" stroke="#222222" stroke-width="2"/>
<text x="86.6" y="266.0" font-size="17" fill="#222222" font-weight="bold" font-style="normal"><tspan>System A</tspan></text>
<text x="73.3" y="291.0" font-size="15" fill="#222222" font-weight="normal" font-style="normal"><tspan>temperature T</tspan><tspan dy="4" font-size="14">A</tspan></text>
<rect x="550" y="230" width="170" height="80" rx="6" fill="#2e7d32" fill-opacity="0.1" stroke="#222222" stroke-width="2"/>
<text x="596.3" y="266.0" font-size="17" fill="#222222" font-weight="bold" font-style="normal"><tspan>System B</tspan></text>
<text x="583.3" y="291.0" font-size="15" fill="#222222" font-weight="normal" font-style="normal"><tspan>temperature T</tspan><tspan dy="4" font-size="14">B</tspan></text>
<line x1="135.0" y1="228.0" x2="330.0" y2="132.0" stroke="#1f5fbf" stroke-width="3" marker-end="url(#a1f5fbf)" marker-start="url(#s1f5fbf)" stroke-linecap="round"/>
<line x1="625.0" y1="228.0" x2="430.0" y2="132.0" stroke="#1f5fbf" stroke-width="3" marker-end="url(#a1f5fbf)" marker-start="url(#s1f5fbf)" stroke-linecap="round"/>
<text x="40.0" y="168.0" font-size="15" fill="#222222" font-weight="normal" font-style="normal"><tspan>A and C in equilibrium:</tspan></text>
<text x="40.0" y="190.0" font-size="17" fill="#222222" font-weight="bold" font-style="normal"><tspan>T</tspan><tspan dy="4" font-size="14">A</tspan><tspan dy="-4"> = T</tspan><tspan dy="4" font-size="14">C</tspan></text>
<text x="569.1" y="168.0" font-size="15" fill="#222222" font-weight="normal" font-style="normal"><tspan>B and C in equilibrium:</tspan></text>
<text x="659.6" y="190.0" font-size="17" fill="#222222" font-weight="bold" font-style="normal"><tspan>T</tspan><tspan dy="4" font-size="14">B</tspan><tspan dy="-4"> = T</tspan><tspan dy="4" font-size="14">C</tspan></text>
<line x1="215.0" y1="272.0" x2="545.0" y2="272.0" stroke="#2e7d32" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a2e7d32)" marker-start="url(#s2e7d32)" stroke-linecap="round"/>
<text x="262.8" y="258.0" font-size="15" fill="#2e7d32" font-weight="normal" font-style="normal"><tspan>therefore A and B are in equilibrium</tspan></text>
<text x="349.8" y="292.0" font-size="17" fill="#2e7d32" font-weight="bold" font-style="normal"><tspan>T</tspan><tspan dy="4" font-size="14">A</tspan><tspan dy="-4"> = T</tspan><tspan dy="4" font-size="14">B</tspan></text>
<text x="83.1" y="350.0" font-size="15" fill="#222222" font-weight="normal" font-style="normal"><tspan>Equal temperature is the condition for thermal equilibrium; this lets us define temperature.</tspan></text>
</svg>
