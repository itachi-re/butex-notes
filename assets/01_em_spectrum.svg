<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="320" fill="#ffffff"/>
  <text x="360" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#222222">Electromagnetic Spectrum</text>

  <!-- spectrum strip, log scale left(long wavelength/radio) to right(short/gamma) -->
  <defs>
    <linearGradient id="specgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a1414"/>
      <stop offset="15%" stop-color="#b2182b"/>
      <stop offset="30%" stop-color="#e08214"/>
      <stop offset="42%" stop-color="#f4d35e"/>
      <stop offset="50%" stop-color="#8fd694"/>
      <stop offset="58%" stop-color="#2166ac"/>
      <stop offset="72%" stop-color="#5e3c99"/>
      <stop offset="100%" stop-color="#2b1d4a"/>
    </linearGradient>
  </defs>

  <rect x="40" y="120" width="640" height="50" fill="url(#specgrad)" stroke="#222222" stroke-width="1.5"/>

  <!-- band labels along top -->
  <g font-size="11" fill="#222222" text-anchor="middle">
    <text x="80" y="110">Radio</text>
    <text x="160" y="110">Microwave</text>
    <text x="260" y="110">Infrared</text>
    <text x="360" y="110">Visible</text>
    <text x="430" y="110">Near-UV</text>
    <text x="520" y="110">UV</text>
    <text x="600" y="110">X-ray</text>
    <text x="670" y="110">Gamma ray</text>
  </g>

  <!-- highlight thermal radiation band: near-IR through visible to near-UV -->
  <rect x="230" y="120" width="230" height="50" fill="none" stroke="#000000" stroke-width="3" stroke-dasharray="7,4"/>
  <text x="345" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#222222">Thermal radiation band</text>
  <text x="345" y="222" text-anchor="middle" font-size="11" fill="#444444">(infrared → visible → near-UV)</text>

  <!-- wavelength scale below -->
  <line x1="40" y1="250" x2="680" y2="250" stroke="#222222" stroke-width="1.5"/>
  <g font-size="10" fill="#333333" text-anchor="middle">
    <text x="60" y="268">10³ m</text>
    <text x="160" y="268">10⁻² m</text>
    <text x="260" y="268">10⁻⁵ m</text>
    <text x="360" y="268">500 nm</text>
    <text x="460" y="268">10⁻⁸ m</text>
    <text x="560" y="268">10⁻¹⁰ m</text>
    <text x="660" y="268">10⁻¹² m</text>
  </g>
  <text x="360" y="290" text-anchor="middle" font-size="12" fill="#222222">Wavelength λ (decreasing →) / Frequency ν (increasing →)</text>
</svg>
