<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="420" fill="#ffffff"/>
  <text x="450" y="28" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Entropy of an Isolated System &amp; Process Reversibility</text>

  <!-- Left: entropy vs "time" for isolated system -->
  <g>
    <text x="215" y="55" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Entropy of an isolated system</text>
    <line x1="90" y1="330" x2="90" y2="80" stroke="#333" stroke-width="2" marker-end="url(#axE)"/>
    <line x1="90" y1="330" x2="360" y2="330" stroke="#333" stroke-width="2" marker-end="url(#axE)"/>
    <text x="55" y="90" font-size="13" fill="#333">S</text>
    <text x="345" y="352" font-size="13" fill="#333">time / process progress</text>

    <path d="M100,300 C 160,260 220,180 350,120" stroke="#1a7a1a" stroke-width="3" fill="none"/>
    <path d="M100,300 L 350,300" stroke="#999" stroke-width="2" stroke-dasharray="6,4" fill="none"/>

    <text x="360" y="118" font-size="12" fill="#1a7a1a">irreversible: ΔS_univ &gt; 0</text>
    <text x="360" y="305" font-size="12" fill="#999">reversible (ideal limit): ΔS_univ = 0</text>
  </g>

  <!-- Right: reversible vs irreversible process, quasistatic weights vs sudden expansion -->
  <g transform="translate(470,60)">
    <text x="215" y="-5" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Reversible vs. irreversible expansion</text>

    <!-- reversible: piston with many small weights -->
    <text x="110" y="20" font-size="13" text-anchor="middle" fill="#1a5fb4">Reversible (quasistatic)</text>
    <rect x="40" y="35" width="140" height="90" fill="#eef5ff" stroke="#1a5fb4" stroke-width="1.5"/>
    <rect x="40" y="35" width="140" height="10" fill="#7fb2f0"/>
    <text x="110" y="150" font-size="11" text-anchor="middle" fill="#333">grains removed one at a time —</text>
    <text x="110" y="165" font-size="11" text-anchor="middle" fill="#333">system stays in equilibrium; path can be reversed</text>

    <!-- irreversible: sudden free expansion -->
    <text x="330" y="20" font-size="13" text-anchor="middle" fill="#b3261e">Irreversible (free expansion)</text>
    <rect x="260" y="35" width="140" height="90" fill="#fff0ef" stroke="#b3261e" stroke-width="1.5"/>
    <line x1="330" y1="35" x2="330" y2="125" stroke="#b3261e" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="295" y="85" font-size="11" fill="#7a1913">gas</text>
    <text x="365" y="85" font-size="11" fill="#999">vacuum</text>
    <text x="330" y="150" font-size="11" text-anchor="middle" fill="#333">partition removed suddenly —</text>
    <text x="330" y="165" font-size="11" text-anchor="middle" fill="#333">non-equilibrium states occur; cannot be undone spontaneously</text>

    <text x="220" y="210" font-size="12.5" text-anchor="middle" fill="#333">Both may connect the same initial and final states,</text>
    <text x="220" y="228" font-size="12.5" text-anchor="middle" fill="#333">but only the quasistatic path has ΔS_universe = 0.</text>
  </g>

  <defs>
    <marker id="axE" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#333"/></marker>
  </defs>
</svg>
