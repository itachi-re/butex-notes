<svg viewBox="0 0 560 220" xmlns="http://www.w3.org/2000/svg" font-family="Arial" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<text x="280" y="20" text-anchor="middle" font-weight="bold">Strecker synthesis of α-amino acids</text>

<text x="20" y="60" font-size="13">R–CHO</text>
<text x="90" y="50" font-size="10">NH₃ / NH₄Cl</text>
<line x1="80" y1="55" x2="150" y2="55" stroke="black" marker-end="url(#a)"/>
<text x="160" y="60" font-size="13">R–CH=NH (imine)</text>

<text x="290" y="45" font-size="10">HCN</text>
<line x1="280" y1="55" x2="350" y2="55" stroke="black" marker-end="url(#a)"/>
<text x="360" y="60" font-size="13">R–CH(NH₂)–CN</text>
<text x="360" y="80" font-size="10">(α-aminonitrile)</text>

<line x1="280" y1="90" x2="280" y2="130" stroke="black" marker-end="url(#a)"/>
<text x="330" y="115" font-size="10">H₃O⁺ (hydrolysis of nitrile)</text>

<text x="180" y="155" font-size="14" font-weight="bold">R–CH(NH₂)–COOH   (α-amino acid, racemic)</text>
<text x="180" y="180" font-size="11">e.g., R = CH₃ gives alanine; R = H gives glycine</text>
</svg>
