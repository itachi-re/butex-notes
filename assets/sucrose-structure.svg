<text x="595.6" y="274.1" font-family="DejaVu Sans" font-size="15" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">OH</text>
<line x1="595.6" y1="173.1" x2="595.6" y2="143.1" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
<text x="595.6" y="134.1" font-family="DejaVu Sans" font-size="15" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">CH₂OH</text>
<text x="449.0" y="230.8" font-family="DejaVu Sans" font-size="11" font-weight="normal" font-style="normal" fill="#666666" text-anchor="middle">C2</text>
<text x="599.6" y="193.1" font-family="DejaVu Sans" font-size="11" font-weight="normal" font-style="normal" fill="#666666" text-anchor="middle">C5</text>
<text x="545.0" y="315.0" font-family="DejaVu Sans" font-size="13" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">β-D-fructofuranose unit</text>
<text x="545.0" y="333.0" font-family="DejaVu Sans" font-size="11.5" font-weight="normal" font-style="normal" fill="#666666" text-anchor="middle">(C2 = anomeric, β)</text>
<line x1="318.0" y1="207.9" x2="385.5" y2="193.9" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
<line x1="385.5" y1="193.9" x2="453.0" y2="210.8" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
<text x="385.5" y="183.9" font-family="DejaVu Sans" font-size="16" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">O</text>
<text x="385.5" y="118.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" font-style="italic" fill="#666666" text-anchor="middle">glycosidic bond (1→2)</text>
<text x="380.0" y="374.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" font-style="italic" fill="#666666" text-anchor="middle">Both anomeric carbons (glucose-C1 and fructose-C2) are tied up in the glycosidic bond — this is why sucrose is a</text>
<text x="380.0" y="390.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" font-style="italic" fill="#666666" text-anchor="middle">NON-REDUCING sugar.</text>
