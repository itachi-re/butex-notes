<text x="196.5" y="132.4" font-family="DejaVu Sans" font-size="15" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">CH₂OH</text>
<text x="322.0" y="227.9" font-family="DejaVu Sans" font-size="11" font-weight="normal" font-style="normal" fill="#666666" text-anchor="middle">C1</text>
<text x="220.0" y="315.0" font-family="DejaVu Sans" font-size="13" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">α-D-glucopyranose unit</text>
<text x="220.0" y="333.0" font-family="DejaVu Sans" font-size="11.5" font-weight="normal" font-style="normal" fill="#666666" text-anchor="middle">(C1 = anomeric, α)</text>
<line x1="494.4" y1="161.5" x2="453.0" y2="210.8" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
