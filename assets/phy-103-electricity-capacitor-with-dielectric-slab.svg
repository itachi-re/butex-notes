<title id="t">Parallel plate capacitor with a partly filling dielectric slab</title>
<desc id="d">Plates of area 0.25 square metres separated by 1 cm. A sulphur slab 6 mm thick with dielectric constant 4 sits on the lower plate leaving a 4 mm air gap.</desc>
