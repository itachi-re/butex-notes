<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" width="640" height="430">
<title>Glucose vs fructose comparison</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker><marker id="arrowAccent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a13a2e"/></marker><marker id="arrowAccent2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5a8a"/></marker><marker id="halfArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,2 L10,5 L0,8 z" fill="#1a1a1a"/></marker></defs>
<rect x="0" y="0" width="640" height="430" fill="white"/>
<text x="320.0" y="26.0" font-family="DejaVu Sans" font-size="19" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">D-Glucose vs D-Fructose</text>
<rect x="40.0" y="70.0" width="600.0" height="192.0" rx="0" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="40.0" y1="102.0" x2="640.0" y2="102.0" stroke="#1a1a1a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="150.0" y1="70.0" x2="150.0" y2="262.0" stroke="#666666" stroke-width="1.0" stroke-linecap="round"/>
<line x1="395.0" y1="70.0" x2="395.0" y2="262.0" stroke="#666666" stroke-width="1.0" stroke-linecap="round"/>
<line x1="40.0" y1="102.0" x2="640.0" y2="102.0" stroke="#666666" stroke-width="1.0" stroke-linecap="round"/>
<line x1="40.0" y1="134.0" x2="640.0" y2="134.0" stroke="#666666" stroke-width="1.0" stroke-linecap="round"/>
<line x1="40.0" y1="166.0" x2="640.0" y2="166.0" stroke="#666666" stroke-width="1.0" stroke-linecap="round"/>
<line x1="40.0" y1="198.0" x2="640.0" y2="198.0" stroke="#666666" stroke-width="1.0" stroke-linecap="round"/>
<line x1="40.0" y1="230.0" x2="640.0" y2="230.0" stroke="#666666" stroke-width="1.0" stroke-linecap="round"/>
<text x="95.0" y="91.0" font-family="DejaVu Sans" font-size="13" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle"></text>
<text x="272.5" y="91.0" font-family="DejaVu Sans" font-size="13" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">D-Glucose</text>
<text x="517.5" y="91.0" font-family="DejaVu Sans" font-size="13" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">D-Fructose</text>
<text x="95.0" y="123.0" font-family="DejaVu Sans" font-size="12.2" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">Class</text>
<text x="272.5" y="123.0" font-family="DejaVu Sans" font-size="12.2" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">aldohexose</text>
<text x="517.5" y="123.0" font-family="DejaVu Sans" font-size="12.2" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">ketohexose</text>
<text x="95.0" y="155.0" font-family="DejaVu Sans" font-size="12.2" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">Carbonyl</text>
<text x="272.5" y="155.0" font-family="DejaVu Sans" font-size="12.2" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">–CHO at C1</text>
<text x="517.5" y="155.0" font-family="DejaVu Sans" font-size="12.2" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">C=O at C2</text>
<text x="95.0" y="187.0" font-family="DejaVu Sans" font-size="12.2" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">Ring form</text>
<text x="272.5" y="187.0" font-family="DejaVu Sans" font-size="12.2" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">pyranose (6-membered)</text>
<text x="517.5" y="187.0" font-family="DejaVu Sans" font-size="12.2" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">furanose (5-membered)</text>
<text x="95.0" y="219.0" font-family="DejaVu Sans" font-size="12.2" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">Reducing sugar</text>
<text x="272.5" y="219.0" font-family="DejaVu Sans" font-size="12.2" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">yes</text>
<text x="517.5" y="219.0" font-family="DejaVu Sans" font-size="12.2" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">yes (via enediol)</text>
<text x="95.0" y="251.0" font-family="DejaVu Sans" font-size="12.2" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">Seliwanoff's test</text>
<text x="272.5" y="251.0" font-family="DejaVu Sans" font-size="12.2" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">faint pink, slow (~ minutes)</text>
<text x="517.5" y="251.0" font-family="DejaVu Sans" font-size="12.2" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">deep red/orange, fast (~seconds)</text>
<text x="320.0" y="385.0" font-family="DejaVu Sans" font-size="11" font-weight="normal" font-style="italic" fill="#666666" text-anchor="middle">Seliwanoff's test (resorcinol/HCl): ketoses dehydrate to furfural derivatives faster than aldoses,</text>
<text x="320.0" y="400.0" font-family="DejaVu Sans" font-size="11" font-weight="normal" font-style="italic" fill="#666666" text-anchor="middle">giving the color change quickly — this is the standard test distinguishing the two.</text>
</svg>
