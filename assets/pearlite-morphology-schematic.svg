<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Pearlite morphology schematic" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Pearlite morphology schematic</title><desc>Interlamellar spacing decreases as isothermal transformation temperature decreases</desc><defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker><pattern id="lam" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#f3e3c3"/><line x1="0" y1="3" x2="6" y2="3" stroke="#6b3d10" stroke-width="1.6"/></pattern><pattern id="lamf" width="3.5" height="3.5" patternUnits="userSpaceOnUse"><rect width="3.5" height="3.5" fill="#f3e3c3"/><line x1="0" y1="1.7" x2="3.5" y2="1.7" stroke="#6b3d10" stroke-width="1.2"/></pattern><pattern id="lamc" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f3e3c3"/><line x1="0" y1="5" x2="10" y2="5" stroke="#6b3d10" stroke-width="2.2"/></pattern></defs><rect width="100%" height="100%" fill="#fff"/><text x="500.0" y="26" font-size="17" text-anchor="middle" fill="#0b2a55" font-weight="bold"><tspan x="500.0" dy="0.0">Pearlite Morphology vs Transformation Temperature (1080 steel)</tspan></text><text x="500.0" y="44" font-size="11.5" text-anchor="middle" fill="#555" font-style="italic"><tspan x="500.0" dy="0.0">SCHEMATIC of trend – not a replacement for the lecture micrographs (≈ 1500×)</tspan></text><rect x="25" y="80" width="210" height="150" fill="url(#lamc)" stroke="#333" stroke-width="2" opacity="1"/><text x="130" y="255" font-size="14" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="130" dy="0.0">1300 °F</tspan></text><text x="130" y="274" font-size="12" text-anchor="middle" fill="#111"><tspan x="130" dy="0.0">coarse pearlite</tspan></text><line x1="237" y1="155" x2="263" y2="155" stroke="#333" stroke-width="2" marker-end="url(#ar)"/><rect x="265" y="80" width="210" height="150" fill="url(#lam)" stroke="#333" stroke-width="2" opacity="1"/><text x="370" y="255" font-size="14" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="370" dy="0.0">1225 °F</tspan></text><text x="370" y="274" font-size="12" text-anchor="middle" fill="#111"><tspan x="370" dy="0.0">medium-coarse pearlite</tspan></text><line x1="477" y1="155" x2="503" y2="155" stroke="#333" stroke-width="2" marker-end="url(#ar)"/><rect x="505" y="80" width="210" height="150" fill="url(#lamf)" stroke="#333" stroke-width="2" opacity="1"/><text x="610" y="255" font-size="14" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="610" dy="0.0">1150 °F</tspan></text><text x="610" y="274" font-size="12" text-anchor="middle" fill="#111"><tspan x="610" dy="0.0">fine pearlite</tspan></text><line x1="717" y1="155" x2="743" y2="155" stroke="#333" stroke-width="2" marker-end="url(#ar)"/><rect x="745" y="80" width="210" height="150" fill="url(#lamf)" stroke="#333" stroke-width="2" opacity="1"/><text x="850" y="255" font-size="14" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="850" dy="0.0">1075 °F</tspan></text><text x="850" y="274" font-size="12" text-anchor="middle" fill="#111"><tspan x="850" dy="0.0">finest / very fine pearlite</tspan></text><line x1="30" y1="320" x2="970" y2="320" stroke="#111" stroke-width="3" marker-end="url(#ar)"/><text x="30" y="312" font-size="12.5" text-anchor="start" fill="#111" font-weight="bold"><tspan x="30" dy="0.0">Lower isothermal transformation temperature →</tspan></text><text x="500" y="350" font-size="12.5" text-anchor="middle" fill="#111"><tspan x="500" dy="0.0">Interlamellar (ferrite–cementite) spacing ↓   ·   hardness &amp; strength ↑   ·   plates harder to resolve optically</tspan></text><text x="500" y="372" font-size="12" text-anchor="middle" fill="#111"><tspan x="500" dy="0.0">Reason: larger undercooling → slower diffusion + faster nucleation → carbon travels shorter distances → closely spaced lamellae</tspan></text><text x="500" y="404" font-size="11.5" text-anchor="middle" fill="#111" font-style="italic"><tspan x="500" dy="0.0">Labels coarse / medium / fine follow the lecture’s TTT regions; exact temperature→label mapping is a trend, not a stated boundary.</tspan></text></svg>