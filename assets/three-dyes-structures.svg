<svg viewBox="0 0 520 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<!-- 1. Methyl Orange -->
<text x="20" y="20" font-weight="bold">1. Methyl Orange (azo dye)</text>
<text x="20" y="45">(CH₃)₂N–C₆H₄–N=N–C₆H₄–SO₃Na</text>
<polygon points="60,70 85,55 110,70 110,95 85,110 60,95" fill="none" stroke="black"/>
<text x="30" y="80">Me₂N</text>
<line x1="110" y1="82" x2="140" y2="82" stroke="black"/>
<text x="125" y="75" font-size="10">N=N</text>
<polygon points="140,70 165,55 190,70 190,95 165,110 140,95" fill="none" stroke="black"/>
<line x1="190" y1="82" x2="215" y2="82" stroke="black"/>
<text x="220" y="85" font-size="11">SO₃Na</text>

<!-- 2. Malachite Green -->
<text x="20" y="150" font-weight="bold">2. Malachite Green (triphenylmethane dye)</text>
<text x="20" y="175" font-size="11">[4-Me₂N-C₆H₄]₂C=C₆H₄=N⁺Me₂ Cl⁻</text>
<polygon points="60,195 85,180 110,195 110,220 85,235 60,220" fill="none" stroke="black"/>
<text x="30" y="205" font-size="10">Me₂N</text>
<polygon points="120,195 145,180 170,195 170,220 145,235 120,220" fill="none" stroke="black"/>
<text x="145" y="245" text-anchor="middle" font-size="10">NMe₂</text>
<line x1="110" y1="207" x2="120" y2="207" stroke="black"/>
<text x="115" y="200" font-size="9">C</text>
<line x1="145" y1="180" x2="145" y2="160" stroke="black"/>
<polygon points="120,150 145,135 170,150 170,120 145,105 120,120" fill="none" stroke="black" transform="translate(30,-5)"/>
<text x="220" y="207" font-size="11">central C⁺ = auxochrome-bearing rings → colour</text>

<!-- 3. Indigo -->
<text x="20" y="290" font-weight="bold">3. Indigo (vat dye)</text>
<text x="20" y="312" font-size="11">bis-indole with central C=C, two C=O (carbonyl chromophore), two NH (auxochrome)</text>
<polygon points="60,330 90,330 100,355 75,375 50,355" fill="none" stroke="black"/>
<text x="75" y="390" text-anchor="middle" font-size="9">indole 1</text>
<line x1="100" y1="345" x2="140" y2="345" stroke="black" stroke-width="2"/>
<text x="120" y="338" font-size="10">C=C</text>
<polygon points="140,330 170,330 180,355 155,375 130,355" fill="none" stroke="black"/>
<text x="155" y="390" text-anchor="middle" font-size="9">indole 2</text>
<text x="60" y="320" font-size="9">O=C</text>
<text x="150" y="320" font-size="9">C=O</text>

<text x="260" y="410" text-anchor="middle" font-style="italic" font-size="11">Simplified skeletal representations for revision purposes</text>
</svg>
