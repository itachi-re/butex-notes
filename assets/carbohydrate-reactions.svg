<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Carbohydrate reactions overview</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker><marker id="arrowAccent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a13a2e"/></marker><marker id="arrowAccent2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5a8a"/></marker><marker id="halfArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,2 L10,5 L0,8 z" fill="#1a1a1a"/></marker></defs>
<rect x="0" y="0" width="1000" height="720" fill="white"/>
<text x="500.0" y="30.0" font-family="DejaVu Sans" font-size="19" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">Carbohydrate Reactions — Overview Sheet</text>
<text x="500.0" y="48.0" font-family="DejaVu Sans" font-size="13" font-weight="normal" font-style="normal" fill="#666666" text-anchor="middle">CHEM-103 quick reference</text>
<text x="60.0" y="90.0" font-family="DejaVu Sans" font-size="15" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">1.  Mutarotation</text>
<line x1="60.0" y1="98.0" x2="360.0" y2="98.0" stroke="#666666" stroke-width="1.3" stroke-linecap="round"/>
<text x="60.0" y="120.0" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">α-D-glucopyranose  ⇌  open-chain  ⇌  β-D-glucopyranose</text>
<text x="60.0" y="140.0" font-family="DejaVu Sans" font-size="11.5" font-weight="normal" font-style="normal" fill="#666666" text-anchor="start">[α]D:   +112°              (trace)              +18.7°     →  equilibrium +52.7°</text>
<text x="60.0" y="190.0" font-family="DejaVu Sans" font-size="15" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">2.  Kiliani–Fischer Synthesis</text>
<line x1="60.0" y1="198.0" x2="360.0" y2="198.0" stroke="#666666" stroke-width="1.3" stroke-linecap="round"/>
<text x="60.0" y="220.0" font-family="DejaVu Sans" font-size="12.2" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">aldose(n C)  --HCN--&gt;  cyanohydrins  --hydrolyse/reduce--&gt;  aldoses (n+1 C, 2 C2-epimers)</text>
<text x="60.0" y="240.0" font-family="DejaVu Sans" font-size="11.5" font-weight="normal" font-style="normal" fill="#666666" text-anchor="start">e.g. D-glyceraldehyde (3C)  →  D-erythrose + D-threose (4C)</text>
<text x="60.0" y="290.0" font-family="DejaVu Sans" font-size="15" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">3.  Lobry de Bruyn–van Ekenstein Rearrangement</text>
<line x1="60.0" y1="298.0" x2="360.0" y2="298.0" stroke="#666666" stroke-width="1.3" stroke-linecap="round"/>
<text x="60.0" y="320.0" font-family="DejaVu Sans" font-size="12.2" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">D-glucose  ⇌  1,2-enediol  ⇌  D-fructose      (also ⇌ D-mannose, the C2 epimer)</text>
<text x="60.0" y="340.0" font-family="DejaVu Sans" font-size="11.5" font-weight="normal" font-style="normal" fill="#666666" text-anchor="start">base-catalysed; only C1/C2 change, C3–C6 configuration is retained</text>
<text x="60.0" y="390.0" font-family="DejaVu Sans" font-size="15" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">4.  Glucose Oxidation</text>
<line x1="60.0" y1="398.0" x2="360.0" y2="398.0" stroke="#666666" stroke-width="1.3" stroke-linecap="round"/>
<text x="60.0" y="420.0" font-family="DejaVu Sans" font-size="12.2" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">D-glucose  --Br₂ / H₂O--&gt;  D-gluconic acid       (–CHO → –COOH only)</text>
<text x="60.0" y="440.0" font-family="DejaVu Sans" font-size="12.2" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">D-glucose  --dil. HNO₃--&gt;  D-glucaric (saccharic) acid   (both C1 and C6 oxidised)</text>
<text x="60.0" y="490.0" font-family="DejaVu Sans" font-size="15" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">5.  Sucrose Hydrolysis (Inversion)</text>
<line x1="60.0" y1="498.0" x2="360.0" y2="498.0" stroke="#666666" stroke-width="1.3" stroke-linecap="round"/>
<text x="60.0" y="520.0" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">sucrose  --H⁺ or invertase, H₂O--&gt;  D-glucose + D-fructose</text>
<text x="60.0" y="540.0" font-family="DejaVu Sans" font-size="11.5" font-weight="normal" font-style="normal" fill="#666666" text-anchor="start">"invert sugar": sucrose [α]D +66.5° → product mixture net [α]D –19.9° (fructose's strong</text>
<text x="60.0" y="556.0" font-family="DejaVu Sans" font-size="11.5" font-weight="normal" font-style="normal" fill="#666666" text-anchor="start">left rotation dominates) — sign of rotation inverts, hence the name.</text>
<text x="60.0" y="606.0" font-family="DejaVu Sans" font-size="15" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">6.  Quick Rules</text>
<line x1="60.0" y1="614.0" x2="360.0" y2="614.0" stroke="#666666" stroke-width="1.3" stroke-linecap="round"/>
<text x="60.0" y="636.0" font-family="DejaVu Sans" font-size="11.8" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">•  D-family: OH on the lowest (highest-numbered) stereocentre is on the RIGHT in Fischer projection.</text>
<text x="60.0" y="656.0" font-family="DejaVu Sans" font-size="11.8" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">•  Haworth: α-anomeric –OH is DOWN (opposite face to C5/C6 –CH₂OH); β-anomeric –OH is UP (same face).</text>
<text x="60.0" y="676.0" font-family="DejaVu Sans" font-size="11.8" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">•  Reducing sugar ⇔ a free (unlinked) anomeric carbon remains.</text>
<text x="500.0" y="705.0" font-family="DejaVu Sans" font-size="11.5" font-weight="normal" font-style="italic" fill="#666666" text-anchor="middle">See individual assets in assets/carbohydrates/ for full structures and mechanisms.</text>
</svg>
