<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Flowchart to calculate the average of 10 integers" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Flowchart to calculate the average of 10 integers</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="469" fill="#ffffff" stroke="#cfd8dc" rx="8"/>
<rect x="190.0" y="12.0" width="120" height="36" rx="18.0" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/><text x="250" y="34.55" font-size="13" text-anchor="middle" font-weight="bold" fill="#1a1a1a" ><tspan x="250" dy="0">Start</tspan></text><polyline points="250,48 250,78" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><rect x="165.0" y="78.0" width="170" height="44" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/><text x="250" y="96.425" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="250" dy="0">sum = 0</tspan><tspan x="250" dy="16.25">count = 1</tspan></text><polyline points="250,122 250,155" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><polygon points="250,155.0 335.0,190 250,225.0 165.0,190" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/><text x="250" y="194.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="250" dy="0">count ≤ 10 ?</tspan></text><polyline points="250,225 250,255" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><text x="266" y="247.2" font-size="12" text-anchor="start" font-weight="bold" fill="#b71c1c" ><tspan x="266" dy="0">Yes</tspan></text><polygon points="174.0,255.0 340.0,255.0 326.0,295.0 160.0,295.0" fill="#ffe0b2" stroke="#ef6c00" stroke-width="1.5"/><text x="250" y="279.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="250" dy="0">Read x</tspan></text><polyline points="250,295 250,325" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><rect x="165.0" y="325.0" width="170" height="40" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/><text x="250" y="349.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="250" dy="0">sum = sum + x</tspan></text><polyline points="250,365 250,395" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><rect x="165.0" y="395.0" width="170" height="40" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/><text x="250" y="419.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="250" dy="0">count = count + 1</tspan></text><polyline points="165,415 60,415 60,190 165,190" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><polyline points="335,190 440,190" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><text x="388" y="185.2" font-size="12" text-anchor="middle" font-weight="bold" fill="#b71c1c" ><tspan x="388" dy="0">No</tspan></text><rect x="440.0" y="170.0" width="160" height="40" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/><text x="520" y="194.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="520" dy="0">avg = sum / 10</tspan></text><polyline points="520,210 520,235" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><polygon points="454.0,235.0 600.0,235.0 586.0,275.0 440.0,275.0" fill="#ffe0b2" stroke="#ef6c00" stroke-width="1.5"/><text x="520" y="259.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="520" dy="0">Print avg</tspan></text><polyline points="520,275 520,322" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><rect x="460.0" y="322.0" width="120" height="36" rx="18.0" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/><text x="520" y="344.55" font-size="13" text-anchor="middle" font-weight="bold" fill="#1a1a1a" ><tspan x="520" dy="0">End</tspan></text>
</svg>