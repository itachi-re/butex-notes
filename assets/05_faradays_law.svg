<svg viewBox="0 0 620 220" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
  <style>.lbl{font-size:12px;fill:#111827;}</style>
  <rect x="20" y="40" width="160" height="120" fill="none" stroke="#111827" stroke-width="2"/>
  <text x="30" y="30" class="lbl">(a) B increasing</text>
  <text x="30" y="185" class="lbl">dPhi/dt from dB/dt</text>

  <rect x="230" y="40" width="60" height="120" fill="none" stroke="#111827" stroke-width="2"/>
  <line x1="290" y1="40" x2="290" y2="160" stroke="#059669" stroke-width="4"/>
  <text x="230" y="30" class="lbl">(b) rod sliding</text>
  <text x="230" y="185" class="lbl">dPhi/dt from dA/dt</text>

  <g transform="translate(500,100) rotate(30)">
    <rect x="-50" y="-30" width="100" height="60" fill="none" stroke="#111827" stroke-width="2"/>
  </g>
  <text x="440" y="30" class="lbl">(c) coil rotating</text>
  <text x="440" y="185" class="lbl">dPhi/dt from d(theta)/dt</text>
</svg>
