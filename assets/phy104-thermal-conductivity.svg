<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="760" height="400" fill="#ffffff"/>
  <text x="380" y="26" font-size="18" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Searle's Apparatus — Thermal Conductivity of a Metal Rod</text>

  <!-- Insulation lagging -->
  <rect x="120" y="130" width="420" height="70" fill="#f6e8c8" stroke="#a67c00" stroke-width="1.5"/>
  <text x="330" y="122" font-size="12" text-anchor="middle" fill="#a67c00">Lagging (thermal insulation)</text>

  <!-- Metal bar -->
  <rect x="130" y="150" width="400" height="30" fill="#c9a876" stroke="#7a5c2e" stroke-width="1.5"/>

  <!-- Steam chest -->
  <rect x="60" y="140" width="70" height="50" fill="#eef4fb" stroke="#2b6cb0" stroke-width="2"/>
  <text x="95" y="120" font-size="11" text-anchor="middle" fill="#2b6cb0">Steam chest</text>
  <line x1="80" y1="140" x2="80" y2="115" stroke="#2b6cb0" stroke-width="3"/>
  <text x="80" y="108" font-size="10" text-anchor="middle" fill="#2b6cb0">Steam in</text>
  <line x1="110" y1="190" x2="110" y2="215" stroke="#2b6cb0" stroke-width="3"/>
  <text x="110" y="228" font-size="10" text-anchor="middle" fill="#2b6cb0">Condensate out</text>

  <!-- Cooling coil -->
  <path d="M540 150 q15 -15 30 0 q15 15 30 0 q15 -15 30 0" fill="none" stroke="#2b6cb0" stroke-width="3"/>
  <path d="M540 165 q15 -15 30 0 q15 15 30 0 q15 -15 30 0" fill="none" stroke="#2b6cb0" stroke-width="3"/>
  <path d="M540 180 q15 -15 30 0 q15 15 30 0 q15 -15 30 0" fill="none" stroke="#2b6cb0" stroke-width="3"/>
  <text x="595" y="120" font-size="11" text-anchor="middle" fill="#2b6cb0">Cooling water coil</text>
  <line x1="540" y1="140" x2="520" y2="120" stroke="#2b6cb0" stroke-width="2"/>
  <text x="500" y="112" font-size="10" text-anchor="middle" fill="#2b6cb0">Water in (T4)</text>
  <line x1="640" y1="190" x2="660" y2="215" stroke="#2b6cb0" stroke-width="2"/>
  <text x="670" y="228" font-size="10" text-anchor="middle" fill="#2b6cb0">Water out (T3)</text>

  <!-- Thermometers T1 T2 -->
  <line x1="220" y1="150" x2="220" y2="100" stroke="#c0392b" stroke-width="3"/>
  <circle cx="220" cy="95" r="6" fill="#c0392b"/>
  <text x="220" y="86" font-size="11" text-anchor="middle" fill="#c0392b">T1</text>

  <line x1="420" y1="150" x2="420" y2="100" stroke="#c0392b" stroke-width="3"/>
  <circle cx="420" cy="95" r="6" fill="#c0392b"/>
  <text x="420" y="86" font-size="11" text-anchor="middle" fill="#c0392b">T2</text>

  <text x="320" y="207" font-size="11" text-anchor="middle" fill="#333">distance d between T1 and T2</text>

  <!-- Measuring cylinder -->
  <rect x="620" y="230" width="35" height="55" fill="#eef4fb" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="637" y="300" font-size="10" text-anchor="middle" fill="#333">measuring</text>
  <text x="637" y="312" font-size="10" text-anchor="middle" fill="#333">cylinder</text>

  <!-- Bar cross section note -->
  <text x="330" y="345" font-size="12" text-anchor="middle" fill="#555">At steady state: heat conducted through bar (T1→T2) = heat carried away by flowing water (T4→T3)</text>
  <text x="330" y="365" font-size="12" text-anchor="middle" fill="#555">kA(T1−T2)/d = m c (T3−T4)/t</text>
</svg>
