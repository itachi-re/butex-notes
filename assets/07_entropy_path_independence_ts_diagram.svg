<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow07" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#222222"/>
    </marker>
  </defs>
  <rect width="700" height="400" fill="#ffffff"/>

  <!-- axes -->
  <line x1="90" y1="330" x2="620" y2="330" stroke="#222222" stroke-width="2" marker-end="url(#arrow07)"/>
  <line x1="90" y1="330" x2="90" y2="50" stroke="#222222" stroke-width="2" marker-end="url(#arrow07)"/>
  <text x="630" y="335" font-size="15" fill="#222222">V</text>
  <text x="80" y="42" font-size="15" fill="#222222">T</text>

  <!-- endpoints -->
  <circle cx="160" cy="270" r="5" fill="#111111"/>
  <text x="140" y="295" font-size="13" fill="#111111">1 (T₁, V₁)</text>
  <circle cx="500" cy="110" r="5" fill="#111111"/>
  <text x="510" y="100" font-size="13" fill="#111111">2 (T₂, V₂)</text>

  <!-- Path A: direct diagonal (solid) -->
  <path d="M160,270 L500,110" fill="none" stroke="#2166ac" stroke-width="3"/>
  <text x="300" y="175" font-size="13" fill="#2166ac" font-weight="bold">Path A — direct</text>

  <!-- Path B: two-step right-angle path (dashed): isothermal then isochoric -->
  <path d="M160,270 L400,270 L400,110 L500,110" fill="none" stroke="#b2182b" stroke-width="3" stroke-dasharray="8,5"/>
  <text x="400" y="290" text-anchor="middle" font-size="12" fill="#b2182b">isothermal expansion (V₁→V)</text>
  <text x="480" y="200" text-anchor="middle" font-size="12" fill="#b2182b" transform="rotate(-90 480 200)">const-V heating (T₁→T₂)</text>

  <text x="355" y="320" text-anchor="middle" font-size="13" fill="#222222">Both paths connect the same states 1 and 2 —</text>
  <text x="355" y="340" text-anchor="middle" font-size="13" fill="#222222">integrating dS = δQ_rev/T along either gives the identical ΔS = S₂ − S₁,</text>
  <text x="355" y="360" text-anchor="middle" font-size="13" fill="#222222">because entropy is a state function.</text>
</svg>
