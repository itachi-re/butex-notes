<svg viewBox="0 0 520 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
<style>.lbl{font-size:13px;fill:#222} .t{font-size:18px;font-weight:bold;fill:#111}</style>
<rect width="520" height="380" fill="#fff"/>
<text x="260" y="26" text-anchor="middle" class="t">Bench / Pedestal Grinder — Main Parts</text>

<!-- Pedestal -->
<rect x="220" y="230" width="60" height="90" fill="#999" stroke="#333"/>
<rect x="180" y="320" width="140" height="18" fill="#888" stroke="#333"/>
<!-- Motor body -->
<rect x="160" y="170" width="180" height="60" fill="#b0b0b0" stroke="#333"/>
<!-- Wheels -->
<circle cx="150" cy="200" r="35" fill="#8b8b8b" stroke="#333" stroke-width="3"/>
<circle cx="370" cy="200" r="35" fill="#8b8b8b" stroke="#333" stroke-width="3"/>
<!-- Guards -->
<path d="M120,180 A40,40 0 0,1 150,235 L150,235 A35,35 0 0,0 150,165 Z" fill="#666" opacity="0.6"/>
<path d="M400,180 A40,40 0 0,0 370,235 A35,35 0 0,1 370,165 Z" fill="#666" opacity="0.6"/>
<!-- Tool rests -->
<rect x="118" y="215" width="26" height="8" fill="#555"/>
<rect x="376" y="215" width="26" height="8" fill="#555"/>
<!-- eye shields -->
<rect x="115" y="170" width="30" height="8" fill="#9fd3ff" opacity="0.7"/>
<rect x="375" y="170" width="30" height="8" fill="#9fd3ff" opacity="0.7"/>

<g font-size="13">
<line x1="150" y1="165" x2="60" y2="90" stroke="#666"/><text x="10" y="82">Grinding wheel</text>
<line x1="130" y1="210" x2="60" y2="240" stroke="#666"/><text x="10" y="254">Tool rest (work support)</text>
<line x1="130" y1="180" x2="60" y2="140" stroke="#666"/><text x="10" y="132">Wheel guard</text>
<line x1="130" y1="172" x2="60" y2="120" stroke="#666"/><text x="10" y="112">Eye/spark shield</text>
<line x1="250" y1="200" x2="250" y2="150" stroke="#666"/><text x="200" y="140">Motor &amp; spindle</text>
<line x1="250" y1="310" x2="250" y2="345" stroke="#666"/><text x="200" y="360">Pedestal base</text>
</g>
</svg>
