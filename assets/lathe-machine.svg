<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .p{fill:none;stroke:#000;stroke-width:1.6;}
    .f{fill:#fff;stroke:#000;stroke-width:1.6;}
    .lbl{font-size:13px;fill:#000;}
    .lead{stroke:#000;stroke-width:1;fill:none;}
    .dot{fill:#000;}
  </style>

  <!-- Bed -->
  <rect class="f" x="60" y="330" width="740" height="24"/>
  <!-- Legs -->
  <rect class="f" x="80" y="354" width="16" height="70"/>
  <rect class="f" x="740" y="354" width="16" height="70"/>
  <line class="p" x1="70" y1="424" x2="106" y2="424"/>
  <line class="p" x1="734" y1="424" x2="766" y2="424"/>

  <!-- Headstock -->
  <rect class="f" x="70" y="200" width="110" height="130"/>
  <text class="lbl" x="90" y="260">Head</text>
  <text class="lbl" x="90" y="276">Stock</text>

  <!-- Spindle / chuck jaws -->
  <rect class="f" x="180" y="248" width="18" height="34"/>
  <polygon class="f" points="198,248 220,258 220,272 198,282"/>

  <!-- Feed gear box -->
  <rect class="f" x="70" y="330" width="60" height="30"/>
  <line class="p" x1="80" y1="345" x2="120" y2="345"/>
  <circle class="p" cx="150" cy="358" r="14"/>

  <!-- Carriage / Saddle -->
  <rect class="f" x="330" y="300" width="120" height="30"/>
  <circle class="p" cx="390" cy="315" r="7"/>

  <!-- Compound rest / tool post -->
  <rect class="f" x="360" y="255" width="60" height="18"/>
  <rect class="f" x="378" y="228" width="26" height="27"/>
  <rect class="f" x="355" y="220" width="70" height="8"/>

  <!-- Tailstock -->
  <rect class="f" x="600" y="255" width="90" height="45"/>
  <polygon class="f" points="690,270 720,270 720,282 690,282"/>

  <!-- Dead center line -->
  <line class="p" x1="600" y1="276" x2="500" y2="276"/>

  <!-- Ways -->
  <line class="p" x1="70" y1="330" x2="760" y2="330"/>
  <line class="p" x1="70" y1="336" x2="760" y2="336"/>

  <!-- Lead screw / feed rod -->
  <line class="p" x1="200" y1="342" x2="700" y2="342" stroke-dasharray="2,2"/>
  <line class="p" x1="200" y1="348" x2="700" y2="348"/>

  <!-- Apron -->
  <rect class="f" x="330" y="330" width="40" height="24"/>

  <!-- Leader lines and labels -->
  <line class="lead" x1="200" y1="255" x2="230" y2="230"/><circle class="dot" cx="200" cy="255" r="2"/>
  <text class="lbl" x="232" y="228">spindle</text>

  <line class="lead" x1="190" y1="265" x2="150" y2="200"/><circle class="dot" cx="190" cy="265" r="2"/>
  <text class="lbl" x="130" y="196">live center</text>

  <line class="lead" x1="190" y1="252" x2="150" y2="185"/><circle class="dot" cx="190" cy="252" r="2"/>
  <text class="lbl" x="130" y="181">jaw</text>

  <text class="lbl" x="300" y="200">Tool post</text>
  <line class="lead" x1="390" y1="228" x2="335" y2="205"/>

  <text class="lbl" x="270" y="235">Tool holder</text>
  <line class="lead" x1="378" y1="245" x2="335" y2="240"/>

  <text class="lbl" x="440" y="215">Compound</text>
  <text class="lbl" x="440" y="230">rest</text>
  <line class="lead" x1="410" y1="230" x2="438" y2="222"/>

  <text class="lbl" x="470" y="250">Dead</text>
  <text class="lbl" x="470" y="264">center</text>
  <line class="lead" x1="600" y1="275" x2="500" y2="256"/>

  <text class="lbl" x="640" y="245">Tail stock</text>
  <line class="lead" x1="650" y1="255" x2="655" y2="248"/>

  <text class="lbl" x="230" y="380">Feed</text>
  <text class="lbl" x="230" y="394">Gear Box</text>
  <line class="lead" x1="130" y1="345" x2="228" y2="380"/>

  <text class="lbl" x="330" y="285">Carriage</text>
  <line class="lead" x1="390" y1="300" x2="360" y2="288"/>

  <text class="lbl" x="470" y="330">Lead screw</text>
  <line class="lead" x1="450" y1="342" x2="465" y2="332"/>

  <text class="lbl" x="470" y="350">Feed rod</text>
  <line class="lead" x1="450" y1="348" x2="465" y2="352"/>

  <text class="lbl" x="300" y="400">Apron</text>
  <line class="lead" x1="350" y1="354" x2="320" y2="396"/>

  <text class="lbl" x="330" y="420">Bed</text>
  <line class="lead" x1="400" y1="342" x2="345" y2="416"/>

  <text class="lbl" x="35" y="410">leg</text>
  <line class="lead" x1="65" y1="405" x2="85" y2="405"/>

  <text class="lbl" x="380" y="460" font-size="14" font-style="italic">Figure: Lathe Machine (main parts)</text>
</svg>
