<svg xmlns="http://www.w3.org/2000/svg" width="940" height="460" viewBox="0 0 940 460" font-family="DejaVu Sans, Verdana, Arial, sans-serif" role="img" aria-label="Typical creep curve (constant stress, constant temperature)"><title>Typical creep curve (constant stress, constant temperature)</title><defs><marker id="m222" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#222"/></marker><marker id="m444" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#444"/></marker></defs><rect width="940" height="460" fill="#ffffff"/><text x="470.0" y="28.0" font-size="17" text-anchor="middle" fill="#222" font-weight="bold">Typical creep curve (constant stress, constant temperature)</text><text x="470.0" y="46.0" font-size="12" text-anchor="middle" fill="#555" font-weight="normal">strain ε against time t — three stages after the instantaneous elastic strain ε₀</text><line x1="90.0" y1="400.0" x2="90.0" y2="70.0" stroke="#222" stroke-width="2" marker-end="url(#m222)" stroke-linecap="round"/><line x1="80.0" y1="390.0" x2="880.0" y2="390.0" stroke="#222" stroke-width="2" marker-end="url(#m222)" stroke-linecap="round"/><text x="90.0" y="60.0" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">Strain ε</text><text x="880.0" y="415.0" font-size="14" text-anchor="end" fill="#222" font-weight="bold">Time t</text><line x1="270.0" y1="390.0" x2="270.0" y2="80.0" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4" stroke-linecap="round"/><line x1="640.0" y1="390.0" x2="640.0" y2="80.0" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4" stroke-linecap="round"/><rect x="90.0" y="80.0" width="180.0" height="310.0" rx="0" fill="#e3f2fd" fill-opacity="0.5" stroke="none" stroke-width="0"/><rect x="270.0" y="80.0" width="370.0" height="310.0" rx="0" fill="#e8f5e9" fill-opacity="0.5" stroke="none" stroke-width="0"/><rect x="640.0" y="80.0" width="240.0" height="310.0" rx="0" fill="#ffebee" fill-opacity="0.5" stroke="none" stroke-width="0"/><path d="M90,390 L90,320 C120,285 170,268 270,258 L640,200 C700,192 750,160 790,95" fill="none" stroke="#1d3557" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><text x="790.0" y="92.0" font-size="20" text-anchor="middle" fill="#d62828" font-weight="normal">✕</text><text x="805.0" y="90.0" font-size="12" text-anchor="start" fill="#d62828" font-weight="normal">rupture</text><text x="180.0" y="120.0" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">I  Primary</text><text x="180.0" y="138.0" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">(transient)</text><text x="455.0" y="120.0" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">II  Secondary</text><text x="455.0" y="138.0" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">(steady state)</text><text x="760.0" y="120.0" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">III  Tertiary</text><text x="760.0" y="138.0" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">(accelerating)</text><line x1="60.0" y1="355.0" x2="60.0" y2="390.0" stroke="#444" stroke-width="1.2" marker-end="url(#m444)" stroke-linecap="round"/><line x1="60.0" y1="355.0" x2="60.0" y2="320.0" stroke="#444" stroke-width="1.2" marker-end="url(#m444)" stroke-linecap="round"/><text x="54.0" y="360.0" font-size="13" text-anchor="end" fill="#222" font-weight="bold">ε₀</text><line x1="350.0" y1="247.0" x2="560.0" y2="247.0" stroke="#d62828" stroke-width="1.2" stroke-dasharray="4 3" stroke-linecap="round"/><line x1="560.0" y1="247.0" x2="560.0" y2="213.0" stroke="#d62828" stroke-width="1.2" stroke-dasharray="4 3" stroke-linecap="round"/><text x="455.0" y="275.0" font-size="12" text-anchor="middle" fill="#d62828" font-weight="normal">slope = minimum creep rate  ε̇ₛ</text><path d="M90,390 L90,300 C115,255 150,225 200,205 L500,120" fill="none" stroke="#e76f51" stroke-width="2" stroke-dasharray="6 4" stroke-linejoin="round" stroke-linecap="round"/><text x="380.0" y="205.0" font-size="12" text-anchor="start" fill="#e76f51" font-weight="normal">higher σ or T → faster creep</text><text x="110.0" y="436.0" font-size="11" text-anchor="start" fill="#222" font-weight="normal">I: ε̇ decreases (strain hardening &gt; recovery)   II: ε̇ constant (hardening = recovery)   III: ε̇ rises (necking, voids, cracks)</text></svg>