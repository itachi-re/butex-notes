<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">Organic versus inorganic polymer backbone</title>
<desc id="d">Polyethylene with an all-carbon backbone compared with poly(dimethylsiloxane) which has an inorganic silicon-oxygen backbone with organic methyl side groups.</desc>
<rect x="0" y="0" width="900" height="420" fill="#ffffff"/>
<text xml:space="preserve" x="450.0" y="32.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="22.0" font-weight="bold" fill="#111111" text-anchor="middle">Organic vs inorganic polymer</text>
<text xml:space="preserve" x="40.0" y="85.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15.0" font-weight="bold" fill="#1f5fa8" text-anchor="start">Organic: carbon backbone (polyethylene)</text>
<line x1="60.0" y1="136.0" x2="110.0" y2="160.0" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
<line x1="110.0" y1="160.0" x2="160.0" y2="136.0" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
<line x1="160.0" y1="136.0" x2="210.0" y2="160.0" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
<path d="M92.0,120 L85.0,120 L85.0,190 L92.0,190" fill="none" stroke="#111111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M178.0,120 L185.0,120 L185.0,190 L178.0,190" fill="none" stroke="#111111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text xml:space="preserve" x="195.0" y="196.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17.0" font-weight="normal" fill="#111111" text-anchor="start" font-style="italic">n</text>
<text xml:space="preserve" x="500.0" y="150.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14.0" font-weight="normal" fill="#555555" text-anchor="start">Backbone: –C–C–C–</text>
<text xml:space="preserve" x="500.0" y="172.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14.0" font-weight="normal" fill="#555555" text-anchor="start">Examples: PE, PS, PVC, nylon, rubber</text>
<text xml:space="preserve" x="40.0" y="245.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15.0" font-weight="bold" fill="#d9620f" text-anchor="start">Inorganic: no carbon in the backbone (PDMS)</text>
<line x1="60.0" y1="306.0" x2="110.7" y2="326.3" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
<line x1="129.3" y1="326.3" x2="170.7" y2="309.7" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
<line x1="189.3" y1="309.7" x2="240.0" y2="330.0" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
<text xml:space="preserve" x="120.0" y="335.6" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16.0" font-weight="normal" fill="#ffffff" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">Si</text>
<text xml:space="preserve" x="120.0" y="335.6" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16.0" font-weight="normal" fill="#111111" text-anchor="middle">Si</text>
<line x1="113.5" y1="338.9" x2="104.0" y2="352.0" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
<line x1="126.5" y1="338.9" x2="136.0" y2="352.0" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
<text xml:space="preserve" x="180.0" y="311.6" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16.0" font-weight="normal" fill="#ffffff" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">O</text>
<text xml:space="preserve" x="180.0" y="311.6" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16.0" font-weight="normal" fill="#111111" text-anchor="middle">O</text>
<path d="M97.0,270 L90.0,270 L90.0,380 L97.0,380" fill="none" stroke="#111111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M203.0,270 L210.0,270 L210.0,380 L203.0,380" fill="none" stroke="#111111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text xml:space="preserve" x="220.0" y="386.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="17.0" font-weight="normal" fill="#111111" text-anchor="start" font-style="italic">n</text>
<text xml:space="preserve" x="500.0" y="320.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14.0" font-weight="normal" fill="#555555" text-anchor="start">Backbone: –Si–O–Si–O– (side groups may be organic)</text>
<text xml:space="preserve" x="500.0" y="342.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14.0" font-weight="normal" fill="#555555" text-anchor="start">Others: polyphosphazene –N=P–, polysulfur, silicates, glass</text>
<text xml:space="preserve" x="500.0" y="364.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14.0" font-weight="normal" fill="#555555" text-anchor="start">Higher heat resistance, flexible down to −50 °C (silicones)</text>
