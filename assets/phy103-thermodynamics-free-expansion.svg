<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" font-family="Helvetica,Arial,sans-serif">
  <rect width="620" height="320" fill="#ffffff"/>
  <text x="310" y="26" text-anchor="middle" font-size="17" font-weight="bold">Free (Joule) Expansion — Classic Irreversible Process</text>

  <text x="150" y="55" text-anchor="middle" font-size="13" font-weight="bold">Before</text>
  <rect x="60" y="70" width="200" height="130" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="160" y1="70" x2="160" y2="200" stroke="#333" stroke-width="4"/>
  <rect x="65" y="75" width="90" height="120" fill="#cfe3ff"/>
  <text x="110" y="140" text-anchor="middle" font-size="12">Gas</text>
  <text x="210" y="140" text-anchor="middle" font-size="12">Vacuum</text>
  <text x="160" y="220" text-anchor="middle" font-size="11">Insulated, rigid, partitioned container</text>

  <text x="470" y="55" text-anchor="middle" font-size="13" font-weight="bold">After (partition removed)</text>
  <rect x="360" y="70" width="200" height="130" fill="none" stroke="#333" stroke-width="2"/>
  <rect x="365" y="75" width="190" height="120" fill="#cfe3ff"/>
  <text x="460" y="140" text-anchor="middle" font-size="12">Gas fills entire volume</text>

  <line x1="270" y1="135" x2="345" y2="135" stroke="#333" stroke-width="2" marker-end="url(#a12)"/>

  <text x="60" y="250" font-size="12" fill="#333">No external work is done (expansion against vacuum, P_ext = 0) and the system is insulated (Q = 0).</text>
  <text x="60" y="268" font-size="12" fill="#333">By the first law, ΔU = 0. For an ideal gas this means ΔT = 0 — yet the process is highly irreversible</text>
  <text x="60" y="286" font-size="12" fill="#333">because the gas never passes through intermediate equilibrium states, and it will never spontaneously return.</text>

  <defs>
    <marker id="a12" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
</svg>
