<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="420" fill="#ffffff"/>
  <text x="225" y="28" font-size="17" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Kelvin–Planck Statement (impossible)</text>
  <text x="675" y="28" font-size="17" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Clausius Statement (impossible)</text>

  <!-- Kelvin-Planck: single reservoir, 100% heat to work, no cold sink -->
  <g>
    <rect x="90" y="70" width="270" height="40" rx="4" fill="#fde2e2" stroke="#b3261e" stroke-width="1.5"/>
    <text x="225" y="95" font-size="14" text-anchor="middle" fill="#7a1913">Single Reservoir  T_H</text>

    <circle cx="225" cy="220" r="60" fill="#fff6dc" stroke="#8a6d00" stroke-width="2"/>
    <text x="225" y="225" font-size="15" font-weight="bold" text-anchor="middle" fill="#5c4a00">"Engine"</text>

    <line x1="225" y1="110" x2="225" y2="160" stroke="#b3261e" stroke-width="3" marker-end="url(#arrowRedK)"/>
    <text x="245" y="140" font-size="14" fill="#b3261e">Q_H</text>

    <line x1="285" y1="220" x2="350" y2="220" stroke="#1a7a1a" stroke-width="3" marker-end="url(#arrowGreenK)"/>
    <text x="290" y="205" font-size="14" fill="#1a7a1a">W = Q_H</text>

    <!-- prohibition mark -->
    <circle cx="225" cy="220" r="95" fill="none" stroke="#b3261e" stroke-width="4" stroke-dasharray="2,0" opacity="0.85"/>
    <line x1="160" y1="155" x2="290" y2="285" stroke="#b3261e" stroke-width="5"/>

    <text x="225" y="350" font-size="12.5" text-anchor="middle" fill="#333">No engine can convert heat from a single</text>
    <text x="225" y="368" font-size="12.5" text-anchor="middle" fill="#333">reservoir completely into work, cycle after cycle,</text>
    <text x="225" y="386" font-size="12.5" text-anchor="middle" fill="#333">with no other effect (no Q_C rejected).</text>
  </g>

  <!-- Clausius: spontaneous transfer cold to hot, no work input -->
  <g>
    <rect x="540" y="70" width="270" height="40" rx="4" fill="#fde2e2" stroke="#b3261e" stroke-width="1.5"/>
    <text x="675" y="95" font-size="14" text-anchor="middle" fill="#7a1913">Hot Reservoir  T_H</text>

    <rect x="540" y="330" width="270" height="40" rx="4" fill="#dceafb" stroke="#1a5fb4" stroke-width="1.5"/>
    <text x="675" y="355" font-size="14" text-anchor="middle" fill="#0d3c73">Cold Reservoir  T_C</text>

    <line x1="675" y1="330" x2="675" y2="112" stroke="#1a5fb4" stroke-width="4" marker-end="url(#arrowBlueK)"/>
    <text x="700" y="230" font-size="14" fill="#1a5fb4">Q  (spontaneous, no W)</text>

    <line x1="610" y1="170" x2="740" y2="290" stroke="#b3261e" stroke-width="5"/>

    <text x="675" y="400" font-size="12.5" text-anchor="middle" fill="#333">No process can transfer heat spontaneously from a</text>
    <text x="675" y="418" font-size="12.5" text-anchor="middle" fill="#333">colder body to a hotter body with no other effect (no W input).</text>
  </g>

  <defs>
    <marker id="arrowRedK" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#b3261e"/></marker>
    <marker id="arrowGreenK" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1a7a1a"/></marker>
    <marker id="arrowBlueK" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1a5fb4"/></marker>
  </defs>
</svg>
