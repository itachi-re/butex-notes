<rect x="0" y="0" width="860" height="430" fill="#ffffff"/>
<text x="157.7" y="34.0" font-size="19" fill="#222222" font-weight="bold" font-style="normal"><tspan>Kelvin-Planck</tspan></text>
<text x="600.4" y="34.0" font-size="19" fill="#222222" font-weight="bold" font-style="normal"><tspan>Clausius</tspan></text>
<line x1="430.0" y1="50.0" x2="430.0" y2="420.0" stroke="#777777" stroke-width="1.5" stroke-dasharray="4 6" stroke-linecap="round"/>
<rect x="120" y="60" width="200" height="56" rx="6" fill="#c0392b" fill-opacity="0.1" stroke="#222222" stroke-width="2"/>
<text x="192.9" y="86.0" font-size="16" fill="#222222" font-weight="bold" font-style="normal"><tspan>Source</tspan></text>
<text x="173.0" y="106.0" font-size="15" fill="#222222" font-weight="normal" font-style="normal"><tspan>temperature T</tspan></text>
<line x1="130.0" y1="170.0" x2="310.0" y2="292.0" stroke="#c0392b" stroke-width="6" stroke-linecap="round"/>
<line x1="310.0" y1="170.0" x2="130.0" y2="292.0" stroke="#c0392b" stroke-width="6" stroke-linecap="round"/>
<circle cx="220" cy="230" r="45" fill="#1f5fbf" fill-opacity="0.1" stroke="#222222" stroke-width="2"/>
<text x="191.7" y="296.0" font-size="17" fill="#222222" font-weight="bold" font-style="normal"><tspan>Engine</tspan></text>
<line x1="220.0" y1="118.0" x2="220.0" y2="183.0" stroke="#c0392b" stroke-width="4" marker-end="url(#ac0392b)" stroke-linecap="round"/>
<text x="234.0" y="152.0" font-size="17" fill="#c0392b" font-weight="bold" font-style="normal"><tspan>Q</tspan></text>
<line x1="267.0" y1="230.0" x2="390.0" y2="230.0" stroke="#1f5fbf" stroke-width="4" marker-end="url(#a1f5fbf)" stroke-linecap="round"/>
<text x="305.7" y="214.0" font-size="17" fill="#1f5fbf" font-weight="bold" font-style="normal"><tspan>W = Q</tspan></text>
<text x="71.9" y="328.0" font-size="16" fill="#c0392b" font-weight="bold" font-style="normal"><tspan>IMPOSSIBLE: no sink, no heat rejected</tspan></text>
<text x="102.4" y="382.0" font-size="15" fill="#222222" font-weight="normal" font-style="normal"><tspan>No cyclic engine can turn heat from</tspan></text>
<text x="104.1" y="402.0" font-size="15" fill="#222222" font-weight="normal" font-style="normal"><tspan>one reservoir completely into work.</tspan></text>
<rect x="540" y="60" width="200" height="56" rx="6" fill="#c0392b" fill-opacity="0.1" stroke="#222222" stroke-width="2"/>
<text x="605.3" y="86.0" font-size="16" fill="#222222" font-weight="bold" font-style="normal"><tspan>Hot body</tspan></text>
<text x="589.1" y="106.0" font-size="15" fill="#222222" font-weight="normal" font-style="normal"><tspan>temperature T</tspan><tspan dy="4" font-size="14">1</tspan></text>
<rect x="540" y="236" width="200" height="56" rx="6" fill="#1f5fbf" fill-opacity="0.1" stroke="#222222" stroke-width="2"/>
<text x="600.9" y="262.0" font-size="16" fill="#222222" font-weight="bold" font-style="normal"><tspan>Cold body</tspan></text>
<text x="589.1" y="282.0" font-size="15" fill="#222222" font-weight="normal" font-style="normal"><tspan>temperature T</tspan><tspan dy="4" font-size="14">2</tspan></text>
<line x1="600.0" y1="150.0" x2="680.0" y2="206.0" stroke="#c0392b" stroke-width="6" stroke-linecap="round"/>
<line x1="680.0" y1="150.0" x2="600.0" y2="206.0" stroke="#c0392b" stroke-width="6" stroke-linecap="round"/>
<line x1="640.0" y1="234.0" x2="640.0" y2="120.0" stroke="#c0392b" stroke-width="4" marker-end="url(#ac0392b)" stroke-linecap="round"/>
<text x="700.0" y="176.0" font-size="17" fill="#c0392b" font-weight="bold" font-style="normal"><tspan>Q</tspan></text>
<text x="700.0" y="198.0" font-size="15" fill="#c0392b" font-weight="normal" font-style="normal"><tspan>(W = 0)</tspan></text>
<text x="503.0" y="328.0" font-size="16" fill="#c0392b" font-weight="bold" font-style="normal"><tspan>IMPOSSIBLE: heat cold to hot alone</tspan></text>
<text x="499.9" y="382.0" font-size="15" fill="#222222" font-weight="normal" font-style="normal"><tspan>Heat cannot pass from a colder to a hotter</tspan></text>
<text x="519.5" y="402.0" font-size="15" fill="#222222" font-weight="normal" font-style="normal"><tspan>body by itself, without external work.</tspan></text>
</svg>
