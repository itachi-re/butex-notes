<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" role="img" aria-label="Kelvin-Planck and Clausius statements of the second law, each showing the forbidden process crossed out" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Kelvin-Planck and Clausius statements of the second law, each showing the forbidden process crossed out</title>
