<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="700" height="400" fill="#ffffff"/>

  <!-- left: single ordered microstate -->
  <text x="150" y="35" text-anchor="middle" font-size="14" font-weight="bold" fill="#222222">Ordered macrostate</text>
  <rect x="50" y="55" width="200" height="150" fill="none" stroke="#222222" stroke-width="2"/>
  <g fill="#2166ac">
    <circle cx="70" cy="75" r="4.5"/><circle cx="82" cy="90" r="4.5"/><circle cx="65" cy="100" r="4.5"/>
    <circle cx="90" cy="70" r="4.5"/><circle cx="78" cy="110" r="4.5"/><circle cx="95" cy="95" r="4.5"/>
    <circle cx="60" cy="88" r="4.5"/><circle cx="100" cy="82" r="4.5"/>
  </g>
  <text x="150" y="225" text-anchor="middle" font-size="12" fill="#333333">Only 1 arrangement gives</text>
  <text x="150" y="240" text-anchor="middle" font-size="12" fill="#333333">"all molecules in one corner"</text>
  <text x="150" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="#2166ac">Ω = 1</text>
  <text x="150" y="280" text-anchor="middle" font-size="13" fill="#333333">S = k ln Ω is small</text>

  <!-- right: disordered macrostate, many equivalent microstates shown faintly -->
  <text x="530" y="35" text-anchor="middle" font-size="14" font-weight="bold" fill="#222222">Disordered macrostate</text>
  <rect x="430" y="55" width="200" height="150" fill="none" stroke="#222222" stroke-width="2"/>
  <!-- main arrangement -->
  <g fill="#b2182b">
    <circle cx="450" cy="70" r="4"/><circle cx="480" cy="95" r="4"/><circle cx="510" cy="75" r="4"/>
    <circle cx="540" cy="110" r="4"/><circle cx="570" cy="80" r="4"/><circle cx="600" cy="130" r="4"/>
    <circle cx="460" cy="150" r="4"/><circle cx="500" cy="180" r="4"/>
  </g>
  <!-- faded ghost arrangements to suggest many equivalent microstates -->
  <g fill="#b2182b" opacity="0.25">
    <circle cx="470" cy="60" r="4"/><circle cx="520" cy="120" r="4"/><circle cx="560" cy="150" r="4"/>
    <circle cx="590" cy="90" r="4"/><circle cx="440" cy="180" r="4"/><circle cx="610" cy="180" r="4"/>
    <circle cx="490" cy="140" r="4"/><circle cx="550" cy="65" r="4"/>
  </g>
  <g fill="#b2182b" opacity="0.12">
    <circle cx="455" cy="120" r="4"/><circle cx="530" cy="150" r="4"/><circle cx="580" cy="160" r="4"/>
    <circle cx="620" cy="100" r="4"/><circle cx="495" cy="70" r="4"/>
  </g>
  <text x="530" y="225" text-anchor="middle" font-size="12" fill="#333333">Enormously many arrangements</text>
  <text x="530" y="240" text-anchor="middle" font-size="12" fill="#333333">give "spread through the box"</text>
  <text x="530" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="#b2182b">Ω ≫ 1</text>
  <text x="530" y="280" text-anchor="middle" font-size="13" fill="#333333">S = k ln Ω is large</text>

  <text x="350" y="330" text-anchor="middle" font-size="13" fill="#222222">The system evolves toward the macrostate reachable by the most microstates —</text>
  <text x="350" y="350" text-anchor="middle" font-size="13" fill="#222222">this statistical tendency is exactly what entropy S = k ln Ω measures.</text>
</svg>
