<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .lbl{font-size:14.5px;fill:#1a1a1a;}
    .small{font-size:12.5px;fill:#333;}
    .arrow{stroke:#33475b;stroke-width:2;marker-end:url(#ah3);fill:none;}
    .box{fill:#f5f8fc;stroke:#33475b;stroke-width:1.5;}
  </style>
  <defs>
    <marker id="ah3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#33475b"/>
    </marker>
  </defs>

  <text x="450" y="24" text-anchor="middle" font-size="17" font-weight="bold">Diazonium Coupling Reaction (Azo dye formation)</text>

  <rect class="box" x="30" y="55" width="190" height="55" rx="6"/>
  <text x="125" y="80" text-anchor="middle" class="lbl">C6H5-N2+ Cl⁻</text>
  <text x="125" y="98" text-anchor="middle" class="small">benzenediazonium chloride</text>

  <text x="255" y="70" text-anchor="middle" font-size="20">+</text>

  <rect class="box" x="290" y="55" width="190" height="55" rx="6"/>
  <text x="385" y="80" text-anchor="middle" class="lbl">C6H5-N(CH3)2</text>
  <text x="385" y="98" text-anchor="middle" class="small">N,N-dimethylaniline</text>

  <path class="arrow" d="M480,82 H560"/>
  <text x="520" y="74" text-anchor="middle" class="small">weakly acidic, 0-5°C</text>

  <rect class="box" x="560" y="55" width="300" height="70" rx="6"/>
  <text x="710" y="80" text-anchor="middle" class="lbl">p-(C6H5-N=N-)-C6H4-N(CH3)2</text>
  <text x="710" y="98" text-anchor="middle" class="small">4-(dimethylamino)azobenzene</text>
  <text x="710" y="115" text-anchor="middle" class="small">— an azo dye (yellow-orange)</text>

  <text x="450" y="160" text-anchor="middle" class="small">Electrophile: diazonium ion (Ar-N≡N+) attacks the electron-rich ring</text>
  <text x="450" y="180" text-anchor="middle" class="small">at the position para to the activating -NH2 / -OH / -NR2 group.</text>
  <text x="450" y="205" text-anchor="middle" class="small" font-weight="bold">General coupling: Ar-N2+ + Ar'-NR2 (or Ar'-OH) → Ar-N=N-Ar' (azo compound, -N=N- chromophore)</text>
</svg>
