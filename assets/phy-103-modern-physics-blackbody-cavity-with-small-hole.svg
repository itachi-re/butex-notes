<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430" role="img" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Blackbody cavity with a small hole</title>
<desc>A hollow cavity with a small hole. A ray entering the hole undergoes many reflections and is almost completely absorbed, so the hole behaves as a blackbody.</desc>
<defs><marker id="ad" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 z" fill="#222222"/></marker><marker id="ab" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 z" fill="#1f5fbf"/></marker><marker id="ar" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 z" fill="#c0392b"/></marker><marker id="ag" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 z" fill="#2e7d32"/></marker></defs>
<rect x="0" y="0" width="780" height="430" fill="#ffffff"/>
<text x="20" y="30" text-anchor="start" font-size="18" fill="#222222" font-weight="bold"><tspan>Blackbody: a small hole in a cavity</tspan></text>
<rect x="200" y="90" width="360" height="240" fill="#222222" fill-opacity="0.3"/>
<rect x="226" y="116" width="308" height="188" fill="#ffffff"/>
<rect x="198" y="190" width="30" height="40" fill="#ffffff"/>
<line x1="35.0" y1="120.0" x2="215.0" y2="210.0" stroke="#c0392b" stroke-width="3" stroke-opacity="1.0" marker-end="url(#ar)"/>
<line x1="215.0" y1="210.0" x2="405.0" y2="304.0" stroke="#c0392b" stroke-width="3" stroke-opacity="0.8"/>
<line x1="405.0" y1="304.0" x2="534.0" y2="240.0" stroke="#c0392b" stroke-width="3" stroke-opacity="0.62"/>
<line x1="534.0" y1="240.0" x2="285.0" y2="116.0" stroke="#c0392b" stroke-width="3" stroke-opacity="0.45"/>
<line x1="285.0" y1="116.0" x2="226.0" y2="145.0" stroke="#c0392b" stroke-width="3" stroke-opacity="0.3"/>
<text x="30" y="100" text-anchor="start" font-size="16" fill="#c0392b" font-weight="normal"><tspan>Incident radiation</tspan></text>
<line x1="150.0" y1="274.0" x2="206.0" y2="234.0" stroke="#222222" stroke-width="1.5"/>
<text x="30" y="292" text-anchor="start" font-size="16" fill="#222222" font-weight="normal"><tspan>Small hole</tspan></text>
<line x1="380.0" y1="352.0" x2="380.0" y2="308.0" stroke="#222222" stroke-width="1.5"/>
<text x="380" y="374" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal"><tspan>Walls at uniform temperature T</tspan></text>
<text x="380" y="70" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal"><tspan>Many reflections: a little is absorbed at each one</tspan></text>
<text x="380" y="408" text-anchor="middle" font-size="16" fill="#1f5fbf" font-weight="normal"><tspan>Radiation entering the hole is almost completely absorbed, so the hole has a = 1</tspan></text>
<text x="570" y="200" text-anchor="start" font-size="16" fill="#2e7d32" font-weight="normal"><tspan>Cavity radiation leaving</tspan></text>
<text x="570" y="222" text-anchor="start" font-size="16" fill="#2e7d32" font-weight="normal"><tspan>through the hole is</tspan></text>
<text x="570" y="244" text-anchor="start" font-size="16" fill="#2e7d32" font-weight="normal"><tspan>blackbody radiation,</tspan></text>
<text x="570" y="266" text-anchor="start" font-size="16" fill="#2e7d32" font-weight="normal"><tspan>a function of T alone</tspan></text>
</svg>
