<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="720" height="400" fill="#ffffff"/>
  <text x="360" y="26" font-size="18" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Platinum Resistance Thermometer — Boiling Point Determination</text>

  <!-- Flask with liquid boiling -->
  <path d="M150 120 L150 180 Q150 230 200 230 L260 230 Q310 230 310 180 L310 120 Z" fill="#dbeafe" stroke="#2b6cb0" stroke-width="2"/>
  <rect x="140" y="110" width="180" height="14" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
  <text x="230" y="100" font-size="12" text-anchor="middle" fill="#333">Liquid under test</text>
  <path d="M180 200 q10 -15 20 0 q10 -15 20 0 q10 -15 20 0 q10 -15 20 0" stroke="#e67e22" stroke-width="1.5" fill="none"/>

  <!-- Heater -->
  <rect x="150" y="235" width="160" height="20" fill="#e67e22"/>
  <text x="230" y="272" font-size="11" text-anchor="middle" fill="#333">Heating mantle / burner</text>

  <!-- PRT probe -->
  <line x1="230" y1="110" x2="230" y2="150" stroke="#2b6cb0" stroke-width="4"/>
  <rect x="222" y="150" width="16" height="60" fill="#c9c9c9" stroke="#555" stroke-width="1"/>
  <text x="230" y="90" font-size="11" text-anchor="middle" fill="#2b6cb0">Pt-100 probe</text>

  <!-- lead wires to bridge -->
  <line x1="230" y1="110" x2="450" y2="90" stroke="#333" stroke-width="1.5"/>
  <line x1="238" y1="150" x2="450" y2="130" stroke="#333" stroke-width="1.5"/>

  <!-- Wheatstone bridge / ohmmeter box -->
  <rect x="450" y="70" width="200" height="120" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="2"/>
  <text x="550" y="95" font-size="12" text-anchor="middle" fill="#333">Wheatstone bridge /</text>
  <text x="550" y="112" font-size="12" text-anchor="middle" fill="#333">digital ohmmeter</text>
  <rect x="475" y="130" width="150" height="35" fill="#111" stroke="#000"/>
  <text x="550" y="152" font-size="13" text-anchor="middle" fill="#0f0" font-family="monospace">R = ____ Ω</text>

  <text x="550" y="215" font-size="11" text-anchor="middle" fill="#555">Resistance R measured at steady boiling temperature</text>

  <!-- axis for calibration graph small inset -->
  <line x1="120" y1="330" x2="360" y2="330" stroke="#333" stroke-width="1.5"/>
  <line x1="120" y1="330" x2="120" y2="290" stroke="#333" stroke-width="1.5"/>
  <path d="M120 320 L360 295" stroke="#c0392b" stroke-width="2" fill="none"/>
  <text x="240" y="350" font-size="11" text-anchor="middle" fill="#333">R vs θ calibration line (ice point, steam point)</text>
</svg>
