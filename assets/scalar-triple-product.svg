<svg viewBox="0 0 480 340" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="480" height="340" fill="white"/>

  <!-- base parallelogram (a,b) -->
  <polygon points="100,260 300,260 360,150 160,150" fill="#f2d9d6" fill-opacity="0.5" stroke="#1a1a1a" stroke-width="1.3"/>
  <!-- top parallelogram shifted by c -->
  <polygon points="150,150 350,150 410,40 210,40" fill="#dbe6f5" fill-opacity="0.5" stroke="#1a1a1a" stroke-width="1.3"/>
  <!-- vertical-ish edges (direction c) -->
  <line x1="100" y1="260" x2="150" y2="150" stroke="#1a1a1a" stroke-width="1.3" stroke-dasharray="4,4"/>
  <line x1="300" y1="260" x2="350" y2="150" stroke="#1a1a1a" stroke-width="1.3"/>
  <line x1="360" y1="150" x2="410" y2="40" stroke="#1a1a1a" stroke-width="1.3" stroke-dasharray="4,4"/>
  <line x1="160" y1="150" x2="210" y2="40" stroke="#1a1a1a" stroke-width="1.3" stroke-dasharray="4,4"/>

  <!-- labeled edge vectors from origin (100,260) -->
  <line x1="100" y1="260" x2="300" y2="260" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow3)"/>
  <text x="305" y="266" font-size="18" font-style="italic">a</text>

  <line x1="100" y1="260" x2="160" y2="150" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow3)"/>
  <text x="140" y="140" font-size="18" font-style="italic">b</text>

  <line x1="100" y1="260" x2="150" y2="150" stroke="#b3261e" stroke-width="2.2" marker-end="url(#arrow3)"/>
  <text x="118" y="200" font-size="18" font-style="italic" fill="#b3261e">c</text>

  <text x="240" y="310" font-size="15" text-anchor="middle">Volume = |[a, b, c]| = |a · (b × c)|</text>
</svg>
