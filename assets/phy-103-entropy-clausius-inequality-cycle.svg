<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Clausius inequality for a closed cycle</title>
<desc>A closed cycle exchanging heat dQ at temperature T; the cyclic integral of dQ over T is zero for reversible and negative for irreversible cycles.</desc>
<defs><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="my" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#777777"/></marker></defs>
<rect x="0" y="0" width="700" height="420" fill="#ffffff"/>
<text x="350" y="26" fill="#222222" font-size="16" text-anchor="middle" font-weight="bold">Clausius inequality for a closed cycle</text>
<line x1="60" y1="380" x2="60" y2="50" stroke="#222222" stroke-width="2" marker-end="url(#mk)"/>
<line x1="60" y1="380" x2="650" y2="380" stroke="#222222" stroke-width="2" marker-end="url(#mk)"/>
<text x="46" y="58" fill="#222222" font-size="15" text-anchor="end" font-weight="bold">P</text>
<text x="658" y="385" fill="#222222" font-size="15" text-anchor="start" font-weight="bold">V</text>
<path d="M200,180 C200,100 380,90 460,150 C540,210 520,280 420,285 C320,290 200,260 200,180 Z" fill="#1f5fbf" fill-opacity="0.08" stroke="#1f5fbf" stroke-width="2.5"/>
<line x1="282" y1="113" x2="320" y2="111" stroke="#1f5fbf" stroke-width="2.5" marker-end="url(#mb)"/>
<line x1="509" y1="216" x2="506" y2="252" stroke="#1f5fbf" stroke-width="2.5" marker-end="url(#mb)"/>
<line x1="368" y1="285" x2="335" y2="282" stroke="#1f5fbf" stroke-width="2.5" marker-end="url(#mb)"/>
<line x1="234" y1="254" x2="211" y2="217" stroke="#1f5fbf" stroke-width="2.5" marker-end="url(#mb)"/>
<line x1="300" y1="72" x2="300" y2="106" stroke="#c0392b" stroke-width="2.5" marker-end="url(#mr)"/>
<text x="300" y="62" fill="#c0392b" font-size="14" text-anchor="middle" font-weight="normal">δQ absorbed at T</text>
<line x1="350" y1="292" x2="350" y2="328" stroke="#1f5fbf" stroke-width="2.5" marker-end="url(#mb)"/>
<text x="350" y="350" fill="#1f5fbf" font-size="14" text-anchor="middle" font-weight="normal">δQ rejected at T</text>
<text x="345" y="196" fill="#222222" font-size="16" text-anchor="middle" font-weight="bold">Σ δQ/T ≤ 0</text>
<text x="345" y="218" fill="#222222" font-size="14" text-anchor="middle" font-weight="normal">closed cycle</text>
<text x="350" y="408" fill="#222222" font-size="15" text-anchor="middle" font-weight="bold">Σ δQ/T = 0 (reversible)     Σ δQ/T &lt; 0 (irreversible)     (sum over the cycle)</text>
</svg>
