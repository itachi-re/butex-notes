<svg viewBox="0 0 780 400" xmlns="http://www.w3.org/2000/svg" font-family="Verdana, Arial, sans-serif">
  <rect width="780" height="400" fill="#ffffff"/>
  <text x="390" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Photo-Stabilizer Mechanisms</text>

  <!-- UV absorber path -->
  <text x="200" y="58" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">1. UV Absorber (e.g. benzotriazole)</text>
  <rect x="60" y="75" width="150" height="55" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="135" y="97" text-anchor="middle" font-size="11">UV-A (ground state)</text>
  <text x="135" y="113" text-anchor="middle" font-size="11">absorbs h&#957;</text>
  <path d="M 210 102 L 250 102" stroke="#333" stroke-width="2" marker-end="url(#a3)"/>
  <rect x="250" y="75" width="150" height="55" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="325" y="97" text-anchor="middle" font-size="11">Excited-state H-transfer</text>
  <text x="325" y="113" text-anchor="middle" font-size="11">(intramolecular tautomer)</text>
  <path d="M 400 102 L 440 102" stroke="#333" stroke-width="2" marker-end="url(#a3)"/>
  <rect x="440" y="75" width="180" height="55" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="530" y="97" text-anchor="middle" font-size="11">Harmless heat dissipation</text>
  <text x="530" y="113" text-anchor="middle" font-size="11">UV-A regenerated (ground state)</text>
  <path d="M 530 130 C 570 150, 500 150, 450 118" fill="none" stroke="#555" stroke-width="1.3" stroke-dasharray="3,2" marker-end="url(#a3)"/>
  <text x="470" y="150" font-size="10" fill="#555">cyclic &#8212; UV energy converted, not consumed</text>

  <!-- HALS radical-scavenging cycle -->
  <text x="380" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c3aed">2. HALS (Hindered Amine Light Stabilizer) Denisov Cycle</text>

  <rect x="60" y="220" width="160" height="55" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="140" y="242" text-anchor="middle" font-size="11">&gt;NH (amine)</text>
  <text x="140" y="258" text-anchor="middle" font-size="11">+ ROO&#8226; (peroxy radical)</text>
  <path d="M 220 247 L 260 247" stroke="#333" stroke-width="2" marker-end="url(#a3)"/>

  <rect x="260" y="220" width="160" height="55" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="340" y="242" text-anchor="middle" font-size="11">&gt;N-O&#8226; (nitroxyl</text>
  <text x="340" y="258" text-anchor="middle" font-size="11">radical, stable)</text>
  <path d="M 420 247 L 460 247" stroke="#333" stroke-width="2" marker-end="url(#a3)"/>

  <rect x="460" y="220" width="180" height="55" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="550" y="242" text-anchor="middle" font-size="11">&gt;N-O-R (traps R&#8226;)</text>
  <text x="550" y="258" text-anchor="middle" font-size="11">regenerates &gt;N-O&#8226;</text>

  <path d="M 550 275 C 600 320, 200 320, 140 280" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a3)"/>
  <text x="380" y="310" text-anchor="middle" font-size="11" fill="#555">Nitroxyl radical is regenerated each cycle &#8212; HALS acts catalytically, at very low loading</text>

  <text x="380" y="360" text-anchor="middle" font-size="11" fill="#333">Net effect: UV absorbers prevent chromophore excitation; HALS scavenge the radicals that still form.</text>

  <defs>
    <marker id="a3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
</svg>
