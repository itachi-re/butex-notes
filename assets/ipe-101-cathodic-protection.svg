<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="Cathodic protection of buried steel"><rect x="0.5" y="0.5" width="899" height="419" rx="10" fill="#ffffff" stroke="#d1d5db"/><text x="450.0" y="24.0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">Cathodic protection of buried steel</text><text x="220.0" y="56.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">(a) Sacrificial-anode (galvanic) system</text><line x1="30.0" y1="130.0" x2="430.0" y2="130.0" stroke="#78350f" stroke-width="2" stroke-linecap="round"/><rect x="30.0" y="130.0" width="400.0" height="230.0" rx="0" fill="#fef3c7" stroke="#78350f" stroke-width="1" fill-opacity="0.7"/><text x="230.0" y="345.0" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#78350f" text-anchor="middle" font-weight="normal" font-style="italic">moist soil (electrolyte)</text><rect x="50.0" y="235.0" width="360.0" height="26.0" rx="13" fill="#9ca3af" stroke="#1f2937" stroke-width="2"/><text x="230.0" y="253.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="bold">Buried steel pipeline (cathode)</text><text x="660.0" y="56.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">(b) Impressed-current system</text><line x1="470.0" y1="130.0" x2="870.0" y2="130.0" stroke="#78350f" stroke-width="2" stroke-linecap="round"/><rect x="470.0" y="130.0" width="400.0" height="230.0" rx="0" fill="#fef3c7" stroke="#78350f" stroke-width="1" fill-opacity="0.7"/><text x="670.0" y="345.0" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#78350f" text-anchor="middle" font-weight="normal" font-style="italic">moist soil (electrolyte)</text><rect x="490.0" y="235.0" width="360.0" height="26.0" rx="13" fill="#9ca3af" stroke="#1f2937" stroke-width="2"/><text x="670.0" y="253.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="bold">Buried steel pipeline (cathode)</text><rect x="70.0" y="300.0" width="70.0" height="28.0" rx="4" fill="#a5b4fc" stroke="#1f2937" stroke-width="1.5"/><text x="105.0" y="319.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1e1b4b" text-anchor="middle" font-weight="bold">Mg / Zn</text><path d="M105,300 L105,150 L225,150 L225,235" fill="none" stroke="#ea580c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="165.0" y="142.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal">insulated wire</text><text x="105.0" y="292.0" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="bold">anode</text><text x="235.0" y="290.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#dc2626" font-weight="normal" xml:space="preserve">Mg → Mg</text><text x="284.8" y="285.6" font-family="Arial, Helvetica, sans-serif" font-size="8.0" fill="#dc2626" font-weight="normal" xml:space="preserve">2+</text><text x="294.0" y="290.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#dc2626" font-weight="normal" xml:space="preserve"> + 2e</text><text x="319.9" y="285.6" font-family="Arial, Helvetica, sans-serif" font-size="8.0" fill="#dc2626" font-weight="normal" xml:space="preserve">-</text><text x="322.5" y="290.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#dc2626" font-weight="normal" xml:space="preserve"> (dissolves)</text><text x="235.0" y="306.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#16a34a" font-weight="normal" xml:space="preserve">e</text><text x="241.4" y="301.6" font-family="Arial, Helvetica, sans-serif" font-size="8.0" fill="#16a34a" font-weight="normal" xml:space="preserve">-</text><text x="244.1" y="306.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#16a34a" font-weight="normal" xml:space="preserve"> flow to pipe → pipe is protected</text><rect x="560.0" y="80.0" width="80.0" height="36.0" rx="4" fill="#fde68a" stroke="#1f2937" stroke-width="1.5"/><text x="600.0" y="103.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="bold">DC source</text><text x="600.0" y="74.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal">(rectifier)</text><path d="M570,116 L570,150 L690,150 L690,235" fill="none" stroke="#ea580c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M640,98 L760,98 L760,300" fill="none" stroke="#ea580c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="735.0" y="300.0" width="50.0" height="36.0" rx="4" fill="#374151" stroke="#1f2937" stroke-width="1.5"/><text x="760.0" y="322.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">C</text><text x="800.0" y="290.0" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal">graphite /</text><text x="800.0" y="304.0" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal">scrap iron</text><text x="800.0" y="318.0" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal">anode</text><text x="695.0" y="285.0" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="bold">(−) to pipe</text><text x="540.0" y="384.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">External DC current forces the pipe to be the cathode;</text><text x="540.0" y="400.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">the inert anode is slowly consumed</text><text x="70.0" y="384.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">Used for ships' hulls, tanks, buried pipes, water heaters</text></svg>