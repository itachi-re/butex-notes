<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Temper brittleness cause diagram" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Temper brittleness cause diagram</title><desc>Temper brittleness after slow cooling from 1000-1250 F</desc><defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker><pattern id="lam" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#f3e3c3"/><line x1="0" y1="3" x2="6" y2="3" stroke="#6b3d10" stroke-width="1.6"/></pattern><pattern id="lamf" width="3.5" height="3.5" patternUnits="userSpaceOnUse"><rect width="3.5" height="3.5" fill="#f3e3c3"/><line x1="0" y1="1.7" x2="3.5" y2="1.7" stroke="#6b3d10" stroke-width="1.2"/></pattern><pattern id="lamc" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f3e3c3"/><line x1="0" y1="5" x2="10" y2="5" stroke="#6b3d10" stroke-width="2.2"/></pattern></defs><rect width="100%" height="100%" fill="#fff"/><text x="470.0" y="26" font-size="17" text-anchor="middle" fill="#0b2a55" font-weight="bold"><tspan x="470.0" dy="0.0">Temper Brittleness</tspan></text><text x="470.0" y="44" font-size="11.5" text-anchor="middle" fill="#555" font-style="italic"><tspan x="470.0" dy="0.0">Simple process diagram</tspan></text><rect x="30" y="80" width="200" height="80" rx="8" fill="#fde8d0" stroke="#1a3c6e" stroke-width="1.6"/><text x="130.0" y="108.75" font-size="12.5" text-anchor="middle" fill="#111"><tspan x="130.0" dy="0.0">Hardened steel</tspan><tspan x="130.0" dy="15.6">tempered in the</tspan><tspan x="130.0" dy="15.6">1000–1250 °F range</tspan></text><rect x="290" y="80" width="200" height="80" rx="8" fill="#fff3b0" stroke="#1a3c6e" stroke-width="1.6"/><text x="390.0" y="108.75" font-size="12.5" text-anchor="middle" fill="#111"><tspan x="390.0" dy="0.0">SLOW cooling</tspan><tspan x="390.0" dy="15.6">after tempering</tspan><tspan x="390.0" dy="15.6">(through/within range)</tspan></text><rect x="550" y="80" width="220" height="80" rx="8" fill="#fdd9d9" stroke="#1a3c6e" stroke-width="1.6"/><text x="660.0" y="108.75" font-size="12.5" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="660.0" dy="0.0">Loss of notched-bar</tspan><tspan x="660.0" dy="15.6">toughness</tspan><tspan x="660.0" dy="15.6">= TEMPER BRITTLENESS</tspan></text><line x1="230" y1="120" x2="290" y2="120" stroke="#333" stroke-width="2" marker-end="url(#ar)"/><line x1="490" y1="120" x2="550" y2="120" stroke="#333" stroke-width="2" marker-end="url(#ar)"/><rect x="290" y="220" width="200" height="80" rx="8" fill="#d9f2e6" stroke="#1a3c6e" stroke-width="1.6"/><text x="390.0" y="248.75" font-size="12.5" text-anchor="middle" fill="#111"><tspan x="390.0" dy="0.0">QUENCH in water</tspan><tspan x="390.0" dy="15.6">after tempering</tspan><tspan x="390.0" dy="15.6">(lecture statement)</tspan></text><line x1="230" y1="145" x2="290" y2="255" stroke="#333" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/><rect x="550" y="220" width="220" height="80" rx="8" fill="#d9f2e6" stroke="#1a3c6e" stroke-width="1.6"/><text x="660.0" y="256.5625" font-size="12.5" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="660.0" dy="0.0">Toughness is</tspan><tspan x="660.0" dy="15.6">RETAINED</tspan></text><line x1="490" y1="260" x2="550" y2="260" stroke="#333" stroke-width="2" marker-end="url(#ar)"/><text x="470" y="345" font-size="12" text-anchor="middle" fill="#111" font-style="italic"><tspan x="470" dy="0.0">Exam tip: state the range (1000–1250 °F), the trigger (slow cooling) and the remedy/observation (water quench keeps toughness).</tspan></text></svg>