<text x="114.6" y="52" text-anchor="start" font-size="18" fill="#222222" font-weight="bold"><tspan>Emissive power E</tspan><tspan dy="5" font-size="14">λ</tspan></text>
<text x="487.6" y="52" text-anchor="start" font-size="18" fill="#222222" font-weight="bold"><tspan>Absorptive power a</tspan><tspan dy="5" font-size="14">λ</tspan></text>
<text x="195" y="84" text-anchor="middle" font-size="16" fill="#c0392b" font-weight="normal"><tspan>energy dQ emitted in time t</tspan></text>
<text x="195" y="104" text-anchor="middle" font-size="16" fill="#c0392b" font-weight="normal"><tspan>in wavelength band λ to λ + dλ</tspan></text>
