<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Entropy and microstates</title>
<desc>Ordered state with few microstates versus disordered state with many microstates; S = k ln W.</desc>
<defs><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="my" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#777777"/></marker></defs>
<rect x="0" y="0" width="720" height="360" fill="#ffffff"/>
<text x="360" y="28" fill="#222222" font-size="16" text-anchor="middle" font-weight="bold">Entropy measures disorder: S = k ln W</text>
<rect x="50" y="70" width="240" height="170" rx="0" fill="none" stroke="#222222" stroke-width="2"/>
<rect x="430" y="70" width="240" height="170" rx="0" fill="none" stroke="#222222" stroke-width="2"/>
<circle cx="75" cy="95" r="8" fill="#1f5fbf" fill-opacity="0.35" stroke="#1f5fbf" stroke-width="1.5"/>
<circle cx="98" cy="95" r="8" fill="#1f5fbf" fill-opacity="0.35" stroke="#1f5fbf" stroke-width="1.5"/>
<circle cx="121" cy="95" r="8" fill="#1f5fbf" fill-opacity="0.35" stroke="#1f5fbf" stroke-width="1.5"/>
<circle cx="75" cy="118" r="8" fill="#1f5fbf" fill-opacity="0.35" stroke="#1f5fbf" stroke-width="1.5"/>
<circle cx="98" cy="118" r="8" fill="#1f5fbf" fill-opacity="0.35" stroke="#1f5fbf" stroke-width="1.5"/>
<circle cx="121" cy="118" r="8" fill="#1f5fbf" fill-opacity="0.35" stroke="#1f5fbf" stroke-width="1.5"/>
<circle cx="470" cy="105" r="8" fill="#1f5fbf" fill-opacity="0.35" stroke="#1f5fbf" stroke-width="1.5"/>
<circle cx="545" cy="125" r="8" fill="#1f5fbf" fill-opacity="0.35" stroke="#1f5fbf" stroke-width="1.5"/>
<circle cx="625" cy="95" r="8" fill="#1f5fbf" fill-opacity="0.35" stroke="#1f5fbf" stroke-width="1.5"/>
<circle cx="505" cy="200" r="8" fill="#1f5fbf" fill-opacity="0.35" stroke="#1f5fbf" stroke-width="1.5"/>
<circle cx="585" cy="215" r="8" fill="#1f5fbf" fill-opacity="0.35" stroke="#1f5fbf" stroke-width="1.5"/>
<circle cx="645" cy="165" r="8" fill="#1f5fbf" fill-opacity="0.35" stroke="#1f5fbf" stroke-width="1.5"/>
<text x="170" y="265" fill="#222222" font-size="14" text-anchor="middle" font-weight="normal">Ordered: few microstates</text>
<text x="170" y="285" fill="#222222" font-size="14" text-anchor="middle" font-weight="normal">small W, low S</text>
<text x="550" y="265" fill="#222222" font-size="14" text-anchor="middle" font-weight="normal">Disordered: many microstates</text>
<text x="550" y="285" fill="#222222" font-size="14" text-anchor="middle" font-weight="normal">large W, high S</text>
<line x1="300" y1="155" x2="420" y2="155" stroke="#c0392b" stroke-width="2.5" marker-end="url(#mr)"/>
<text x="360" y="138" fill="#c0392b" font-size="14" text-anchor="middle" font-weight="normal">spontaneous</text>
<text x="360" y="182" fill="#c0392b" font-size="15" text-anchor="middle" font-weight="bold">ΔS &gt; 0</text>
<text x="360" y="330" fill="#222222" font-size="14" text-anchor="middle" font-weight="normal">k = 1.38×10^-23 J/K (Boltzmann constant), W = number of microstates</text>
</svg>
