<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="500" height="450">
    <rect width="500" height="450" fill="#ffffff"/>
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 Z" fill="#000"/>
        </marker>
    </defs>
    <!-- Axes -->
    <path d="M 60,400 L 450,400" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 60,400 L 60,40" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="240" y="440" font-family="sans-serif" font-size="16">Volume, V</text>
    <text x="15" y="220" font-family="sans-serif" font-size="16" transform="rotate(-90 20,220)">Pressure, P</text>
    
    <!-- T > Tc -->
    <path d="M 80,100 Q 150,150 400,180" stroke="#009e73" stroke-width="2" fill="none"/>
    <text x="410" y="185" font-family="sans-serif" font-size="14" fill="#009e73">T > T_c</text>
    
    <!-- T = Tc (critical) -->
    <path d="M 80,160 Q 120,210 180,240 T 300,250 Q 350,260 400,270" stroke="#d55e00" stroke-width="3" fill="none"/>
    <circle cx="180" cy="240" r="4" fill="#000"/>
    <text x="160" y="230" font-family="sans-serif" font-size="14">Critical Point (P_c, V_c)</text>
    <text x="410" y="275" font-family="sans-serif" font-size="14" fill="#d55e00">T = T_c</text>
    
    <!-- T < Tc -->
    <path d="M 80,220 Q 110,340 160,300 T 260,330 Q 330,340 400,360" stroke="#0072b2" stroke-width="2" fill="none"/>
    <text x="410" y="365" font-family="sans-serif" font-size="14" fill="#0072b2">T < T_c</text>
    
    <!-- Dotted lines to axes -->
    <path d="M 60,240 L 180,240" stroke="#000" stroke-width="1" stroke-dasharray="5,5"/>
    <path d="M 180,400 L 180,240" stroke="#000" stroke-width="1" stroke-dasharray="5,5"/>
    <text x="30" y="245" font-family="sans-serif" font-size="14">P_c</text>
    <text x="175" y="420" font-family="sans-serif" font-size="14">V_c</text>
</svg>