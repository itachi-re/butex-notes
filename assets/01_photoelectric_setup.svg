<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610">
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf3fb"/></linearGradient>
 <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#243b53" stroke-width="1.6"/></marker>
 <marker id="bluearr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#2878c8" stroke-width="1.8"/></marker>
</defs>
<rect width="1100" height="610" rx="24" fill="url(#bg)"/>
<text x="55" y="58" font-family="Arial" font-size="28" font-weight="700" fill="#17324d">Photoelectric-effect experimental arrangement</text>
<text x="55" y="91" font-family="Arial" font-size="17" fill="#526579">Monochromatic light ejects electrons from a photosensitive cathode; the circuit measures photocurrent.</text>
<!-- tube -->
<rect x="230" y="170" width="520" height="255" rx="125" fill="#ffffff" fill-opacity=".7" stroke="#64829e" stroke-width="4"/>
<rect x="265" y="192" width="450" height="210" rx="105" fill="#e7f5ff" fill-opacity=".45" stroke="#b0c6d9" stroke-dasharray="7 7" stroke-width="2"/>
<!-- cathode -->
<path d="M330 235 Q300 297 330 360" stroke="#bd6b25" stroke-width="17" fill="none" stroke-linecap="round"/>
<text x="282" y="385" font-family="Arial" font-size="18" fill="#7a4317" font-weight="700">Cathode</text>
<text x="276" y="407" font-family="Arial" font-size="14" fill="#526579">(emitting plate)</text>
<!-- anode -->
<path d="M650 235 L650 360" stroke="#526579" stroke-width="15" stroke-linecap="round"/>
<text x="625" y="385" font-family="Arial" font-size="18" fill="#34495e" font-weight="700">Anode</text>
<!-- photons -->
<g stroke="#e5a000" stroke-width="5" fill="none" stroke-linecap="round"><path d="M75 250 L285 250"/><path d="M75 292 L285 292"/><path d="M75 334 L285 334"/></g>
<g fill="#e5a000"><path d="M285 250 l-15 -9 v18z"/><path d="M285 292 l-15 -9 v18z"/><path d="M285 334 l-15 -9 v18z"/></g>
<text x="70" y="215" font-family="Arial" font-size="18" fill="#956b00" font-weight="700">Incident light</text>
<text x="70" y="365" font-family="Arial" font-size="15" fill="#526579">frequency ν</text>
<!-- electron paths -->
<g fill="none" stroke="#2878c8" stroke-width="3" marker-end="url(#bluearr)"><path d="M350 260 Q465 205 635 265"/><path d="M350 295 Q485 295 635 295"/><path d="M350 332 Q470 390 635 330"/></g>
<g fill="#2878c8"><circle cx="375" cy="250" r="7"/><circle cx="390" cy="295" r="7"/><circle cx="375" cy="342" r="7"/></g>
<text x="430" y="225" font-family="Arial" font-size="17" fill="#1e5f9c" font-weight="700">Photoelectrons</text>
<!-- circuit -->
<path d="M330 425 L330 500 L420 500" stroke="#34495e" stroke-width="3" fill="none"/><path d="M650 425 L650 500 L565 500" stroke="#34495e" stroke-width="3" fill="none"/>
<circle cx="492" cy="500" r="33" fill="#fff" stroke="#34495e" stroke-width="3"/><text x="492" y="508" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#34495e">A</text>
<path d="M420 500 L459 500 M525 500 L565 500" stroke="#34495e" stroke-width="3"/>
<rect x="785" y="210" width="245" height="205" rx="18" fill="#ffffff" stroke="#b4c7d8" stroke-width="2"/>
<text x="810" y="250" font-family="Arial" font-size="18" font-weight="700" fill="#17324d">Key observations</text>
<text x="810" y="290" font-family="Arial" font-size="16" fill="#34495e">• Current appears only</text><text x="828" y="315" font-family="Arial" font-size="16" fill="#34495e">when ν ≥ ν₀.</text>
<text x="810" y="350" font-family="Arial" font-size="16" fill="#34495e">• Higher intensity gives</text><text x="828" y="375" font-family="Arial" font-size="16" fill="#34495e">more emitted electrons.</text>
<text x="55" y="565" font-family="Arial" font-size="15" fill="#526579">A reverse potential can stop even the fastest photoelectrons; the corresponding stopping potential is Vₛ.</text>
</svg>