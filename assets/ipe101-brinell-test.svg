<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420" font-family="DejaVu Sans, Verdana, Arial, sans-serif" role="img" aria-label="Brinell hardness test"><title>Brinell hardness test</title><defs><marker id="md62828" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#d62828"/></marker><marker id="m444" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#444"/></marker><marker id="m2a9d8f" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#2a9d8f"/></marker></defs><rect width="940" height="420" fill="#ffffff"/><text x="470.0" y="28.0" font-size="17" text-anchor="middle" fill="#222" font-weight="bold">Brinell hardness test</text><text x="470.0" y="46.0" font-size="12" text-anchor="middle" fill="#555" font-weight="normal">hardened steel / tungsten-carbide ball, load P, dwell 10–15 s</text><rect x="60.0" y="250.0" width="260.0" height="70.0" rx="0" fill="#cfd8dc" stroke="#37474f" stroke-width="2"/><path d="M140,250 A60,60 0 0 0 240,250 Z" fill="#ffffff" stroke="#37474f" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="190.0" cy="216.8" r="60.0" fill="#b0bec5" fill-opacity="0.85" stroke="#263238" stroke-width="2"/><line x1="190.0" y1="40.0" x2="190.0" y2="152.8" stroke="#d62828" stroke-width="4" marker-end="url(#md62828)" stroke-linecap="round"/><text x="204.0" y="70.0" font-size="14" text-anchor="start" fill="#d62828" font-weight="bold">load P (kgf)</text><line x1="190.0" y1="270.0" x2="140.0" y2="270.0" stroke="#d62828" stroke-width="1.2" marker-end="url(#md62828)" stroke-linecap="round"/><line x1="190.0" y1="270.0" x2="240.0" y2="270.0" stroke="#d62828" stroke-width="1.2" marker-end="url(#md62828)" stroke-linecap="round"/><text x="190.0" y="290.0" font-size="14" text-anchor="middle" fill="#d62828" font-weight="bold">d</text><line x1="275.0" y1="216.8" x2="275.0" y2="156.8" stroke="#444" stroke-width="1.2" marker-end="url(#m444)" stroke-linecap="round"/><line x1="275.0" y1="216.8" x2="275.0" y2="276.8" stroke="#444" stroke-width="1.2" marker-end="url(#m444)" stroke-linecap="round"/><text x="285.0" y="221.8" font-size="14" text-anchor="start" fill="#222" font-weight="bold">D</text><line x1="275.0" y1="263.5" x2="275.0" y2="250.0" stroke="#2a9d8f" stroke-width="1.2" marker-end="url(#m2a9d8f)" stroke-linecap="round"/><line x1="275.0" y1="263.5" x2="275.0" y2="277.0" stroke="#2a9d8f" stroke-width="1.2" marker-end="url(#m2a9d8f)" stroke-linecap="round"/><text x="282.0" y="290.0" font-size="12" text-anchor="start" fill="#2a9d8f" font-weight="normal">h (depth)</text><circle cx="630.0" cy="190.0" r="58.0" fill="#eceff1" stroke="#263238" stroke-width="2"/><circle cx="630.0" cy="190.0" r="40.0" fill="#90a4ae" stroke="#263238" stroke-width="1.5"/><line x1="630.0" y1="190.0" x2="590.0" y2="190.0" stroke="#d62828" stroke-width="1.2" marker-end="url(#md62828)" stroke-linecap="round"/><line x1="630.0" y1="190.0" x2="670.0" y2="190.0" stroke="#d62828" stroke-width="1.2" marker-end="url(#md62828)" stroke-linecap="round"/><text x="630.0" y="182.0" font-size="14" text-anchor="middle" fill="#d62828" font-weight="bold">d</text><text x="630.0" y="120.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">top view of indentation</text><text x="630.0" y="270.0" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">d measured with a microscope</text><text x="390.0" y="330.0" font-size="14" text-anchor="start" fill="#222" font-weight="normal">HB = P / (curved area of dent)</text><text x="390.0" y="354.0" font-size="14" text-anchor="start" fill="#222" font-weight="normal">    = 2P / [ π D ( D − √(D² − d²) ) ]  kgf/mm²</text><text x="60.0" y="385.0" font-size="12" text-anchor="start" fill="#222" font-weight="normal">Standard: D = 10 mm, P = 3000 kgf (steel), 1500 (copper alloys), 500 (Al, soft metals)</text></svg>