<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" role="img" aria-label="Carnot engine between the steam point 373 K and the ice point 273 K with efficiency 26.8 percent" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Carnot engine between the steam point 373 K and the ice point 273 K with efficiency 26.8 percent</title>
<defs>
