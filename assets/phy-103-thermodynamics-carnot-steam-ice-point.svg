<marker id="s222222" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#222222"/></marker>
<marker id="a1f5fbf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker>
<marker id="s1f5fbf" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f5fbf"/></marker>
<marker id="ac0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
<marker id="sc0392b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker>
<marker id="a2e7d32" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
<marker id="s2e7d32" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e7d32"/></marker>
<marker id="a777777" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#777777"/></marker>
<marker id="s777777" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#777777"/></marker>
</defs>
<rect x="0" y="0" width="800" height="460" fill="#ffffff"/>
<text x="176.9" y="28.0" font-size="18" fill="#222222" font-weight="bold" font-style="normal"><tspan>Numerical: Carnot engine, steam point and ice point</tspan></text>
<rect x="250" y="44" width="300" height="70" rx="6" fill="#c0392b" fill-opacity="0.1" stroke="#222222" stroke-width="2"/>
<text x="318.3" y="76.0" font-size="17" fill="#222222" font-weight="bold" font-style="normal"><tspan>Source: steam point</tspan></text>
<text x="329.0" y="100.0" font-size="16" fill="#222222" font-weight="normal" font-style="normal"><tspan>T</tspan><tspan dy="4" font-size="14">1</tspan><tspan dy="-4"> = 373 K (100 °C)</tspan></text>
<circle cx="400" cy="235" r="56" fill="#1f5fbf" fill-opacity="0.1" stroke="#222222" stroke-width="2"/>
<text x="370.0" y="241.0" font-size="18" fill="#222222" font-weight="bold" font-style="normal"><tspan>Engine</tspan></text>
<rect x="250" y="370" width="300" height="70" rx="6" fill="#2e7d32" fill-opacity="0.1" stroke="#222222" stroke-width="2"/>
<text x="341.9" y="402.0" font-size="17" fill="#222222" font-weight="bold" font-style="normal"><tspan>Sink: ice point</tspan></text>
<text x="338.0" y="426.0" font-size="16" fill="#222222" font-weight="normal" font-style="normal"><tspan>T</tspan><tspan dy="4" font-size="14">2</tspan><tspan dy="-4"> = 273 K (0 °C)</tspan></text>
<line x1="400.0" y1="116.0" x2="400.0" y2="176.0" stroke="#c0392b" stroke-width="4" marker-end="url(#ac0392b)" stroke-linecap="round"/>
<text x="424.0" y="150.0" font-size="17" fill="#c0392b" font-weight="bold" font-style="normal"><tspan>Q</tspan><tspan dy="4" font-size="14">1</tspan></text>
<line x1="400.0" y1="294.0" x2="400.0" y2="368.0" stroke="#2e7d32" stroke-width="4" marker-end="url(#a2e7d32)" stroke-linecap="round"/>
<text x="424.0" y="336.0" font-size="17" fill="#2e7d32" font-weight="bold" font-style="normal"><tspan>Q</tspan><tspan dy="4" font-size="14">2</tspan><tspan dy="-4"> = 0.732 Q</tspan><tspan dy="4" font-size="14">1</tspan></text>
<line x1="458.0" y1="235.0" x2="640.0" y2="235.0" stroke="#1f5fbf" stroke-width="4" marker-end="url(#a1f5fbf)" stroke-linecap="round"/>
<text x="500.2" y="218.0" font-size="17" fill="#1f5fbf" font-weight="bold" font-style="normal"><tspan>W = 0.268 Q</tspan><tspan dy="4" font-size="14">1</tspan></text>
<text x="40.0" y="230.0" font-size="15" fill="#222222" font-weight="normal" font-style="normal"><tspan>works in a cycle:</tspan></text>
<text x="40.0" y="252.0" font-size="16" fill="#222222" font-weight="bold" font-style="normal"><tspan>ΔU = 0</tspan></text>
<text x="40.0" y="330.0" font-size="17" fill="#222222" font-weight="bold" font-style="normal"><tspan>η = 1 − 273/373 = 0.268</tspan></text>
<text x="40.0" y="356.0" font-size="16" fill="#222222" font-weight="normal" font-style="normal"><tspan>= 26.8 %</tspan></text>
</svg>
