<svg xmlns="http://www.w3.org/2000/svg" width="680" height="285" viewBox="0 0 680 285" font-family="Helvetica, Arial, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Self-induction in a coil</title>
<defs>
<marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#1f2937"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#1d4ed8"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#dc2626"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#15803d"/></marker>
</defs>
<rect width="680" height="285" fill="#ffffff"/>
<line x1="50" y1="150" x2="238" y2="150" stroke="#1f2937" stroke-width="2"/><line x1="422" y1="150" x2="630" y2="150" stroke="#1f2937" stroke-width="2"/>
<ellipse cx="250" cy="150" rx="12" ry="42" fill="none" stroke="#92400e" stroke-width="2.5"/>
<ellipse cx="285" cy="150" rx="12" ry="42" fill="none" stroke="#92400e" stroke-width="2.5"/>
<ellipse cx="320" cy="150" rx="12" ry="42" fill="none" stroke="#92400e" stroke-width="2.5"/>
<ellipse cx="355" cy="150" rx="12" ry="42" fill="none" stroke="#92400e" stroke-width="2.5"/>
<ellipse cx="390" cy="150" rx="12" ry="42" fill="none" stroke="#92400e" stroke-width="2.5"/>
<line x1="80" y1="130" x2="170" y2="130" stroke="#15803d" stroke-width="2.5" marker-end="url(#ag)"/><text x="80" y="118" fill="#15803d">I increasing</text>
<line x1="215" y1="130" x2="460" y2="130" stroke="#1d4ed8" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#ab)" opacity="0.8"/>
<line x1="215" y1="150" x2="460" y2="150" stroke="#1d4ed8" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#ab)" opacity="0.8"/>
<line x1="215" y1="170" x2="460" y2="170" stroke="#1d4ed8" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#ab)" opacity="0.8"/>
<text x="470" y="175" fill="#1d4ed8">Φ grows</text>
<line x1="560" y1="130" x2="490" y2="130" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/><text x="500" y="100" fill="#dc2626">induced emf</text><text x="500" y="118" fill="#dc2626">(opposes I)</text>
<text x="50" y="240" fill="#1f2937">I rises, so Φ rises, so the coil induces an emf opposing the rise (back emf).</text>
<text x="50" y="262" fill="#1f2937">e = −L dI/dt     and     L = NΦ/I     (unit: henry, H)</text>
</svg>
