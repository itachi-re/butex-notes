<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" font-family="Georgia, serif" font-size="15" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="780" height="320" fill="#fff"/>
<text x="20" y="28" font-size="18" font-weight="bold">Ruff degradation: aldose (Cn) → aldose (Cn−1)</text>

<text x="20" y="60">Step 1 — Oxidise the free aldehyde to a carboxylic acid:</text>
<text x="30" y="84">Aldose–CHO  --(Br2 / H2O, mild oxidant)-->  Aldose–COOH  (an aldonic acid)</text>

<text x="20" y="120">Step 2 — Oxidative decarboxylation of the calcium/iron salt with H2O2:</text>
<text x="30" y="144">Aldonic acid  --(Ca(OH)2, then Fe2(SO4)3 / H2O2)-->  loses CO2 and C1</text>
<text x="30" y="164">→  gives the next-lower aldose, Cn−1  (old C2 becomes the new C1 aldehyde)</text>

<text x="20" y="205" font-weight="bold">Mechanism note:</text>
<text x="30" y="228" font-size="14" fill="#555">Fe(III)/H2O2 generates a radical at the carboxylate carbon (oxidative</text>
<text x="30" y="250" font-size="14" fill="#555">decarboxylation), which loses CO2; the resulting radical at old-C2 is</text>
<text x="30" y="272" font-size="14" fill="#555">oxidised on to the new terminal aldehyde.</text>
<text x="20" y="300" font-size="14" fill="#555">Ruff degradation is the reverse direction to Kiliani–Fischer and is used, together with it,</text>
</svg>
