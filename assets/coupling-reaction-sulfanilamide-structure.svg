<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="Georgia, serif" font-size="16" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="780" height="420" fill="#fff"/>
<text x="20" y="28" font-size="20" font-weight="bold">Diazo coupling reaction and a representative sulfa drug</text>

<text x="20" y="58" font-weight="bold">1. Coupling reaction</text>
<text x="30" y="82">Ar–N≡N⁺ Cl⁻  +  Ar'–H (electron-rich arene, e.g. phenol/aniline)</text>
<text x="30" y="104">     ── (weakly acidic/alkaline, 0–5°C) →   Ar–N=N–Ar'  (an azo compound, brightly coloured)</text>
<text x="30" y="128" font-size="14" fill="#555">The diazonium ion acts as a weak electrophile; it attacks the strongly activated para</text>
<text x="30" y="148" font-size="14" fill="#555">position of phenol or an N,N-dialkylaniline via electrophilic aromatic substitution,</text>
<text x="30" y="168" font-size="14" fill="#555">giving the azo (–N=N–) linkage that is the chromophore of azo dyes (Congo red, methyl orange).</text>

<text x="20" y="205" font-weight="bold">2. Sulfa-drug (sulfanilamide) — structure</text>
<g transform="translate(60,225)">
<!-- benzene ring hexagon -->
<polygon points="0,40 35,20 70,40 70,80 35,100 0,80" fill="none" stroke="black" stroke-width="1.5"/>
<line x1="0" y1="40" x2="35" y2="60" stroke="black"/>
<line x1="70" y1="40" x2="35" y2="60" stroke="black"/>
<line x1="35" y1="20" x2="35" y2="60" stroke="black" opacity="0"/>
<!-- inner double-bond hints -->
<line x1="6" y1="44" x2="29" y2="57" stroke="black" stroke-width="1"/>
<line x1="64" y1="44" x2="41" y2="57" stroke="black" stroke-width="1"/>
<line x1="6" y1="76" x2="29" y2="63" stroke="black" stroke-width="1"/>

<!-- NH2 on top -->
<line x1="35" y1="20" x2="35" y2="0" stroke="black"/>
<text x="20" y="-6">H2N</text>

<!-- SO2NH2 on bottom -->
<line x1="35" y1="100" x2="35" y2="122" stroke="black"/>
<text x="8" y="140">—SO2—NH2</text>
</g>
<text x="260" y="270" font-size="15">para-aminobenzenesulfonamide</text>
<text x="260" y="292" font-size="15">(sulfanilamide) — the parent</text>
<text x="260" y="314" font-size="15">sulfa antibacterial drug</text>

<text x="20" y="360" font-size="14" fill="#555">Sulfa drugs are structural mimics of para-aminobenzoic acid (PABA); they competitively</text>
<text x="20" y="382" font-size="14" fill="#555">inhibit bacterial dihydropteroate synthase, blocking folic-acid synthesis (bacteriostatic action).</text>
<text x="20" y="404" font-size="14" fill="#555">Synthesis: aniline → acetanilide (protect NH2) → chlorosulfonation → NH3 → hydrolyse acetyl group.</text>
</svg>
