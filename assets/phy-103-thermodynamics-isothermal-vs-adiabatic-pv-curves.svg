<text x="580.0" y="156.0" font-size="15" fill="#c0392b" font-weight="normal" font-style="normal"><tspan>adiabatic  −γP/V</tspan></text>
<text x="580.0" y="184.0" font-size="15" fill="#222222" font-weight="normal" font-style="normal"><tspan>γ &gt; 1, so the adiabat</tspan></text>
