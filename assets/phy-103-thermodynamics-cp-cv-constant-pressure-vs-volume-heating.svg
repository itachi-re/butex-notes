<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 490" width="860" height="490" role="img" aria-label="Heating a gas at constant volume needs Cv dT; at constant pressure it also does work P dV so needs Cp dT" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Heating a gas at constant volume needs Cv dT; at constant pressure it also does work P dV so needs Cp dT</title>
<defs>
<marker id="a222222" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker>
<marker id="s222222" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#222222"/></marker>
<marker id="a1f5fbf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker>
<marker id="s1f5fbf" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f5fbf"/></marker>
<marker id="ac0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
<marker id="sc0392b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c0392b"/></marker>
<marker id="a2e7d32" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
<marker id="s2e7d32" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e7d32"/></marker>
<marker id="a777777" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#777777"/></marker>
<marker id="s777777" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#777777"/></marker>
</defs>
<rect x="0" y="0" width="860" height="490" fill="#ffffff"/>
<text x="263.4" y="32.0" font-size="18" fill="#222222" font-weight="bold" font-style="normal"><tspan>Heating one mole of an ideal gas by dT</tspan></text>
<text x="95.9" y="66.0" font-size="17" fill="#222222" font-weight="bold" font-style="normal"><tspan>Constant volume (lid fixed)</tspan></text>
<text x="508.4" y="66.0" font-size="17" fill="#222222" font-weight="bold" font-style="normal"><tspan>Constant pressure (free piston)</tspan></text>
<rect x="112" y="114" width="186" height="206" rx="0" fill="#1f5fbf" fill-opacity="0.1" stroke="#222222" stroke-width="0"/>
<line x1="110.0" y1="110.0" x2="110.0" y2="320.0" stroke="#222222" stroke-width="4" stroke-linecap="round"/>
<line x1="300.0" y1="110.0" x2="300.0" y2="320.0" stroke="#222222" stroke-width="4" stroke-linecap="round"/>
<line x1="108.0" y1="320.0" x2="302.0" y2="320.0" stroke="#222222" stroke-width="4" stroke-linecap="round"/>
<rect x="104" y="100" width="202" height="14" rx="2" fill="#777777" fill-opacity="0.5" stroke="#222222" stroke-width="2"/>
<text x="179.6" y="92.0" font-size="15" fill="#222222" font-weight="normal" font-style="normal"><tspan>lid fixed</tspan></text>
<text x="151.8" y="226.0" font-size="16" fill="#222222" font-weight="normal" font-style="normal"><tspan>P rises, V fixed</tspan></text>
<text x="164.7" y="250.0" font-size="16" fill="#222222" font-weight="normal" font-style="normal"><tspan>T → T + dT</tspan></text>
<line x1="205.0" y1="385.0" x2="205.0" y2="330.0" stroke="#c0392b" stroke-width="4" marker-end="url(#ac0392b)" stroke-linecap="round"/>
<text x="160.5" y="412.0" font-size="17" fill="#c0392b" font-weight="bold" font-style="normal"><tspan>Q</tspan><tspan dy="4" font-size="14">V</tspan><tspan dy="-4"> = C</tspan><tspan dy="4" font-size="14">V</tspan><tspan dy="-4"> dT</tspan></text>
<text x="157.5" y="436.0" font-size="16" fill="#222222" font-weight="normal" font-style="normal"><tspan>W = P dV = 0</tspan></text>
<rect x="542" y="190" width="186" height="130" rx="0" fill="#1f5fbf" fill-opacity="0.1" stroke="#222222" stroke-width="0"/>
<line x1="540.0" y1="110.0" x2="540.0" y2="320.0" stroke="#222222" stroke-width="4" stroke-linecap="round"/>
<line x1="730.0" y1="110.0" x2="730.0" y2="320.0" stroke="#222222" stroke-width="4" stroke-linecap="round"/>
<line x1="538.0" y1="320.0" x2="732.0" y2="320.0" stroke="#222222" stroke-width="4" stroke-linecap="round"/>
<rect x="544" y="172" width="182" height="16" rx="2" fill="#777777" fill-opacity="0.5" stroke="#222222" stroke-width="2"/>
<rect x="544" y="196" width="182" height="2" rx="0" fill="none" fill-opacity="1" stroke="#222222" stroke-width="0"/>
<rect x="600" y="130" width="70" height="40" rx="6" fill="#777777" fill-opacity="0.25" stroke="#222222" stroke-width="2"/>
<text x="621.7" y="156.0" font-size="16" fill="#222222" font-weight="normal" font-style="normal"><tspan>m g</tspan></text>
<line x1="544.0" y1="200.0" x2="726.0" y2="200.0" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 5" stroke-linecap="round"/>
<text x="552.0" y="218.0" font-size="14" fill="#777777" font-weight="normal" font-style="normal"><tspan>start level</tspan></text>
<line x1="760.0" y1="200.0" x2="760.0" y2="176.0" stroke="#1f5fbf" stroke-width="3" marker-end="url(#a1f5fbf)" stroke-linecap="round"/>
<text x="745.0" y="160.0" font-size="16" fill="#1f5fbf" font-weight="bold" font-style="normal"><tspan>dV</tspan></text>
<text x="597.3" y="250.0" font-size="16" fill="#222222" font-weight="normal" font-style="normal"><tspan>P constant</tspan></text>
<text x="594.7" y="274.0" font-size="16" fill="#222222" font-weight="normal" font-style="normal"><tspan>T → T + dT</tspan></text>
<line x1="635.0" y1="385.0" x2="635.0" y2="330.0" stroke="#c0392b" stroke-width="4" marker-end="url(#ac0392b)" stroke-linecap="round"/>
<text x="590.5" y="412.0" font-size="17" fill="#c0392b" font-weight="bold" font-style="normal"><tspan>Q</tspan><tspan dy="4" font-size="14">P</tspan><tspan dy="-4"> = C</tspan><tspan dy="4" font-size="14">P</tspan><tspan dy="-4"> dT</tspan></text>
<text x="574.6" y="436.0" font-size="16" fill="#222222" font-weight="normal" font-style="normal"><tspan>W = P dV = R dT</tspan></text>
<text x="210.3" y="470.0" font-size="17" fill="#222222" font-weight="bold" font-style="normal"><tspan>C</tspan><tspan dy="4" font-size="14">P</tspan><tspan dy="-4"> dT = C</tspan><tspan dy="4" font-size="14">V</tspan><tspan dy="-4"> dT + P dV = C</tspan><tspan dy="4" font-size="14">V</tspan><tspan dy="-4"> dT + R dT,   so   C</tspan><tspan dy="4" font-size="14">P</tspan><tspan dy="-4"> − C</tspan><tspan dy="4" font-size="14">V</tspan><tspan dy="-4"> = R</tspan></text>
</svg>
