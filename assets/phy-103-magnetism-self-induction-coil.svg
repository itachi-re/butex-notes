<svg xmlns="http://www.w3.org/2000/svg" width="740" height="385" viewBox="0 0 740 385" font-family="Arial, Helvetica, sans-serif" font-size="16" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Self-induction in a coil with N turns: emf opposes the change of current</title><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect width="740" height="385" fill="#ffffff"/><text x="350" y="30" fill="#1f2937" font-size="18" text-anchor="middle" font-weight="bold" font-style="normal">Self-induction of a coil</text><text x="300" y="66" fill="#2563eb" font-size="16" text-anchor="middle" font-weight="bold" font-style="normal">B inside coil (flux Φ)</text><ellipse cx="210" cy="150" rx="18" ry="62" stroke="#1f2937" stroke-width="2.5" fill="#d97706" fill-opacity="0.12"/><ellipse cx="234" cy="150" rx="18" ry="62" stroke="#1f2937" stroke-width="2.5" fill="#d97706" fill-opacity="0.12"/><ellipse cx="258" cy="150" rx="18" ry="62" stroke="#1f2937" stroke-width="2.5" fill="#d97706" fill-opacity="0.12"/><ellipse cx="282" cy="150" rx="18" ry="62" stroke="#1f2937" stroke-width="2.5" fill="#d97706" fill-opacity="0.12"/><ellipse cx="306" cy="150" rx="18" ry="62" stroke="#1f2937" stroke-width="2.5" fill="#d97706" fill-opacity="0.12"/><ellipse cx="330" cy="150" rx="18" ry="62" stroke="#1f2937" stroke-width="2.5" fill="#d97706" fill-opacity="0.12"/><line x1="195" y1="150" x2="365" y2="150" stroke="#2563eb" stroke-width="3" marker-end="url(#ab)"/><line x1="210" y1="212" x2="210" y2="290" stroke="#1f2937" stroke-width="2"/><line x1="330" y1="212" x2="330" y2="290" stroke="#1f2937" stroke-width="2"/><rect x="190" y="290" width="160" height="30" rx="0" stroke="#1f2937" stroke-width="2" fill="none" fill-opacity="1"/><text x="270" y="311" fill="#1f2937" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal">source</text><line x1="200" y1="225" x2="200" y2="270" stroke="#d97706" stroke-width="3" marker-end="url(#ao)"/><text x="188" y="252" fill="#d97706" font-size="18" text-anchor="end" font-weight="bold" font-style="normal">I</text><text x="480" y="110" fill="#1f2937" font-size="16" text-anchor="start" font-weight="normal" font-style="normal">If I changes,</text><text x="480" y="134" fill="#1f2937" font-size="16" text-anchor="start" font-weight="normal" font-style="normal">Φ = LI changes,</text><text x="480" y="176" fill="#dc2626" font-size="18" text-anchor="start" font-weight="bold" font-style="normal">ε = −L dI/dt</text><text x="480" y="212" fill="#dc2626" font-size="16" text-anchor="start" font-weight="normal" font-style="normal">opposes the change of I</text><text x="480" y="236" fill="#dc2626" font-size="16" text-anchor="start" font-weight="normal" font-style="normal">(Lenz's law)</text><text x="190" y="360" fill="#059669" font-size="16" text-anchor="start" font-weight="bold" font-style="normal">N turns, flux Φ per turn: L = NΦ/I</text></svg>