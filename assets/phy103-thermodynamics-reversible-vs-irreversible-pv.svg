<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="Helvetica,Arial,sans-serif">
  <rect width="700" height="420" fill="#ffffff"/>
  <text x="350" y="26" text-anchor="middle" font-size="17" font-weight="bold">Reversible vs Irreversible Expansion (P-V)</text>

  <!-- Reversible panel: smooth quasi-static path with intermediate equilibrium points -->
  <g>
    <line x1="60" y1="360" x2="320" y2="360" stroke="#000" stroke-width="1.5" marker-end="url(#a11)"/>
    <line x1="60" y1="360" x2="60" y2="80" stroke="#000" stroke-width="1.5" marker-end="url(#a11)"/>
    <text x="300" y="380" font-size="12">V</text>
    <text x="30" y="90" font-size="12">P</text>
    <path d="M100,320 Q170,200 260,150" fill="none" stroke="#1e8449" stroke-width="2.5"/>
    <circle cx="100" cy="320" r="4" fill="#1e8449"/>
    <circle cx="140" cy="270" r="4" fill="#1e8449"/>
    <circle cx="175" cy="228" r="4" fill="#1e8449"/>
    <circle cx="210" cy="195" r="4" fill="#1e8449"/>
    <circle cx="240" cy="168" r="4" fill="#1e8449"/>
    <circle cx="260" cy="150" r="4" fill="#1e8449"/>
    <text x="80" y="400" font-size="13" fill="#1e8449" font-weight="bold">REVERSIBLE: chain of equilibrium states</text>
  </g>

  <!-- Irreversible panel: sudden/free expansion, only endpoints defined -->
  <g>
    <line x1="400" y1="360" x2="660" y2="360" stroke="#000" stroke-width="1.5" marker-end="url(#a11)"/>
    <line x1="400" y1="360" x2="400" y2="80" stroke="#000" stroke-width="1.5" marker-end="url(#a11)"/>
    <text x="640" y="380" font-size="12">V</text>
    <text x="370" y="90" font-size="12">P</text>
    <circle cx="440" cy="320" r="4" fill="#c0392b"/>
    <circle cx="600" cy="150" r="4" fill="#c0392b"/>
    <path d="M440,320 C500,320 500,150 600,150" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="7,5"/>
    <text x="405" y="400" font-size="13" fill="#c0392b" font-weight="bold">IRREVERSIBLE: only initial/final states defined</text>
    <text x="405" y="416" font-size="11" fill="#555">(intermediate path not in equilibrium — dashed = not a true P-V curve)</text>
  </g>

  <defs>
    <marker id="a11" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
    </marker>
  </defs>
</svg>
