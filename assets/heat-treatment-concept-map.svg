<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="1100" height="720" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Heat treatment concept map" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Heat treatment concept map</title><desc>Cooling rate, temperature and time determine microstructure and properties</desc><defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker><pattern id="lam" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#f3e3c3"/><line x1="0" y1="3" x2="6" y2="3" stroke="#6b3d10" stroke-width="1.6"/></pattern><pattern id="lamf" width="3.5" height="3.5" patternUnits="userSpaceOnUse"><rect width="3.5" height="3.5" fill="#f3e3c3"/><line x1="0" y1="1.7" x2="3.5" y2="1.7" stroke="#6b3d10" stroke-width="1.2"/></pattern><pattern id="lamc" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f3e3c3"/><line x1="0" y1="5" x2="10" y2="5" stroke="#6b3d10" stroke-width="2.2"/></pattern></defs><rect width="100%" height="100%" fill="#fff"/><text x="550.0" y="26" font-size="17" text-anchor="middle" fill="#0b2a55" font-weight="bold"><tspan x="550.0" dy="0.0">Heat Treatment Concept Map</tspan></text><text x="550.0" y="44" font-size="11.5" text-anchor="middle" fill="#555" font-style="italic"><tspan x="550.0" dy="0.0">Schematic</tspan></text><rect x="430" y="60" width="240" height="60" rx="8" fill="#fff3b0" stroke="#1a3c6e" stroke-width="1.6"/><text x="550.0" y="86.425" font-size="13" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="550.0" dy="0.0">STEEL → heat to AUSTENITE</tspan><tspan x="550.0" dy="16.2">(solid-state heat treatment)</tspan></text><rect x="430" y="160" width="240" height="55" rx="8" fill="#fde8d0" stroke="#1a3c6e" stroke-width="1.6"/><text x="550.0" y="184.0625" font-size="12.5" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="550.0" dy="0.0">Cooling rate + temperature + time</tspan><tspan x="550.0" dy="15.6">= transformation path</tspan></text><line x1="550" y1="120" x2="550" y2="160" stroke="#333" stroke-width="2" marker-end="url(#ar)"/><rect x="20" y="270" width="320" height="52" rx="8" fill="#d9f2e6" stroke="#1a3c6e" stroke-width="1.6"/><text x="180.0" y="292.5625" font-size="12.5" text-anchor="middle" fill="#111"><tspan x="180.0" dy="0.0">SLOW cooling</tspan><tspan x="180.0" dy="15.6">more diffusion time → coarse products</tspan></text><line x1="550" y1="215" x2="180" y2="270" stroke="#333" stroke-width="2" marker-end="url(#ar)"/><rect x="20" y="350" width="320" height="44" rx="8" fill="#d9f2e6" stroke="#1a3c6e" stroke-width="1.6"/><text x="180.0" y="376.55" font-size="13" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="180.0" dy="0.0">Full annealing</tspan></text><line x1="180" y1="322" x2="180" y2="350" stroke="#333" stroke-width="2" marker-end="url(#ar)"/><rect x="20" y="420" width="320" height="44" rx="8" fill="#d9f2e6" stroke="#1a3c6e" stroke-width="1.6"/><text x="180.0" y="446.375" font-size="12.5" text-anchor="middle" fill="#111"><tspan x="180.0" dy="0.0">coarse pearlite + ferrite</tspan></text><line x1="180" y1="394" x2="180" y2="420" stroke="#333" stroke-width="2" marker-end="url(#ar)"/><rect x="20" y="490" width="320" height="44" rx="8" fill="#d9f2e6" stroke="#1a3c6e" stroke-width="1.6"/><text x="180.0" y="516.375" font-size="12.5" text-anchor="middle" fill="#111"><tspan x="180.0" dy="0.0">soft, ductile</tspan></text><line x1="180" y1="464" x2="180" y2="490" stroke="#333" stroke-width="2" marker-end="url(#ar)"/><rect x="390" y="270" width="320" height="52" rx="8" fill="#fff3b0" stroke="#1a3c6e" stroke-width="1.6"/><text x="550.0" y="292.5625" font-size="12.5" text-anchor="middle" fill="#111"><tspan x="550.0" dy="0.0">MODERATE cooling</tspan><tspan x="550.0" dy="15.6">(still air) finer products</tspan></text><line x1="550" y1="215" x2="550" y2="270" stroke="#333" stroke-width="2" marker-end="url(#ar)"/><rect x="390" y="350" width="320" height="44" rx="8" fill="#fff3b0" stroke="#1a3c6e" stroke-width="1.6"/><text x="550.0" y="376.55" font-size="13" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="550.0" dy="0.0">Normalizing</tspan></text><line x1="550" y1="322" x2="550" y2="350" stroke="#333" stroke-width="2" marker-end="url(#ar)"/><rect x="390" y="420" width="320" height="44" rx="8" fill="#fff3b0" stroke="#1a3c6e" stroke-width="1.6"/><text x="550.0" y="446.375" font-size="12.5" text-anchor="middle" fill="#111"><tspan x="550.0" dy="0.0">finer pearlite, less ferrite</tspan></text><line x1="550" y1="394" x2="550" y2="420" stroke="#333" stroke-width="2" marker-end="url(#ar)"/><rect x="390" y="490" width="320" height="44" rx="8" fill="#fff3b0" stroke="#1a3c6e" stroke-width="1.6"/><text x="550.0" y="516.375" font-size="12.5" text-anchor="middle" fill="#111"><tspan x="550.0" dy="0.0">harder, stronger</tspan></text><line x1="550" y1="464" x2="550" y2="490" stroke="#333" stroke-width="2" marker-end="url(#ar)"/><rect x="760" y="270" width="320" height="52" rx="8" fill="#fdd9d9" stroke="#1a3c6e" stroke-width="1.6"/><text x="920.0" y="292.5625" font-size="12.5" text-anchor="middle" fill="#111"><tspan x="920.0" dy="0.0">VERY RAPID cooling</tspan><tspan x="920.0" dy="15.6">carbon trapped, diffusionless</tspan></text><line x1="550" y1="215" x2="920" y2="270" stroke="#333" stroke-width="2" marker-end="url(#ar)"/><rect x="760" y="350" width="320" height="44" rx="8" fill="#fdd9d9" stroke="#1a3c6e" stroke-width="1.6"/><text x="920.0" y="376.55" font-size="13" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="920.0" dy="0.0">Hardening</tspan></text><line x1="920" y1="322" x2="920" y2="350" stroke="#333" stroke-width="2" marker-end="url(#ar)"/><rect x="760" y="420" width="320" height="44" rx="8" fill="#fdd9d9" stroke="#1a3c6e" stroke-width="1.6"/><text x="920.0" y="446.375" font-size="12.5" text-anchor="middle" fill="#111"><tspan x="920.0" dy="0.0">MARTENSITE (BCT)</tspan></text><line x1="920" y1="394" x2="920" y2="420" stroke="#333" stroke-width="2" marker-end="url(#ar)"/><rect x="760" y="490" width="320" height="44" rx="8" fill="#fdd9d9" stroke="#1a3c6e" stroke-width="1.6"/><text x="920.0" y="516.375" font-size="12.5" text-anchor="middle" fill="#111"><tspan x="920.0" dy="0.0">very hard, brittle, residual stress</tspan></text><line x1="920" y1="464" x2="920" y2="490" stroke="#333" stroke-width="2" marker-end="url(#ar)"/><rect x="760" y="570" width="320" height="50" rx="8" fill="#f3d9f2" stroke="#1a3c6e" stroke-width="1.6"/><text x="920.0" y="591.7" font-size="12" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="920.0" dy="0.0">TEMPERING (reheat &lt; A₁)</tspan><tspan x="920.0" dy="15.0">stress ↓ ductility/toughness ↑ hardness ↓</tspan></text><line x1="920" y1="534" x2="920" y2="570" stroke="#333" stroke-width="2" marker-end="url(#ar)"/><rect x="390" y="570" width="320" height="50" rx="8" fill="#e8f0fe" stroke="#1a3c6e" stroke-width="1.6"/><text x="550.0" y="591.7" font-size="12" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="550.0" dy="0.0">INTERMEDIATE TEMPERATURE hold</tspan><tspan x="550.0" dy="15.0">→ BAINITE / austempering (TTT)</tspan></text><rect x="20" y="570" width="320" height="50" rx="8" fill="#eeeeee" stroke="#1a3c6e" stroke-width="1.6"/><text x="180.0" y="591.8375" font-size="11.5" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="180.0" dy="0.0">SUBCRITICAL anneals (stress-relief, process,</tspan><tspan x="180.0" dy="14.4">spheroidizing) – no austenite formed</tspan></text><text x="550" y="660" font-size="12.5" text-anchor="middle" fill="#0b2a55" font-weight="bold"><tspan x="550" dy="0.0">TTT diagram = the tool: cooling curve drawn on temperature–log-time map → predicts pearlite / bainite / martensite</tspan></text><text x="550" y="684" font-size="12" text-anchor="middle" fill="#111"><tspan x="550" dy="0.0">Property chain:  finer / more distorted structure → higher hardness &amp; strength → lower ductility &amp; toughness (tempering reverses this partly)</tspan></text></svg>