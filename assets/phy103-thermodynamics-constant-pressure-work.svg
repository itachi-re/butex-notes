<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="Helvetica,Arial,sans-serif">
  <rect width="560" height="380" fill="#ffffff"/>
  <text x="280" y="26" text-anchor="middle" font-size="17" font-weight="bold">Work at Constant Pressure: W = P(V₂ − V₁)</text>

  <line x1="80" y1="320" x2="510" y2="320" stroke="#000" stroke-width="1.5" marker-end="url(#a5)"/>
  <line x1="80" y1="320" x2="80" y2="60" stroke="#000" stroke-width="1.5" marker-end="url(#a5)"/>
  <text x="495" y="342" font-size="13">V</text>
  <text x="45" y="70" font-size="13">P</text>

  <!-- horizontal isobar -->
  <line x1="150" y1="180" x2="420" y2="180" stroke="#2255aa" stroke-width="3"/>
  <rect x="150" y="180" width="270" height="140" fill="#d6f0dc" stroke="none"/>
  <line x1="150" y1="320" x2="150" y2="180" stroke="#555" stroke-dasharray="4,3"/>
  <line x1="420" y1="320" x2="420" y2="180" stroke="#555" stroke-dasharray="4,3"/>
  <line x1="80" y1="180" x2="150" y2="180" stroke="#555" stroke-dasharray="4,3"/>

  <text x="140" y="335" font-size="12">V₁</text>
  <text x="412" y="335" font-size="12">V₂</text>
  <text x="55" y="184" font-size="12">P</text>

  <text x="240" y="255" font-size="14" font-weight="bold" fill="#1e8449">W = P(V₂ − V₁)</text>
  <text x="255" y="275" font-size="11" fill="#1e8449">(rectangular area)</text>

  <text x="80" y="360" font-size="12" fill="#333">Since P is constant, ∫P dV = P∫dV = P(V₂ − V₁). The region is a rectangle, not a general curve.</text>

  <defs>
    <marker id="a5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
    </marker>
  </defs>
</svg>
