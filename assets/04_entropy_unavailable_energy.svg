<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow04" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333333"/>
    </marker>
  </defs>
  <rect width="700" height="400" fill="#ffffff"/>

  <text x="300" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#222222">Heat Q split into available and unavailable energy</text>

  <!-- vertical axis -->
  <line x1="120" y1="330" x2="120" y2="70" stroke="#222222" stroke-width="2" marker-end="url(#arrow04)"/>
  <text x="95" y="65" font-size="13" fill="#222222">Energy</text>

  <!-- single bar representing total Q, split into two segments -->
  <rect x="180" y="80" width="140" height="90" fill="#c94040" stroke="#7a1414" stroke-width="1.5"/>
  <text x="250" y="120" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">Unavailable</text>
  <text x="250" y="138" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">T₀ΔS</text>

  <rect x="180" y="170" width="140" height="160" fill="#4a9c5d" stroke="#276b38" stroke-width="1.5"/>
  <text x="250" y="240" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">Available</text>
  <text x="250" y="258" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">(max. work)</text>
  <text x="250" y="276" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">W_max = Q − T₀ΔS</text>

  <!-- bracket for total Q -->
  <line x1="340" y1="80" x2="360" y2="80" stroke="#333333" stroke-width="1.5"/>
  <line x1="340" y1="330" x2="360" y2="330" stroke="#333333" stroke-width="1.5"/>
  <line x1="350" y1="80" x2="350" y2="330" stroke="#333333" stroke-width="1.5"/>
  <text x="400" y="210" font-size="15" font-weight="bold" fill="#222222">Total heat Q</text>
  <text x="400" y="230" font-size="12" fill="#555555">(fixed by 1st law)</text>

  <!-- explanatory text -->
  <text x="480" y="120" font-size="12" fill="#7a1414">Rejected to sink at T₀ —</text>
  <text x="480" y="138" font-size="12" fill="#7a1414">thermodynamically unavoidable,</text>
  <text x="480" y="156" font-size="12" fill="#7a1414">not an engineering shortfall.</text>

  <text x="480" y="220" font-size="12" fill="#276b38">Convertible to useful work</text>
  <text x="480" y="238" font-size="12" fill="#276b38">by a reversible engine between</text>
  <text x="480" y="256" font-size="12" fill="#276b38">the heat source and sink T₀.</text>

  <line x1="180" y1="330" x2="320" y2="330" stroke="#222222" stroke-width="2"/>
</svg>
