<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" font-family="Helvetica, Arial, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Magnetic force on a moving charge and circular motion</title>
<defs>
<marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#1f2937"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#1d4ed8"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#dc2626"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#15803d"/></marker>
</defs>
<rect width="680" height="330" fill="#ffffff"/>
<text x="40" y="30" fill="#1f2937" font-weight="bold">(a) F = q v × B</text>
<line x1="80" y1="220" x2="300" y2="220" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="305" y="225" fill="#dc2626">B</text>
<line x1="80" y1="220" x2="200" y2="120" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ab)"/>
<text x="206" y="116" fill="#1d4ed8">v</text>
<path d="M130 220 A50 50 0 0 0 121 190" fill="none" stroke="#1f2937"/>
<text x="140" y="205" fill="#1f2937">θ</text>
<circle cx="80" cy="220" r="14" fill="none" stroke="#15803d" stroke-width="2"/>
<path d="M73 213 L87 227 M87 213 L73 227" stroke="#15803d" stroke-width="2"/>
<text x="40" y="262" fill="#15803d">F (into page, for +q)</text>
<text x="40" y="290" fill="#1f2937">F = qvB sin θ, F is perpendicular to v and B</text>
<text x="400" y="30" fill="#1f2937" font-weight="bold">(b) v perpendicular to B: circular path</text>
<g fill="#dc2626" font-size="18">
<text x="430" y="70">×</text><text x="490" y="70">×</text><text x="550" y="70">×</text><text x="610" y="70">×</text>
<text x="430" y="130">×</text><text x="610" y="130">×</text>
<text x="430" y="190">×</text><text x="610" y="190">×</text>
<text x="430" y="250">×</text><text x="490" y="250">×</text><text x="550" y="250">×</text><text x="610" y="250">×</text>
</g>
<circle cx="520" cy="160" r="60" fill="none" stroke="#1d4ed8" stroke-width="2"/>
<circle cx="580" cy="160" r="6" fill="#1d4ed8"/>
<line x1="580" y1="160" x2="580" y2="110" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ab)"/>
<text x="588" y="118" fill="#1d4ed8">v</text>
<line x1="580" y1="160" x2="536" y2="160" stroke="#15803d" stroke-width="2" marker-end="url(#ag)"/>
<text x="548" y="184" fill="#15803d">F</text>
<line x1="520" y1="160" x2="560" y2="127" stroke="#6b7280" stroke-dasharray="4 3"/>
<text x="528" y="138" fill="#6b7280">r</text>
<text x="400" y="288" fill="#1f2937">r = mv/(qB),   T = 2πm/(qB)</text>
<text x="400" y="306" fill="#1f2937">(positive charge, anticlockwise)</text>
<text x="400" y="320" fill="#dc2626">× = B into the page</text>
</svg>
