<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Irreversible heat flow from hot to cold</title>
<desc>Heat Q flows from hot body at T1 to cold body at T2 and the total entropy change is positive.</desc>
<defs><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="my" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#777777"/></marker></defs>
<rect x="0" y="0" width="720" height="380" fill="#ffffff"/>
<text x="360" y="28" fill="#222222" font-size="16" text-anchor="middle" font-weight="bold">Heat flow from hot to cold is irreversible: ΔS(total) &gt; 0</text>
<rect x="60" y="100" width="180" height="120" rx="0" fill="#c0392b" fill-opacity="0.12" stroke="#c0392b" stroke-width="2"/>
<rect x="480" y="100" width="180" height="120" rx="0" fill="#1f5fbf" fill-opacity="0.12" stroke="#1f5fbf" stroke-width="2"/>
<text x="150" y="150" fill="#222222" font-size="15" text-anchor="middle" font-weight="bold">Hot body</text>
<text x="150" y="176" fill="#c0392b" font-size="15" text-anchor="middle" font-weight="bold">T₁ = 400 K</text>
<text x="570" y="150" fill="#222222" font-size="15" text-anchor="middle" font-weight="bold">Cold body</text>
<text x="570" y="176" fill="#1f5fbf" font-size="15" text-anchor="middle" font-weight="bold">T₂ = 300 K</text>
<line x1="240" y1="160" x2="480" y2="160" stroke="#c0392b" stroke-width="3" marker-end="url(#mr)"/>
<text x="360" y="140" fill="#c0392b" font-size="15" text-anchor="middle" font-weight="bold">Q = 1200 J</text>
<text x="360" y="188" fill="#222222" font-size="14" text-anchor="middle" font-weight="normal">spontaneous flow</text>
<text x="150" y="252" fill="#c0392b" font-size="14" text-anchor="middle" font-weight="normal">ΔS₁ = −Q/T₁ = −3.0 J/K</text>
<text x="570" y="252" fill="#1f5fbf" font-size="14" text-anchor="middle" font-weight="normal">ΔS₂ = +Q/T₂ = +4.0 J/K</text>
<text x="360" y="312" fill="#222222" font-size="16" text-anchor="middle" font-weight="bold">ΔS(total) = Q(1/T₂ − 1/T₁) = +1.0 J/K &gt; 0</text>
<text x="360" y="342" fill="#222222" font-size="14" text-anchor="middle" font-weight="normal">Entropy of the universe increases: the process cannot reverse itself.</text>
</svg>
