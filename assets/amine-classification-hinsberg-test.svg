<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="720" height="380" fill="#ffffff"/>
<text x="360" y="26" text-anchor="middle" font-size="18" font-weight="bold">Classification of Amines &amp; Separation by Hinsberg's Test</text>

<!-- General structures -->
<g font-size="15">
<rect x="20" y="50" width="200" height="90" rx="8" fill="#eef5ff" stroke="#1f5fa8"/>
<text x="120" y="72" text-anchor="middle" font-weight="bold">1° Amine</text>
<text x="120" y="100" text-anchor="middle" font-size="20">R&#8211;NH&#8322;</text>
<text x="120" y="122" text-anchor="middle" font-size="12">one H replaced on NH&#8323;</text>

<rect x="260" y="50" width="200" height="90" rx="8" fill="#eef5ff" stroke="#1f5fa8"/>
<text x="360" y="72" text-anchor="middle" font-weight="bold">2° Amine</text>
<text x="360" y="100" text-anchor="middle" font-size="20">R&#8322;NH</text>
<text x="360" y="122" text-anchor="middle" font-size="12">two H replaced on NH&#8323;</text>

<rect x="500" y="50" width="200" height="90" rx="8" fill="#eef5ff" stroke="#1f5fa8"/>
<text x="600" y="72" text-anchor="middle" font-weight="bold">3° Amine</text>
<text x="600" y="100" text-anchor="middle" font-size="20">R&#8323;N</text>
<text x="600" y="122" text-anchor="middle" font-size="12">all three H replaced</text>
</g>

<!-- Hinsberg flow -->
<text x="360" y="175" text-anchor="middle" font-size="16" font-weight="bold">Hinsberg's Test (PhSO&#8322;Cl + KOH)</text>

<rect x="270" y="190" width="180" height="40" rx="6" fill="#fff7e0" stroke="#a87c00"/>
<text x="360" y="215" text-anchor="middle" font-size="13">Mixture of 1°,2°,3° amine</text>
<line x1="360" y1="230" x2="360" y2="250" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="20" y="255" width="200" height="70" rx="6" fill="#e8ffe8" stroke="#2e7d32"/>
<text x="120" y="275" text-anchor="middle" font-size="13" font-weight="bold">1° amine</text>
<text x="120" y="293" text-anchor="middle" font-size="12">forms soluble N-alkyl</text>
<text x="120" y="308" text-anchor="middle" font-size="12">sulfonamide salt (KOH)</text>

<rect x="260" y="255" width="200" height="70" rx="6" fill="#ffe8e8" stroke="#a83232"/>
<text x="360" y="275" text-anchor="middle" font-size="13" font-weight="bold">2° amine</text>
<text x="360" y="293" text-anchor="middle" font-size="12">forms insoluble</text>
<text x="360" y="308" text-anchor="middle" font-size="12">N,N-dialkyl sulfonamide</text>

<rect x="500" y="255" width="200" height="70" rx="6" fill="#eef0ff" stroke="#3a3aa8"/>
<text x="600" y="275" text-anchor="middle" font-size="13" font-weight="bold">3° amine</text>
<text x="600" y="293" text-anchor="middle" font-size="12">does not react</text>
<text x="600" y="308" text-anchor="middle" font-size="12">(no N&#8211;H) &#8211; stays as free amine</text>

<text x="360" y="355" text-anchor="middle" font-size="12" fill="#555">Filter insoluble 2° sulfonamide &#8594; acidify filtrate to free 1° amine &#8594; extract free 3° amine layer.</text>

<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 Z" fill="#333"/>
</marker>
</defs>
</svg>
