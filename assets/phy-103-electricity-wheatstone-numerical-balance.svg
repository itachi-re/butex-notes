<text x="205.0" y="170.0" fill="#1f5fbf" font-size="18" text-anchor="middle">P = 8 Ω</text>
<text x="478.0" y="170.0" fill="#1f5fbf" font-size="18" text-anchor="middle">Q = 16 Ω</text>
<text x="188.0" y="345.0" fill="#1f5fbf" font-size="18" text-anchor="middle">R = 12 Ω</text>
