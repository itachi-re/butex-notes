<title id="t">Wheatstone bridge numerical with an extra 48 ohm resistor in parallel with S</title>
<desc id="d">Bridge with P = 8, Q = 16, R = 12 and S = 48 ohms. A 48 ohm resistor X is connected in parallel with S so that the fourth arm becomes 24 ohms and the bridge balances.</desc>
