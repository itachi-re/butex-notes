<svg viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="600" height="320" fill="#ffffff"/>
<text x="300" y="24" text-anchor="middle" font-size="16" font-weight="bold">Specific Volume vs Temperature: T&#7524; and T&#7524;</text>

<line x1="60" y1="270" x2="560" y2="270" stroke="#333" stroke-width="2"/>
<line x1="60" y1="270" x2="60" y2="40" stroke="#333" stroke-width="2"/>
<text x="300" y="298" text-anchor="middle" font-size="13">Temperature &#8594;</text>
<text x="25" y="160" font-size="13" transform="rotate(-90 25 160)">Specific volume</text>

<!-- amorphous curve: gradual slope change at Tg -->
<path d="M80,250 L220,190 L560,60" stroke="#1f5fa8" stroke-width="3" fill="none"/>
<line x1="220" y1="270" x2="220" y2="190" stroke="#1f5fa8" stroke-dasharray="4,3"/>
<text x="220" y="285" text-anchor="middle" font-size="12" fill="#1f5fa8" font-weight="bold">T&#7524; (glass transition)</text>

<!-- crystalline curve: sharp jump at Tm -->
<path d="M80,255 L400,235 L400,150 L560,100" stroke="#a83232" stroke-width="3" fill="none"/>
<line x1="400" y1="270" x2="400" y2="150" stroke="#a83232" stroke-dasharray="4,3"/>
<text x="400" y="285" text-anchor="middle" font-size="12" fill="#a83232" font-weight="bold">T&#7524; (melting)</text>

<text x="440" y="80" font-size="11" fill="#a83232">crystalline / semi-crystalline</text>
<text x="440" y="55" font-size="11" fill="#1f5fa8">amorphous</text>

<text x="20" y="315" font-size="11" fill="#555">T&#7524;: gradual change in slope (2nd-order, amorphous regions soften). T&#7524;: sharp discontinuity (1st-order, crystallites melt).</text>
</svg>
