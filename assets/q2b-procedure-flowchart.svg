<svg xmlns="http://www.w3.org/2000/svg" width="780" height="985" viewBox="0 0 780 985" role="img" aria-label="Procedure for estimating sodium carbonate in washing soda">
<title>Procedure for estimating sodium carbonate in washing soda</title>
<desc>Procedure for estimating sodium carbonate in washing soda</desc>
<rect width="780" height="985" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<text x="390.0" y="36.0" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="21" text-anchor="middle" font-weight="bold" fill="#1f2328" >Q2(b): Procedure for estimating sodium carbonate in washing soda</text><text x="390.0" y="60.0" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#57606a" >Acid–base titration, standard HCl against sample, methyl orange indicator</text><rect x="120.0" y="89.0" width="420" height="62" rx="10" fill="#eef6ff" stroke="#3b82f6" stroke-width="1.8"/><text x="330.0" y="115.8" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2328" >Weigh about 5 g of washing soda</text><text x="330.0" y="134.0" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2328" >accurately on an analytical balance</text><circle cx="120" cy="120" r="17" fill="#2563eb"/><text x="120.0" y="125.5" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#fff" >1</text><polyline points="330,151 330,182" fill="none" stroke="#444" stroke-width="1.9" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="120.0" y="182.0" width="420" height="62" rx="10" fill="#eef6ff" stroke="#3b82f6" stroke-width="1.8"/><text x="330.0" y="208.8" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2328" >Dissolve in distilled water and make up</text><text x="330.0" y="227.0" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2328" >to 250 mL in a volumetric flask</text><circle cx="120" cy="213" r="17" fill="#2563eb"/><text x="120.0" y="218.5" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#fff" >2</text><polyline points="330,244 330,275" fill="none" stroke="#444" stroke-width="1.9" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="120.0" y="275.0" width="420" height="62" rx="10" fill="#eef6ff" stroke="#3b82f6" stroke-width="1.8"/><text x="330.0" y="301.8" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2328" >Pipette 25.0 mL of this solution</text><text x="330.0" y="320.0" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2328" >into a clean conical flask</text><circle cx="120" cy="306" r="17" fill="#2563eb"/><text x="120.0" y="311.5" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#fff" >3</text><polyline points="330,337 330,368" fill="none" stroke="#444" stroke-width="1.9" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="120.0" y="368.0" width="420" height="62" rx="10" fill="#eef6ff" stroke="#3b82f6" stroke-width="1.8"/><text x="330.0" y="394.8" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2328" >Add 1–2 drops of methyl orange</text><text x="330.0" y="413.0" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2328" >(solution turns yellow)</text><circle cx="120" cy="399" r="17" fill="#2563eb"/><text x="120.0" y="404.5" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#fff" >4</text><polyline points="330,430 330,461" fill="none" stroke="#444" stroke-width="1.9" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="120.0" y="461.0" width="420" height="62" rx="10" fill="#eef6ff" stroke="#3b82f6" stroke-width="1.8"/><text x="330.0" y="487.8" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2328" >Fill the burette with standard 0.1 N HCl</text><text x="330.0" y="506.0" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2328" >and note the initial reading</text><circle cx="120" cy="492" r="17" fill="#2563eb"/><text x="120.0" y="497.5" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#fff" >5</text><polyline points="330,523 330,554" fill="none" stroke="#444" stroke-width="1.9" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="120.0" y="554.0" width="420" height="62" rx="10" fill="#eef6ff" stroke="#3b82f6" stroke-width="1.8"/><text x="330.0" y="580.8" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2328" >Titrate: add HCl dropwise</text><text x="330.0" y="599.0" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2328" >while swirling the flask</text><circle cx="120" cy="585" r="17" fill="#2563eb"/><text x="120.0" y="590.5" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#fff" >6</text><polyline points="330,616 330,636" fill="none" stroke="#444" stroke-width="1.9" stroke-linejoin="round" marker-end="url(#ah)"/><polygon points="330,636.0 500.0,696 330,756.0 160.0,696" fill="#fff8e1" stroke="#f59e0b" stroke-width="1.8"/><text x="330.0" y="682.7" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2328" >Colour change from</text><text x="330.0" y="700.9" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2328" >yellow to orange / pink</text><text x="330.0" y="719.1" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2328" >on one drop?</text><circle cx="120" cy="696" r="17" fill="#2563eb"/><text x="120.0" y="701.5" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#fff" >7</text><polyline points="500,696 592,696 592,585 540,585" fill="none" stroke="#444" stroke-width="1.9" marker-end="url(#ah)"/><text x="604.0" y="688.0" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#374151" >No: add more</text><text x="604.0" y="704.0" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#374151" >HCl (dropwise)</text><polyline points="330,756 330,796" fill="none" stroke="#444" stroke-width="1.9" stroke-linejoin="round" marker-end="url(#ah)"/><text x="394.0" y="782.0" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#374151" >Yes: end point</text><rect x="120.0" y="795.0" width="420" height="62" rx="10" fill="#eef6ff" stroke="#3b82f6" stroke-width="1.8"/><text x="330.0" y="821.8" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2328" >Note the final burette reading.</text><text x="330.0" y="840.0" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2328" >Repeat until 3 concordant readings</text><circle cx="120" cy="826" r="17" fill="#2563eb"/><text x="120.0" y="831.5" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#fff" >8</text><polyline points="330,857 330,888" fill="none" stroke="#444" stroke-width="1.9" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="120.0" y="888.0" width="420" height="62" rx="10" fill="#e8f7ec" stroke="#16a34a" stroke-width="1.8"/><text x="222.4" y="914.8" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="14.0" text-anchor="start" font-weight="bold" fill="#1f2328" >Calculate: N</text><text x="303.3" y="918.2" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="9.8" text-anchor="start" font-weight="bold" fill="#1f2328" >1</text><text x="308.8" y="914.8" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="14.0" text-anchor="start" font-weight="bold" fill="#1f2328" >V</text><text x="318.1" y="918.2" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="9.8" text-anchor="start" font-weight="bold" fill="#1f2328" >1</text><text x="323.6" y="914.8" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="14.0" text-anchor="start" font-weight="bold" fill="#1f2328" > = N</text><text x="349.6" y="918.2" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="9.8" text-anchor="start" font-weight="bold" fill="#1f2328" >2</text><text x="355.1" y="914.8" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="14.0" text-anchor="start" font-weight="bold" fill="#1f2328" >V</text><text x="364.4" y="918.2" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="9.8" text-anchor="start" font-weight="bold" fill="#1f2328" >2</text><text x="369.9" y="914.8" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="14.0" text-anchor="start" font-weight="bold" fill="#1f2328" >, strength,</text><text x="271.7" y="933.0" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="14.0" text-anchor="start" font-weight="bold" fill="#1f2328" >then % of Na</text><text x="356.4" y="936.4" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="9.8" text-anchor="start" font-weight="bold" fill="#1f2328" >2</text><text x="361.9" y="933.0" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="14.0" text-anchor="start" font-weight="bold" fill="#1f2328" >CO</text><text x="382.9" y="936.4" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="9.8" text-anchor="start" font-weight="bold" fill="#1f2328" >3</text><circle cx="120" cy="919" r="17" fill="#16a34a"/><text x="120.0" y="924.5" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#fff" >9</text></svg>