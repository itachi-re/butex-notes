<title id="t">Oligomer versus polymer and degree of polymerisation</title>
<desc id="d">A single monomer, an oligomer of five units and a polymer of about a thousand units drawn as beads, with the formula DP equals molar mass of polymer divided by molar mass of repeating unit.</desc>
