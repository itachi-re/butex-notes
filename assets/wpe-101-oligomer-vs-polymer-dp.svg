<text xml:space="preserve" x="450.0" y="32.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="22.0" font-weight="bold" fill="#111111" text-anchor="middle">Oligomer vs polymer and degree of polymerisation (DP)</text>
