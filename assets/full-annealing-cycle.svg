<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Full annealing cycle and structure evolution" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Full annealing cycle and structure evolution</title><desc>Temperature-time cycle, cooling schematic and structure evolution</desc><defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker><pattern id="lam" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#f3e3c3"/><line x1="0" y1="3" x2="6" y2="3" stroke="#6b3d10" stroke-width="1.6"/></pattern><pattern id="lamf" width="3.5" height="3.5" patternUnits="userSpaceOnUse"><rect width="3.5" height="3.5" fill="#f3e3c3"/><line x1="0" y1="1.7" x2="3.5" y2="1.7" stroke="#6b3d10" stroke-width="1.2"/></pattern><pattern id="lamc" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f3e3c3"/><line x1="0" y1="5" x2="10" y2="5" stroke="#6b3d10" stroke-width="2.2"/></pattern></defs><rect width="100%" height="100%" fill="#fff"/><text x="490.0" y="26" font-size="17" text-anchor="middle" fill="#0b2a55" font-weight="bold"><tspan x="490.0" dy="0.0">Full Annealing – Cycle, Cooling and Structure</tspan></text><text x="490.0" y="44" font-size="11.5" text-anchor="middle" fill="#555" font-style="italic"><tspan x="490.0" dy="0.0">Schematic – not to scale</tspan></text><line x1="70" y1="440" x2="520" y2="440" stroke="#111" stroke-width="2" marker-end="url(#ar)"/><line x1="70" y1="440" x2="70" y2="90" stroke="#111" stroke-width="2" marker-end="url(#ar)"/><text x="295.0" y="474" font-size="12" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="295.0" dy="0.0">Time →</tspan></text><text x="32" y="265.0" font-size="12" text-anchor="middle" fill="#111" font-weight="bold" transform="rotate(-90 32 265.0)"><tspan x="32" dy="0.0">Temperature →</tspan></text><line x1="70" y1="200" x2="520" y2="200" stroke="#b33" stroke-width="1.5" stroke-dasharray="6 4"/><text x="524" y="204" font-size="11" text-anchor="start" fill="#b33"><tspan x="524" dy="0.0">A₃ (upper critical)</tspan></text><line x1="70" y1="270" x2="520" y2="270" stroke="#33b" stroke-width="1.5" stroke-dasharray="6 4"/><text x="524" y="274" font-size="11" text-anchor="start" fill="#33b"><tspan x="524" dy="0.0">A₁ (lower critical)</tspan></text><path d="M70 430 L190 150 L300 150 C360 200 400 250 430 300 C450 340 470 390 500 430" stroke="#c0392b" stroke-width="3.5" fill="none"/><text x="105" y="290" font-size="12" text-anchor="start" fill="#c0392b" font-weight="bold"><tspan x="105" dy="0.0">1 Heat</tspan></text><text x="245" y="138" font-size="12" text-anchor="middle" fill="#c0392b" font-weight="bold"><tspan x="245" dy="0.0">2 Hold (austenite)</tspan></text><text x="420" y="330" font-size="12" text-anchor="start" fill="#c0392b" font-weight="bold"><tspan x="420" dy="0.0">3 VERY SLOW</tspan></text><text x="420" y="346" font-size="12" text-anchor="start" fill="#c0392b" font-weight="bold"><tspan x="420" dy="0.0">furnace cool</tspan></text><text x="70" y="470" font-size="12" text-anchor="start" fill="#111" font-style="italic"><tspan x="70" dy="0.0">Heat to proper temperature (into austenite) → hold → cool very slowly ≈ equilibrium conditions</tspan></text><text x="70" y="488" font-size="12" text-anchor="start" fill="#111" font-style="italic"><tspan x="70" dy="0.0">Follows the iron–iron carbide diagram: ferrite + pearlite forms (e.g. coarse-grained 0.2 % C steel)</tspan></text><text x="790" y="80" font-size="13" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="790" dy="0.0">Structure evolution (0.2 % C steel)</tspan></text><text x="790" y="110" font-size="11.5" text-anchor="middle" fill="#111"><tspan x="790" dy="0.0">(a) Coarse-grained starting steel</tspan></text><rect x="730" y="118" width="40" height="4