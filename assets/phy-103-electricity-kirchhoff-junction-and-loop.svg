<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Kirchhoff junction rule and loop rule</title>
<desc id="d">Left: a junction with currents I1 and I2 entering and I3 and I4 leaving. Right: a single loop with a battery E and resistors R1, R2 and R3 with the loop direction marked.</desc>
<defs>
