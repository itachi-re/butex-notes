<text x="160.5" y="442.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280" font-weight="normal" font-style="normal">Enantiomers: identical m.p., b.p., solubility; they rotate plane-polarised light equally but in opposite directions.</text></svg>