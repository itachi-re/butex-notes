<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="Georgia, serif" font-size="20" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>.lbl{font-size:15px;fill:#444}.at{font-size:20px}</style>
<rect width="720" height="260" fill="#ffffff"/>
<!-- 1 amine -->
<g transform="translate(40,60)">
<text x="0" y="0" class="at">R—N</text>
<line x1="70" y1="-6" x2="70" y2="-28" stroke="black" stroke-width="1.5"/>
<text x="55" y="-32" class="at">H</text>
<line x1="82" y1="-2" x2="102" y2="-2" stroke="black" stroke-width="1.5"/>
<text x="104" y="2" class="at">H</text>
<text x="0" y="40" class="lbl">Primary (1°) amine</text>
<text x="0" y="60" class="lbl">one C directly on N,</text>
<text x="0" y="78" class="lbl">two N–H bonds</text>
</g>
<!-- 2 amine -->
<g transform="translate(280,60)">
<text x="-25" y="0" class="at">R—N—R'</text>
<line x1="20" y1="-6" x2="20" y2="-28" stroke="black" stroke-width="1.5"/>
<text x="5" y="-32" class="at">H</text>
<text x="0" y="40" class="lbl">Secondary (2°) amine</text>
<text x="0" y="60" class="lbl">two C on N,</text>
<text x="0" y="78" class="lbl">one N–H bond</text>
</g>
<!-- 3 amine -->
<g transform="translate(540,60)">
<text x="-25" y="0" class="at">R—N—R'</text>
<line x1="20" y1="-6" x2="20" y2="-28" stroke="black" stroke-width="1.5"/>
<text x="0" y="-32" class="at">R''</text>
<text x="0" y="40" class="lbl">Tertiary (3°) amine</text>
<text x="0" y="60" class="lbl">three C on N,</text>
<text x="0" y="78" class="lbl">no N–H bond</text>
</g>
<text x="30" y="170" class="lbl" font-size="16">R, R', R'' = alkyl / aryl groups (may be identical or different).</text>
<text x="30" y="195" class="lbl" font-size="16">Classification counts C atoms bonded directly to N — NOT the total carbons in the molecule.</text>
<text x="30" y="220" class="lbl" font-size="16">e.g. (CH3)3C–NH2 is 1° even though the carbon skeleton is bulky.</text>
</svg>
