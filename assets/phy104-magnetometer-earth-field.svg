<svg viewBox="0 0 720 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .lbl { font-size: 15px; fill: #1a1a1a; }
    .small { font-size: 12px; fill: #333333; }
    .line { stroke: #1a1a1a; stroke-width: 2; fill: none; }
  </style>

  <text x="20" y="28" class="lbl" font-weight="bold">(a) Deflection magnetometer — Tan-A position</text>

  <!-- N-S / E-W compass rose -->
  <text x="230" y="60" class="small">N</text>
  <text x="230" y="230" class="small">S</text>
  <text x="115" y="150" class="small">W</text>
  <text x="345" y="150" class="small">E</text>
  <line x1="225" y1="70" x2="225" y2="220" stroke="#999" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="135" y1="145" x2="335" y2="145" stroke="#999" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Magnetometer arm E-W -->
  <rect x="60" y="138" width="330" height="14" fill="#d8c39a" stroke="#6b4f2a"/>
  <text x="60" y="130" class="small">Magnetometer bar (arm), placed East&#8211;West</text>

  <!-- Compass box at centre -->
  <circle cx="225" cy="145" r="26" fill="#f5f5f5" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="225" y1="122" x2="225" y2="168" stroke="#c0392b" stroke-width="2"/>
  <text x="205" y="185" class="small">Compass box (needle + scale)</text>

  <!-- Bar magnet NS on the arm, parallel to arm -->
  <rect x="320" y="139" width="55" height="12" fill="#555" />
  <text x="330" y="135" class="small" fill="#fff">N</text>
  <rect x="375" y="139" width="0" height="0"/>
  <text x="355" y="170" class="small">Magnet (parallel to arm, at distance d)</text>
  <line x1="225" y1="145" x2="347" y2="145" stroke="#999" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="270" y="140" class="small">d</text>

  <text x="60" y="255" class="small">Deflection &#952; of the needle from N&#8211;S: tangent law</text>
  <text x="60" y="273" class="small" font-style="italic">B (due to magnet) = B_H tan&#952;</text>

  <!-- Part (b) vibration magnetometer -->
  <text x="20" y="320" class="lbl" font-weight="bold">(b) Vibration magnetometer</text>

  <!-- stand -->
  <line x1="450" y1="330" x2="450" y2="470" class="line"/>
  <line x1="410" y1="470" x2="490" y2="470" class="line"/>
  <line x1="420" y1="330" x2="480" y2="330" class="line"/>

  <!-- torsion-free suspension thread -->
  <line x1="450" y1="330" x2="450" y2="400" stroke="#555" stroke-width="1.5"/>
  <text x="455" y="350" class="small">unspun silk/nylon</text>
  <text x="455" y="364" class="small">suspension fibre</text>

  <!-- stirrup and magnet -->
  <rect x="425" y="400" width="50" height="10" fill="#888"/>
  <rect x="405" y="410" width="90" height="14" fill="#555"/>
  <text x="500" y="420" class="small">bar magnet in stirrup</text>
  <text x="500" y="436" class="small">(oscillates in the</text>
  <text x="500" y="450" class="small">magnetic meridian)</text>

  <!-- glass tube -->
  <ellipse cx="450" cy="335" rx="45" ry="8" fill="none" stroke="#999" stroke-width="1"/>
  <line x1="405" y1="335" x2="405" y2="450" stroke="#999" stroke-width="1"/>
  <line x1="495" y1="335" x2="495" y2="450" stroke="#999" stroke-width="1"/>
  <text x="330" y="410" class="small">glass cover</text>
  <text x="330" y="424" class="small">(draught shield)</text>

  <text x="55" y="470" class="small">Period of oscillation T = 2&#960;&#8730;(I / M B_H); telescope + scale used to time oscillations</text>
</svg>
