<svg xmlns="http://www.w3.org/2000/svg" width="620" height="370" viewBox="0 0 620 370" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Diagonals of a parallelogram on a and b</title>
<desc id="d">Rectangle with sides a and b and its diagonals a plus b and a minus b, which are equal in length when a is perpendicular to b.</desc>
<rect width="620" height="370" fill="#ffffff"/>
<g font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2328">
<polygon points="150.0,280.0 400.0,280.0 400.0,130.0 150.0,130.0" fill="#0969da" fill-opacity="0.08" stroke="#6e7781" stroke-width="1.5" stroke-linejoin="round"/>
<line x1="150.0" y1="280.0" x2="388.0" y2="280.0" stroke="#0969da" stroke-width="3.5" stroke-linecap="round"/><polygon points="400.0,280.0 388.0,275.0 388.0,285.0" fill="#0969da"/>
<line x1="150.0" y1="280.0" x2="150.0" y2="142.0" stroke="#1a7f37" stroke-width="3.5" stroke-linecap="round"/><polygon points="150.0,130.0 145.0,142.0 155.0,142.0" fill="#1a7f37"/>
<line x1="150.0" y1="280.0" x2="389.7" y2="136.2" stroke="#cf222e" stroke-width="3.5" stroke-linecap="round"/><polygon points="400.0,130.0 387.1,131.9 392.3,140.5" fill="#cf222e"/>
<line x1="150.0" y1="130.0" x2="389.7" y2="273.8" stroke="#bc4c00" stroke-width="3.5" stroke-linecap="round"/><polygon points="400.0,280.0 392.3,269.5 387.1,278.1" fill="#bc4c00"/>
<polyline points="150.0,262.0 168.0,262.0 168.0,280.0" fill="none" fill-opacity="1.0" stroke="#1f2328" stroke-width="1.5" stroke-linejoin="round"/>
<circle cx="150.0" cy="280.0" r="4.5" fill="#1f2328"/>
<text x="138.0" y="300.0" text-anchor="end" font-size="14" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">O</text><text x="138.0" y="300.0" text-anchor="end" font-size="14" fill="#1f2328">O</text>
<text x="275.0" y="305.0" text-anchor="middle" font-size="19" font-weight="bold" font-style="italic" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">a</text><text x="275.0" y="305.0" text-anchor="middle" font-size="19" font-weight="bold" font-style="italic" fill="#0969da">a</text>
<text x="132.0" y="205.0" text-anchor="end" font-size="19" font-weight="bold" font-style="italic" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">b</text><text x="132.0" y="205.0" text-anchor="end" font-size="19" font-weight="bold" font-style="italic" fill="#1a7f37">b</text>
<text x="412.0" y="124.0" text-anchor="start" font-size="16" font-weight="bold" font-style="italic" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">a + b</text><text x="412.0" y="124.0" text-anchor="start" font-size="16" font-weight="bold" font-style="italic" fill="#cf222e">a + b</text>
<text x="412.0" y="286.0" text-anchor="start" font-size="16" font-weight="bold" font-style="italic" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">a − b</text><text x="412.0" y="286.0" text-anchor="start" font-size="16" font-weight="bold" font-style="italic" fill="#bc4c00">a − b</text>
<text x="20.0" y="30.0" text-anchor="start" font-size="16" font-weight="bold" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">|a + b| = |a − b|  means the two diagonals have equal length</text><text x="20.0" y="30.0" text-anchor="start" font-size="16" font-weight="bold" fill="#1f2328">|a + b| = |a − b|  means the two diagonals have equal length</text>
<text x="20.0" y="56.0" text-anchor="start" font-size="14" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">A parallelogram with equal diagonals is a rectangle, so a and b are perpendicular: a · b = 0.</text><text x="20.0" y="56.0" text-anchor="start" font-size="14" fill="#1f2328">A parallelogram with equal diagonals is a rectangle, so a and b are perpendicular: a · b = 0.</text>
<text x="20.0" y="350.0" text-anchor="start" font-size="15" font-weight="bold" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">Algebra: |a + b|² − |a − b|² = 4 a · b = 0</text><text x="20.0" y="350.0" text-anchor="start" font-size="15" font-weight="bold" fill="#1f2328">Algebra: |a + b|² − |a − b|² = 4 a · b = 0</text>
</g>
</svg>
