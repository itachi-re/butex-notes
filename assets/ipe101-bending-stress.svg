nt-weight="normal">top: compression</text><text x="170.0" y="270.0" font-size="11" text-anchor="start" fill="#c1121f" font-weight="normal">bottom: tension</text><text x="210.0" y="330.0" font-size="11" text-anchor="middle" fill="#6a4c93" font-weight="normal">neutral axis (dashed) is unstrained</text><rect x="520.0" y="100.0" width="70.0" height="170.0" rx="0" fill="#cfd8dc" stroke="#37474f" stroke-width="2"/><line x1="500.0" y1="185.0" x2="610.0" y2="185.0" stroke="#6a4c93" stroke-width="1.8" stroke-dasharray="6 4" stroke-linecap="round"/><text x="620.0" y="190.0" font-size="12" text-anchor="start" fill="#6a4c93" font-weight="bold">N.A.</text><text x="555.0" y="70.0" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">cross-section b × h</text><polygon points="730.0,185.0 650.0,100.0 730.0,100.0" fill="#90caf9" fill-opacity="0.8" stroke="#1d3557" stroke-width="1.5" stroke-linejoin="round"/><polygon points="730.0,185.0 810.0,270.0 730.0,270.0" fill="#ef9a9a" fill-opacity="0.8" stroke="#b71c1c" stroke-width="1.5" stroke-linejoin="round"/><line x1="730.0" y1="90.0" x2="730.0" y2="280.0" stroke="#222" stroke-width="1.5" stroke-linecap="round"/><text x="645.0" y="116.0" font-size="12" text-anchor="end" fill="#1d3557" font-weight="bold">σ_c(max)</text><text x="815.0" y="285.0" font-size="12" text-anchor="start" fill="#b71c1c" font-weight="bold">σ_t(max)</text><text x="730.0" y="70.0" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">stress distribution</text><line x1="750.0" y1="227.5" x2="750.0" y2="185.0" stroke="#444" stroke-width="1.2" marker-end="url(#m444)" stroke-linecap="round"/><line x1="750.0" y1="227.5" x2="750.0" y2="270.0" stroke="#444" stroke-width="1.2" marker-end="url(#m444)" stroke-linecap="round"/><text x="758.0" y="230.0" font-size="13" text-anchor="start" fill="#222" font-weight="bold">c</text><text x="500.0" y="330.0" font-size="13" text-anchor="start" fill="#222" font-weight="normal">σ_max = M c / I = M / Z ,  where Z 