<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Spheroidizing process flow" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Spheroidizing process flow</title><desc>Three lecture methods and lamellar-to-globular cementite schematic</desc><defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker><pattern id="lam" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#f3e3c3"/><line x1="0" y1="3" x2="6" y2="3" stroke="#6b3d10" stroke-width="1.6"/></pattern><pattern id="lamf" width="3.5" height="3.5" patternUnits="userSpaceOnUse"><rect width="3.5" height="3.5" fill="#f3e3c3"/><line x1="0" y1="1.7" x2="3.5" y2="1.7" stroke="#6b3d10" stroke-width="1.2"/></pattern><pattern id="lamc" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f3e3c3"/><line x1="0" y1="5" x2="10" y2="5" stroke="#6b3d10" stroke-width="2.2"/></pattern></defs><rect width="100%" height="100%" fill="#fff"/><text x="490.0" y="26" font-size="17" text-anchor="middle" fill="#0b2a55" font-weight="bold"><tspan x="490.0" dy="0.0">Spheroidizing – Methods and Structural Change</tspan></text><text x="490.0" y="44" font-size="11.5" text-anchor="middle" fill="#555" font-style="italic"><tspan x="490.0" dy="0.0">Schematic – not to scale</tspan></text><rect x="40" y="60" width="240" height="110" rx="8" fill="#f3e3c3" stroke="#1a3c6e" stroke-width="1.6"/><text x="160.0" y="111.425" font-size="13" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="160.0" dy="0.0">Lamellar pearlite</tspan><tspan x="160.0" dy="16.2">(ferrite + cementite plates)</tspan></text><rect x="300" y="60" width="110" height="110" fill="url(#lamc)" stroke="#555" stroke-width="1.2" opacity="1"/><line x1="440" y1="115" x2="540" y2="115" stroke="#333" stroke-width="2" marker-end="url(#ar)"/><text x="490" y="100" font-size="11" text-anchor="middle" fill="#111"><tspan x="490" dy="0.0">prolonged</tspan></text><text x="490" y="148" font-size="11" text-anchor="middle" fill="#111"><tspan x="490" dy="0.0">high-temp exposure</tspan></text><rect x="560" y="60" width="110" height="110" fill="#fdfdfd" stroke="#555" stroke-width="1.2" opacity="1"/><circle cx="575" cy="75" r="6" fill="#6b3d10" stroke="none"/><circle cx="575" cy="101" r="6" fill="#6b3d10" stroke="none"/><circle cx="575" cy="127" r="6" fill="#6b3d10" stroke="none"/><circle cx="575" cy="153" r="6" fill="#6b3d10" stroke="none"/><circle cx="601" cy="75" r="6" fill="#6b3d10" stroke="none"/><circle cx="601" cy="101" r="6" fill="#6b3d10" stroke="none"/><circle cx="601" cy="127" r="6" fill="#6b3d10" stroke="none"/><circle cx="601" cy="153" r="6" fill="#6b3d10" stroke="none"/><circle cx="627" cy="75" r="6" fill="#6b3d10" stroke="none"/><circle cx="627" cy="101" r="6" fill="#6b3d10" stroke="none"/><circle cx="627" cy="127" r="6" fill="#6b3d10" stroke="none"/><circle cx="627" cy="153" r="6" fill="#6b3d10" stroke="none"/><circle cx="653" cy="75" r="6" fill="#6b3d10" stroke="none"/><circle cx="653" cy="101" r="6" fill="#6b3d10" stroke="none"/><circle cx="653" cy="127" r="6" fill="#6b3d10" stroke="none"/><circle cx="653" cy="153" r="6" fill="#6b3d10" stroke="none"/><rect x="690" y="60" width="250" height="110" rx="8" fill="#d9f2e6" stroke="#1a3c6e" stroke-width="1.6"/><text x="815.0" y="111.425" font-size="13" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="815.0" dy="0.0">Spheroidite</tspan><tspan x="815.0" dy="16.2">(globular cementite in ferrite matrix)</tspan></text><text x="40" y="200" font-size="13" text-anchor="start" fill="#111" font-weight="bold"><tspan x="40" dy="0.0">Methods described in the lecture (all keep temperature around the lower critical line A₁):</tspan></text><rect x="30" y="215" width="290" height="170" fill="#fafafa" stroke="#999" stroke-width="1.2" opacity="1"/><text x="175" y="233" font-size="12.5" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="175" dy="0.0">(a) Long hold just below A₁</tspan></text><line x1="40" y1="305" x2="310" y2="305" stroke="#33b" stroke-width="1.3" stroke-dasharray="5 4"/><text x="312" y="299" font-size="10.5" text-anchor="start" fill="#33b"><tspan x="312" dy="0.0">A₁</tspan></text><path d="M45 365 L80 325 L90 319 L280 319 L305 355" stroke="#c0392b" stroke-width="2.8" fill="none"/><text x="175" y="375" font-size="11" text-anchor="middle" fill="#111" font-style="italic"><tspan x="175" dy="0.0">prolonged holding</tspan></text><rect x="345" y="215" width="290" height="170" fill="#fafafa" stroke="#999" stroke-width="1.2" opacity="1"/><text x="490" y="233" font-size="12.5" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="490" dy="0.0">(b) Alternate above / below A₁</tspan></text><line x1="355" y1="305" x2="625" y2="305" stroke="#33b" stroke-width="1.3" stroke-dasharray="5 4"/><text x="627" y="299" font-size="10.5" text-anchor="start" fill="#33b"><tspan x="627" dy="0.0">A₁</tspan></text><path d="M360 365 L395 325 L415 285 L435 319 L455 285 L475 319 L495 285 L515 319 L535 285 L555 319 L615 355" stroke="#c0392b" stroke-width="2.8" fill="none"/><text x="490" y="375" font-size="11" text-anchor="middle" fill="#111" font-style="italic"><tspan x="490" dy="0.0">cycling through A₁</tspan></text><rect x="660" y="215" width="290" height="170" fill="#fafafa" stroke="#999" stroke-width="1.2" opacity="1"/><text x="805" y="233" font-size="12.5" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="805" dy="0.0">(c) Heat above A₁, then…</tspan></text><line x1="670" y1="305" x2="940" y2="305" stroke="#33b" stroke-width="1.3" stroke-dasharray="5 4"/><text x="942" y="299" font-size="10.5" text-anchor="start" fill="#33b"><tspan x="942" dy="0.0">A₁</tspan></text><path d="M675 365 L710 325 L740 275 L780 275 L820 305 L860 317 L910 319 L935 355" stroke="#c0392b" stroke-width="2.8" fill="none"/><text x="805" y="375" font-size="11" text-anchor="middle" fill="#111" font-style="italic"><tspan x="805" dy="0.0">very slow furnace cool / hold just below A₁</tspan></text><rect x="30" y="410" width="910" height="60" rx="8" fill="#fff3b0" stroke="#1a3c6e" stroke-width="1.6"/><text x="485.0" y="444.375" font-size="12.5" text-anchor="middle" fill="#111"><tspan x="485.0" dy="0.0">Steps inside the steel:  pearlite lamellae break up  →  cementite network breaks down  →  cementite particles become spherical (lower surface energy)  →  spheroidite</tspan></text><text x="30" y="495" font-size="12.5" text-anchor="start" fill="#1a5c2e" font-weight="bold"><tspan x="30" dy="0.0">Result:  minimum hardness · maximum ductility · maximum machinability   (mainly for high-carbon steels; low-carbon steels seldom spheroidized)</tspan></text><text x="30" y="520" font-size="12.5" text-anchor="start" fill="#7a1f1f"><tspan x="30" dy="0.0">Excessive holding time → elongated cementite particles again → machinability falls.</tspan></text><text x="30" y="545" font-size="12" text-anchor="start" fill="#111" font-style="italic"><tspan x="30" dy="0.0">Why spheres machine well: no continuous hard cementite plates to abrade the tool; soft ferrite matrix flows and chips easily.</tspan></text></svg>