<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b3261e"/></marker></defs>
<rect width="640" height="280" fill="#fff"/>
<text x="20" y="22" font-weight="bold" fill="#333">(a) Volume correction: V − nb</text>
<rect x="20" y="35" width="270" height="190" fill="#f4f7fb" stroke="#333" stroke-width="2"/>
<circle cx="120" cy="120" r="22" fill="#1f4e9c" opacity=".25" stroke="#1f4e9c" stroke-dasharray="4 3"/>
<circle cx="120" cy="120" r="11" fill="#1f4e9c"/><circle cx="164" cy="120" r="11" fill="#1f4e9c"/>
<line x1="109" y1="150" x2="175" y2="150" stroke="#333"/><text x="105" y="168" fill="#333">centres cannot get closer than d</text>
