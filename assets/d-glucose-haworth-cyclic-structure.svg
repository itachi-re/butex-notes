<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="Georgia, serif" font-size="15" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="620" height="420" fill="#fff"/>
<text x="20" y="28" font-size="18" font-weight="bold">D-glucopyranose — Haworth projection (β-anomer shown)</text>

<!-- hexagon ring representing pyranose -->
<g transform="translate(130,90)">
<polygon points="0,60 60,20 170,20 230,60 170,110 60,110" fill="none" stroke="black" stroke-width="2"/>
<!-- ring O -->
<text x="55" y="14" font-weight="bold">O</text>
<!-- carbon labels around ring -->
<text x="0" y="75" font-size="13">C5</text>
<text x="55" y="130" font-size="13">C1 (anomeric)</text>
<text x="170" y="130" font-size="13">C2</text>
<text x="228" y="75" font-size="13">C3</text>
<text x="170" y="14" font-size="13">C4</text>

<!-- substituents -->
<line x1="0" y1="60" x2="-30" y2="30" stroke="black"/>
<text x="-70" y="28" font-size="13">CH2OH (C6)</text>

<line x1="60" y1="110" x2="60" y2="150" stroke="black"/>
<text x="45" y="168" font-size="13">OH (β, up in drawing)</text>

<line x1="170" y1="110" x2="170" y2="150" stroke="black"/>
<text x="160" y="168" font-size="13">H</text>
<line x1="170" y1="110" x2="200" y2="130" stroke="black"/>
<text x="205" y="140" font-size="13">OH</text>

<line x1="230" y1="60" x2="260" y2="40" stroke="black"/>
<text x="264" y="36" font-size="13">H</text>
<line x1="230" y1="60" x2="260" y2="80" stroke="black"/>
<text x="264" y="88" font-size="13">OH</text>

<line x1="170" y1="20" x2="200" y2="0" stroke="black"/>
<text x="205" y="-4" font-size="13">H</text>
</g>

<text x="20" y="300" font-size="14" fill="#555">Ring formed when the C5–OH oxygen attacks the C1 aldehyde carbon</text>
<text x="20" y="320" font-size="14" fill="#555">intramolecularly (forming a 6-membered pyranose hemiacetal ring, confirmed</text>
<text x="20" y="340" font-size="14" fill="#555">by methylation + hydrolysis studies, see ring-size determination note below).</text>
<text x="20" y="365" font-size="14" fill="#555">C1 becomes a NEW stereocentre (the anomeric carbon): OH below the ring plane</text>
<text x="20" y="385" font-size="14" fill="#555">= α-anomer; OH above the plane (as drawn) = β-anomer. Interconversion of α ⇌ β</text>
<text x="20" y="405" font-size="14" fill="#555">through the open-chain form, with a changing optical rotation, is mutarotation.</text>
</svg>
