<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Normalizing versus full annealing" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Normalizing versus full annealing</title><desc>Cooling curves and pearlite fineness</desc><defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker><pattern id="lam" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#f3e3c3"/><line x1="0" y1="3" x2="6" y2="3" stroke="#6b3d10" stroke-width="1.6"/></pattern><pattern id="lamf" width="3.5" height="3.5" patternUnits="userSpaceOnUse"><rect width="3.5" height="3.5" fill="#f3e3c3"/><line x1="0" y1="1.7" x2="3.5" y2="1.7" stroke="#6b3d10" stroke-width="1.2"/></pattern><pattern id="lamc" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f3e3c3"/><line x1="0" y1="5" x2="10" y2="5" stroke="#6b3d10" stroke-width="2.2"/></pattern></defs><rect width="100%" height="100%" fill="#fff"/><text x="490.0" y="26" font-size="17" text-anchor="middle" fill="#0b2a55" font-weight="bold"><tspan x="490.0" dy="0.0">Normalizing vs Full Annealing</tspan></text><text x="490.0" y="44" font-size="11.5" text-anchor="middle" fill="#555" font-style="italic"><tspan x="490.0" dy="0.0">Schematic – not to scale</tspan></text><line x1="70" y1="340" x2="480" y2="340" stroke="#111" stroke-width="2" marker-end="url(#ar)"/><line x1="70" y1="340" x2="70" y2="80" stroke="#111" stroke-width="2" marker-end="url(#ar)"/><text x="275.0" y="374" font-size="12" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="275.0" dy="0.0">Time →</tspan></text><text x="32" y="210.0" font-size="12" text-anchor="middle" fill="#111" font-weight="bold" transform="rotate(-90 32 210.0)"><tspan x="32" dy="0.0">Temperature →</tspan></text><line x1="70" y1="280" x2="480" y2="280" stroke="#33b" stroke-width="1.4" stroke-dasharray="6 4"/><text x="484" y="284" font-size="11" text-anchor="start" fill="#33b"><tspan x="484" dy="0.0">A₁</tspan></text><line x1="70" y1="140" x2="480" y2="140" stroke="#b33" stroke-width="1.4" stroke-dasharray="6 4"/><text x="484" y="144" font-size="11" text-anchor="start" fill="#b33"><tspan x="484" dy="0.0">A₃ (upper critical)</tspan></text><path d="M70 330 L120 130 L170 110" stroke="#555" stroke-width="2" fill="none"/><path d="M170 110 C230 140 330 200 460 320" stroke="#2e7d32" stroke-width="3.5" fill="none"/><text x="330" y="225" font-size="12" text-anchor="start" fill="#2e7d32" font-weight="bold"><tspan x="330" dy="0.0">Full annealing</tspan></text><text x="330" y="240" font-size="11" text-anchor="start" fill="#2e7d32"><tspan x="330" dy="0.0">(furnace cool: slow)</tspan></text><path d="M170 110 C185 200 200 260 225 335" stroke="#e67e22" stroke-width="3.5" fill="none"/><text x="215" y="215" font-size="12" text-anchor="start" fill="#e67e22" font-weight="bold"><tspan x="215" dy="0.0">Normalizing</tspan></text><text x="215" y="230" font-size="11" text-anchor="start" fill="#e67e22"><tspan x="215" dy="0.0">(still air: faster)</tspan></text><text x="70" y="372" font-size="11.5" text-anchor="start" fill="#111" font-style="italic"><tspan x="70" dy="0.0">Normalizing: heat ≈ 100 °F above the upper critical line, cool in still air to room temperature.</tspan></text><text x="520" y="80" font-size="13" text-anchor="start" fill="#111" font-weight="bold"><tspan x="520" dy="0.0">Pearlite fineness</tspan></text><rect x="520" y="90" width="180" height="120" fill="url(#lamc)" stroke="#333" stroke-width="1.2" opacity="1"/><text x="610" y="228" font-size="12" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="610" dy="0.0">Annealed: COARSE pearlite</tspan></text><rect x="730" y="90" width="180" height="120" fill="url(#lamf)" stroke="#333" stroke-width="1.2" opacity="1"/><text x="820" y="228" font-size="12" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="820" dy="0.0">Normalized: FINER pearlite</tspan></text><text x="610" y="246" font-size="11.5" text-anchor="middle" fill="#111"><tspan x="610" dy="0.0">wide spacing → softer</tspan></text><text x="820" y="246" font-size="11.5" text-anchor="middle" fill="#111"><tspan x="820" dy="0.0">close spacing → harder</tspan></text><rect x="510" y="270" width="415" height="120" rx="8" fill="#fff3b0" stroke="#1a3c6e" stroke-width="1.6"/><text x="717.5" y="311.7" font-size="12" text-anchor="middle" fill="#111"><tspan x="717.5" dy="0.0">0.5 % C steel – lecture example</tspan><tspan x="717.5" dy="15.0">Annealed: ≈ 62 % pearlite + 38 % ferrite,  Rockwell C 10</tspan><tspan x="717.5" dy="15.0">Normalized: ≈ 10 % ferrite,  Rockwell C 20</tspan><tspan x="717.5" dy="15.0">(faster cooling → less ferrite, finer pearlite → stronger)</tspan></text><rect x="40" y="400" width="880" height="140" rx="6" fill="#f4f4f4" stroke="#1a3c6e" stroke-width="1.6"/><text x="480.0" y="459.2" font-size="12" text-anchor="middle" fill="#111"><tspan x="480.0" dy="0.0">Why normalizing gives higher hardness/strength: faster cooling gives carbon less time to diffuse, so pearlite is finer (closely spaced hard cementite plates in soft ferrite) and less proeutectoid ferrite forms.</tspan><tspan x="480.0" dy="15.0">Also: refines cast dendritic structure and grain size, homogenizes the structure, improves machinability and response to later hardening.</tspan><tspan x="480.0" dy="15.0">The Fe–Fe₃C equilibrium diagram assumes very slow cooling, so it cannot directly predict phase proportions in air-cooled (non-equilibrium) steel.</tspan></text></svg>