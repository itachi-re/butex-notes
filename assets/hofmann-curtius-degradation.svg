<svg viewBox="0 0 560 260" xmlns="http://www.w3.org/2000/svg" font-family="Arial" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<text x="280" y="20" text-anchor="middle" font-weight="bold">Hofmann and Curtius Degradations (both give 1° amine, one C fewer)</text>

<!-- Hofmann -->
<text x="20" y="55" font-weight="bold">Hofmann bromamide degradation:</text>
<text x="20" y="78" font-size="12">RCONH₂ + Br₂ + 4NaOH → RNH₂ + Na₂CO₃ + 2NaBr + 2H₂O</text>
<text x="20" y="100" font-size="11">Mechanism: RCONH₂ → RCONHBr → RCON(-):Br⁻ → R–N=C=O (isocyanate)</text>
<text x="20" y="118" font-size="11">→ hydrolysis → RNH₂ + CO₂ (via nitrene intermediate; R migrates to N)</text>

<!-- Curtius -->
<text x="20" y="155" font-weight="bold">Curtius degradation:</text>
<text x="20" y="178" font-size="12">RCONH₂ →(NaNO₂/HCl or via acyl chloride+NaN₃) RCON₃ (acyl azide)</text>
<text x="20" y="198" font-size="11">RCON₃ →(Δ, –N₂) R–N=C=O (isocyanate) →(H₂O, –CO₂) RNH₂</text>
<text x="20" y="220" font-size="11">Both proceed via R–N=C=O intermediate and 1,2-migration of R from C to N</text>
</svg>
