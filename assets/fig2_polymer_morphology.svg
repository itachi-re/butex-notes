<svg viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="380" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Fig. 2 — Amorphous, Crystalline and Semi-crystalline Polymer Morphology</text>

  <!-- AMORPHOUS -->
  <g>
    <rect x="30" y="55" width="250" height="260" fill="#f6f8fa" stroke="#ccc" rx="6"/>
    <text x="155" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f6feb">Amorphous</text>
    <path d="M50,120 C70,140 40,160 65,180 C90,200 55,215 80,235 C100,250 70,265 95,285" stroke="#1f6feb" stroke-width="2.5" fill="none"/>
    <path d="M90,110 C110,130 130,120 120,150 C110,180 140,190 130,215 C120,240 150,250 140,280" stroke="#1f6feb" stroke-width="2.5" fill="none"/>
    <path d="M150,115 C170,135 190,125 175,155 C160,185 195,195 180,220 C165,245 200,255 190,285" stroke="#1f6feb" stroke-width="2.5" fill="none"/>
    <path d="M210,120 C230,145 205,165 225,185 C245,205 215,220 235,240 C255,260 225,270 245,290" stroke="#1f6feb" stroke-width="2.5" fill="none"/>
    <text x="155" y="308" text-anchor="middle" font-size="12" fill="#444">Randomly coiled, entangled chains</text>
  </g>

  <!-- CRYSTALLINE -->
  <g>
    <rect x="325" y="55" width="250" height="260" fill="#f6f8fa" stroke="#ccc" rx="6"/>
    <text x="450" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#d73a49">Crystalline</text>
    <!-- folded chain lamella -->
    <path d="M350,110 L390,110 L390,150 L350,150 L350,190 L390,190 L390,230 L350,230 L350,270 L390,270"
          stroke="#d73a49" stroke-width="2.5" fill="none"/>
    <path d="M410,110 L450,110 L450,150 L410,150 L410,190 L450,190 L450,230 L410,230 L410,270 L450,270"
          stroke="#d73a49" stroke-width="2.5" fill="none"/>
    <path d="M470,110 L510,110 L510,150 L470,150 L470,190 L510,190 L510,230 L470,230 L470,270 L510,270"
          stroke="#d73a49" stroke-width="2.5" fill="none"/>
    <text x="450" y="308" text-anchor="middle" font-size="12" fill="#444">Chain-folded lamellae (regular packing)</text>
  </g>

  <!-- SEMI-CRYSTALLINE -->
  <g>
    <rect x="620" y="55" width="250" height="260" fill="#f6f8fa" stroke="#ccc" rx="6"/>
    <text x="745" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#6f42c1">Semi-crystalline</text>
    <!-- ordered lamella region -->
    <path d="M645,110 L680,110 L680,145 L645,145 L645,180 L680,180" stroke="#d73a49" stroke-width="2.5" fill="none"/>
    <path d="M700,110 L735,110 L735,145 L700,145 L700,180 L735,180" stroke="#d73a49" stroke-width="2.5" fill="none"/>
    <!-- amorphous tie chains -->
    <path d="M660,180 C650,200 670,210 655,230 C640,250 665,260 650,285" stroke="#1f6feb" stroke-width="2.5" fill="none"/>
    <path d="M715,180 C725,200 705,215 720,235 C735,255 710,265 725,290" stroke="#1f6feb" stroke-width="2.5" fill="none"/>
    <path d="M790,120 C805,140 785,160 800,180 C815,200 795,220 810,240" stroke="#1f6feb" stroke-width="2.5" fill="none"/>
    <text x="745" y="308" text-anchor="middle" font-size="12" fill="#444">Ordered (crystalline) + disordered (amorphous) regions</text>
  </g>
</svg>
