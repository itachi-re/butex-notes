<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow03" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333333"/>
    </marker>
  </defs>
  <rect width="700" height="400" fill="#ffffff"/>

  <!-- outer isolated universe boundary -->
  <rect x="60" y="40" width="580" height="270" rx="18" fill="none" stroke="#333333" stroke-width="2.5" stroke-dasharray="10,6"/>
  <text x="80" y="65" font-size="14" fill="#333333" font-weight="bold">Isolated Universe (no heat/matter crosses this boundary)</text>

  <!-- system box -->
  <rect x="110" y="110" width="200" height="140" rx="10" fill="#dbe9f6" stroke="#2166ac" stroke-width="2.5"/>
  <text x="210" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#2166ac">System</text>
  <text x="210" y="175" text-anchor="middle" font-size="12" fill="#1b4a72">ΔS_system</text>

  <!-- surroundings box -->
  <rect x="390" y="110" width="200" height="140" rx="10" fill="#f6dbdb" stroke="#b2182b" stroke-width="2.5"/>
  <text x="490" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#b2182b">Surroundings</text>
  <text x="490" y="175" text-anchor="middle" font-size="12" fill="#7a1414">ΔS_surroundings</text>

  <!-- heat exchange arrow -->
  <line x1="315" y1="180" x2="385" y2="180" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow03)"/>
  <text x="350" y="165" text-anchor="middle" font-size="13" fill="#222222">Q</text>
  <text x="350" y="200" text-anchor="middle" font-size="11" fill="#555555">at boundary T</text>

  <!-- summary equation -->
  <rect x="120" y="330" width="460" height="55" rx="8" fill="#fff8e6" stroke="#c9a227" stroke-width="1.5"/>
  <text x="350" y="365" text-anchor="middle" font-size="16" font-weight="bold" fill="#5a4600">ΔS_universe = ΔS_system + ΔS_surroundings ≥ 0</text>
</svg>
