<svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="480" height="320" fill="#ffffff"/>
<!-- conducting slab -->
<polygon points="100,120 340,120 380,80 140,80" fill="#eeeeee" stroke="#000" stroke-width="2"/>
<polygon points="100,120 340,120 340,220 100,220" fill="#eeeeee" stroke="#000" stroke-width="2"/>
<polygon points="340,120 380,80 380,180 340,220" fill="#dddddd" stroke="#000" stroke-width="2"/>
<text x="220" y="100" font-size="13" text-anchor="middle">thickness t</text>
<text x="220" y="175" font-size="13" text-anchor="middle">width w</text>
<!-- current arrow -->
<line x1="100" y1="170" x2="330" y2="170" stroke="#000" stroke-width="2" marker-end="url(#ai)"/>
<text x="215" y="160" font-size="13">current i (+x)</text>
<!-- B field into page -->
<g fill="#1a5fb4">
<circle cx="200" cy="100" r="2"/><text x="207" y="103" font-size="11" fill="#1a5fb4">B (out of page)</text>
</g>
<!-- Hall voltage across width -->
<line x1="100" y1="220" x2="100" y2="260" stroke="#c00000" stroke-width="1.5"/>
<line x1="340" y1="220" x2="340" y2="260" stroke="#c00000" stroke-width="1.5"/>
<line x1="100" y1="250" x2="340" y2="250" stroke="#c00000" stroke-width="1.5" marker-end="url(#ar2)"/>
<text x="220" y="270" font-size="13" fill="#c00000" text-anchor="middle">Hall voltage V_H across width w</text>
<defs>
<marker id="ai" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#000"/></marker>
<marker id="ar2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#c00000"/></marker>
</defs>
<text x="240" y="25" font-size="16" text-anchor="middle" font-weight="bold">Hall Effect Geometry</text>
<text x="240" y="300" font-size="12" text-anchor="middle">V_H = iB/(net), E_H = V_H/w, balances qE_H = qv_d B</text>
</svg>
