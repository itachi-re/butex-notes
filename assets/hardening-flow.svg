<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Hardening flow and martensite formation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Hardening flow and martensite formation</title><desc>Austenitize, rapid cool, suppressed diffusion, martensite, high hardness</desc><defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker><pattern id="lam" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#f3e3c3"/><line x1="0" y1="3" x2="6" y2="3" stroke="#6b3d10" stroke-width="1.6"/></pattern><pattern id="lamf" width="3.5" height="3.5" patternUnits="userSpaceOnUse"><rect width="3.5" height="3.5" fill="#f3e3c3"/><line x1="0" y1="1.7" x2="3.5" y2="1.7" stroke="#6b3d10" stroke-width="1.2"/></pattern><pattern id="lamc" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f3e3c3"/><line x1="0" y1="5" x2="10" y2="5" stroke="#6b3d10" stroke-width="2.2"/></pattern></defs><rect width="100%" height="100%" fill="#fff"/><text x="490.0" y="26" font-size="17" text-anchor="middle" fill="#0b2a55" font-weight="bold"><tspan x="490.0" dy="0.0">Hardening: From Austenite to Martensite</tspan></text><text x="490.0" y="44" font-size="11.5" text-anchor="middle" fill="#555" font-style="italic"><tspan x="490.0" dy="0.0">Schematic – not to scale</tspan></text><rect x="20" y="70" width="165" height="80" rx="8" fill="#fff3b0" stroke="#1a3c6e" stroke-width="1.6"/><text x="102.5" y="106.5625" font-size="12.5" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="102.5" dy="0.0">1 AUSTENITIZE</tspan><tspan x="102.5" dy="15.6">heat into austenite</tspan></text><line x1="185" y1="110" x2="210" y2="110" stroke="#333" stroke-width="2" marker-end="url(#ar)"/><rect x="210" y="70" width="165" height="80" rx="8" fill="#fde8d0" stroke="#1a3c6e" stroke-width="1.6"/><text x="292.5" y="106.5625" font-size="12.5" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="292.5" dy="0.0">2 RAPID COOLING</tspan><tspan x="292.5" dy="15.6">≥ critical cooling rate</tspan></text><line x1="375" y1="110" x2="400" y2="110" stroke="#333" stroke-width="2" marker-end="url(#ar)"/><rect x="400" y="70" width="165" height="80" rx="8" fill="#f3d9f2" stroke="#1a3c6e" stroke-width="1.6"/><text x="482.5" y="106.5625" font-size="12.5" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="482.5" dy="0.0">3 DIFFUSION</tspan><tspan x="482.5" dy="15.6">SUPPRESSED</tspan></text><line x1="565" y1="110" x2="590" y2="110" stroke="#333" stroke-width="2" marker-end="url(#ar)"/><rect x="590" y="70" width="165" height="80" rx="8" fill="#fdd9d9" stroke="#1a3c6e" stroke-width="1.6"/><text x="672.5" y="106.5625" font-size="12.5" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="672.5" dy="0.0">4 MARTENSITIC</tspan><tspan x="672.5" dy="15.6">TRANSFORMATION</tspan></text><line x1="755" y1="110" x2="780" y2="110" stroke="#333" stroke-width="2" marker-end="url(#ar)"/><rect x="780" y="70" width="165" height="80" rx="8" fill="#d9f2e6" stroke="#1a3c6e" stroke-width="1.6"/><text x="862.5" y="106.5625" font-size="12.5" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="862.5" dy="0.0">5 HIGH HARDNESS</tspan><tspan x="862.5" dy="15.6">(+ brittleness, stress)</tspan></text><rect x="20" y="190" width="450" height="180" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.2" opacity="1"/><text x="245" y="212" font-size="13" text-anchor="middle" fill="#1a5c2e" font-weight="bold"><tspan x="245" dy="0.0">SLOW cooling</tspan></text><text x="35" y="240" font-size="12" text-anchor="start" fill="#111"><tspan x="35" dy="0.0">• carbon has TIME to diffuse out of austenite</tspan></text><text x="35" y="260" font-size="12" text-anchor="start" fill="#111"><tspan x="35" dy="0.0">• ferrite + cementite (pearlite) form</tspan></text><text x="35" y="280" font-size="12" text-anchor="start" fill="#111"><tspan x="35" dy="0.0">• soft structure: annealed / normalized</tspan></text><text x="35" y="310" font-size="12" text-anchor="start" fill="#111" font-style="italic"><tspan x="35" dy="0.0">Product depends on rate → see TTT diagram</tspan></text><rect x="510" y="190" width="450" height="180" fill="#fdeeee" stroke="#b33" stroke-width="1.2" opacity="1"/><text x="735" y="212" font-size="13" text-anchor="middle" fill="#7a1f1f" font-weight="bold"><tspan x="735" dy="0.0">RAPID cooling (quench)</tspan></text><text x="525" y="240" font-size="12" text-anchor="start" fill="#111"><tspan x="525" dy="0.0">• carbon has NO time to diffuse</tspan></text><text x="525" y="260" font-size="12" text-anchor="start" fill="#111"><tspan x="525" dy="0.0">• FCC → BCT by shear (diffusionless)</tspan></text><text x="525" y="280" font-size="12" text-anchor="start" fill="#111"><tspan x="525" dy="0.0">• martensite: very hard, brittle</tspan></text><text x="525" y="310" font-size="12" text-anchor="start" fill="#111" font-weight="bold"><tspan x="525" dy="0.0">• Fully martensitic only if cooling ≥ critical rate</tspan></text><rect x="20" y="390" width="940" height="60" rx="6" fill="#f4f4f4" stroke="#1a3c6e" stroke-width="1.6"/><text x="490.0" y="424.375" font-size="12.5" text-anchor="middle" fill="#111"><tspan x="490.0" dy="0.0">Critical cooling rate = minimum rate that avoids diffusional products and gives a fully martensitic structure. It depends on chemical composition and austenitic grain size.</tspan></text></svg>