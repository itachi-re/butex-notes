<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Upper vs lower bainite" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Upper vs lower bainite</title><desc>Feathery bainite at about 850 F and acicular bainite at about 500 F</desc><defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker><pattern id="lam" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#f3e3c3"/><line x1="0" y1="3" x2="6" y2="3" stroke="#6b3d10" stroke-width="1.6"/></pattern><pattern id="lamf" width="3.5" height="3.5" patternUnits="userSpaceOnUse"><rect width="3.5" height="3.5" fill="#f3e3c3"/><line x1="0" y1="1.7" x2="3.5" y2="1.7" stroke="#6b3d10" stroke-width="1.2"/></pattern><pattern id="lamc" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f3e3c3"/><line x1="0" y1="5" x2="10" y2="5" stroke="#6b3d10" stroke-width="2.2"/></pattern></defs><rect width="100%" height="100%" fill="#fff"/><text x="490.0" y="26" font-size="17" text-anchor="middle" fill="#0b2a55" font-weight="bold"><tspan x="490.0" dy="0.0">Upper (Feathery) vs Lower (Acicular) Bainite</tspan></text><text x="490.0" y="44" font-size="11.5" text-anchor="middle" fill="#555" font-style="italic"><tspan x="490.0" dy="0.0">Schematic – not to scale</tspan></text><rect x="40" y="70" width="400" height="180" fill="#f5f5f5" stroke="#555" stroke-width="2" opacity="1"/><path d="M60 240 L82 150 L68 110 M82 150 L100 120" stroke="#222" stroke-width="3" fill="none"/><path d="M88 240 L110 150 L96 110 M110 150 L128 120" stroke="#222" stroke-width="3" fill="none"/><path d="M116 240 L138 150 L124 110 M138 150 L156 120" stroke="#222" stroke-width="3" fill="none"/><path d="M144 240 L166 150 L152 110 M166 150 L184 120" stroke="#222" stroke-width="3" fill="none"/><path d="M172 240 L194 150 L180 110 M194 150 L212 120" stroke="#222" stroke-width="3" fill="none"/><path d="M200 240 L222 150 L208 110 M222 150 L240 120" stroke="#222" stroke-width="3" fill="none"/><path d="M228 240 L250 150 L236 110 M250 150 L268 120" stroke="#222" stroke-width="3" fill="none"/><path d="M256 240 L278 150 L264 110 M278 150 L296 120" stroke="#222" stroke-width="3" fill="none"/><path d="M284 240 L306 150 L292 110 M306 150 L324 120" stroke="#222" stroke-width="3" fill="none"/><path d="M312 240 L334 150 L320 110 M334 150 L352 120" stroke="#222" stroke-width="3" fill="none"/><path d="M340 240 L362 150 L348 110 M362 150 L380 120" stroke="#222" stroke-width="3" fill="none"/><path d="M368 240 L390 150 L376 110 M390 150 L408 120" stroke="#222" stroke-width="3" fill="none"/><text x="240" y="272" font-size="13" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="240" dy="0.0">Upper / feathery bainite  (≈ 850 °F)</tspan></text><text x="240" y="290" font-size="11" text-anchor="middle" fill="#111"><tspan x="240" dy="0.0">looks like pearlite-like feathers in a martensite matrix (lecture)</tspan></text><rect x="540" y="70" width="400" height="180" fill="#f5f5f5" stroke="#555" stroke-width="2" opacity="1"/><line x1="560" y1="230" x2="680" y2="120" stroke="#222" stroke-width="3.5"/><circle cx="590.0" cy="202.5" r="2.2" fill="#c0392b" stroke="none"/><circle cx="620.0" cy="175.0" r="2.2" fill="#c0392b" stroke="none"/><circle cx="650.0" cy="147.5" r="2.2" fill="#c0392b" stroke="none"/><line x1="600" y1="240" x2="720" y2="140" stroke="#222" stroke-width="3.5"/><circle cx="630.0" cy="215.0" r="2.2" fill="#c0392b" stroke="none"/><circle cx="660.0" cy="190.0" r="2.2" fill="#c0392b" stroke="none"/><circle cx="690.0" cy="165.0" r="2.2" fill="#c0392b" stroke="none"/><line x1="650" y1="235" x2="790" y2="110" stroke="#222" stroke-width="3.5"/><circle cx="685.0" cy="203.75" r="2.2" fill="#c0392b" stroke="none"/><circle cx="720.0" cy="172.5" r="2.2" fill="#c0392b" stroke="none"/><circle cx="755.0" cy="141.25" r="2.2" fill="#c0392b" stroke="none"/><line x1="700" y1="240" x2="830" y2="150" stroke="#222" stroke-width="3.5"/><circle cx="732.5" cy="217.5" r="2.2" fill="#c0392b" stroke="none"/><circle cx="765.0" cy="195.0" r="2.2" fill="#c0392b" stroke="none"/><circle cx="797.5" cy="172.5" r="2.2" fill="#c0392b" stroke="none"/><line x1="760" y1="235" x2="900" y2="120" stroke="#222" stroke-width="3.5"/><circle cx="795.0" cy="206.25" r="2.2" fill="#c0392b" stroke="none"/><circle cx="830.0" cy="177.5" r="2.2" fill="#c0392b" stroke="none"/><circle cx="865.0" cy="148.75" r="2.2" fill="#c0392b" stroke="none"/><line x1="570" y1="180" x2="640" y2="110" stroke="#222" stroke-width="3.5"/><circle cx="587.5" cy="162.5" r="2.2" fill="#c0392b" stroke="none"/><circle cx="605.0" cy="145.0" r="2.2" fill="#c0392b" stroke="none"/><circle cx="622.5" cy="127.5" r="2.2" fill="#c0392b" stroke="none"/><line x1="820" y1="240" x2="920" y2="190" stroke="#222" stroke-width="3.5"/><circle cx="845.0" cy="227.5" r="2.2" fill="#c0392b" stroke="none"/><circle cx="870.0" cy="215.0" r="2.2" fill="#c0392b" stroke="none"/><circle cx="895.0" cy="202.5" r="2.2" fill="#c0392b" stroke="none"/><text x="740" y="272" font-size="13" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="740" dy="0.0">Lower / acicular bainite  (≈ 500 °F)</tspan></text><text x="740" y="290" font-size="11" text-anchor="middle" fill="#111"><tspan x="740" dy="0.0">needle-like, resembles martensite</tspan></text><line x1="90" y1="345" x2="890" y2="345" stroke="#111" stroke-width="3" marker-end="url(#ar)"/><text x="90" y="335" font-size="11.5" text-anchor="start" fill="#111" font-weight="bold"><tspan x="90" dy="0.0">Transformation temperature ↓   (bainite forms between pearlite and Ms; lecture austempering range 400–800 °F)</tspan></text><line x1="230" y1="338" x2="230" y2="352" stroke="#b33" stroke-width="2.5"/><text x="230" y="372" font-size="12" text-anchor="middle" fill="#b33" font-weight="bold"><tspan x="230" dy="0.0">≈ 850 °F  upper</tspan></text><line x1="700" y1="338" x2="700" y2="352" stroke="#b33" stroke-width="2.5"/><text x="700" y="372" font-size="12" text-anchor="middle" fill="#b33" font-weight="bold"><tspan x="700" dy="0.0">≈ 500 °F  lower</tspan></text><rect x="40" y="400" width="900" height="95" rx="6" fill="#fff3b0" stroke="#1a3c6e" stroke-width="1.6"/><text x="490.0" y="436.7" font-size="12" text-anchor="middle" fill="#111"><tspan x="490.0" dy="0.0">Higher T → coarser, feathery, lower strength/hardness than lower bainite.</tspan><tspan x="490.0" dy="15.0">Lower T → finer needles with very fine carbides inside → harder, tougher.</tspan><tspan x="490.0" dy="15.0">Both are products of ISOTHERMAL (or continuous fast) transformation shown below the pearlite nose on the TTT diagram.</tspan></text></svg>