<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" role="img" aria-label="Wet (electrochemical) corrosion of iron under a water drop"><defs><marker id="ahea580c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="ah7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs><rect x="0.5" y="0.5" width="819" height="439" rx="10" fill="#ffffff" stroke="#d1d5db"/><text x="410.0" y="24.0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">Wet (electrochemical) corrosion of iron under a water drop</text><rect x="60.0" y="300.0" width="700.0" height="70.0" rx="0" fill="#9ca3af" stroke="#1f2937" stroke-width="2"/><path d="M170,300 Q170,170 410,160 Q650,170 650,300 Z" fill="#bfdbfe" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill-opacity="0.6"/><text x="250.7" y="186.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#2563eb" font-weight="normal" xml:space="preserve">Electrolyte: moist film / water + dissolved O</text><text x="470.3" y="188.3" font-family="Arial, Helvetica, sans-serif" font-size="8.0" fill="#2563eb" font-weight="normal" xml:space="preserve">2</text><text x="474.7" y="186.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#2563eb" font-weight="normal" xml:space="preserve">, CO</text><text x="498.3" y="188.3" font-family="Arial, Helvetica, sans-serif" font-size="8.0" fill="#2563eb" font-weight="normal" xml:space="preserve">2</text><text x="502.8" y="186.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#2563eb" font-weight="normal" xml:space="preserve"> (conducting)</text><rect x="190.0" y="300.0" width="150.0" height="70.0" rx="0" fill="#fecaca" stroke="#dc2626" stroke-width="0" fill-opacity="0.5"/><rect x="480.0" y="300.0" width="170.0" height="70.0" rx="0" fill="#bbf7d0" stroke="#16a34a" stroke-width="0" fill-opacity="0.5"/><text x="265.0" y="322.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold">ANODE</text><text x="410.0" y="358.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="bold">Iron / steel (one piece of metal acts as anode, cathode and conductor)</text><text x="565.0" y="322.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="bold">CATHODE</text><text x="218.4" y="262.0" font-family="Arial, Helvetica, sans-serif" font-size="13.0" fill="#dc2626" font-weight="bold" xml:space="preserve">Fe → Fe</text><text x="269.0" y="257.1" font-family="Arial, Helvetica, sans-serif" font-size="9.1" fill="#dc2626" font-weight="bold" xml:space="preserve">2+</text><text x="279.3" y="262.0" font-family="Arial, Helvetica, sans-serif" font-size="13.0" fill="#dc2626" font-weight="bold" xml:space="preserve"> + 2e</text><text x="308.6" y="257.1" font-family="Arial, Helvetica, sans-serif" font-size="9.1" fill="#dc2626" font-weight="bold" xml:space="preserve">-</text><text x="265.0" y="278.0" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="normal">(oxidation: metal dissolves)</text><text x="493.0" y="262.0" font-family="Arial, Helvetica, sans-serif" font-size="13.0" fill="#16a34a" font-weight="bold" xml:space="preserve">O</text><text x="503.2" y="264.6" font-family="Arial, Helvetica, sans-serif" font-size="9.1" fill="#16a34a" font-weight="bold" xml:space="preserve">2</text><text x="508.2" y="262.0" font-family="Arial, Helvetica, sans-serif" font-size="13.0" fill="#16a34a" font-weight="bold" xml:space="preserve"> + 2H</text><text x="539.6" y="264.6" font-family="Arial, Helvetica, sans-serif" font-size="9.1" fill="#16a34a" font-weight="bold" xml:space="preserve">2</text><text x="544.6" y="262.0" font-family="Arial, Helvetica, sans-serif" font-size="13.0" fill="#16a34a" font-weight="bold" xml:space="preserve">O + 4e</text><text x="584.0" y="257.1" font-family="Arial, Helvetica, sans-serif" font-size="9.1" fill="#16a34a" font-weight="bold" xml:space="preserve">-</text><text x="587.0" y="262.0" font-family="Arial, Helvetica, sans-serif" font-size="13.0" fill="#16a34a" font-weight="bold" xml:space="preserve"> → 4OH</text><text x="634.0" y="257.1" font-family="Arial, Helvetica, sans-serif" font-size="9.1" fill="#16a34a" font-weight="bold" xml:space="preserve">-</text><text x="565.0" y="278.0" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="normal">(reduction: oxygen consumed)</text><line x1="300.0" y1="395.0" x2="520.0" y2="395.0" stroke="#ea580c" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ahea580c)"/><text x="410.0" y="415.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#ea580c" text-anchor="middle" font-weight="normal">electrons flow through the metal  (anode → cathode)</text><path d="M300,225 Q410,205 520,225" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="500.0" y1="223.0" x2="521.0" y2="227.0" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" marker-end="url(#ah7c3aed)"/><text x="410.0" y="240.0" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="normal">ions migrate through the electrolyte</text><rect x="250.0" y="52.0" width="320.0" height="74.0" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/><text x="340.7" y="74.0" font-family="Arial, Helvetica, sans-serif" font-size="13.0" fill="#9a3412" font-weight="bold" xml:space="preserve">Fe</text><text x="355.9" y="69.1" font-family="Arial, Helvetica, sans-serif" font-size="9.1" fill="#9a3412" font-weight="bold" xml:space="preserve">2+</text><text x="366.2" y="74.0" font-family="Arial, Helvetica, sans-serif" font-size="13.0" fill="#9a3412" font-weight="bold" xml:space="preserve"> + 2OH</text><text x="407.7" y="69.1" font-family="Arial, Helvetica, sans-serif" font-size="9.1" fill="#9a3412" font-weight="bold" xml:space="preserve">-</text><text x="410.7" y="74.0" font-family="Arial, Helvetica, sans-serif" font-size="13.0" fill="#9a3412" font-weight="bold" xml:space="preserve"> → Fe(OH)</text><text x="474.3" y="76.6" font-family="Arial, Helvetica, sans-serif" font-size="9.1" fill="#9a3412" font-weight="bold" xml:space="preserve">2</text><text x="252.7" y="94.0" font-family="Arial, Helvetica, sans-serif" font-size="12.0" fill="#9a3412" font-weight="normal" xml:space="preserve">4Fe(OH)</text><text x="299.4" y="96.4" font-family="Arial, Helvetica, sans-serif" font-size="8.4" fill="#9a3412" font-weight="normal" xml:space="preserve">2</text><text x="304.1" y="94.0" font-family="Arial, Helvetica, sans-serif" font-size="12.0" fill="#9a3412" font-weight="normal" xml:space="preserve"> + O</text><text x="327.2" y="96.4" font-family="Arial, Helvetica, sans-serif" font-size="8.4" fill="#9a3412" font-weight="normal" xml:space="preserve">2</text><text x="331.9" y="94.0" font-family="Arial, Helvetica, sans-serif" font-size="12.0" fill="#9a3412" font-weight="normal" xml:space="preserve"> + 2H</text><text x="360.9" y="96.4" font-family="Arial, Helvetica, sans-serif" font-size="8.4" fill="#9a3412" font-weight="normal" xml:space="preserve">2</text><text x="365.6" y="94.0" font-family="Arial, Helvetica, sans-serif" font-size="12.0" fill="#9a3412" font-weight="normal" xml:space="preserve">O → 4Fe(OH)</text><text x="440.3" y="96.4" font-family="Arial, Helvetica, sans-serif" font-size="8.4" fill="#9a3412" font-weight="normal" xml:space="preserve">3</text><text x="445.1" y="94.0" font-family="Arial, Helvetica, sans-serif" font-size="12.0" fill="#9a3412" font-weight="normal" xml:space="preserve">  →  rust (Fe</text><text x="511.7" y="96.4" font-family="Arial, Helvetica, sans-serif" font-size="8.4" fill="#9a3412" font-weight="normal" xml:space="preserve">2</text><text x="516.5" y="94.0" font-family="Arial, Helvetica, sans-serif" font-size="12.0" fill="#9a3412" font-weight="normal" xml:space="preserve">O</text><text x="525.8" y="96.4" font-family="Arial, Helvetica, sans-serif" font-size="8.4" fill="#9a3412" font-weight="normal" xml:space="preserve">3</text><text x="530.5" y="94.0" font-family="Arial, Helvetica, sans-serif" font-size="12.0" fill="#9a3412" font-weight="normal" xml:space="preserve">·xH</text><text x="549.2" y="96.4" font-family="Arial, Helvetica, sans-serif" font-size="8.4" fill="#9a3412" font-weight="normal" xml:space="preserve">2</text><text x="553.9" y="94.0" font-family="Arial, Helvetica, sans-serif" font-size="12.0" fill="#9a3412" font-weight="normal" xml:space="preserve">O)</text><text x="234.2" y="114.0" font-family="Arial, Helvetica, sans-serif" font-size="11.0" fill="#6b7280" font-weight="normal" xml:space="preserve">Acidic medium: cathode reaction is 2H</text><text x="421.2" y="109.8" font-family="Arial, Helvetica, sans-serif" font-size="7.7" fill="#6b7280" font-weight="normal" xml:space="preserve">+</text><text x="425.8" y="114.0" font-family="Arial, Helvetica, sans-serif" font-size="11.0" fill="#6b7280" font-weight="normal" xml:space="preserve"> + 2e</text><text x="450.5" y="109.8" font-family="Arial, Helvetica, sans-serif" font-size="7.7" fill="#6b7280" font-weight="normal" xml:space="preserve">-</text><text x="453.1" y="114.0" font-family="Arial, Helvetica, sans-serif" font-size="11.0" fill="#6b7280" font-weight="normal" xml:space="preserve"> → H</text><text x="478.2" y="116.2" font-family="Arial, Helvetica, sans-serif" font-size="7.7" fill="#6b7280" font-weight="normal" xml:space="preserve">2</text><text x="482.5" y="114.0" font-family="Arial, Helvetica, sans-serif" font-size="11.0" fill="#6b7280" font-weight="normal" xml:space="preserve"> (hydrogen evolution)</text></svg>