<rect width="680" height="285" fill="#ffffff"/>
<text x="60" y="30" font-weight="bold" fill="#1f2937">Primary (coil 1)</text><text x="380" y="30" font-weight="bold" fill="#1f2937">Secondary (coil 2)</text>
