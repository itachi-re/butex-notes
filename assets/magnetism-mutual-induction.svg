<svg xmlns="http://www.w3.org/2000/svg" width="680" height="285" viewBox="0 0 680 285" font-family="Helvetica, Arial, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Mutual induction between two coils</title>
<defs>
