<path d="M400 92 L400 60 L600 60 L600 110 M460 168 L460 200 L600 200 L600 150" fill="none" stroke="#1f2937" stroke-width="1.5"/>
<circle cx="600" cy="130" r="20" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/><text x="600" y="135" text-anchor="middle" fill="#1f2937">G</text>
