<text x="290" y="100" fill="#1d4ed8">flux</text>
<text x="60" y="240" fill="#1f2937">Changing I1 changes the flux through coil 2, so an emf is induced in coil 2.</text>
<text x="60" y="262" fill="#1f2937">ε2 = −M dI1/dt</text><text x="260" y="262" fill="#1f2937">M = N2 Φ21 / I1</text><text x="460" y="262" fill="#1f2937">(unit: henry)</text>
