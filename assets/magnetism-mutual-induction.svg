<ellipse cx="400" cy="130" rx="9" ry="38" fill="none" stroke="#92400e" stroke-width="2.5"/>
<ellipse cx="420" cy="130" rx="9" ry="38" fill="none" stroke="#92400e" stroke-width="2.5"/>
