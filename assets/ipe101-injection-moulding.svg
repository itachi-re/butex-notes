<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" font-family="DejaVu Sans, Verdana, Arial, sans-serif" role="img" aria-label="Injection moulding of thermoplastics"><title>Injection moulding of thermoplastics</title><defs><marker id="m2e7d32" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#2e7d32"/></marker><marker id="m1565c0" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#1565c0"/></marker><marker id="md62828" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#d62828"/></marker></defs><rect width="1100" height="400" fill="#ffffff"/><text x="550.0" y="28.0" font-size="17" text-anchor="middle" fill="#222" font-weight="bold">Injection moulding of thermoplastics</text><text x="550.0" y="46.0" font-size="12" text-anchor="middle" fill="#555" font-weight="normal">hopper → heated barrel with reciprocating screw → nozzle → closed mould → cooling → ejection</text><polygon points="210.0,70.0 290.0,70.0 270.0,130.0 230.0,130.0" fill="#ffcc80" stroke="#e65100" stroke-width="2" stroke-linejoin="round"/><text x="250.0" y="98.0" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">hopper</text><text x="250.0" y="112.0" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">(granules)</text><rect x="130.0" y="130.0" width="440.0" height="62.0" rx="0" fill="#cfd8dc" stroke="#37474f" stroke-width="2.5"/><rect x="230.0" y="124.0" width="22.0" height="74.0" rx="0" fill="#ff7043" stroke="#bf360c" stroke-width="1.5"/><rect x="330.0" y="124.0" width="22.0" height="74.0" rx="0" fill="#ff7043" stroke="#bf360c" stroke-width="1.5"/><rect x="430.0" y="124.0" width="22.0" height="74.0" rx="0" fill="#ff7043" stroke="#bf360c" stroke-width="1.5"/><text x="330.0" y="215.0" font-size="11" text-anchor="middle" fill="#bf360c" font-weight="normal">electric heater bands (170–280 °C)</text><polyline points="140.0,151.7 148.0,170.3 156.0,151.7 156.0,151.7 164.0,170.3 172.0,151.7 172.0,151.7 180.0,170.3 188.0,151.7 188.0,151.7 196.0,170.3 204.0,151.7 204.0,151.7 212.0,170.3 220.0,151.7 220.0,151.7 228.0,170.3 236.0,151.7 236.0,151.7 244.0,170.3 252.0,151.7 252.0,151.7 260.0,170.3 268.0,151.7 268.0,151.7 276.0,170.3 284.0,151.7 284.0,151.7 292.0,170.3 300.0,151.7 300.0,151.7 308.0,170.3 316.0,151.7 316.0,151.7 324.0,170.3 332.0,151.7 332.0,151.7 340.0,170.3 348.0,151.7 348.0,151.7 356.0,170.3 364.0,151.7 364.0,151.7 372.0,170.3 380.0,151.7 380.0,151.7 388.0,170.3 396.0,151.7 396.0,151.7 404.0,170.3 412.0,151.7 412.0,151.7 420.0,170.3 428.0,151.7 428.0,151.7 436.0,170.3 444.0,151.7 444.0,151.7 452.0,170.3 460.0,151.7 460.0,151.7 468.0,170.3 476.0,151.7 476.0,151.7 484.0,170.3 492.0,151.7 492.0,151.7 500.0,170.3 508.0,151.7 508.0,151.7 516.0,170.3 524.0,151.7 524.0,151.7 532.0,170.3 540.0,151.7 540.0,151.7 548.0,170.3 556.0,151.7" fill="none" stroke="#37474f" stroke-width="2" stroke-linejoin="round"/><polygon points="570.0,140.0 620.0,158.0 620.0,164.0 570.0,182.0" fill="#90a4ae" stroke="#37474f" stroke-width="2" stroke-linejoin="round"/><text x="595.0" y="125.0" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">nozzle</text><line x1="60.0" y1="160.0" x2="128.0" y2="160.0" stroke="#2e7d32" stroke-width="3" marker-end="url(#m2e7d32)" stroke-linecap="round"/><text x="30.0" y="150.0" font-size="11" text-anchor="start" fill="#222" font-weight="normal">screw motor</text><text x="30.0" y="190.0" font-size="11" text-anchor="start" fill="#222" font-weight="normal">drive</text><line x1="350.0" y1="250.0" x2="350.0" y2="200.0" stroke="#1565c0" stroke-width="2" marker-end="url(#m1565c0)" stroke-linecap="round"/><text x="350.0" y="268.0" font-size="11" text-anchor="middle" fill="#1565c0" font-weight="normal">screw rotates (melts, mixes) then moves forward (injects)</text><rect x="640.0" y="110.0" width="60.0" height="110.0" rx="0" fill="#90a4ae" stroke="#37474f" stroke-width="2"/><rect x="700.0" y="130.0" width="60.0" height="70.0" rx="0" fill="#b0bec5" stroke="#37474f" stroke-width="2"/><rect x="760.0" y="130.0" width="60.0" height="70.0" rx="0" fill="#b0bec5" stroke="#37474f" stroke-width="2"/><rect x="720.0" y="150.0" width="60.0" height="30.0" rx="0" fill="#ffab91" stroke="#bf360c" stroke-width="1.5"/><text x="715.0" y="240.0" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">fixed half</text><text x="800.0" y="252.0" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">moving half</text><text x="748.0" y="256.0" font-size="11" text-anchor="middle" fill="#bf360c" font-weight="bold">cavity (part)</text><rect x="820.0" y="150.0" width="110.0" height="30.0" rx="0" fill="#78909c" stroke="#37474f" stroke-width="2"/><rect x="930.0" y="120.0" width="20.0" height="90.0" rx="0" fill="#78909c" stroke="#37474f" stroke-width="2"/><text x="880.0" y="140.0" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">clamp ram</text><line x1="840.0" y1="100.0" x2="780.0" y2="100.0" stroke="#d62828" stroke-width="3" marker-end="url(#md62828)" stroke-linecap="round"/><text x="840.0" y="92.0" font-size="11" text-anchor="start" fill="#d62828" font-weight="bold">clamping force</text><polygon points="40.0,305.0 270.0,305.0 285.0,328.0 270.0,351.0 40.0,351.0 55.0,328.0" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5" stroke-linejoin="round"/><text x="162.0" y="333.0" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">① Clamp mould</text><polygon points="300.0,305.0 530.0,305.0 545.0,328.0 530.0,351.0 300.0,351.0 315.0,328.0" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5" stroke-linejoin="round"/><text x="422.0" y="333.0" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">② Inject melt (high pressure)</text><polygon points="560.0,305.0 790.0,305.0 805.0,328.0 790.0,351.0 560.0,351.0 575.0,328.0" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5" stroke-linejoin="round"/><text x="682.0" y="333.0" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">③ Hold + cool</text><polygon points="820.0,305.0 1050.0,305.0 1065.0,328.0 1050.0,351.0 820.0,351.0 835.0,328.0" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5" stroke-linejoin="round"/><text x="942.0" y="333.0" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">④ Open &amp; eject</text><text x="550.0" y="385.0" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">Typical products: bottle caps, buckets, gears, combs, pen bodies, TV housings. Thermosets use a heated mould instead.</text></svg>