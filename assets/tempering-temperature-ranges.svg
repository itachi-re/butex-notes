<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Tempering temperature ranges timeline" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Tempering temperature ranges timeline</title><desc>Lecture tempering ranges from 100 to 1333 F</desc><defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker><pattern id="lam" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#f3e3c3"/><line x1="0" y1="3" x2="6" y2="3" stroke="#6b3d10" stroke-width="1.6"/></pattern><pattern id="lamf" width="3.5" height="3.5" patternUnits="userSpaceOnUse"><rect width="3.5" height="3.5" fill="#f3e3c3"/><line x1="0" y1="1.7" x2="3.5" y2="1.7" stroke="#6b3d10" stroke-width="1.2"/></pattern><pattern id="lamc" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f3e3c3"/><line x1="0" y1="5" x2="10" y2="5" stroke="#6b3d10" stroke-width="2.2"/></pattern></defs><rect width="100%" height="100%" fill="#fff"/><text x="480.0" y="26" font-size="17" text-anchor="middle" fill="#0b2a55" font-weight="bold"><tspan x="480.0" dy="0.0">Tempering Temperature Ranges (°F)</tspan></text><text x="480.0" y="44" font-size="11.5" text-anchor="middle" fill="#555" font-style="italic"><tspan x="480.0" dy="0.0">Schematic timeline – ranges are lecture values</tspan></text><text x="60" y="70" font-size="14" text-anchor="start" fill="#0b2a55" font-weight="bold"><tspan x="60" dy="0.0">Tempering temperature ↑  →  hardness ↓  →  toughness ↑  →  residual stress ↓</tspan></text><line x1="60" y1="110" x2="890" y2="110" stroke="#111" stroke-width="2.5" marker-end="url(#ar)"/><line x1="60.0" y1="104" x2="60.0" y2="116" stroke="#111" stroke-width="1.5"/><text x="60.0" y="132" font-size="10.5" text-anchor="middle" fill="#111"><tspan x="60.0" dy="0.0">100</tspan></text><line x1="249.23076923076923" y1="104" x2="249.23076923076923" y2="116" stroke="#111" stroke-width="1.5"/><text x="249.23076923076923" y="132" font-size="10.5" text-anchor="middle" fill="#111"><tspan x="249.23076923076923" dy="0.0">400</tspan></text><line x1="280.7692307692308" y1="104" x2="280.7692307692308" y2="116" stroke="#111" stroke-width="1.5"/><text x="280.7692307692308" y="132" font-size="10.5" text-anchor="middle" fill="#111"><tspan x="280.7692307692308" dy="0.0">450</tspan></text><line x1="470.0" y1="104" x2="470.0" y2="116" stroke="#111" stroke-width="1.5"/><text x="470.0" y="132" font-size="10.5" text-anchor="middle" fill="#111"><tspan x="470.0" dy="0.0">750</tspan></text><line x1="501.53846153846155" y1="104" x2="501.53846153846155" y2="116" stroke="#111" stroke-width="1.5"/><text x="501.53846153846155" y="132" font-size="10.5" text-anchor="middle" fill="#111"><tspan x="501.53846153846155" dy="0.0">800</tspan></text><line x1="753.8461538461538" y1="104" x2="753.8461538461538" y2="116" stroke="#111" stroke-width="1.5"/><text x="753.8461538461538" y="132" font-size="10.5" text-anchor="middle" fill="#111"><tspan x="753.8461538461538" dy="0.0">1200</tspan></text><line x1="785.3846153846154" y1="104" x2="785.3846153846154" y2="116" stroke="#111" stroke-width="1.5"/><text x="785.3846153846154" y="132" font-size="10.5" text-anchor="middle" fill="#111"><tspan x="785.3846153846154" dy="0.0">1250</tspan></text><line x1="837.7384615384615" y1="104" x2="837.7384615384615" y2="116" stroke="#111" stroke-width="1.5"/><text x="837.7384615384615" y="132" font-size="10.5" text-anchor="middle" fill="#111"><tspan x="837.7384615384615" dy="0.0">1333</tspan></text><rect x="60.0" y="150" width="189.23076923076923" height="75" fill="#f8d7d7" stroke="#555" stroke-width="1.5" opacity="1"/><text x="154.6153846153846" y="175" font-size="12" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="154.6153846153846" dy="0.0">100–400 °F</tspan></text><text x="154.6153846153846" y="192" font-size="10.5" text-anchor="middle" fill="#111"><tspan x="154.6153846153846" dy="0.0">Black martensite</tspan></text><text x="154.6153846153846" y="206" font-size="10.5" text-anchor="middle" fill="#111"><tspan x="154.6153846153846" dy="0.0">ε-carbide (HCP) forms</tspan></text><text x="154.6153846153846" y="220" font-size="10.5" text-anchor="middle" fill="#111"><tspan x="154.6153846153846" dy="0.0">c/a → 1</tspan></text><rect x="280.7692307692308" y="150" width="189.23076923076923" height="75" fill="#fde8d0" stroke="#555" stroke-width="1.5" opacity="1"/><text x="375.38461538461536" y="175" font-size="12" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="375.38461538461536" dy="0.0">450–750 °F</tspan></text><text x="375.38461538461536" y="192" font-size="10.5" text-anchor="middle" fill="#111"><tspan x="375.38461538461536" dy="0.0">Troostite (black mass)</tspan></text><text x="375.38461538461536" y="206" font-size="10.5" text-anchor="middle" fill="#111"><tspan x="375.38461538461536" dy="0.0">cementite (orthorhombic)</tspan></text><text x="375.38461538461536" y="220" font-size="10.5" text-anchor="middle" fill="#111"><tspan x="375.38461538461536" dy="0.0">in ferrite; ε → Fe₃C</tspan></text><rect x="470.0" y="150" width="283.8461538461538" height="75" fill="#fff3b0" stroke="#555" stroke-width="1.5" opacity="1"/><text x="611.9230769230769" y="175" font-size="12" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="611.9230769230769" dy="0.0">750–1200 °F</tspan></text><text x="611.9230769230769" y="192" font-size="10.5" text-anchor="middle" fill="#111"><tspan x="611.9230769230769" dy="0.0">Sorbite</tspan></text><text x="611.9230769230769" y="206" font-size="10.5" text-anchor="middle" fill="#111"><tspan x="611.9230769230769" dy="0.0">cementite grows</tspan></text><text x="611.9230769230769" y="220" font-size="10.5" text-anchor="middle" fill="#111"><tspan x="611.9230769230769" dy="0.0">resolvable at 500×</tspan></text><rect x="753.8461538461538" y="150" width="83.89230769230767" height="75" fill="#d9f2e6" stroke="#555" stroke-width="1.5" opacity="1"/><text x="795.7923076923076" y="175" font-size="12" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="795.7923076923076" dy="0.0">1200–1333 °F</tspan></text><text x="795.7923076923076" y="192" font-size="10.5" text-anchor="middle" fill="#111"><tspan x="795.7923076923076" dy="0.0">Globular cementite</tspan></text><text x="795.7923076923076" y="206" font-size="10.5" text-anchor="middle" fill="#111"><tspan x="795.7923076923076" dy="0.0">in ferrite</tspan></text><text x="795.7923076923076" y="220" font-size="10.5" text-anchor="middle" fill="#111"><tspan x="795.7923076923076" dy="0.0">≈ spheroidized</tspan></text><rect x="249.23076923076923" y="238" width="252.30769230769232" height="24" fill="#e8f0fe" stroke="#1a3c6e" stroke-width="1.5" opacity="1"/><text x="375.38461538461536" y="255" font-size="11" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="375.38461538461536" dy="0.0">General tempering range 400–800 °F</tspan></text><rect x="627.6923076923076" y="270" width="157.69230769230774" height="24" fill="#fdd9d9" stroke="#b33" stroke-width="1.5" opacity="1"/><text x="706.5384615384614" y="287" font-size="10.5" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="706.5384615384614" dy="0.0">Temper brittleness 1000–1250 °F (slow cool)</tspan></text><text x="60" y="325" font-size="13" text-anchor="start" fill="#111" font-weight="bold"><tspan x="60" dy="0.0">Lecture rules of thumb</tspan></text><text x="60" y="346" font-size="12.5" text-anchor="start" fill="#111"><tspan x="60" dy="0.0">• Temper BELOW 400 °F → keep hardness / wear resistance.</tspan></text><text x="60" y="366" font-size="12.5" text-anchor="start" fill="#111"><tspan x="60" dy="0.0">• Temper ABOVE 800 °F → gain toughness.</tspan></text><text x="60" y="386" font-size="12.5" text-anchor="start" fill="#111"><tspan x="60" dy="0.0">• Residual stresses relieved mostly around 400 °F; almost gone by 900 °F.</tspan></text><text x="60" y="420" font-size="13" text-anchor="start" fill="#111" font-weight="bold"><tspan x="60" dy="0.0">Property snapshots (as given in lecture)</tspan></text><text x="60" y="441" font-size="12" text-anchor="start" fill="#111"><tspan x="60" dy="0.0">450–750 °F:  tensile strength ≈ 200,000 psi · hardness ≈ Rockwell C40–C60 · slightly ↑ ductility · low toughness</tspan></text><text x="60" y="461" font-size="12" text-anchor="start" fill="#111"><tspan x="60" dy="0.0">750–1200 °F: tensile strength 125,000–200,000 psi · elongation 10–20 % in 2 in. · Rockwell C20–C40 · rapid ↑ toughness</tspan></text><text x="60" y="481" font-size="12" text-anchor="start" fill="#111"><tspan x="60" dy="0.0">1200–1333 °F: very soft and tough (large globular cementite, like spheroidized structure)</tspan></text><text x="60" y="500" font-size="12" text-anchor="start" fill="#111"><tspan x="60" dy="0.0">100–400 °F: high strength &amp; hardness, low ductility &amp; toughness; residual stress relieved; slight hardness rise from transition carbide.</tspan></text></svg>