<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#263238"/></marker><marker id="blueArrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#1976D2"/></marker></defs>
<rect x="0" y="0" width="900" height="520" fill="#FFFFFF"/>
<text x="450.0" y="36" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#263238" text-anchor="middle" font-weight="bold">Fundamental postulates of kinetic theory</text>
<rect x="35" y="105" width="255" height="140" rx="12" fill="#FFFFFF" stroke="#1976D2" stroke-width="2"/><text x="162" y="139" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#263238" text-anchor="middle" font-weight="bold">1. Molecular nature</text><text x="162" y="180" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#263238" text-anchor="middle" font-weight="normal">A gas contains a very large number</text><text x="162" y="207" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#263238" text-anchor="middle" font-weight="normal">of tiny molecules.</text><rect x="325" y="105" width="255" height="140" rx="12" fill="#FFFFFF" stroke="#2E7D32" stroke-width="2"/><text x="452" y="139" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#263238" text-anchor="middle" font-weight="bold">2. Random motion</text><text x="452" y="180" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#263238" text-anchor="middle" font-weight="normal">Molecules move continuously and</text><text x="452" y="207" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#263238" text-anchor="middle" font-weight="normal">randomly in all directions.</text><rect x="615" y="105" width="255" height="140" rx="12" fill="#FFFFFF" stroke="#EF6C00" stroke-width="2"/><text x="742" y="139" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#263238" text-anchor="middle" font-weight="bold">3. Negligible volume</text><text x="742" y="180" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#263238" text-anchor="middle" font-weight="normal">Molecular size is very small</text><text x="742" y="207" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#263238" text-anchor="middle" font-weight="normal">compared with the container.</text><rect x="35" y="290" width="255" height="140" rx="12" fill="#FFFFFF" stroke="#1976D2" stroke-width="2"/><text x="162" y="324" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#263238" text-anchor="middle" font-weight="bold">4. Elastic collisions</text><text x="162" y="365" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#263238" text-anchor="middle" font-weight="normal">Molecule–molecule and wall</text><text x="162" y="392" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#263238" text-anchor="middle" font-weight="normal">collisions conserve kinetic energy.</text><rect x="325" y="290" width="255" height="140" rx="12" fill="#FFFFFF" stroke="#2E7D32" stroke-width="2"/><text x="452" y="324" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#263238" text-anchor="middle" font-weight="bold">5. Weak forces</text><text x="452" y="365" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#263238" text-anchor="middle" font-weight="normal">Intermolecular forces are negligible</text><text x="452" y="392" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#263238" text-anchor="middle" font-weight="normal">except during collisions.</text><rect x="615" y="290" width="255" height="140" rx="12" fill="#FFFFFF" stroke="#EF6C00" stroke-width="2"/><text x="742" y="324" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#263238" text-anchor="middle" font-weight="bold">6. Newtonian motion</text><text x="742" y="365" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#263238" text-anchor="middle" font-weight="normal">Between collisions, molecules</text><text x="742" y="392" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#263238" text-anchor="middle" font-weight="normal">obey Newton’s laws.</text>
</svg>