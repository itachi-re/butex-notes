<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 660" width="1040" height="660" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Cooling paths on a TTT diagram" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Cooling paths on a TTT diagram</title><desc>Schematic overlay of eight cooling paths</desc><defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker><pattern id="lam" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#f3e3c3"/><line x1="0" y1="3" x2="6" y2="3" stroke="#6b3d10" stroke-width="1.6"/></pattern><pattern id="lamf" width="3.5" height="3.5" patternUnits="userSpaceOnUse"><rect width="3.5" height="3.5" fill="#f3e3c3"/><line x1="0" y1="1.7" x2="3.5" y2="1.7" stroke="#6b3d10" stroke-width="1.2"/></pattern><pattern id="lamc" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f3e3c3"/><line x1="0" y1="5" x2="10" y2="5" stroke="#6b3d10" stroke-width="2.2"/></pattern></defs><rect width="100%" height="100%" fill="#fff"/><text x="520.0" y="26" font-size="17" text-anchor="middle" fill="#0b2a55" font-weight="bold"><tspan x="520.0" dy="0.0">Cooling Paths Overlaid on a Schematic TTT Diagram</tspan></text><text x="520.0" y="44" font-size="11.5" text-anchor="middle" fill="#555" font-style="italic"><tspan x="520.0" dy="0.0">Schematic – positions are conceptual, not from measured data</tspan></text><line x1="100" y1="500" x2="800" y2="500" stroke="#111" stroke-width="2" marker-end="url(#ar)"/><line x1="100" y1="500" x2="100" y2="70" stroke="#111" stroke-width="2" marker-end="url(#ar)"/><text x="450.0" y="534" font-size="12" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="450.0" dy="0.0">Time (log) →</tspan></text><text x="62" y="285.0" font-size="12" text-anchor="middle" fill="#111" font-weight="bold" transform="rotate(-90 62 285.0)"><tspan x="62" dy="0.0">Temperature →</tspan></text><line x1="100" y1="110" x2="800" y2="110" stroke="#33b" stroke-width="1.4" stroke-dasharray="7 4"/><text x="806" y="114" font-size="11.5" text-anchor="start" fill="#33b" font-weight="bold"><tspan x="806" dy="0.0">A₁</tspan></text><path d="M700 112 C500 130 350 160 290 240 C300 300 400 340 520 365" stroke="#c0392b" stroke-width="3" fill="none"/><path d="M750 118 C650 160 500 200 430 250 C440 320 560 370 700 392" stroke="#2b6cb0" stroke-width="3" fill="none"/><line x1="100" y1="400" x2="800" y2="400" stroke="#7a1f1f" stroke-width="1.3" stroke-dasharray="5 4"/><text x="806" y="404" font-size="10.5" text-anchor="start" fill="#7a1f1f" font-weight="bold"><tspan x="806" dy="0.0">Ms</tspan></text><line x1="100" y1="430" x2="800" y2="430" stroke="#7a1f1f" stroke-width="1.3" stroke-dasharray="5 4"/><text x="806" y="434" font-size="10.5" text-anchor="start" fill="#7a1f1f" font-weight="bold"><tspan x="806" dy="0.0">M50</tspan></text><line x1="100" y1="455" x2="800" y2="455" stroke="#7a1f1f" stroke-width="1.3" stroke-dasharray="5 4"/><text x="806" y="459" font-size="10.5" text-anchor="start" fill="#7a1f1f" font-weight="bold"><tspan x="806" dy="0.0">M90</tspan></text><path d="M110 70 C250 95 560 100 720 190 L 760 330" stroke="#2e7d32" stroke-width="3" fill="none"/><path d="M110 70 L 135 190 L 595 190 L 645 480" stroke="#00838f" stroke-width="3" fill="none"/><path d="M110 70 C240 100 430 170 520 300 L 545 480" stroke="#e67e22" stroke-width="3" fill="none"/><path d="M110 70 C230 95 350 200 410 300 L 440 480" stroke="#8e44ad" stroke-width="3" fill="none"/><path d="M110 70 C210 110 320 210 355 300 L 365 480" stroke="#6d4c41" stroke-width="3" fill="none"/><path d="M110 70 C200 130 265 210 288 240 C300 270 305 380 310 480" stroke="#c0392b" stroke-width="3" fill="none"/><path d="M110 70 C118 200 130 380 150 480" stroke="#1a237e" stroke-width="3" fill="none"/><circle cx="760" cy="346" r="11" fill="#2e7d32" stroke="none"/><text x="760" y="350.5" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold"><tspan x="760" dy="0.0">1</tspan></text><circle cx="644" cy="496" r="11" fill="#00838f" stroke="none"/><text x="644" y="500.5" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold"><tspan x="644" dy="0.0">2</tspan></text><circle cx="545" cy="496" r="11" fill="#e67e22" stroke="none"/><text x="545" y="500.5" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold"><tspan x="545" dy="0.0">3</tspan></text><circle cx="440" cy="496" r="11" fill="#8e44ad" stroke="none"/><text x="440" y="500.5" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold"><tspan x="440" dy="0.0">5</tspan></text><circle cx="365" cy="496" r="11" fill="#6d4c41" stroke="none"/><text x="365" y="500.5" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold"><tspan x="365" dy="0.0">4</tspan></text><circle cx="310" cy="496" r="11" fill="#c0392b" stroke="none"/><text x="310" y="500.5" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold"><tspan x="310" dy="0.0">7</tspan></text><circle cx="150" cy="496" r="11" fill="#1a237e" stroke="none"/><text x="150" y="500.5" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold"><tspan x="150" dy="0.0">6</tspan></text><path d="M110 70 L 165 335 L 558 335 L 588 480" stroke="#00695c" stroke-width="3" fill="none" stroke-dasharray="9 4"/><circle cx="588" cy="496" r="11" fill="#00695c" stroke="none"/><text x="588" y="500.5" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold"><tspan x="588" dy="0.0">8</tspan></text><text x="830" y="150" font-size="12.5" text-anchor="start" fill="#111" font-weight="bold"><tspan x="830" dy="0.0">Legend / result</tspan></text><circle cx="842" cy="175" r="11" fill="#2e7d32" stroke="none"/><text x="842" y="179.5" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold"><tspan x="842" dy="0.0">1</tspan></text><text x="860" y="179" font-size="10.5" text-anchor="start" fill="#111"><tspan x="860" dy="0.0">Very slow (annealing) →</tspan></text><text x="860" y="192" font-size="10.5" text-anchor="start" fill="#111"><tspan x="860" dy="0.0">coarse pearlite</tspan></text><circle cx="842" cy="215" r="11" fill="#00838f" stroke="none"/><text x="842" y="219.5" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold"><tspan x="842" dy="0.0">2</tspan></text><text x="860" y="219" font-size="10.5" text-anchor="start" fill="#111"><tspan x="860" dy="0.0">Isothermal annealing →</tspan></text><text x="860" y="232" font-size="10.5" text-anchor="start" fill="#111"><tspan x="860" dy="0.0">uniform pearlite</tspan></text><circle cx="842" cy="255" r="11" fill="#e67e22" stroke="none"/><text x="842" y="259.5" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold"><tspan x="842" dy="0.0">3</tspan></text><text x="860" y="259" font-size="10.5" text-anchor="start" fill="#111"><tspan x="860" dy="0.0">Normalizing → fine pearlite</tspan></text><circle cx="842" cy="295" r="11" fill="#6d4c41" stroke="none"/><text x="842" y="299.5" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold"><tspan x="842" dy="0.0">4</tspan></text><text x="860" y="299" font-size="10.5" text-anchor="start" fill="#111"><tspan x="860" dy="0.0">Oil quench → mostly</tspan></text><text x="860" y="312" font-size="10.5" text-anchor="start" fill="#111"><tspan x="860" dy="0.0">martensite + some</tspan></text><circle cx="842" cy="335" r="11" fill="#8e44ad" stroke="none"/><text x="842" y="339.5" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold"><tspan x="842" dy="0.0">5</tspan></text><text x="860" y="339" font-size="10.5" text-anchor="start" fill="#111"><tspan x="860" dy="0.0">Intermediate → mixed products</tspan></text><circle cx="842" cy="375" r="11" fill="#1a237e" stroke="none"/><text x="842" y="379.5" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold"><tspan x="842" dy="0.0">6</tspan></text><text x="860" y="379" font-size="10.5" text-anchor="start" fill="#111"><tspan x="860" dy="0.0">Hardening (rapid) →</tspan></text><text x="860" y="392" font-size="10.5" text-anchor="start" fill="#111"><tspan x="860" dy="0.0">martensite</tspan></text><circle cx="842" cy="415" r="11" fill="#c0392b" stroke="none"/><text x="842" y="419.5" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold"><tspan x="842" dy="0.0">7</tspan></text><text x="860" y="419" font-size="10.5" text-anchor="start" fill="#111"><tspan x="860" dy="0.0">Critical cooling rate → just</tspan></text><text x="860" y="432" font-size="10.5" text-anchor="start" fill="#111"><tspan x="860" dy="0.0">martensite</tspan></text><circle cx="842" cy="455" r="11" fill="#00695c" stroke="none"/><text x="842" y="459.5" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold"><tspan x="842" dy="0.0">8</tspan></text><text x="860" y="459" font-size="10.5" text-anchor="start" fill="#111"><tspan x="860" dy="0.0">Rapid to bainite T, hold →</tspan></text><text x="860" y="472" font-size="10.5" text-anchor="start" fill="#111"><tspan x="860" dy="0.0">100 % bainite</tspan></text><text x="40" y="600" font-size="12" text-anchor="start" fill="#111"><tspan x="40" dy="0.0">Rule: the cooling curve is read against the TTT curves – what it crosses (and where) sets pearlite / bainite / martensite fractions.</tspan></text><text x="40" y="620" font-size="12" text-anchor="start" fill="#111"><tspan x="40" dy="0.0">Critical cooling rate (7) = slowest path that just avoids the pearlite nose → fully martensitic. Oil-quench outcome depends on steel hardenability &amp; section size.</tspan></text><text x="40" y="640" font-size="11.5" text-anchor="start" fill="#111" font-style="italic"><tspan x="40" dy="0.0">Path numbers follow the lecture list; the drawn positions are conceptual.</tspan></text></svg>