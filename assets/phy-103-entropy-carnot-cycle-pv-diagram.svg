<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Carnot cycle on a P-V diagram</title>
<desc>Two isotherms and two adiabats with heat Q1 absorbed at T1 and heat Q2 rejected at T2.</desc>
<defs><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="my" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#777777"/></marker></defs>
<rect x="0" y="0" width="640" height="380" fill="#ffffff"/>
<text x="320" y="26" fill="#222222" font-size="16" text-anchor="middle" font-weight="bold">Carnot cycle on the P–V diagram</text>
<line x1="90" y1="340" x2="90" y2="40" stroke="#222222" stroke-width="2" marker-end="url(#mk)"/>
<line x1="90" y1="340" x2="560" y2="340" stroke="#222222" stroke-width="2" marker-end="url(#mk)"/>
<text x="76" y="48" fill="#222222" font-size="15" text-anchor="end" font-weight="bold">P</text>
<text x="568" y="345" fill="#222222" font-size="15" text-anchor="start" font-weight="bold">V</text>
<path d="M160,100 Q200,115 300,135 Q335,205 400,250 Q300,245 230,215 Q180,170 160,100 Z" fill="#1f5fbf" fill-opacity="0.1" stroke="#1f5fbf" stroke-width="0.01"/>
<path d="M160,100 Q200,115 300,135" fill="none" stroke="#c0392b" stroke-width="3" marker-end="url(#mr)"/>
<path d="M300,135 Q335,205 400,250" fill="none" stroke="#222222" stroke-width="3" marker-end="url(#mk)"/>
<path d="M400,250 Q300,245 230,215" fill="none" stroke="#1f5fbf" stroke-width="3" marker-end="url(#mb)"/>
<path d="M230,215 Q180,170 160,100" fill="none" stroke="#222222" stroke-width="3" marker-end="url(#mk)"/>
<circle cx="160" cy="100" r="4.5" fill="#222222" stroke="#222222" stroke-width="1.5"/>
<circle cx="300" cy="135" r="4.5" fill="#222222" stroke="#222222" stroke-width="1.5"/>
<circle cx="400" cy="250" r="4.5" fill="#222222" stroke="#222222" stroke-width="1.5"/>
<circle cx="230" cy="215" r="4.5" fill="#222222" stroke="#222222" stroke-width="1.5"/>
<text x="146" y="90" fill="#222222" font-size="16" text-anchor="end" font-weight="bold">1</text>
<text x="310" y="128" fill="#222222" font-size="16" text-anchor="start" font-weight="bold">2</text>
<text x="410" y="256" fill="#222222" font-size="16" text-anchor="start" font-weight="bold">3</text>
<text x="216" y="228" fill="#222222" font-size="16" text-anchor="end" font-weight="bold">4</text>
<line x1="215" y1="80" x2="215" y2="111" stroke="#c0392b" stroke-width="2.5" marker-end="url(#mr)"/>
<text x="215" y="68" fill="#c0392b" font-size="14" text-anchor="middle" font-weight="normal">Q₁ absorbed at T₁</text>
<line x1="307" y1="243" x2="307" y2="288" stroke="#1f5fbf" stroke-width="2.5" marker-end="url(#mb)"/>
<text x="307" y="308" fill="#1f5fbf" font-size="14" text-anchor="middle" font-weight="normal">Q₂ rejected at T₂</text>
<text x="335" y="108" fill="#c0392b" font-size="14" text-anchor="start" font-weight="normal">1→2 isothermal (T₁)</text>
<text x="375" y="172" fill="#222222" font-size="14" text-anchor="start" font-weight="normal">2→3 adiabatic</text>
<text x="425" y="275" fill="#1f5fbf" font-size="14" text-anchor="start" font-weight="normal">3→4 isothermal (T₂)</text>
<text x="97" y="255" fill="#222222" font-size="14" text-anchor="start" font-weight="normal">4→1 adiabatic</text>
<text x="262" y="182" fill="#222222" font-size="14" text-anchor="middle" font-weight="bold">W = Q₁ − Q₂</text>
</svg>
