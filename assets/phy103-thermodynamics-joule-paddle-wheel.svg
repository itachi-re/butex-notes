<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="Helvetica,Arial,sans-serif">
  <rect width="560" height="420" fill="#ffffff"/>
  <text x="280" y="26" text-anchor="middle" font-size="17" font-weight="bold">Joule's Paddle-Wheel Experiment</text>

  <!-- pulley support -->
  <rect x="240" y="40" width="80" height="12" fill="#555"/>
  <circle cx="280" cy="70" r="16" fill="none" stroke="#333" stroke-width="3"/>
  <line x1="280" y1="52" x2="280" y2="86" stroke="#333" stroke-width="0" />

  <!-- string over pulley to falling mass -->
  <line x1="264" y1="70" x2="150" y2="70" stroke="#333" stroke-width="1.5"/>
  <line x1="150" y1="70" x2="150" y2="160" stroke="#333" stroke-width="1.5"/>
  <rect x="130" y="160" width="40" height="40" fill="#8e6b4b" stroke="#333"/>
  <text x="150" y="185" text-anchor="middle" font-size="11" fill="#fff">m</text>
  <text x="80" y="180" font-size="12">Falling mass</text>
  <text x="80" y="195" font-size="12">(mgh = work input)</text>

  <!-- string to paddle shaft -->
  <line x1="296" y1="70" x2="296" y2="150" stroke="#333" stroke-width="1.5"/>

  <!-- insulated water container -->
  <rect x="220" y="150" width="180" height="200" rx="8" fill="#eaf4ff" stroke="#2255aa" stroke-width="2"/>
  <text x="310" y="145" text-anchor="middle" font-size="12" fill="#333">Thermally insulated container (water)</text>

  <!-- paddle wheel -->
  <line x1="310" y1="180" x2="310" y2="320" stroke="#555" stroke-width="4"/>
  <g transform="translate(310,250)">
    <line x1="-40" y1="0" x2="40" y2="0" stroke="#555" stroke-width="6"/>
    <line x1="0" y1="-40" x2="0" y2="40" stroke="#555" stroke-width="6"/>
    <line x1="-28" y1="-28" x2="28" y2="28" stroke="#555" stroke-width="6"/>
    <line x1="-28" y1="28" x2="28" y2="-28" stroke="#555" stroke-width="6"/>
  </g>

  <!-- thermometer -->
  <rect x="380" y="170" width="10" height="90" rx="5" fill="#fff" stroke="#333"/>
  <circle cx="385" cy="270" r="10" fill="#c0392b"/>
  <rect x="382" y="200" width="6" height="65" fill="#c0392b"/>
  <text x="400" y="210" font-size="11">Thermometer</text>
  <text x="400" y="224" font-size="11">(ΔT measured)</text>

  <text x="60" y="380" font-size="12" fill="#333">Work done by the falling mass (W = mgh) rotates the paddle, stirring the water.</text>
  <text x="60" y="398" font-size="12" fill="#333">The resulting temperature rise ΔT gives the heat Q = m_w c_w ΔT, so J = W / Q.</text>
</svg>
