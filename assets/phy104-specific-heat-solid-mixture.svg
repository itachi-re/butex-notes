<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="700" height="400" fill="#ffffff"/>
  <text x="350" y="26" font-size="18" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Method of Mixtures — Calorimeter Setup</text>

  <!-- Solid heater (boiling water bath with test solid suspended) -->
  <rect x="70" y="90" width="140" height="110" rx="6" fill="#eef4fb" stroke="#2b6cb0" stroke-width="2"/>
  <text x="140" y="82" font-size="12" text-anchor="middle" fill="#2b6cb0">Boiling-water heater</text>
  <line x1="140" y1="100" x2="140" y2="170" stroke="#555" stroke-width="2"/>
  <rect x="120" y="165" width="40" height="25" fill="#c9a876" stroke="#7a5c2e" stroke-width="1.5"/>
  <text x="140" y="212" font-size="11" text-anchor="middle" fill="#333">Test solid, mass m,</text>
  <text x="140" y="225" font-size="11" text-anchor="middle" fill="#333">on thread, at θ₁</text>
  <path d="M75 190 q65 25 130 0" fill="none" stroke="#e67e22" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="140" y="245" font-size="10" text-anchor="middle" fill="#e67e22">boiling</text>

  <!-- Arrow of transfer -->
  <line x1="215" y1="150" x2="330" y2="150" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="270" y="140" font-size="11" text-anchor="middle" fill="#333">quick transfer</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>

  <!-- Calorimeter (double walled) -->
  <rect x="340" y="120" width="160" height="150" rx="4" fill="#f5f5f5" stroke="#555" stroke-width="2"/>
  <rect x="355" y="135" width="130" height="120" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.5"/>
  <rect x="368" y="150" width="104" height="95" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="420" y="112" font-size="12" text-anchor="middle" fill="#333">Copper calorimeter + water (mass mw)</text>
  <text x="420" y="290" font-size="11" text-anchor="middle" fill="#333">insulated in a wooden jacket</text>

  <!-- Stirrer -->
  <line x1="450" y1="130" x2="450" y2="240" stroke="#7a5c2e" stroke-width="3"/>
  <text x="470" y="135" font-size="10" fill="#333">stirrer</text>

  <!-- Thermometer -->
  <line x1="395" y1="130" x2="395" y2="80" stroke="#c0392b" stroke-width="3"/>
  <circle cx="395" cy="75" r="7" fill="#c0392b"/>
  <text x="395" y="65" font-size="11" text-anchor="middle" fill="#c0392b">Thermometer (0.1 °C)</text>

  <!-- Wooden lid -->
  <rect x="345" y="115" width="150" height="10" fill="#a67c00"/>
  <text x="580" y="200" font-size="11" text-anchor="middle" fill="#555">Non-conducting</text>
  <text x="580" y="215" font-size="11" text-anchor="middle" fill="#555">lid with holes</text>
</svg>
