<svg viewBox="0 0 480 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="480" height="340" fill="#ffffff"/>
<line x1="60" y1="290" x2="440" y2="290" stroke="#000" stroke-width="1.5"/>
<line x1="60" y1="290" x2="60" y2="40" stroke="#000" stroke-width="1.5"/>
<text x="440" y="310" font-size="14" text-anchor="end">V</text>
<text x="30" y="160" font-size="14" transform="rotate(-90 30 160)">P</text>
<!-- A->B isothermal expansion at T1 -->
<path d="M110,70 C 180,85 260,110 320,140" stroke="#c00000" stroke-width="2" fill="none"/>
<text x="150" y="65" font-size="12" fill="#c00000">A</text>
<text x="325" y="140" font-size="12" fill="#c00000">B</text>
<text x="200" y="95" font-size="12" fill="#c00000">isothermal exp. (T&#8321;)</text>
<!-- B->C adiabatic expansion -->
<path d="M320,140 C 370,170 400,210 415,260" stroke="#0a7d29" stroke-width="2" fill="none"/>
<text x="420" y="265" font-size="12" fill="#0a7d29">C</text>
<text x="345" y="205" font-size="12" fill="#0a7d29">adiabatic exp.</text>
<!-- C->D isothermal compression at T2 -->
<path d="M415,260 C 350,275 230,278 160,270" stroke="#1a5fb4" stroke-width="2" fill="none"/>
<text x="150" y="275" font-size="12" fill="#1a5fb4">D</text>
<text x="230" y="290" font-size="12" fill="#1a5fb4">isothermal comp. (T&#8322;)</text>
<!-- D->A adiabatic compression -->
<path d="M160,270 C 130,220 110,150 110,70" stroke="#7a1aa3" stroke-width="2" fill="none"/>
<text x="90" y="180" font-size="12" fill="#7a1aa3" transform="rotate(-80 90 180)">adiabatic comp.</text>
<text x="240" y="20" font-size="16" text-anchor="middle" font-weight="bold">Carnot Cycle — P-V Diagram</text>
<text x="240" y="325" font-size="12" text-anchor="middle">Enclosed area = net work done = Q&#8321; - Q&#8322;; &#951; = 1 - T&#8322;/T&#8321;</text>
</svg>
