<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" font-family="DejaVu Sans, Verdana, Arial, sans-serif" role="img" aria-label="Galvanizing (Zn) versus tinning (Sn): what happens at a scratch"><title>Galvanizing (Zn) versus tinning (Sn): what happens at a scratch</title><defs><marker id="me65100" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#e65100"/></marker></defs><rect width="980" height="470" fill="#ffffff"/><text x="490.0" y="28.0" font-size="17" text-anchor="middle" fill="#222" font-weight="bold">Galvanizing (Zn) versus tinning (Sn): what happens at a scratch</text><text x="490.0" y="46.0" font-size="12" text-anchor="middle" fill="#555" font-weight="normal">zinc is more active than iron; tin is more noble than iron</text><text x="250.0" y="75.0" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">GALVANIZING</text><rect x="30.0" y="270.0" width="440.0" height="60.0" rx="0" fill="#78909c" stroke="#263238" stroke-width="2"/><text x="50.0" y="305.0" font-size="12" text-anchor="start" fill="#fff" font-weight="bold">steel (Fe)</text><rect x="30.0" y="240.0" width="190.0" height="30.0" rx="0" fill="#90a4ae" stroke="#263238" stroke-width="1.5"/><rect x="280.0" y="240.0" width="190.0" height="30.0" rx="0" fill="#90a4ae" stroke="#263238" stroke-width="1.5"/><text x="125.0" y="260.0" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">Zn coating</text><text x="375.0" y="260.0" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">Zn coating</text><path d="M140,240 C150,150 360,150 370,240 Z" fill="#bbdefb" fill-opacity="0.8" stroke="#1565c0" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="255.0" y="190.0" font-size="12" text-anchor="middle" fill="#0d47a1" font-weight="normal">water + O₂ + CO₂</text><text x="250.0" y="238.0" font-size="11" text-anchor="middle" fill="#b71c1c" font-weight="normal">scratch</text><text x="130.0" y="215.0" font-size="12" text-anchor="middle" fill="#b71c1c" font-weight="bold">Zn → Zn²⁺ + 2e⁻</text><line x1="180.0" y1="255.0" x2="235.0" y2="285.0" stroke="#e65100" stroke-width="2.5" marker-end="url(#me65100)" stroke-linecap="round"/><text x="245.0" y="310.0" font-size="11" text-anchor="start" fill="#1b5e20" font-weight="bold">O₂ + 2H₂O + 4e⁻ → 4OH⁻</text><text x="250.0" y="340.0" font-size="11" text-anchor="middle" fill="#1b5e20" font-weight="normal">on the exposed steel (cathode)</text><text x="250.0" y="365.0" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">E° (Zn²⁺/Zn) = −0.76 V</text><text x="50.0" y="395.0" font-size="12.5" text-anchor="start" fill="#222" font-weight="normal">Zn is anodic → corrodes (sacrificial);</text><text x="50.0" y="415.0" font-size="12.5" text-anchor="start" fill="#222" font-weight="normal">Fe is cathodic → protected even when scratched</text><text x="740.0" y="75.0" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">TINNING</text><rect x="520.0" y="270.0" width="440.0" height="60.0" rx="0" fill="#78909c" stroke="#263238" stroke-width="2"/><text x="540.0" y="305.0" font-size="12" text-anchor="start" fill="#fff" font-weight="bold">steel (Fe)</text><rect x="520.0" y="240.0" width="190.0" height="30.0" rx="0" fill="#e0e0e0" stroke="#263238" stroke-width="1.5"/><rect x="770.0" y="240.0" width="190.0" height="30.0" rx="0" fill="#e0e0e0" stroke="#263238" stroke-width="1.5"/><text x="615.0" y="260.0" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">Sn coating</text><text x="865.0" y="260.0" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">Sn coating</text><path d="M630,240 C640,150 850,150 860,240 Z" fill="#bbdefb" fill-opacity="0.8" stroke="#1565c0" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="745.0" y="190.0" font-size="12" text-anchor="middle" fill="#0d47a1" font-weight="normal">water + O₂ + CO₂</text><text x="740.0" y="238.0" font-size="11" text-anchor="middle" fill="#b71c1c" font-weight="normal">scratch</text><path d="M720,270 C725,292 765,292 770,270 Z" fill="#37474f" stroke="#1c2833" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="745.0" y="218.0" font-size="12" text-anchor="middle" fill="#b71c1c" font-weight="bold">Fe → Fe²⁺ + 2e⁻</text><line x1="725.0" y1="288.0" x2="660.0" y2="262.0" stroke="#e65100" stroke-width="2.5" marker-end="url(#me65100)" stroke-linecap="round"/><text x="580.0" y="225.0" font-size="11" text-anchor="start" fill="#1b5e20" font-weight="bold">O₂ reduced</text><text x="580.0" y="238.0" font-size="11" text-anchor="start" fill="#1b5e20" font-weight="normal">at Sn (cathode)</text><text x="740.0" y="365.0" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">E° (Sn²⁺/Sn) = −0.14 V</text><text x="540.0" y="395.0" font-size="12.5" text-anchor="start" fill="#222" font-weight="normal">Fe is anodic → pits at the scratch;</text><text x="540.0" y="415.0" font-size="12.5" text-anchor="start" fill="#222" font-weight="normal">Sn only protects while the coat is intact</text></svg>