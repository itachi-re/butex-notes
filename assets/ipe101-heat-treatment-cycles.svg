<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="440" viewBox="0 0 1020 440" font-family="DejaVu Sans, Verdana, Arial, sans-serif" role="img" aria-label="Heat-treatment cycles: temperature – time"><title>Heat-treatment cycles: temperature – time</title><defs><marker id="m222" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#222"/></marker></defs><rect width="1020" height="440" fill="#ffffff"/><text x="510.0" y="28.0" font-size="17" text-anchor="middle" fill="#222" font-weight="bold">Heat-treatment cycles: temperature – time</text><text x="510.0" y="46.0" font-size="12" text-anchor="middle" fill="#555" font-weight="normal">heat → soak → cool; the cooling rate decides the structure</text><line x1="80.0" y1="380.0" x2="80.0" y2="70.0" stroke="#222" stroke-width="2" marker-end="url(#m222)" stroke-linecap="round"/><line x1="70.0" y1="370.0" x2="560.0" y2="370.0" stroke="#222" stroke-width="2" marker-end="url(#m222)" stroke-linecap="round"/><text x="80.0" y="60.0" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">T (°C)</text><text x="560.0" y="395.0" font-size="12" text-anchor="end" fill="#222" font-weight="bold">time</text><line x1="80.0" y1="170.0" x2="560.0" y2="170.0" stroke="#e65100" stroke-width="1.5" stroke-dasharray="6 3" stroke-linecap="round"/><text x="566.0" y="174.0" font-size="11" text-anchor="start" fill="#e65100" font-weight="normal">A₃ / A₁</text><rect x="150.0" y="118.0" width="150.0" height="20.0" rx="0" fill="#ffe082" fill-opacity="0.6" stroke="none" stroke-width="0"/><text x="225.0" y="112.0" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">austenitising: 30–50 °C above A₃</text><path d="M80,370 L150,128 L300,128" fill="none" stroke="#222" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M300,128 C340,140 400,250 520,340" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M300,128 C320,160 345,240 385,325" fill="none" stroke="#ef6c00" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M300,128 L318,350" fill="none" stroke="#6a4c93" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="420.0" y="235.0" font-size="12" text-anchor="start" fill="#2e7d32" font-weight="bold">full annealing</text><text x="420.0" y="251.0" font-size="11" text-anchor="start" fill="#2e7d32" font-weight="normal">(furnace cooling)</text><text x="355.0" y="305.0" font-size="12" text-anchor="start" fill="#ef6c00" font-weight="bold">normalising</text><text x="355.0" y="320.0" font-size="11" text-anchor="start" fill="#ef6c00" font-weight="normal">(still air)</text><text x="282.0" y="360.0" font-size="12" text-anchor="end" fill="#6a4c93" font-weight="bold">quench</text><text x="190.0" y="105.0" font-size="10" text-anchor="start" fill="#222" font-weight="normal"></text><line x1="640.0" y1="380.0" x2="640.0" y2="70.0" stroke="#222" stroke-width="2" marker-end="url(#m222)" stroke-linecap="round"/><line x1="630.0" y1="370.0" x2="980.0" y2="370.0" stroke="#222" stroke-width="2" marker-end="url(#m222)" stroke-linecap="round"/><text x="640.0" y="60.0" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">T (°C)</text><text x="980.0" y="395.0" font-size="12" text-anchor="end" fill="#222" font-weight="bold">time</text><path d="M640,370 L700,130 L760,130 L775,350 L810,350" fill="none" stroke="#6a4c93" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><text x="730.0" y="118.0" font-size="11" text-anchor="middle" fill="#6a4c93" font-weight="normal">harden + quench</text><path d="M810,350 L850,250 L920,250 C940,280 955,320 965,350" fill="none" stroke="#c1121f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="886.0" y="238.0" font-size="12" text-anchor="middle" fill="#c1121f" font-weight="bold">tempering</text><text x="886.0" y="224.0" font-size="11" text-anchor="middle" fill="#c1121f" font-weight="normal">150–650 °C, below A₁</text><text x="805.0" y="160.0" font-size="11" text-anchor="start" fill="#6a4c93" font-weight="normal">martensite</text><text x="805.0" y="175.0" font-size="11" text-anchor="start" fill="#6a4c93" font-weight="normal">(hard, brittle)</text><text x="895.0" y="335.0" font-size="11" text-anchor="start" fill="#c1121f" font-weight="normal">tempered</text><text x="895.0" y="350.0" font-size="11" text-anchor="start" fill="#c1121f" font-weight="normal">martensite</text></svg>