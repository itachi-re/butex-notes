<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360">
<title>Starch vs cellulose comparison</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker><marker id="arrowAccent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a13a2e"/></marker><marker id="arrowAccent2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5a8a"/></marker><marker id="halfArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,2 L10,5 L0,8 z" fill="#1a1a1a"/></marker></defs>
<rect x="0" y="0" width="860" height="360" fill="white"/>
<text x="430.0" y="26.0" font-family="DejaVu Sans" font-size="19" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">Starch vs Cellulose</text>
<rect x="30.0" y="72.0" width="810.0" height="230.0" rx="0" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="30.0" y1="118.0" x2="840.0" y2="118.0" stroke="#1a1a1a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="200.0" y1="72.0" x2="200.0" y2="302.0" stroke="#666666" stroke-width="1.0" stroke-linecap="round"/>
<line x1="520.0" y1="72.0" x2="520.0" y2="302.0" stroke="#666666" stroke-width="1.0" stroke-linecap="round"/>
<line x1="30.0" y1="118.0" x2="840.0" y2="118.0" stroke="#666666" stroke-width="1.0" stroke-linecap="round"/>
<line x1="30.0" y1="164.0" x2="840.0" y2="164.0" stroke="#666666" stroke-width="1.0" stroke-linecap="round"/>
<line x1="30.0" y1="210.0" x2="840.0" y2="210.0" stroke="#666666" stroke-width="1.0" stroke-linecap="round"/>
<line x1="30.0" y1="256.0" x2="840.0" y2="256.0" stroke="#666666" stroke-width="1.0" stroke-linecap="round"/>
<text x="115.0" y="100.0" font-family="DejaVu Sans" font-size="13.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle"></text>
<text x="360.0" y="100.0" font-family="DejaVu Sans" font-size="13.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">Starch</text>
<text x="680.0" y="100.0" font-family="DejaVu Sans" font-size="13.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">Cellulose</text>
<text x="115.0" y="146.0" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">Linkage</text>
<text x="360.0" y="138.2" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">α-1,4 (amylose) + α-1,6</text>
<text x="360.0" y="153.9" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">branches (amylopectin)</text>
<text x="680.0" y="146.0" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">β-1,4 only</text>
<text x="115.0" y="192.0" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">Shape</text>
<text x="360.0" y="184.2" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">Helical coil (amylose);</text>
<text x="360.0" y="199.9" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">branched (amylopectin)</text>
<text x="680.0" y="184.2" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">Long, straight,</text>
<text x="680.0" y="199.9" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">linear chains</text>
<text x="115.0" y="238.0" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">H-bonding</text>
<text x="360.0" y="230.2" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">Mostly intramolecular</text>
<text x="360.0" y="245.9" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">(within the helix)</text>
<text x="680.0" y="230.2" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">Extensive intermolecular</text>
<text x="680.0" y="245.9" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">(between chains) → fibres</text>
<text x="115.0" y="284.0" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">Digestible by humans?</text>
<text x="360.0" y="284.0" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">Yes (α-amylase)</text>
<text x="680.0" y="284.0" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">No (no β-glucosidase/cellulase)</text>
<text x="430.0" y="324.5" font-family="DejaVu Sans" font-size="11.5" font-weight="normal" font-style="italic" fill="#666666" text-anchor="middle">Same monomer (D-glucose), same overall formula (C₆H₁₀O₅)ₙ — the α vs β linkage alone changes helix vs straight-chain packing and,</text>
<text x="430.0" y="340.0" font-family="DejaVu Sans" font-size="11.5" font-weight="normal" font-style="italic" fill="#666666" text-anchor="middle">with it, digestibility and mechanical role.</text>
</svg>
