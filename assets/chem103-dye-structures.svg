<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .lbl{font-size:13.5px;fill:#1a1a1a;}
    .small{font-size:11.5px;fill:#333;}
    .box{fill:#f5f8fc;stroke:#33475b;stroke-width:1.5;}
  </style>

  <text x="450" y="24" text-anchor="middle" font-size="17" font-weight="bold">Three Representative Dyes (condensed structures)</text>

  <rect class="box" x="20" y="50" width="260" height="90" rx="6"/>
  <text x="150" y="75" text-anchor="middle" font-weight="bold" class="lbl">Methyl Orange (azo dye)</text>
  <text x="150" y="98" text-anchor="middle" class="small">(CH3)2N-C6H4-N=N-C6H4-SO3Na</text>
  <text x="150" y="118" text-anchor="middle" class="small">chromophore: -N=N-</text>
  <text x="150" y="133" text-anchor="middle" class="small">auxochrome: -N(CH3)2 / -SO3Na</text>

  <rect class="box" x="320" y="50" width="260" height="90" rx="6"/>
  <text x="450" y="75" text-anchor="middle" font-weight="bold" class="lbl">Malachite Green (triphenylmethane)</text>
  <text x="450" y="98" text-anchor="middle" class="small">[(CH3)2N-C6H4]2C=C6H4=N+(CH3)2</text>
  <text x="450" y="118" text-anchor="middle" class="small">chromophore: central C=C6H4=N+ system</text>
  <text x="450" y="133" text-anchor="middle" class="small">auxochrome: -N(CH3)2 groups</text>

  <rect class="box" x="620" y="50" width="260" height="90" rx="6"/>
  <text x="750" y="75" text-anchor="middle" font-weight="bold" class="lbl">Alizarin (anthraquinone)</text>
  <text x="750" y="98" text-anchor="middle" class="small">1,2-dihydroxyanthraquinone</text>
  <text x="750" y="118" text-anchor="middle" class="small">chromophore: quinonoid C=O</text>
  <text x="750" y="133" text-anchor="middle" class="small">auxochrome: -OH (mordant dye with Al/Cr)</text>

  <rect class="box" x="150" y="165" width="600" height="60" rx="6"/>
  <text x="450" y="188" text-anchor="middle" class="small" font-weight="bold">Indigo (indigoid dye, vat dye) — for reference:</text>
  <text x="450" y="208" text-anchor="middle" class="small">bis-indole structure with two C=O / C=C chromophoric units; applied by vat (leuco-reduction) method</text>

  <text x="450" y="260" text-anchor="middle" class="small" font-style="italic">Chromophore = colour-producing unsaturated group (-N=N-, C=O, C=C).</text>
  <text x="450" y="280" text-anchor="middle" class="small" font-style="italic">Auxochrome = salt-forming/solubilising group (-NH2, -OH, -SO3H) that deepens/intensifies colour and aids fibre affinity.</text>
</svg>
