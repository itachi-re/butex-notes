<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow01" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="380" fill="#ffffff"/>

  <!-- Panel A: ordered, gas confined to left half -->
  <g>
    <rect x="40" y="60" width="220" height="160" fill="none" stroke="#222222" stroke-width="2.5"/>
    <line x1="150" y1="60" x2="150" y2="220" stroke="#555555" stroke-width="2" stroke-dasharray="6,4"/>
    <!-- gas molecules packed on left -->
    <g fill="#2166ac">
      <circle cx="60" cy="80" r="4.5"/><circle cx="75" cy="100" r="4.5"/><circle cx="55" cy="120" r="4.5"/>
      <circle cx="90" cy="75" r="4.5"/><circle cx="100" cy="130" r="4.5"/><circle cx="65" cy="150" r="4.5"/>
      <circle cx="120" cy="90" r="4.5"/><circle cx="130" cy="160" r="4.5"/><circle cx="80" cy="180" r="4.5"/>
      <circle cx="110" cy="200" r="4.5"/><circle cx="45" cy="190" r="4.5"/><circle cx="135" cy="115" r="4.5"/>
      <circle cx="95" cy="105" r="4.5"/><circle cx="70" cy="65" r="4.5"/><circle cx="140" cy="70" r="4.5"/>
    </g>
    <text x="205" y="145" text-anchor="middle" font-size="13" fill="#999999" font-style="italic">vacuum</text>
    <text x="150" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#222222">State A</text>
    <text x="150" y="262" text-anchor="middle" font-size="12" fill="#333333">Ordered — one microstate arrangement</text>
    <text x="150" y="278" text-anchor="middle" font-size="12" fill="#333333">(lower entropy, S₁)</text>
  </g>

  <!-- Arrow -->
  <line x1="280" y1="140" x2="360" y2="140" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow01)"/>
  <text x="320" y="125" text-anchor="middle" font-size="12" fill="#333333">free expansion</text>
  <text x="320" y="160" text-anchor="middle" font-size="11" fill="#777777">(divider removed)</text>

  <!-- Panel B: disordered, gas fills whole container -->
  <g>
    <rect x="380" y="60" width="280" height="160" fill="none" stroke="#222222" stroke-width="2.5"/>
    <g fill="#b2182b">
      <circle cx="405" cy="80" r="4.5"/><circle cx="430" cy="110" r="4.5"/><circle cx="460" cy="75" r="4.5"/>
      <circle cx="480" cy="130" r="4.5"/><circle cx="500" cy="95" r="4.5"/><circle cx="520" cy="150" r="4.5"/>
      <circle cx="545" cy="80" r="4.5"/><circle cx="565" cy="120" r="4.5"/><circle cx="590" cy="90" r="4.5"/>
      <circle cx="615" cy="140" r="4.5"/><circle cx="635" cy="100" r="4.5"/><circle cx="410" cy="190" r="4.5"/>
      <circle cx="445" cy="200" r="4.5"/><circle cx="475" cy="175" r="4.5"/><circle cx="510" cy="195" r="4.5"/>
      <circle cx="540" cy="180" r="4.5"/><circle cx="575" cy="200" r="4.5"/><circle cx="605" cy="185" r="4.5"/>
      <circle cx="630" cy="200" r="4.5"/><circle cx="395" cy="140" r="4.5"/>
    </g>
    <text x="520" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#222222">State B</text>
    <text x="520" y="262" text-anchor="middle" font-size="12" fill="#333333">Disordered — molecules fill full volume</text>
    <text x="520" y="278" text-anchor="middle" font-size="12" fill="#333333">(higher entropy, S₂ &gt; S₁)</text>
  </g>

  <text x="350" y="330" text-anchor="middle" font-size="13" fill="#222222">Many more disordered arrangements (macrostate B) are possible than the single ordered one (A)</text>
  <text x="350" y="350" text-anchor="middle" font-size="13" fill="#222222">— this is why the gas spontaneously spreads out and never spontaneously re-orders.</text>
</svg>
