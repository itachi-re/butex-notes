<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" font-family="Georgia, serif" font-size="15" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="780" height="300" fill="#fff"/>
<text x="20" y="28" font-size="18" font-weight="bold">Hydrazinolysis (Akabori method) — identifies the C-terminal residue</text>

<text x="30" y="65">Peptide (all internal peptide bonds)  +  excess NH2–NH2 (anhydrous hydrazine), heat</text>
<text x="30" y="90" font-weight="bold">↓</text>
<text x="30" y="115">Every residue EXCEPT the C-terminal one is converted to an amino-acid hydrazide</text>
<text x="30" y="137">(–CO–NH–NH2), because hydrazine aminolyses every internal peptide (amide) bond.</text>
<text x="30" y="159" font-weight="bold">↓</text>
<text x="30" y="184">The C-terminal residue alone is released as the FREE amino acid (its –COOH has</text>
<text x="30" y="206">no peptide bond on the carboxyl side, so it is never converted to a hydrazide).</text>

<text x="20" y="245" font-size="14" fill="#555">Detection: separate the mixture (e.g. by chromatography) — the one species present</text>
<text x="20" y="267" font-size="14" fill="#555">as the free amino acid (not as a hydrazide) identifies the C-terminal residue.</text>
<text x="20" y="289" font-size="14" fill="#555">(Alternative modern method: carboxypeptidase enzymatic digestion from the C-terminus.)</text>
</svg>
