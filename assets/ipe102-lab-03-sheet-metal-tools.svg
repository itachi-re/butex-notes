<svg viewBox="0 0 820 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
<style>.lbl{font-size:13px;fill:#222} .t{font-size:18px;font-weight:bold;fill:#111}</style>
<rect width="820" height="300" fill="#fff"/>
<text x="410" y="26" text-anchor="middle" class="t">Common Sheet Metal Hand Tools</text>

<!-- Snips -->
<g transform="translate(30,60)">
<path d="M0,0 L60,30 L0,40 Z" fill="#999" stroke="#333"/>
<path d="M0,60 L60,30 L0,50 Z" fill="#bbb" stroke="#333"/>
<circle cx="10" cy="30" r="4" fill="#333"/>
<text x="20" y="90" text-anchor="middle" class="lbl">Tin/Hand Snips</text>
</g>

<!-- Steel rule + scriber -->
<g transform="translate(160,70)">
<rect x="0" y="0" width="140" height="14" fill="#ccc" stroke="#333"/>
<text x="70" y="35" text-anchor="middle" class="lbl">Steel Rule</text>
</g>
<g transform="translate(160,110)">
<line x1="0" y1="6" x2="120" y2="6" stroke="#333" stroke-width="3"/>
<text x="60" y="30" text-anchor="middle" class="lbl">Scriber</text>
</g>

<!-- Mallet -->
<g transform="translate(340,55)">
<rect x="15" y="0" width="10" height="50" fill="#8a5a2b"/>
<rect x="0" y="45" width="40" height="18" fill="#a3723d"/>
<text x="20" y="90" text-anchor="middle" class="lbl">Rawhide Mallet</text>
</g>

<!-- Stakes/anvil -->
<g transform="translate(430,55)">
<rect x="0" y="40" width="60" height="14" fill="#888"/>
<path d="M0,40 Q30,-10 60,40 Z" fill="#999" stroke="#333"/>
<text x="30" y="90" text-anchor="middle" class="lbl">Bench / Beak Stake</text>
</g>

<!-- Hand groover / folding bar -->
<g transform="translate(550,55)">
<rect x="0" y="20" width="120" height="10" fill="#777"/>
<text x="60" y="60" text-anchor="middle" class="lbl">Folding / Bending Bar</text>
</g>

<!-- punch and rivet set -->
<g transform="translate(700,55)">
<rect x="20" y="0" width="10" height="35" fill="#666"/>
<polygon points="20,35 30,35 25,50" fill="#666"/>
<text x="25" y="70" text-anchor="middle" class="lbl">Punch</text>
</g>

<!-- centre punch/hammer combo row 2 -->
<g transform="translate(30,180)">
<rect x="0" y="10" width="10" height="50" fill="#8a5a2b"/>
<rect x="-15" y="0" width="40" height="16" fill="#555"/>
<text x="5" y="85" text-anchor="middle" class="lbl">Ball-peen Hammer</text>
</g>

<!-- Divider -->
<g transform="translate(160,180)">
<line x1="0" y1="0" x2="25" y2="60" stroke="#333" stroke-width="3"/>
<line x1="50" y1="0" x2="25" y2="60" stroke="#333" stroke-width="3"/>
<circle cx="25" cy="0" r="4" fill="#333"/>
<text x="25" y="85" text-anchor="middle" class="lbl">Divider</text>
</g>

<!-- Try square -->
<g transform="translate(280,175)">
<rect x="0" y="0" width="8" height="55" fill="#444"/>
<rect x="0" y="0" width="55" height="8" fill="#444"/>
<text x="25" y="80" text-anchor="middle" class="lbl">Try Square</text>
</g>

<!-- Center punch -->
<g transform="translate(400,180)">
<rect x="0" y="0" width="10" height="35" fill="#777"/>
<polygon points="0,35 10,35 5,52" fill="#777"/>
<text x="5" y="70" text-anchor="middle" class="lbl">Centre Punch</text>
</g>

<!-- Chisel -->
<g transform="translate(500,195)">
<rect x="0" y="10" width="70" height="8" fill="#8a5a2b"/>
<polygon points="70,6 88,14 70,22" fill="#999"/>
<text x="40" y="45" text-anchor="middle" class="lbl">Cold Chisel</text>
</g>

<!-- Rivet set -->
<g transform="translate(650,180)">
<rect x="10" y="0" width="10" height="40" fill="#777"/>
<circle cx="15" cy="44" r="7" fill="#777"/>
<text x="15" y="75" text-anchor="middle" class="lbl">Rivet Set</text>
</g>
</svg>
