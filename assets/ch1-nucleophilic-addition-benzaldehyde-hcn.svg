<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Nucleophilic addition of HCN to benzaldehyde</title><desc>Benzaldehyde plus HCN gives the cyanohydrin mandelonitrile; the benzene ring is not attacked.</desc><defs><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c0392b"/></marker><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#24292f"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0969da"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1a7f37"/></marker><marker id="mgy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#57606a"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#bc4c00"/></marker></defs><rect width="960" height="380" fill="#ffffff"/><text x="30.0" y="36.0" font-size="16" text-anchor="start" fill="#57606a" font-weight="bold" xml:space="preserve"><tspan>Nucleophilic addition of HCN to an aromatic aldehyde (benzaldehyde → mandelonitrile)</tspan></text><polygon points="254.1,228.5 226.4,244.5 198.7,228.5 198.7,196.5 226.4,180.5 254.1,196.5" fill="none" stroke="#24292f" stroke-width="2.4" stroke-linejoin="round"/><circle cx="226.38865359942474" cy="212.5" r="19.2" fill="none" stroke="#24292f" stroke-width="2"/><text x="300.0" y="178.4" font-size="24" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>C</tspan></text><line x1="303.6" y1="156.0" x2="303.6" y2="116.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><line x1="296.4" y1="156.0" x2="296.4" y2="116.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="300.0" y="110.0" font-size="24" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>O</tspan></text><line x1="311.3" y1="176.5" x2="345.9" y2="196.5" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="349.9" y="206.5" font-size="24" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>H</tspan></text><line x1="288.7" y1="176.5" x2="254.1" y2="196.5" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="330.0" y="156.0" font-size="14" text-anchor="start" fill="#c0392b" font-weight="bold" xml:space="preserve"><tspan>δ+</tspan></text><text x="280.0" y="100.0" font-size="14" text-anchor="end" fill="#c0392b" font-weight="bold" xml:space="preserve"><tspan>δ−</tspan></text><text x="270.0" y="280.0" font-size="14" text-anchor="middle" fill="#57606a" font-weight="normal" xml:space="preserve"><tspan>benzaldehyde</tspan></text><text x="195.0" y="142.0" font-size="10" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"></text><line x1="430.0" y1="170.0" x2="540.0" y2="170.0" stroke="#24292f" stroke-width="2.8" stroke-linecap="round" marker-end="url(#mk)"/><text x="485.0" y="158.0" font-size="15" text-anchor="middle" fill="#bc4c00" font-weight="bold" xml:space="preserve"><tspan>HCN</tspan></text><text x="485.0" y="193.0" font-size="15" text-anchor="middle" fill="#bc4c00" font-weight="normal" xml:space="preserve"><tspan>trace OH⁻ / CN⁻</tspan></text><text x="760.0" y="178.4" font-size="24" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>C</tspan></text><line x1="772.0" y1="170.0" x2="808.0" y2="170.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="812.0" y="178.4" font-size="24" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>H</tspan></text><line x1="760.0" y1="156.0" x2="760.0" y2="120.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="760.0" y="114.0" font-size="24" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>OH</tspan></text><line x1="760.0" y1="184.0" x2="760.0" y2="220.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="760.0" y="243.3" font-size="24" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>CN</tspan></text><line x1="748.0" y1="170.0" x2="712.0" y2="170.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><polygon points="712.0,170.0 696.0,197.7 664.0,197.7 648.0,170.0 664.0,142.3 696.0,142.3" fill="none" stroke="#24292f" stroke-width="2.4" stroke-linejoin="round"/><circle cx="680" cy="170" r="19.2" fill="none" stroke="#24292f" stroke-width="2"/><text x="740.0" y="288.0" font-size="14" text-anchor="middle" fill="#57606a" font-weight="normal" xml:space="preserve"><tspan>mandelonitrile</tspan></text><text x="740.0" y="308.0" font-size="14" text-anchor="middle" fill="#57606a" font-weight="normal" xml:space="preserve"><tspan>(2-hydroxy-2-phenylethanenitrile)</tspan></text><text x="30.0" y="330.0" font-size="14" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>The planar C=O can be attacked from either face by CN⁻, so the new stereocentre is formed as a racemic (±) mixture.</tspan></text><text x="30.0" y="354.0" font-size="14" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>The benzene ring is untouched: nucleophilic addition occurs at C=O, not on the ring.</tspan></text></svg>