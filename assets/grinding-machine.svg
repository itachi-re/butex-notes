<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .p{fill:none;stroke:#000;stroke-width:1.6;}
    .f{fill:#fff;stroke:#000;stroke-width:1.6;}
    .lbl{font-size:13px;fill:#000;}
    .lead{stroke:#000;stroke-width:1;fill:none;}
    .dot{fill:#000;}
    .hatch{fill:#000;}
  </style>

  <!-- Lower table -->
  <rect class="f" x="80" y="330" width="600" height="34"/>
  <!-- Adjustable dogs -->
  <rect class="f" x="150" y="320" width="14" height="12"/>
  <rect class="f" x="520" y="320" width="14" height="12"/>
  <line class="lead" x1="80" y1="347" x2="680" y2="347" stroke-dasharray="4,4"/>

  <!-- Upper table -->
  <rect class="f" x="110" y="300" width="540" height="26"/>

  <!-- Headstock -->
  <rect class="f" x="130" y="220" width="90" height="80"/>
  <polygon class="f" points="220,250 250,258 250,272 220,280"/>
  <line class="p" x1="140" y1="260" x2="200" y2="260" stroke-dasharray="3,3"/>

  <!-- Workpiece -->
  <rect class="f" x="250" y="248" width="90" height="24"/>

  <!-- Grinding wheel -->
  <rect class="f" x="340" y="205" width="70" height="95"/>
  <g class="hatch">
    <rect x="352" y="216" width="8" height="8"/>
    <rect x="366" y="216" width="8" height="8"/>
    <rect x="380" y="216" width="8" height="8"/>
    <rect x="352" y="230" width="8" height="8"/>
    <rect x="366" y="230" width="8" height="8"/>
    <rect x="380" y="230" width="8" height="8"/>
    <rect x="352" y="244" width="8" height="8"/>
    <rect x="366" y="244" width="8" height="8"/>
    <rect x="380" y="244" width="8" height="8"/>
    <rect x="352" y="258" width="8" height="8"/>
    <rect x="366" y="258" width="8" height="8"/>
    <rect x="380" y="258" width="8" height="8"/>
    <rect x="352" y="272" width="8" height="8"/>
    <rect x="366" y="272" width="8" height="8"/>
    <rect x="380" y="272" width="8" height="8"/>
  </g>

  <!-- Wheel head -->
  <rect class="f" x="420" y="180" width="90" height="120"/>

  <!-- Tailstock -->
  <rect class="f" x="410" y="248" width="60" height="24"/>
  <polygon class="f" points="410,254 390,260 390,266 410,272"/>

  <!-- Leader lines / labels -->
  <text class="lbl" x="130" y="200">Head Stock</text>
  <line class="lead" x1="175" y1="220" x2="175" y2="205"/>

  <text class="lbl" x="240" y="220">Work piece</text>
  <line class="lead" x1="290" y1="248" x2="270" y2="223"/>

  <text class="lbl" x="330" y="190">Grinding wheel</text>
  <line class="lead" x1="375" y1="205" x2="375" y2="195"/>

  <text class="lbl" x="480" y="165">Wheel head</text>
  <line class="lead" x1="465" y1="180" x2="480" y2="170"/>

  <text class="lbl" x="550" y="255">Tailstock</text>
  <line class="lead" x1="470" y1="258" x2="548" y2="256"/>

  <text class="lbl" x="30" y="300">Upper</text>
  <text class="lbl" x="30" y="314">table</text>
  <line class="lead" x1="110" y1="308" x2="65" y2="305"/>

  <text class="lbl" x="30" y="345">Lower</text>
  <text class="lbl" x="30" y="359">table</text>
  <line class="lead" x1="80" y1="345" x2="65" y2="350"/>

  <text class="lbl" x="140" y="305" font-size="11">Adjustable dogs</text>
  <line class="lead" x1="157" y1="320" x2="157" y2="315"/>

  <text class="lbl" x="450" y="320">Table movement</text>
  <line class="lead" x1="150" y1="347" x2="150" y2="347" marker-end="url(#arrow)"/>
  <line class="p" x1="280" y1="365" x2="480" y2="365"/>
  <polygon class="hatch" points="280,365 288,361 288,369"/>
  <polygon class="hatch" points="480,365 472,361 472,369"/>

  <text class="lbl" x="330" y="400" font-size="14" font-style="italic">Figure: Grinding Machine (main parts)</text>
</svg>
