<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1950 1000" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="1950" height="1000" fill="#ffffff"/>
  <text x="975" y="50" text-anchor="middle" font-size="30" font-weight="bold" fill="#111111">SURFACE GRINDING MACHINE</text>
  <text x="975" y="78" text-anchor="middle" font-size="16" fill="#444444">Front View &#8212; Major Components</text>
  
  <g stroke="#111111" stroke-width="2.2" fill="#eef1f5" stroke-linejoin="round">

    <!-- Base -->
    <rect x="280" y="820" width="1240" height="55" fill="#d7dbe2"/>
    <rect x="280" y="875" width="1240" height="16" fill="#c3c9d3"/>

    <!-- Column -->
    <rect x="800" y="280" width="190" height="540" fill="#c3c9d3"/>
    <line x1="820" y1="300" x2="820" y2="800" stroke="#9aa0ac" stroke-width="1.2"/>
    <line x1="970" y1="300" x2="970" y2="800" stroke="#9aa0ac" stroke-width="1.2"/>

    <!-- Vertical feed screw + handwheel on column front -->
    <line x1="795" y1="360" x2="795" y2="610" stroke="#555555" stroke-width="5" stroke-dasharray="2,3"/>
    <circle cx="795" cy="628" r="24" fill="none" stroke="#111111" stroke-width="3"/>
    <line x1="795" y1="604" x2="795" y2="652" stroke="#111111" stroke-width="2"/>
    <line x1="771" y1="628" x2="819" y2="628" stroke="#111111" stroke-width="2"/>

    <!-- Wheel head (cantilevered on column front, slides vertically) -->
    <rect x="640" y="330" width="200" height="95" fill="#c3c9d3" stroke="#111111" stroke-width="2.2"/>
    <line x1="655" y1="345" x2="825" y2="345" stroke="#9aa0ac" stroke-width="1.2"/>

    <!-- Motor on top of wheel head, with drive belt -->
    <rect x="700" y="278" width="110" height="52" fill="#aab0bc" stroke="#111111" stroke-width="1.8"/>
    <circle cx="722" cy="304" r="10" fill="#7a8090" stroke="#111111" stroke-width="1.4"/>
    <circle cx="700" cy="340" r="10" fill="#7a8090" stroke="#111111" stroke-width="1.4"/>
    <line x1="712" y1="298" x2="702" y2="332" stroke="#333333" stroke-width="3"/>
    <line x1="732" y1="298" x2="708" y2="336" stroke="#333333" stroke-width="3"/>

    <!-- Grinding wheel (shown as a circle - conventional front-view convention) -->
    <circle cx="645" cy="475" r="78" fill="#b7bcc4" stroke="#111111" stroke-width="2.4"/>
    <circle cx="645" cy="475" r="16" fill="#7a8090" stroke="#111111" stroke-width="1.6"/>
    <!-- fine radial hatching to suggest abrasive wheel -->
    <line x1="645" y1="405" x2="645" y2="418" stroke="#8a8f98" stroke-width="1.4"/>
    <line x1="691" y1="429" x2="682" y2="438" stroke="#8a8f98" stroke-width="1.4"/>
    <line x1="599" y1="429" x2="608" y2="438" stroke="#8a8f98" stroke-width="1.4"/>
    <line x1="691" y1="521" x2="682" y2="512" stroke="#8a8f98" stroke-width="1.4"/>
    <line x1="599" y1="521" x2="608" y2="512" stroke="#8a8f98" stroke-width="1.4"/>

    <!-- Wheel guard (C-shaped shroud over top ~270 degrees, open at bottom) -->
    <path d="M 573,475 A 78,78 0 1 1 717,475" fill="none" stroke="#333333" stroke-width="10"/>

    <!-- Table -->
    <rect x="350" y="760" width="900" height="45" fill="#c3c9d3" stroke="#111111" stroke-width="2.2"/>
    <line x1="360" y1="772" x2="1240" y2="772" stroke="#9aa0ac" stroke-width="1.2"/>

    <!-- Magnetic chuck on table -->
    <rect x="470" y="736" width="480" height="26" fill="#9aa0ac" stroke="#111111" stroke-width="1.8"/>
    <line x1="500" y1="736" x2="500" y2="762" stroke="#7a8090" stroke-width="1.2"/>
    <line x1="560" y1="736" x2="560" y2="762" stroke="#7a8090" stroke-width="1.2"/>
    <line x1="620" y1="736" x2="620" y2="762" stroke="#7a8090" stroke-width="1.2"/>
    <line x1="680" y1="736" x2="680" y2="762" stroke="#7a8090" stroke-width="1.2"/>
    <line x1="740" y1="736" x2="740" y2="762" stroke="#7a8090" stroke-width="1.2"/>
    <line x1="800" y1="736" x2="800" y2="762" stroke="#7a8090" stroke-width="1.2"/>
    <line x1="860" y1="736" x2="860" y2="762" stroke="#7a8090" stroke-width="1.2"/>
    <line x1="920" y1="736" x2="920" y2="762" stroke="#7a8090" stroke-width="1.2"/>

    <!-- Workpiece under the wheel -->
    <rect x="575" y="712" width="140" height="24" fill="#dfe3e8" stroke="#111111" stroke-width="2"/>

    <!-- Saddle (below table, cross-feed slide) -->
    <rect x="540" y="805" width="420" height="18" fill="#aab0bc" stroke="#111111" stroke-width="1.8"/>

    <!-- Cross-feed handwheel (front of base/saddle) -->
    <circle cx="330" cy="847" r="24" fill="none" stroke="#111111" stroke-width="3"/>
    <line x1="330" y1="823" x2="330" y2="871" stroke="#111111" stroke-width="2"/>
    <line x1="306" y1="847" x2="354" y2="847" stroke="#111111" stroke-width="2"/>
    <line x1="354" y1="847" x2="540" y2="814" stroke="#555555" stroke-width="3" stroke-dasharray="2,3"/>

    <!-- Longitudinal traverse handwheel (end of table) -->
    <circle cx="1290" cy="782" r="24" fill="none" stroke="#111111" stroke-width="3"/>
    <line x1="1290" y1="758" x2="1290" y2="806" stroke="#111111" stroke-width="2"/>
    <line x1="1266" y1="782" x2="1314" y2="782" stroke="#111111" stroke-width="2"/>
    <line x1="1266" y1="782" x2="1250" y2="782" stroke="#555555" stroke-width="3"/>

  </g>

  <g><path d="M 820.0,300.0 L 270.0,300.0 L 270.0,140.0 L 252.0,140.0" fill="none" stroke="#111111" stroke-width="1.1"/>
<circle cx="820.0" cy="300.0" r="2.6" fill="#111111"/>
