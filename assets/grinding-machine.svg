  <g><text x="1578.0" y="155.0" text-anchor="start" font-size="17" fill="#111111">Motor / Drive Assembly</text>
<text x="1578.0" y="276.7" text-anchor="start" font-size="17" fill="#111111">Wheel Head</text>
<text x="1578.0" y="398.3" text-anchor="start" font-size="17" fill="#111111">Magnetic Chuck</text>
<text x="1578.0" y="520.0" text-anchor="start" font-size="17" fill="#111111">Table (Longitudinal Traverse)</text>
<text x="1578.0" y="641.7" text-anchor="start" font-size="17" fill="#111111">Longitudinal Traverse Handwheel</text>
<text x="1578.0" y="763.3" text-anchor="start" font-size="17" fill="#111111">Saddle (Cross-Feed Slide)</text>
<text x="1578.0" y="885.0" text-anchor="start" font-size="17" fill="#111111">Base</text></g>
  <text x="975" y="980" text-anchor="middle" font-size="13" fill="#666666">Conventional horizontal-spindle, reciprocating-table surface grinder &#8212; schematic front view</text>
</svg>
