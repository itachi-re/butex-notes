<circle cx="695.0" cy="345.0" r="2.6" fill="#111111"/>
<path d="M 610.0,398.0 L 270.0,398.0 L 270.0,393.3 L 252.0,393.3" fill="none" stroke="#111111" stroke-width="1.1"/>
<circle cx="610.0" cy="398.0" r="2.6" fill="#111111"/>
<path d="M 567.0,475.0 L 270.0,475.0 L 270.0,520.0 L 252.0,520.0" fill="none" stroke="#111111" stroke-width="1.1"/>
<circle cx="567.0" cy="475.0" r="2.6" fill="#111111"/>
<path d="M 771.0,628.0 L 270.0,628.0 L 270.0,646.7 L 252.0,646.7" fill="none" stroke="#111111" stroke-width="1.1"/>
<circle cx="771.0" cy="628.0" r="2.6" fill="#111111"/>
<path d="M 575.0,724.0 L 270.0,724.0 L 270.0,773.3 L 252.0,773.3" fill="none" stroke="#111111" stroke-width="1.1"/>
<circle cx="575.0" cy="724.0" r="2.6" fill="#111111"/>
<path d="M 306.0,847.0 L 270.0,847.0 L 270.0,900.0 L 252.0,900.0" fill="none" stroke="#111111" stroke-width="1.1"/>
<circle cx="306.0" cy="847.0" r="2.6" fill="#111111"/></g>
  <g><text x="252.0" y="145.0" text-anchor="end" font-size="17" fill="#111111">Column</text>
<text x="252.0" y="271.7" text-anchor="end" font-size="17" fill="#111111">Spindle</text>
<text x="252.0" y="398.3" text-anchor="end" font-size="17" fill="#111111">Wheel Guard</text>
<text x="252.0" y="525.0" text-anchor="end" font-size="17" fill="#111111">Grinding Wheel</text>
<text x="252.0" y="651.7" text-anchor="end" font-size="17" fill="#111111">Vertical Feed Handwheel</text>
<text x="252.0" y="778.3" text-anchor="end" font-size="17" fill="#111111">Workpiece</text>
<text x="252.0" y="905.0" text-anchor="end" font-size="17" fill="#111111">Cross-Feed Handwheel</text></g>
  <g><path d="M 810.0,300.0 L 1560.0,300.0 L 1560.0,150.0 L 1578.0,150.0" fill="none" stroke="#111111" stroke-width="1.1"/>
<circle cx="810.0" cy="300.0" r="2.6" fill="#111111"/>
<path d="M 840.0,345.0 L 1560.0,345.0 L 1560.0,271.7 L 1578.0,271.7" fill="none" stroke="#111111" stroke-width="1.1"/>
<circle cx="840.0" cy="345.0" r="2.6" fill="#111111"/>
<path d="M 950.0,748.0 L 1560.0,748.0 L 1560.0,393.3 L 1578.0,393.3" fill="none" stroke="#111111" stroke-width="1.1"/>
<circle cx="950.0" cy="748.0" r="2.6" fill="#111111"/>
<path d="M 1250.0,772.0 L 1560.0,772.0 L 1560.0,515.0 L 1578.0,515.0" fill="none" stroke="#111111" stroke-width="1.1"/>
<circle cx="1250.0" cy="772.0" r="2.6" fill="#111111"/>
<path d="M 1314.0,782.0 L 1560.0,782.0 L 1560.0,636.7 L 1578.0,636.7" fill="none" stroke="#111111" stroke-width="1.1"/>
<circle cx="1314.0" cy="782.0" r="2.6" fill="#111111"/>
<path d="M 960.0,814.0 L 1560.0,814.0 L 1560.0,758.3 L 1578.0,758.3" fill="none" stroke="#111111" stroke-width="1.1"/>
<circle cx="960.0" cy="814.0" r="2.6" fill="#111111"/>
<path d="M 1400.0,830.0 L 1560.0,830.0 L 1560.0,880.0 L 1578.0,880.0" fill="none" stroke="#111111" stroke-width="1.1"/>
