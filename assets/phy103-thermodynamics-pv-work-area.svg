<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="Helvetica,Arial,sans-serif">
  <rect width="560" height="400" fill="#ffffff"/>
  <text x="280" y="26" text-anchor="middle" font-size="17" font-weight="bold">Work Done by a Gas = Area Under the P-V Curve</text>

  <line x1="80" y1="340" x2="510" y2="340" stroke="#000" stroke-width="1.5" marker-end="url(#a4)"/>
  <line x1="80" y1="340" x2="80" y2="60" stroke="#000" stroke-width="1.5" marker-end="url(#a4)"/>
  <text x="495" y="362" font-size="13">V</text>
  <text x="45" y="70" font-size="13">P</text>

  <!-- shaded area under curve -->
  <path d="M150,300 Q300,150 420,180 L420,340 L150,340 Z" fill="#cfe3ff" stroke="none"/>
  <path d="M150,300 Q300,150 420,180" fill="none" stroke="#2255aa" stroke-width="2.5"/>

  <line x1="150" y1="340" x2="150" y2="300" stroke="#555" stroke-dasharray="4,3"/>
  <line x1="420" y1="340" x2="420" y2="180" stroke="#555" stroke-dasharray="4,3"/>
  <text x="140" y="358" font-size="12">V₁</text>
  <text x="412" y="358" font-size="12">V₂</text>

  <text x="230" y="230" font-size="14" font-weight="bold" fill="#123a70">W = ∫ P dV</text>
  <text x="215" y="252" font-size="11" fill="#123a70">(shaded area)</text>

  <text x="80" y="385" font-size="12" fill="#333">dW = P dV for an infinitesimal quasi-static expansion; the total work equals the integral (area) from V₁ to V₂.</text>

  <defs>
    <marker id="a4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
    </marker>
  </defs>
</svg>
