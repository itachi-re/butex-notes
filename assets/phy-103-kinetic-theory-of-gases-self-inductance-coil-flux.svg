<text x="450" y="85" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#263238" text-anchor="middle" font-weight="normal">Flux linkage in an N-turn coil</text><rect x="90" y="190" width="100" height="150" rx="8" fill="#FFFFFF" stroke="#1976D2" stroke-width="2"/><text x="140" y="220" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#263238" text-anchor="middle" font-weight="normal">Current</text><text x="140" y="255" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1976D2" text-anchor="middle" font-weight="normal">I = 2 A</text><line x1="190" y1="265" x2="300" y2="265" stroke="#1976D2" stroke-width="3" marker-end="url(#arrow)"/><path d="M300 265 c0 -70 45 -70 45 0 c0 70 -45 70 -45 0" stroke="#EF6C00" stroke-width="4" fill="none"/><path d="M345 265 c0 -70 45 -70 45 0 c0 70 -45 70 -45 0" stroke="#EF6C00" stroke-width="4" fill="none"/><path d="M390 265 c0 -70 45 -70 45 0 c0 70 -45 70 -45 0" stroke="#EF6C00" stroke-width="4" fill="none"/><path d="M435 265 c0 -70 45 -70 45 0 c0 70 -45 70 -45 0" stroke="#EF6C00" stroke-width="4" fill="none"/><path d="M480 265 c0 -70 45 -70 45 0 c0 70 -45 70 -45 0" stroke="#EF6C00" stroke-width="4" fill="none"/><path d="M525 265 c0 -70 45 -70 45 0 c0 70 -45 70 -45 0" stroke="#EF6C00" stroke-width="4" fill="none"/><path d="M570 265 c0 -70 45 -70 45 0 c0 70 -45 70 -45 0" stroke="#EF6C00" stroke-width="4" fill="none"/><line x1="615" y1="265" x2="760" y2="265" stroke="#1976D2" stroke-width="3" marker-end="url(#arrow)"/><text x="685" y="235" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#EF6C00" text-anchor="middle" font-weight="normal">Flux Φ per turn</text><text x="450" y="390" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#263238" text-anchor="middle" font-weight="normal">N = 400 turns</text><text x="450" y="430" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#263238" text-anchor="middle" font-weight="normal">L = NΦ / I</text><text x="450" y="470" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#263238" text-anchor="middle" font-weight="normal">Flux linkage = NΦ</text>
