<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="480" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Fig. 4 — Structures of Four Antioxidants</text>

  <!-- 1. BHT -->
  <g transform="translate(20,50)">
    <rect x="0" y="0" width="420" height="190" fill="#f6f8fa" stroke="#ccc" rx="6"/>
    <text x="210" y="20" text-anchor="middle" font-size="13" font-weight="bold">1. BHT — Butylated Hydroxytoluene (2,6-di-tert-butyl-4-methylphenol)</text>
    <polygon points="210,55 240,42 270,55 270,85 240,98 210,85" fill="none" stroke="#222" stroke-width="2"/>
    <text x="240" y="35" text-anchor="middle" font-size="12">OH</text>
    <text x="150" y="60" text-anchor="middle" font-size="12">tBu</text>
    <line x1="210" y1="60" x2="180" y2="60" stroke="#222" stroke-width="2"/>
    <text x="330" y="60" text-anchor="middle" font-size="12">tBu</text>
    <line x1="270" y1="60" x2="300" y2="60" stroke="#222" stroke-width="2"/>
    <text x="240" y="118" text-anchor="middle" font-size="12">CH&#8323;</text>
    <line x1="240" y1="98" x2="240" y2="110" stroke="#222" stroke-width="2"/>
    <text x="210" y="150" text-anchor="middle" font-size="11" fill="#555">Primary (chain-breaking) antioxidant — donates phenolic H to ROO&#8226;</text>
  </g>

  <!-- 2. BHA -->
  <g transform="translate(460,50)">
    <rect x="0" y="0" width="420" height="190" fill="#f6f8fa" stroke="#ccc" rx="6"/>
    <text x="210" y="20" text-anchor="middle" font-size="13" font-weight="bold">2. BHA — Butylated Hydroxyanisole (tert-butyl-4-methoxyphenol)</text>
    <polygon points="210,55 240,42 270,55 270,85 240,98 210,85" fill="none" stroke="#222" stroke-width="2"/>
    <text x="240" y="35" text-anchor="middle" font-size="12">OH</text>
    <text x="150" y="60" text-anchor="middle" font-size="12">tBu</text>
    <line x1="210" y1="60" x2="180" y2="60" stroke="#222" stroke-width="2"/>
    <text x="240" y="118" text-anchor="middle" font-size="12">OCH&#8323;</text>
    <line x1="240" y1="98" x2="240" y2="110" stroke="#222" stroke-width="2"/>
    <text x="210" y="150" text-anchor="middle" font-size="11" fill="#555">Primary antioxidant, also used as food-grade preservative</text>
  </g>

  <!-- 3. Irganox 1010 -->
  <g transform="translate(20,265)">
    <rect x="0" y="0" width="420" height="190" fill="#f6f8fa" stroke="#ccc" rx="6"/>
    <text x="210" y="20" text-anchor="middle" font-size="13" font-weight="bold">3. Irganox&#174; 1010 — Pentaerythritol Tetrakis[3-(3,5-di-tert-butyl-4-hydroxyphenyl)propionate]</text>
    <circle cx="210" cy="100" r="6" fill="#222"/>
    <text x="210" y="95" text-anchor="middle" font-size="10">C</text>
    <line x1="210" y1="100" x2="140" y2="60" stroke="#222" stroke-width="1.5"/>
    <line x1="210" y1="100" x2="280" y2="60" stroke="#222" stroke-width="1.5"/>
    <line x1="210" y1="100" x2="140" y2="140" stroke="#222" stroke-width="1.5"/>
    <line x1="210" y1="100" x2="280" y2="140" stroke="#222" stroke-width="1.5"/>
    <text x="130" y="50" font-size="9" text-anchor="middle">O-CO-CH&#8322;CH&#8322;-Ar(OH)</text>
    <text x="290" y="50" font-size="9" text-anchor="middle">O-CO-CH&#8322;CH&#8322;-Ar(OH)</text>
    <text x="130" y="155" font-size="9" text-anchor="middle">O-CO-CH&#8322;CH&#8322;-Ar(OH)</text>
    <text x="290" y="155" font-size="9" text-anchor="middle">O-CO-CH&#8322;CH&#8322;-Ar(OH)</text>
    <text x="210" y="178" text-anchor="middle" font-size="10" fill="#555">Tetra-functional hindered-phenolic primary antioxidant (Ar = 3,5-di-tBu-4-OH-phenyl)</text>
  </g>

  <!-- 4. Irgafos 168 -->
  <g transform="translate(460,265)">
    <rect x="0" y="0" width="420" height="190" fill="#f6f8fa" stroke="#ccc" rx="6"/>
    <text x="210" y="20" text-anchor="middle" font-size="13" font-weight="bold">4. Irgafos&#174; 168 — Tris(2,4-di-tert-butylphenyl) phosphite</text>
    <text x="210" y="90" text-anchor="middle" font-size="16" font-weight="bold">P</text>
    <line x1="205" y1="90" x2="150" y2="60" stroke="#222" stroke-width="2"/>
    <line x1="215" y1="90" x2="270" y2="60" stroke="#222" stroke-width="2"/>
    <line x1="210" y1="98" x2="210" y2="140" stroke="#222" stroke-width="2"/>
    <text x="130" y="52" font-size="10" text-anchor="middle">O-Ar</text>
    <text x="290" y="52" font-size="10" text-anchor="middle">O-Ar</text>
    <text x="210" y="155" font-size="10" text-anchor="middle">O-Ar</text>
    <text x="210" y="178" text-anchor="middle" font-size="10" fill="#555">Secondary antioxidant (phosphite) — decomposes hydroperoxides; Ar = 2,4-di-tBu-phenyl</text>
  </g>
</svg>
