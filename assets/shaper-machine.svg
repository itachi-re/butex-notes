<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1000" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="1800" height="1000" fill="#ffffff"/>
  <text x="900" y="50" text-anchor="middle" font-size="30" font-weight="bold" fill="#111111">SHAPER MACHINE</text>
  <text x="900" y="78" text-anchor="middle" font-size="16" fill="#444444">Side View &#8212; Major Components</text>
  
  <g stroke="#111111" stroke-width="2.2" fill="#eef1f5" stroke-linejoin="round">

    <!-- Base -->
    <rect x="240" y="820" width="1160" height="55" fill="#d7dbe2"/>
    <rect x="240" y="875" width="1160" height="16" fill="#c3c9d3"/>

    <!-- Column -->
    <rect x="270" y="330" width="230" height="490" fill="#c3c9d3"/>
    <!-- column ribs -->
    <line x1="290" y1="350" x2="290" y2="800" stroke="#9aa0ac" stroke-width="1.2"/>
    <line x1="480" y1="350" x2="480" y2="800" stroke="#9aa0ac" stroke-width="1.2"/>

    <!-- Bull gear (inside column, visible through a circular window) -->
    <circle cx="385" cy="560" r="78" fill="#dfe3e8" stroke="#111111" stroke-width="2"/>
    <circle cx="385" cy="560" r="78" fill="none" stroke="#9aa0ac" stroke-width="1"/>
    <!-- radial slot for crank-throw adjustment -->
    <rect x="380" y="500" width="10" height="55" fill="#aab0bc" stroke="#111111" stroke-width="1.4" transform="rotate(18 385 560)"/>
    <!-- crank pin -->
    <circle cx="418" cy="600" r="9" fill="#555555"/>
    <!-- stroke adjustment screw head (center of bull gear) -->
    <rect x="373" y="547" width="24" height="24" fill="#7a8090" stroke="#111111" stroke-width="1.6"/>
    <circle cx="385" cy="559" r="6" fill="#333333"/>

    <!-- slotted rocker arm / link from crank pin up to pivot near top of column, then to ram -->
    <line x1="418" y1="600" x2="452" y2="392" stroke="#333333" stroke-width="7"/>
    <circle cx="452" cy="392" r="10" fill="#6e7481" stroke="#111111" stroke-width="1.6"/>
    <line x1="452" y1="392" x2="470" y2="365" stroke="#333333" stroke-width="6"/>
    <circle cx="470" cy="365" r="8" fill="#6e7481" stroke="#111111" stroke-width="1.4"/>

    <!-- Ram (reciprocates on top of column, extends forward) -->
    <rect x="460" y="330" width="600" height="62" fill="#c3c9d3"/>
    <line x1="460" y1="345" x2="1060" y2="345" stroke="#9aa0ac" stroke-width="1.2"/>

    <!-- Tool head (mounted at front of ram, vertically adjustable) -->
    <rect x="985" y="392" width="70" height="80" fill="#aab0bc" stroke="#111111" stroke-width="2"/>
    <!-- down-feed screw / handle on tool head -->
    <circle cx="1063" cy="415" r="14" fill="none" stroke="#111111" stroke-width="2.4"/>
    <line x1="1063" y1="401" x2="1063" y2="429" stroke="#111111" stroke-width="1.8"/>
    <line x1="1049" y1="415" x2="1077" y2="415" stroke="#111111" stroke-width="1.8"/>

    <!-- Clapper box (hinged below tool head) -->
    <rect x="998" y="472" width="44" height="42" fill="#9aa0ac" stroke="#111111" stroke-width="1.8"/>
    <line x1="998" y1="480" x2="1042" y2="480" stroke="#111111" stroke-width="1.4"/>

    <!-- Cutting tool -->
    <polygon points="1006,514 1034,514 1024,542 1016,542" fill="#333333" stroke="#111111" stroke-width="1.4"/>

    <!-- Cross rail (mounted on column front face) -->
    <rect x="500" y="655" width="640" height="34" fill="#c3c9d3" stroke="#111111" stroke-width="2"/>
    <line x1="500" y1="668" x2="1140" y2="668" stroke="#9aa0ac" stroke-width="1.2"/>

    <!-- Feed mechanism: ratchet + pawl near end of cross rail -->
    <circle cx="545" cy="672" r="22" fill="#dfe3e8" stroke="#111111" stroke-width="1.8"/>
    <path d="M 545,650 L 552,660 L 545,660 Z" fill="#555555"/>
    <line x1="520" y1="690" x2="545" y2="672" stroke="#333333" stroke-width="3"/>

    <!-- Saddle (rides vertically on cross rail) -->
    <rect x="700" y="689" width="120" height="30" fill="#aab0bc" stroke="#111111" stroke-width="1.8"/>
    <!-- cross feed screw handwheel on saddle front -->
    <circle cx="715" cy="740" r="20" fill="none" stroke="#111111" stroke-width="2.6"/>
    <line x1="715" y1="720" x2="715" y2="760" stroke="#111111" stroke-width="1.8"/>
    <line x1="695" y1="740" x2="735" y2="740" stroke="#111111" stroke-width="1.8"/>
    <line x1="720" y1="719" x2="720" y2="702" stroke="#333333" stroke-width="4"/>

    <!-- Table -->
    <rect x="650" y="719" width="420" height="46" fill="#c3c9d3" stroke="#111111" stroke-width="2"/>
    <line x1="650" y1="730" x2="1070" y2="730" stroke="#9aa0ac" stroke-width="1.2"/>

    <!-- Workpiece on table, under cutting tool -->
    <rect x="965" y="695" width="90" height="24" fill="#b7bcc4" stroke="#111111" stroke-width="1.8"/>

    <!-- Table support (adjustable vertical support under front end) -->
    <rect x="985" y="765" width="55" height="60" fill="#d7dbe2" stroke="#111111" stroke-width="1.8"/>
    <line x1="1000" y1="765" x2="1000" y2="825" stroke="#9aa0ac" stroke-width="1.2"/>
    <line x1="1025" y1="765" x2="1025" y2="825" stroke="#9aa0ac" stroke-width="1.2"/>

  </g>

  <g><path d="M 290.0,345.0 L 245.0,345.0 L 245.0,140.0 L 227.0,140.0" fill="none" stroke="#111111" stroke-width="1.1"/>
<circle cx="290.0" cy="345.0" r="2.6" fill="#111111"/>
<path d="M 340.0,520.0 L 245.0,520.0 L 245.0,330.0 L 227.0,330.0" fill="none" stroke="#111111" stroke-width="1.1"/>
<circle cx="340.0" cy="520.0" r="2.6" fill="#111111"/>
<path d="M 373.0,559.0 L 245.0,559.0 L 245.0,520.0 L 227.0,520.0" fill="none" stroke="#111111" stroke-width="1.1"/>
<circle cx="373.0" cy="559.0" r="2.6" fill="#111111"/>
<path d="M 523.0,685.0 L 245.0,685.0 L 245.0,710.0 L 227.0,710.0" fill="none" stroke="#111111" stroke-width="1.1"/>
<circle cx="523.0" cy="685.0" r="2.6" fill="#111111"/>
<path d="M 350.0,826.0 L 245.0,826.0 L 245.0,900.0 L 227.0,900.0" fill="none" stroke="#111111" stroke-width="1.1"/>
<circle cx="350.0" cy="826.0" r="2.6" fill="#111111"/></g>
  <g><text x="227.0" y="145.0" text-anchor="end" font-size="17" fill="#111111">Column</text>
<text x="227.0" y="335.0" text-anchor="end" font-size="17" fill="#111111">Quick-Return Mechanism</text>
<text x="227.0" y="525.0" text-anchor="end" font-size="17" fill="#111111">Stroke Adjustment Screw</text>
<text x="227.0" y="715.0" text-anchor="end" font-size="17" fill="#111111">Feed Mechanism</text>
<text x="227.0" y="905.0" text-anchor="end" font-size="17" fill="#111111">Base</text></g>
  <g><path d="M 1058.0,345.0 L 1470.0,345.0 L 1470.0,150.0 L 1488.0,150.0" fill="none" stroke="#111111" stroke-width="1.1"/>
<circle cx="1058.0" cy="345.0" r="2.6" fill="#111111"/>
<path d="M 1053.0,415.0 L 1470.0,415.0 L 1470.0,241.2 L 1488.0,241.2" fill="none" stroke="#111111" stroke-width="1.1"/>
<circle cx="1053.0" cy="415.0" r="2.6" fill="#111111"/>
<path d="M 1041.0,490.0 L 1470.0,490.0 L 1470.0,332.5 L 1488.0,332.5" fill="none" stroke="#111111" stroke-width="1.1"/>
<circle cx="1041.0" cy="490.0" r="2.6" fill="#111111"/>
<path d="M 1030.0,528.0 L 1470.0,528.0 L 1470.0,423.8 L 1488.0,423.8" fill="none" stroke="#111111" stroke-width="1.1"/>
<circle cx="1030.0" cy="528.0" r="2.6" fill="#111111"/>
<path d="M 1138.0,668.0 L 1470.0,668.0 L 1470.0,515.0 L 1488.0,515.0" fill="none" stroke="#111111" stroke-width="1.1"/>
<circle cx="1138.0" cy="668.0" r="2.6" fill="#111111"/>
<path d="M 819.0,700.0 L 1470.0,700.0 L 1470.0,606.2 L 1488.0,606.2" fill="none" stroke="#111111" stroke-width="1.1"/>
<circle cx="819.0" cy="700.0" r="2.6" fill="#111111"/>
<path d="M 1069.0,730.0 L 1470.0,730.0 L 1470.0,697.5 L 1488.0,697.5" fill="none" stroke="#111111" stroke-width="1.1"/>
<circle cx="1069.0" cy="730.0" r="2.6" fill="#111111"/>
<path d="M 733.0,740.0 L 1470.0,740.0 L 1470.0,788.8 L 1488.0,788.8" fill="none" stroke="#111111" stroke-width="1.1"/>
<circle cx="733.0" cy="740.0" r="2.6" fill="#111111"/>
<path d="M 1039.0,795.0 L 1470.0,795.0 L 1470.0,880.0 L 1488.0,880.0" fill="none" stroke="#111111" stroke-width="1.1"/>
<circle cx="1039.0" cy="795.0" r="2.6" fill="#111111"/></g>
  <g><text x="1488.0" y="155.0" text-anchor="start" font-size="17" fill="#111111">Ram</text>
<text x="1488.0" y="246.2" text-anchor="start" font-size="17" fill="#111111">Tool Head</text>
<text x="1488.0" y="337.5" text-anchor="start" font-size="17" fill="#111111">Clapper Box</text>
<text x="1488.0" y="428.8" text-anchor="start" font-size="17" fill="#111111">Cutting Tool</text>
<text x="1488.0" y="520.0" text-anchor="start" font-size="17" fill="#111111">Cross Rail</text>
<text x="1488.0" y="611.2" text-anchor="start" font-size="17" fill="#111111">Saddle</text>
<text x="1488.0" y="702.5" text-anchor="start" font-size="17" fill="#111111">Table</text>
<text x="1488.0" y="793.8" text-anchor="start" font-size="17" fill="#111111">Cross Slide</text>
<text x="1488.0" y="885.0" text-anchor="start" font-size="17" fill="#111111">Table Support</text></g>
  <text x="900" y="980" text-anchor="middle" font-size="13" fill="#666666">Conventional crank-driven (Whitworth quick-return) shaper &#8212; schematic side view</text>
</svg>
