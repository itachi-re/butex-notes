<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .p{fill:none;stroke:#000;stroke-width:1.6;}
    .f{fill:#fff;stroke:#000;stroke-width:1.6;}
    .lbl{font-size:13px;fill:#000;}
    .lead{stroke:#000;stroke-width:1;fill:none;}
    .dot{fill:#000;}
  </style>

  <!-- Base -->
  <rect class="f" x="60" y="380" width="500" height="24"/>
  <!-- Column -->
  <rect class="f" x="380" y="160" width="70" height="220"/>
  <!-- Driving pulley -->
  <circle class="f" cx="560" cy="330" r="34"/>
  <circle class="p" cx="560" cy="330" r="6"/>

  <!-- Ram (moves over column top) -->
  <rect class="f" x="150" y="195" width="300" height="42"/>
  <!-- Ram lock handle / adjustment nut -->
  <rect class="f" x="300" y="190" width="26" height="14"/>
  <rect class="f" x="360" y="188" width="26" height="16"/>
  <line class="p" x1="386" y1="196" x2="406" y2="184"/>

  <!-- Clapper box + tool + tool post -->
  <rect class="f" x="205" y="220" width="20" height="35"/>
  <rect class="f" x="190" y="252" width="10" height="30"/>
  <polygon class="f" points="188,282 202,282 195,300"/>

  <!-- Vice -->
  <rect class="f" x="120" y="300" width="110" height="28"/>
  <rect class="f" x="130" y="290" width="20" height="12"/>
  <rect class="f" x="200" y="290" width="20" height="12"/>

  <!-- Table -->
  <rect class="f" x="110" y="328" width="270" height="24"/>

  <!-- Cross rail with cross feed / vertical feed -->
  <rect class="f" x="380" y="340" width="70" height="26"/>
  <rect class="p" x="398" y="348" width="10" height="10"/>
  <rect class="p" x="398" y="330" width="10" height="10"/>

  <!-- Leader lines / labels -->
  <text class="lbl" x="130" y="210">Tool post</text>
  <line class="lead" x1="195" y1="262" x2="170" y2="215"/>

  <text class="lbl" x="230" y="190">Tool</text>
  <line class="lead" x1="212" y1="222" x2="235" y2="195"/>

  <text class="lbl" x="255" y="170">Clapper box</text>
  <line class="lead" x1="220" y1="222" x2="260" y2="175"/>

  <text class="lbl" x="330" y="165">Ram adjustment nut</text>
  <line class="lead" x1="373" y1="190" x2="373" y2="172"/>

  <text class="lbl" x="440" y="160">Ram lock handle</text>
  <line class="lead" x1="406" y1="185" x2="440" y2="168"/>

  <text class="lbl" x="470" y="205">Ram (R)</text>
  <line class="lead" x1="450" y1="216" x2="466" y2="208"/>

  <text class="lbl" x="470" y="255">Column</text>
  <line class="lead" x1="450" y1="260" x2="466" y2="258"/>

  <text class="lbl" x="530" y="300">Driving pulley</text>
  <line class="lead" x1="560" y1="296" x2="555" y2="302"/>

  <text class="lbl" x="60" y="290">Vice</text>
  <line class="lead" x1="120" y1="302" x2="90" y2="292"/>

  <text class="lbl" x="150" y="322">Table</text>
  <line class="lead" x1="190" y1="328" x2="180" y2="325"/>

  <text class="lbl" x="450" y="325">Cross feed</text>
  <line class="lead" x1="403" y1="335" x2="446" y2="327"/>

  <text class="lbl" x="450" y="345">Cross rail</text>
  <line class="lead" x1="403" y1="345" x2="446" y2="347"/>

  <text class="lbl" x="450" y="365">Vertical feed</text>
  <line class="lead" x1="403" y1="358" x2="446" y2="363"/>

  <text class="lbl" x="280" y="418">Base</text>
  <line class="lead" x1="300" y1="404" x2="290" y2="414"/>

  <text class="lbl" x="330" y="460" font-size="14" font-style="italic">Figure: Shaper Machine (main parts)</text>
</svg>
