<text x="86.5" y="216.2" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52606d" text-anchor="middle">phenol</text>
<text x="405.0" y="216.2" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52606d" text-anchor="middle">salicylaldehyde</text>
<text x="405.0" y="232.2" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52606d" text-anchor="middle">(2-hydroxybenzaldehyde)</text>
