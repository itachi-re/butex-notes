<text x="24.0" y="300.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#52606d" text-anchor="start">Ortho attack is favoured: the phenoxide ion is most electron-rich at the ortho positions, and Na+ holds the carbene near the O−.</text>
<text x="24.0" y="320.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#52606d" text-anchor="start">With CCl₄ in place of CHCl₃ the product is salicylic acid (Reimer–Tiemann carboxylation).</text></g>
</svg>
