<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 365" width="800" height="365" role="img" aria-label="Effect of time on tempering hardness" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Effect of time on tempering hardness</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#333" stroke-width="2"/></pattern><pattern id="hatch2" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)"><line x1="0" y1="0" x2="0" y2="5" stroke="#e67e22" stroke-width="2"/></pattern></defs><rect x="0.5" y="0.5" width="799" height="364" fill="#ffffff" stroke="#cfd4da"/><text x="400.0" y="26.0" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#1f2933" font-family="Helvetica, Arial, sans-serif">Effect of time on tempering: hardness at 400, 600, 800 and 1000 °F (approximate redraw of D1-s41)</text><line x1="80.0" y1="263.3" x2="700.0" y2="263.3" stroke="#eceff3" stroke-width="1"/><text x="72.0" y="267.3" font-size="11" text-anchor="end" font-weight="normal" fill="#5f6b7a" font-family="Helvetica, Arial, sans-serif">30</text><line x1="80.0" y1="210.0" x2="700.0" y2="210.0" stroke="#eceff3" stroke-width="1"/><text x="72.0" y="214.0" font-size="11" text-anchor="end" font-weight="normal" fill="#5f6b7a" font-family="Helvetica, Arial, sans-serif">40</text><line x1="80.0" y1="156.7" x2="700.0" y2="156.7" stroke="#eceff3" stroke-width="1"/><text x="72.0" y="160.7" font-size="11" text-anchor="end" font-weight="normal" fill="#5f6b7a" font-family="Helvetica, Arial, sans-serif">50</text><line x1="80.0" y1="103.3" x2="700.0" y2="103.3" stroke="#eceff3" stroke-width="1"/><text x="72.0" y="107.3" font-size="11" text-anchor="end" font-weight="normal" fill="#5f6b7a" font-family="Helvetica, Arial, sans-serif">60</text><line x1="80.0" y1="50.0" x2="700.0" y2="50.0" stroke="#eceff3" stroke-width="1"/><text x="72.0" y="54.0" font-size="11" text-anchor="end" font-weight="normal" fill="#5f6b7a" font-family="Helvetica, Arial, sans-serif">70</text><line x1="120.0" y1="290.0" x2="120.0" y2="294.0" stroke="#444" stroke-width="1"/><text x="120.0" y="308.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#5f6b7a" font-family="Helvetica, Arial, sans-serif">10 s</text><line x1="236.0" y1="290.0" x2="236.0" y2="294.0" stroke="#444" stroke-width="1"/><text x="236.0" y="308.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#5f6b7a" font-family="Helvetica, Arial, sans-serif">1 min</text><line x1="352.0" y1="290.0" x2="352.0" y2="294.0" stroke="#444" stroke-width="1"/><text x="352.0" y="308.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#5f6b7a" font-family="Helvetica, Arial, sans-serif">10 min</text><line x1="439.0" y1="290.0" x2="439.0" y2="294.0" stroke="#444" stroke-width="1"/><text x="439.0" y="308.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#5f6b7a" font-family="Helvetica, Arial, sans-serif">1/2 h</text><line x1="497.0" y1="290.0" x2="497.0" y2="294.0" stroke="#444" stroke-width="1"/><text x="497.0" y="308.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#5f6b7a" font-family="Helvetica, Arial, sans-serif">1 h</text><line x1="555.0" y1="290.0" x2="555.0" y2="294.0" stroke="#444" stroke-width="1"/><text x="555.0" y="308.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#5f6b7a" font-family="Helvetica, Arial, sans-serif">2 h</text><line x1="630.4" y1="290.0" x2="630.4" y2="294.0" stroke="#444" stroke-width="1"/><text x="630.4" y="308.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#5f6b7a" font-family="Helvetica, Arial, sans-serif">5 h</text><line x1="700.0" y1="290.0" x2="700.0" y2="294.0" stroke="#444" stroke-width="1"/><text x="700.0" y="308.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#5f6b7a" font-family="Helvetica, Arial, sans-serif">25 h</text><line x1="80.0" y1="50.0" x2="80.0" y2="290.0" stroke="#444" stroke-width="1.6"/><line x1="80.0" y1="290.0" x2="700.0" y2="290.0" stroke="#444" stroke-width="1.6"/><text x="390.0" y="330.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2933" font-family="Helvetica, Arial, sans-serif">Time at temperature (logarithmic scale)</text><text x="28.0" y="170.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2933" font-family="Helvetica, Arial, sans-serif" transform="rotate(-90 28 170.0)">Rockwell C hardness</text><path d="M88,66.0 Q102,70.0 120,74.0" fill="none" stroke="#1b6ca8" stroke-width="2" stroke-dasharray="4,3"/><line x1="120.0" y1="74.0" x2="700.0" y2="111.3" stroke="#1b6ca8" stroke-width="2.6"/><text x="706.0" y="115.3" font-size="12" text-anchor="start" font-weight="bold" fill="#1b6ca8" font-family="Helvetica, Arial, sans-serif">400 °F</text><path d="M88,66.0 Q102,83.3 120,100.7" fill="none" stroke="#2e8b57" stroke-width="2" stroke-dasharray="4,3"/><line x1="120.0" y1="100.7" x2="700.0" y2="140.7" stroke="#2e8b57" stroke-width="2.6"/><text x="706.0" y="144.7" font-size="12" text-anchor="start" font-weight="bold" fill="#2e8b57" font-family="Helvetica, Arial, sans-serif">600 °F</text><path d="M88,66.0 Q102,98.0 120,130.0" fill="none" stroke="#b8860b" stroke-width="2" stroke-dasharray="4,3"/><line x1="120.0" y1="130.0" x2="700.0" y2="191.3" stroke="#b8860b" stroke-width="2.6"/><text x="706.0" y="195.3" font-size="12" text-anchor="start" font-weight="bold" fill="#b8860b" font-family="Helvetica, Arial, sans-serif">800 °F</text><path d="M88,66.0 Q102,119.3 120,172.7" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3"/><line x1="120.0" y1="172.7" x2="700.0" y2="247.3" stroke="#c0392b" stroke-width="2.6"/><text x="706.0" y="251.3" font-size="12" text-anchor="start" font-weight="bold" fill="#c0392b" font-family="Helvetica, Arial, sans-serif">1000 °F</text><text x="400.0" y="350.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#5f6b7a" font-family="Helvetica, Arial, sans-serif">Start ~ Rc 66-67 for all four; hotter temper = faster, larger loss of hardness. Numbers are eyeballed from the figure.</text></svg>