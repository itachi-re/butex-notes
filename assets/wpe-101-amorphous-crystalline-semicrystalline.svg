<title id="t">Amorphous, crystalline and semi-crystalline polymer</title>
<desc id="d">Three panels: random coil chains in an amorphous polymer, chain-folded lamella in a crystalline polymer, and fringed micelle crystallites joined by amorphous chains in a semi-crystalline polymer.</desc>
