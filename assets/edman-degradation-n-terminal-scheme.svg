<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" font-family="Georgia, serif" font-size="15" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="780" height="340" fill="#fff"/>
<text x="20" y="28" font-size="18" font-weight="bold">Edman degradation — identifies the N-terminal residue (and can be repeated)</text>

<text x="20" y="58" font-weight="bold">Step 1 — Label</text>
<text x="30" y="80">Peptide (free N-terminal NH2)  +  PITC (phenyl isothiocyanate, Edman's reagent)</text>
<text x="30" y="100">--(mild base)-->  PTC–peptide  (phenylthiocarbamyl derivative at the N-terminus)</text>

<text x="20" y="135" font-weight="bold">Step 2 — Selective cleavage</text>
<text x="30" y="157">PTC–peptide  --(anhydrous acid, e.g. TFA)-->  cyclises and cleaves ONLY the</text>
<text x="30" y="177">N-terminal residue, releasing it as a PTH-amino acid (phenylthiohydantoin derivative)</text>
<text x="30" y="197" font-size="14" fill="#555">+ the rest of the peptide chain, shortened by one residue, with a fresh free N-terminus</text>

<text x="20" y="235" font-weight="bold">Step 3 — Identify and repeat</text>
<text x="30" y="257">PTH-amino acid identified by chromatography (HPLC) → tells you residue 1.</text>
<text x="30" y="279">Cycle repeated on the shortened peptide → residue 2, 3, 4 … sequential N→C reading.</text>

<text x="20" y="315" font-size="14" fill="#555">Advantage over simple end-group reagents (Sanger's DNFB, dansyl chloride): the rest of the</text>
</svg>
