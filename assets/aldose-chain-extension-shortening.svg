<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="640" height="260" fill="#ffffff"/>
<text x="320" y="24" text-anchor="middle" font-size="16" font-weight="bold">Aldose chain extension &amp; shortening</text>

<rect x="250" y="45" width="140" height="40" rx="6" fill="#eef5ff" stroke="#1f5fa8"/>
<text x="320" y="70" text-anchor="middle" font-size="13" font-weight="bold">Aldose (n carbons)</text>

<line x1="250" y1="65" x2="100" y2="65" stroke="#1f5fa8" stroke-width="2" marker-end="url(#a1)"/>
<text x="60" y="55" font-size="12" text-anchor="middle" font-weight="bold">Kiliani&#8211;Fischer</text>
<text x="60" y="72" font-size="11" text-anchor="middle">(chain extension, +1C)</text>
<text x="20" y="100" font-size="11">1. HCN addition to CHO &#8594; cyanohydrin (new C, new stereocentre, epimer pair)</text>
<text x="20" y="118" font-size="11">2. Hydrolysis of &#8211;CN &#8594; &#8211;COOH (aldonic acid)</text>
<text x="20" y="136" font-size="11">3. Lactonisation, then reduction (Na-Hg) &#8594; new aldose (n+1 carbons)</text>

<line x1="390" y1="65" x2="540" y2="65" stroke="#a83232" stroke-width="2" marker-end="url(#a1)"/>
<text x="580" y="55" font-size="12" text-anchor="middle" font-weight="bold">Ruff</text>
<text x="580" y="72" font-size="11" text-anchor="middle">(chain shortening, -1C)</text>
<text x="410" y="100" font-size="11">1. Br&#8322;/H&#8322;O oxidises CHO &#8594; COOH (aldonic acid)</text>
<text x="410" y="118" font-size="11">2. Ca-salt + H&#8322;O&#8322; / Fe&#8322;(SO&#8324;)&#8323; (oxidative decarboxylation)</text>
<text x="410" y="136" font-size="11">3. Loses CO&#8322; &#8594; new aldose (n-1 carbons)</text>

<rect x="80" y="160" width="150" height="40" rx="6" fill="#e8ffe8" stroke="#2e7d32"/>
<text x="155" y="185" text-anchor="middle" font-size="12">Higher aldose (n+1)</text>
<rect x="440" y="160" width="150" height="40" rx="6" fill="#ffe8e8" stroke="#a83232"/>
<text x="515" y="185" text-anchor="middle" font-size="12">Lower aldose (n-1)</text>

<defs><marker id="a1" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#333"/></marker></defs>
</svg>
