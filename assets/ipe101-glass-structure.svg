<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="DejaVu Sans, Verdana, Arial, sans-serif" role="img" aria-label="Structure of silicate glass"><title>Structure of silicate glass</title><defs><radialGradient id="gb0bec5" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#b0bec5"/></radialGradient><radialGradient id="gef5350" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ef5350"/></radialGradient><radialGradient id="gba68c8" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ba68c8"/></radialGradient></defs><rect width="900" height="380" fill="#ffffff"/><text x="450.0" y="28.0" font-size="17" text-anchor="middle" fill="#222" font-weight="bold">Structure of silicate glass</text><text x="450.0" y="46.0" font-size="12" text-anchor="middle" fill="#555" font-weight="normal">building block SiO₄ tetrahedron; network modifiers (Na₂O) break the network</text><line x1="170.0" y1="80.0" x2="90.0" y2="270.0" stroke="#555" stroke-width="2" stroke-linecap="round"/><line x1="170.0" y1="80.0" x2="240.0" y2="285.0" stroke="#555" stroke-width="2" stroke-linecap="round"/><line x1="170.0" y1="80.0" x2="190.0" y2="215.0" stroke="#555" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/><line x1="90.0" y1="270.0" x2="240.0" y2="285.0" stroke="#555" stroke-width="2" stroke-linecap="round"/><line x1="90.0" y1="270.0" x2="190.0" y2="215.0" stroke="#555" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/><line x1="240.0" y1="285.0" x2="190.0" y2="215.0" stroke="#555" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/><circle cx="172.0" cy="205.0" r="17.0" fill="url(#gb0bec5)" stroke="#234" stroke-width="1"/><text x="172.0" y="211.0" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">Si</text><line x1="172.0" y1="205.0" x2="90.0" y2="270.0" stroke="#888" stroke-width="1.2" stroke-dasharray="2 3" stroke-linecap="round"/><circle cx="90.0" cy="270.0" r="15.0" fill="url(#gef5350)" stroke="#234" stroke-width="1"/><text x="90.0" y="274.0" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold">O</text><line x1="172.0" y1="205.0" x2="240.0" y2="285.0" stroke="#888" stroke-width="1.2" stroke-dasharray="2 3" stroke-linecap="round"/><circle cx="240.0" cy="285.0" r="15.0" fill="url(#gef5350)" stroke="#234" stroke-width="1"/><text x="240.0" y="289.0" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold">O</text><line x1="172.0" y1="205.0" x2="190.0" y2="215.0" stroke="#888" stroke-width="1.2" stroke-dasharray="2 3" stroke-linecap="round"/><circle cx="190.0" cy="215.0" r="15.0" fill="url(#gef5350)" stroke="#234" stroke-width="1"/><text x="190.0" y="219.0" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold">O</text><line x1="172.0" y1="205.0" x2="170.0" y2="80.0" stroke="#888" stroke-width="1.2" stroke-dasharray="2 3" stroke-linecap="round"/><circle cx="170.0" cy="80.0" r="15.0" fill="url(#gef5350)" stroke="#234" stroke-width="1"/><text x="170.0" y="84.0" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold">O</text><text x="165.0" y="325.0" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">SiO₄ tetrahedron (Si⁴⁺ surrounded by 4 O²⁻)</text><text x="165.0" y="343.0" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">each O is shared with a neighbour → bridging O</text><text x="560.0" y="100.0" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">Pure silica glass: continuous Si–O–Si network</text><line x1="380.0" y1="140.0" x2="432.0" y2="140.0" stroke="#555" stroke-width="2" stroke-linecap="round"/><line x1="432.0" y1="140.0" x2="484.0" y2="140.0" stroke="#555" stroke-width="2" stroke-linecap="round"/><line x1="484.0" y1="140.0" x2="536.0" y2="140.0" stroke="#555" stroke-width="2" stroke-linecap="round"/><line x1="536.0" y1="140.0" x2="588.0" y2="140.0" stroke="#555" stroke-width="2" stroke-linecap="round"/><line x1="588.0" y1="140.0" x2="640.0" y2="140.0" stroke="#555" stroke-width="2" stroke-linecap="round"/><line x1="640.0" y1="140.0" x2="692.0" y2="140.0" stroke="#555" stroke-width="2" stroke-linecap="round"/><circle cx="380.0" cy="140.0" r="15.0" fill="url(#gb0bec5)" stroke="#234" stroke-width="1"/><text x="380.0" y="144.0" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">Si</text><circle cx="432.0" cy="140.0" r="11.0" fill="url(#gef5350)" stroke="#234" stroke-width="1"/><circle cx="484.0" cy="140.0" r="15.0" fill="url(#gb0bec5)" stroke="#234" stroke-width="1"/><text x="484.0" y="144.0" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">Si</text><circle cx="536.0" cy="140.0" r="11.0" fill="url(#gef5350)" stroke="#234" stroke-width="1"/><circle cx="588.0" cy="140.0" r="15.0" fill="url(#gb0bec5)" stroke="#234" stroke-width="1"/><text x="588.0" y="144.0" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">Si</text><circle cx="640.0" cy="140.0" r="11.0" fill="url(#gef5350)" stroke="#234" stroke-width="1"/><circle cx="692.0" cy="140.0" r="15.0" fill="url(#gb0bec5)" stroke="#234" stroke-width="1"/><text x="692.0" y="144.0" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">Si</text><text x="560.0" y="200.0" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">+ Na₂O (soda): bridge broken → non-bridging O⁻</text><line x1="380.0" y1="240.0" x2="432.0" y2="240.0" stroke="#555" stroke-width="2" stroke-linecap="round"/><line x1="432.0" y1="240.0" x2="484.0" y2="240.0" stroke="#555" stroke-width="2" stroke-linecap="round"/><line x1="484.0" y1="240.0" x2="536.0" y2="240.0" stroke="#555" stroke-width="2" stroke-linecap="round"/><line x1="536.0" y1="240.0" x2="588.0" y2="240.0" stroke="#555" stroke-width="2" stroke-linecap="round"/><line x1="588.0" y1="240.0" x2="640.0" y2="240.0" stroke="#555" stroke-width="2" stroke-linecap="round"/><line x1="640.0" y1="240.0" x2="692.0" y2="240.0" stroke="#555" stroke-width="2" stroke-linecap="round"/><circle cx="380.0" cy="240.0" r="15.0" fill="url(#gb0bec5)" stroke="#234" stroke-width="1"/><text x="380.0" y="244.0" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">Si</text><circle cx="432.0" cy="240.0" r="11.0" fill="url(#gef5350)" stroke="#234" stroke-width="1"/><circle cx="484.0" cy="240.0" r="15.0" fill="url(#gb0bec5)" stroke="#234" stroke-width="1"/><text x="484.0" y="244.0" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">Si</text><circle cx="536.0" cy="240.0" r="11.0" fill="url(#gef5350)" stroke="#234" stroke-width="1"/><text x="539.0" y="226.0" font-size="12" text-anchor="middle" fill="#c1121f" font-weight="bold">⁻</text><circle cx="588.0" cy="240.0" r="14.0" fill="url(#gba68c8)" stroke="#234" stroke-width="1"/><text x="588.0" y="244.0" font-size="10" text-anchor="middle" fill="#222" font-weight="bold">Na⁺</text><circle cx="692.0" cy="240.0" r="14.0" fill="url(#gba68c8)" stroke="#234" stroke-width="1"/><text x="692.0" y="244.0" font-size="10" text-anchor="middle" fill="#222" font-weight="bold">Na⁺</text><text x="560.0" y="300.0" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">Soda-lime glass: ~72 % SiO₂, 14 % Na₂O, 9 % CaO (CaO makes it water-resistant)</text><text x="560.0" y="322.0" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">Fewer bridges → lower softening point, easier forming</text></svg>