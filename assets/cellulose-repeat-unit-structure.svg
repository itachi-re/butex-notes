<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="Georgia, serif" font-size="15" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="760" height="320" fill="#fff"/>
<text x="20" y="28" font-size="18" font-weight="bold">Cellulose — repeat unit (cellobiose), β-1,4-glycosidic linkage</text>

<g transform="translate(60,80)">
<polygon points="0,40 40,10 110,10 150,40 110,70 40,70" fill="none" stroke="black" stroke-width="2"/>
<text x="35" y="5" font-size="11" font-weight="bold">O</text>
</g>
<line x1="210" y1="110" x2="250" y2="110" stroke="black" stroke-width="2"/>
<text x="220" y="100" font-size="13" font-weight="bold">O</text>

<g transform="translate(260,80)">
<polygon points="0,40 40,10 110,10 150,40 110,70 40,70" fill="none" stroke="black" stroke-width="2"/>
<text x="35" y="5" font-size="11" font-weight="bold">O</text>
</g>
<text x="420" y="115" font-size="20">]ₙ</text>
<text x="30" y="175" font-size="13">each ring = β-D-glucopyranose unit</text>

<text x="20" y="220" font-size="14" fill="#555">Every glucose unit is joined β-1,4 to the next: the C1–O bond of one ring points</text>
<text x="20" y="242" font-size="14" fill="#555">"up" (β) and links to C4–OH of the next ring, so alternate rings are flipped 180°</text>
<text x="20" y="264" font-size="14" fill="#555">relative to their neighbours — giving cellulose's straight, extended, ribbon-like chain.</text>
<text x="20" y="286" font-size="14" fill="#555">This is the key structural difference from starch (α-1,4 links, all rings same orientation,</text>
<text x="20" y="308" font-size="14" fill="#555">helical chain) — and the reason mammalian amylase cannot hydrolyse the β-linkage.</text>
</svg>
