<svg xmlns="http://www.w3.org/2000/svg" width="700" height="392" viewBox="0 0 700 392" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Triangle for the vector proof of the law of sines</title>
<desc id="d">Triangle ABC with directed sides a = BC, b = CA, c = AB summing to zero, and the exterior angle pi minus C at vertex C.</desc>
<rect width="700" height="392" fill="#ffffff"/>
<g font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2328">
<polygon points="340.0,90.0 100.0,300.0 500.0,300.0" fill="#0969da" fill-opacity="0.07" stroke="none" stroke-width="0" stroke-linejoin="round"/>
<line x1="500.0" y1="300.0" x2="575.0" y2="300.0" stroke="#6e7781" stroke-width="1.8" stroke-dasharray="6 4" stroke-linecap="round"/>
<line x1="100.0" y1="300.0" x2="488.0" y2="300.0" stroke="#0969da" stroke-width="3.5" stroke-linecap="round"/><polygon points="500.0,300.0 488.0,295.0 488.0,305.0" fill="#0969da"/>
<line x1="500.0" y1="300.0" x2="347.3" y2="99.5" stroke="#1a7f37" stroke-width="3.5" stroke-linecap="round"/><polygon points="340.0,90.0 343.3,102.6 351.3,96.5" fill="#1a7f37"/>
<line x1="340.0" y1="90.0" x2="109.0" y2="292.1" stroke="#cf222e" stroke-width="3.5" stroke-linecap="round"/><polygon points="100.0,300.0 112.3,295.9 105.7,288.3" fill="#cf222e"/>
<path d="M 142.0 300.0 A 42 42 0 0 0 131.6 272.3" fill="none" stroke="#1f2328" stroke-width="2"/>
<path d="M 474.5 266.6 A 42 42 0 0 0 458.0 300.0" fill="none" stroke="#1f2328" stroke-width="2"/>
<path d="M 308.4 117.7 A 42 42 0 0 0 365.5 123.4" fill="none" stroke="#1f2328" stroke-width="2"/>
<text x="161.8" y="281.8" text-anchor="middle" font-size="15" font-weight="bold" font-style="italic" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">B</text><text x="161.8" y="281.8" text-anchor="middle" font-size="15" font-weight="bold" font-style="italic" fill="#1f2328">B</text>
<text x="440.9" y="275.7" text-anchor="middle" font-size="15" font-weight="bold" font-style="italic" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">C</text><text x="440.9" y="275.7" text-anchor="middle" font-size="15" font-weight="bold" font-style="italic" fill="#1f2328">C</text>
<text x="333.4" y="160.7" text-anchor="middle" font-size="15" font-weight="bold" font-style="italic" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">A</text><text x="333.4" y="160.7" text-anchor="middle" font-size="15" font-weight="bold" font-style="italic" fill="#1f2328">A</text>
<path d="M 530.0 300.0 A 30 30 0 0 0 481.8 276.1" fill="none" stroke="#bc4c00" stroke-width="2"/>
<text x="526.2" y="260.2" text-anchor="start" font-size="14" font-weight="bold" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">π − C</text><text x="526.2" y="260.2" text-anchor="start" font-size="14" font-weight="bold" fill="#bc4c00">π − C</text>
<circle cx="340.0" cy="90.0" r="4.5" fill="#1f2328"/>
<text x="340.0" y="76.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">A</text><text x="340.0" y="76.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2328">A</text>
<circle cx="100.0" cy="300.0" r="4.5" fill="#1f2328"/>
<text x="86.0" y="320.0" text-anchor="end" font-size="18" font-weight="bold" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">B</text><text x="86.0" y="320.0" text-anchor="end" font-size="18" font-weight="bold" fill="#1f2328">B</text>
<circle cx="500.0" cy="300.0" r="4.5" fill="#1f2328"/>
<text x="514.0" y="322.0" text-anchor="start" font-size="18" font-weight="bold" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">C</text><text x="514.0" y="322.0" text-anchor="start" font-size="18" font-weight="bold" fill="#1f2328">C</text>
<text x="300.0" y="328.0" text-anchor="middle" font-size="16" font-weight="bold" font-style="italic" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">a = BC</text><text x="300.0" y="328.0" text-anchor="middle" font-size="16" font-weight="bold" font-style="italic" fill="#0969da">a = BC</text>
<text x="434.0" y="190.0" text-anchor="start" font-size="16" font-weight="bold" font-style="italic" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">b = CA</text><text x="434.0" y="190.0" text-anchor="start" font-size="16" font-weight="bold" font-style="italic" fill="#1a7f37">b = CA</text>
<text x="208.0" y="190.0" text-anchor="end" font-size="16" font-weight="bold" font-style="italic" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">c = AB</text><text x="208.0" y="190.0" text-anchor="end" font-size="16" font-weight="bold" font-style="italic" fill="#cf222e">c = AB</text>
<text x="20.0" y="30.0" text-anchor="start" font-size="16" font-weight="bold" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">a + b + c = 0  gives  a × b = b × c = c × a</text><text x="20.0" y="30.0" text-anchor="start" font-size="16" font-weight="bold" fill="#1f2328">a + b + c = 0  gives  a × b = b × c = c × a</text>
<text x="20.0" y="56.0" text-anchor="start" font-size="14" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">Angle between a and b (tail to tail) is π − C, and sin(π − C) = sin C.</text><text x="20.0" y="56.0" text-anchor="start" font-size="14" fill="#1f2328">Angle between a and b (tail to tail) is π − C, and sin(π − C) = sin C.</text>
<text x="20.0" y="372.0" text-anchor="start" font-size="14" font-weight="bold" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">ab sin C = bc sin A = ca sin B,  so  sin A / a = sin B / b = sin C / c</text><text x="20.0" y="372.0" text-anchor="start" font-size="14" font-weight="bold" fill="#1f2328">ab sin C = bc sin A = ca sin B,  so  sin A / a = sin B / b = sin C / c</text>
</g>
</svg>
