<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#263238"/></marker><marker id="blueArrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#1976D2"/></marker></defs>
<rect x="0" y="0" width="900" height="520" fill="#FFFFFF"/>
<text x="450.0" y="36" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#263238" text-anchor="middle" font-weight="bold">Gas cylinder undergoing isothermal expansion</text>
<rect x="100" y="145" width="300" height="270" rx="10" fill="#FFFFFF" stroke="#1976D2" stroke-width="3"/><rect x="112" y="290" width="276" height="110" rx="3" fill="#FFFFFF" stroke="#1976D2" stroke-width="0"/><line x1="100" y1="290" x2="400" y2="290" stroke="#263238" stroke-width="4"/><line x1="250" y1="290" x2="250" y2="110" stroke="#EF6C00" stroke-width="3" marker-end="url(#arrow)"/><text x="250" y="95" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#EF6C00" text-anchor="middle" font-weight="normal">movable piston</text><text x="250" y="445" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1976D2" text-anchor="middle" font-weight="normal">Gas expands at constant T</text><text x="650" y="190" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#263238" text-anchor="middle" font-weight="normal">PV = nRT</text><text x="650" y="250" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1976D2" text-anchor="middle" font-weight="normal">W = ∫ P dV</text><text x="650" y="300" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1976D2" text-anchor="middle" font-weight="normal">= nRT ln(V₂/V₁)</text><text x="650" y="370" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#263238" text-anchor="middle" font-weight="normal">Expansion: V₂ &gt; V₁, W &gt; 0</text><circle cx="155" cy="330" r="6" fill="#1976D2" stroke="#263238" stroke-width="1.5"/><circle cx="210" cy="355" r="6" fill="#1976D2" stroke="#263238" stroke-width="1.5"/><circle cx="290" cy="340" r="6" fill="#1976D2" stroke="#263238" stroke-width="1.5"/><circle cx="350" cy="320" r="6" fill="#1976D2" stroke="#263238" stroke-width="1.5"/><circle cx="180" cy="375" r="6" fill="#1976D2" stroke="#263238" stroke-width="1.5"/><circle cx="320" cy="375" r="6" fill="#1976D2" stroke="#263238" stroke-width="1.5"/>
</svg>