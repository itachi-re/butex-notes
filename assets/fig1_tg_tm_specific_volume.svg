<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="760" height="480" fill="#ffffff"/>

  <!-- Axes -->
  <line x1="90" y1="420" x2="700" y2="420" stroke="#222" stroke-width="2"/>
  <line x1="90" y1="420" x2="90" y2="40" stroke="#222" stroke-width="2"/>
  <text x="400" y="460" text-anchor="middle" font-size="18" fill="#222">Temperature (T) &#8594;</text>
  <text x="30" y="230" text-anchor="middle" font-size="18" fill="#222" transform="rotate(-90 30 230)">Specific Volume (V) &#8594;</text>

  <!-- Amorphous polymer curve (continuous, break in slope at Tg) -->
  <path d="M 130 380 C 220 360, 260 340, 300 300" stroke="#1f6feb" stroke-width="3" fill="none"/>
  <path d="M 300 300 C 400 235, 520 170, 650 90" stroke="#1f6feb" stroke-width="3" fill="none"/>
  <circle cx="300" cy="300" r="5" fill="#1f6feb"/>

  <!-- Crystalline polymer curve (sharp jump at Tm) -->
  <path d="M 130 400 C 220 392, 320 384, 420 376" stroke="#d73a49" stroke-width="3" fill="none"/>
  <line x1="420" y1="376" x2="420" y2="290" stroke="#d73a49" stroke-width="3" stroke-dasharray="0"/>
  <path d="M 420 290 C 500 250, 580 190, 650 130" stroke="#d73a49" stroke-width="3" fill="none"/>
  <circle cx="420" cy="376" r="5" fill="#d73a49"/>
  <circle cx="420" cy="290" r="5" fill="#d73a49"/>

  <!-- Semi-crystalline (dashed, in between) -->
  <path d="M 130 390 C 240 375, 330 355, 380 330" stroke="#6f42c1" stroke-width="3" fill="none" stroke-dasharray="6,5"/>
  <path d="M 380 330 C 400 320, 400 305, 420 296" stroke="#6f42c1" stroke-width="3" fill="none" stroke-dasharray="6,5"/>
  <path d="M 420 296 C 500 260, 580 210, 650 150" stroke="#6f42c1" stroke-width="3" fill="none" stroke-dasharray="6,5"/>

  <!-- Tg vertical dashed line -->
  <line x1="300" y1="300" x2="300" y2="420" stroke="#555" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="300" y="438" text-anchor="middle" font-size="16" fill="#1f6feb" font-weight="bold">Tg</text>

  <!-- Tm vertical dashed line -->
  <line x1="420" y1="290" x2="420" y2="420" stroke="#555" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="420" y="438" text-anchor="middle" font-size="16" fill="#d73a49" font-weight="bold">Tm</text>

  <!-- Legend -->
  <rect x="500" y="55" width="185" height="95" fill="#f6f8fa" stroke="#ccc"/>
  <line x1="512" y1="72" x2="540" y2="72" stroke="#1f6feb" stroke-width="3"/>
  <text x="548" y="77" font-size="13" fill="#222">Amorphous (100%)</text>
  <line x1="512" y1="95" x2="540" y2="95" stroke="#d73a49" stroke-width="3"/>
  <text x="548" y="100" font-size="13" fill="#222">Crystalline (100%)</text>
  <line x1="512" y1="118" x2="540" y2="118" stroke="#6f42c1" stroke-width="3" stroke-dasharray="6,5"/>
  <text x="548" y="123" font-size="13" fill="#222">Semi-crystalline</text>

  <text x="400" y="25" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Fig. 1 — Specific Volume vs Temperature: Tg and Tm</text>
</svg>
