<svg xmlns="http://www.w3.org/2000/svg" width="820" height="450" viewBox="0 0 820 450" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="How break and continue change the flow of a loop" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>How break and continue change the flow of a loop</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker></defs>
<rect x="0.5" y="0.5" width="819" height="449" fill="#ffffff" stroke="#cfd8dc" rx="8"/>
<text x="190" y="19.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#1a1a1a" font-family="Consolas, Menlo, monospace"><tspan x="190" dy="0">break statement</tspan></text><polygon points="190,25.0 275.0,60 190,95.0 105.0,60" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/><text x="190" y="56.425" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="190" dy="0">loop condition</tspan><tspan x="190" dy="16.25">true ?</tspan></text><polyline points="190,95 190,123" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><text x="204" y="115.2" font-size="12" text-anchor="start" font-weight="bold" fill="#b71c1c" ><tspan x="204" dy="0">Yes</tspan></text><rect x="115.0" y="123.0" width="150" height="44" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/><text x="190" y="141.425" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="190" dy="0">statements</tspan><tspan x="190" dy="16.25">before</tspan></text><polyline points="190,167 190,195" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><polygon points="190,195.0 275.0,230 190,265.0 105.0,230" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/><text x="190" y="226.425" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="190" dy="0">if (cond)</tspan><tspan x="190" dy="16.25">break;</tspan></text><polyline points="190,265 190,298" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><text x="204" y="287.2" font-size="12" text-anchor="start" font-weight="bold" fill="#b71c1c" ><tspan x="204" dy="0">No</tspan></text><rect x="115.0" y="298.0" width="150" height="44" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/><text x="190" y="316.425" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="190" dy="0">statements</tspan><tspan x="190" dy="16.25">after</tspan></text><polyline points="115,320 40,320 40,60 105,60" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><polyline points="275,60 330,60" fill="none" stroke="#37474f" stroke-width="1.6"/><polyline points="330,60 330,382" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><text x="298" y="56.2" font-size="12" text-anchor="middle" font-weight="bold" fill="#b71c1c" ><tspan x="298" dy="0">No</tspan></text><rect x="265.0" y="382.0" width="130" height="36" rx="18.0" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/><text x="330" y="404.55" font-size="13" text-anchor="middle" font-weight="bold" fill="#1a1a1a" ><tspan x="330" dy="0">after loop</tspan></text><polyline points="275,230 330,230" fill="none" stroke="#37474f" stroke-width="1.6"/><text x="312" y="224.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#b71c1c" ><tspan x="312" dy="0">Yes → leave loop</tspan></text><text x="590" y="19.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#1a1a1a" font-family="Consolas, Menlo, monospace"><tspan x="590" dy="0">continue statement</tspan></text><polygon points="590,25.0 675.0,60 590,95.0 505.0,60" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/><text x="590" y="56.425" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="590" dy="0">loop condition</tspan><tspan x="590" dy="16.25">true ?</tspan></text><polyline points="590,95 590,123" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><text x="604" y="115.2" font-size="12" text-anchor="start" font-weight="bold" fill="#b71c1c" ><tspan x="604" dy="0">Yes</tspan></text><rect x="515.0" y="123.0" width="150" height="44" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/><text x="590" y="141.425" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="590" dy="0">statements</tspan><tspan x="590" dy="16.25">before</tspan></text><polyline points="590,167 590,195" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><polygon points="590,195.0 675.0,230 590,265.0 505.0,230" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/><text x="590" y="226.425" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="590" dy="0">if (cond)</tspan><tspan x="590" dy="16.25">continue;</tspan></text><polyline points="590,265 590,298" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><text x="604" y="287.2" font-size="12" text-anchor="start" font-weight="bold" fill="#b71c1c" ><tspan x="604" dy="0">No</tspan></text><rect x="515.0" y="298.0" width="150" height="44" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/><text x="590" y="316.425" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="590" dy="0">statements</tspan><tspan x="590" dy="16.25">after</tspan></text><polyline points="515,320 440,320 440,60 505,60" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><polyline points="675,60 730,60" fill="none" stroke="#37474f" stroke-width="1.6"/><polyline points="730,60 730,382" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><text x="698" y="56.2" font-size="12" text-anchor="middle" font-weight="bold" fill="#b71c1c" ><tspan x="698" dy="0">No</tspan></text><rect x="665.0" y="382.0" width="130" height="36" rx="18.0" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/><text x="730" y="404.55" font-size="13" text-anchor="middle" font-weight="bold" fill="#1a1a1a" ><tspan x="730" dy="0">after loop</tspan></text><polyline points="505,230 440,230" fill="none" stroke="#37474f" stroke-width="1.6"/><text x="472" y="225.2" font-size="12" text-anchor="middle" font-weight="bold" fill="#b71c1c" ><tspan x="472" dy="0">Yes</tspan></text><text x="590" y="215.5" font-size="10" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="590" dy="0"></tspan></text><text x="522" y="261.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#b71c1c" ><tspan x="522" dy="0">skip rest,</tspan></text><text x="522" y="275.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#b71c1c" ><tspan x="522" dy="0">go to next iteration</tspan></text>
</svg>