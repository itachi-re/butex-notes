<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" role="img" aria-label="How tetraethyllead works as an antiknock agent" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>How tetraethyllead works as an antiknock agent</title><defs><marker id="m1f2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1f2933"/></marker><marker id="m1b64c8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1b64c8"/></marker><marker id="mc62828" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c62828"/></marker><marker id="m2e7d32" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2e7d32"/></marker><marker id="md97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d97706"/></marker><marker id="m6b7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#6b7280"/></marker><marker id="m6a3fb5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#6a3fb5"/></marker><marker id="m0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/></marker></defs><rect x="0.5" y="0.5" width="859" height="429" rx="10" fill="#ffffff" stroke="#d0d7de"/><text x="249.7" y="31.0" xml:space="preserve" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1f2933" font-weight="bold"><tspan dy="0.0" font-size="20.0">Antiknock action of TEL – step by step</tspan></text><rect x="30.0" y="55.0" width="240.0" height="118.0" rx="8" fill="#f8fafc" stroke="#c62828" stroke-width="1.6"/><text x="111.2" y="79.9" xml:space="preserve" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#c62828" font-weight="bold"><tspan dy="0.0" font-size="14.0">1  Knocking</tspan></text><text x="71.2" y="103.4" xml:space="preserve" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f2933"><tspan dy="0.0" font-size="12.5">Fuel–air mixture auto-ignites</tspan></text><text x="65.9" y="121.9" xml:space="preserve" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f2933"><tspan dy="0.0" font-size="12.5">before the spark (radical chain</tspan></text><text x="69.0" y="140.4" xml:space="preserve" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f2933"><tspan dy="0.0" font-size="12.5">branching) → metallic “ping”</tspan></text><rect x="310.0" y="55.0" width="240.0" height="118.0" rx="8" fill="#f8fafc" stroke="#1b64c8" stroke-width="1.6"/><text x="378.0" y="79.9" xml:space="preserve" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1b64c8" font-weight="bold"><tspan dy="0.0" font-size="14.0">2  TEL is added</tspan></text><text x="353.0" y="103.4" xml:space="preserve" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f2933"><tspan dy="0.0" font-size="12.5">Pb(C</tspan><tspan dy="3.8" font-size="9.0">2</tspan><tspan dy="-3.8" font-size="12.5">H</tspan><tspan dy="3.8" font-size="9.0">5</tspan><tspan dy="-3.8" font-size="12.5">)</tspan><tspan dy="3.8" font-size="9.0">4</tspan><tspan dy="-3.8" font-size="12.5"> mixed with petrol</tspan></text><text x="360.5" y="121.9" xml:space="preserve" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f2933"><tspan dy="0.0" font-size="12.5">together with scavengers</tspan></text><text x="377.2" y="140.4" xml:space="preserve" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f2933"><tspan dy="0.0" font-size="12.5">(C</tspan><tspan dy="3.8" font-size="9.0">2</tspan><tspan dy="-3.8" font-size="12.5">H</tspan><tspan dy="3.8" font-size="9.0">4</tspan><tspan dy="-3.8" font-size="12.5">Br</tspan><tspan dy="3.8" font-size="9.0">2</tspan><tspan dy="-3.8" font-size="12.5">, C</tspan><tspan dy="3.8" font-size="9.0">2</tspan><tspan dy="-3.8" font-size="12.5">H</tspan><tspan dy="3.8" font-size="9.0">4</tspan><tspan dy="-3.8" font-size="12.5">Cl</tspan><tspan dy="3.8" font-size="9.0">2</tspan><tspan dy="-3.8" font-size="12.5">)</tspan></text><rect x="590.0" y="55.0" width="240.0" height="118.0" rx="8" fill="#f8fafc" stroke="#1b64c8" stroke-width="1.6"/><text x="624.6" y="79.9" xml:space="preserve" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1b64c8" font-weight="bold"><tspan dy="0.0" font-size="14.0">3  Thermal decomposition</tspan></text><text x="632.3" y="103.4" xml:space="preserve" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f2933"><tspan dy="0.0" font-size="12.5">Pb(C</tspan><tspan dy="3.8" font-size="9.0">2</tspan><tspan dy="-3.8" font-size="12.5">H</tspan><tspan dy="3.8" font-size="9.0">5</tspan><tspan dy="-3.8" font-size="12.5">)</tspan><tspan dy="3.8" font-size="9.0">4</tspan><tspan dy="-3.8" font-size="12.5">  →  Pb + 4 C</tspan><tspan dy="3.8" font-size="9.0">2</tspan><tspan dy="-3.8" font-size="12.5">H</tspan><tspan dy="3.8" font-size="9.0">5</tspan><tspan dy="-3.8" font-size="12.5">•</tspan></text><text x="627.7" y="121.9" xml:space="preserve" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f2933"><tspan dy="0.0" font-size="12.5">in the hot compressed charge</tspan></text><text x="652.3" y="140.4" xml:space="preserve" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f2933"><tspan dy="0.0" font-size="12.5">(before auto-ignition)</tspan></text><rect x="590.0" y="235.0" width="240.0" height="118.0" rx="8" fill="#f8fafc" stroke="#d97706" stroke-width="1.6"/><text x="625.0" y="259.9" xml:space="preserve" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#d97706" font-weight="bold"><tspan dy="0.0" font-size="14.0">4  Pb / PbO particles form</tspan></text><text x="624.7" y="283.4" xml:space="preserve" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f2933"><tspan dy="0.0" font-size="12.5">Pb + O</tspan><tspan dy="3.8" font-size="9.0">2</tspan><tspan dy="-3.8" font-size="12.5"> → PbO (fine particles)</tspan></text><text x="649.6" y="301.9" xml:space="preserve" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f2933"><tspan dy="0.0" font-size="12.5">their surface traps the</tspan></text><text x="609.0" y="320.4" xml:space="preserve" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f2933"><tspan dy="0.0" font-size="12.5">chain-carrying radicals •OH, •H, RO•</tspan></text><rect x="310.0" y="235.0" width="240.0" height="118.0" rx="8" fill="#f8fafc" stroke="#2e7d32" stroke-width="1.6"/><text x="357.8" y="259.9" xml:space="preserve" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2e7d32" font-weight="bold"><tspan dy="0.0" font-size="14.0">5  Chain is terminated</tspan></text><text x="342.5" y="283.4" xml:space="preserve" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f2933"><tspan dy="0.0" font-size="12.5">Radical concentration stays low</tspan></text><text x="356.4" y="301.9" xml:space="preserve" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f2933"><tspan dy="0.0" font-size="12.5">smooth, controlled burning</tspan></text><text x="361.2" y="320.4" xml:space="preserve" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f2933"><tspan dy="0.0" font-size="12.5">→ higher octane number</tspan></text><rect x="30.0" y="235.0" width="240.0" height="118.0" rx="8" fill="#f8fafc" stroke="#6a3fb5" stroke-width="1.6"/><text x="59.7" y="259.9" xml:space="preserve" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6a3fb5" font-weight="bold"><tspan dy="0.0" font-size="14.0">6  Scavengers remove lead</tspan></text><text x="94.7" y="283.4" xml:space="preserve" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f2933"><tspan dy="0.0" font-size="12.5">PbO / Pb + C</tspan><tspan dy="3.8" font-size="9.0">2</tspan><tspan dy="-3.8" font-size="12.5">H</tspan><tspan dy="3.8" font-size="9.0">4</tspan><tspan dy="-3.8" font-size="12.5">Br</tspan><tspan dy="3.8" font-size="9.0">2</tspan></text><text x="69.3" y="301.9" xml:space="preserve" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f2933"><tspan dy="0.0" font-size="12.5">→ volatile PbBr</tspan><tspan dy="3.8" font-size="9.0">2</tspan><tspan dy="-3.8" font-size="12.5"> (also PbCl</tspan><tspan dy="3.8" font-size="9.0">2</tspan><tspan dy="-3.8" font-size="12.5">)</tspan></text><text x="63.8" y="320.4" xml:space="preserve" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f2933"><tspan dy="0.0" font-size="12.5">leaves with exhaust (toxic Pb!)</tspan></text><line x1="272.0" y1="114.0" x2="306.0" y2="114.0" stroke="#1f2933" stroke-width="2.4" stroke-linecap="butt" marker-end="url(#m1f2933)"/><line x1="552.0" y1="114.0" x2="586.0" y2="114.0" stroke="#1f2933" stroke-width="2.4" stroke-linecap="butt" marker-end="url(#m1f2933)"/><line x1="710.0" y1="176.0" x2="710.0" y2="231.0" stroke="#1f2933" stroke-width="2.4" stroke-linecap="butt" marker-end="url(#m1f2933)"/><line x1="586.0" y1="294.0" x2="552.0" y2="294.0" stroke="#1f2933" stroke-width="2.4" stroke-linecap="butt" marker-end="url(#m1f2933)"/><line x1="306.0" y1="294.0" x2="272.0" y2="294.0" stroke="#1f2933" stroke-width="2.4" stroke-linecap="butt" marker-end="url(#m1f2933)"/><rect x="30.0" y="375.0" width="800.0" height="40.0" rx="8" fill="#fff8e1" stroke="#d97706" stroke-width="1.4"/><text x="117.7" y="399.4" xml:space="preserve" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f2933"><tspan dy="0.0" font-size="12.5">Octane scale: n-heptane = 0 (knocks badly), iso-octane = 100 (smooth).  TEL raised the octane number of petrol.</tspan></text></svg>