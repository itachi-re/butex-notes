<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" font-family="Arial, Helvetica, sans-serif" font-size="16" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Magnetic field lines of a bar magnet and of a uniform field</title><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect width="820" height="400" fill="#ffffff"/><text x="250" y="30" fill="#1f2937" font-size="17" text-anchor="middle" font-weight="bold" font-style="normal">(a) Bar magnet</text><text x="640" y="30" fill="#1f2937" font-size="17" text-anchor="middle" font-weight="bold" font-style="normal">(b) Uniform field</text><rect x="190" y="178" width="60" height="44" rx="0" stroke="#1f2937" stroke-width="2.5" fill="#2563eb" fill-opacity="0.2"/><rect x="250" y="178" width="60" height="44" rx="0" stroke="#1f2937" stroke-width="2.5" fill="#dc2626" fill-opacity="0.2"/><text x="220" y="196" fill="#2563eb" font-size="18" text-anchor="middle" font-weight="bold" font-style="normal">S</text><text x="280" y="196" fill="#dc2626" font-size="18" text-anchor="middle" font-weight="bold" font-style="normal">N</text><line x1="198" y1="212" x2="302" y2="212" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/><path d="M310,190 C346.0,144.0 154.0,144.0 190,190" stroke="#2563eb" stroke-width="2" fill="none" fill-opacity="1"/><line x1="254" y1="155.5" x2="246" y2="155.5" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/><path d="M310,210 C346.0,256.0 154.0,256.0 190,210" stroke="#2563eb" stroke-width="2" fill="none" fill-opacity="1"/><line x1="254" y1="244.5" x2="246" y2="244.5" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/><path d="M310,190 C377.5,95.0 122.5,95.0 190,190" stroke="#2563eb" stroke-width="2" fill="none" fill-opacity="1"/><line x1="254" y1="118.75" x2="246" y2="118.75" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/><path d="M310,210 C377.5,305.0 122.5,305.0 190,210" stroke="#2563eb" stroke-width="2" fill="none" fill-opacity="1"/><line x1="254" y1="281.25" x2="246" y2="281.25" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/><path d="M310,190 C409.0,46.0 91.0,46.0 190,190" stroke="#2563eb" stroke-width="2" fill="none" fill-opacity="1"/><line x1="254" y1="82.0" x2="246" y2="82.0" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/><path d="M310,210 C409.0,354.0 91.0,354.0 190,210" stroke="#2563eb" stroke-width="2" fill="none" fill-opacity="1"/><line x1="254" y1="318.0" x2="246" y2="318.0" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/><text x="250" y="350" fill="#1f2937" font-size="16" text-anchor="middle" font-weight="normal" font-style="normal">Lines leave N and enter S: closed loops</text><text x="250" y="374" fill="#1f2937" font-size="16" text-anchor="middle" font-weight="normal" font-style="normal">B is tangent to the line at every point</text><line x1="500" y1="90" x2="760" y2="90" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ab)"/><line x1="500" y1="130" x2="760" y2="130" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ab)"/><line x1="500" y1="170" x2="760" y2="170" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ab)"/><line x1="500" y1="210" x2="760" y2="210" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ab)"/><line x1="500" y1="250" x2="760" y2="250" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ab)"/><line x1="500" y1="290" x2="760" y2="290" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ab)"/><text x="775" y="94" fill="#2563eb" font-size="18" text-anchor="start" font-weight="bold" font-style="normal">B</text><rect x="560" y="130" width="160" height="80" rx="0" stroke="#059669" stroke-width="2" fill="#059669" fill-opacity="0.12" stroke-dasharray="6,4"/><rect x="578.2" y="160.0" width="115.5" height="23" fill="#ffffff"/><text x="640" y="176" fill="#059669" font-size="16" text-anchor="middle" font-weight="normal" font-style="normal">area A (⊥ B)</text><text x="640" y="350" fill="#1f2937" font-size="16" text-anchor="middle" font-weight="normal" font-style="normal">Parallel, equally spaced lines: B uniform</text><text x="640" y="374" fill="#1f2937" font-size="16" text-anchor="middle" font-weight="normal" font-style="normal">Line density ∝ magnitude of B</text></svg>