<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" width="660" height="340" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Uniform wire of length L and cross-section area A</title>
<desc id="d">A cylindrical wire of length L, cross-sectional area A and resistivity rho carrying current I. Its resistance is rho L over A.</desc>
<defs>
<marker id="ah-ink" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto"><polygon points="0 0,7 3,0 6" fill="#1b1b1b"/></marker>
<marker id="as-ink" markerWidth="7" markerHeight="6" refX="0.5" refY="3" orient="auto"><polygon points="7 0,0 3,7 6" fill="#1b1b1b"/></marker>
<marker id="ah-blue" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto"><polygon points="0 0,7 3,0 6" fill="#1f5fbf"/></marker>
<marker id="as-blue" markerWidth="7" markerHeight="6" refX="0.5" refY="3" orient="auto"><polygon points="7 0,0 3,7 6" fill="#1f5fbf"/></marker>
<marker id="ah-red" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto"><polygon points="0 0,7 3,0 6" fill="#c62828"/></marker>
<marker id="as-red" markerWidth="7" markerHeight="6" refX="0.5" refY="3" orient="auto"><polygon points="7 0,0 3,7 6" fill="#c62828"/></marker>
<marker id="ah-green" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto"><polygon points="0 0,7 3,0 6" fill="#2e7d32"/></marker>
<marker id="as-green" markerWidth="7" markerHeight="6" refX="0.5" refY="3" orient="auto"><polygon points="7 0,0 3,7 6" fill="#2e7d32"/></marker>
<marker id="ah-grey" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto"><polygon points="0 0,7 3,0 6" fill="#8a8a8a"/></marker>
<marker id="as-grey" markerWidth="7" markerHeight="6" refX="0.5" refY="3" orient="auto"><polygon points="7 0,0 3,7 6" fill="#8a8a8a"/></marker>
</defs>
<rect x="0" y="0" width="660" height="340" fill="#ffffff"/>
<text x="330.0" y="34.0" fill="#1b1b1b" font-size="22" text-anchor="middle" font-weight="bold">R = ρ L / A</text>
<rect x="150.0" y="110.0" width="320.0" height="110.0" fill="#1f5fbf" fill-opacity="0.12" stroke="#1b1b1b" stroke-width="2"/>
<ellipse cx="150.0" cy="165.0" rx="24" ry="55" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/>
<ellipse cx="470.0" cy="165.0" rx="24" ry="55" fill="#1f5fbf" fill-opacity="0.25" stroke="#1b1b1b" stroke-width="2"/>
<text x="470.0" y="171.0" fill="#1b1b1b" font-size="20" text-anchor="middle">A</text>
<line x1="60.0" y1="165.0" x2="122.0" y2="165.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="496.0" y1="165.0" x2="590.0" y2="165.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="80.0" y1="92.0" x2="200.0" y2="92.0" stroke="#c62828" stroke-width="3" stroke-linecap="round" marker-end="url(#ah-red)"/>
<text x="140.0" y="76.0" fill="#c62828" font-size="18" text-anchor="middle">I</text>
<line x1="150.0" y1="270.0" x2="470.0" y2="270.0" stroke="#1b1b1b" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ah-ink)" marker-start="url(#as-ink)"/>
<text x="310.0" y="296.0" fill="#1b1b1b" font-size="18" text-anchor="middle">L</text>
<text x="310.0" y="168.0" fill="#1b1b1b" font-size="22" text-anchor="middle">ρ</text>
<text x="560.0" y="120.0" fill="#1b1b1b" font-size="16" text-anchor="middle">cross-section A</text>
<line x1="560.0" y1="128.0" x2="488.0" y2="150.0" stroke="#1b1b1b" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ah-ink)"/>
<text x="330.0" y="322.0" fill="#1b1b1b" font-size="15" text-anchor="middle">ρ = resistivity (Ω·m): depends on material and temperature only</text>
</svg>
