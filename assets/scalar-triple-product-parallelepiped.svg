<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" font-family="Arial, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#222"/></marker></defs>
<polygon points="80,210 240,210 300,160 140,160" fill="#e3f2fd" fill-opacity="0.7" stroke="#777"/>
<polygon points="80,100 240,100 300,50 140,50" fill="#fff3e0" fill-opacity="0.7" stroke="#777"/>
<line x1="80" y1="210" x2="80" y2="100" stroke="#777"/>
<line x1="240" y1="210" x2="240" y2="100" stroke="#777"/>
<line x1="300" y1="160" x2="300" y2="50" stroke="#777"/>
<line x1="140" y1="160" x2="140" y2="50" stroke="#777"/>
<line x1="80" y1="210" x2="240" y2="210" stroke="#1565c0" stroke-width="3" marker-end="url(#arr)"/>
<text x="245" y="228" fill="#1565c0" font-weight="bold">a</text>
<line x1="80" y1="210" x2="140" y2="160" stroke="#c62828" stroke-width="3" marker-end="url(#arr)"/>
<text x="144" y="176" fill="#c62828" font-weight="bold">b</text>
<line x1="80" y1="210" x2="80" y2="100" stroke="#2e7d32" stroke-width="3" marker-end="url(#arr)"/>
<text x="62" y="150" fill="#2e7d32" font-weight="bold">c</text>
<text x="20" y="20" fill="#222">Volume V = |a · (b × c)| = |[a, b, c]|</text>
<text x="20" y="250" fill="#222" font-size="12">If V = 0 the three vectors are coplanar</text>
</svg>
