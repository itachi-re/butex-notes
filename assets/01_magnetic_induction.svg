<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
  <style>
    .field{stroke:#2563eb;stroke-width:2;marker-end:url(#arrow);}
    .normal{stroke:#dc2626;stroke-width:2;marker-end:url(#arrowr);}
    .lbl{font-size:14px;fill:#111827;}
    .loop{fill:none;stroke:#111827;stroke-width:2;}
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="arrowr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>

  <!-- Left: theta = 0 -->
  <text x="60" y="30" class="lbl" font-weight="bold">theta = 0 deg (max flux)</text>
  <line x1="40" y1="80" x2="40" y2="220" class="field"/>
  <line x1="90" y1="80" x2="90" y2="220" class="field"/>
  <line x1="140" y1="80" x2="140" y2="220" class="field"/>
  <line x1="190" y1="80" x2="190" y2="220" class="field"/>
  <ellipse cx="115" cy="150" rx="90" ry="25" class="loop"/>
  <line x1="115" y1="150" x2="115" y2="90" class="normal"/>
  <text x="120" y="85" class="lbl" fill="#dc2626">n&#772;</text>
  <text x="130" y="270" class="lbl">Phi_B = B A</text>

  <!-- Right: theta tilted -->
  <text x="420" y="30" class="lbl" font-weight="bold">theta tilted (reduced flux)</text>
  <line x1="380" y1="80" x2="380" y2="220" class="field"/>
  <line x1="430" y1="80" x2="430" y2="220" class="field"/>
  <line x1="480" y1="80" x2="480" y2="220" class="field"/>
  <line x1="530" y1="80" x2="530" y2="220" class="field"/>
  <ellipse cx="460" cy="150" rx="90" ry="25" transform="rotate(-30 460 150)" class="loop"/>
  <line x1="460" y1="150" x2="510" y2="95" class="normal"/>
  <text x="515" y="90" class="lbl" fill="#dc2626">n&#772;</text>
  <path d="M 460 150 L 460 100 A 50 50 0 0 1 500 118" fill="none" stroke="#059669" stroke-width="1.5"/>
  <text x="465" y="105" class="lbl" fill="#059669" font-size="12">theta</text>
  <text x="440" y="270" class="lbl">Phi_B = B A cos(theta)</text>
</svg>
