<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 410" width="700" height="410" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Unavailable energy bar chart</title>
<desc>Total heat 1000 J splits into 400 J available work and 600 J unavailable energy T0 times delta S.</desc>
<defs><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="my" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#777777"/></marker></defs>
<rect x="0" y="0" width="700" height="410" fill="#ffffff"/>
<text x="350" y="28" fill="#222222" font-size="16" text-anchor="middle" font-weight="bold">Unavailable energy = T₀ ΔS</text>
<text x="350" y="52" fill="#222222" font-size="14" text-anchor="middle" font-weight="normal">Q₁ = 1000 J from a source at T₁ = 500 K; sink T₀ = 300 K; ΔS = Q₁/T₁ = 2 J/K</text>
<line x1="50" y1="340" x2="670" y2="340" stroke="#222222" stroke-width="2"/>
<rect x="80" y="100" width="140" height="240" rx="0" fill="#222222" fill-opacity="0.12" stroke="#222222" stroke-width="2"/>
<rect x="280" y="244" width="140" height="96" rx="0" fill="#2e7d32" fill-opacity="0.2" stroke="#2e7d32" stroke-width="2"/>
<rect x="480" y="196" width="140" height="144" rx="0" fill="#c0392b" fill-opacity="0.2" stroke="#c0392b" stroke-width="2"/>
<text x="150" y="92" fill="#222222" font-size="15" text-anchor="middle" font-weight="bold">1000 J</text>
<text x="350" y="236" fill="#2e7d32" font-size="15" text-anchor="middle" font-weight="bold">400 J</text>
<text x="550" y="188" fill="#c0392b" font-size="15" text-anchor="middle" font-weight="bold">600 J</text>
<text x="150" y="362" fill="#222222" font-size="14" text-anchor="middle" font-weight="normal">Total heat Q₁</text>
<text x="150" y="382" fill="#222222" font-size="14" text-anchor="middle" font-weight="normal">taken from source</text>
<text x="350" y="362" fill="#2e7d32" font-size="14" text-anchor="middle" font-weight="normal">Available (max work)</text>
<text x="350" y="382" fill="#2e7d32" font-size="14" text-anchor="middle" font-weight="normal">W = Q₁ − T₀ΔS</text>
<text x="550" y="362" fill="#c0392b" font-size="14" text-anchor="middle" font-weight="normal">Unavailable energy</text>
<text x="550" y="382" fill="#c0392b" font-size="14" text-anchor="middle" font-weight="normal">T₀ΔS = 300 × 2</text>
<text x="250" y="200" fill="#222222" font-size="22" text-anchor="middle" font-weight="bold">=</text>
<text x="450" y="200" fill="#222222" font-size="22" text-anchor="middle" font-weight="bold">+</text>
<text x="250" y="222" fill="#222222" font-size="14" text-anchor="start" font-weight="normal"></text>
</svg>
