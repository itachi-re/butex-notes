<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="ahB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1000" height="520" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Mean free path: straight segments between successive collisions</text>

  <!-- (a) gas chamber with zigzag path -->
  <text x="270" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">(a) Path of one molecule in a gas</text>
  <rect x="30" y="76" width="480" height="300" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
  <!-- background molecules -->
  <g fill="#cbd5e1" stroke="#94a3b8">
    <circle cx="90" cy="130" r="11"/><circle cx="180" cy="320" r="11"/><circle cx="260" cy="110" r="11"/>
    <circle cx="330" cy="340" r="11"/><circle cx="470" cy="150" r="11"/><circle cx="445" cy="330" r="11"/>
    <circle cx="120" cy="250" r="11"/><circle cx="395" cy="105" r="11"/><circle cx="60" cy="340" r="11"/>
  </g>
  <!-- zigzag path -->
  <polyline fill="none" stroke="#2563eb" stroke-width="2.5" points="70,200 150,160 215,225 300,180 340,265 420,235 480,285"/>
  <g fill="#2563eb"><circle cx="70" cy="200" r="5"/></g>
  <g fill="#ffffff" stroke="#dc2626" stroke-width="2">
    <circle cx="150" cy="160" r="6"/><circle cx="215" cy="225" r="6"/><circle cx="300" cy="180" r="6"/>
    <circle cx="340" cy="265" r="6"/><circle cx="420" cy="235" r="6"/>
  </g>
  <polygon points="480,285 466,284 472,274" fill="#2563eb"/>
  <g font-size="12" font-weight="700" fill="#1d4ed8">
    <text x="92" y="168">λ₁</text><text x="168" y="206">λ₂</text><text x="240" y="190">λ₃</text>
    <text x="298" y="236">λ₄</text><text x="372" y="236">λ₅</text>
  </g>
  <text x="62" y="222" font-size="11" fill="#1d4ed8">start</text>
  <text x="270" y="400" text-anchor="middle" font-size="13" fill="#0f172a">λ = average of λ₁, λ₂, λ₃, … (red circles mark collisions)</text>
  <text x="270" y="420" text-anchor="middle" font-size="11" fill="#475569">Between collisions the molecule moves in a straight line (no intermolecular force).</text>

  <!-- (b) collision cylinder -->
  <text x="755" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">(b) Collision diameter and the swept cylinder</text>
  <!-- cylinder region -->
  <rect x="560" y="150" width="410" height="80" fill="#dbeafe" fill-opacity="0.7" stroke="#2563eb" stroke-dasharray="6 4"/>
  <line x1="560" y1="190" x2="970" y2="190" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="2 4"/>
  <!-- moving molecule: radius d/2 = 20 => diameter 40 -->
  <circle cx="590" cy="190" r="20" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="590" cy="190" r="3" fill="#1d4ed8"/>
  <line x1="612" y1="190" x2="680" y2="190" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ahB)"/>
  <text x="646" y="180" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">v̄</text>
  <!-- target molecules centres inside cylinder (within 40 of axis) -->
  <g fill="#fca5a5" stroke="#b91c1c" stroke-width="1.5">
    <circle cx="760" cy="170" r="20"/><circle cx="880" cy="205" r="20"/>
  </g>
  <g fill="#b91c1c"><circle cx="760" cy="170" r="3"/><circle cx="880" cy="205" r="3"/></g>
  <!-- outside molecule -->
  <circle cx="820" cy="300" r="20" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="820" y="340" text-anchor="middle" font-size="11" fill="#64748b">centre farther than d: no collision</text>
  <!-- contact: collision diameter d = distance between centres at contact -->
  <circle cx="760" cy="170" r="20" fill="none"/>
  <line x1="590" y1="190" x2="760" y2="170" stroke="none"/>
  <!-- touching pair shown separately -->
  <circle cx="650" cy="285" r="20" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="690" cy="285" r="20" fill="#fca5a5" stroke="#b91c1c" stroke-width="2"/>
  <line x1="650" y1="285" x2="690" y2="285" stroke="#0f172a" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="670" y="325" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">d = 2r</text>
  <text x="670" y="341" text-anchor="middle" font-size="11" fill="#475569">collision diameter</text>
  <!-- cylinder cross-section radius -->
  <line x1="940" y1="190" x2="940" y2="150" stroke="#334155" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="950" y="174" font-size="12" font-weight="700" fill="#0f172a">d</text>
  <text x="755" y="130" text-anchor="middle" font-size="12" fill="#0f172a">Cylinder of radius d and length v̄Δt  (volume πd²v̄Δt)</text>
  <text x="755" y="146" text-anchor="middle" font-size="11" fill="#475569">Every molecule whose centre lies inside it is struck in time Δt.</text>
  <text x="760" y="245" text-anchor="middle" font-size="11" fill="#b91c1c">hit</text>
  <text x="880" y="245" text-anchor="middle" font-size="11" fill="#b91c1c">hit</text>

  <!-- results panel -->
  <rect x="540" y="372" width="440" height="128" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-size="13" fill="#0f172a">
    <text x="556" y="396" font-weight="700">Results (derived in the guide)</text>
    <text x="556" y="418">Collision frequency:  z = √2 π d² v̄ (N/V)</text>
    <text x="556" y="440">Mean free path:  λ = v̄ / z = 1 / (√2 π d² N/V)</text>
    <text x="556" y="462">Using P = (N/V) k<tspan dy="3" font-size="10">B</tspan><tspan dy="-3">T:  λ = k</tspan><tspan dy="3" font-size="10">B</tspan><tspan dy="-3">T / (√2 π d² P)</tspan></text>
    <text x="556" y="484" fill="#475569" font-size="12">Example: N₂, 300 K, 1 atm, d = 0.37 nm: λ ≈ 67 nm</text>
  </g>
  <rect x="30" y="440" width="480" height="60" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-size="12" fill="#0f172a">
    <text x="44" y="462">Higher number density or larger d  ⇒  shorter λ.</text>
    <text x="44" y="482">At fixed T, λ ∝ 1/P (low pressure ⇒ long free path).</text>
  </g>
</svg>
