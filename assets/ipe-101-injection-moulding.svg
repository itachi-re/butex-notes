<svg xmlns="http://www.w3.org/2000/svg" width="980" height="400" viewBox="0 0 980 400" role="img" aria-label="Injection moulding of a thermoplastic"><defs><marker id="ahdc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect x="0.5" y="0.5" width="979" height="399" rx="10" fill="#ffffff" stroke="#d1d5db"/><text x="490.0" y="24.0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">Injection moulding of a thermoplastic</text><polygon points="40.0,120.0 110.0,120.0 90.0,160.0 60.0,160.0" fill="#e5e7eb" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/><text x="75.0" y="112.0" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#111827" text-anchor="middle" font-weight="bold">Hopper (granules)</text><rect x="40.0" y="160.0" width="430.0" height="54.0" rx="0" fill="#d1d5db" stroke="#1f2937" stroke-width="2.2"/><rect x="130.0" y="160.0" width="28.0" height="54.0" rx="0" fill="#fca5a5" stroke="#1f2937" stroke-width="1.2"/><rect x="210.0" y="160.0" width="28.0" height="54.0" rx="0" fill="#f87171" stroke="#1f2937" stroke-width="1.2"/><rect x="290.0" y="160.0" width="28.0" height="54.0" rx="0" fill="#ef4444" stroke="#1f2937" stroke-width="1.2"/><rect x="370.0" y="160.0" width="28.0" height="54.0" rx="0" fill="#dc2626" stroke="#1f2937" stroke-width="1.2"/><text x="290.0" y="148.0" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="bold">Heating bands (barrel heated progressively: 150 → 250 °C)</text><line x1="52.0" y1="202.0" x2="72.0" y2="172.0" stroke="#374151" stroke-width="2" stroke-linecap="round"/><line x1="81.0" y1="202.0" x2="101.0" y2="172.0" stroke="#374151" stroke-width="2" stroke-linecap="round"/><line x1="110.0" y1="202.0" x2="130.0" y2="172.0" stroke="#374151" stroke-width="2" stroke-linecap="round"/><line x1="139.0" y1="202.0" x2="159.0" y2="172.0" stroke="#374151" stroke-width="2" stroke-linecap="round"/><line x1="168.0" y1="202.0" x2="188.0" y2="172.0" stroke="#374151" stroke-width="2" stroke-linecap="round"/><line x1="197.0" y1="202.0" x2="217.0" y2="172.0" stroke="#374151" stroke-width="2" stroke-linecap="round"/><line x1="226.0" y1="202.0" x2="246.0" y2="172.0" stroke="#374151" stroke-width="2" stroke-linecap="round"/><line x1="255.0" y1="202.0" x2="275.0" y2="172.0" stroke="#374151" stroke-width="2" stroke-linecap="round"/><line x1="284.0" y1="202.0" x2="304.0" y2="172.0" stroke="#374151" stroke-width="2" stroke-linecap="round"/><line x1="313.0" y1="202.0" x2="333.0" y2="172.0" stroke="#374151" stroke-width="2" stroke-linecap="round"/><line x1="342.0" y1="202.0" x2="362.0" y2="172.0" stroke="#374151" stroke-width="2" stroke-linecap="round"/><line x1="371.0" y1="202.0" x2="391.0" y2="172.0" stroke="#374151" stroke-width="2" stroke-linecap="round"/><line x1="400.0" y1="202.0" x2="420.0" y2="172.0" stroke="#374151" stroke-width="2" stroke-linecap="round"/><line x1="429.0" y1="202.0" x2="449.0" y2="172.0" stroke="#374151" stroke-width="2" stroke-linecap="round"/><text x="250.0" y="236.0" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#374151" text-anchor="middle" font-weight="normal">reciprocating screw: conveys, melts, mixes, pushes melt forward</text><text x="40.0" y="262.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#16a34a" text-anchor="start" font-weight="normal">← screw rotates and retracts</text><polygon points="470.0,175.0 520.0,183.0 520.0,191.0 470.0,199.0" fill="#9ca3af" stroke="#1f2937" stroke-width="1.8" stroke-linejoin="round"/><rect x="520.0" y="140.0" width="100.0" height="100.0" rx="0" fill="#9ca3af" stroke="#1f2937" stroke-width="2.2"/><rect x="620.0" y="140.0" width="100.0" height="100.0" rx="0" fill="#9ca3af" stroke="#1f2937" stroke-width="2.2"/><rect x="590.0" y="168.0" width="60.0" height="44.0" rx="0" fill="#fde68a" stroke="#1f2937" stroke-width="1.5"/><text x="620.0" y="258.0" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#111827" text-anchor="middle" font-weight="bold">Mould (2 halves, water-cooled)</text><line x1="490.0" y1="120.0" x2="540.0" y2="120.0" stroke="#dc2626" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ahdc2626)"/><line x1="750.0" y1="120.0" x2="700.0" y2="120.0" stroke="#dc2626" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ahdc2626)"/><text x="620.0" y="110.0" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="bold">clamp force</text><text x="790.0" y="168.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#2563eb" text-anchor="start" font-weight="bold">Cycle</text><text x="790.0" y="188.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f2937" text-anchor="start" font-weight="normal">1  Clamp mould closed</text><text x="790.0" y="207.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f2937" text-anchor="start" font-weight="normal">2  Inject melt at high pressure</text><text x="790.0" y="226.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f2937" text-anchor="start" font-weight="normal">3  Hold pressure (packing)</text><text x="790.0" y="245.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f2937" text-anchor="start" font-weight="normal">4  Cool &amp; solidify in mould</text><text x="790.0" y="264.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f2937" text-anchor="start" font-weight="normal">5  Open mould, eject part</text><text x="790.0" y="283.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f2937" text-anchor="start" font-weight="normal">6  Screw retracts, refills</text><text x="40.0" y="320.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#374151" text-anchor="start" font-weight="normal">Products: bottle caps, buckets, toys, gears, switches, pen bodies, car dashboards.</text><text x="40.0" y="340.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#166534" text-anchor="start" font-weight="normal">Advantages: very fast cycle, complex shapes, high precision, little waste (runners reusable).</text><text x="40.0" y="360.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#991b1b" text-anchor="start" font-weight="normal">Limitations: high mould/machine cost; best for large production volumes.</text></svg>