<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" font-family="Georgia, serif" font-size="15" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="780" height="300" fill="#fff"/>
<text x="20" y="28" font-size="18" font-weight="bold">Malachite green — triarylmethane (basic) dye</text>

<g transform="translate(300,80)">
<circle cx="0" cy="0" r="8" fill="none" stroke="black"/>
<text x="-5" y="4" font-size="12">C+</text>
<line x1="-6" y1="-6" x2="-90" y2="-50" stroke="black"/>
<line x1="6" y1="-6" x2="90" y2="-50" stroke="black"/>
<line x1="0" y1="-8" x2="0" y2="-70" stroke="black"/>
<text x="-160" y="-60" font-size="13">C6H4—N(CH3)2</text>
<text x="90" y="-60" font-size="13">C6H4—N(CH3)2</text>
<text x="-30" y="-80" font-size="13">C6H5 (unsubstituted phenyl)</text>
</g>

<text x="20" y="170" font-weight="bold">Class:</text>
<text x="90" y="170" font-size="14">Triarylmethane basic dye — cationic chromophore (central C+ delocalised</text>
<text x="90" y="192" font-size="14">over the two p-dimethylamino rings via resonance) — no azo group at all.</text>
<text x="20" y="225" font-size="14" fill="#555">Chromophore: the extended, cationic, resonance-delocalised π-system itself (C+ ↔</text>
<text x="20" y="247" font-size="14" fill="#555">iminium forms on either ring). Auxochrome: the two –N(CH3)2 donor groups, essential</text>
<text x="20" y="269" font-size="14" fill="#555">for the intense green colour and for dye-fibre ionic bonding to anionic (e.g. acrylic/wool) sites.</text>
</svg>
