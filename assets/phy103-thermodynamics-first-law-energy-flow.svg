<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" font-family="Helvetica,Arial,sans-serif">
  <rect width="620" height="340" fill="#ffffff"/>
  <text x="310" y="26" text-anchor="middle" font-size="17" font-weight="bold">First Law of Thermodynamics — Energy Balance</text>
  <text x="310" y="46" text-anchor="middle" font-size="13" fill="#333">ΔQ = ΔU + W   (W = work done BY the system)</text>

  <circle cx="310" cy="190" r="80" fill="#fff7e6" stroke="#cc7a00" stroke-width="3"/>
  <text x="310" y="185" text-anchor="middle" font-size="15" font-weight="bold">System</text>
  <text x="310" y="205" text-anchor="middle" font-size="13">ΔU</text>

  <!-- Heat in -->
  <line x1="90" y1="150" x2="235" y2="170" stroke="#c0392b" stroke-width="3" marker-end="url(#a7)"/>
  <text x="90" y="135" font-size="14" fill="#c0392b" font-weight="bold">ΔQ (heat in)</text>

  <!-- Work out -->
  <line x1="385" y1="210" x2="530" y2="240" stroke="#1e8449" stroke-width="3" marker-end="url(#a7)"/>
  <text x="420" y="265" font-size="14" fill="#1e8449" font-weight="bold">W (work out)</text>

  <text x="60" y="300" font-size="12" fill="#333">Heat supplied to the system is spent partly in increasing the</text>
  <text x="60" y="318" font-size="12" fill="#333">internal energy (ΔU) and partly in doing external work (W).</text>

  <defs>
    <marker id="a7" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
</svg>
