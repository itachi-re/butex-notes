<text x="20.0" y="204.0" text-anchor="middle" font-size="14" font-style="italic" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">x</text><text x="20.0" y="204.0" text-anchor="middle" font-size="14" font-style="italic" fill="#6e7781">x</text>
