<text x="520.0" y="150.0" text-anchor="start" font-size="15" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">x = 1 :  F·n = 4z   →  2</text><text x="520.0" y="150.0" text-anchor="start" font-size="15" fill="#0969da">x = 1 :  F·n = 4z   →  2</text>
<text x="520.0" y="176.0" text-anchor="start" font-size="15" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">y = 1 :  F·n = y²   →  1</text><text x="520.0" y="176.0" text-anchor="start" font-size="15" fill="#1a7f37">y = 1 :  F·n = y²   →  1</text>
<text x="520.0" y="202.0" text-anchor="start" font-size="15" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">z = 1 :  F·n = zy   →  1/2</text><text x="520.0" y="202.0" text-anchor="start" font-size="15" fill="#bc4c00">z = 1 :  F·n = zy   →  1/2</text>
<text x="520.0" y="228.0" text-anchor="start" font-size="15" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">x = 0, y = 0, z = 0 :  0</text><text x="520.0" y="228.0" text-anchor="start" font-size="15" fill="#6e7781">x = 0, y = 0, z = 0 :  0</text>
<line x1="520.0" y1="240.0" x2="760.0" y2="240.0" stroke="#1f2328" stroke-width="1.2" stroke-linecap="round"/>
<text x="520.0" y="266.0" text-anchor="start" font-size="15" font-weight="bold" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">Total = 2 + 1 + 1/2 = 7/2</text><text x="520.0" y="266.0" text-anchor="start" font-size="15" font-weight="bold" fill="#1f2328">Total = 2 + 1 + 1/2 = 7/2</text>
<text x="520.0" y="292.0" text-anchor="start" font-size="14" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">= volume integral of div F = 4z + 3y</text><text x="520.0" y="292.0" text-anchor="start" font-size="14" fill="#1f2328">= volume integral of div F = 4z + 3y</text>
</g>
