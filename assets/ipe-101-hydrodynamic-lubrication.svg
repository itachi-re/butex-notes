<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" role="img" aria-label="Hydrodynamic (fluid-film) lubrication in a journal bearing"><defs><marker id="ah16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ahdc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah1f2937" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.5" y="0.5" width="859" height="479" rx="10" fill="#ffffff" stroke="#d1d5db"/><text x="430.0" y="24.0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">Hydrodynamic (fluid-film) lubrication in a journal bearing</text><circle cx="300.0" cy="230.0" r="150.0" fill="#dbeafe" stroke="#1f2937" stroke-width="2.5"/><circle cx="314.0" cy="238.0" r="128.0" fill="#d1d5db" stroke="#1f2937" stroke-width="2.5"/><text x="314.0" y="242.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#111827" text-anchor="middle" font-weight="bold">Shaft (journal)</text><text x="300.0" y="70.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#374151" text-anchor="middle" font-weight="bold">Bearing</text><path d="M374,208 A66,66 0 0 1 344,298" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="347.0" y1="294.0" x2="344.0" y2="300.0" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah16a34a)"/><text x="384.0" y="262.0" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#16a34a" text-anchor="middle" font-weight="bold">ω</text><line x1="300.0" y1="432.0" x2="300.0" y2="388.0" stroke="#dc2626" stroke-width="3" stroke-linecap="round" marker-end="url(#ahdc2626)"/><text x="312.0" y="424.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#dc2626" text-anchor="start" font-weight="bold">load W</text><text x="134.0" y="192.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#2563eb" text-anchor="end" font-weight="normal">thick film</text><text x="458.0" y="234.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#2563eb" text-anchor="start" font-weight="normal">wedge:</text><text x="458.0" y="248.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#2563eb" text-anchor="start" font-weight="normal">film thinnest</text><text x="458.0" y="262.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#2563eb" text-anchor="start" font-weight="normal">(hmin)</text><text x="134.0" y="206.0" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-weight="normal">(wide gap)</text><text x="690.0" y="80.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Pressure in oil film</text><line x1="610.0" y1="280.0" x2="810.0" y2="280.0" stroke="#1f2937" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2937)"/><line x1="610.0" y1="280.0" x2="610.0" y2="130.0" stroke="#1f2937" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2937)"/><text x="710.0" y="318.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">angle around bearing</text><text x="562.0" y="205.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold" transform="rotate(-90 562.0 205.0)">pressure p</text><path d="M610.0,280.0 C616.7,277.7 636.7,276.7 650.0,266.0 C663.3,255.3 676.7,235.3 690.0,216.0 C703.3,196.7 717.5,151.8 730.0,150.0 C742.5,148.2 755.0,186.3 765.0,205.0 C775.0,223.7 782.5,249.5 790.0,262.0 C797.5,274.5 806.7,277.0 810.0,280.0" fill="none" stroke="#dc2626" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="730.0" y="142.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="bold">p max</text><rect x="500.0" y="345.0" width="330.0" height="58.0" rx="6" fill="#f0f9ff" stroke="#2563eb" stroke-width="1"/><text x="665.0" y="365.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#1e3a8a" text-anchor="middle" font-weight="normal">Shaft speed drags oil into the converging wedge;</text><text x="665.0" y="381.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#1e3a8a" text-anchor="middle" font-weight="normal">pressure builds up and lifts the shaft off the metal:</text><text x="665.0" y="397.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#1e3a8a" text-anchor="middle" font-weight="bold">metal-to-metal contact is avoided.</text></svg>