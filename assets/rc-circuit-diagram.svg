<svg viewBox="0 0 480 220" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="480" height="220" fill="#ffffff"/>
<!-- battery -->
<line x1="40" y1="60" x2="40" y2="160" stroke="#000" stroke-width="2"/>
<line x1="30" y1="90" x2="50" y2="90" stroke="#000" stroke-width="4"/>
<line x1="25" y1="130" x2="55" y2="130" stroke="#000" stroke-width="2"/>
<text x="15" y="115" font-size="13">V</text>
<!-- switch -->
<line x1="40" y1="60" x2="150" y2="60" stroke="#000" stroke-width="2"/>
<circle cx="150" cy="60" r="3" fill="#000"/>
<line x1="150" y1="60" x2="200" y2="35" stroke="#000" stroke-width="2"/>
<circle cx="205" cy="60" r="3" fill="#000"/>
<text x="175" y="30" font-size="13">S</text>
<line x1="205" y1="60" x2="330" y2="60" stroke="#000" stroke-width="2"/>
<!-- resistor -->
<path d="M330,60 h10 l8,-12 l16,24 l16,-24 l16,24 l16,-24 l8,12 h10" stroke="#000" stroke-width="2" fill="none"/>
<text x="380" y="40" font-size="13" text-anchor="middle">R</text>
<line x1="424" y1="60" x2="440" y2="60" stroke="#000" stroke-width="2"/>
<line x1="440" y1="60" x2="440" y2="160" stroke="#000" stroke-width="2"/>
<!-- capacitor -->
<line x1="230" y1="160" x2="230" y2="130" stroke="#000" stroke-width="2"/>
<line x1="210" y1="130" x2="250" y2="130" stroke="#000" stroke-width="3"/>
<line x1="210" y1="145" x2="250" y2="145" stroke="#000" stroke-width="3"/>
<line x1="230" y1="145" x2="230" y2="160" stroke="#000" stroke-width="2"/>
<text x="255" y="140" font-size="13">C</text>
<line x1="40" y1="160" x2="440" y2="160" stroke="#000" stroke-width="2"/>
<text x="240" y="20" font-size="16" text-anchor="middle" font-weight="bold">Series R-C Charging Circuit</text>
</svg>
