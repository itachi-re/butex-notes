<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" role="img" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Photocurrent versus voltage curves</title>
<desc>Photocurrent against anode potential for two intensities at one frequency and for a higher frequency, showing equal saturation scaling with intensity and stopping potential depending on frequency.</desc>
<defs><marker id="ad" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 z" fill="#222222"/></marker><marker id="ab" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 z" fill="#1f5fbf"/></marker><marker id="ar" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 z" fill="#c0392b"/></marker><marker id="ag" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 z" fill="#2e7d32"/></marker></defs>
<rect x="0" y="0" width="720" height="480" fill="#ffffff"/>
<text x="20" y="30" text-anchor="start" font-size="18" fill="#222222" font-weight="bold"><tspan>Photocurrent versus anode potential</tspan></text>
<line x1="300.0" y1="400.0" x2="300.0" y2="70.0" stroke="#222222" stroke-width="2" marker-end="url(#ad)"/>
<line x1="50.0" y1="400.0" x2="690.0" y2="400.0" stroke="#222222" stroke-width="2" marker-end="url(#ad)"/>
<text x="312" y="80" text-anchor="start" font-size="17" fill="#222222" font-weight="normal"><tspan>Photocurrent I</tspan></text>
<text x="688" y="428" text-anchor="end" font-size="17" fill="#222222" font-weight="normal"><tspan>Anode potential V</tspan></text>
<path d="M150,400 C240,400 230,110 350,110 L660,110" fill="none" stroke="#1f5fbf" stroke-width="3"/>
<path d="M150,400 C240,400 230,210 350,210 L660,210" fill="none" stroke="#2e7d32" stroke-width="3"/>
<path d="M70,400 C160,400 150,210 270,210 L660,210" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="9 6"/>
<text x="528.9" y="100" text-anchor="start" font-size="16" fill="#1f5fbf" font-weight="normal"><tspan>I</tspan><tspan dy="5" font-size="14">2</tspan><tspan dy="-5"> = 2I</tspan><tspan dy="5" font-size="14">1</tspan><tspan dy="-5">, frequency ν</tspan><tspan dy="5" font-size="14">1</tspan></text>
<text x="568.3" y="202" text-anchor="start" font-size="16" fill="#2e7d32" font-weight="normal"><tspan>I</tspan><tspan dy="5" font-size="14">1</tspan><tspan dy="-5">, frequency ν</tspan><tspan dy="5" font-size="14">1</tspan></text>
<text x="469.3" y="236" text-anchor="start" font-size="16" fill="#c0392b" font-weight="normal"><tspan>I</tspan><tspan dy="5" font-size="14">1</tspan><tspan dy="-5"> (same photon rate), ν</tspan><tspan dy="5" font-size="14">2</tspan><tspan dy="-5"> &gt; ν</tspan><tspan dy="5" font-size="14">1</tspan></text>
<line x1="150.0" y1="394.0" x2="150.0" y2="406.0" stroke="#222222" stroke-width="2"/>
<text x="132.2" y="428" text-anchor="start" font-size="16" fill="#222222" font-weight="normal"><tspan>−V</tspan><tspan dy="5" font-size="14">01</tspan></text>
<line x1="70.0" y1="394.0" x2="70.0" y2="406.0" stroke="#222222" stroke-width="2"/>
<text x="52.2" y="428" text-anchor="start" font-size="16" fill="#222222" font-weight="normal"><tspan>−V</tspan><tspan dy="5" font-size="14">02</tspan></text>
<text x="312" y="422" text-anchor="start" font-size="16" fill="#222222" font-weight="normal"><tspan>0</tspan></text>
<text x="420" y="130" text-anchor="start" font-size="16" fill="#1f5fbf" font-weight="normal"><tspan>saturation current</tspan></text>
<text x="420" y="152" text-anchor="start" font-size="16" fill="#1f5fbf" font-weight="normal"><tspan>proportional to intensity</tspan></text>
<text x="330" y="320" text-anchor="start" font-size="16" fill="#222222" font-weight="normal"><tspan>At V = −V</tspan><tspan dy="5" font-size="14">0</tspan><tspan dy="-5">: I = 0</tspan></text>
<text x="330" y="344" text-anchor="start" font-size="16" fill="#222222" font-weight="normal"><tspan>eV</tspan><tspan dy="5" font-size="14">0</tspan><tspan dy="-5"> = K</tspan><tspan dy="5" font-size="14">max</tspan><tspan dy="-5"> = hν − φ</tspan></text>
<text x="330" y="368" text-anchor="start" font-size="16" fill="#222222" font-weight="normal"><tspan>V</tspan><tspan dy="5" font-size="14">0</tspan><tspan dy="-5"> depends on ν, not on I</tspan></text>
<text x="140" y="462" text-anchor="middle" font-size="15" fill="#222222" font-weight="normal"><tspan>← retarding</tspan></text>
<text x="430" y="462" text-anchor="middle" font-size="15" fill="#222222" font-weight="normal"><tspan>accelerating →</tspan></text>
</svg>
