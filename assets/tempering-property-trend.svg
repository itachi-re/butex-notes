<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Tempering trend graph" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Tempering trend graph</title><desc>Qualitative trend of hardness, toughness, residual stress vs tempering temperature</desc><defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker><pattern id="lam" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#f3e3c3"/><line x1="0" y1="3" x2="6" y2="3" stroke="#6b3d10" stroke-width="1.6"/></pattern><pattern id="lamf" width="3.5" height="3.5" patternUnits="userSpaceOnUse"><rect width="3.5" height="3.5" fill="#f3e3c3"/><line x1="0" y1="1.7" x2="3.5" y2="1.7" stroke="#6b3d10" stroke-width="1.2"/></pattern><pattern id="lamc" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f3e3c3"/><line x1="0" y1="5" x2="10" y2="5" stroke="#6b3d10" stroke-width="2.2"/></pattern></defs><rect width="100%" height="100%" fill="#fff"/><text x="450.0" y="26" font-size="17" text-anchor="middle" fill="#0b2a55" font-weight="bold"><tspan x="450.0" dy="0.0">Tempering Temperature vs Properties</tspan></text><text x="450.0" y="44" font-size="11.5" text-anchor="middle" fill="#555" font-style="italic"><tspan x="450.0" dy="0.0">QUALITATIVE schematic – no numerical scale on the y-axis</tspan></text><line x1="90" y1="440" x2="820" y2="440" stroke="#111" stroke-width="2" marker-end="url(#ar)"/><line x1="90" y1="440" x2="90" y2="80" stroke="#111" stroke-width="2" marker-end="url(#ar)"/><text x="455.0" y="474" font-size="12" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="455.0" dy="0.0">Tempering temperature →  (100 … 1333 °F)</tspan></text><text x="52" y="260.0" font-size="12" text-anchor="middle" fill="#111" font-weight="bold" transform="rotate(-90 52 260.0)"><tspan x="52" dy="0.0">Relative level →</tspan></text><line x1="90.0" y1="440" x2="90.0" y2="446" stroke="#111" stroke-width="2"/><text x="90.0" y="462" font-size="10.5" text-anchor="middle" fill="#111"><tspan x="90.0" dy="0.0">100</tspan></text><line x1="90.0" y1="440" x2="90.0" y2="90" stroke="#ddd" stroke-width="1" stroke-dasharray="3 4"/><line x1="265.1824817518248" y1="440" x2="265.1824817518248" y2="446" stroke="#111" stroke-width="2"/><text x="265.1824817518248" y="462" font-size="10.5" text-anchor="middle" fill="#111"><tspan x="265.1824817518248" dy="0.0">400</tspan></text><line x1="265.1824817518248" y1="440" x2="265.1824817518248" y2="90" stroke="#ddd" stroke-width="1" stroke-dasharray="3 4"/><line x1="469.5620437956204" y1="440" x2="469.5620437956204" y2="446" stroke="#111" stroke-width="2"/><text x="469.5620437956204" y="462" font-size="10.5" text-anchor="middle" fill="#111"><tspan x="469.5620437956204" dy="0.0">750</tspan></text><line x1="469.5620437956204" y1="440" x2="469.5620437956204" y2="90" stroke="#ddd" stroke-width="1" stroke-dasharray="3 4"/><line x1="732.3357664233577" y1="440" x2="732.3357664233577" y2="446" stroke="#111" stroke-width="2"/><text x="732.3357664233577" y="462" font-size="10.5" text-anchor="middle" fill="#111"><tspan x="732.3357664233577" dy="0.0">1200</tspan></text><line x1="732.3357664233577" y1="440" x2="732.3357664233577" y2="90" stroke="#ddd" stroke-width="1" stroke-dasharray="3 4"/><line x1="809.9999999999999" y1="440" x2="809.9999999999999" y2="446" stroke="#111" stroke-width="2"/><text x="809.9999999999999" y="462" font-size="10.5" text-anchor="middle" fill="#111"><tspan x="809.9999999999999" dy="0.0">1333</tspan></text><line x1="809.9999999999999" y1="440" x2="809.9999999999999" y2="90" stroke="#ddd" stroke-width="1" stroke-dasharray="3 4"/><path d="M90 120 C130 118 150 122 170 130 C300 190 450 240 600 300 C700 340 760 380 815 410" stroke="#c0392b" stroke-width="3.5" fill="none"/><text x="3