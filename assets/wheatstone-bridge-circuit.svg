<svg viewBox="0 0 460 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="460" height="380" fill="#ffffff"/>
<!-- diamond nodes -->
<circle cx="230" cy="60" r="3" fill="#000"/>
<text x="230" y="45" font-size="14" text-anchor="middle">A</text>
<circle cx="80" cy="200" r="3" fill="#000"/>
<text x="55" y="205" font-size="14" text-anchor="middle">B</text>
<circle cx="380" cy="200" r="3" fill="#000"/>
<text x="405" y="205" font-size="14" text-anchor="middle">D</text>
<circle cx="230" cy="340" r="3" fill="#000"/>
<text x="230" y="360" font-size="14" text-anchor="middle">C</text>
<!-- arms -->
<line x1="230" y1="60" x2="80" y2="200" stroke="#000" stroke-width="2"/>
<text x="130" y="115" font-size="14" text-anchor="middle">P</text>
<line x1="230" y1="60" x2="380" y2="200" stroke="#000" stroke-width="2"/>
<text x="330" y="115" font-size="14" text-anchor="middle">Q</text>
<line x1="80" y1="200" x2="230" y2="340" stroke="#000" stroke-width="2"/>
<text x="130" y="285" font-size="14" text-anchor="middle">R</text>
<line x1="380" y1="200" x2="230" y2="340" stroke="#000" stroke-width="2"/>
<text x="330" y="285" font-size="14" text-anchor="middle">S</text>
<!-- galvanometer bridge B-D -->
<line x1="80" y1="200" x2="180" y2="200" stroke="#000" stroke-width="2"/>
<circle cx="200" cy="200" r="20" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="200" y="205" font-size="13" text-anchor="middle">G</text>
<line x1="220" y1="200" x2="380" y2="200" stroke="#000" stroke-width="2"/>
<!-- battery A-C -->
<line x1="230" y1="60" x2="230" y2="20" stroke="#000" stroke-width="2"/>
<line x1="230" y1="340" x2="230" y2="20" stroke="#000" stroke-width="0" fill="none"/>
<path d="M230,20 L 10,20 L 10,340 L 230,340" stroke="#000" stroke-width="2" fill="none"/>
<line x1="0" y1="180" x2="20" y2="180" stroke="#000" stroke-width="4"/>
<line x1="5" y1="195" x2="15" y2="195" stroke="#000" stroke-width="2"/>
<text x="30" y="180" font-size="13">battery</text>
<text x="230" y="15" font-size="0"></text>
<text x="230" y="395" font-size="13" text-anchor="middle" font-weight="bold">Balance condition: P/Q = R/S</text>
<text x="230" y="20" font-size="16" text-anchor="middle" font-weight="bold" dy="-5">Wheatstone Bridge</text>
</svg>
