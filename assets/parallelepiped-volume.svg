<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300" font-family="Arial, Helvetica, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Parallelepiped with edges a, b, c</title>
  <rect width="520" height="300" fill="#ffffff"/>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1f3a8a"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#047857"/></marker>
  </defs>
  <polygon points="80,250 280,250 350,200 150,200" fill="#dbeafe" stroke="#1f3a8a" stroke-width="2"/>
  <polygon points="110,130 310,130 380,80 180,80" fill="none" stroke="#1f3a8a" stroke-width="2"/>
  <line x1="80" y1="250" x2="110" y2="130" stroke="#1f3a8a" stroke-width="2"/>
  <line x1="280" y1="250" x2="310" y2="130" stroke="#1f3a8a" stroke-width="2"/>
  <line x1="350" y1="200" x2="380" y2="80" stroke="#1f3a8a" stroke-width="2"/>
  <line x1="150" y1="200" x2="180" y2="80" stroke="#1f3a8a" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="80" y1="250" x2="280" y2="250" stroke="#b91c1c" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="80" y1="250" x2="150" y2="200" stroke="#7c3aed" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="80" y1="250" x2="110" y2="130" stroke="#d97706" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="215" y1="225" x2="215" y2="150" stroke="#047857" stroke-width="3" marker-end="url(#ag)"/>
  <line x1="110" y1="130" x2="110" y2="250" stroke="#555" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="170" y="270" fill="#b91c1c" font-weight="bold">b</text>
  <text x="105" y="212" fill="#7c3aed" font-weight="bold">c</text>
  <text x="62" y="190" fill="#d97706" font-weight="bold">a</text>
  <text x="222" y="170" fill="#047857" font-weight="bold">n = b × c (unit normal direction)</text>
  <text x="116" y="170" fill="#555">h</text>
  <text x="330" y="270" fill="#333">Volume = |b × c| · h = |a · (b × c)|</text>
</svg>
