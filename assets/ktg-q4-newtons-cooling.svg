<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc">
<title id="title">Newton's law of cooling curve</title><desc id="desc">Temperature-time graph showing a hot body cooling asymptotically toward a constant ambient temperature, with heat flow to the surroundings.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><marker id="bluearrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker><marker id="orangearrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ea580c"/></marker></defs>
<style>
 text{font-family:Inter,Arial,sans-serif;fill:#172033}
 .title{font-size:25px;font-weight:700}.sub{font-size:15px;fill:#475569}
 .label{font-size:16px;font-weight:600}.small{font-size:13px;fill:#475569}
 .tiny{font-size:11px;fill:#475569}
 .axis{stroke:#334155;stroke-width:2;fill:none}
 .grid{stroke:#cbd5e1;stroke-width:1;stroke-dasharray:4 5}
 .blue{stroke:#2563eb;fill:none;stroke-width:3}.orange{stroke:#ea580c;fill:none;stroke-width:3}
 .green{stroke:#059669;fill:none;stroke-width:3}.red{stroke:#dc2626;fill:none;stroke-width:2.5}
 .box{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5}
 .molecule{fill:#2563eb;stroke:#1e3a8a;stroke-width:1.5}
 .hot{fill:#f97316;stroke:#9a3412;stroke-width:1.5}
 .arrow{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}
 .dasharrow{stroke:#64748b;stroke-width:1.8;stroke-dasharray:5 4;fill:none;marker-end:url(#arrow)}
</style><rect width="1000" height="570" fill="#ffffff"/>
<text x="45" y="42" class="title">Newton's law of cooling: temperature approaches ambient exponentially</text>
<text x="45" y="68" class="sub">For a constant ambient temperature Tₐ, the excess temperature decays as e⁻ᵏᵗ.</text>
<g transform="translate(100,105)">
 <path d="M75 330 V20 M75 330 H790" class="axis"/>
 <text x="28" y="30" class="label">T</text><text x="795" y="355" class="label">Time, t</text>
 <path d="M75 270 H790" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7 5"/>
 <text x="95" y="258" class="small">Ambient temperature Tₐ</text>
 <path d="M75 55 C150 145 220 205 330 238 S560 267 790 270" class="orange"/>
 <circle cx="75" cy="55" r="6" fill="#ea580c"/><text x="90" y="48" class="label" style="fill:#c2410c">T₀</text>
 <path d="M220 135 L220 270" class="grid"/><path d="M220 135 L260 135" class="dasharrow"/>
 <text x="238" y="120" class="small">T(t) − Tₐ</text>
 <text x="450" y="190" class="label" style="fill:#c2410c">Cooling rate decreases</text>
 <text x="450" y="212" class="small">as T approaches Tₐ</text>
 <text x="95" y="390" class="small">Schematic curve: exact shape follows T(t) = Tₐ + (T₀ − Tₐ)e⁻ᵏᵗ.</text>
</g>
<g transform="translate(790,450)">
 <circle cx="0" cy="0" r="35" fill="#fed7aa" stroke="#ea580c" stroke-width="3"/>
 <path d="M-55 -8 L-95 -8 M-55 0 L-100 0 M-55 8 L-95 8" stroke="#ea580c" stroke-width="3" marker-end="url(#orangearrow)"/>
 <text x="-115" y="-28" text-anchor="end" class="small">Heat flows out</text>
 <text x="0" y="60" text-anchor="middle" class="small">Hot object</text>
</g>
</svg>