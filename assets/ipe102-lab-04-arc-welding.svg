<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
<style>.lbl{font-size:13px;fill:#222} .t{font-size:17px;font-weight:bold;fill:#111}</style>
<rect width="620" height="300" fill="#fff"/>
<text x="310" y="26" text-anchor="middle" class="t">Electric (Shielded Metal) Arc Welding</text>

<!-- welding machine -->
<rect x="30" y="150" width="90" height="60" fill="#999" stroke="#333"/>
<text x="75" y="225" text-anchor="middle" class="lbl">Welding machine (power source)</text>

<!-- cables -->
<path d="M120,170 C220,170 240,120 300,110" fill="none" stroke="#333" stroke-width="2"/>
<path d="M120,190 C260,220 320,205 350,195" fill="none" stroke="#c33" stroke-width="2"/>

<!-- electrode holder -->
<g transform="translate(300,90)">
<rect x="0" y="0" width="50" height="14" fill="#666" stroke="#333"/>
<line x1="50" y1="7" x2="90" y2="7" stroke="#ccc" stroke-width="4"/>
</g>
<text x="300" y="75" class="lbl">Electrode holder + coated electrode</text>

<!-- arc -->
<g>
<circle cx="392" cy="7" r="0"/>
<path d="M390,7 l6,10 -6,4 8,8" stroke="#f2c94c" stroke-width="3" fill="none" transform="translate(0,90)"/>
</g>
<text x="400" y="80" class="lbl" fill="#c33">Arc</text>

<!-- workpiece with joint / weld bead -->
<rect x="330" y="200" width="90" height="14" fill="#b0b0b0" stroke="#333"/>
<rect x="420" y="200" width="90" height="14" fill="#b0b0b0" stroke="#333"/>
<ellipse cx="420" cy="200" rx="20" ry="6" fill="#555"/>

<!-- work clamp -->
<line x1="120" y1="200" x2="420" y2="215" stroke="#333" stroke-width="1.5" stroke-dasharray="3,2"/>
<text x="420" y="240" text-anchor="middle" class="lbl">Weld bead (fused base metal + electrode filler)</text>
<text x="150" y="250" class="lbl">Heat generated by electric arc between electrode and workpiece melts both</text>
</svg>
