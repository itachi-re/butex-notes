<text x="174.0" y="266.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#52606d" text-anchor="middle">CH₃CH₂– is +I (electron-releasing)</text>
<text x="174.0" y="284.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#52606d" text-anchor="middle">charge on COO− intensified</text>
<text x="174.0" y="302.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#52606d" text-anchor="middle">less stable anion → weaker acid</text>
<text x="174.0" y="86.0" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#364fc7" text-anchor="middle" font-weight="700">pKa 4.87</text>
