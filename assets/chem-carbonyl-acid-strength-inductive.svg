<text x="810.0" y="244.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="700">chloroethanoate</text>
<text x="810.0" y="266.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#52606d" text-anchor="middle">Cl is strongly −I (electron-withdrawing)</text>
<text x="810.0" y="284.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#52606d" text-anchor="middle">charge dispersed over COO− and C–Cl</text>
<text x="810.0" y="302.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#52606d" text-anchor="middle">more stable anion → stronger acid</text>
<text x="810.0" y="86.0" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#364fc7" text-anchor="middle" font-weight="700">pKa 2.86</text>
<text x="24.0" y="352.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#102a43" text-anchor="start" font-weight="700">Stronger acid = more stable conjugate base (carboxylate). −I groups (Cl) stabilise it; +I groups (alkyl) destabilise it.  Strength: ClCH₂COOH &gt; CH₃COOH &gt; C₂H₅COOH</text></g>
</svg>
