<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 400" width="440" height="400" font-family="Arial, Helvetica, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Euler's formula on the unit circle</title>
  <rect width="440" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b91c1c"/></marker>
  </defs>
  <line x1="30" y1="200" x2="410" y2="200" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="220" y1="380" x2="220" y2="20" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <circle cx="220" cy="200" r="140" fill="none" stroke="#1f3a8a" stroke-width="2"/>
  <line x1="220" y1="200" x2="319" y2="101" stroke="#b91c1c" stroke-width="3" marker-end="url(#ar)"/>
  <line x1="319" y1="101" x2="319" y2="200" stroke="#047857" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="220" y1="101" x2="319" y2="101" stroke="#d97706" stroke-width="2" stroke-dasharray="6,4"/>
  <path d="M270,200 A50,50 0 0 0 255,165" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="272" y="188" fill="#333">θ</text>
  <text x="326" y="95" fill="#b91c1c" font-weight="bold">e^{iθ} = cos θ + i sin θ</text>
  <text x="325" y="155" fill="#047857">sin θ</text>
  <text x="255" y="94" fill="#d97706">cos θ</text>
  <text x="400" y="216" fill="#333">Re</text>
  <text x="228" y="28" fill="#333">Im</text>
  <text x="362" y="216" fill="#333">1</text>
  <text x="228" y="76" fill="#333">i</text>
  <text x="140" y="390" fill="#333">|e^{iθ}| = 1</text>
</svg>
