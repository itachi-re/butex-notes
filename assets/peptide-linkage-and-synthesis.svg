<svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg" font-family="Arial" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<text x="280" y="20" text-anchor="middle" font-weight="bold">Peptide linkage and synthesis of Gly–Ala</text>

<text x="20" y="55" font-weight="bold">Peptide (amide) linkage:</text>
<text x="30" y="78" font-size="13">R¹–CH(NH₂)–CO–NH–CH(R²)–COOH</text>
<text x="30" y="98" font-size="11">–CO–NH– bond formed between –COOH of one amino acid and –NH₂ of next (loss of H₂O)</text>

<text x="20" y="140" font-weight="bold">Synthesis of Gly–Ala (via carbobenzoxy / Bergmann method):</text>
<text x="20" y="163" font-size="11">1. Protect amine of glycine: Gly–NH₂ + C₆H₅CH₂OCOCl → Cbz–NH–CH₂–COOH</text>
<text x="20" y="183" font-size="11">   (carbobenzoxy-glycine; –NH₂ protected as Cbz group)</text>
<text x="20" y="205" font-size="11">2. Activate –COOH: Cbz–Gly–COOH + SOCl₂ → Cbz–Gly–COCl (acid chloride)</text>
<text x="20" y="227" font-size="11">3. Couple with alanine: Cbz–Gly–COCl + H₂N–CH(CH₃)–COOH →</text>
<text x="40" y="247" font-size="11">Cbz–Gly–CO–NH–CH(CH₃)–COOH (protected dipeptide)</text>
<text x="20" y="269" font-size="11">4. Deprotect: H₂/Pd (catalytic hydrogenolysis) removes Cbz group →</text>
<text x="40" y="289" font-size="11">H₂N–CH₂–CO–NH–CH(CH₃)–COOH  =  Gly–Ala dipeptide</text>
</svg>
