<svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="480" height="320" fill="#ffffff"/>
<!-- tilted loop as parallelogram -->
<polygon points="150,220 330,220 380,120 200,120" fill="none" stroke="#000" stroke-width="2"/>
<text x="150" y="240" font-size="12">current i</text>
<line x1="150" y1="220" x2="200" y2="120" stroke="#000" stroke-width="1" marker-end="url(#ah)"/>
<!-- normal vector n -->
<line x1="265" y1="170" x2="330" y2="90" stroke="#c00000" stroke-width="2" marker-end="url(#ar)"/>
<text x="335" y="85" font-size="14" fill="#c00000">n&#0770; (area vector)</text>
<!-- B field arrows -->
<g stroke="#1a5fb4" stroke-width="1.5">
<line x1="60" y1="60" x2="60" y2="270" marker-end="url(#ab)"/>
<line x1="120" y1="60" x2="120" y2="270" marker-end="url(#ab)"/>
<line x1="400" y1="60" x2="400" y2="270" marker-end="url(#ab)"/>
<line x1="440" y1="60" x2="440" y2="270" marker-end="url(#ab)"/>
</g>
<text x="60" y="50" font-size="14" fill="#1a5fb4" text-anchor="middle">B</text>
<!-- torque vector -->
<line x1="265" y1="170" x2="265" y2="90" stroke="#0a7d29" stroke-width="2" marker-end="url(#ag)"/>
<text x="270" y="75" font-size="13" fill="#0a7d29">&#964; = m &#215; B</text>
<defs>
<marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#000"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#c00000"/></marker>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1a5fb4"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0a7d29"/></marker>
</defs>
<text x="240" y="20" font-size="16" text-anchor="middle" font-weight="bold">Torque on a Current Loop in Field B</text>
<text x="240" y="300" font-size="12" text-anchor="middle">&#964; = NiAB sin&#952;, &#952; = angle between n&#0770; and B</text>
</svg>
