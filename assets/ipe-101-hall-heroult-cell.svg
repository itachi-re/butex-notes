<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440" role="img" aria-label="Hall-Héroult electrolytic cell"><rect x="0.5" y="0.5" width="779" height="439" rx="10" fill="#ffffff" stroke="#d1d5db"/><text x="390.0" y="24.0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">Hall-Héroult electrolytic cell</text><rect x="110.0" y="150.0" width="460.0" height="220.0" rx="0" fill="#6b7280" stroke="#1f2937" stroke-width="2.5"/><rect x="130.0" y="150.0" width="420.0" height="200.0" rx="0" fill="#374151" stroke="#1f2937" stroke-width="1.5"/><rect x="145.0" y="172.0" width="390.0" height="150.0" rx="0" fill="#fde68a" stroke="#ea580c" stroke-width="1.5" fill-opacity="0.9"/><text x="155.7" y="246.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#78350f" font-weight="bold" xml:space="preserve">Molten electrolyte: Al</text><text x="271.5" y="248.3" font-family="Arial, Helvetica, sans-serif" font-size="8.0" fill="#78350f" font-weight="bold" xml:space="preserve">2</text><text x="276.0" y="246.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#78350f" font-weight="bold" xml:space="preserve">O</text><text x="284.9" y="248.3" font-family="Arial, Helvetica, sans-serif" font-size="8.0" fill="#78350f" font-weight="bold" xml:space="preserve">3</text><text x="289.4" y="246.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#78350f" font-weight="bold" xml:space="preserve"> dissolved in cryolite (Na</text><text x="424.9" y="248.3" font-family="Arial, Helvetica, sans-serif" font-size="8.0" fill="#78350f" font-weight="bold" xml:space="preserve">3</text><text x="429.3" y="246.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#78350f" font-weight="bold" xml:space="preserve">AlF</text><text x="447.8" y="248.3" font-family="Arial, Helvetica, sans-serif" font-size="8.0" fill="#78350f" font-weight="bold" xml:space="preserve">6</text><text x="452.3" y="246.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#78350f" font-weight="bold" xml:space="preserve">) + AlF</text><text x="487.3" y="248.3" font-family="Arial, Helvetica, sans-serif" font-size="8.0" fill="#78350f" font-weight="bold" xml:space="preserve">3</text><text x="491.8" y="246.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#78350f" font-weight="bold" xml:space="preserve">, CaF</text><text x="519.9" y="248.3" font-family="Arial, Helvetica, sans-serif" font-size="8.0" fill="#78350f" font-weight="bold" xml:space="preserve">2</text><text x="340.0" y="262.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#78350f" text-anchor="middle" font-weight="normal">≈ 950-980 °C</text><rect x="145.0" y="290.0" width="390.0" height="32.0" rx="0" fill="#d1d5db" stroke="#1f2937" stroke-width="1.5"/><text x="340.0" y="311.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="bold">Molten aluminium pool (denser, sinks) - acts as cathode</text><rect x="186.0" y="90.0" width="48.0" height="120.0" rx="0" fill="#1f2937" stroke="#1f2937" stroke-width="1.5"/><text x="210.0" y="150.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">C</text><rect x="316.0" y="90.0" width="48.0" height="120.0" rx="0" fill="#1f2937" stroke="#1f2937" stroke-width="1.5"/><text x="340.0" y="150.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">C</text><rect x="446.0" y="90.0" width="48.0" height="120.0" rx="0" fill="#1f2937" stroke="#1f2937" stroke-width="1.5"/><text x="470.0" y="150.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">C</text><rect x="150.0" y="160.0" width="380.0" height="8.0" rx="0" fill="#9ca3af" stroke="#1f2937" stroke-width="1" fill-opacity="0.8"/><text x="340.0" y="80.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="bold">Carbon anodes (+)</text><path d="M210,90 L210,60 L340,60 L340,90" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M470,90 L470,60 L340,60" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="340.0" y="52.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="bold">(+)  4-5 V, 100-300 kA DC</text><line x1="110.0" y1="360.0" x2="70.0" y2="360.0" stroke="#16a34a" stroke-width="2.2" stroke-linecap="round"/><text x="66.0" y="364.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#16a34a" text-anchor="end" font-weight="bold">(−)</text><text x="590.0" y="150.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#16a34a" text-anchor="start" font-weight="bold">Cathode:</text><text x="590.0" y="168.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#16a34a" font-weight="normal" xml:space="preserve">Al</text><text x="601.1" y="163.2" font-family="Arial, Helvetica, sans-serif" font-size="8.8" fill="#16a34a" font-weight="normal" xml:space="preserve">3+</text><text x="611.1" y="168.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#16a34a" font-weight="normal" xml:space="preserve"> + 3e</text><text x="639.2" y="163.2" font-family="Arial, Helvetica, sans-serif" font-size="8.8" fill="#16a34a" font-weight="normal" xml:space="preserve">-</text><text x="642.2" y="168.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#16a34a" font-weight="normal" xml:space="preserve"> → Al(l)</text><text x="590.0" y="200.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#dc2626" text-anchor="start" font-weight="bold">Anode:</text><text x="590.0" y="218.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#dc2626" font-weight="normal" xml:space="preserve">2O</text><text x="606.7" y="213.2" font-family="Arial, Helvetica, sans-serif" font-size="8.8" fill="#dc2626" font-weight="normal" xml:space="preserve">2-</text><text x="614.5" y="218.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#dc2626" font-weight="normal" xml:space="preserve"> + C → CO</text><text x="675.9" y="220.5" font-family="Arial, Helvetica, sans-serif" font-size="8.8" fill="#dc2626" font-weight="normal" xml:space="preserve">2</text><text x="680.8" y="218.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#dc2626" font-weight="normal" xml:space="preserve"> + 4e</text><text x="708.9" y="213.2" font-family="Arial, Helvetica, sans-serif" font-size="8.8" fill="#dc2626" font-weight="normal" xml:space="preserve">-</text><text x="590.0" y="252.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#111827" text-anchor="start" font-weight="bold">Overall:</text><text x="590.0" y="270.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#111827" font-weight="normal" xml:space="preserve">2Al</text><text x="608.1" y="272.5" font-family="Arial, Helvetica, sans-serif" font-size="8.8" fill="#111827" font-weight="normal" xml:space="preserve">2</text><text x="612.9" y="270.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#111827" font-weight="normal" xml:space="preserve">O</text><text x="622.7" y="272.5" font-family="Arial, Helvetica, sans-serif" font-size="8.8" fill="#111827" font-weight="normal" xml:space="preserve">3</text><text x="627.5" y="270.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#111827" font-weight="normal" xml:space="preserve"> + 3C → 4Al + 3CO</text><text x="735.2" y="272.5" font-family="Arial, Helvetica, sans-serif" font-size="8.8" fill="#111827" font-weight="normal" xml:space="preserve">2</text><text x="590.0" y="304.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">Anodes burn away and</text><text x="590.0" y="320.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">must be replaced.</text><text x="590.0" y="346.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">Al tapped from the bottom</text><text x="590.0" y="362.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">periodically (siphon).</text><text x="340.0" y="410.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal">Cryolite lowers the melting point of alumina from ≈2050 °C to ≈ 950 °C and makes the melt conductive.</text></svg>