<svg xmlns="http://www.w3.org/2000/svg" width="940" height="380" viewBox="0 0 940 380" role="img" aria-label="Compression moulding (thermosets)"><defs><marker id="ahdc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah1f2937" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.5" y="0.5" width="939" height="379" rx="10" fill="#ffffff" stroke="#d1d5db"/><text x="470.0" y="24.0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">Compression moulding (thermosets)</text><text x="150.0" y="56.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold">1  Load charge (dies open)</text><rect x="40.0" y="78.0" width="220.0" height="26.0" rx="0" fill="#9ca3af" stroke="#1f2937" stroke-width="2"/><text x="150.0" y="96.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#111827" text-anchor="middle" font-weight="normal">upper die (heated)</text><rect x="40.0" y="200.0" width="220.0" height="34.0" rx="0" fill="#9ca3af" stroke="#1f2937" stroke-width="2"/><text x="150.0" y="222.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#111827" text-anchor="middle" font-weight="normal">lower die / cavity (heated)</text><path d="M90,200 L90,170 L210,170 L210,200" fill="none" stroke="#1f2937" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="150.0" cy="192.0" r="8.0" fill="#fb923c" stroke="#1f2937" stroke-width="1.2"/><circle cx="132.0" cy="190.0" r="6.0" fill="#fb923c" stroke="#1f2937" stroke-width="1.2"/><circle cx="168.0" cy="190.0" r="6.0" fill="#fb923c" stroke="#1f2937" stroke-width="1.2"/><text x="150.0" y="160.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#7c2d12" text-anchor="middle" font-weight="normal">charge: resin + filler (powder / preform)</text><text x="470.0" y="56.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold">2  Close dies: heat + pressure</text><rect x="360.0" y="120.0" width="220.0" height="26.0" rx="0" fill="#9ca3af" stroke="#1f2937" stroke-width="2"/><text x="470.0" y="138.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#111827" text-anchor="middle" font-weight="normal">upper die</text><rect x="360.0" y="200.0" width="220.0" height="34.0" rx="0" fill="#9ca3af" stroke="#1f2937" stroke-width="2"/><path d="M410,200 L410,146 L530,146 L530,200" fill="none" stroke="#1f2937" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="412.0" y="148.0" width="116.0" height="52.0" rx="0" fill="#fdba74" stroke="#1f2937" stroke-width="0"/><line x1="410.0" y1="80.0" x2="410.0" y2="118.0" stroke="#dc2626" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ahdc2626)"/><line x1="470.0" y1="80.0" x2="470.0" y2="118.0" stroke="#dc2626" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ahdc2626)"/><line x1="530.0" y1="80.0" x2="530.0" y2="118.0" stroke="#dc2626" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ahdc2626)"/><text x="470.0" y="72.0" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="bold">pressure + heat</text><text x="470.0" y="262.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#374151" text-anchor="middle" font-weight="normal">material flows, fills cavity,</text><text x="470.0" y="276.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#374151" text-anchor="middle" font-weight="normal">cross-links (cures) → rigid</text><text x="790.0" y="56.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold">3  Open &amp; eject</text><rect x="680.0" y="200.0" width="220.0" height="34.0" rx="0" fill="#9ca3af" stroke="#1f2937" stroke-width="2"/><path d="M730,200 L730,170 L850,170 L850,200" fill="none" stroke="#1f2937" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="740.0" y="140.0" width="100.0" height="60.0" rx="4" fill="#fdba74" stroke="#1f2937" stroke-width="1.8"/><text x="790.0" y="128.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#16a34a" text-anchor="middle" font-weight="bold">ejector pins push part out</text><text x="790.0" y="262.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#374151" text-anchor="middle" font-weight="normal">trim flash; finished part</text><text x="790.0" y="276.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#374151" text-anchor="middle" font-weight="normal">(not re-meltable)</text><line x1="285.0" y1="150.0" x2="330.0" y2="150.0" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah1f2937)"/><line x1="605.0" y1="150.0" x2="650.0" y2="150.0" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah1f2937)"/><text x="470.0" y="330.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#374151" text-anchor="middle" font-weight="normal">Products: electrical switches, plugs, Bakelite handles, melamine crockery, car parts (SMC/BMC).</text><text x="470.0" y="350.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal">Advantages: cheap tooling, low waste, good for large flat parts.  Limits: slower cycle, flash, limited shape complexity.</text></svg>