<rect x="30.0" y="500.0" width="1040.0" height="85.0" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
<text x="550.0" y="524.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#5b21b6" font-weight="bold">C₆H₅NH₂ + NaNO₂ + 2 HCl  →  C₆H₅N₂⁺Cl⁻ + NaCl + 2 H₂O</text>
<text x="550.0" y="548.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="normal">Mechanism: HNO₂ + H⁺ → NO⁺ ;  ArNH₂ + NO⁺ → ArNH–N=O → Ar–N=N–OH → Ar–N≡N⁺  (– H₂O)</text>
<text x="550.0" y="570.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="normal">Kept at 0–5 °C because the diazonium ion decomposes to phenol + N₂ on warming; aliphatic amines give unstable diazonium ions.</text>
</svg>
