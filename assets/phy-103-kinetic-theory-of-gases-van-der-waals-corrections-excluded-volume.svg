<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300">
    <rect width="500" height="300" fill="#ffffff"/>
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 Z" fill="#000"/>
        </marker>
    </defs>
    <!-- Container -->
    <rect x="50" y="50" width="400" height="200" fill="none" stroke="#333" stroke-width="3"/>
    
    <!-- Bulk molecule -->
    <circle cx="250" cy="150" r="15" fill="#0072b2"/>
    <text x="245" y="155" font-family="sans-serif" font-size="14" fill="#fff">A</text>
    
    <!-- Attraction forces -->
    <path d="M 250,150 L 250,100" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 250,150 L 250,200" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 250,150 L 200,150" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 250,150 L 300,150" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Wall molecule -->
    <circle cx="430" cy="150" r="15" fill="#d55e00"/>
    <text x="425" y="155" font-family="sans-serif" font-size="14" fill="#fff">B</text>
    
    <!-- Inward pull on wall molecule -->
    <path d="M 430,150 L 380,120" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 430,150 L 380,180" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 430,150 L 370,150" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Text -->
    <text x="180" y="280" font-family="sans-serif" font-size="14">Bulk: Net force = 0</text>
    <text x="350" y="280" font-family="sans-serif" font-size="14">Wall: Net inward force</text>
    
    <!-- Excluded volume drawing -->
    <circle cx="100" cy="100" r="15" fill="#009e73"/>
    <circle cx="130" cy="100" r="15" fill="#009e73"/>
    <circle cx="115" cy="100" r="30" fill="none" stroke="#009e73" stroke-dasharray="4,4"/>
    <text x="60" y="150" font-family="sans-serif" font-size="12">Excluded volume</text>
</svg>