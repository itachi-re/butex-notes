<svg viewBox="0 0 560 260" xmlns="http://www.w3.org/2000/svg" font-family="Arial" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<text x="280" y="20" text-anchor="middle" font-weight="bold">Amino acid: neutral form, zwitterion, and isoelectric point</text>

<text x="60" y="60" font-size="13">H₂N–CH(R)–COOH</text>
<text x="60" y="80" font-size="11">(un-ionised / non-existent form)</text>

<line x1="200" y1="60" x2="250" y2="60" stroke="black" marker-end="url(#a)"/>
<text x="225" y="50" text-anchor="middle" font-size="10">intramolecular</text>
<text x="225" y="80" text-anchor="middle" font-size="10">proton transfer</text>

<text x="270" y="60" font-size="13">H₃N⁺–CH(R)–COO⁻</text>
<text x="270" y="80" font-size="11">Zwitterion (dipolar ion, actual solid-state form)</text>

<text x="20" y="130" font-weight="bold">Isoelectric point (pI):</text>
<text x="20" y="152" font-size="11">pH at which the amino acid exists predominantly as the</text>
<text x="20" y="170" font-size="11">zwitterion (net charge = 0); it neither migrates to anode</text>
<text x="20" y="188" font-size="11">nor cathode under an electric field. pI = ½(pKa₁ + pKa₂) for</text>
<text x="20" y="206" font-size="11">simple amino acids (no ionisable side chain).</text>

<text x="80" y="240" font-size="12">low pH: H₃N⁺–CH(R)–COOH (cation) ⇌ pI: H₃N⁺–CH(R)–COO⁻ (zwitterion) ⇌ high pH: H₂N–CH(R)–COO⁻ (anion)</text>
</svg>
