<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Comparison of auto, register, static and extern storage classes" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Comparison of auto, register, static and extern storage classes</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker></defs>
<rect x="0.5" y="0.5" width="899" height="299" fill="#ffffff" stroke="#cfd8dc" rx="8"/>
<text x="450" y="27.6" font-size="16" text-anchor="middle" font-weight="bold" fill="#1a1a1a" ><tspan x="450" dy="0">The four storage classes of C</tspan></text><rect x="30" y="40" width="120" height="36" fill="#1565c0" stroke="#0d47a1" stroke-width="1.5"/><text x="90.0" y="62.55" font-size="13" text-anchor="middle" font-weight="bold" fill="#ffffff" ><tspan x="90.0" dy="0">Class</tspan></text><rect x="150" y="40" width="90" height="36" fill="#1565c0" stroke="#0d47a1" stroke-width="1.5"/><text x="195.0" y="62.55" font-size="13" text-anchor="middle" font-weight="bold" fill="#ffffff" ><tspan x="195.0" dy="0">Keyword</tspan></text><rect x="240" y="40" width="190" height="36" fill="#1565c0" stroke="#0d47a1" stroke-width="1.5"/><text x="335.0" y="62.55" font-size="13" text-anchor="middle" font-weight="bold" fill="#ffffff" ><tspan x="335.0" dy="0">Stored in</tspan></text><rect x="430" y="40" width="110" height="36" fill="#1565c0" stroke="#0d47a1" stroke-width="1.5"/><text x="485.0" y="62.55" font-size="13" text-anchor="middle" font-weight="bold" fill="#ffffff" ><tspan x="485.0" dy="0">Default value</tspan></text><rect x="540" y="40" width="170" height="36" fill="#1565c0" stroke="#0d47a1" stroke-width="1.5"/><text x="625.0" y="62.55" font-size="13" text-anchor="middle" font-weight="bold" fill="#ffffff" ><tspan x="625.0" dy="0">Scope</tspan></text><rect x="710" y="40" width="170" height="36" fill="#1565c0" stroke="#0d47a1" stroke-width="1.5"/><text x="795.0" y="62.55" font-size="13" text-anchor="middle" font-weight="bold" fill="#ffffff" ><tspan x="795.0" dy="0">Lifetime</tspan></text><rect x="30" y="76" width="120" height="52" fill="#f5f9ff" stroke="#90a4ae" stroke-width="1.5"/><text x="90.0" y="106.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="90.0" dy="0">Automatic</tspan></text><rect x="150" y="76" width="90" height="52" fill="#f5f9ff" stroke="#90a4ae" stroke-width="1.5"/><text x="195.0" y="106.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a" font-family="Consolas, Menlo, monospace"><tspan x="195.0" dy="0">auto</tspan></text><rect x="240" y="76" width="190" height="52" fill="#f5f9ff" stroke="#90a4ae" stroke-width="1.5"/><text x="335.0" y="106.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="335.0" dy="0">Stack (RAM)</tspan></text><rect x="430" y="76" width="110" height="52" fill="#f5f9ff" stroke="#90a4ae" stroke-width="1.5"/><text x="485.0" y="106.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="485.0" dy="0">garbage</tspan></text><rect x="540" y="76" width="170" height="52" fill="#f5f9ff" stroke="#90a4ae" stroke-width="1.5"/><text x="625.0" y="106.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="625.0" dy="0">Local to block</tspan></text><rect x="710" y="76" width="170" height="52" fill="#f5f9ff" stroke="#90a4ae" stroke-width="1.5"/><text x="795.0" y="106.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="795.0" dy="0">Until block ends</tspan></text><rect x="30" y="128" width="120" height="52" fill="#ffffff" stroke="#90a4ae" stroke-width="1.5"/><text x="90.0" y="158.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="90.0" dy="0">Register</tspan></text><rect x="150" y="128" width="90" height="52" fill="#ffffff" stroke="#90a4ae" stroke-width="1.5"/><text x="195.0" y="158.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a" font-family="Consolas, Menlo, monospace"><tspan x="195.0" dy="0">register</tspan></text><rect x="240" y="128" width="190" height="52" fill="#ffffff" stroke="#90a4ae" stroke-width="1.5"/><text x="335.0" y="150.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="335.0" dy="0">CPU register</tspan><tspan x="335.0" dy="15.0">(else stack)</tspan></text><rect x="430" y="128" width="110" height="52" fill="#ffffff" stroke="#90a4ae" stroke-width="1.5"/><text x="485.0" y="158.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="485.0" dy="0">garbage</tspan></text><rect x="540" y="128" width="170" height="52" fill="#ffffff" stroke="#90a4ae" stroke-width="1.5"/><text x="625.0" y="158.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="625.0" dy="0">Local to block</tspan></text><rect x="710" y="128" width="170" height="52" fill="#ffffff" stroke="#90a4ae" stroke-width="1.5"/><text x="795.0" y="158.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="795.0" dy="0">Until block ends</tspan></text><rect x="30" y="180" width="120" height="52" fill="#f5f9ff" stroke="#90a4ae" stroke-width="1.5"/><text x="90.0" y="210.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="90.0" dy="0">Static</tspan></text><rect x="150" y="180" width="90" height="52" fill="#f5f9ff" stroke="#90a4ae" stroke-width="1.5"/><text x="195.0" y="210.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a" font-family="Consolas, Menlo, monospace"><tspan x="195.0" dy="0">static</tspan></text><rect x="240" y="180" width="190" height="52" fill="#f5f9ff" stroke="#90a4ae" stroke-width="1.5"/><text x="335.0" y="210.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="335.0" dy="0">Data segment</tspan></text><rect x="430" y="180" width="110" height="52" fill="#f5f9ff" stroke="#90a4ae" stroke-width="1.5"/><text x="485.0" y="210.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="485.0" dy="0">0</tspan></text><rect x="540" y="180" width="170" height="52" fill="#f5f9ff" stroke="#90a4ae" stroke-width="1.5"/><text x="625.0" y="202.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="625.0" dy="0">Local to block</tspan><tspan x="625.0" dy="15.0">(or file if global)</tspan></text><rect x="710" y="180" width="170" height="52" fill="#f5f9ff" stroke="#90a4ae" stroke-width="1.5"/><text x="795.0" y="210.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="795.0" dy="0">Whole program run</tspan></text><rect x="30" y="232" width="120" height="52" fill="#ffffff" stroke="#90a4ae" stroke-width="1.5"/><text x="90.0" y="262.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="90.0" dy="0">External</tspan></text><rect x="150" y="232" width="90" height="52" fill="#ffffff" stroke="#90a4ae" stroke-width="1.5"/><text x="195.0" y="262.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a" font-family="Consolas, Menlo, monospace"><tspan x="195.0" dy="0">extern</tspan></text><rect x="240" y="232" width="190" height="52" fill="#ffffff" stroke="#90a4ae" stroke-width="1.5"/><text x="335.0" y="262.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="335.0" dy="0">Data segment</tspan></text><rect x="430" y="232" width="110" height="52" fill="#ffffff" stroke="#90a4ae" stroke-width="1.5"/><text x="485.0" y="262.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="485.0" dy="0">0</tspan></text><rect x="540" y="232" width="170" height="52" fill="#ffffff" stroke="#90a4ae" stroke-width="1.5"/><text x="625.0" y="254.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="625.0" dy="0">Global</tspan><tspan x="625.0" dy="15.0">(all files)</tspan></text><rect x="710" y="232" width="170" height="52" fill="#ffffff" stroke="#90a4ae" stroke-width="1.5"/><text x="795.0" y="262.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="795.0" dy="0">Whole program run</tspan></text>
</svg>