<svg viewBox="0 0 620 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="620" height="260" fill="#ffffff"/>
<text x="310" y="24" text-anchor="middle" font-size="16" font-weight="bold">Chromophore &amp; Auxochrome (example: Azobenzene &#8594; dye)</text>

<!-- ring 1 -->
<polygon points="60,120 100,100 140,110 145,145 105,165 65,155" fill="none" stroke="#222" stroke-width="2"/>
<!-- azo bridge -->
<line x1="145" y1="145" x2="200" y2="130" stroke="#a83232" stroke-width="3"/>
<text x="172" y="118" font-size="12" fill="#a83232" font-weight="bold">N=N</text>
<!-- ring 2 -->
<polygon points="200,130 240,110 280,120 285,155 245,175 205,165" fill="none" stroke="#222" stroke-width="2"/>
<!-- auxochrome NMe2 -->
<line x1="285" y1="155" x2="330" y2="165" stroke="#1f5fa8" stroke-width="2"/>
<text x="335" y="170" font-size="13" fill="#1f5fa8" font-weight="bold">N(CH&#8323;)&#8322; (auxochrome)</text>

<rect x="20" y="195" width="270" height="55" rx="6" fill="#ffe8e8" stroke="#a83232"/>
<text x="155" y="215" text-anchor="middle" font-size="12" font-weight="bold">Chromophore: &#8211;N=N&#8211; (azo)</text>
<text x="155" y="233" text-anchor="middle" font-size="11">unsaturated group responsible for colour absorption</text>

<rect x="320" y="195" width="280" height="55" rx="6" fill="#eef5ff" stroke="#1f5fa8"/>
<text x="460" y="215" text-anchor="middle" font-size="12" font-weight="bold">Auxochrome: &#8211;NR&#8322;, &#8211;OH, &#8211;NH&#8322;</text>
<text x="460" y="233" text-anchor="middle" font-size="11">electron-donating group deepening colour &amp; aiding fibre binding</text>
</svg>
