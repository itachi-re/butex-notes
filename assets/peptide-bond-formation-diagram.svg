<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Georgia, serif" font-size="15" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="760" height="300" fill="#fff"/>
<text x="20" y="28" font-size="18" font-weight="bold">Peptide bond formation (condensation, loss of H2O)</text>

<text x="30" y="80" font-size="16">H2N–CHR1–COOH   +   H2N–CHR2–COOH</text>
<text x="60" y="102" font-size="13" fill="#555">amino acid 1 (α-carboxyl reacts)</text>
<text x="420" y="102" font-size="13" fill="#555">amino acid 2 (α-amino reacts)</text>

<line x1="330" y1="120" x2="330" y2="150" stroke="black" marker-end="url(#a2)"/>
<defs><marker id="a2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z"/></marker></defs>
<text x="340" y="140" font-size="13">− H2O</text>

<text x="30" y="190" font-size="16">H2N–CHR1–CO–NH–CHR2–COOH</text>
<line x1="160" y1="170" x2="240" y2="170" stroke="#c00" stroke-width="2"/>
<text x="165" y="215" font-size="13" fill="#c00">peptide (amide) bond — planar, partial C–N</text>
<text x="165" y="233" font-size="13" fill="#c00">double-bond character (restricted rotation)</text>

<text x="20" y="265" font-size="14" fill="#555">The –CO–NH– link is planar due to resonance delocalisation of the N lone pair into</text>
<text x="20" y="285" font-size="14" fill="#555">the carbonyl π-system, which is why peptide backbones adopt a flat, rigid geometry.</text>
</svg>
