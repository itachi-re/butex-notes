<text x='370' y='200' font-size='13' font-family='Arial,Helvetica,sans-serif' font-weight='700'  fill='#065' text-anchor='middle'>D-erythrose</text>
<text x='370' y='236' font-size='13' font-family='Arial,Helvetica,sans-serif' font-weight='700'  fill='#065' text-anchor='middle'>D-threose</text>
