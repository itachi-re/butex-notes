<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .lbl{font-size:14px;fill:#1a1a1a;}
    .small{font-size:12px;fill:#333;}
    .arrow{stroke:#33475b;stroke-width:2;marker-end:url(#ah8);fill:none;}
    .box{fill:#f5f8fc;stroke:#33475b;stroke-width:1.5;}
  </style>
  <defs>
    <marker id="ah8" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#33475b"/>
    </marker>
  </defs>

  <text x="450" y="22" text-anchor="middle" font-size="17" font-weight="bold">Kiliani–Fischer Synthesis (aldose → next higher aldose)</text>

  <rect class="box" x="20" y="45" width="140" height="45" rx="6"/>
  <text x="90" y="72" text-anchor="middle" class="lbl">R-CHO (Cn)</text>
  <path class="arrow" d="M160,68 H220"/>
  <text x="190" y="58" text-anchor="middle" class="small">HCN</text>
  <rect class="box" x="220" y="45" width="150" height="45" rx="6"/>
  <text x="295" y="72" text-anchor="middle" class="lbl">R-CH(OH)-CN</text>
  <text x="295" y="100" text-anchor="middle" class="small">cyanohydrin (mixture of 2 epimers)</text>
  <path class="arrow" d="M370,68 H430"/>
  <text x="400" y="58" text-anchor="middle" class="small">H2/Pd-BaSO4</text>
  <rect class="box" x="430" y="45" width="180" height="45" rx="6"/>
  <text x="520" y="72" text-anchor="middle" class="lbl">R-CH(OH)-CH=NH</text>
  <path class="arrow" d="M610,68 H660"/>
  <text x="635" y="58" text-anchor="middle" class="small">H2O</text>
  <rect class="box" x="660" y="45" width="200" height="45" rx="6"/>
  <text x="760" y="72" text-anchor="middle" class="lbl">R-CH(OH)-CHO (Cn+1)</text>
  <text x="760" y="105" text-anchor="middle" class="small" font-weight="bold">next higher aldose (+1 C)</text>

  <text x="450" y="150" text-anchor="middle" font-weight="bold" font-size="14">Wohl / Ruff degradation (aldose → next lower aldose, reverse direction)</text>
  <rect class="box" x="80" y="170" width="200" height="45" rx="6"/>
  <text x="180" y="197" text-anchor="middle" class="lbl">R-CH(OH)-CHO (Cn)</text>
  <path class="arrow" d="M280,192 H360"/>
  <text x="320" y="182" text-anchor="middle" class="small">Ruff: Br2/H2O then</text>
  <text x="320" y="212" text-anchor="middle" class="small">H2O2 / Fe2(SO4)3</text>
  <rect class="box" x="360" y="170" width="150" height="45" rx="6"/>
  <text x="435" y="197" text-anchor="middle" class="lbl">R-COOH (Cn) acid</text>
  <path class="arrow" d="M510,192 H570"/>
  <rect class="box" x="570" y="170" width="150" height="45" rx="6"/>
  <text x="645" y="197" text-anchor="middle" class="lbl">R-CHO (Cn-1)</text>
  <text x="645" y="230" text-anchor="middle" class="small" font-weight="bold">one carbon fewer (-1 C)</text>
</svg>
