<svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="480" height="320" fill="#ffffff"/>
<line x1="60" y1="270" x2="440" y2="270" stroke="#000" stroke-width="1.5"/>
<line x1="60" y1="270" x2="60" y2="40" stroke="#000" stroke-width="1.5"/>
<text x="440" y="290" font-size="14" text-anchor="end">Volume V</text>
<text x="30" y="150" font-size="14" transform="rotate(-90 30 150)">Pressure P</text>
<!-- both start at same point -->
<circle cx="110" cy="80" r="3" fill="#000"/>
<!-- isothermal PV = const -->
<path d="M110,80 C 180,100 320,190 420,255" stroke="#1a5fb4" stroke-width="2" fill="none"/>
<text x="330" y="180" font-size="13" fill="#1a5fb4">Isothermal (PV = const)</text>
<!-- adiabatic PV^gamma = const, steeper -->
<path d="M110,80 C 150,120 260,220 320,260" stroke="#c00000" stroke-width="2" fill="none"/>
<text x="180" y="230" font-size="13" fill="#c00000">Adiabatic (PV^&#947; = const)</text>
<text x="240" y="20" font-size="16" text-anchor="middle" font-weight="bold">Isothermal vs Adiabatic P-V Curves</text>
<text x="240" y="305" font-size="12" text-anchor="middle">Adiabatic curve falls more steeply (&#947; &gt; 1) than isothermal from the same starting point</text>
</svg>
