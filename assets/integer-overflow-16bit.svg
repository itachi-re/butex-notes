al" fill="#455a64" ><tspan x="664" dy="0">1</tspan></text><rect x="644" y="64" width="40" height="44" fill="#ffe082" stroke="#f9a825" stroke-width="1.5"/><text x="664.0" y="91.6" font-size="16" text-anchor="middle" font-weight="bold" fill="#1a1a1a" font-family="Consolas, Menlo, monospace"><tspan x="664.0" dy="0">1</tspan></text><text x="704" y="59.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#455a64" ><tspan x="704" dy="0">0</tspan></text><rect x="684" y="64" width="40" height="44" fill="#eceff1" stroke="#90a4ae" stroke-width="1.5"/><text x="704.0" y="91.6" font-size="16" text-anchor="middle" font-weight="bold" fill="#1a1a1a" font-family="Consolas, Menlo, monospace"><tspan x="704.0" dy="0">0</tspan></text><text x="80" y="130.2" font-size="12" text-anchor="middle" font-weight="bold" fill="#c62828" ><tspan x="80" dy="0">↑ sign bit = 1</tspan></text><text x="380" y="164.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" font-family="Consolas, Menlo, monospace"><tspan x="380" dy="0">32790 as unsigned 16-bit  =  1000 0000 0001 0110</tspan></text><text x="380" y="190.55" font-size="13" text-anchor="middle" font-weight="bold" fill="#c62828" font-family="Consolas, Menlo, monospace"><tspan x="380" dy="0">Read as signed (two's complement):  −32768 + 22 = −32746</tspan></text><text x="380" y="220.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="380" dy="0">The statement compiles, but a stores −32746, not 32790.</tspan></text>
