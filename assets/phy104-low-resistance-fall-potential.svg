<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .lbl { font-size: 15px; fill: #1a1a1a; }
    .small { font-size: 12px; fill: #333333; }
    .wire { stroke: #1a1a1a; stroke-width: 2; fill: none; }
  </style>

  <text x="20" y="28" class="lbl" font-weight="bold">Low resistance by the method of fall of potential</text>

  <!-- Battery -->
  <line x1="60" y1="70" x2="60" y2="220" class="wire"/>
  <line x1="45" y1="110" x2="75" y2="110" class="wire"/>
  <line x1="50" y1="120" x2="70" y2="120" class="wire" stroke-width="4"/>
  <text x="15" y="105" class="small">E</text>

  <!-- Key -->
  <line x1="60" y1="70" x2="140" y2="70" class="wire"/>
  <line x1="105" y1="70" x2="122" y2="52" class="wire"/>
  <text x="95" y="45" class="small">Key K</text>

  <!-- Rheostat -->
  <rect x="140" y="60" width="90" height="20" fill="none" class="wire"/>
  <line x1="185" y1="45" x2="185" y2="60" class="wire"/>
  <text x="140" y="42" class="small">Rheostat (current control)</text>

  <!-- Ammeter -->
  <circle cx="290" cy="70" r="20" class="wire"/>
  <text x="282" y="76" class="lbl">A</text>

  <!-- to test resistance -->
  <line x1="230" y1="70" x2="270" y2="70" class="wire"/>
  <line x1="310" y1="70" x2="400" y2="70" class="wire"/>

  <!-- Test resistance wire (low resistance under test) -->
  <rect x="400" y="60" width="140" height="20" fill="#cfd8dc" stroke="#1a1a1a" stroke-width="2"/>
  <text x="405" y="55" class="small">Test specimen (low resistance X)</text>

  <!-- potential leads -->
  <circle cx="420" cy="70" r="3" fill="#c0392b"/>
  <circle cx="520" cy="70" r="3" fill="#c0392b"/>
  <text x="410" y="100" class="small">P&#8321;</text>
  <text x="510" y="100" class="small">P&#8322;</text>
  <line x1="420" y1="70" x2="420" y2="150" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="520" y1="70" x2="520" y2="150" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Voltmeter -->
  <circle cx="470" cy="175" r="22" class="wire"/>
  <text x="460" y="182" class="lbl">V</text>
  <line x1="420" y1="150" x2="448" y2="175" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="492" y1="175" x2="520" y2="150" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- close loop -->
  <line x1="540" y1="70" x2="620" y2="70" class="wire"/>
  <line x1="620" y1="70" x2="620" y2="220" class="wire"/>
  <line x1="620" y1="220" x2="60" y2="220" class="wire"/>

  <text x="60" y="260" class="small">Main current circuit: E &#8594; K &#8594; rheostat &#8594; ammeter (A) &#8594; test resistance X &#8594; back to E.</text>
  <text x="60" y="278" class="small">Voltmeter (V) is connected only across the potential points P&#8321;, P&#8322; on the test specimen.</text>
</svg>
