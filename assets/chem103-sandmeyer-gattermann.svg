<svg viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .lbl{font-size:15px;fill:#1a1a1a;}
    .small{font-size:12.5px;fill:#333;}
    .arrow{stroke:#33475b;stroke-width:2;marker-end:url(#ah2);fill:none;}
    .box{fill:#f5f8fc;stroke:#33475b;stroke-width:1.5;}
  </style>
  <defs>
    <marker id="ah2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#33475b"/>
    </marker>
  </defs>

  <text x="450" y="24" text-anchor="middle" font-size="17" font-weight="bold">Sandmeyer &amp; Gattermann Reactions (via Diazonium Salt)</text>

  <rect class="box" x="30" y="45" width="180" height="50" rx="6"/>
  <text x="120" y="75" text-anchor="middle" class="lbl">Ar-NH2</text>
  <path class="arrow" d="M210,70 H300"/>
  <text x="255" y="60" text-anchor="middle" class="small">NaNO2 / HCl, 0-5°C</text>
  <rect class="box" x="300" y="45" width="200" height="50" rx="6"/>
  <text x="400" y="75" text-anchor="middle" class="lbl">Ar-N2+ Cl⁻ (diazonium salt)</text>

  <text x="450" y="125" text-anchor="middle" font-size="14" font-weight="bold">Sandmeyer reaction (Cu(I) catalyst)</text>
  <path class="arrow" d="M120,140 V180"/>
  <text x="450" y="150" text-anchor="middle" class="small">Ar-N2+Cl⁻ + CuCl → Ar-Cl + N2 + CuCl2 (using CuCl/HCl)</text>
  <text x="450" y="170" text-anchor="middle" class="small">Ar-N2+Cl⁻ + CuBr/HBr → Ar-Br + N2   |   Ar-N2+ + CuCN/KCN → Ar-CN + N2</text>

  <text x="450" y="210" text-anchor="middle" font-size="14" font-weight="bold">Gattermann reaction (Cu powder, no separate cuprous salt)</text>
  <text x="450" y="235" text-anchor="middle" class="small">Ar-N2+Cl⁻ + Cu/HCl → Ar-Cl + N2   |   Ar-N2+Cl⁻ + Cu/HBr → Ar-Br + N2</text>
  <text x="450" y="255" text-anchor="middle" class="small">Ar-N2+Cl⁻ + Cu/KCN → Ar-CN + N2</text>

  <rect class="box" x="230" y="270" width="440" height="55" rx="6"/>
  <text x="450" y="292" text-anchor="middle" class="small" font-weight="bold">Difference: Sandmeyer uses cuprous salts (CuCl, CuBr, CuCN);</text>
  <text x="450" y="312" text-anchor="middle" class="small">Gattermann uses Cu powder directly with the corresponding acid/cyanide — milder, lower yield.</text>
</svg>
