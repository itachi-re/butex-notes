<svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="560" height="320" fill="#ffffff"/>
<!-- dipole charges -->
<circle cx="230" cy="160" r="14" fill="#ffffff" stroke="#000000" stroke-width="2"/>
<text x="230" y="166" font-size="16" text-anchor="middle">-q</text>
<circle cx="330" cy="160" r="14" fill="#000000"/>
<text x="330" y="166" font-size="16" text-anchor="middle" fill="#ffffff">+q</text>
<line x1="244" y1="160" x2="316" y2="160" stroke="#000000" stroke-width="2"/>
<text x="280" y="145" font-size="14" text-anchor="middle">2a</text>
<!-- axis point P -->
<circle cx="480" cy="160" r="4" fill="#000000"/>
<text x="490" y="150" font-size="15" text-anchor="start">P</text>
<line x1="330" y1="160" x2="480" y2="160" stroke="#000000" stroke-width="1" stroke-dasharray="4,3"/>
<text x="400" y="145" font-size="14" text-anchor="middle">r</text>
<!-- dipole moment arrow p -->
<line x1="230" y1="220" x2="330" y2="220" stroke="#c00000" stroke-width="2" marker-end="url(#arrow)"/>
<text x="280" y="240" font-size="14" text-anchor="middle" fill="#c00000">p = q(2a), points -q &#8594; +q</text>
<!-- field line arrows from +q toward P -->
<line x1="345" y1="160" x2="470" y2="160" stroke="#1a5fb4" stroke-width="1.5" marker-end="url(#arrow2)"/>
<text x="405" y="105" font-size="13" text-anchor="middle" fill="#1a5fb4">E at axial point P</text>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#c00000"/></marker>
<marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1a5fb4"/></marker>
</defs>
<text x="280" y="30" font-size="16" text-anchor="middle" font-weight="bold">Electric Dipole — Axial Point Geometry</text>
</svg>
