<svg viewBox="0 0 660 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="660" height="320" fill="#ffffff"/>
<text x="330" y="24" text-anchor="middle" font-size="16" font-weight="bold">Photo-degradation vs Oxidative Degradation</text>

<text x="20" y="55" font-size="14" font-weight="bold" fill="#1f5fa8">Photo-degradation (UV-initiated)</text>
<text x="20" y="78" font-size="12">1. Chromophore/impurity absorbs UV &#8594; excited state &#8594; homolysis: R&#8211;H  &#8212;h&#957;&#8594;  R&#8226; + H&#8226;</text>
<text x="20" y="96" font-size="12">2. Norrish I: C&#8722;C(=O) bond cleaves &#8594; acyl + alkyl radicals (chain scission)</text>
<text x="20" y="114" font-size="12">3. Norrish II: intramolecular H-transfer &#8594; chain cleavage + enol/ketone products</text>
<text x="20" y="132" font-size="12">Result: reduced molecular weight, embrittlement, surface cracking</text>

<line x1="20" y1="150" x2="640" y2="150" stroke="#ccc"/>

<text x="20" y="180" font-size="14" font-weight="bold" fill="#a83232">Oxidative degradation (auto-oxidation, radical chain)</text>
<text x="20" y="203" font-size="12">Initiation:   R&#8211;H  &#8594;  R&#8226; + H&#8226;   (heat/UV/mechanical stress/metal ions)</text>
<text x="20" y="221" font-size="12">Propagation: R&#8226; + O&#8322;  &#8594;  ROO&#8226;   ;   ROO&#8226; + R&#8211;H  &#8594;  ROOH + R&#8226;</text>
<text x="20" y="239" font-size="12">Branching:   ROOH  &#8594;  RO&#8226; + &#8226;OH   (hydroperoxide decomposes &#8594; more radicals)</text>
<text x="20" y="257" font-size="12">Termination: R&#8226; + R&#8226; (or ROO&#8226;+ROO&#8226;)  &#8594;  stable, non-radical products</text>
<text x="20" y="280" font-size="12">Result: chain scission and/or crosslinking, loss of mechanical properties</text>
</svg>
