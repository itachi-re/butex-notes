<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="700" height="440" role="img" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Compton momentum triangle</title>
<desc>Vector triangle showing incident photon momentum equal to the sum of scattered photon momentum and electron momentum with angles phi and theta.</desc>
<defs><marker id="ad" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 z" fill="#222222"/></marker><marker id="ab" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 z" fill="#1f5fbf"/></marker><marker id="ar" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 z" fill="#c0392b"/></marker><marker id="ag" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 z" fill="#2e7d32"/></marker></defs>
<rect x="0" y="0" width="700" height="440" fill="#ffffff"/>
<text x="20" y="30" text-anchor="start" font-size="18" fill="#222222" font-weight="bold"><tspan>Momentum conservation triangle</tspan></text>
<line x1="120.0" y1="330.0" x2="558.0" y2="330.0" stroke="#1f5fbf" stroke-width="3.5" marker-end="url(#ab)"/>
<line x1="120.0" y1="330.0" x2="350.0" y2="137.0" stroke="#c0392b" stroke-width="3.5" marker-end="url(#ar)"/>
<line x1="350.0" y1="137.0" x2="556.0" y2="326.0" stroke="#2e7d32" stroke-width="3.5" marker-end="url(#ag)"/>
<text x="340" y="366" text-anchor="middle" font-size="17" fill="#1f5fbf" font-weight="normal"><tspan>p = h/λ  (incident photon)</tspan></text>
<text x="228" y="214" text-anchor="end" font-size="17" fill="#c0392b" font-weight="normal"><tspan>p′ = h/λ′</tspan></text>
<text x="228" y="236" text-anchor="end" font-size="16" fill="#c0392b" font-weight="normal"><tspan>(scattered photon)</tspan></text>
<text x="472" y="214" text-anchor="start" font-size="17" fill="#2e7d32" font-weight="normal"><tspan>p</tspan><tspan dy="5" font-size="14">e</tspan><tspan dy="-5"> = mv</tspan></text>
<text x="472" y="236" text-anchor="start" font-size="16" fill="#2e7d32" font-weight="normal"><tspan>(recoil electron)</tspan></text>
<path d="M190.0,330.0 A70,70 0 0 0 173.6,285.0" fill="none" stroke="#222222" stroke-width="2"/>
<text x="216" y="305" text-anchor="middle" font-size="20" fill="#222222" font-weight="bold"><tspan>φ</tspan></text>
<path d="M490.0,330.0 A70,70 0 0 1 508.4,282.7" fill="none" stroke="#222222" stroke-width="2"/>
<text x="472" y="316" text-anchor="middle" font-size="20" fill="#222222" font-weight="bold"><tspan>θ</tspan></text>
<text x="120" y="395" text-anchor="start" font-size="17" fill="#222222" font-weight="normal"><tspan>p = p′ + p</tspan><tspan dy="5" font-size="14">e</tspan><tspan dy="-5">  (vector sum)</tspan></text>
<text x="120" y="421" text-anchor="start" font-size="17" fill="#222222" font-weight="normal"><tspan>p</tspan><tspan dy="5" font-size="14">e</tspan><tspan dy="-11" font-size="14">2</tspan><tspan dy="6"> = p</tspan><tspan dy="-6" font-size="14">2</tspan><tspan dy="6"> + p′</tspan><tspan dy="-6" font-size="14">2</tspan><tspan dy="6"> − 2pp′ cos φ</tspan></text>
</svg>
