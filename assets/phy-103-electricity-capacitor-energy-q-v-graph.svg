<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" width="620" height="430" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Potential difference against charge for a capacitor</title>
<desc id="d">A straight line V = q/C from the origin to the point (Q, V). The area of the triangle under the line equals the stored energy, half Q times V.</desc>
<defs>
<marker id="ah-ink" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto"><polygon points="0 0,7 3,0 6" fill="#1b1b1b"/></marker>
<marker id="as-ink" markerWidth="7" markerHeight="6" refX="0.5" refY="3" orient="auto"><polygon points="7 0,0 3,7 6" fill="#1b1b1b"/></marker>
<marker id="ah-blue" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto"><polygon points="0 0,7 3,0 6" fill="#1f5fbf"/></marker>
<marker id="as-blue" markerWidth="7" markerHeight="6" refX="0.5" refY="3" orient="auto"><polygon points="7 0,0 3,7 6" fill="#1f5fbf"/></marker>
<marker id="ah-red" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto"><polygon points="0 0,7 3,0 6" fill="#c62828"/></marker>
<marker id="as-red" markerWidth="7" markerHeight="6" refX="0.5" refY="3" orient="auto"><polygon points="7 0,0 3,7 6" fill="#c62828"/></marker>
<marker id="ah-green" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto"><polygon points="0 0,7 3,0 6" fill="#2e7d32"/></marker>
<marker id="as-green" markerWidth="7" markerHeight="6" refX="0.5" refY="3" orient="auto"><polygon points="7 0,0 3,7 6" fill="#2e7d32"/></marker>
<marker id="ah-grey" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto"><polygon points="0 0,7 3,0 6" fill="#8a8a8a"/></marker>
<marker id="as-grey" markerWidth="7" markerHeight="6" refX="0.5" refY="3" orient="auto"><polygon points="7 0,0 3,7 6" fill="#8a8a8a"/></marker>
</defs>
<rect x="0" y="0" width="620" height="430" fill="#ffffff"/>
<line x1="100.0" y1="350.0" x2="560.0" y2="350.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round" marker-end="url(#ah-ink)"/>
<line x1="100.0" y1="350.0" x2="100.0" y2="60.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round" marker-end="url(#ah-ink)"/>
<text x="566.0" y="374.0" fill="#1b1b1b" font-size="18" text-anchor="middle">q</text>
<text x="78.0" y="64.0" fill="#1b1b1b" font-size="18" text-anchor="middle">v</text>
<polygon points="100.0,350.0 450.0,350.0 450.0,120.0" fill="#1f5fbf" fill-opacity="0.16" stroke="#1f5fbf" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="100.0" y1="350.0" x2="450.0" y2="120.0" stroke="#1f5fbf" stroke-width="3" stroke-linecap="round"/>
<line x1="450.0" y1="120.0" x2="450.0" y2="350.0" stroke="#8a8a8a" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/>
<line x1="450.0" y1="120.0" x2="100.0" y2="120.0" stroke="#8a8a8a" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="450.0" y="376.0" fill="#1b1b1b" font-size="18" text-anchor="middle">Q</text>
<text x="88.0" y="126.0" fill="#1b1b1b" font-size="18" text-anchor="end">V</text>
<circle cx="450.0" cy="120.0" r="4.5" fill="#1f5fbf"/>
<text x="458.0" y="108.0" fill="#1b1b1b" font-size="16" text-anchor="start">(Q, V)</text>
<rect x="260.0" y="244.9" width="12.0" height="105.1" fill="#2e7d32" fill-opacity="0.35" stroke="#2e7d32" stroke-width="1.5"/>
<line x1="205.0" y1="190.0" x2="263.0" y2="240.9" stroke="#2e7d32" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ah-green)"/>
<text x="125.0" y="150.0" fill="#2e7d32" font-size="16" text-anchor="start">thin strip:</text>
<text x="125.0" y="172.0" fill="#2e7d32" font-size="16" text-anchor="start">dU = v dq</text>
<text x="340.0" y="318.0" fill="#1b1b1b" font-size="20" text-anchor="middle" font-weight="bold">U = ½ Q V</text>
<text x="498.0" y="215.0" fill="#1b1b1b" font-size="16" text-anchor="start">slope = 1/C</text>
<g fill="#1b1b1b"><text xml:space="preserve" x="143.8" y="410.0" font-size="16" text-anchor="start">U = ∫ v dq = ∫ (q/C) dq = Q</text><text xml:space="preserve" x="365.3" y="403.9" font-size="14" text-anchor="start">2</text><text xml:space="preserve" x="374.2" y="410.0" font-size="16" text-anchor="start">/2C = ½ CV</text><text xml:space="preserve" x="467.3" y="403.9" font-size="14" text-anchor="start">2</text></g>
</svg>
