<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Photon and electron energy diagram</title>
<desc>Energy levels showing a photon of energy h nu absorbed by a surface electron, part phi used to leave the metal and the remainder appearing as maximum kinetic energy.</desc>
<defs><marker id="ad" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 z" fill="#222222"/></marker><marker id="ab" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 z" fill="#1f5fbf"/></marker><marker id="ar" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 z" fill="#c0392b"/></marker><marker id="ag" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 z" fill="#2e7d32"/></marker></defs>
<rect x="0" y="0" width="720" height="470" fill="#ffffff"/>
<text x="20" y="30" text-anchor="start" font-size="18" fill="#222222" font-weight="bold"><tspan>One photon, one electron: energy balance</tspan></text>
<rect x="60" y="300" width="280" height="100" fill="#222222" fill-opacity="0.12"/>
<line x1="60.0" y1="300.0" x2="340.0" y2="300.0" stroke="#222222" stroke-width="3"/>
<text x="70" y="330" text-anchor="start" font-size="16" fill="#222222" font-weight="normal"><tspan>Metal: filled levels</tspan></text>
<text x="70" y="352" text-anchor="start" font-size="14" fill="#222222" font-weight="normal"><tspan>(top occupied level = surface electrons)</tspan></text>
<line x1="60.0" y1="150.0" x2="700.0" y2="150.0" stroke="#222222" stroke-width="3" stroke-dasharray="9 5"/>
<text x="450" y="176" text-anchor="start" font-size="16" fill="#222222" font-weight="normal"><tspan>Vacuum level (electron just free)</tspan></text>
<path d="M200.0,296.0 L202.3,294.5 L204.2,293.0 L205.5,291.5 L206.0,289.9 L205.5,288.4 L204.2,286.9 L202.3,285.4 L200.0,283.9 L197.7,282.4 L195.8,280.9 L194.5,279.3 L194.0,277.8 L194.5,276.3 L195.8,274.8 L197.7,273.3 L200.0,271.8 L202.3,270.3 L204.2,268.8 L205.5,267.2 L206.0,265.7 L205.5,264.2 L204.2,262.7 L202.3,261.2 L200.0,259.7 L197.7,258.2 L195.8,256.6 L194.5,255.1 L194.0,253.6 L194.5,252.1 L195.8,250.6 L197.7,249.1 L200.0,247.6 L202.3,246.0 L204.2,244.5 L205.5,243.0 L206.0,241.5 L205.5,240.0 L204.2,238.5 L202.3,237.0 L200.0,235.4 L197.7,233.9 L195.8,232.4 L194.5,230.9 L194.0,229.4 L194.5,227.9 L195.8,226.4 L197.7,224.8 L200.0,223.3 L202.3,221.8 L204.2,220.3 L205.5,218.8 L206.0,217.3 L205.5,215.8 L204.2,214.2 L202.3,212.7 L200.0,211.2 L197.7,209.7 L195.8,208.2 L194.5,206.7 L194.0,205.2 L194.5,203.7 L195.8,202.1 L197.7,200.6 L200.0,199.1 L202.3,197.6 L204.2,196.1 L205.5,194.6 L206.0,193.1 L205.5,191.5 L204.2,190.0 L202.3,188.5 L200.0,187.0 L197.7,185.5 L195.8,184.0 L194.5,182.5 L194.0,180.9 L194.5,179.4 L195.8,177.9 L197.7,176.4 L200.0,174.9 L202.3,173.4 L204.2,171.9 L205.5,170.3 L206.0,168.8 L205.5,167.3 L204.2,165.8 L202.3,164.3 L200.0,162.8 L197.7,161.3 L195.8,159.8 L194.5,158.2 L194.0,156.7 L194.5,155.2 L195.8,153.7 L197.7,152.2 L200.0,150.7 L202.3,149.2 L204.2,147.6 L205.5,146.1 L206.0,144.6 L205.5,143.1 L204.2,141.6 L202.3,140.1 L200.0,138.6 L197.7,137.0 L195.8,135.5 L194.5,134.0 L194.0,132.5 L194.5,131.0 L195.8,129.5 L197.7,128.0 L200.0,126.4 L202.3,124.9 L204.2,123.4 L205.5,121.9 L206.0,120.4 L205.5,118.9 L204.2,117.4 L202.3,115.8 L200.0,114.3 L197.7,112.8 L195.8,111.3 L194.5,109.8 L194.0,108.3 L194.5,106.8 L195.8,105.2 L197.7,103.7 L200.0,102.2 L202.3,100.7 L204.2,99.2 L205.5,97.7 L206.0,96.2 L205.5,94.7 L204.2,93.1 L202.3,91.6 L200.0,90.1 L197.7,88.6 L195.8,87.1 L194.5,85.6 L194.0,84.1 L194.5,82.5 L195.8,81.0 L197.7,79.5 L200.0,78.0" fill="none" stroke="#1f5fbf" stroke-width="2.5"/><line x1="200.0" y1="78.0" x2="200.0" y2="66.0" stroke="#1f5fbf" stroke-width="2.5" marker-end="url(#ab)"/>
<text x="188" y="200" text-anchor="end" font-size="20" fill="#1f5fbf" font-weight="bold"><tspan>hν</tspan></text>
<circle cx="200" cy="300" r="7" fill="#c0392b" stroke="#c0392b" stroke-width="2"/>
<text x="214" y="322" text-anchor="start" font-size="15" fill="#c0392b" font-weight="normal"><tspan>e</tspan><tspan dy="-6" font-size="14">−</tspan><tspan dy="6"> absorbs the whole photon</tspan></text>
<line x1="430.0" y1="296.0" x2="430.0" y2="154.0" stroke="#2e7d32" stroke-width="3" marker-end="url(#ag)"/>
<text x="444" y="232" text-anchor="start" font-size="16" fill="#2e7d32" font-weight="normal"><tspan>φ = work to leave the metal</tspan></text>
<line x1="430.0" y1="146.0" x2="430.0" y2="66.0" stroke="#c0392b" stroke-width="3" marker-end="url(#ar)"/>
<text x="444" y="106" text-anchor="start" font-size="17" fill="#c0392b" font-weight="normal"><tspan>K</tspan><tspan dy="5" font-size="14">max</tspan><tspan dy="-5"> = ½mv</tspan><tspan dy="-6" font-size="14">2</tspan><tspan dy="11" font-size="14">max</tspan></text>
<line x1="206.0" y1="62.0" x2="424.0" y2="62.0" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 4"/>
<circle cx="430" cy="58" r="7" fill="#c0392b" stroke="#c0392b" stroke-width="2"/>
<text x="446" y="62" text-anchor="start" font-size="15" fill="#c0392b" font-weight="normal"><tspan>e</tspan><tspan dy="-6" font-size="14">−</tspan><tspan dy="6"> leaves with K</tspan><tspan dy="5" font-size="14">max</tspan></text>
<text x="282.3" y="438" text-anchor="start" font-size="22" fill="#222222" font-weight="bold"><tspan>hν = φ + K</tspan><tspan dy="5" font-size="14">max</tspan></text>
</svg>
