<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="720" height="380" fill="#ffffff"/>
  <text x="360" y="28" font-size="18" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Linear Expansion (Micrometer/Comparator) Apparatus</text>

  <!-- Steam jacket -->
  <rect x="90" y="120" width="420" height="90" rx="10" fill="#eef4fb" stroke="#2b6cb0" stroke-width="2"/>
  <text x="300" y="110" font-size="13" text-anchor="middle" fill="#2b6cb0">Steam jacket</text>

  <!-- Rod inside -->
  <rect x="110" y="155" width="380" height="20" fill="#c9a876" stroke="#7a5c2e" stroke-width="1.5"/>
  <text x="300" y="200" font-size="12" text-anchor="middle" fill="#333">Test rod (length L₀), one end fixed</text>

  <!-- Fixed end block -->
  <rect x="90" y="140" width="20" height="60" fill="#555"/>
  <text x="100" y="235" font-size="11" text-anchor="middle" fill="#333">Fixed end</text>

  <!-- Micrometer screw gauge on free end -->
  <rect x="510" y="140" width="70" height="60" fill="#dcdcdc" stroke="#444" stroke-width="1.5"/>
  <line x1="580" y1="165" x2="640" y2="165" stroke="#444" stroke-width="4"/>
  <circle cx="655" cy="165" r="18" fill="#f0e68c" stroke="#444" stroke-width="1.5"/>
  <text x="620" y="120" font-size="11" text-anchor="middle" fill="#333">Micrometer screw</text>
  <text x="620" y="235" font-size="11" text-anchor="middle" fill="#333">(measures ΔL)</text>

  <!-- Steam in/out -->
  <line x1="60" y1="130" x2="90" y2="130" stroke="#2b6cb0" stroke-width="3"/>
  <text x="45" y="126" font-size="11" fill="#2b6cb0">Steam in</text>
  <line x1="510" y1="205" x2="540" y2="230" stroke="#2b6cb0" stroke-width="3"/>
  <text x="545" y="240" font-size="11" fill="#2b6cb0">Steam out</text>

  <!-- Thermometer -->
  <line x1="260" y1="120" x2="260" y2="70" stroke="#c0392b" stroke-width="3"/>
  <circle cx="260" cy="65" r="7" fill="#c0392b"/>
  <text x="260" y="55" font-size="11" text-anchor="middle" fill="#c0392b">Thermometer (θ)</text>

  <!-- Base -->
  <rect x="60" y="260" width="600" height="12" fill="#333"/>
  <text x="360" y="300" font-size="12" text-anchor="middle" fill="#555">Rigid metal bed / optical bench</text>

  <text x="360" y="335" font-size="11" text-anchor="middle" fill="#666">ΔL read directly from the micrometer as the rod is heated from room temperature θ₁ to steam temperature θ₂</text>
</svg>
