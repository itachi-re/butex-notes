<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 660" width="1040" height="660" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Experimental construction of a TTT diagram" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Experimental construction of a TTT diagram</title><desc>Six-step workflow and how points become curves</desc><defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker><pattern id="lam" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#f3e3c3"/><line x1="0" y1="3" x2="6" y2="3" stroke="#6b3d10" stroke-width="1.6"/></pattern><pattern id="lamf" width="3.5" height="3.5" patternUnits="userSpaceOnUse"><rect width="3.5" height="3.5" fill="#f3e3c3"/><line x1="0" y1="1.7" x2="3.5" y2="1.7" stroke="#6b3d10" stroke-width="1.2"/></pattern><pattern id="lamc" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f3e3c3"/><line x1="0" y1="5" x2="10" y2="5" stroke="#6b3d10" stroke-width="2.2"/></pattern></defs><rect width="100%" height="100%" fill="#fff"/><text x="520.0" y="26" font-size="17" text-anchor="middle" fill="#0b2a55" font-weight="bold"><tspan x="520.0" dy="0.0">Building a TTT Diagram Experimentally</tspan></text><text x="520.0" y="44" font-size="11.5" text-anchor="middle" fill="#555" font-style="italic"><tspan x="520.0" dy="0.0">Schematic – not to scale; example temperatures from lecture</tspan></text><circle cx="45" cy="95" r="16" fill="#1a3c6e" stroke="none"/><text x="45" y="101" font-size="15" text-anchor="middle" fill="#fff" font-weight="bold"><tspan x="45" dy="0.0">1</tspan></text><rect x="75" y="65" width="340" height="60" rx="6" fill="#e8f0fe" stroke="#1a3c6e" stroke-width="1.6"/><text x="245.0" y="91.7" font-size="12" text-anchor="middle" fill="#111"><tspan x="245.0" dy="0.0">Prepare many small-</tspan><tspan x="245.0" dy="15.0">cross-section samples</tspan></text><line x1="45" y1="113" x2="45" y2="161" stroke="#1a3c6e" stroke-width="2"/><circle cx="45" cy="179" r="16" fill="#1a3c6e" stroke="none"/><text x="45" y="185" font-size="15" text-anchor="middle" fill="#fff" font-weight="bold"><tspan x="45" dy="0.0">2</tspan></text><rect x="75" y="149" width="340" height="60" rx="6" fill="#e8f0fe" stroke="#1a3c6e" stroke-width="1.6"/><text x="245.0" y="175.7" font-size="12" text-anchor="middle" fill="#111"><tspan x="245.0" dy="0.0">Austenitize long enough for</tspan><tspan x="245.0" dy="15.0">complete austenite (≈ 1425 °F)</tspan></text><line x1="45" y1="197" x2="45" y2="245" stroke="#1a3c6e" stroke-width="2"/><circle cx="45" cy="263" r="16" fill="#1a3c6e" stroke="none"/><text x="45" y="269" font-size="15" text-anchor="middle" fill="#fff" font-weight="bold"><tspan x="45" dy="0.0">3</tspan></text><rect x="75" y="233" width="340" height="60" rx="6" fill="#e8f0fe" stroke="#1a3c6e" stroke-width="1.6"/><text x="245.0" y="259.7" font-size="12" text-anchor="middle" fill="#111"><tspan x="245.0" dy="0.0">Transfer to molten salt bath at</tspan><tspan x="245.0" dy="15.0">constant subcritical T (≈ 1300 °F)</tspan></text><line x1="45" y1="281" x2="45" y2="329" stroke="#1a3c6e" stroke-width="2"/><circle cx="45" cy="347" r="16" fill="#1a3c6e" stroke="none"/><text x="45" y="353" font-size="15" text-anchor="middle" fill="#fff" font-weight="bold"><tspan x="45" dy="0.0">4</tspan></text><rect x="75" y="317" width="340" height="60" rx="6" fill="#e8f0fe" stroke="#1a3c6e" stroke-width="1.6"/><text x="245.0" y="343.7" font-size="12" text-anchor="middle" fill="#111"><tspan x="245.0" dy="0.0">Remove samples at different times;</tspan><tspan x="245.0" dy="15.0">quench in cold water / iced brine</tspan></text><line x1="45" y1="365" x2="45" y2="413" stroke="#1a3c6e" stroke-width="2"/><circle cx="45" cy="431" r="16" fill="#1a3c6e" stroke="none"/><text x="45" y="437" font-size="15" text-anchor="middle" fill="#fff" font-weight="bold"><tspan x="45" dy="0.0">5</tspan></text><rect x="75" y="401" width="340" height="60" rx="6" fill="#e8f0fe" stroke="#1a3c6e" stroke-width="1.6"/><text x="245.0" y="427.7" font-size="12" text-anchor="middle" fill="#111"><tspan x="245.0" dy="0.0">Measure hardness;</tspan><tspan x="245.0" dy="15.0">examine microstructure</tspan></text><line x1="45" y1="449" x2="45" y2="497" stroke="#1a3c6e" stroke-width="2"/><circle cx="45" cy="515" r="16" fill="#1a3c6e" stroke="none"/><text x="45" y="521" font-size="15" text-anchor="middle" fill="#fff" font-weight="bold"><tspan x="45" dy="0.0">6</tspan></text><rect x="75" y="485" width="340" height="60" rx="6" fill="#e8f0fe" stroke="#1a3c6e" stroke-width="1.6"/><text x="245.0" y="511.7" font-size="12" text-anchor="middle" fill="#111"><tspan x="245.0" dy="0.0">Repeat at other</tspan><tspan x="245.0" dy="15.0">subcritical temperatures</tspan></text><line x1="470" y1="330" x2="1000" y2="330" stroke="#111" stroke-width="2" marker-end="url(#ar)"/><line x1="470" y1="330" x2="470" y2="80" stroke="#111" stroke-width="2" marker-end="url(#ar)"/><text x="735.0" y="364" font-size="12" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="735.0" dy="0.0">Time →</tspan></text><text x="432" y="205.0" font-size="12" text-anchor="middle" fill="#111" font-weight="bold" transform="rotate(-90 432 205.0)"><tspan x="432" dy="0.0">Temperature →</tspan></text><line x1="470" y1="120" x2="1000" y2="120" stroke="#b33" stroke-width="1.5" stroke-dasharray="6 4"/><text x="1004" y="124" font-size="11" text-anchor="start" fill="#b33"><tspan x="1004" dy="0.0">A₁</tspan></text><path d="M470 320 L490 95 L530 95" stroke="#c0392b" stroke-width="3" fill="none"/><text x="535" y="90" font-size="11" text-anchor="start" fill="#c0392b"><tspan x="535" dy="0.0">austenitize ≈ 1425 °F</tspan></text><path d="M530 95 L545 190 L960 190" stroke="#2b6cb0" stroke-width="3" fill="none" stroke-dasharray="2 0"/><text x="720" y="182" font-size="11" text-anchor="start" fill="#2b6cb0" font-weight="bold"><tspan x="720" dy="0.0">salt bath, constant T ≈ 1300 °F</tspan></text><line x1="610" y1="190" x2="610" y2="325" stroke="#c0392b" stroke-width="2" marker-end="url(#ar)"/><text x="610" y="345" font-size="11" text-anchor="middle" fill="#111"><tspan x="610" dy="0.0">t1</tspan></text><line x1="690" y1="190" x2="690" y2="325" stroke="#c0392b" stroke-width="2" marker-end="url(#ar)"/><text x="690" y="345" font-size="11" text-anchor="middle" fill="#111"><tspan x="690" dy="0.0">t2</tspan></text><line x1="770" y1="190" x2="770" y2="325" stroke="#c0392b" stroke-width="2" marker-end="url(#ar)"/><text x="770" y="345" font-size="11" text-anchor="middle" fill="#111"><tspan x="770" dy="0.0">t3</tspan></text><line x1="850" y1="190" x2="850" y2="325" stroke="#c0392b" stroke-width="2" marker-end="url(#ar)"/><text x="850" y="345" font-size="11" text-anchor="middle" fill="#111"><tspan x="850" dy="0.0">t4</tspan></text><line x1="920" y1="190" x2="920" y2="325" stroke="#c0392b" stroke-width="2" marker-end="url(#ar)"/><text x="920" y="345" font-size="11" text-anchor="middle" fill="#111"><tspan x="920" dy="0.0">t5</tspan></text><text x="735" y="386" font-size="11.5" text-anchor="middle" fill="#111" font-style="italic"><tspan x="735" dy="0.0">samples removed at t₁…t₅ and quenched</tspan></text><text x="470" y="412" font-size="12" text-anchor="start" fill="#111" font-weight="bold"><tspan x="470" dy="0.0">Each quenched sample: what had formed at that time? (hardness + microscope)</tspan></text><rect x="470" y="422" width="530" height="205" fill="#fafafa" stroke="#999" stroke-width="1.2" opacity="1"/><line x1="500" y1="606" x2="980" y2="606" stroke="#111" stroke-width="2" marker-end="url(#ar)"/><line x1="500" y1="606" x2="500" y2="440" stroke="#111" stroke-width="2" marker-end="url(#ar)"/><text x="740.0" y="640" font-size="11" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="740.0" dy="0.0">log time →</tspan></text><text x="462" y="523.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold" transform="rotate(-90 462 523.0)"><tspan x="462" dy="0.0">T →</tspan></text><path d="M640 470 L590 500 L570 535 L585 575" stroke="#c0392b" stroke-width="2.5" fill="none" stroke-dasharray="6 3"/><circle cx="640" cy="470" r="5" fill="#c0392b" stroke="none"/><circle cx="590" cy="500" r="5" fill="#c0392b" stroke="none"/><circle cx="570" cy="535" r="5" fill="#c0392b" stroke="none"/><circle cx="585" cy="575" r="5" fill="#c0392b" stroke="none"/><path d="M880 470 L810 500 L770 535 L780 575" stroke="#2b6cb0" stroke-width="2.5" fill="none" stroke-dasharray="6 3"/><circle cx="880" cy="470" r="5" fill="#2b6cb0" stroke="none"/><circle cx="810" cy="500" r="5" fill="#2b6cb0" stroke="none"/><circle cx="770" cy="535" r="5" fill="#2b6cb0" stroke="none"/><circle cx="780" cy="575" r="5" fill="#2b6cb0" stroke="none"/><text x="730" y="452" font-size="10.5" text-anchor="middle" fill="#111"><tspan x="730" dy="0.0">● start of transformation   ● end   (one pair per temperature)</tspan></text><text x="760" y="600" font-size="10.5" text-anchor="middle" fill="#111" font-style="italic"><tspan x="760" dy="0.0">T₁ → T₄ : each temperature gives one start point and one end point</tspan></text><text x="985" y="622" font-size="10.5" text-anchor="end" fill="#111" font-style="italic"><tspan x="985" dy="0.0">join points → start &amp; end curves</tspan></text></svg>