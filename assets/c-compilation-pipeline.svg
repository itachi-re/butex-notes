<svg xmlns="http://www.w3.org/2000/svg" width="980" height="330" viewBox="0 0 980 330" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="C compilation pipeline: preprocess, compile, assemble, link, load" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>C compilation pipeline: preprocess, compile, assemble, link, load</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker></defs>
<rect x="0.5" y="0.5" width="979" height="329" fill="#ffffff" stroke="#cfd8dc" rx="8"/>
<text x="490" y="29.6" font-size="16" text-anchor="middle" font-weight="bold" fill="#1a1a1a" ><tspan x="490" dy="0">From hello.c to a running program</tspan></text><rect x="15" y="70" width="130" height="64" fill="#eceff1" stroke="#607d8b" stroke-width="1.5"/><text x="80.0" y="98.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="80.0" dy="0">hello.c</tspan><tspan x="80.0" dy="15.0">Source code</tspan></text><rect x="175" y="70" width="130" height="64" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/><text x="240.0" y="98.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="240.0" dy="0">Preprocessor</tspan><tspan x="240.0" dy="15.0">#include  #define</tspan></text><rect x="335" y="70" width="130" height="64" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/><text x="400.0" y="98.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="400.0" dy="0">Compiler</tspan><tspan x="400.0" dy="15.0">→ assembly</tspan></text><rect x="495" y="70" width="130" height="64" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/><text x="560.0" y="98.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="560.0" dy="0">Assembler</tspan><tspan x="560.0" dy="15.0">→ machine code</tspan></text><rect x="655" y="70" width="130" height="64" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/><text x="720.0" y="98.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="720.0" dy="0">Linker</tspan><tspan x="720.0" dy="15.0">(+ libraries)</tspan></text><rect x="815" y="70" width="130" height="64" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="880.0" y="98.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="880.0" dy="0">a.out / .exe</tspan><tspan x="880.0" dy="15.0">Executable</tspan></text><polyline points="145,102 175,102" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><polyline points="305,102 335,102" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><text x="320.0" y="94.2" font-size="12" text-anchor="middle" font-weight="bold" fill="#b71c1c" ><tspan x="320.0" dy="0">.i</tspan></text><polyline points="465,102 495,102" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><text x="480.0" y="94.2" font-size="12" text-anchor="middle" font-weight="bold" fill="#b71c1c" ><tspan x="480.0" dy="0">.s</tspan></text><polyline points="625,102 655,102" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><text x="640.0" y="94.2" font-size="12" text-anchor="middle" font-weight="bold" fill="#b71c1c" ><tspan x="640.0" dy="0">.o</tspan></text><polyline points="785,102 815,102" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><text x="240" y="154.975" font-size="11" text-anchor="middle" font-weight="normal" fill="#c62828" ><tspan x="240" dy="0">missing header →</tspan><tspan x="240" dy="13.75">fatal error</tspan></text><text x="400" y="154.975" font-size="11" text-anchor="middle" font-weight="normal" fill="#c62828" ><tspan x="400" dy="0">syntax errors</tspan><tspan x="400" dy="13.75">found here</tspan></text><rect x="655" y="190" width="130" height="50" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/><text x="720.0" y="211.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="720.0" dy="0">Library code</tspan><tspan x="720.0" dy="15.0">libc.a / libc.so</tspan></text><polyline points="720,190 720,136" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><text x="560" y="211.975" font-size="11" text-anchor="middle" font-weight="normal" fill="#c62828" ><tspan x="560" dy="0">undefined reference</tspan><tspan x="560" dy="13.75">= linker error</tspan></text><polyline points="880,134 880,190" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><rect x="815" y="190" width="130" height="50" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/><text x="880.0" y="211.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="880.0" dy="0">Loader (OS)</tspan><tspan x="880.0" dy="15.0">copies to RAM</tspan></text><polyline points="880,240 880,280" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><rect x="815.0" y="280.0" width="130" height="36" rx="18.0" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/><text x="880" y="302.55" font-size="13" text-anchor="middle" font-weight="bold" fill="#1a1a1a" ><tspan x="880" dy="0">CPU executes</tspan></text>
</svg>