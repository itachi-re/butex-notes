<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" width="720" height="410" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>P-T phase diagram</title>
<desc>Solid, liquid and vapour regions with triple point, critical point and slopes of the coexistence curves.</desc>
<defs><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="my" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#777777"/></marker></defs>
<rect x="0" y="0" width="720" height="410" fill="#ffffff"/>
<text x="360" y="24" fill="#222222" font-size="16" text-anchor="middle" font-weight="bold">P–T phase diagram (not to scale)</text>
<line x1="70" y1="340" x2="70" y2="50" stroke="#222222" stroke-width="2" marker-end="url(#mk)"/>
<line x1="70" y1="340" x2="680" y2="340" stroke="#222222" stroke-width="2" marker-end="url(#mk)"/>
<text x="56" y="58" fill="#222222" font-size="15" text-anchor="end" font-weight="bold">P</text>
<text x="688" y="345" fill="#222222" font-size="15" text-anchor="start" font-weight="bold">T</text>
<path d="M100,330 Q180,300 250,250" fill="none" stroke="#222222" stroke-width="3"/>
<path d="M250,250 Q400,240 520,90" fill="none" stroke="#c0392b" stroke-width="3"/>
<path d="M250,250 L282,60" fill="none" stroke="#1f5fbf" stroke-width="3"/>
<circle cx="250" cy="250" r="5.5" fill="#222222" stroke="#222222" stroke-width="1.5"/>
<circle cx="520" cy="90" r="5.5" fill="#222222" stroke="#222222" stroke-width="1.5"/>
<text x="150" y="140" fill="#222222" font-size="16" text-anchor="middle" font-weight="bold">Solid</text>
<text x="375" y="125" fill="#222222" font-size="16" text-anchor="middle" font-weight="bold">Liquid</text>
<text x="570" y="290" fill="#222222" font-size="16" text-anchor="middle" font-weight="bold">Vapour</text>
<text x="95" y="270" fill="#222222" font-size="14" text-anchor="start" font-weight="normal">sublimation</text>
<text x="500" y="172" fill="#c0392b" font-size="14" text-anchor="start" font-weight="normal">vaporisation</text>
<text x="294" y="76" fill="#1f5fbf" font-size="14" text-anchor="start" font-weight="normal">fusion (melting)</text>
<line x1="256" y1="256" x2="283" y2="282" stroke="#777777" stroke-width="1.2"/>
<text x="287" y="292" fill="#222222" font-size="14" text-anchor="start" font-weight="normal">Triple point (Ttr, Ptr)</text>
<text x="520" y="70" fill="#222222" font-size="14" text-anchor="middle" font-weight="normal">Critical point</text>
<text x="360" y="372" fill="#222222" font-size="14" text-anchor="middle" font-weight="normal">Vaporisation, sublimation: dP/dT = L/[T(v₂ − v₁)] &gt; 0  (vapour volume much larger than liquid volume)</text>
<text x="360" y="394" fill="#222222" font-size="14" text-anchor="middle" font-weight="normal">Fusion: dP/dT = L/[T(v(liq) − v(solid))]: positive for most substances, negative for water</text>
</svg>
