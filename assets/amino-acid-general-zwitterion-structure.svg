<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" font-family="Georgia, serif" font-size="16" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="700" height="360" fill="#fff"/>
<text x="20" y="28" font-size="18" font-weight="bold">α-Amino acid: neutral form ⇌ zwitterion (isoelectric species)</text>

<g transform="translate(60,90)">
<text x="0" y="0">H2N—C—COOH</text>
<line x1="70" y1="6" x2="70" y2="30" stroke="black"/>
<text x="60" y="46">R</text>
<text x="0" y="70" font-size="13" fill="#555">un-ionised (rare, only in the gas phase / a formal Lewis structure)</text>
</g>

<text x="330" y="145" font-size="26">⇌</text>

<g transform="translate(400,90)">
<text x="0" y="0">H3N⁺—C—COO⁻</text>
<line x1="76" y1="6" x2="76" y2="30" stroke="black"/>
<text x="66" y="46">R</text>
<text x="0" y="70" font-size="13" fill="#555">zwitterion (dipolar ion) — the actual dominant form in the solid</text>
<text x="0" y="88" font-size="13" fill="#555">state and near neutral aqueous pH</text>
</g>

<text x="20" y="200" font-weight="bold">Isoelectric point (pI):</text>
<text x="30" y="225">the pH at which the amino acid carries NO NET charge (zwitterion, concentration</text>
<text x="30" y="247">of net + and net − forms equal); at this pH the molecule does not migrate in an</text>
<text x="30" y="269">electric field (basis of electrophoretic separation).</text>
<text x="30" y="300" font-size="18">pI = (pKa1 + pKa2) / 2   (for simple, non-ionisable-R amino acids)</text>
<text x="30" y="335" font-size="14" fill="#555">Below pI: predominantly cationic (protonated, +); Above pI: predominantly anionic (−).</text>
</svg>
