<svg viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="620" height="320" fill="#ffffff"/>
<text x="310" y="24" text-anchor="middle" font-size="16" font-weight="bold">Molecular Weight Distribution &amp; Averages</text>

<!-- axes -->
<line x1="60" y1="260" x2="580" y2="260" stroke="#333" stroke-width="2"/>
<line x1="60" y1="260" x2="60" y2="50" stroke="#333" stroke-width="2"/>
<text x="320" y="290" text-anchor="middle" font-size="13">Molecular weight, M &#8594;</text>
<text x="25" y="150" font-size="13" transform="rotate(-90 25 150)">Number / weight fraction</text>

<!-- skewed distribution curve -->
<path d="M60,255 C120,250 160,120 220,90 C280,65 330,80 380,140 C430,195 480,235 580,255"
      fill="none" stroke="#1f5fa8" stroke-width="3"/>

<!-- vertical markers for averages, left to right = Mn < Mv <= Mw < Mz -->
<line x1="220" y1="260" x2="220" y2="90" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5,3"/>
<text x="220" y="80" text-anchor="middle" font-size="12" fill="#2e7d32" font-weight="bold">M&#8345;</text>

<line x1="300" y1="260" x2="300" y2="70" stroke="#a87c00" stroke-width="2" stroke-dasharray="5,3"/>
<text x="300" y="60" text-anchor="middle" font-size="12" fill="#a87c00" font-weight="bold">M&#7515; = M&#7519;</text>

<line x1="380" y1="260" x2="380" y2="140" stroke="#a83232" stroke-width="2" stroke-dasharray="5,3"/>
<text x="380" y="130" text-anchor="middle" font-size="12" fill="#a83232" font-weight="bold">M&#7622;</text>

<text x="20" y="305" font-size="12" fill="#555">For any polydisperse (non-uniform) sample: M&#8345; &lt; M&#7515; &#8776; M&#7519; &lt; M&#7622; &#8212; the distribution is skewed</text>
<text x="20" y="318" font-size="12" fill="#555">toward higher M because heavier chains contribute more weight/mass than number.</text>
</svg>
