<text x="674.0" y="211.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.3" text-anchor="start" fill="#1f2937" font-weight="normal">• [α]D = +136° (equilibrium)</text>
<text x="500.0" y="475.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" fill="#334155" font-weight="normal">Glycosidic linkage = covalent C–O–C bond from the anomeric carbon of one sugar to an –OH of another unit.</text>
