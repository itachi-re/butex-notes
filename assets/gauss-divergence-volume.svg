<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400" font-family="Arial, Helvetica, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Region bounded by lower surface S1, upper surface S2 and lateral surface S3</title>
  <rect width="560" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ag" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#047857"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b91c1c"/></marker>
    <marker id="ab" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1f3a8a"/></marker>
  </defs>
  <ellipse cx="260" cy="350" rx="130" ry="30" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="235" y="355" fill="#4b5563">R (in xy-plane)</text>
  <path d="M130,250 L130,110 A130,35 0 0 1 390,110 L390,250 A130,35 0 0 1 130,250 Z" fill="#dbeafe" fill-opacity="0.6" stroke="#1f3a8a" stroke-width="2"/>
  <ellipse cx="260" cy="110" rx="130" ry="35" fill="#bfdbfe" stroke="#1f3a8a" stroke-width="2"/>
  <path d="M130,250 A130,35 0 0 0 390,250" fill="none" stroke="#1f3a8a" stroke-width="2"/>
  <line x1="130" y1="250" x2="130" y2="350" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="390" y1="250" x2="390" y2="350" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="260" y1="100" x2="260" y2="40" stroke="#047857" stroke-width="3" marker-end="url(#ag)"/>
  <line x1="260" y1="285" x2="260" y2="335" stroke="#b91c1c" stroke-width="3" marker-end="url(#ar)"/>
  <line x1="390" y1="180" x2="450" y2="180" stroke="#1f3a8a" stroke-width="3" marker-end="url(#ab)"/>
  <text x="270" y="55" fill="#047857">S2: z = f2(x,y), n·k &gt; 0</text>
  <text x="270" y="318" fill="#b91c1c">S1: z = f1(x,y), n·k &lt; 0</text>
  <text x="400" y="170" fill="#1f3a8a">S3: n·k = 0</text>
  <text x="225" y="185" fill="#1f3a8a" font-weight="bold">V</text>
</svg>
