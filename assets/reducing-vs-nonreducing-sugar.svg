<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420">
<title>Reducing vs non-reducing sugars</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker><marker id="arrowAccent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a13a2e"/></marker><marker id="arrowAccent2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5a8a"/></marker><marker id="halfArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,2 L10,5 L0,8 z" fill="#1a1a1a"/></marker></defs>
<rect x="0" y="0" width="700" height="420" fill="white"/>
<text x="350.0" y="26.0" font-family="DejaVu Sans" font-size="19" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">Reducing vs Non-Reducing Sugars</text>
<text x="350.0" y="60.0" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" font-style="normal" fill="#666666" text-anchor="middle">free anomeric –OH (hemiacetal)  →  reduces Tollens'/Fehling's  →  REDUCING</text>
<text x="350.0" y="78.0" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" font-style="normal" fill="#666666" text-anchor="middle">both anomeric carbons tied up in a glycosidic bond  →  NO free hemiacetal  →  NON-REDUCING</text>
<rect x="40.0" y="100.0" width="640.0" height="170.0" rx="0" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="40.0" y1="134.0" x2="680.0" y2="134.0" stroke="#1a1a1a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="270.0" y1="100.0" x2="270.0" y2="270.0" stroke="#666666" stroke-width="1.0" stroke-linecap="round"/>
<line x1="530.0" y1="100.0" x2="530.0" y2="270.0" stroke="#666666" stroke-width="1.0" stroke-linecap="round"/>
<line x1="40.0" y1="134.0" x2="680.0" y2="134.0" stroke="#666666" stroke-width="1.0" stroke-linecap="round"/>
<line x1="40.0" y1="168.0" x2="680.0" y2="168.0" stroke="#666666" stroke-width="1.0" stroke-linecap="round"/>
<line x1="40.0" y1="202.0" x2="680.0" y2="202.0" stroke="#666666" stroke-width="1.0" stroke-linecap="round"/>
<line x1="40.0" y1="236.0" x2="680.0" y2="236.0" stroke="#666666" stroke-width="1.0" stroke-linecap="round"/>
<text x="155.0" y="122.0" font-family="DejaVu Sans" font-size="12.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">Sugar</text>
<text x="400.0" y="122.0" font-family="DejaVu Sans" font-size="12.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">Anomeric centre(s)</text>
<text x="605.0" y="122.0" font-family="DejaVu Sans" font-size="12.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">Type</text>
<text x="155.0" y="156.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">D-glucose, D-fructose</text>
<text x="400.0" y="156.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">1 free (monosaccharide)</text>
<text x="605.0" y="156.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">Reducing</text>
<text x="155.0" y="190.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">Maltose (glucose-α1,4-glucose)</text>
<text x="400.0" y="190.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">1 free, 1 in glycosidic bond</text>
<text x="605.0" y="190.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">Reducing</text>
<text x="155.0" y="224.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">Lactose (galactose-β1,4-glucose)</text>
<text x="400.0" y="224.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">1 free, 1 in glycosidic bond</text>
<text x="605.0" y="224.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">Reducing</text>
<text x="155.0" y="258.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">Sucrose (glucose-α1,2β-fructose)</text>
<text x="400.0" y="258.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">BOTH in glycosidic bond</text>
<text x="605.0" y="258.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">Non-reducing</text>
<text x="350.0" y="374.5" font-family="DejaVu Sans" font-size="11.5" font-weight="normal" font-style="italic" fill="#666666" text-anchor="middle">In maltose/lactose only ONE of the two anomeric carbons is used in the glycosidic bond, leaving one free</text>
<text x="350.0" y="390.0" font-family="DejaVu Sans" font-size="11.5" font-weight="normal" font-style="italic" fill="#666666" text-anchor="middle">hemiacetal — so both are still reducing sugars.</text>
</svg>
