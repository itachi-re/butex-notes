<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 545" width="900" height="545" role="img" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>E2 mechanism</title><desc>A base removes a beta hydrogen while the C-Br bond breaks and the C=C bond forms in a single concerted step.</desc><defs><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c0392b"/></marker><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#24292f"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0969da"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1a7f37"/></marker><marker id="mgy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#57606a"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#bc4c00"/></marker></defs><rect width="900" height="545" fill="#ffffff"/><text x="30.0" y="36.0" font-size="16" text-anchor="start" fill="#57606a" font-weight="bold" xml:space="preserve"><tspan>E2: one concerted step – the base removes β-H while the C–Br bond breaks</tspan></text><text x="80.0" y="223.4" font-size="24" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="24.0">CH</tspan><tspan dy="7.2" font-size="16.8">2</tspan></text><line x1="127.0" y1="215.0" x2="155.0" y2="215.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="158.0" y="223.4" font-size="24" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="24.0">CH</tspan><tspan dy="7.2" font-size="16.8">2</tspan></text><line x1="204.9" y1="215.0" x2="232.9" y2="215.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="235.9" y="223.4" font-size="24" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>Br</tspan></text><line x1="102.0" y1="201.0" x2="102.0" y2="171.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="102.0" y="163.0" font-size="24" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>H</tspan></text><text x="84.0" y="165.0" font-size="13" text-anchor="end" fill="#57606a" font-weight="normal" xml:space="preserve"><tspan>β-H</tspan></text><text x="102.0" y="87.0" font-size="24" text-anchor="middle" fill="#0969da" font-weight="normal" xml:space="preserve"><tspan font-size="24.0">HO</tspan><tspan dy="-10.8" font-size="16.8">−</tspan></text><circle cx="98.8" cy="103.0" r="2" fill="#0969da"/><circle cx="105.2" cy="103.0" r="2" fill="#0969da"/><line x1="102.0" y1="111.0" x2="102.0" y2="135.0" stroke="#0969da" stroke-width="2.4" stroke-linecap="round" marker-end="url(#mb)"/><path d="M106.0,185.0 Q142.0,179.0 141.0,207.0" fill="none" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round" marker-end="url(#mr)"/><path d="M218.9,209.0 Q236.9,171.0 244.2,197.0" fill="none" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round" marker-end="url(#mr)"/><text x="72.0" y="255.0" font-size="14" text-anchor="start" fill="#57606a" font-weight="normal" xml:space="preserve"><tspan>ethyl bromide</tspan></text><text x="480.0" y="110.0" font-size="16" text-anchor="start" fill="#c0392b" font-weight="bold" xml:space="preserve"><tspan>One step, one transition state</tspan></text><text x="480.0" y="138.0" font-size="16" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>• C–H bond breaks as the base binds H</tspan></text><text x="480.0" y="166.0" font-size="16" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>• C=C π bond forms</tspan></text><text x="480.0" y="194.0" font-size="16" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>• C–Br bond breaks, Br⁻ leaves</tspan></text><text x="480.0" y="222.0" font-size="16" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>• all at the same time (concerted)</tspan></text><text x="480.0" y="250.0" font-size="16" text-anchor="start" fill="#c0392b" font-weight="bold" xml:space="preserve"><tspan>Rate = k[R–Br][base]  (second order)</tspan></text><text x="480.0" y="278.0" font-size="16" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>H and Br should be anti-periplanar</tspan></text><line x1="300.0" y1="290.0" x2="300.0" y2="330.0" stroke="#24292f" stroke-width="2.6" stroke-linecap="round" marker-end="url(#mk)"/><text x="450.0" y="372.0" font-size="22" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="22.0">[ HO</tspan><tspan dy="-9.9" font-size="15.4">δ−</tspan><tspan dy="9.9" font-size="22.0">···H···CH</tspan><tspan dy="6.6" font-size="15.4">2</tspan><tspan dy="-6.6" font-size="22.0">···CH</tspan><tspan dy="6.6" font-size="15.4">2</tspan><tspan dy="-6.6" font-size="22.0">···Br</tspan><tspan dy="-9.9" font-size="15.4">δ−</tspan><tspan dy="9.9" font-size="22.0"> ]</tspan><tspan dy="-9.9" font-size="15.4">‡</tspan></text><text x="450.0" y="402.0" font-size="13" text-anchor="middle" fill="#57606a" font-weight="normal" xml:space="preserve"><tspan>transition state (partial bonds)</tspan></text><line x1="450.0" y1="418.0" x2="450.0" y2="452.0" stroke="#24292f" stroke-width="2.6" stroke-linecap="round" marker-end="url(#mk)"/><text x="210.0" y="503.0" font-size="24" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="24.0">H</tspan><tspan dy="7.2" font-size="16.8">2</tspan><tspan dy="-7.2" font-size="24.0">O</tspan></text><text x="272.0" y="503.0" font-size="24" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>+</tspan></text><text x="300.0" y="503.4" font-size="24" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="24.0">H</tspan><tspan dy="7.2" font-size="16.8">2</tspan><tspan dy="-7.2" font-size="24.0">C</tspan></text><line x1="347.0" y1="498.6" x2="375.0" y2="498.6" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><line x1="347.0" y1="491.4" x2="375.0" y2="491.4" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="378.0" y="503.4" font-size="24" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="24.0">CH</tspan><tspan dy="7.2" font-size="16.8">2</tspan></text><text x="451.9" y="503.0" font-size="24" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>+</tspan></text><text x="501.9" y="503.0" font-size="24" text-anchor="middle" fill="#0969da" font-weight="normal" xml:space="preserve"><tspan font-size="24.0">Br</tspan><tspan dy="-10.8" font-size="16.8">−</tspan></text><text x="450.0" y="545.0" font-size="14" text-anchor="middle" fill="#57606a" font-weight="normal" xml:space="preserve"><tspan>ethene + water + bromide ion</tspan></text></svg>