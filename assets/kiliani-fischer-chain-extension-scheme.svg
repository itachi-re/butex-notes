<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" font-family="Georgia, serif" font-size="15" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="780" height="340" fill="#fff"/>
<text x="20" y="28" font-size="18" font-weight="bold">Kiliani–Fischer synthesis: aldose (Cn) → aldose (Cn+1)</text>

<text x="20" y="60">Step 1 — Cyanohydrin formation (adds one carbon, creates a new stereocentre):</text>
<text x="30" y="84">Aldose–CHO  +  HCN  →  Aldose–CH(OH)–CN   (a pair of epimeric cyanohydrins, since</text>
<text x="30" y="104">attack of CN⁻ on the planar carbonyl can occur from either face)</text>

<text x="20" y="140">Step 2 — Partial hydrolysis of the nitrile to an imine/lactone, then:</text>
<text x="30" y="164">Aldose–CH(OH)–CN  --(H2, Pd/BaSO4 poisoned, i.e. partial reduction of nitrile to imine)-->  </text>
<text x="30" y="184">Aldose–CH(OH)–CH=NH  --(H2O, hydrolysis)-->  Aldose–CH(OH)–CHO  (new aldose, Cn+1)</text>
<text x="30" y="208" font-size="13" fill="#555">(classically done via lactone reduction with Na-Hg/H2O instead of catalytic H2)</text>

<text x="20" y="245" font-weight="bold">Result:</text>
<text x="30" y="268" font-size="14" fill="#555">• Chain grows by one carbon at C1 (old C1 becomes new C2).</text>
<text x="30" y="290" font-size="14" fill="#555">• Because CN⁻ can add from either face of the flat carbonyl, TWO C2-epimeric</text>
<text x="30" y="312" font-size="14" fill="#555">  aldoses (differing only in configuration at the new C2) are obtained together —</text>
<text x="30" y="332" font-size="14" fill="#555">  e.g. D-arabinose (C5) → D-glucose + D-mannose (C6 epimers) via Kiliani–Fischer.</text>
</svg>
