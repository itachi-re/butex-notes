<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" width="940" height="520" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Annealing treatments on a temperature scale" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Annealing treatments on a temperature scale</title><desc>Relative positions of annealing treatments with respect to critical lines</desc><defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker><pattern id="lam" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#f3e3c3"/><line x1="0" y1="3" x2="6" y2="3" stroke="#6b3d10" stroke-width="1.6"/></pattern><pattern id="lamf" width="3.5" height="3.5" patternUnits="userSpaceOnUse"><rect width="3.5" height="3.5" fill="#f3e3c3"/><line x1="0" y1="1.7" x2="3.5" y2="1.7" stroke="#6b3d10" stroke-width="1.2"/></pattern><pattern id="lamc" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f3e3c3"/><line x1="0" y1="5" x2="10" y2="5" stroke="#6b3d10" stroke-width="2.2"/></pattern></defs><rect width="100%" height="100%" fill="#fff"/><text x="470.0" y="26" font-size="17" text-anchor="middle" fill="#0b2a55" font-weight="bold"><tspan x="470.0" dy="0.0">Where Each Treatment Sits Relative to the Critical Lines</tspan></text><text x="470.0" y="44" font-size="11.5" text-anchor="middle" fill="#555" font-style="italic"><tspan x="470.0" dy="0.0">Schematic – only the stated °F ranges come from the lecture</tspan></text><line x1="90" y1="470" x2="900" y2="470" stroke="#111" stroke-width="2" marker-end="url(#ar)"/><line x1="90" y1="470" x2="90" y2="70" stroke="#111" stroke-width="2" marker-end="url(#ar)"/><text x="495.0" y="504" font-size="12" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="495.0" dy="0.0">Treatment (position relative to critical temperatures)</tspan></text><text x="52" y="270.0" font-size="12" text-anchor="middle" fill="#111" font-weight="bold" transform="rotate(-90 52 270.0)"><tspan x="52" dy="0.0">Temperature →</tspan></text><line x1="90" y1="170" x2="900" y2="170" stroke="#b33" stroke-width="1.6" stroke-dasharray="7 4"/><text x="96" y="164" font-size="11.5" text-anchor="start" fill="#b33"><tspan x="96" dy="0.0">A₃ / A_cm (upper critical line)</tspan></text><line x1="90" y1="300" x2="900" y2="300" stroke="#33b" stroke-width="1.6" stroke-dasharray="7 4"/><text x="96" y="294" font-size="11.5" text-anchor="start" fill="#33b"><tspan x="96" dy="0.0">A₁ (lower critical line)</tspan></text><text x="96" y="110" font-size="12" text-anchor="start" fill="#7a4b00" font-weight="bold"><tspan x="96" dy="0.0">ABOVE critical range → austenite forms</tspan></text><text x="96" y="430" font-size="12" text-anchor="start" fill="#1a5c2e" font-weight="bold"><tspan x="96" dy="0.0">BELOW A₁ → no austenite (subcritical)</tspan></text><rect x="130" y="150" width="150" height="60" rx="5" fill="#fde8d0" stroke="#1a3c6e" stroke-width="1.6"/><text x="205.0" y="176.8375" font-size="11.5" text-anchor="middle" fill="#111"><tspan x="205.0" dy="0.0">FULL ANNEALING</tspan><tspan x="205.0" dy="14.4">austenitize → very slow cool</tspan></text><rect x="310" y="105" width="150" height="58" rx="5" fill="#fff3b0" stroke="#1a3c6e" stroke-width="1.6"/><text x="385.0" y="123.65" font-size="11.5" text-anchor="middle" fill="#111"><tspan x="385.0" dy="0.0">NORMALIZING</tspan><tspan x="385.0" dy="14.4">≈ 100 °F above upper</tspan><tspan x="385.0" dy="14.4">critical → still air</tspan></text><rect x="490" y="255" width="150" height="60" rx="5" fill="#d9f2e6" stroke="#1a3c6e" stroke-width="1.6"/><text x="565.0" y="274.65" font-size="11.5" text-anchor="middle" fill="#111"><tspan x="565.0" dy="0.0">SPHEROIDIZING</tspan><tspan x="565.0" dy="14.4">around / just below A₁</tspan><tspan x="565.0" dy="14.4">long time</tspan></text><rect x="670" y="330" width="105" height="62" rx="5" fill="#e8f0fe" stroke="#1a3c6e" stroke-width="1.6"/><text x="722.5" y="350.65" font-size="11.5" text-anchor="middle" fill="#111"><tspan x="722.5" dy="0.0">STRESS-RELIEF</tspan><tspan x="722.5" dy="14.4">1000–1200 °F</tspan><tspan x="722.5" dy="14.4">(subcritical)</tspan></text><rect x="790" y="360" width="105" height="62" rx="5" fill="#f3d9f2" stroke="#1a3c6e" stroke-width="1.6"/><text x="842.5" y="380.65" font-size="11.5" text-anchor="middle" fill="#111"><tspan x="842.5" dy="0.0">PROCESS</tspan><tspan x="842.5" dy="14.4">1000–1250 °F</tspan><tspan x="842.5" dy="14.4">(subcritical)</tspan></text><text x="470" y="500" font-size="12" text-anchor="middle" fill="#111" font-style="italic"><tspan x="470" dy="0.0">Full annealing &amp; normalizing: complete austenitizing.  Stress-relief &amp; process annealing: never reach A₁.</tspan></text></svg>