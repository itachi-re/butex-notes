<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
<style>.lbl{font-size:13px;fill:#222} .t{font-size:18px;font-weight:bold;fill:#111}</style>
<rect width="760" height="320" fill="#fff"/>
<text x="380" y="26" text-anchor="middle" class="t">Marking / Layout and Cutting of Sheet Metal</text>

<!-- sheet with marking -->
<g transform="translate(40,60)">
<rect x="0" y="0" width="220" height="160" fill="#e8e8e8" stroke="#333"/>
<line x1="20" y1="20" x2="200" y2="20" stroke="#c33" stroke-dasharray="4,3"/>
<line x1="20" y1="20" x2="20" y2="140" stroke="#c33" stroke-dasharray="4,3"/>
<line x1="20" y1="140" x2="200" y2="140" stroke="#c33" stroke-dasharray="4,3"/>
<line x1="200" y1="20" x2="200" y2="140" stroke="#c33" stroke-dasharray="4,3"/>
<circle cx="20" cy="20" r="2" fill="#333"/><circle cx="200" cy="20" r="2" fill="#333"/>
<circle cx="20" cy="140" r="2" fill="#333"/><circle cx="200" cy="140" r="2" fill="#333"/>
<text x="110" y="180" text-anchor="middle" class="lbl">1. Marking / Scribing layout</text>
</g>

<!-- cutting with snips along line -->
<g transform="translate(300,60)">
<rect x="0" y="0" width="220" height="160" fill="#e8e8e8" stroke="#333"/>
<line x1="20" y1="20" x2="200" y2="20" stroke="#333"/>
<line x1="20" y1="20" x2="20" y2="140" stroke="#333"/>
<line x1="20" y1="140" x2="200" y2="140" stroke="#333"/>
<line x1="200" y1="20" x2="200" y2="140" stroke="#333"/>
<path d="M60,10 L90,25 L60,35 Z" fill="#999" stroke="#333"/>
<text x="110" y="180" text-anchor="middle" class="lbl">2. Cutting along the line (snips/shears)</text>
</g>

<!-- separated blank -->
<g transform="translate(560,60)">
<rect x="0" y="0" width="180" height="120" fill="#d0d0d0" stroke="#333" stroke-width="2"/>
<text x="90" y="140" text-anchor="middle" class="lbl">3. Cut blank (deburr edges)</text>
</g>
</svg>
