<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowA1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333333"/>
    </marker>
    <marker id="arrowA2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b2182b"/>
    </marker>
    <marker id="arrowA3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#999999"/>
    </marker>
  </defs>
  <rect width="700" height="380" fill="#ffffff"/>
  <text x="350" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#222222">Absorptive Power — Fate of Incident Flux Q</text>

  <!-- surface (semi-opaque body, angled) -->
  <rect x="330" y="60" width="30" height="260" fill="#d9cdb8" stroke="#333333" stroke-width="2"/>
  <text x="345" y="345" text-anchor="middle" font-size="12" fill="#333333">surface</text>

  <!-- incident flux -->
  <line x1="130" y1="120" x2="325" y2="120" stroke="#222222" stroke-width="3" marker-end="url(#arrowA1)"/>
  <text x="220" y="105" text-anchor="middle" font-size="13" fill="#222222" font-weight="bold">Incident flux Q</text>

  <!-- absorbed: highlighted, big red arrow going INTO the surface and staying (dissipating) -->
  <line x1="365" y1="120" x2="440" y2="120" stroke="#b2182b" stroke-width="5" marker-end="url(#arrowA2)"/>
  <text x="470" y="115" font-size="13" fill="#b2182b" font-weight="bold">Absorbed Q_a</text>
  <text x="470" y="132" font-size="11" fill="#b2182b">a = Q_a / Q</text>
  <!-- small glow icon indicating heating -->
  <circle cx="345" cy="150" r="10" fill="none" stroke="#b2182b" stroke-width="1.5" stroke-dasharray="2,2"/>
  <text x="345" y="175" text-anchor="middle" font-size="10" fill="#b2182b">→ internal energy</text>

  <!-- reflected: faded, going back -->
  <line x1="325" y1="200" x2="150" y2="160" stroke="#999999" stroke-width="2.5" marker-end="url(#arrowA3)"/>
  <text x="160" y="200" font-size="12" fill="#999999">Reflected Q_r</text>

  <!-- transmitted: faded, going through -->
  <line x1="365" y1="240" x2="540" y2="270" stroke="#999999" stroke-width="2.5" marker-end="url(#arrowA3)"/>
  <text x="500" y="295" font-size="12" fill="#999999">Transmitted Q_t</text>

  <rect x="230" y="335" width="240" height="35" rx="6" fill="#fff8e6" stroke="#c9a227" stroke-width="1.3"/>
  <text x="350" y="358" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a4600">a + r + t = 1</text>
</svg>
