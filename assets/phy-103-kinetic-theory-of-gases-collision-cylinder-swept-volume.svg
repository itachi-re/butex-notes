<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
    <rect width="600" height="300" fill="#ffffff"/>
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 Z" fill="#000"/>
        </marker>
    </defs>
    <!-- Cylinder -->
    <ellipse cx="100" cy="150" rx="30" ry="60" fill="none" stroke="#333" stroke-dasharray="5,5"/>
    <ellipse cx="450" cy="150" rx="30" ry="60" fill="none" stroke="#333"/>
    <path d="M 100,90 L 450,90" stroke="#333" stroke-width="2"/>
    <path d="M 100,210 L 450,210" stroke="#333" stroke-width="2"/>
    
    <!-- Axis line -->
    <path d="M 80,150 L 500,150" stroke="#0072b2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
    <text x="250" y="145" font-family="sans-serif" font-size="14" fill="#0072b2">v_rel × Δt</text>
    
    <!-- Molecule -->
    <circle cx="100" cy="150" r="10" fill="#d55e00"/>
    <circle cx="450" cy="150" r="10" fill="#d55e00" opacity="0.3"/>
    <text x="60" y="155" font-family="sans-serif" font-size="14">d</text>
    
    <!-- Area notation -->
    <path d="M 450,150 L 450,90" stroke="#000" stroke-width="1"/>
    <text x="455" y="125" font-family="sans-serif" font-size="14">Radius = d</text>
    <text x="350" y="60" font-family="sans-serif" font-size="16">Swept volume = πd² × v_rel Δt</text>
    
    <!-- Background molecules in cylinder -->
    <circle cx="180" cy="120" r="10" fill="#009e73"/>
    <circle cx="300" cy="180" r="10" fill="#009e73"/>
    <circle cx="400" cy="110" r="10" fill="#009e73"/>
</svg>