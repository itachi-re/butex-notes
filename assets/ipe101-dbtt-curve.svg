<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="DejaVu Sans, Verdana, Arial, sans-serif" role="img" aria-label="Ductile-to-brittle transition (Charpy impact test)"><title>Ductile-to-brittle transition (Charpy impact test)</title><defs><marker id="m222" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#222"/></marker></defs><rect width="900" height="470" fill="#ffffff"/><text x="450.0" y="28.0" font-size="17" text-anchor="middle" fill="#222" font-weight="bold">Ductile-to-brittle transition (Charpy impact test)</text><text x="450.0" y="46.0" font-size="12" text-anchor="middle" fill="#555" font-weight="normal">BCC steels show a sharp drop of absorbed energy at low temperature — the cause of the Titanic hull fracture</text><line x1="90.0" y1="400.0" x2="90.0" y2="70.0" stroke="#222" stroke-width="2" marker-end="url(#m222)" stroke-linecap="round"/><line x1="80.0" y1="390.0" x2="860.0" y2="390.0" stroke="#222" stroke-width="2" marker-end="url(#m222)" stroke-linecap="round"/><text x="90.0" y="60.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">Impact energy (J)</text><text x="860.0" y="415.0" font-size="13" text-anchor="end" fill="#222" font-weight="bold">Temperature (°C)</text><rect x="90.0" y="90.0" width="330.0" height="300.0" rx="0" fill="#e3f2fd" fill-opacity="0.5" stroke="none" stroke-width="0"/><rect x="420.0" y="90.0" width="440.0" height="300.0" rx="0" fill="#fff3e0" fill-opacity="0.5" stroke="none" stroke-width="0"/><path d="M90,360 L250,355 C340,345 380,300 440,230 C490,170 520,150 560,145 L860,142" fill="none" stroke="#c1121f" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M90,125 L860,125" fill="none" stroke="#2a9d8f" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M90,380 L860,385" fill="none" stroke="#6a4c93" stroke-width="3" stroke-dasharray="8 4" stroke-linejoin="round" stroke-linecap="round"/><text x="855.0" y="118.0" font-size="12" text-anchor="end" fill="#2a9d8f" font-weight="bold">FCC metals (Cu, Al, austenitic steel): ductile at all T</text><text x="520.0" y="170.0" font-size="13" text-anchor="start" fill="#c1121f" font-weight="bold">BCC low-carbon steel</text><text x="450.0" y="375.0" font-size="12" text-anchor="start" fill="#6a4c93" font-weight="bold">ceramics / glass: brittle at all T</text><line x1="440.0" y1="390.0" x2="440.0" y2="230.0" stroke="#222" stroke-width="1.5" stroke-dasharray="5 3" stroke-linecap="round"/><circle cx="440.0" cy="230.0" r="5.0" fill="#222" stroke="#222" stroke-width="1.5"/><text x="446.0" y="408.0" font-size="13" text-anchor="start" fill="#222" font-weight="bold">DBTT</text><line x1="300.0" y1="390.0" x2="300.0" y2="80.0" stroke="#1565c0" stroke-width="2" stroke-linecap="round"/><text x="306.0" y="100.0" font-size="12" text-anchor="start" fill="#1565c0" font-weight="bold">sea water at</text><text x="306.0" y="116.0" font-size="12" text-anchor="start" fill="#1565c0" font-weight="bold">Titanic site ≈ −2 °C</text><text x="200.0" y="290.0" font-size="15" text-anchor="middle" fill="#1d3557" font-weight="bold">BRITTLE</text><text x="200.0" y="308.0" font-size="12" text-anchor="middle" fill="#1d3557" font-weight="normal">(cleavage)</text><text x="660.0" y="290.0" font-size="15" text-anchor="middle" fill="#e65100" font-weight="bold">DUCTILE</text><text x="660.0" y="308.0" font-size="12" text-anchor="middle" fill="#e65100" font-weight="normal">(shear / microvoids)</text><text x="440.0" y="440.0" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">Titanic hull steel (high S, P, low Mn:S): DBTT ≈ 30 °C &gt; sea-water temperature → brittle fracture on impact</text></svg>