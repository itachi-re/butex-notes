<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430" font-family="DejaVu Sans, Verdana, Arial, sans-serif" role="img" aria-label="Geometry used to derive the atomic packing factor"><title>Geometry used to derive the atomic packing factor</title><defs><marker id="m444" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#444"/></marker></defs><rect width="820" height="430" fill="#ffffff"/><text x="410.0" y="28.0" font-size="17" text-anchor="middle" fill="#222" font-weight="bold">Geometry used to derive the atomic packing factor</text><text x="410.0" y="46.0" font-size="12" text-anchor="middle" fill="#555" font-weight="normal">touching atoms along the diagonal: BCC (110) plane and FCC (100) face</text><rect x="120.0" y="150.0" width="141.4" height="100.0" rx="0" fill="#eef3fb" stroke="#234" stroke-width="2"/><circle cx="120.0" cy="150.0" r="43.3" fill="#4a90d9" fill-opacity="0.3" stroke="#234" stroke-width="1.2"/><circle cx="261.4" cy="150.0" r="43.3" fill="#4a90d9" fill-opacity="0.3" stroke="#234" stroke-width="1.2"/><circle cx="120.0" cy="250.0" r="43.3" fill="#4a90d9" fill-opacity="0.3" stroke="#234" stroke-width="1.2"/><circle cx="261.4" cy="250.0" r="43.3" fill="#4a90d9" fill-opacity="0.3" stroke="#234" stroke-width="1.2"/><circle cx="190.7" cy="200.0" r="43.3" fill="#4a90d9" fill-opacity="0.3" stroke="#234" stroke-width="1.2"/><line x1="120.0" y1="250.0" x2="261.4" y2="150.0" stroke="#d62828" stroke-width="3" stroke-linecap="round"/><text x="198.7" y="186.0" font-size="14" text-anchor="start" fill="#d62828" font-weight="bold">4r</text><line x1="58.0" y1="200.0" x2="58.0" y2="150.0" stroke="#444" stroke-width="1.2" marker-end="url(#m444)" stroke-linecap="round"/><line x1="58.0" y1="200.0" x2="58.0" y2="250.0" stroke="#444" stroke-width="1.2" marker-end="url(#m444)" stroke-linecap="round"/><text x="40.0" y="205.0" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">a</text><line x1="190.7" y1="312.0" x2="120.0" y2="312.0" stroke="#444" stroke-width="1.2" marker-end="url(#m444)" stroke-linecap="round"/><line x1="190.7" y1="312.0" x2="261.4" y2="312.0" stroke="#444" stroke-width="1.2" marker-end="url(#m444)" stroke-linecap="round"/><text x="190.7" y="332.0" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">a√2</text><text x="190.7" y="80.0" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">BCC (110) plane</text><text x="60.0" y="385.0" font-size="13" text-anchor="start" fill="#222" font-weight="normal">(4r)² = a² + (a√2)² = 3a²</text><text x="60.0" y="405.0" font-size="13" text-anchor="start" fill="#222" font-weight="normal">⇒ a = 4r/√3</text><rect x="520.0" y="150.0" width="110.0" height="110.0" rx="0" fill="#eef3fb" stroke="#234" stroke-width="2"/><circle cx="520.0" cy="150.0" r="38.9" fill="#8ecae6" fill-opacity="0.4" stroke="#234" stroke-width="1.2"/><circle cx="630.0" cy="150.0" r="38.9" fill="#8ecae6" fill-opacity="0.4" stroke="#234" stroke-width="1.2"/><circle cx="520.0" cy="260.0" r="38.9" fill="#8ecae6" fill-opacity="0.4" stroke="#234" stroke-width="1.2"/><circle cx="630.0" cy="260.0" r="38.9" fill="#8ecae6" fill-opacity="0.4" stroke="#234" stroke-width="1.2"/><circle cx="575.0" cy="205.0" r="38.9" fill="#8ecae6" fill-opacity="0.4" stroke="#234" stroke-width="1.2"/><line x1="520.0" y1="260.0" x2="630.0" y2="150.0" stroke="#d62828" stroke-width="3" stroke-linecap="round"/><text x="583.0" y="191.0" font-size="14" text-anchor="start" fill="#d62828" font-weight="bold">4r</text><line x1="458.0" y1="205.0" x2="458.0" y2="150.0" stroke="#444" stroke-width="1.2" marker-end="url(#m444)" stroke-linecap="round"/><line x1="458.0" y1="205.0" x2="458.0" y2="260.0" stroke="#444" stroke-width="1.2" marker-end="url(#m444)" stroke-linecap="round"/><text x="440.0" y="210.0" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">a</text><line x1="575.0" y1="322.0" x2="520.0" y2="322.0" stroke="#444" stroke-width="1.2" marker-end="url(#m444)" stroke-linecap="round"/><line x1="575.0" y1="322.0" x2="630.0" y2="322.0" stroke="#444" stroke-width="1.2" marker-end="url(#m444)" stroke-linecap="round"/><text x="575.0" y="342.0" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">a</text><text x="575.0" y="80.0" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">FCC (100) face</text><text x="460.0" y="385.0" font-size="13" text-anchor="start" fill="#222" font-weight="normal">(4r)² = a² + a² = 2a²</text><text x="460.0" y="405.0" font-size="13" text-anchor="start" fill="#222" font-weight="normal">⇒ a = 2√2 r</text></svg>