t x="750.0" y="219.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#dc2626" text-anchor="middle" font-weight="normal">(steel = ANODE, pits)</text><line x1="700.0" y1="345.0" x2="620.0" y2="345.0" stroke="#ea580c" stroke-width="2" stroke-linecap="round" marker-end="url(#ahea580c)"/><rect x="490.0" y="360.0" width="340.0" height="40.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/><text x="660.0" y="385.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#991b1b" text-anchor="middle" font-weight="bold">Sn is less reactive than Fe → steel corrodes faster at pores</text><rect x="620.0" y="232.0" width="80.0" height="18.0" rx="0" fill="#ffffff" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2"/><text x="660.0" y="228.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal">scratch</text></svg>