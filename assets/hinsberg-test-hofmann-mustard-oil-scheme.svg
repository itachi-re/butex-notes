<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Georgia, serif" font-size="16" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="760" height="420" fill="#fff"/>
<text x="20" y="30" font-size="20" font-weight="bold">Hinsberg method — separating a mixture of 1°, 2°, 3° amines</text>
<text x="20" y="60">Mixture (R–NH2 + R2NH + R3N) + C6H5SO2Cl (benzenesulfonyl chloride), KOH(aq)</text>
<line x1="30" y1="75" x2="30" y2="105" stroke="black" marker-end="url(#a)"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z"/></marker></defs>

<g transform="translate(20,110)">
<rect x="0" y="0" width="220" height="80" fill="#eef6ff" stroke="#333"/>
<text x="10" y="20" font-weight="bold">1° amine</text>
<text x="10" y="42">forms N,N-disubstituted</text>
<text x="10" y="60">sulfonamide, N–H acidic →</text>
<text x="10" y="78">DISSOLVES in KOH (as salt)</text>
</g>
<g transform="translate(270,110)">
<rect x="0" y="0" width="220" height="80" fill="#fff4e6" stroke="#333"/>
<text x="10" y="20" font-weight="bold">2° amine</text>
<text x="10" y="42">forms N,N-disubstituted</text>
<text x="10" y="60">sulfonamide, no N–H →</text>
<text x="10" y="78">INSOLUBLE precipitate in KOH</text>
</g>
<g transform="translate(520,110)">
<rect x="0" y="0" width="220" height="80" fill="#efe6ff" stroke="#333"/>
<text x="10" y="20" font-weight="bold">3° amine</text>
<text x="10" y="42">no N–H to react →</text>
<text x="10" y="60">does NOT react with</text>
<text x="10" y="78">sulfonyl chloride; stays as free amine (oily layer)</text>
</g>

<text x="20" y="230" font-weight="bold">Separation steps:</text>
<text x="30" y="255">1. Filter/extract: insoluble 2° sulfonamide separated from solution by filtration.</text>
<text x="30" y="278">2. Ether-extract the free 3° amine from the alkaline filtrate (unreacted, non-polar).</text>
<text x="30" y="301">3. Acidify remaining aqueous KOH salt of 1° sulfonamide (HCl) → precipitates sulfonamide.</text>
<text x="30" y="324">4. Hydrolyse each isolated sulfonamide (dil. HCl, reflux) to regenerate the free 1° or 2° amine.</text>
<text x="20" y="360" font-size="14" fill="#555">Principle: N–H acidity of the sulfonamide product (present only when the</text>
<text x="20" y="380" font-size="14" fill="#555">parent amine had N–H bonds) controls solubility in aqueous base.</text>
</svg>
