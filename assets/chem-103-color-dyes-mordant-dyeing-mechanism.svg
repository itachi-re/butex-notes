hor="middle" >−</text><text x="118.0" y="372.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.0" font-weight="700" fill="#6b4f24" text-anchor="middle" >FIBRE</text><text x="118.0" y="390.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" fill="#5b6b7b" text-anchor="middle" >(–COO⁻, –O⁻, –NH₂</text><text x="118.0" y="404.7" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" fill="#5b6b7b" text-anchor="middle" >sites)</text><circle cx="405.0" cy="240.0" r="40.0" fill="#f4c542" stroke="#a67c00" stroke-width="3" /><text x="405.0" y="247.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="26.0" font-weight="700" fill="#5a4300" text-anchor="middle" >M</text><text x="405.0" y="304.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.0" font-weight="700" fill="#8a6700" text-anchor="middle" >MORDANT</text><text x="405.0" y="322.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" fill="#5b6b7b" text-anchor="middle" >metal ion: Al³⁺, Cr³⁺, Fe³⁺, Sn²⁺</text><line x1="186.0" y1="170.0" x2="369.0" y2="222.5" stroke="#6d4aa0" stroke-width="2" stroke-dasharray="6 4" /><line x1="186.0" y1="240.0" x2="369.0" y2="240.0" stroke="#6d4aa0" stroke-width="2" stroke-dasharray="6 4" /><line x1="186.0" y1="310.0" x2="369.0" y2="257.5" stroke="#6d4aa0" stroke-width="2" stroke-dasharray="6 4" /><polygon points="634.2,254.0 610.0,268.0 585.8,254.0 585.8,226.0 610.0,212.0 634.2,226.0" fill="#fde7e2" stroke="#b32020" stroke-width="2.2"/><polygon points="682.7,254.0 658.5,268.0 634.3,254.0 634.3,226.0 658.5,212.0 682.7,226.0" fill="#fde7e2" stroke="#b32020" stroke-width="2.2"/><polygon points="731.2,254.0 707.0,268.0 682.8,254.0 682.8,226.0 707.0,212.0 731.2,226.0" fill="#fde7e2" stroke="#b32020" stroke-width="2.2"/><line x1="584.0" y1="224.0" x2="560.0" y2="204.0" stroke="#b32020" stroke-width="2.2" /><line x1="584.0" y1="256.0" x2="560.0" y2="276.0" stroke="#b32020" stroke-width="2.2" /><circle cx="552.0" cy="198.0" r="10.0" fill="#fff1f0" stroke="#d62828" stroke-width="2" /><circle cx="552.0" cy="282.0" r="10.0" fill="#fff1f0" stroke="#d62828" stroke-width="2" /><text x="552.0" y="202.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="700" fill="#d62828" text-anchor="middle" >O</text><text x="552.0" y="286.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="700" fill="#d62828" text-anchor="middle" >O</text><line x1="544.0" y1="202.0" x2="440.0" y2="226.0" stroke="#6d4aa0" stroke-width="2" stroke-dasharray="6 4" /><line x1="544.0" y1="280.0" x2="440.0" y2="254.0" stroke="#6d4aa0" stroke-width="2" stroke-dasharray="6 4" /><text x="658.0" y="304.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.0" font-weight="700" fill="#8a2020" text-anchor="middle" >DYE</text><text x="658.0" y="322.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" fill="#5b6b7b" text-anchor="middle" >chelating groups: o-hydroxy-carbonyl</text><text x="658.0" y="336.7" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" fill="#5b6b7b" text-anchor="middle" >or o-hydroxy-azo (e.g. alizarin)</text><text x="800.0" y="200.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="600" fill="#6d4aa0" text-anchor="start" >ionic / co-ordinate bonds</text><line x1="796.0" y1="196.0" x2="760.0" y2="196.0" stroke="#6d4aa0" stroke-width="1.2" stroke-dasharray="4 3" /><rect x="830.0" y="232.0" width="120.0" height="28.0" rx="14" fill="#6d4aa0" stroke="none" stroke-width="0" /><text x="890.0" y="251.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.0" font-weight="700" fill="#ffffff" text-anchor="middle" >LAKE</text><text x="890.0" y="276.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" fill="#5b6b7b" text-anchor="middle" >insoluble, fast to</text><text x="890.0" y="290.7" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" fill="#5b6b7b" text-anchor="middle" >washing and light</text><text x="500.0" y="440.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.0" font-weight="700" fill="#17375e" text-anchor="middle" >Methods of mordanting</text><rect x="24.0" y="456.0" width="306.0" height="130.0" rx="10" fill="#e8f6ea" stroke="#aab7c6" stroke-width="1.4" /><text x="177.0" y="484.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.0" font-weight="700" fill="#17375e" text-anchor="middle" >1  Pre-mordanting (on-chrome)</text><text x="177.0" y="512.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" fill="#1b2733" text-anchor="middle" >fibre treated with the metal salt first,</text><text x="177.0" y="528.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" fill="#1b2733" text-anchor="middle" >then dyed in the dye bath</text><rect x="346.0" y="456.0" width="306.0" height="130.0" rx="10" fill="#fff9d9" stroke="#aab7c6" stroke-width="1.4" /><text x="499.0" y="484.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.0" font-weight="700" fill="#17375e" text-anchor="middle" >2  Meta-chrome (simultaneous)</text><text x="499.0" y="512.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" fill="#1b2733" text-anchor="middle" >metal salt and dye applied together</text><text x="499.0" y="528.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" fill="#1b2733" text-anchor="middle" >in a single bath</text><rect x="668.0" y="456.0" width="306.0" height="130.0" rx="10" fill="#f1e8fa" stroke="#aab7c6" stroke-width="1.4" /><text x="821.0" y="484.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.0" font-weight="700" fill="#17375e" text-anchor="middle" >3  After-chroming (post-mordanting)</text><text x="821.0" y="512.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" fill="#1b2733" text-anchor="middle" >fibre dyed first, then treated with the</text><text x="821.0" y="528.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" fill="#1b2733" text-anchor="middle" >metal salt (e.g. K₂Cr₂O₇)</text><text x="500.0" y="614.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#5b6b7b" text-anchor="middle" >Colour depends on the metal: alizarin gives red with Al, violet-black with Fe, brownish with Cr, orange with Sn (typical).</text></svg>