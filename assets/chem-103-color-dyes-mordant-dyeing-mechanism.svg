<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-label="Mordant dyeing mechanism" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Mordant dyeing mechanism</title><desc>Schematic of fibre, metal mordant and chelating dye forming an insoluble lake, with three mordanting methods</desc><rect width="1000" height="640" fill="#ffffff"/><path d="M1,66 V15 Q1,1 15,1 H985 Q999,1 999,15 V66 Z" fill="#17375e"/><rect x="1" y="1" width="998" height="638" rx="14" fill="none" stroke="#cfd8e3" stroke-width="2"/><text x="24.0" y="31.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20.0" font-weight="700" fill="#ffffff" text-anchor="start" >Mordant dyes: the metal ion is the bridge between fibre and dye</text><text x="24.0" y="53.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" fill="#c9d6e6" text-anchor="start" >Fibre – mordant (metal) – dye = insoluble coloured lake held inside the fibre</text><text x="982.0" y="630.0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#8fa0b3" text-anchor="end" >CHEM-103 · Colour, Dyes &amp; Pigments</text><rect x="24.0" y="84.0" width="952.0" height="330.0" rx="10" fill="#fbfdff" stroke="#cfd8e3" stroke-width="1.4" /><path d="M118.0,120.0 L119.4,122.0 L120.8,124.0 L122.2,126.0 L123.4,128.0 L124.6,130.0 L125.6,132.0 L126.4,134.0 L127.1,136.0 L127.6,138.0 L127.9,140.0 L128.0,142.0 L127.9,144.0 L127.6,146.0 L127.1,148.0 L126.4,150.0 L125.6,152.0 L124.5,154.0 L123.4,156.0 L122.1,158.0 L120.8,160.0 L119.4,162.0 L118.0,164.0 L116.6,166.0 L115.2,168.0 L113.8,170.0 L112.6,172.0 L111.4,174.0 L110.4,176.0 L109.6,178.0 L108.9,180.0 L108.4,182.0 L108.1,184.0 L108.0,186.0 L108.1,188.0 L108.4,190.0 L108.9,192.0 L109.6,194.0 L110.5,196.0 L111.5,198.0 L112.6,200.0 L113.9,202.0 L115.2,204.0 L116.6,206.0 L11