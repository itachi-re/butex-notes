<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 620 430' width='620' height='430' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width='620' height='430' fill='white'/>
<defs><marker id='arrow' markerWidth='10' markerHeight='10' refX='8' refY='3' orient='auto' markerUnits='strokeWidth'><path d='M0,0 L0,6 L9,3 z' fill='#111'/></marker></defs>
<text x='310.0' y='24' font-size='15' font-family='Arial,Helvetica,sans-serif' font-weight='700'  fill='#111' text-anchor='middle'>Hofmann & Curtius Degradation (loss of one carbon)</text>
<text x='60' y='60' font-size='13' font-family='Arial,Helvetica,sans-serif' font-weight='700'  fill='#111' text-anchor='start'>Hofmann (general):</text>
<text x='60' y='85' font-size='14' font-family='Arial,Helvetica,sans-serif'   fill='#111' text-anchor='start'>R–CO–NH₂</text>
<line x1='90' y1='95' x2='90' y2='127' stroke='#111' stroke-width='2' marker-end='url(#arrow)'/>
<text x='100' y='108.44' font-size='11' font-family='Arial,Helvetica,sans-serif'   fill='#111' text-anchor='start'>Br₂ / KOH</text>
<text x='60' y='148' font-size='14' font-family='Arial,Helvetica,sans-serif'   fill='#111' text-anchor='start'>R–N=C=O</text>
<line x1='90' y1='158' x2='90' y2='190' stroke='#111' stroke-width='2' marker-end='url(#arrow)'/>
<text x='100' y='171.44' font-size='11' font-family='Arial,Helvetica,sans-serif'   fill='#111' text-anchor='start'>H₂O</text>
<text x='60' y='210' font-size='14' font-family='Arial,Helvetica,sans-serif'   fill='#b00' text-anchor='start'>R–NH₂ + CO₂</text>
<text x='340' y='60' font-size='13' font-family='Arial,Helvetica,sans-serif' font-weight='700'  fill='#111' text-anchor='start'>Hofmann example:</text>
<text x='340' y='85' font-size='13' font-family='Arial,Helvetica,sans-serif'   fill='#111' text-anchor='start'>CH₃CH₂CONH₂</text>
<text x='340' y='100' font-size='10' font-family='Arial,Helvetica,sans-serif'  font-style='italic' fill='#555' text-anchor='start'>propanamide</text>
<line x1='370' y1='108' x2='370' y2='140' stroke='#111' stroke-width='2' marker-end='url(#arrow)'/>
<text x='380' y='121.44' font-size='11' font-family='Arial,Helvetica,sans-serif'   fill='#111' text-anchor='start'>Br₂ / KOH</text>
<text x='340' y='165' font-size='13' font-family='Arial,Helvetica,sans-serif'   fill='#111' text-anchor='start'>CH₃CH₂N=C=O</text>
<line x1='370' y1='173' x2='370' y2='205' stroke='#111' stroke-width='2' marker-end='url(#arrow)'/>
<text x='380' y='186.44' font-size='11' font-family='Arial,Helvetica,sans-serif'   fill='#111' text-anchor='start'>H₂O</text>
<text x='340' y='230' font-size='13' font-family='Arial,Helvetica,sans-serif'   fill='#b00' text-anchor='start'>CH₃CH₂NH₂ + CO₂</text>
<text x='340' y='246' font-size='10' font-family='Arial,Helvetica,sans-serif'  font-style='italic' fill='#555' text-anchor='start'>ethylamine</text>
<line x1='20' y1='270' x2='600' y2='270' stroke='#ccc' stroke-width='1'/>
<text x='60' y='300' font-size='13' font-family='Arial,Helvetica,sans-serif' font-weight='700'  fill='#111' text-anchor='start'>Curtius (general):</text>
<text x='60' y='325' font-size='14' font-family='Arial,Helvetica,sans-serif'   fill='#111' text-anchor='start'>R–COCl</text>
<line x1='90' y1='335' x2='90' y2='363' stroke='#111' stroke-width='2' marker-end='url(#arrow)'/>
<text x='100' y='346.76' font-size='11' font-family='Arial,Helvetica,sans-serif'   fill='#111' text-anchor='start'>NaN₃</text>
<text x='60' y='383' font-size='14' font-family='Arial,Helvetica,sans-serif'   fill='#111' text-anchor='start'>R–CO–N₃</text>
<text x='340' y='300' font-size='13' font-family='Arial,Helvetica,sans-serif' font-weight='700'  fill='#111' text-anchor='start'>Curtius example:</text>
<text x='340' y='325' font-size='13' font-family='Arial,Helvetica,sans-serif'   fill='#111' text-anchor='start'>CH₃CH₂COCl</text>
<text x='340' y='340' font-size='10' font-family='Arial,Helvetica,sans-serif'  font-style='italic' fill='#555' text-anchor='start'>propanoyl chloride</text>
<line x1='370' y1='348' x2='370' y2='376' stroke='#111' stroke-width='2' marker-end='url(#arrow)'/>
<text x='380' y='359.76' font-size='11' font-family='Arial,Helvetica,sans-serif'   fill='#111' text-anchor='start'>NaN₃</text>
<text x='340' y='396' font-size='10.5' font-family='Arial,Helvetica,sans-serif'   fill='#111' text-anchor='start'>CH₃CH₂CON₃  →(Δ,-N₂)→  CH₃CH₂N=C=O  →(H₂O)→  CH₃CH₂NH₂ + CO₂</text>
</svg>
