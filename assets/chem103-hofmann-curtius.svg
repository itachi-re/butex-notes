<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .lbl{font-size:14px;fill:#1a1a1a;}
    .small{font-size:12px;fill:#333;}
    .arrow{stroke:#33475b;stroke-width:2;marker-end:url(#ah5);fill:none;}
    .box{fill:#f5f8fc;stroke:#33475b;stroke-width:1.5;}
  </style>
  <defs>
    <marker id="ah5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#33475b"/>
    </marker>
  </defs>

  <text x="450" y="22" text-anchor="middle" font-size="17" font-weight="bold">Hofmann &amp; Curtius Degradation (both lose one carbon)</text>

  <text x="20" y="55" font-size="14" font-weight="bold">Hofmann bromamide degradation</text>
  <rect class="box" x="20" y="65" width="150" height="45" rx="6"/>
  <text x="95" y="92" text-anchor="middle" class="lbl">R-CONH2</text>
  <path class="arrow" d="M170,88 H260"/>
  <text x="215" y="78" text-anchor="middle" class="small">Br2 / KOH</text>
  <rect class="box" x="260" y="65" width="170" height="45" rx="6"/>
  <text x="345" y="92" text-anchor="middle" class="small">R-N=C=O (isocyanate, via nitrene R-N:)</text>
  <path class="arrow" d="M430,88 H500"/>
  <text x="465" y="78" text-anchor="middle" class="small">H2O</text>
  <rect class="box" x="500" y="65" width="150" height="45" rx="6"/>
  <text x="575" y="92" text-anchor="middle" class="lbl">R-NH2 + CO2</text>
  <text x="770" y="92" text-anchor="middle" class="small" font-weight="bold">1 carbon lost</text>

  <text x="20" y="150" font-size="14" font-weight="bold">Curtius rearrangement</text>
  <rect class="box" x="20" y="160" width="150" height="45" rx="6"/>
  <text x="95" y="182" text-anchor="middle" class="small">R-COCl</text>
  <text x="95" y="197" text-anchor="middle" class="small">(acid chloride)</text>
  <path class="arrow" d="M170,182 H240"/>
  <text x="205" y="172" text-anchor="middle" class="small">NaN3</text>
  <rect class="box" x="240" y="160" width="150" height="45" rx="6"/>
  <text x="315" y="187" text-anchor="middle" class="small">R-CO-N3 (acyl azide)</text>
  <path class="arrow" d="M390,182 H460"/>
  <text x="425" y="172" text-anchor="middle" class="small">Δ, -N2</text>
  <rect class="box" x="460" y="160" width="170" height="45" rx="6"/>
  <text x="545" y="187" text-anchor="middle" class="small">R-N=C=O (isocyanate)</text>
  <path class="arrow" d="M630,182 H700"/>
  <text x="665" y="172" text-anchor="middle" class="small">H2O</text>
  <rect class="box" x="700" y="160" width="150" height="45" rx="6"/>
  <text x="775" y="187" text-anchor="middle" class="lbl">R-NH2 + CO2</text>

  <text x="450" y="245" text-anchor="middle" class="small">Both proceed through a common R-N=C=O (isocyanate) intermediate formed by migration of R</text>
  <text x="450" y="265" text-anchor="middle" class="small">from carbon to the electron-deficient nitrogen (nitrene/acylnitrene), and both convert R-CO-X → R-NH2, losing the carbonyl carbon as CO2.</text>
</svg>
