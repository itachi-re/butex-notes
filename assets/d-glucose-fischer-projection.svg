<svg viewBox="0 0 320 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="320" height="420" fill="#ffffff"/>
<text x="160" y="24" text-anchor="middle" font-size="16" font-weight="bold">D-Glucose (Fischer projection)</text>

<g font-size="14" text-anchor="middle">
<text x="160" y="55">CHO</text>
<text x="160" y="65">C1</text>
<line x1="160" y1="68" x2="160" y2="88" stroke="#222"/>

<line x1="120" y1="100" x2="200" y2="100" stroke="#222"/>
<text x="105" y="104" text-anchor="end">H</text>
<text x="215" y="104">OH</text>
<text x="160" y="112" font-size="11">C2*</text>
<line x1="160" y1="100" x2="160" y2="120" stroke="#222"/>

<line x1="120" y1="132" x2="200" y2="132" stroke="#222"/>
<text x="215" y="136">H</text>
<text x="105" y="136" text-anchor="end">HO</text>
<text x="160" y="144" font-size="11">C3*</text>
<line x1="160" y1="132" x2="160" y2="152" stroke="#222"/>

<line x1="120" y1="164" x2="200" y2="164" stroke="#222"/>
<text x="105" y="168" text-anchor="end">H</text>
<text x="215" y="168">OH</text>
<text x="160" y="176" font-size="11">C4*</text>
<line x1="160" y1="164" x2="160" y2="184" stroke="#222"/>

<line x1="120" y1="196" x2="200" y2="196" stroke="#222"/>
<text x="105" y="200" text-anchor="end">H</text>
<text x="215" y="200">OH</text>
<text x="160" y="208" font-size="11">C5*</text>
<line x1="160" y1="196" x2="160" y2="216" stroke="#222"/>

<text x="160" y="236">CH&#8322;OH</text>
<text x="160" y="248" font-size="11">C6</text>
</g>

<text x="20" y="290" font-size="12">* = asymmetric (chiral) carbons C2&#8211;C5 (four stereocentres)</text>
<text x="20" y="312" font-size="12">All &#8211;OH on the right &#8594; D-sugar (D-glucose, per Fischer-Rosanoff convention)</text>
<text x="20" y="340" font-size="12" fill="#555">Mutarotation: on dissolving, the open-chain aldehyde cyclises;</text>
<text x="20" y="358" font-size="12" fill="#555">C1 becomes a new (anomeric) stereocentre, giving &#945; and &#946; forms</text>
<text x="20" y="376" font-size="12" fill="#555">that interconvert via the open-chain form until specific rotation is constant.</text>
</svg>
