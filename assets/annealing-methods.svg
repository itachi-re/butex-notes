, sans-serif">about A1 / slow cool)</text><text x="375.0" y="205.0" font-size="10" text-anchor="end" font-weight="normal" fill="#5f6b7a" font-family="Helvetica, Arial, sans-serif">time</text><text x="485.0" y="52.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2933" font-family="Helvetica, Arial, sans-serif">Stress-relief</text><rect x="405.0" y="60.0" width="165.0" height="150.0" rx="4" fill="#fbfcfd" stroke="#d5dae0" stroke-width="1.2"/><line x1="405.0" y1="90.0" x2="570.0" y2="90.0" stroke="#c0392b" stroke-width="1" stroke-dasharray="5,4"/><line x1="405.0" y1="130.0" x2="570.0" y2="130.0" stroke="#2471a3" stroke-width="1" stroke-dasharray="5,4"/><text x="408.0" y="86.0" font-size="10" text-anchor="start" font-weight="normal" fill="#c0392b" font-family="Helvetica, Arial, sans-serif">A3</text><text x="408.0" y="126.0" font-size="10" text-anchor="start" font-weight="normal" fill="#2471a3" font-family="Helvetica, Arial, sans-serif">A1</text><polyline points="410.0,200.0 435.0,156.0 490.0,156.0 550.0,198.0" fill="none" stroke="#222" stroke-width="2.4"/><text x="487.0" y="232.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#5f6b7a" font-family="Helvetica, Arial, sans-serif">subcritical:</text><text x="487.0" y="247.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#5f6b7a" font-family="Helvetica, Arial, sans-serif">1000-1200 °F</text><text x="565.0" y="205.0" font-size="10" text-anchor="end" font-weight="normal" fill="#5f6b7a" font-family="Helvetica, Arial, sans-serif">time</text><text x="675.0" y="52.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2933" font-family="Helvetica, Arial, sans-serif">Process annealing</text><rect x="595.0" y="60.0" width="165.0" height="150.0" rx="4" fill="#fbfcfd" stroke="#d5dae0" stroke-width="1.2"/><line x1="595.0" y1="90.0" x2="760.0" y2="90.0" stroke="#c0392b" stroke-width="1" stroke-dasharray="5,4"/><line x1="595.0" y1="130.0" x2="760.0" y2="130.0" stroke="#2