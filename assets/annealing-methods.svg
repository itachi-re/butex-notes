<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 285" width="800" height="285" role="img" aria-label="Annealing variants schematic" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Annealing variants schematic</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#333" stroke-width="2"/></pattern><pattern id="hatch2" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)"><line x1="0" y1="0" x2="0" y2="5" stroke="#e67e22" stroke-width="2"/></pattern></defs><rect x="0.5" y="0.5" width="799" height="284" fill="#ffffff" stroke="#cfd4da"/><text x="400.0" y="26.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2933" font-family="Helvetica, Arial, sans-serif">Annealing variants: schematic time-temperature paths (not to scale)</text><text x="105.0" y="52.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2933" font-family="Helvetica, Arial, sans-serif">Full annealing</text><rect x="25.0" y="60.0" width="165.0" height="150.0" rx="4" fill="#fbfcfd" stroke="#d5dae0" stroke-width="1.2"/><line x1="25.0" y1="90.0" x2="190.0" y2="90.0" stroke="#c0392b" stroke-width="1" stroke-dasharray="5,4"/><line x1="25.0" y1="130.0" x2="190.0" y2="130.0" stroke="#2471a3" stroke-width="1" stroke-dasharray="5,4"/><text x="28.0" y="86.0" font-size="10" text-anchor="start" font-weight="normal" fill="#c0392b" font-family="Helvetica, Arial, sans-serif">A3</text><text x="28.0" y="126.0" font-size="10" text-anchor="start" font-weight="normal" fill="#2471a3" font-family="Helvetica, Arial, sans-serif">A1</text><polyline points="30.0,200.0 60.0,92.0 90.0,92.0 170.0,182.0" fill="none" stroke="#222" stroke-width="2.4"/><text x="10