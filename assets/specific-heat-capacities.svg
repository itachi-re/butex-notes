<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <rect width="400" height="200" fill="#f8f9fa"/>
  <text x="200" y="30" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Specific Heat Capacities (Constant Volume vs Constant Pressure)</text>
  <!-- Constant Volume -->
  <rect x="50" y="60" width="100" height="100" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
  <text x="100" y="115" text-anchor="middle" font-family="Arial" font-size="14">Constant Volume</text>
  <text x="100" y="135" text-anchor="middle" font-family="Arial" font-size="12">W = 0</text>
  <!-- Constant Pressure -->
  <rect x="250" y="60" width="100" height="100" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
  <line x1="250" y1="80" x2="350" y2="80" stroke="#ef4444" stroke-width="3" stroke-dasharray="5,5"/>
  <text x="300" y="115" text-anchor="middle" font-family="Arial" font-size="14">Constant Pressure</text>
  <text x="300" y="135" text-anchor="middle" font-family="Arial" font-size="12">W > 0 (Expansion)</text>
</svg>