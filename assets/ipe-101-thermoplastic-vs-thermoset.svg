ke-linecap="round"/><line x1="849.0" y1="214.1" x2="887.7" y2="223.3" stroke="#dc2626" stroke-width="1.6" stroke-linecap="round"/><line x1="849.0" y1="214.1" x2="836.0" y2="265.9" stroke="#dc2626" stroke-width="1.6" stroke-linecap="round"/><circle cx="849.0" cy="214.1" r="3.2" fill="#7f1d1d" stroke="#7f1d1d" stroke-width="1"/><line x1="836.0" y1="265.9" x2="882.8" y2="262.4" stroke="#dc2626" stroke-width="1.6" stroke-linecap="round"/><line x1="880.2" y1="97.3" x2="881.6" y2="138.3" stroke="#dc2626" stroke-width="1.6" stroke-linecap="round"/><circle cx="880.2" cy="97.3" r="3.2" fill="#7f1d1d" stroke="#7f1d1d" stroke-width="1"/><line x1="891.0" y1="181.3" x2="887.7" y2="223.3" stroke="#dc2626" stroke-width="1.6" stroke-linecap="round"/><circle cx="891.0" cy="181.3" r="3.2" fill="#7f1d1d" stroke="#7f1d1d" stroke-width="1"/><circle cx="882.8" cy="262.4" r="3.2" fill="#7f1d1d" stroke="#7f1d1d" stroke-width="1"/><text x="710.0" y="290.0" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#374151" text-anchor="middle" font-weight="normal">strong covalent cross-links (dots) lock chains in a 3-D network</text><text x="710.0" y="306.0" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="bold">heat → no melting; chars / decomposes; cannot be re-shaped</text><text x="710.0" y="324.0" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">Examples: Bakelite, epoxy, melamine, polyester resin</text><rect x="30.0" y="340.0" width="880.0" height="46.0" rx="8" fill="#fffbeb" stroke="#ca8a04" stroke-width="1.2"/><text x="470.0" y="361.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#713f12" text-anchor="middle" font-weight="bold">Cross-link density ↑  →  stiffness, hardness, heat resistance ↑  but  brittleness ↑, elongation ↓, recyclability ↓</text><text x="470.0" y="377.0" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#713f12" text-anchor="middle" font-weight="normal">(this is why thermosets are generally stronger and more heat-resistant than thermoplastics)</text></svg>