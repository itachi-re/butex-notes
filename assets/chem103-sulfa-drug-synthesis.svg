<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .lbl{font-size:14px;fill:#1a1a1a;}
    .small{font-size:12px;fill:#333;}
    .arrow{stroke:#33475b;stroke-width:2;marker-end:url(#ah4);fill:none;}
    .box{fill:#f5f8fc;stroke:#33475b;stroke-width:1.5;}
  </style>
  <defs>
    <marker id="ah4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#33475b"/>
    </marker>
  </defs>

  <text x="450" y="24" text-anchor="middle" font-size="17" font-weight="bold">Sulfa-Drug Synthesis: Sulfanilamide from Aniline</text>

  <rect class="box" x="15" y="45" width="150" height="50" rx="6"/>
  <text x="90" y="75" text-anchor="middle" class="lbl">C6H5-NH2</text>
  <path class="arrow" d="M165,70 H240"/>
  <text x="200" y="60" text-anchor="middle" class="small">(CH3CO)2O</text>

  <rect class="box" x="240" y="45" width="170" height="50" rx="6"/>
  <text x="325" y="75" text-anchor="middle" class="lbl">C6H5-NHCOCH3</text>
  <path class="arrow" d="M410,70 H480"/>
  <text x="445" y="60" text-anchor="middle" class="small">ClSO3H</text>

  <rect class="box" x="480" y="45" width="210" height="50" rx="6"/>
  <text x="585" y="75" text-anchor="middle" class="lbl">p-CH3CONH-C6H4-SO2Cl</text>
  <path class="arrow" d="M690,70 H760"/>
  <text x="725" y="60" text-anchor="middle" class="small">NH3</text>

  <rect class="box" x="720" y="45" width="160" height="50" rx="6"/>
  <text x="800" y="70" text-anchor="middle" class="lbl">p-CH3CONH-</text>
  <text x="800" y="86" text-anchor="middle" class="lbl">C6H4-SO2NH2</text>

  <path class="arrow" d="M800,95 V145"/>
  <text x="800" y="130" text-anchor="middle" class="small">hydrolysis, H3O+</text>

  <rect class="box" x="700" y="150" width="180" height="55" rx="6"/>
  <text x="790" y="175" text-anchor="middle" class="lbl">p-H2N-C6H4-SO2NH2</text>
  <text x="790" y="193" text-anchor="middle" class="small" font-weight="bold">Sulfanilamide</text>

  <text x="450" y="235" text-anchor="middle" class="small">Steps: acetylation (protects -NH2) → chlorosulfonation → amidation with NH3 → deacetylation (removes protecting group)</text>
</svg>
