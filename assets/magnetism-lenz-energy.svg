<svg xmlns="http://www.w3.org/2000/svg" width="680" height="315" viewBox="0 0 680 315" font-family="Helvetica, Arial, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Lenz's law and conservation of energy: sliding rod</title>
<defs>
<marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#1f2937"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#1d4ed8"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#dc2626"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#15803d"/></marker>
</defs>
<rect width="680" height="315" fill="#ffffff"/>
<line x1="120" y1="90" x2="580" y2="90" stroke="#1f2937" stroke-width="3"/><line x1="120" y1="230" x2="580" y2="230" stroke="#1f2937" stroke-width="3"/>
<path d="M120 90 L120 130 M120 190 L120 230" stroke="#1f2937" stroke-width="2" fill="none"/><rect x="110" y="130" width="20" height="60" fill="#fde68a" stroke="#1f2937"/><text x="82" y="165" fill="#1f2937">R</text>
<line x1="420" y1="90" x2="420" y2="230" stroke="#92400e" stroke-width="8" stroke-linecap="round"/>
<text x="190" y="118" fill="#dc2626" font-size="18" text-anchor="middle">×</text>
<text x="190" y="206" fill="#dc2626" font-size="18" text-anchor="middle">×</text>
<text x="260" y="118" fill="#dc2626" font-size="18" text-anchor="middle">×</text>
<text x="260" y="206" fill="#dc2626" font-size="18" text-anchor="middle">×</text>
<text x="330" y="118" fill="#dc2626" font-size="18" text-anchor="middle">×</text>
<text x="330" y="206" fill="#dc2626" font-size="18" text-anchor="middle">×</text>
<text x="490" y="118" fill="#dc2626" font-size="18" text-anchor="middle">×</text>
<text x="490" y="206" fill="#dc2626" font-size="18" text-anchor="middle">×</text>
<text x="550" y="118" fill="#dc2626" font-size="18" text-anchor="middle">×</text>
<text x="550" y="206" fill="#dc2626" font-size="18" text-anchor="middle">×</text>
<text x="190" y="64" fill="#dc2626">× = B into the page</text>
<line x1="445" y1="135" x2="520" y2="135" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ab)"/><text x="528" y="140" fill="#1d4ed8">v</text>
<line x1="412" y1="180" x2="345" y2="180" stroke="#15803d" stroke-width="2.5" marker-end="url(#ag)"/><text x="300" y="176" fill="#15803d" text-anchor="end">F (opposes v)</text>
<line x1="438" y1="210" x2="438" y2="112" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/><text x="446" y="205" fill="#dc2626">I</text>
<line x1="340" y1="90" x2="300" y2="90" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/><line x1="300" y1="230" x2="340" y2="230" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/>
<text x="40" y="272" fill="#1f2937">Rod moves right: flux into the page grows, so the induced current is anticlockwise.</text>
<text x="40" y="294" fill="#1f2937">The force F = B²l²v/R on the rod opposes v. Work done against F = ε²/R = heat in R.</text>
</svg>
