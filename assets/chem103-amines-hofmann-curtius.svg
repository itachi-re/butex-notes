<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" width="960" height="350" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" role="img" aria-labelledby="t d">
<title id="t">Hofmann and Curtius degradations</title>
<desc id="d">An acid amide (Hofmann) or acyl azide (Curtius) rearranges to an isocyanate, which hydrolyses to a primary amine with one carbon fewer</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0.5 L10,5 L0,9.5 Z" fill="#1f2328"/></marker>
<marker id="arrS" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0.5 L0,5 L10,9.5 Z" fill="#1f2328"/></marker>
<marker id="arrR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0.5 L10,5 L0,9.5 Z" fill="#cf222e"/></marker>
</defs>
<rect x="0.5" y="0.5" width="959" height="349" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<line x1="69.0" y1="84.8" x2="91.0" y2="72.0" stroke="#1f2328" stroke-width="1.8" stroke-linecap="round"/>
<line x1="93.3" y1="72.0" x2="93.3" y2="49.5" stroke="#1f2328" stroke-width="1.8" stroke-linecap="round"/>
