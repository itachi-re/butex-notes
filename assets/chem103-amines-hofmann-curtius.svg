<line x1="91.0" y1="72.0" x2="113.0" y2="84.8" stroke="#1f2328" stroke-width="1.8" stroke-linecap="round"/>
<text x="26.0" y="128.4" text-anchor="start" font-size="13" fill="#57606a" font-weight="normal" xml:space="preserve"><tspan>Primary amide  R–CONH</tspan><tspan dy="4" font-size="9">2</tspan></text>
<line x1="69.0" y1="274.8" x2="91.0" y2="262.0" stroke="#1f2328" stroke-width="1.8" stroke-linecap="round"/>
<line x1="93.3" y1="262.0" x2="93.3" y2="239.5" stroke="#1f2328" stroke-width="1.8" stroke-linecap="round"/>
<line x1="88.7" y1="262.0" x2="88.7" y2="239.5" stroke="#1f2328" stroke-width="1.8" stroke-linecap="round"/>
<line x1="91.0" y1="262.0" x2="113.0" y2="274.8" stroke="#1f2328" stroke-width="1.8" stroke-linecap="round"/>
<line x1="132.2" y1="276.8" x2="145.2" y2="269.2" stroke="#1f2328" stroke-width="1.8" stroke-linecap="round"/>
<line x1="129.8" y1="272.8" x2="142.8" y2="265.2" stroke="#1f2328" stroke-width="1.8" stroke-linecap="round"/>
<line x1="167.1" y1="272.9" x2="173.8" y2="276.8" stroke="#1f2328" stroke-width="1.8" stroke-linecap="round"/>
<line x1="169.5" y1="268.9" x2="176.2" y2="272.8" stroke="#1f2328" stroke-width="1.8" stroke-linecap="round"/>
<text x="65.6" y="316.4" text-anchor="start" font-size="13" fill="#57606a" font-weight="normal" xml:space="preserve"><tspan>Acyl azide  R–CON</tspan><tspan dy="4" font-size="9">3</tspan></text>
<line x1="235" y1="80" x2="420" y2="150" stroke="#1f2328" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="266.8" y="86.4" text-anchor="start" font-size="13" fill="#424a53" font-weight="normal" xml:space="preserve"><tspan>Br</tspan><tspan dy="4" font-size="9">2</tspan><tspan dy="-4"> / NaOH</tspan></text>
<text x="276.4" y="132.4" text-anchor="start" font-size="13" fill="#8250df" font-weight="bold" xml:space="preserve" style="font-style:italic"><tspan>Hofmann</tspan></text>
<line x1="235" y1="255" x2="420" y2="188" stroke="#1f2328" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="276.4" y="211.4" text-anchor="start" font-size="13" fill="#8250df" font-weight="bold" xml:space="preserve" style="font-style:italic"><tspan>Curtius</tspan></text>
<text x="281.5" y="254.4" text-anchor="start" font-size="13" fill="#424a53" font-weight="normal" xml:space="preserve"><tspan>Δ, −N</tspan><tspan dy="4" font-size="9">2</tspan></text>
<line x1="464.0" y1="177.8" x2="477.0" y2="170.2" stroke="#1f2328" stroke-width="1.8" stroke-linecap="round"/>
