<line x1="526.0" y1="167.3" x2="557.0" y2="167.3" stroke="#1f2328" stroke-width="1.8" stroke-linecap="round"/>
<line x1="526.0" y1="162.7" x2="557.0" y2="162.7" stroke="#1f2328" stroke-width="1.8" stroke-linecap="round"/>
<text x="445.5" y="226.4" text-anchor="start" font-size="13" fill="#57606a" font-weight="normal" xml:space="preserve"><tspan>Isocyanate  R–N=C=O</tspan></text>
<text x="444.1" y="246.1" text-anchor="start" font-size="12" fill="#57606a" font-weight="normal" xml:space="preserve" style="font-style:italic"><tspan>(common intermediate)</tspan></text>
<line x1="625" y1="165" x2="745" y2="165" stroke="#1f2328" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="675.4" y="150.9" text-anchor="start" font-size="13" fill="#424a53" font-weight="normal" xml:space="preserve"><tspan>H</tspan><tspan dy="4" font-size="9">2</tspan><tspan dy="-4">O</tspan></text>
<text x="671.8" y="189.9" text-anchor="start" font-size="13" fill="#424a53" font-weight="normal" xml:space="preserve"><tspan>−CO</tspan><tspan dy="4" font-size="9">2</tspan></text>
<line x1="799.0" y1="177.8" x2="812.0" y2="170.2" stroke="#1f2328" stroke-width="1.8" stroke-linecap="round"/>
<text x="778.8" y="226.8" text-anchor="start" font-size="14" fill="#1f2328" font-weight="bold" xml:space="preserve"><tspan>Primary amine</tspan></text>
<text x="725.4" y="248.1" text-anchor="start" font-size="12" fill="#57606a" font-weight="normal" xml:space="preserve"><tspan>one carbon fewer than the amide</tspan></text>
<text x="55.5" y="95.4" text-anchor="start" font-size="16" fill="#1a7f37" font-weight="bold" xml:space="preserve"><tspan>R</tspan></text>
<text x="86.5" y="41.4" text-anchor="start" font-size="16" fill="#cf222e" font-weight="bold" xml:space="preserve"><tspan>O</tspan></text>
<text x="117.5" y="95.4" text-anchor="start" font-size="16" fill="#0969da" font-weight="bold" xml:space="preserve"><tspan>NH</tspan><tspan dy="5" font-size="12">2</tspan></text>
<text x="55.5" y="285.4" text-anchor="start" font-size="16" fill="#1a7f37" font-weight="bold" xml:space="preserve"><tspan>R</tspan></text>
<text x="86.5" y="231.4" text-anchor="start" font-size="16" fill="#cf222e" font-weight="bold" xml:space="preserve"><tspan>O</tspan></text>
<text x="117.5" y="285.4" text-anchor="start" font-size="16" fill="#0969da" font-weight="bold" xml:space="preserve"><tspan>N</tspan></text>
<text x="148.5" y="267.4" text-anchor="start" font-size="16" fill="#0969da" font-weight="bold" xml:space="preserve"><tspan>N</tspan><tspan dy="-7" font-size="12">+</tspan></text>
<text x="179.5" y="285.4" text-anchor="start" font-size="16" fill="#0969da" font-weight="bold" xml:space="preserve"><tspan>N</tspan><tspan dy="-7" font-size="12">−</tspan></text>
<text x="450.5" y="188.4" text-anchor="start" font-size="16" fill="#1a7f37" font-weight="bold" xml:space="preserve"><tspan>R</tspan></text>
<text x="481.5" y="170.4" text-anchor="start" font-size="16" fill="#0969da" font-weight="bold" xml:space="preserve"><tspan>N</tspan></text>
<text x="561.5" y="170.4" text-anchor="start" font-size="16" fill="#cf222e" font-weight="bold" xml:space="preserve"><tspan>O</tspan></text>
<text x="785.5" y="188.4" text-anchor="start" font-size="16" fill="#1a7f37" font-weight="bold" xml:space="preserve"><tspan>R</tspan></text>
<text x="816.5" y="170.4" text-anchor="start" font-size="16" fill="#0969da" font-weight="bold" xml:space="preserve"><tspan>NH</tspan><tspan dy="5" font-size="12">2</tspan></text>
</svg>
