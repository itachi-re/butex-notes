<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" role="img" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Sodium work function numerical</title>
<desc>Wavelength scale with threshold at 6800 angstrom and an energy level sketch with the working: phi equals h c over lambda zero equals 1.83 eV.</desc>
<defs><marker id="ad" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 z" fill="#222222"/></marker><marker id="ab" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 z" fill="#1f5fbf"/></marker><marker id="ar" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 z" fill="#c0392b"/></marker><marker id="ag" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 z" fill="#2e7d32"/></marker></defs>
<rect x="0" y="0" width="800" height="460" fill="#ffffff"/>
<text x="20" y="30" text-anchor="start" font-size="18" fill="#222222" font-weight="bold"><tspan>Sodium: work function from the threshold wavelength</tspan></text>
<rect x="60" y="72" width="462.0" height="40" fill="#2e7d32" fill-opacity="0.18"/>
<rect x="522.0" y="72" width="198.0" height="40" fill="#c0392b" fill-opacity="0.18"/>
<rect x="60" y="72" width="660" height="40" rx="0" fill="none" stroke="#222222" stroke-width="2"/>
<line x1="522.0" y1="72.0" x2="522.0" y2="112.0" stroke="#222222" stroke-width="3"/>
<text x="184.5" y="98" text-anchor="start" font-size="16" fill="#2e7d32" font-weight="normal"><tspan>λ &lt; λ</tspan><tspan dy="5" font-size="14">0</tspan><tspan dy="-5">: photoelectrons emitted</tspan></text>
<text x="579.7" y="98" text-anchor="start" font-size="16" fill="#c0392b" font-weight="normal"><tspan>λ &gt; λ</tspan><tspan dy="5" font-size="14">0</tspan><tspan dy="-5">: none</tspan></text>
<text x="442.0" y="60" text-anchor="start" font-size="16" fill="#222222" font-weight="bold"><tspan>λ</tspan><tspan dy="5" font-size="14">0</tspan><tspan dy="-5"> = 6800 Å = 680 nm</tspan></text>
<line x1="60.0" y1="112.0" x2="60.0" y2="120.0" stroke="#222222" stroke-width="2"/>
<text x="60.0" y="140" text-anchor="middle" font-size="15" fill="#222222" font-weight="normal"><tspan>400</tspan></text>
<line x1="225.0" y1="112.0" x2="225.0" y2="120.0" stroke="#222222" stroke-width="2"/>
<text x="225.0" y="140" text-anchor="middle" font-size="15" fill="#222222" font-weight="normal"><tspan>500</tspan></text>
<line x1="390.0" y1="112.0" x2="390.0" y2="120.0" stroke="#222222" stroke-width="2"/>
<text x="390.0" y="140" text-anchor="middle" font-size="15" fill="#222222" font-weight="normal"><tspan>600</tspan></text>
<line x1="555.0" y1="112.0" x2="555.0" y2="120.0" stroke="#222222" stroke-width="2"/>
<text x="555.0" y="140" text-anchor="middle" font-size="15" fill="#222222" font-weight="normal"><tspan>700</tspan></text>
<line x1="720.0" y1="112.0" x2="720.0" y2="120.0" stroke="#222222" stroke-width="2"/>
<text x="720.0" y="140" text-anchor="middle" font-size="15" fill="#222222" font-weight="normal"><tspan>800</tspan></text>
<text x="720" y="162" text-anchor="end" font-size="16" fill="#222222" font-weight="normal"><tspan>Wavelength λ (nm)</tspan></text>
<line x1="40.0" y1="230.0" x2="390.0" y2="230.0" stroke="#222222" stroke-width="3" stroke-dasharray="9 5"/>
<text x="44" y="218" text-anchor="start" font-size="15" fill="#222222" font-weight="normal"><tspan>Vacuum level (electron free, K = 0)</tspan></text>
<line x1="40.0" y1="410.0" x2="390.0" y2="410.0" stroke="#222222" stroke-width="3"/>
<rect x="40" y="410" width="350" height="30" fill="#222222" fill-opacity="0.12"/>
<text x="44" y="432" text-anchor="start" font-size="15" fill="#222222" font-weight="normal"><tspan>Highest filled level of sodium</tspan></text>
<line x1="110.0" y1="406.0" x2="110.0" y2="236.0" stroke="#2e7d32" stroke-width="3" marker-end="url(#ag)"/>
<text x="124" y="330" text-anchor="start" font-size="17" fill="#2e7d32" font-weight="bold"><tspan>φ = hν</tspan><tspan dy="5" font-size="14">0</tspan></text>
<path d="M270.0,406.0 L272.3,404.6 L274.2,403.2 L275.5,401.8 L276.0,400.4 L275.5,399.0 L274.2,397.6 L272.3,396.2 L270.0,394.9 L267.7,393.5 L265.8,392.1 L264.5,390.7 L264.0,389.3 L264.5,387.9 L265.8,386.5 L267.7,385.1 L270.0,383.7 L272.3,382.3 L274.2,380.9 L275.5,379.5 L276.0,378.1 L275.5,376.8 L274.2,375.4 L272.3,374.0 L270.0,372.6 L267.7,371.2 L265.8,369.8 L264.5,368.4 L264.0,367.0 L264.5,365.6 L265.8,364.2 L267.7,362.8 L270.0,361.4 L272.3,360.0 L274.2,358.6 L275.5,357.2 L276.0,355.9 L275.5,354.5 L274.2,353.1 L272.3,351.7 L270.0,350.3 L267.7,348.9 L265.8,347.5 L264.5,346.1 L264.0,344.7 L264.5,343.3 L265.8,341.9 L267.7,340.5 L270.0,339.1 L272.3,337.8 L274.2,336.4 L275.5,335.0 L276.0,333.6 L275.5,332.2 L274.2,330.8 L272.3,329.4 L270.0,328.0 L267.7,326.6 L265.8,325.2 L264.5,323.8 L264.0,322.4 L264.5,321.0 L265.8,319.6 L267.7,318.2 L270.0,316.9 L272.3,315.5 L274.2,314.1 L275.5,312.7 L276.0,311.3 L275.5,309.9 L274.2,308.5 L272.3,307.1 L270.0,305.7 L267.7,304.3 L265.8,302.9 L264.5,301.5 L264.0,300.1 L264.5,298.8 L265.8,297.4 L267.7,296.0 L270.0,294.6 L272.3,293.2 L274.2,291.8 L275.5,290.4 L276.0,289.0 L275.5,287.6 L274.2,286.2 L272.3,284.8 L270.0,283.4 L267.7,282.0 L265.8,280.6 L264.5,279.2 L264.0,277.9 L264.5,276.5 L265.8,275.1 L267.7,273.7 L270.0,272.3 L272.3,270.9 L274.2,269.5 L275.5,268.1 L276.0,266.7 L275.5,265.3 L274.2,263.9 L272.3,262.5 L270.0,261.1 L267.7,259.8 L265.8,258.4 L264.5,257.0 L264.0,255.6 L264.5,254.2 L265.8,252.8 L267.7,251.4 L270.0,250.0" fill="none" stroke="#1f5fbf" stroke-width="2.5"/><line x1="270.0" y1="250.0" x2="270.0" y2="238.0" stroke="#1f5fbf" stroke-width="2.5" marker-end="url(#ab)"/>
<text x="284" y="300" text-anchor="start" font-size="16" fill="#1f5fbf" font-weight="normal"><tspan>photon</tspan></text>
<text x="284" y="322" text-anchor="start" font-size="16" fill="#1f5fbf" font-weight="normal"><tspan>hν</tspan><tspan dy="5" font-size="14">0</tspan><tspan dy="-5"> = hc/λ</tspan><tspan dy="5" font-size="14">0</tspan></text>
<circle cx="270" cy="230" r="7" fill="#c0392b" stroke="#c0392b" stroke-width="2"/>
<text x="284" y="258" text-anchor="start" font-size="15" fill="#c0392b" font-weight="normal"><tspan>e</tspan><tspan dy="-6" font-size="14">−</tspan><tspan dy="6"> with K = 0</tspan></text>
<text x="430" y="214" text-anchor="start" font-size="16" fill="#222222" font-weight="bold"><tspan>Given</tspan></text>
<text x="430" y="244" text-anchor="start" font-size="16" fill="#222222" font-weight="normal"><tspan>λ</tspan><tspan dy="5" font-size="14">0</tspan><tspan dy="-5"> = 6800 Å = 6.8×10</tspan><tspan dy="-6" font-size="14">−7</tspan><tspan dy="6"> m</tspan></text>
<text x="430" y="274" text-anchor="start" font-size="16" fill="#222222" font-weight="normal"><tspan>h = 6.625×10</tspan><tspan dy="-6" font-size="14">−34</tspan><tspan dy="6"> J s,  c = 3×10</tspan><tspan dy="-6" font-size="14">8</tspan><tspan dy="6"> m/s</tspan></text>
<text x="430" y="304" text-anchor="start" font-size="16" fill="#222222" font-weight="normal"><tspan>e = 1.6×10</tspan><tspan dy="-6" font-size="14">−19</tspan><tspan dy="6"> C</tspan></text>
<text x="430" y="334" text-anchor="start" font-size="16" fill="#1f5fbf" font-weight="bold"><tspan>Formula:  φ = hν</tspan><tspan dy="5" font-size="14">0</tspan><tspan dy="-5"> = hc/λ</tspan><tspan dy="5" font-size="14">0</tspan></text>
<text x="430" y="364" text-anchor="start" font-size="16" fill="#222222" font-weight="normal"><tspan>φ = (6.625×10</tspan><tspan dy="-6" font-size="14">−34</tspan><tspan dy="6"> × 3×10</tspan><tspan dy="-6" font-size="14">8</tspan><tspan dy="6">) / (6.8×10</tspan><tspan dy="-6" font-size="14">−7</tspan><tspan dy="6">)</tspan></text>
<text x="430" y="394" text-anchor="start" font-size="16" fill="#222222" font-weight="normal"><tspan>φ = 2.92×10</tspan><tspan dy="-6" font-size="14">−19</tspan><tspan dy="6"> J</tspan></text>
<text x="430" y="424" text-anchor="start" font-size="16" fill="#2e7d32" font-weight="bold"><tspan>φ = 2.92×10</tspan><tspan dy="-6" font-size="14">−19</tspan><tspan dy="6"> / 1.6×10</tspan><tspan dy="-6" font-size="14">−19</tspan><tspan dy="6"> ≈ 1.83 eV</tspan></text>
</svg>
