<text x="388.0" y="300.0" fill="#1b1b1b" font-size="16" text-anchor="middle">Induced field opposes the increase: near face of coil is N</text>
<text x="388.0" y="328.0" fill="#1b1b1b" font-size="16" text-anchor="middle">Seen from the magnet, the induced current is anticlockwise</text>
