<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" font-family="Georgia, serif" font-size="16" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="700" height="260" fill="#fff"/>
<text x="20" y="28" font-size="18" font-weight="bold">Gly-Ala dipeptide (glycylalanine)</text>

<text x="40" y="100" font-size="17">H2N—CH2—CO—NH—CH—COOH</text>
<line x1="360" y1="106" x2="360" y2="130" stroke="black"/>
<text x="350" y="146">CH3</text>

<text x="40" y="60" font-size="13" fill="#555">N-terminal residue: Glycine (R = H)</text>
<text x="330" y="60" font-size="13" fill="#555">C-terminal residue: Alanine (R = CH3)</text>

<line x1="180" y1="110" x2="255" y2="110" stroke="#c00" stroke-width="2"/>
<text x="170" y="180" font-size="14" fill="#c00">peptide bond formed between Gly's –COOH and Ala's –NH2</text>
<text x="40" y="215" font-size="14" fill="#555">Written N→C by convention: H-Gly-Ala-OH. Free α-NH2 remains at the N-terminus</text>
<text x="40" y="237" font-size="14" fill="#555">(glycine end) and free α-COOH remains at the C-terminus (alanine end).</text>
</svg>
