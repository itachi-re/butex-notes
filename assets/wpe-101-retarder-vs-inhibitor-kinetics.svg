<title id="t">Retarder versus inhibitor kinetics</title>
<desc id="d">Conversion against time curves: normal polymerisation, with an inhibitor which gives an induction period with no polymerisation and then the normal rate, and with a retarder which lowers the rate from the start.</desc>
