<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 280" font-family="Georgia, serif" font-size="15" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="780" height="280" fill="#fff"/>
<text x="20" y="28" font-size="18" font-weight="bold">Methyl orange — mono-azo dye/indicator</text>

<text x="40" y="80" font-size="16">Me2N—C6H4—N=N—C6H4—SO3Na</text>
<text x="40" y="105" font-size="13" fill="#555">(4-dimethylaminoazobenzene-4'-sulfonate, sodium salt)</text>

<text x="20" y="150" font-weight="bold">Class:</text>
<text x="90" y="150" font-size="14">Mono-azo dye, acid–base indicator class (sulfonated aminoazobenzene)</text>
<text x="20" y="182" font-size="14" fill="#555">Chromophore: the single –N=N– azo bridge, conjugated with both aromatic rings.</text>
<text x="20" y="204" font-size="14" fill="#555">Auxochromes: –N(CH3)2 (electron-donor, deepens colour) and –SO3Na (solubilising,</text>
<text x="20" y="226" font-size="14" fill="#555">ionisable). Protonation of the dimethylamino N under acid shifts the colour red (pH below</text>
<text x="20" y="248" font-size="14" fill="#555">~3.1) to yellow (above ~4.4) — the classic methyl-orange indicator transition.</text>
</svg>
