<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="DejaVu Sans, Verdana, Arial, sans-serif" role="img" aria-label="Engineering stress–strain diagram of mild steel (ductile material)"><title>Engineering stress–strain diagram of mild steel (ductile material)</title><defs><marker id="m222" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#222"/></marker></defs><rect width="940" height="560" fill="#ffffff"/><text x="470.0" y="28.0" font-size="17" text-anchor="middle" fill="#222" font-weight="bold">Engineering stress–strain diagram of mild steel (ductile material)</text><text x="470.0" y="46.0" font-size="12" text-anchor="middle" fill="#555" font-weight="normal">shaded areas: resilience (dark, elastic part) and toughness (light, total area to fracture)</text><line x1="90.0" y1="500.0" x2="90.0" y2="70.0" stroke="#222" stroke-width="2" marker-end="url(#m222)" stroke-linecap="round"/><line x1="80.0" y1="490.0" x2="880.0" y2="490.0" stroke="#222" stroke-width="2" marker-end="url(#m222)" stroke-linecap="round"/><text x="90.0" y="62.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">Stress σ = F / A₀</text><text x="880.0" y="515.0" font-size="13" text-anchor="end" fill="#222" font-weight="bold">Strain ε = ΔL / L₀</text><path d="M90,490 L200,310 C212,292 222,268 236,262 C240,285 246,292 256,292 L336,292 C430,282 560,160 640,138 C690,132 730,160 770,230 L770,490 Z" fill="#ffe0b2" fill-opacity="0.7" stroke="#ffe0b2" stroke-width="0" stroke-linejoin="round" stroke-linecap="round"/><path d="M90,490 L200,310 L200,490 Z" fill="#ef6c00" fill-opacity="0.7" stroke="#ef6c00" stroke-width="0" stroke-linejoin="round" stroke-linecap="round"/><path d="M90,490 L200,310 C212,292 222,268 236,262 C240,285 246,292 256,292 L336,292 C430,282 560,160 640,138 C690,132 730,160 770,230" fill="none" stroke="#1d3557" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M640,138 C700,112 760,92 820,82" fill="none" stroke="#6a4c93" stroke-width="2" stroke-dasharray="6 4" stroke-linejoin="round" stroke-linecap="round"/><text x="830.0" y="80.0" font-size="12" text-anchor="start" fill="#6a4c93" font-weight="normal" font-style="italic">true σ–ε</text><line x1="90.0" y1="490.0" x2="200.0" y2="310.0" stroke="#c1121f" stroke-width="1" stroke-linecap="round"/><circle cx="200.0" cy="310.0" r="4.5" fill="#d62828" stroke="#d62828" stroke-width="1.5"/><circle cx="212.0" cy="292.0" r="4.5" fill="#d62828" stroke="#d62828" stroke-width="1.5"/><circle cx="236.0" cy="262.0" r="4.5" fill="#d62828" stroke="#d62828" stroke-width="1.5"/><circle cx="256.0" cy="292.0" r="4.5" fill="#d62828" stroke="#d62828" stroke-width="1.5"/><circle cx="336.0" cy="292.0" r="4.5" fill="#d62828" stroke="#d62828" stroke-width="1.5"/><circle cx="640.0" cy="138.0" r="4.5" fill="#d62828" stroke="#d62828" stroke-width="1.5"/><circle cx="770.0" cy="230.0" r="4.5" fill="#d62828" stroke="#d62828" stroke-width="1.5"/><text x="768.0" y="250.0" font-size="18" text-anchor="middle" fill="#d62828" font-weight="normal">✕</text><text x="86.0" y="506.0" font-size="13" text-anchor="end" fill="#222" font-weight="bold">O</text><text x="192.0" y="308.0" font-size="14" text-anchor="end" fill="#d62828" font-weight="bold">A</text><text x="214.0" y="282.0" font-size="14" text-anchor="middle" fill="#d62828" font-weight="bold">B</text><text x="236.0" y="254.0" font-size="14" text-anchor="middle" fill="#d62828" font-weight="bold">C</text><text x="262.0" y="312.0" font-size="14" text-anchor="middle" fill="#d62828" font-weight="bold">D</text><text x="336.0" y="314.0" font-size="14" text-anchor="middle" fill="#d62828" font-weight="bold">E</text><text x="640.0" y="128.0" font-size="14" text-anchor="middle" fill="#d62828" font-weight="bold">F</text><text x="784.0" y="226.0" font-size="14" text-anchor="start" fill="#d62828" font-weight="bold">G</text><text x="105.0" y="140.0" font-size="12" text-anchor="start" fill="#222" font-weight="normal">OA : proportional limit</text><text x="105.0" y="156.0" font-size="12" text-anchor="start" fill="#222" font-weight="normal">(Hooke’s law, slope = E)</text><text x="105.0" y="176.0" font-size="12" text-anchor="start" fill="#222" font-weight="normal">B : elastic limit</text><text x="105.0" y="196.0" font-size="12" text-anchor="start" fill="#222" font-weight="normal">C / D : upper / lower yield point</text><text x="345.0" y="316.0" font-size="12" text-anchor="start" fill="#222" font-weight="normal">DE : yield plateau</text><text x="430.0" y="250.0" font-size="12" text-anchor="start" fill="#222" font-weight="normal" transform="rotate(-20 430.0 250.0)">EF : strain hardening</text><text x="520.0" y="100.0" font-size="12" text-anchor="start" fill="#222" font-weight="normal">F : UTS (σ_u)</text><text x="700.0" y="290.0" font-size="12" text-anchor="start" fill="#222" font-weight="normal">FG : necking</text><text x="700.0" y="308.0" font-size="12" text-anchor="start" fill="#222" font-weight="normal">G : fracture</text><text x="130.0" y="440.0" font-size="12" text-anchor="start" fill="#bf360c" font-weight="bold">resilience</text><text x="520.0" y="440.0" font-size="12" text-anchor="start" fill="#8d6e63" font-weight="bold">toughness = total area under the curve</text></svg>