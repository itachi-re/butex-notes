<svg viewBox="0 0 700 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="520" fill="#ffffff"/>
  <text x="350" y="28" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Thermodynamic Potentials — Relationships</text>

  <!-- U top -->
  <rect x="270" y="55" width="160" height="65" rx="6" fill="#eef5ff" stroke="#1a5fb4" stroke-width="2"/>
  <text x="350" y="82" font-size="15" font-weight="bold" text-anchor="middle" fill="#0d3c73">U</text>
  <text x="350" y="102" font-size="12" text-anchor="middle" fill="#0d3c73">dU = TdS − PdV</text>

  <!-- H right -->
  <rect x="480" y="205" width="160" height="65" rx="6" fill="#eafbea" stroke="#1a7a1a" stroke-width="2"/>
  <text x="560" y="232" font-size="15" font-weight="bold" text-anchor="middle" fill="#155415">H = U + PV</text>
  <text x="560" y="252" font-size="12" text-anchor="middle" fill="#155415">dH = TdS + VdP</text>

  <!-- F left -->
  <rect x="60" y="205" width="160" height="65" rx="6" fill="#fff6e0" stroke="#8a6d00" stroke-width="2"/>
  <text x="140" y="232" font-size="15" font-weight="bold" text-anchor="middle" fill="#5c4a00">F = U − TS</text>
  <text x="140" y="252" font-size="12" text-anchor="middle" fill="#5c4a00">dF = −SdT − PdV</text>

  <!-- G bottom -->
  <rect x="270" y="360" width="160" height="65" rx="6" fill="#fdeef0" stroke="#b3261e" stroke-width="2"/>
  <text x="350" y="387" font-size="15" font-weight="bold" text-anchor="middle" fill="#7a1913">G = H − TS = F + PV</text>
  <text x="350" y="407" font-size="12" text-anchor="middle" fill="#7a1913">dG = −SdT + VdP</text>

  <!-- connecting arrows with the transform variable swapped -->
  <line x1="410" y1="105" x2="500" y2="210" stroke="#333" stroke-width="1.8" marker-end="url(#axP)"/>
  <text x="450" y="150" font-size="12" fill="#333">V → P</text>
  <text x="450" y="165" font-size="10" fill="#666">(add PV)</text>

  <line x1="290" y1="105" x2="185" y2="210" stroke="#333" stroke-width="1.8" marker-end="url(#axP)"/>
  <text x="215" y="150" font-size="12" fill="#333">S → T</text>
  <text x="205" y="165" font-size="10" fill="#666">(subtract TS)</text>

  <line x1="560" y1="270" x2="395" y2="365" stroke="#333" stroke-width="1.8" marker-end="url(#axP)"/>
  <text x="475" y="330" font-size="12" fill="#333">S → T</text>

  <line x1="140" y1="270" x2="305" y2="365" stroke="#333" stroke-width="1.8" marker-end="url(#axP)"/>
  <text x="185" y="330" font-size="12" fill="#333">V → P</text>

  <text x="350" y="470" font-size="12.5" text-anchor="middle" fill="#333">Each arrow is a Legendre transform: swap one natural variable</text>
  <text x="350" y="488" font-size="12.5" text-anchor="middle" fill="#333">for its conjugate (S↔T, V↔−P) by adding/subtracting the product term.</text>

  <defs>
    <marker id="axP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#333"/></marker>
  </defs>
</svg>
