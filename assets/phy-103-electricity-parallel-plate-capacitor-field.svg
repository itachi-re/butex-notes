<title id="t">Parallel plate capacitor and its uniform field</title>
<desc id="d">Two parallel plates of area A separated by d carrying +Q on the top plate and minus Q on the bottom plate. Uniform field E points downward between the plates with slight fringing at the edges.</desc>
