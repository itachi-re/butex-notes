<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#f8f9fa"/>
  <text x="200" y="30" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Isothermal vs Adiabatic Expansion</text>
  <!-- Axes -->
  <line x1="50" y1="250" x2="350" y2="250" stroke="black" stroke-width="2"/>
  <line x1="50" y1="250" x2="50" y2="50" stroke="black" stroke-width="2"/>
  <text x="360" y="255" font-family="Arial" font-size="14">V</text>
  <text x="35" y="45" font-family="Arial" font-size="14">P</text>
  <!-- Curves -->
  <path d="M 80 80 Q 150 120 300 200" fill="transparent" stroke="#3b82f6" stroke-width="3"/>
  <path d="M 80 80 Q 120 180 200 240" fill="transparent" stroke="#ef4444" stroke-width="3"/>
  <!-- Labels -->
  <text x="310" y="200" font-family="Arial" font-size="12" fill="#3b82f6">Isothermal</text>
  <text x="210" y="240" font-family="Arial" font-size="12" fill="#ef4444">Adiabatic</text>
</svg>