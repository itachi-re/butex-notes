<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="720" height="420" fill="#ffffff"/>
  <text x="360" y="26" font-size="18" text-anchor="middle" fill="#1a1a1a" font-weight="bold">True Temperature of a Mixture by Radiation Correction</text>

  <!-- Left: calorimeter with hot water being added -->
  <rect x="40" y="80" width="150" height="140" rx="4" fill="#f5f5f5" stroke="#555" stroke-width="2"/>
  <circle cx="115" cy="150" r="45" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="115" y="240" font-size="11" text-anchor="middle" fill="#333">Calorimeter + cold water</text>
  <line x1="115" y1="105" x2="115" y2="65" stroke="#c0392b" stroke-width="3"/>
  <circle cx="115" cy="60" r="6" fill="#c0392b"/>
  <line x1="140" y1="105" x2="140" y2="195" stroke="#7a5c2e" stroke-width="2"/>

  <!-- Beaker of hot water being poured in -->
  <path d="M210 70 L210 110 Q210 130 230 130 L250 130 Q270 130 270 110 L270 70 Z" fill="#fde3cf" stroke="#e67e22" stroke-width="2"/>
  <text x="240" y="60" font-size="10" text-anchor="middle" fill="#e67e22">hot water added</text>
  <line x1="240" y1="130" x2="200" y2="150" stroke="#333" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>

  <!-- Right: temperature-time graph with three regimes and extrapolation -->
  <line x1="330" y1="360" x2="680" y2="360" stroke="#333" stroke-width="2"/>
  <line x1="330" y1="360" x2="330" y2="70" stroke="#333" stroke-width="2"/>
  <text x="505" y="390" font-size="13" text-anchor="middle" fill="#333">Time, t (min)</text>
  <text x="300" y="215" font-size="13" text-anchor="middle" fill="#333" transform="rotate(-90 300 215)">Temperature, θ (°C)</text>

  <!-- pre-mixing slow segment -->
  <path d="M345 310 L420 300" stroke="#2b6cb0" stroke-width="2.5" fill="none"/>
  <text x="360" y="292" font-size="10" fill="#2b6cb0">before mixing (r₁)</text>

  <!-- rapid rise -->
  <path d="M420 300 L460 110" stroke="#c0392b" stroke-width="2.5" fill="none"/>

  <!-- observed max -->
  <circle cx="460" cy="110" r="4" fill="#c0392b"/>
  <text x="475" y="105" font-size="10" fill="#333">θ₂ (observed)</text>

  <!-- post mixing cooling -->
  <path d="M460 110 Q 550 128 660 165" stroke="#e67e22" stroke-width="2.5" fill="none"/>
  <text x="590" y="150" font-size="10" fill="#e67e22">after mixing (r₂)</text>

  <!-- extrapolation dashed backward to t0 -->
  <path d="M660 165 L420 118" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="5,3" fill="none"/>
  <circle cx="420" cy="118" r="4" fill="#1a1a1a"/>
  <text x="330" y="90" font-size="10" fill="#1a1a1a">θ₂′ = true (corrected) temperature</text>
  <line x1="335" y1="95" x2="415" y2="116" stroke="#1a1a1a" stroke-width="1"/>

  <!-- t0 vertical -->
  <line x1="420" y1="360" x2="420" y2="300" stroke="#666" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="420" y="375" font-size="10" text-anchor="middle" fill="#666">t₀ (instant of mixing)</text>

  <text x="505" y="405" font-size="11" text-anchor="middle" fill="#555">Post-mixing line extended back to t₀ gives θ₂′, always ≥ the observed maximum θ₂</text>
</svg>
