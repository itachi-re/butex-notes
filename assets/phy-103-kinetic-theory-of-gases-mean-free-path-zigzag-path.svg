<rect x="0" y="0" width="900" height="520" fill="#FFFFFF"/>
<text x="450.0" y="36" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#263238" text-anchor="middle" font-weight="bold">Mean free path as a zigzag molecular path</text>
<rect x="85" y="100" width="730" height="330" rx="6" fill="#FFFFFF" stroke="#263238" stroke-width="2"/><text x="450" y="75" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#263238" text-anchor="middle" font-weight="normal">Molecular path between successive collisions</text><polyline points="130,365 260,185 390,335 530,155 670,315 780,175" fill="none" stroke="#1976D2" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="130" cy="365" r="8" fill="#EF6C00" stroke="#263238" stroke-width="1.5"/><circle cx="260" cy="185" r="8" fill="#EF6C00" stroke="#263238" stroke-width="1.5"/><circle cx="390" cy="335" r="8" fill="#EF6C00" stroke="#263238" stroke-width="1.5"/><circle cx="530" cy="155" r="8" fill="#EF6C00" stroke="#263238" stroke-width="1.5"/><circle cx="670" cy="315" r="8" fill="#EF6C00" stroke="#263238" stroke-width="1.5"/><circle cx="780" cy="175" r="8" fill="#EF6C00" stroke="#263238" stroke-width="1.5"/><line x1="130" y1="365" x2="780" y2="175" stroke="#263238" stroke-width="2" stroke-dasharray="8,7"/><text x="470" y="405" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#263238" text-anchor="middle" font-weight="normal">Mean free path λ: average distance between collisions</text><text x="125" y="400" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#EF6C00" text-anchor="start" font-weight="normal">start</text><text x="790" y="155" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#EF6C00" text-anchor="end" font-weight="normal">next collision</text><text x="450" y="460" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#263238" text-anchor="middle" font-weight="normal">The zigzag segments are actual travel; λ is an ensemble average, not every single segment.</text>
