<svg viewBox="0 0 520 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="520" height="320" fill="#ffffff"/>
<line x1="60" y1="270" x2="480" y2="270" stroke="#000" stroke-width="1.5"/>
<line x1="60" y1="270" x2="60" y2="30" stroke="#000" stroke-width="1.5"/>
<text x="480" y="290" font-size="14" text-anchor="end">Wavelength &#955;</text>
<text x="25" y="150" font-size="14" transform="rotate(-90 25 150)">Spectral intensity</text>
<!-- three curves for increasing T -->
<path d="M70,265 C 120,265 150,60 200,55 C 260,50 340,150 460,255" stroke="#c00000" stroke-width="2" fill="none"/>
<text x="200" y="45" font-size="12" fill="#c00000">T&#8323; (highest)</text>
<path d="M70,268 C 150,268 210,140 260,135 C 320,130 400,220 470,262" stroke="#0a7d29" stroke-width="2" fill="none"/>
<text x="260" y="120" font-size="12" fill="#0a7d29">T&#8322;</text>
<path d="M70,269 C 200,269 280,230 330,225 C 390,220 440,250 475,266" stroke="#1a5fb4" stroke-width="2" fill="none"/>
<text x="330" y="212" font-size="12" fill="#1a5fb4">T&#8321; (lowest)</text>
<!-- Wien peak shift dashed line -->
<path d="M200,55 L 260,135 L 330,225" stroke="#555" stroke-width="1" stroke-dasharray="4,3" fill="none"/>
<text x="240" y="20" font-size="16" text-anchor="middle" font-weight="bold">Blackbody Spectral Radiation Curves</text>
<text x="240" y="305" font-size="12" text-anchor="middle">Peak shifts to shorter &#955; as T increases (Wien's law); T&#8323; &gt; T&#8322; &gt; T&#8321;</text>
</svg>
