<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" width="400" height="290" font-family="Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="100%" height="100%" fill="#ffffff"/>
<polygon points="50,110 170,110 170,230 50,230" fill="#e3f2fd" fill-opacity="0.8" stroke="#333"/>
<polygon points="170,110 220,70 220,190 170,230" fill="#ffe0b2" fill-opacity="0.8" stroke="#333"/>
<polygon points="50,110 100,70 220,70 170,110" fill="#c8e6c9" fill-opacity="0.8" stroke="#333"/>
<line x1="100" y1="70" x2="100" y2="190" stroke="#333" stroke-dasharray="4,3"/>
<line x1="100" y1="190" x2="220" y2="190" stroke="#333" stroke-dasharray="4,3"/>
<line x1="50" y1="230" x2="100" y2="190" stroke="#333" stroke-dasharray="4,3"/>
<text x="68" y="170">y=0 : 0</text>
<text x="176" y="155" font-size="11">x=1 : 2</text>
<text x="100" y="95">z=1 : 1/2</text>
<text x="60" y="255">x</text><text x="30" y="170">z</text><text x="64" y="212">y</text>
<text x="240" y="100">y=1 (back) : -1</text>
<text x="240" y="125">x=0 (left) : 0</text>
<text x="240" y="150">z=0 (bottom) : 0</text>
<text x="240" y="190" font-weight="bold">Total flux = 2 - 1 + 1/2 = 3/2</text>
<text x="20" y="25">F = 4xz i - y² j + yz k  ,  0 ≤ x, y, z ≤ 1</text>
<text x="20" y="45">Numbers = flux through each face</text>
</svg>
