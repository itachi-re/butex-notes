<svg xmlns="http://www.w3.org/2000/svg" width="760" height="640" viewBox="0 0 760 640" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Flowchart to check whether a positive integer is prime" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Flowchart to check whether a positive integer is prime</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="639" fill="#ffffff" stroke="#cfd8dc" rx="8"/>
<rect x="190.0" y="12.0" width="120" height="36" rx="18.0" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/><text x="250" y="34.55" font-size="13" text-anchor="middle" font-weight="bold" fill="#1a1a1a" ><tspan x="250" dy="0">Start</tspan></text><polyline points="250,48 250,75" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><polygon points="174.0,75.0 340.0,75.0 326.0,115.0 160.0,115.0" fill="#ffe0b2" stroke="#ef6c00" stroke-width="1.5"/><text x="250" y="99.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="250" dy="0">Read n</tspan></text><polyline points="250,115 250,140" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><polygon points="250,140.0 335.0,175 250,210.0 165.0,175" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/><text x="250" y="179.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="250" dy="0">n ≤ 1 ?</tspan></text><polyline points="250,210 250,245" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><text x="268" y="234.2" font-size="12" text-anchor="start" font-weight="bold" fill="#b71c1c" ><tspan x="268" dy="0">No</tspan></text><rect x="165.0" y="245.0" width="170" height="40" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/><text x="250" y="269.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="250" dy="0">i = 2</tspan></text><polyline points="250,285 250,310" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><polygon points="250,310.0 335.0,345 250,380.0 165.0,345" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/><text x="250" y="349.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="250" dy="0">i ≤ n / 2 ?</tspan></text><polyline points="250,380 250,410" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><text x="266" y="400.2" font-size="12" text-anchor="start" font-weight="bold" fill="#b71c1c" ><tspan x="266" dy="0">Yes</tspan></text><polygon points="250,410.0 335.0,445 250,480.0 165.0,445" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/><text x="250" y="449.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="250" dy="0">n % i == 0 ?</tspan></text><polyline points="250,480 250,515" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><text x="266" y="504.2" font-size="12" text-anchor="start" font-weight="bold" fill="#b71c1c" ><tspan x="266" dy="0">No</tspan></text><rect x="165.0" y="515.0" width="170" height="40" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/><text x="250" y="539.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="250" dy="0">i = i + 1</tspan></text><polyline points="165,535 60,535 60,345 165,345" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><polyline points="335,175 445,175" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><text x="390" y="170.2" font-size="12" text-anchor="middle" font-weight="bold" fill="#b71c1c" ><tspan x="390" dy="0">Yes</tspan></text><rect x="445.0" y="153.0" width="150" height="44" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/><text x="520" y="171.425" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="520" dy="0">Print</tspan><tspan x="520" dy="16.25">NOT PRIME</tspan></text><polyline points="335,345 445,345" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><text x="390" y="340.2" font-size="12" text-anchor="middle" font-weight="bold" fill="#b71c1c" ><tspan x="390" dy="0">No</tspan></text><rect x="445.0" y="323.0" width="150" height="44" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/><text x="520" y="341.425" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="520" dy="0">Print</tspan><tspan x="520" dy="16.25">PRIME</tspan></text><polyline points="335,445 445,445" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><text x="390" y="440.2" font-size="12" text-anchor="middle" font-weight="bold" fill="#b71c1c" ><tspan x="390" dy="0">Yes</tspan></text><rect x="445.0" y="423.0" width="150" height="44" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/><text x="520" y="441.425" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="520" dy="0">Print</tspan><tspan x="520" dy="16.25">NOT PRIME</tspan></text><polyline points="595,175 700,175" fill="none" stroke="#37474f" stroke-width="1.6"/><polyline points="595,345 700,345" fill="none" stroke="#37474f" stroke-width="1.6"/><polyline points="595,445 700,445" fill="none" stroke="#37474f" stroke-width="1.6"/><polyline points="700,175 700,600" fill="none" stroke="#37474f" stroke-width="1.6"/><polyline points="700,600 310,600" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><rect x="190.0" y="582.0" width="120" height="36" rx="18.0" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/><text x="250" y="604.55" font-size="13" text-anchor="middle" font-weight="bold" fill="#1a1a1a" ><tspan x="250" dy="0">End</tspan></text>
</svg>