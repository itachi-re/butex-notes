<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 360" width="740" height="360" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Free expansion of an ideal gas</title>
<desc>Gas expands into vacuum after a partition is removed; Q=0, W=0 but entropy increases.</desc>
<defs><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="my" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#777777"/></marker></defs>
<rect x="0" y="0" width="740" height="360" fill="#ffffff"/>
<text x="370" y="28" fill="#222222" font-size="16" text-anchor="middle" font-weight="bold">Free expansion into vacuum (isolated system)</text>
<rect x="50" y="80" width="220" height="130" rx="0" fill="none" stroke="#222222" stroke-width="2"/>
<line x1="160" y1="80" x2="160" y2="210" stroke="#777777" stroke-width="4"/>
<circle cx="75" cy="105" r="7" fill="#1f5fbf" fill-opacity="0.35" stroke="#1f5fbf" stroke-width="1.5"/>
<circle cx="120" cy="120" r="7" fill="#1f5fbf" fill-opacity="0.35" stroke="#1f5fbf" stroke-width="1.5"/>
<circle cx="90" cy="150" r="7" fill="#1f5fbf" fill-opacity="0.35" stroke="#1f5fbf" stroke-width="1.5"/>
<circle cx="130" cy="175" r="7" fill="#1f5fbf" fill-opacity="0.35" stroke="#1f5fbf" stroke-width="1.5"/>
<circle cx="75" cy="190" r="7" fill="#1f5fbf" fill-opacity="0.35" stroke="#1f5fbf" stroke-width="1.5"/>
<circle cx="125" cy="100" r="7" fill="#1f5fbf" fill-opacity="0.35" stroke="#1f5fbf" stroke-width="1.5"/>
<circle cx="100" cy="200" r="7" fill="#1f5fbf" fill-opacity="0.35" stroke="#1f5fbf" stroke-width="1.5"/>
<circle cx="140" cy="145" r="7" fill="#1f5fbf" fill-opacity="0.35" stroke="#1f5fbf" stroke-width="1.5"/>
<text x="215" y="150" fill="#777777" font-size="14" text-anchor="middle" font-weight="normal">vacuum</text>
<text x="160" y="232" fill="#222222" font-size="14" text-anchor="middle" font-weight="normal">Before: volume V, temperature T</text>
<rect x="470" y="80" width="220" height="130" rx="0" fill="none" stroke="#222222" stroke-width="2"/>
<circle cx="495" cy="105" r="7" fill="#1f5fbf" fill-opacity="0.35" stroke="#1f5fbf" stroke-width="1.5"/>
<circle cx="560" cy="120" r="7" fill="#1f5fbf" fill-opacity="0.35" stroke="#1f5fbf" stroke-width="1.5"/>
<circle cx="620" cy="100" r="7" fill="#1f5fbf" fill-opacity="0.35" stroke="#1f5fbf" stroke-width="1.5"/>
<circle cx="660" cy="150" r="7" fill="#1f5fbf" fill-opacity="0.35" stroke="#1f5fbf" stroke-width="1.5"/>
<circle cx="525" cy="160" r="7" fill="#1f5fbf" fill-opacity="0.35" stroke="#1f5fbf" stroke-width="1.5"/>
<circle cx="590" cy="185" r="7" fill="#1f5fbf" fill-opacity="0.35" stroke="#1f5fbf" stroke-width="1.5"/>
<circle cx="645" cy="195" r="7" fill="#1f5fbf" fill-opacity="0.35" stroke="#1f5fbf" stroke-width="1.5"/>
<circle cx="500" cy="195" r="7" fill="#1f5fbf" fill-opacity="0.35" stroke="#1f5fbf" stroke-width="1.5"/>
<text x="580" y="232" fill="#222222" font-size="14" text-anchor="middle" font-weight="normal">After: volume 2V, same T (ideal gas)</text>
<line x1="290" y1="145" x2="450" y2="145" stroke="#c0392b" stroke-width="2.5" marker-end="url(#mr)"/>
<text x="370" y="125" fill="#c0392b" font-size="14" text-anchor="middle" font-weight="normal">partition removed</text>
<text x="370" y="285" fill="#222222" font-size="14" text-anchor="middle" font-weight="normal">Q = 0, W = 0, ΔU = 0, hence ΔT = 0 for an ideal gas</text>
<text x="370" y="312" fill="#222222" font-size="15" text-anchor="middle" font-weight="bold">ΔS = nR ln(V₂/V₁) = nR ln 2 &gt; 0   (irreversible)</text>
<text x="370" y="338" fill="#222222" font-size="14" text-anchor="middle" font-weight="normal">n = number of moles, R = 8.314 J/(mol K)</text>
</svg>
