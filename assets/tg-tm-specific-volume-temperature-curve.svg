<svg viewBox="0 0 820 500" xmlns="http://www.w3.org/2000/svg" font-family="Verdana, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>

  <rect width="820" height="500" fill="#ffffff"/>
  <text x="410" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Specific Volume vs. Temperature: T&#103; and T&#109;</text>
  <text x="410" y="50" text-anchor="middle" font-size="12" fill="#666">Amorphous vs. Semi-crystalline Polymer Behavior</text>

  <!-- Background state regions (amorphous path reference) -->
  <rect x="95" y="60" width="205" height="330" fill="#eff6ff" opacity="0.5"/>
  <rect x="300" y="60" width="120" height="330" fill="#e0f2fe" opacity="0.5"/>
  <rect x="420" y="60" width="255" height="330" fill="#fef3c7" opacity="0.35"/>

  <text x="197" y="78" text-anchor="middle" font-size="11" fill="#1e40af" font-weight="bold">Glassy solid</text>
  <text x="360" y="78" text-anchor="middle" font-size="11" fill="#0369a1" font-weight="bold">Rubbery / Leathery</text>
  <text x="547" y="78" text-anchor="middle" font-size="11" fill="#b45309" font-weight="bold">Viscous melt</text>

  <!-- Axes -->
  <line x1="80" y1="390" x2="710" y2="390" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="80" y1="390" x2="80" y2="55" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="425" text-anchor="middle" font-size="14" fill="#222">Temperature, T &#8594;</text>
  <text x="30" y="220" text-anchor="middle" font-size="14" fill="#222" transform="rotate(-90 30 220)">Specific volume, V &#8594;</text>

  <!-- Axis ticks -->
  <line x1="300" y1="390" x2="300" y2="395" stroke="#333" stroke-width="1.5"/>
  <line x1="420" y1="390" x2="420" y2="395" stroke="#333" stroke-width="1.5"/>

  <!-- Semi-crystalline curve: gentle slope, sharp 1st-order jump at Tm -->
  <path d="M 100 372 C 200 366, 320 358, 420 345" fill="none" stroke="#dc2626" stroke-width="3"/>
  <line x1="420" y1="345" x2="420" y2="245" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="3,3"/>
  <path d="M 420 245 C 500 210, 590 175, 660 150" fill="none" stroke="#dc2626" stroke-width="3"/>

  <!-- Amorphous curve: smooth 2nd-order kink at Tg -->
  <path d="M 100 355 C 200 335, 270 318, 300 310" fill="none" stroke="#2563eb" stroke-width="3"/>
  <path d="M 300 310 C 340 298, 370 285, 400 265" fill="none" stroke="#2563eb" stroke-width="3"/>
  <path d="M 400 265 C 480 220, 580 155, 660 105" fill="none" stroke="#2563eb" stroke-width="3"/>

  <!-- Tg marker -->
  <line x1="300" y1="390" x2="300" y2="310" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="4,3"/>
  <circle cx="300" cy="310" r="5" fill="#2563eb" stroke="#fff" stroke-width="1.5"/>
  <text x="300" y="408" text-anchor="middle" font-size="15" fill="#2563eb" font-weight="bold">T&#103;</text>

  <!-- Tm marker -->
  <line x1="420" y1="390" x2="420" y2="245" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,3"/>
  <circle cx="420" cy="345" r="5" fill="#dc2626" stroke="#fff" stroke-width="1.5"/>
  <circle cx="420" cy="245" r="5" fill="#dc2626" stroke="#fff" stroke-width="1.5"/>
  <text x="420" y="408" text-anchor="middle" font-size="15" fill="#dc2626" font-weight="bold">T&#109;</text>

  <!-- Legend -->
  <rect x="520" y="270" width="180" height="70" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="6"/>
  <line x1="535" y1="288" x2="565" y2="288" stroke="#2563eb" stroke-width="3"/>
  <text x="572" y="292" font-size="12" fill="#333">Amorphous polymer</text>
  <line x1="535" y1="312" x2="565" y2="312" stroke="#dc2626" stroke-width="3"/>
  <text x="572" y="316" font-size="12" fill="#333">Semi-crystalline polymer</text>

  <!-- Footnote -->
  <rect x="80" y="440" width="630" height="50" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1" rx="4"/>
  <text x="90" y="458" font-size="11.5" fill="#444">
    <tspan x="90" dy="0">&#8226; T&#103;: second-order transition &#8212; gradual slope change in V vs. T, no discontinuity, no latent heat.</tspan>
    <tspan x="90" dy="16">&#8226; T&#109;: first-order transition &#8212; abrupt volume jump, absorbs latent heat of fusion (&#916;H&#102;).</tspan>
  </text>
</svg>
