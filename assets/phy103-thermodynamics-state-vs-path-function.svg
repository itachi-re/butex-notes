<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="Helvetica,Arial,sans-serif">
  <rect width="600" height="460" fill="#ffffff"/>
  <text x="300" y="26" text-anchor="middle" font-size="18" font-weight="bold">State Function vs Path Function (P-V diagram)</text>

  <!-- Axes -->
  <line x1="80" y1="370" x2="540" y2="370" stroke="#000" stroke-width="1.5" marker-end="url(#ax)"/>
  <line x1="80" y1="370" x2="80" y2="60" stroke="#000" stroke-width="1.5" marker-end="url(#ax)"/>
  <text x="520" y="395" font-size="14">V (m³)</text>
  <text x="35" y="70" font-size="14">P (Pa)</text>

  <!-- Point A and B -->
  <circle cx="150" cy="300" r="5" fill="#000"/>
  <text x="120" y="320" font-size="13" font-weight="bold">A (P1, V1)</text>
  <circle cx="430" cy="130" r="5" fill="#000"/>
  <text x="440" y="120" font-size="13" font-weight="bold">B (P2, V2)</text>

  <!-- Path 1: direct curve -->
  <path d="M150,300 Q290,80 430,130" fill="none" stroke="#2255aa" stroke-width="2.5"/>
  <text x="220" y="150" font-size="12" fill="#2255aa">Path I</text>

  <!-- Path 2: via intermediate point -->
  <path d="M150,300 L150,150 L430,130" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="160" y="230" font-size="12" fill="#c0392b">Path II</text>

  <text x="90" y="410" font-size="12" fill="#333">ΔU = U(B) − U(A) is IDENTICAL for both paths → U is a state function.</text>
  <text x="90" y="428" font-size="12" fill="#333" transform="translate(0,-10)"> </text>
  <text x="90" y="436" font-size="12" fill="#333">W and Q differ between Path I and Path II → work and heat are path functions.</text>

  <defs>
    <marker id="ax" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
    </marker>
  </defs>
</svg>
