<g fill="#1b1b1b"><text xml:space="preserve" x="449.8" y="215.0" font-size="18" text-anchor="start">q</text><text xml:space="preserve" x="461.3" y="219.7" font-size="14" text-anchor="start">2</text></g>
<line x1="156.0" y1="170.0" x2="66.0" y2="170.0" stroke="#1f5fbf" stroke-width="3" stroke-linecap="round" marker-end="url(#ah-blue)"/>
