<line x1="173.0" y1="170.0" x2="187.0" y2="170.0" stroke="#c62828" stroke-width="2.5" stroke-linecap="round"/>
<line x1="180.0" y1="163.0" x2="180.0" y2="177.0" stroke="#c62828" stroke-width="2.5" stroke-linecap="round"/>
