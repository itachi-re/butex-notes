<line x1="190.0" y1="66.0" x2="190.0" y2="322.0" stroke="#1f5fbf" stroke-width="2" stroke-linecap="round" marker-end="url(#ah-blue)"/>
<line x1="330.0" y1="66.0" x2="330.0" y2="322.0" stroke="#1f5fbf" stroke-width="2" stroke-linecap="round" marker-end="url(#ah-blue)"/>
<line x1="370.0" y1="66.0" x2="370.0" y2="322.0" stroke="#1f5fbf" stroke-width="2" stroke-linecap="round" marker-end="url(#ah-blue)"/>
