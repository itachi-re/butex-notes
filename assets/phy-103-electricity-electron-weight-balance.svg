<text x="100.0" y="366.0" fill="#1f5fbf" font-size="20" text-anchor="middle">−</text>
<text x="180.0" y="42.0" fill="#c62828" font-size="20" text-anchor="middle">+</text>
<text x="180.0" y="366.0" fill="#1f5fbf" font-size="20" text-anchor="middle">−</text>
<text x="260.0" y="42.0" fill="#c62828" font-size="20" text-anchor="middle">+</text>
<text x="260.0" y="366.0" fill="#1f5fbf" font-size="20" text-anchor="middle">−</text>
<text x="340.0" y="42.0" fill="#c62828" font-size="20" text-anchor="middle">+</text>
<text x="340.0" y="366.0" fill="#1f5fbf" font-size="20" text-anchor="middle">−</text>
