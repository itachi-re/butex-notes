<text x="290.0" y="172.0" fill="#1b1b1b" font-size="16" text-anchor="start">electron</text>
<line x1="260.0" y1="177.0" x2="260.0" y2="100.0" stroke="#2e7d32" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ah-green)"/>
<text x="276.0" y="130.0" fill="#2e7d32" font-size="17" text-anchor="start">F = eE</text>
<line x1="260.0" y1="213.0" x2="260.0" y2="290.0" stroke="#c62828" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ah-red)"/>
<text x="276.0" y="270.0" fill="#c62828" font-size="17" text-anchor="start">W = mg</text>
<text x="260.0" y="400.0" fill="#1b1b1b" font-size="16" text-anchor="middle">eE = mg  →  E = mg/e (field points downward)</text>
</svg>
