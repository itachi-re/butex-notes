<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="DejaVu Sans, Verdana, Arial, sans-serif" role="img" aria-label="Stages of quenching a hot steel part in a liquid"><title>Stages of quenching a hot steel part in a liquid</title><defs><marker id="m222" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#222"/></marker></defs><rect width="960" height="480" fill="#ffffff"/><text x="480.0" y="28.0" font-size="17" text-anchor="middle" fill="#222" font-weight="bold">Stages of quenching a hot steel part in a liquid</text><text x="480.0" y="46.0" font-size="12" text-anchor="middle" fill="#555" font-weight="normal">cooling curve (left) and cooling-rate curve (right)</text><line x1="80.0" y1="400.0" x2="80.0" y2="70.0" stroke="#222" stroke-width="2" marker-end="url(#m222)" stroke-linecap="round"/><line x1="70.0" y1="390.0" x2="440.0" y2="390.0" stroke="#222" stroke-width="2" marker-end="url(#m222)" stroke-linecap="round"/><text x="80.0" y="60.0" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">Temperature</text><text x="440.0" y="413.0" font-size="12" text-anchor="end" fill="#222" font-weight="bold">Time</text><line x1="80.0" y1="130.0" x2="440.0" y2="130.0" stroke="#d62828" stroke-width="1" stroke-dasharray="5 4" stroke-linecap="round"/><text x="445.0" y="134.0" font-size="11" text-anchor="start" fill="#222" font-weight="normal">850 °C</text><line x1="80.0" y1="290.0" x2="440.0" y2="290.0" stroke="#6a4c93" stroke-width="1" stroke-dasharray="5 4" stroke-linecap="round"/><text x="445.0" y="294.0" font-size="11" text-anchor="start" fill="#6a4c93" font-weight="normal">Mₛ</text><line x1="170.0" y1="390.0" x2="170.0" y2="90.0" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4" stroke-linecap="round"/><line x1="250.0" y1="390.0" x2="250.0" y2="90.0" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4" stroke-linecap="round"/><path d="M80,130 C110,133 140,150 170,175 C200,215 230,285 250,310 C300,345 360,362 430,375" fill="none" stroke="#1d3557" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><text x="125.0" y="95.0" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">A</text><text x="210.0" y="95.0" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">B</text><text x="345.0" y="95.0" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">C</text><text x="125.0" y="112.0" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">vapour</text><text x="210.0" y="112.0" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">boiling</text><text x="345.0" y="112.0" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">liquid cooling</text><line x1="540.0" y1="400.0" x2="540.0" y2="70.0" stroke="#222" stroke-width="2" marker-end="url(#m222)" stroke-linecap="round"/><line x1="530.0" y1="390.0" x2="900.0" y2="390.0" stroke="#222" stroke-width="2" marker-end="url(#m222)" stroke-linecap="round"/><text x="540.0" y="60.0" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">Cooling rate</text><text x="900.0" y="413.0" font-size="12" text-anchor="end" fill="#222" font-weight="bold">Temperature of the part (falling →)</text><path d="M880,385 C860,382 800,360 760,310 C730,250 700,150 670,125 C640,150 620,250 580,330 C560,360 550,375 545,385" fill="none" stroke="#c1121f" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><text x="670.0" y="113.0" font-size="12" text-anchor="middle" fill="#c1121f" font-weight="bold">max. rate in stage B</text><text x="800.0" y="340.0" font-size="11" text-anchor="start" fill="#222" font-weight="normal">A: slow</text><text x="590.0" y="355.0" font-size="11" text-anchor="start" fill="#222" font-weight="normal">C: slow</text><text x="60.0" y="428.0" font-size="11" text-anchor="start" fill="#222" font-weight="normal">A: vapour-blanket stage — insulating vapour film, slow cooling.</text><text x="60.0" y="443.0" font-size="11" text-anchor="start" fill="#222" font-weight="normal">B: vapour-transport (nucleate boiling) — film breaks, very fast cooling.</text><text x="60.0" y="458.0" font-size="11" text-anchor="start" fill="#222" font-weight="normal">C: liquid-cooling stage — conduction/convection, slow again.</text></svg>