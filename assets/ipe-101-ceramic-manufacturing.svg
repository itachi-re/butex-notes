<svg xmlns="http://www.w3.org/2000/svg" width="940" height="520" viewBox="0 0 940 520" role="img" aria-label="Manufacture of ceramic ware: process flow and firing schedule" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="ah1f2937" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.5" y="0.5" width="939" height="519" rx="10" fill="#ffffff" stroke="#d1d5db"/><text x="470.0" y="24.0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">Manufacture of ceramic ware: process flow and firing schedule</text><rect x="20.0" y="60.0" width="118.0" height="70.0" rx="6" fill="#fde68a" stroke="#1f2937" stroke-width="1.5"/><text x="79.0" y="85.5" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f2937" text-anchor="middle" font-weight="normal">1 Raw materials</text><text x="79.0" y="98.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f2937" text-anchor="middle" font-weight="normal">clay, feldspar,</text><text x="79.0" y="111.8" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f2937" text-anchor="middle" font-weight="normal">quartz</text><line x1="138.0" y1="95.0" x2="150.0" y2="95.0" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah1f2937)"/><rect x="150.0" y="60.0" width="118.0" height="70.0" rx="6" fill="#e5e7eb" stroke="#1f2937" stroke-width="1.5"/><text x="209.0" y="92.1" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f2937" text-anchor="middle" font-weight="normal">2 Crush, grind,</text><text x="209.0" y="105.2" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f2937" text-anchor="middle" font-weight="normal">mix with water</text><line x1="268.0" y1="95.0" x2="280.0" y2="95.0" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah1f2937)"/><rect x="280.0" y="60.0" width="118.0" height="70.0" rx="6" fill="#bfdbfe" stroke="#1f2937" stroke-width="1.5"/><text x="339.0" y="85.5" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f2937" text-anchor="middle" font-weight="normal">3 Forming</text><text x="339.0" y="98.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f2937" text-anchor="middle" font-weight="normal">slip casting, pressing,</text><text x="339.0" y="111.8" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f2937" text-anchor="middle" font-weight="normal">extrusion, jiggering</text><line x1="398.0" y1="95.0" x2="410.0" y2="95.0" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah1f2937)"/><rect x="410.0" y="60.0" width="118.0" height="70.0" rx="6" fill="#fed7aa" stroke="#1f2937" stroke-width="1.5"/><text x="469.0" y="85.5" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f2937" text-anchor="middle" font-weight="normal">4 DRYING</text><text x="469.0" y="98.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f2937" text-anchor="middle" font-weight="normal">50-150 °C, slow,</text><text x="469.0" y="111.8" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f2937" text-anchor="middle" font-weight="normal">controlled humidity</text><line x1="528.0" y1="95.0" x2="540.0" y2="95.0" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah1f2937)"/><rect x="540.0" y="60.0" width="118.0" height="70.0" rx="6" fill="#ddd6fe" stroke="#1f2937" stroke-width="1.5"/><text x="599.0" y="92.1" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f2937" text-anchor="middle" font-weight="normal">5 Glazing</text><text x="599.0" y="105.2" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f2937" text-anchor="middle" font-weight="normal">(optional)</text><line x1="658.0" y1="95.0" x2="670.0" y2="95.0" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah1f2937)"/><rect x="670.0" y="60.0" width="118.0" height="70.0" rx="6" fill="#fecaca" stroke="#1f2937" stroke-width="1.5"/><text x="729.0" y="85.5" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f2937" text-anchor="middle" font-weight="normal">6 FIRING</text><text x="729.0" y="98.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f2937" text-anchor="middle" font-weight="normal">1000-1400 °C</text><text x="729.0" y="111.8" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f2937" text-anchor="middle" font-weight="normal">sintering/vitrification</text><line x1="788.0" y1="95.0" x2="800.0" y2="95.0" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah1f2937)"/><rect x="800.0" y="60.0" width="118.0" height="70.0" rx="6" fill="#bbf7d0" stroke="#1f2937" stroke-width="1.5"/><text x="859.0" y="92.1" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f2937" text-anchor="middle" font-weight="normal">7 Slow cooling</text><text x="859.0" y="105.2" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f2937" text-anchor="middle" font-weight="normal">&amp; inspection</text><line x1="90.0" y1="450.0" x2="890.0" y2="450.0" stroke="#1f2937" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2937)"/><line x1="90.0" y1="450.0" x2="90.0" y2="170.0" stroke="#1f2937" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2937)"/><text x="490.0" y="488.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Time</text><text x="42.0" y="310.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold" transform="rotate(-90 42.0 310.0)">Temperature (°C)</text><polyline points="90.0,445.0 180.0,425.0 220.0,410.0 310.0,360.0 390.0,345.0 490.0,270.0 560.0,215.0 650.0,215.0 710.0,300.0 790.0,370.0 860.0,435.0" fill="none" stroke="#dc2626" stroke-width="3.2" stroke-linejoin="round"/><circle cx="150.0" cy="435.0" r="9.0" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/><text x="150.0" y="439.0" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="bold">a</text><circle cx="310.0" cy="360.0" r="9.0" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/><text x="310.0" y="364.0" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="bold">b</text><circle cx="390.0" cy="345.0" r="9.0" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/><text x="390.0" y="349.0" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="bold">c</text><circle cx="490.0" cy="270.0" r="9.0" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/><text x="490.0" y="274.0" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="bold">d</text><circle cx="605.0" cy="215.0" r="9.0" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/><text x="605.0" y="219.0" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="bold">e</text><circle cx="740.0" cy="333.0" r="9.0" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/><text x="740.0" y="337.0" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="bold">f</text><text x="420.0" y="366.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#374151" text-anchor="start" font-weight="normal">a  100-200 °C: free (mechanical) water leaves</text><text x="420.0" y="381.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#374151" text-anchor="start" font-weight="normal">b  450-600 °C: chemically combined water leaves clay (dehydroxylation)</text><text x="420.0" y="396.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#374151" text-anchor="start" font-weight="normal">c  573 °C: quartz α→β inversion (volume jump: heat slowly)</text><text x="420.0" y="411.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#374151" text-anchor="start" font-weight="normal">d  800-1000 °C: carbon / organics burn out; carbonates decompose</text><text x="420.0" y="426.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#374151" text-anchor="start" font-weight="normal">e  1000-1400 °C: sintering, vitrification, glaze melts</text><text x="420.0" y="441.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#374151" text-anchor="start" font-weight="normal">f  cool slowly through 573 °C to avoid dunting</text><text x="100.0" y="175.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="italic">Typical schedule (values depend on body and kiln)</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>