<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" width="680" height="480" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Evidence for the cyclic (hemiacetal) structure of D-glucose</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker><marker id="arrowAccent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a13a2e"/></marker><marker id="arrowAccent2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5a8a"/></marker><marker id="halfArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,2 L10,5 L0,8 z" fill="#1a1a1a"/></marker></defs>
<rect x="0" y="0" width="680" height="480" fill="white"/>
<text x="340.0" y="26.0" font-family="DejaVu Sans" font-size="19" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">Evidence for the Cyclic Structure of D-Glucose</text>
<text x="340.0" y="58.0" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" font-style="normal" fill="#666666" text-anchor="middle">open-chain (–CHO at C1)  ⇌  cyclic hemiacetal (–OH + ring O at C1)</text>
<text x="40.0" y="92.0" font-family="DejaVu Sans" font-size="13" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">•</text>
<text x="56.0" y="92.0" font-family="DejaVu Sans" font-size="13" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">Mutarotation: freshly prepared α- and β-glucose have different [α]D (+112° /</text>
<text x="40.0" y="112.0" font-family="DejaVu Sans" font-size="13" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start"></text>
<text x="56.0" y="112.0" font-family="DejaVu Sans" font-size="13" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">+18.7°) that both drift to the SAME equilibrium value (+52.7°) — only explicable</text>
<text x="40.0" y="132.0" font-family="DejaVu Sans" font-size="13" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start"></text>
<text x="56.0" y="132.0" font-family="DejaVu Sans" font-size="13" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">by an equilibrium between two ring forms through a common open-chain form, with C1</text>
<text x="40.0" y="152.0" font-family="DejaVu Sans" font-size="13" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start"></text>
<text x="56.0" y="152.0" font-family="DejaVu Sans" font-size="13" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">becoming a new stereocentre.</text>
<text x="40.0" y="184.0" font-family="DejaVu Sans" font-size="13" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">•</text>
<text x="56.0" y="184.0" font-family="DejaVu Sans" font-size="13" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">Pentaacetate, not tetraacetate: glucose + excess Ac₂O gives a PENTA-acetate — i.e.</text>
<text x="40.0" y="204.0" font-family="DejaVu Sans" font-size="13" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start"></text>
<text x="56.0" y="204.0" font-family="DejaVu Sans" font-size="13" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">FIVE –OH groups, not the four (C2, C3, C4, C6) an open-chain structure would have.</text>
<text x="40.0" y="224.0" font-family="DejaVu Sans" font-size="13" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start"></text>
<text x="56.0" y="224.0" font-family="DejaVu Sans" font-size="13" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">The 5th –OH is on C1 — only possible if C1 is a hemiacetal –OH, not a free –CHO.</text>
<text x="40.0" y="256.0" font-family="DejaVu Sans" font-size="13" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">•</text>
<text x="56.0" y="256.0" font-family="DejaVu Sans" font-size="13" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">Stable, non-reducing methyl glycoside: glucose + CH₃OH/HCl (Fischer glycosidation)</text>
<text x="40.0" y="276.0" font-family="DejaVu Sans" font-size="13" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start"></text>
<text x="56.0" y="276.0" font-family="DejaVu Sans" font-size="13" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">gives methyl-D-glucoside, which does NOT reduce Tollens'/Fehling's and does NOT</text>
<text x="40.0" y="296.0" font-family="DejaVu Sans" font-size="13" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start"></text>
<text x="56.0" y="296.0" font-family="DejaVu Sans" font-size="13" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">show mutarotation — C1 has become a full acetal, fixed in one configuration.</text>
<text x="40.0" y="328.0" font-family="DejaVu Sans" font-size="13" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">•</text>
<text x="56.0" y="328.0" font-family="DejaVu Sans" font-size="13" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">Weak/negative Schiff's test: despite the apparent free –CHO in the open-chain</text>
<text x="40.0" y="348.0" font-family="DejaVu Sans" font-size="13" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start"></text>
<text x="56.0" y="348.0" font-family="DejaVu Sans" font-size="13" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">form, glucose reacts only sluggishly with Schiff's reagent — consistent with the</text>
<text x="40.0" y="368.0" font-family="DejaVu Sans" font-size="13" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start"></text>
<text x="56.0" y="368.0" font-family="DejaVu Sans" font-size="13" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">aldehyde being normally 'tied up' as a cyclic hemiacetal, present only in trace</text>
<text x="40.0" y="388.0" font-family="DejaVu Sans" font-size="13" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start"></text>
<text x="56.0" y="388.0" font-family="DejaVu Sans" font-size="13" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">amount at equilibrium.</text>
<text x="340.0" y="464.0" font-family="DejaVu Sans" font-size="11.5" font-weight="normal" font-style="italic" fill="#666666" text-anchor="middle">Together, these rule out a simple open-chain pentahydroxy-aldehyde structure for D-glucose.</text>
</svg>
