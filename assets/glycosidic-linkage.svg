<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300">
<title>Formation of a glycosidic linkage</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker><marker id="arrowAccent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a13a2e"/></marker><marker id="arrowAccent2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5a8a"/></marker><marker id="halfArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,2 L10,5 L0,8 z" fill="#1a1a1a"/></marker></defs>
<rect x="0" y="0" width="700" height="300" fill="white"/>
<text x="350.0" y="24.0" font-family="DejaVu Sans" font-size="19" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">Formation of a Glycosidic Linkage</text>
<line x1="227.6" y1="115.2" x2="250.0" y2="147.4" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
<line x1="250.0" y1="147.4" x2="218.0" y2="174.8" stroke="#1a1a1a" stroke-width="3.4" stroke-linecap="round"/>
<line x1="218.0" y1="174.8" x2="155.6" y2="174.8" stroke="#1a1a1a" stroke-width="3.4" stroke-linecap="round"/>
<line x1="155.6" y1="174.8" x2="120.4" y2="147.4" stroke="#1a1a1a" stroke-width="3.4" stroke-linecap="round"/>
<line x1="120.4" y1="147.4" x2="150.8" y2="117.2" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
<line x1="150.8" y1="117.2" x2="227.6" y2="115.2" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
<text x="248.6" y="100.2" font-family="DejaVu Sans" font-size="17" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">O</text>
<line x1="250.0" y1="147.4" x2="250.0" y2="169.4" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
<text x="250.0" y="186.4" font-family="DejaVu Sans" font-size="15" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">OH</text>
<text x="170.0" y="218.0" font-family="DejaVu Sans" font-size="11.5" font-weight="normal" font-style="normal" fill="#666666" text-anchor="middle">hemiacetal (anomeric) –OH</text>
<text x="330.0" y="125.0" font-family="DejaVu Sans" font-size="15" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">+  H–O–R</text>
<line x1="400.0" y1="145.0" x2="500.0" y2="145.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="450.0" y="137.0" font-family="DejaVu Sans" font-size="13" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">H⁺, –H₂O</text>
<line x1="647.6" y1="115.2" x2="670.0" y2="147.4" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
<line x1="670.0" y1="147.4" x2="638.0" y2="174.8" stroke="#1a1a1a" stroke-width="3.4" stroke-linecap="round"/>
<line x1="638.0" y1="174.8" x2="575.6" y2="174.8" stroke="#1a1a1a" stroke-width="3.4" stroke-linecap="round"/>
<line x1="575.6" y1="174.8" x2="540.4" y2="147.4" stroke="#1a1a1a" stroke-width="3.4" stroke-linecap="round"/>
<line x1="540.4" y1="147.4" x2="570.8" y2="117.2" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
<line x1="570.8" y1="117.2" x2="647.6" y2="115.2" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
<text x="668.6" y="100.2" font-family="DejaVu Sans" font-size="17" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">O</text>
<line x1="670.0" y1="147.4" x2="670.0" y2="169.4" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
<text x="670.0" y="186.4" font-family="DejaVu Sans" font-size="15" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">OR</text>
<text x="590.0" y="218.0" font-family="DejaVu Sans" font-size="11.5" font-weight="normal" font-style="normal" fill="#666666" text-anchor="middle">glycoside (a full acetal)</text>
<text x="350.0" y="254.5" font-family="DejaVu Sans" font-size="11.5" font-weight="normal" font-style="italic" fill="#666666" text-anchor="middle">The anomeric –OH condenses with an –OH of the second molecule (sugar, alcohol, or aglycone), losing H₂O.</text>
<text x="350.0" y="270.0" font-family="DejaVu Sans" font-size="11.5" font-weight="normal" font-style="italic" fill="#666666" text-anchor="middle">The product is a stable acetal, no longer in equilibrium with the open-chain form.</text>
</svg>
