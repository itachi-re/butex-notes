<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" width="620" height="430" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Voltage against current for an ohmic and a non-ohmic conductor</title>
<desc id="d">A straight V-I line through the origin for an ohmic conductor with slope R, and a curved line for a filament.</desc>
<defs>
<marker id="ah-ink" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto"><polygon points="0 0,7 3,0 6" fill="#1b1b1b"/></marker>
<marker id="as-ink" markerWidth="7" markerHeight="6" refX="0.5" refY="3" orient="auto"><polygon points="7 0,0 3,7 6" fill="#1b1b1b"/></marker>
<marker id="ah-blue" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto"><polygon points="0 0,7 3,0 6" fill="#1f5fbf"/></marker>
<marker id="as-blue" markerWidth="7" markerHeight="6" refX="0.5" refY="3" orient="auto"><polygon points="7 0,0 3,7 6" fill="#1f5fbf"/></marker>
<marker id="ah-red" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto"><polygon points="0 0,7 3,0 6" fill="#c62828"/></marker>
<marker id="as-red" markerWidth="7" markerHeight="6" refX="0.5" refY="3" orient="auto"><polygon points="7 0,0 3,7 6" fill="#c62828"/></marker>
<marker id="ah-green" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto"><polygon points="0 0,7 3,0 6" fill="#2e7d32"/></marker>
<marker id="as-green" markerWidth="7" markerHeight="6" refX="0.5" refY="3" orient="auto"><polygon points="7 0,0 3,7 6" fill="#2e7d32"/></marker>
<marker id="ah-grey" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto"><polygon points="0 0,7 3,0 6" fill="#8a8a8a"/></marker>
<marker id="as-grey" markerWidth="7" markerHeight="6" refX="0.5" refY="3" orient="auto"><polygon points="7 0,0 3,7 6" fill="#8a8a8a"/></marker>
</defs>
<rect x="0" y="0" width="620" height="430" fill="#ffffff"/>
<line x1="100.0" y1="360.0" x2="580.0" y2="360.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round" marker-end="url(#ah-ink)"/>
<line x1="100.0" y1="360.0" x2="100.0" y2="50.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round" marker-end="url(#ah-ink)"/>
<text x="584.0" y="386.0" fill="#1b1b1b" font-size="18" text-anchor="middle">I</text>
<text x="82.0" y="56.0" fill="#1b1b1b" font-size="18" text-anchor="middle">V</text>
<line x1="100.0" y1="360.0" x2="520.0" y2="120.0" stroke="#1f5fbf" stroke-width="3" stroke-linecap="round"/>
<path d="M100,360 C260,340 400,270 500,70" fill="none" stroke="#c62828" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 6"/>
<polyline points="220.0,291.4 380.0,291.4 380.0,200.0" fill="none" stroke="#2e7d32" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="300.0" y="315.4" fill="#2e7d32" font-size="18" text-anchor="middle">ΔI</text>
<text x="390.0" y="251.7" fill="#2e7d32" font-size="18" text-anchor="start">ΔV</text>
<text x="150.0" y="120.0" fill="#2e7d32" font-size="17" text-anchor="start">slope = ΔV/ΔI = R</text>
<line x1="150.0" y1="60.0" x2="190.0" y2="60.0" stroke="#1f5fbf" stroke-width="3" stroke-linecap="round"/>
<text x="200.0" y="66.0" fill="#1b1b1b" font-size="16" text-anchor="start">ohmic conductor: V = IR</text>
<line x1="150.0" y1="90.0" x2="190.0" y2="90.0" stroke="#c62828" stroke-width="3" stroke-linecap="round" stroke-dasharray="9 6"/>
<text x="200.0" y="96.0" fill="#1b1b1b" font-size="16" text-anchor="start">non-ohmic: lamp filament</text>
<text x="340.0" y="410.0" fill="#1b1b1b" font-size="15" text-anchor="middle">At constant temperature V is proportional to I for an ohmic conductor</text>
</svg>
