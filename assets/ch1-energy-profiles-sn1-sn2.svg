<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="920" height="360" role="img" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Energy profiles for SN1/E1 and SN2/E2</title><desc>SN1 has two transition states and a carbocation intermediate; SN2 has a single transition state.</desc><defs><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c0392b"/></marker><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#24292f"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0969da"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1a7f37"/></marker><marker id="mgy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#57606a"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#bc4c00"/></marker></defs><rect width="920" height="360" fill="#ffffff"/><line x1="50.0" y1="310.0" x2="50.0" y2="62.0" stroke="#24292f" stroke-width="2.2" stroke-linecap="round" marker-end="url(#mk)"/><line x1="50.0" y1="310.0" x2="445.0" y2="310.0" stroke="#24292f" stroke-width="2.2" stroke-linecap="round" marker-end="url(#mk)"/><text transform="rotate(-90 38 190)" x="38.0" y="190.0" font-size="14" text-anchor="middle" fill="#57606a" font-weight="normal" xml:space="preserve"><tspan>Potential energy</tspan></text><text x="250.0" y="338.0" font-size="14" text-anchor="middle" fill="#57606a" font-weight="normal" xml:space="preserve"><tspan>Reaction coordinate</tspan></text><path d="M70,250 C120,250 125,105 175,105 C225,105 215,195 255,195 C295,195 290,150 335,150 C380,150 375,265 425,265" fill="none" stroke="#0969da" stroke-width="3.4"/><text x="245.0" y="34.0" font-size="16" text-anchor="middle" fill="#24292f" font-weight="bold" xml:space="preserve"><tspan>SN1 / E1: two steps, one intermediate</tspan></text><text x="70.0" y="278.0" font-size="14" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>R–X + Nu⁻</tspan></text><text x="175.0" y="90.0" font-size="15" text-anchor="middle" fill="#c0392b" font-weight="bold" xml:space="preserve"><tspan font-size="15.0">TS</tspan><tspan dy="4.5" font-size="10.5">1</tspan><tspan dy="-11.2" font-size="10.5">‡</tspan></text><text x="255.0" y="224.0" font-size="14" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="14.0">R</tspan><tspan dy="-6.3" font-size="9.8">+</tspan><tspan dy="6.3" font-size="14.0"> + X</tspan><tspan dy="-6.3" font-size="9.8">−</tspan></text><text x="255.0" y="242.0" font-size="13" text-anchor="middle" fill="#57606a" font-weight="normal" xml:space="preserve"><tspan>(intermediate)</tspan></text><text x="335.0" y="134.0" font-size="15" text-anchor="middle" fill="#c0392b" font-weight="bold" xml:space="preserve"><tspan font-size="15.0">TS</tspan><tspan dy="4.5" font-size="10.5">2</tspan><tspan dy="-11.2" font-size="10.5">‡</tspan></text><text x="425.0" y="292.0" font-size="14" text-anchor="end" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>R–Nu + X⁻</tspan></text><line x1="112.0" y1="250.0" x2="112.0" y2="112.0" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round" marker-end="url(#mr)"/><text x="104.0" y="184.0" font-size="13" text-anchor="end" fill="#c0392b" font-weight="normal" xml:space="preserve"><tspan font-size="13.0">E</tspan><tspan dy="3.9" font-size="9.1">a</tspan></text><text x="205.0" y="70.0" font-size="13" text-anchor="start" fill="#57606a" font-weight="normal" xml:space="preserve"><tspan>highest barrier = slow (rate-determining) step</tspan></text><line x1="510.0" y1="310.0" x2="510.0" y2="62.0" stroke="#24292f" stroke-width="2.2" stroke-linecap="round" marker-end="url(#mk)"/><line x1="510.0" y1="310.0" x2="905.0" y2="310.0" stroke="#24292f" stroke-width="2.2" stroke-linecap="round" marker-end="url(#mk)"/><text transform="rotate(-90 498 190)" x="498.0" y="190.0" font-size="14" text-anchor="middle" fill="#57606a" font-weight="normal" xml:space="preserve"><tspan>Potential energy</tspan></text><text x="710.0" y="338.0" font-size="14" text-anchor="middle" fill="#57606a" font-weight="normal" xml:space="preserve"><tspan>Reaction coordinate</tspan></text><path d="M530,250 C590,250 595,100 655,100 C715,100 720,275 790,275" fill="none" stroke="#c0392b" stroke-width="3.4"/><text x="700.0" y="34.0" font-size="16" text-anchor="middle" fill="#24292f" font-weight="bold" xml:space="preserve"><tspan>SN2 / E2: one step, one transition state</tspan></text><text x="530.0" y="278.0" font-size="14" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>R–X + Nu⁻</tspan></text><text x="655.0" y="84.0" font-size="15" text-anchor="middle" fill="#c0392b" font-weight="bold" xml:space="preserve"><tspan font-size="15.0">[Nu···R···X]</tspan><tspan dy="-6.8" font-size="10.5">‡</tspan></text><text x="800.0" y="296.0" font-size="14" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>R–Nu + X⁻</tspan></text><line x1="585.0" y1="250.0" x2="585.0" y2="106.0" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round" marker-end="url(#mr)"/><text x="577.0" y="184.0" font-size="13" text-anchor="end" fill="#c0392b" font-weight="normal" xml:space="preserve"><tspan font-size="13.0">E</tspan><tspan dy="3.9" font-size="9.1">a</tspan></text><text x="655.0" y="62.0" font-size="13" text-anchor="middle" fill="#57606a" font-weight="normal" xml:space="preserve"><tspan>no intermediate</tspan></text></sv