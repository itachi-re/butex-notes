<svg xmlns="http://www.w3.org/2000/svg" width="760" height="405" viewBox="0 0 760 405" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Region of integration in the convolution theorem</title>
<desc id="d">Two panels showing the triangle 0 ≤ u ≤ t in the u-t plane, integrated first over t from u to infinity, then over u from 0 to t after swapping the order.</desc>
<rect width="760" height="405" fill="#ffffff"/>
<g font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2328">
<polygon points="60,320 60,80 300,80" fill="#0969da" fill-opacity="0.12" stroke="none"/>
<line x1="50.0" y1="320.0" x2="313.0" y2="320.0" stroke="#6e7781" stroke-width="1.5" stroke-linecap="round"/><polygon points="322.0,320.0 313.0,316.2 313.0,323.8" fill="#6e7781"/>
<line x1="60.0" y1="330.0" x2="60.0" y2="71.0" stroke="#6e7781" stroke-width="1.5" stroke-linecap="round"/><polygon points="60.0,62.0 56.2,71.0 63.8,71.0" fill="#6e7781"/>
<text x="330.0" y="325.0" text-anchor="start" font-size="15" font-style="italic" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">u</text><text x="330.0" y="325.0" text-anchor="start" font-size="15" font-style="italic" fill="#1f2328">u</text>
<text x="46.0" y="76.0" text-anchor="middle" font-size="15" font-style="italic" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">t</text><text x="46.0" y="76.0" text-anchor="middle" font-size="15" font-style="italic" fill="#1f2328">t</text>
<line x1="60.0" y1="320.0" x2="300.0" y2="80.0" stroke="#cf222e" stroke-width="2.5" stroke-dasharray="8 5" stroke-linecap="round"/>
<text x="292.0" y="112.0" text-anchor="start" font-size="14" font-weight="bold" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">t = u</text><text x="292.0" y="112.0" text-anchor="start" font-size="14" font-weight="bold" fill="#cf222e">t = u</text>
<text x="66.0" y="102.0" text-anchor="start" font-size="14" font-weight="bold" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">region: 0 ≤ u ≤ t</text><text x="66.0" y="102.0" text-anchor="start" font-size="14" font-weight="bold" fill="#0969da">region: 0 ≤ u ≤ t</text>
<line x1="210.0" y1="322.0" x2="210.0" y2="330.0" stroke="#6e7781" stroke-width="1.5" stroke-linecap="round"/>
<line x1="210.0" y1="170.0" x2="210.0" y2="102.0" stroke="#1a7f37" stroke-width="3.5" stroke-linecap="round"/><polygon points="210.0,90.0 205.0,102.0 215.0,102.0" fill="#1a7f37"/>
<circle cx="210.0" cy="170.0" r="4.5" fill="#1a7f37"/>
<text x="210.0" y="348.0" text-anchor="middle" font-size="13" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">fixed u</text><text x="210.0" y="348.0" text-anchor="middle" font-size="13" fill="#6e7781">fixed u</text>
<text x="220.0" y="190.0" text-anchor="start" font-size="14" font-weight="bold" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">t: u to inf</text><text x="220.0" y="190.0" text-anchor="start" font-size="14" font-weight="bold" fill="#1a7f37">t: u to inf</text>
<text x="50.0" y="20.0" text-anchor="start" font-size="15" font-weight="bold" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">Original order</text><text x="50.0" y="20.0" text-anchor="start" font-size="15" font-weight="bold" fill="#1f2328">Original order</text>
<text x="50.0" y="40.0" text-anchor="start" font-size="14" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">outer u: 0 to inf, inner t: u to inf</text><text x="50.0" y="40.0" text-anchor="start" font-size="14" fill="#6e7781">outer u: 0 to inf, inner t: u to inf</text>
<polygon points="440,320 440,80 680,80" fill="#0969da" fill-opacity="0.12" stroke="none"/>
<line x1="430.0" y1="320.0" x2="693.0" y2="320.0" stroke="#6e7781" stroke-width="1.5" stroke-linecap="round"/><polygon points="702.0,320.0 693.0,316.2 693.0,323.8" fill="#6e7781"/>
<line x1="440.0" y1="330.0" x2="440.0" y2="71.0" stroke="#6e7781" stroke-width="1.5" stroke-linecap="round"/><polygon points="440.0,62.0 436.2,71.0 443.8,71.0" fill="#6e7781"/>
<text x="710.0" y="325.0" text-anchor="start" font-size="15" font-style="italic" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">u</text><text x="710.0" y="325.0" text-anchor="start" font-size="15" font-style="italic" fill="#1f2328">u</text>
<text x="426.0" y="76.0" text-anchor="middle" font-size="15" font-style="italic" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">t</text><text x="426.0" y="76.0" text-anchor="middle" font-size="15" font-style="italic" fill="#1f2328">t</text>
<line x1="440.0" y1="320.0" x2="680.0" y2="80.0" stroke="#cf222e" stroke-width="2.5" stroke-dasharray="8 5" stroke-linecap="round"/>
<text x="672.0" y="112.0" text-anchor="start" font-size="14" font-weight="bold" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">t = u</text><text x="672.0" y="112.0" text-anchor="start" font-size="14" font-weight="bold" fill="#cf222e">t = u</text>
<text x="446.0" y="102.0" text-anchor="start" font-size="14" font-weight="bold" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">region: 0 ≤ u ≤ t</text><text x="446.0" y="102.0" text-anchor="start" font-size="14" font-weight="bold" fill="#0969da">region: 0 ≤ u ≤ t</text>
<line x1="440.0" y1="170.0" x2="576.0" y2="170.0" stroke="#1a7f37" stroke-width="3.5" stroke-linecap="round"/><polygon points="588.0,170.0 576.0,165.0 576.0,175.0" fill="#1a7f37"/>
<circle cx="590.0" cy="170.0" r="4.5" fill="#1a7f37"/>
<text x="430.0" y="175.0" text-anchor="end" font-size="13" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">fixed t</text><text x="430.0" y="175.0" text-anchor="end" font-size="13" fill="#6e7781">fixed t</text>
<text x="500.0" y="160.0" text-anchor="start" font-size="14" font-weight="bold" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">u: 0 to t</text><text x="500.0" y="160.0" text-anchor="start" font-size="14" font-weight="bold" fill="#1a7f37">u: 0 to t</text>
<text x="430.0" y="20.0" text-anchor="start" font-size="15" font-weight="bold" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">Swapped order</text><text x="430.0" y="20.0" text-anchor="start" font-size="15" font-weight="bold" fill="#1f2328">Swapped order</text>
<text x="430.0" y="40.0" text-anchor="start" font-size="14" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">outer t: 0 to inf, inner u: 0 to t</text><text x="430.0" y="40.0" text-anchor="start" font-size="14" fill="#6e7781">outer t: 0 to inf, inner u: 0 to t</text>
<text x="400.0" y="385.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">Same region (it continues to infinity), so by Fubini the two iterated integrals are equal.</text><text x="400.0" y="385.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2328">Same region (it continues to infinity), so by Fubini the two iterated integrals are equal.</text>
</g>
</svg>
