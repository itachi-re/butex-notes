<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="Georgia, serif" font-size="15" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="700" height="380" fill="#fff"/>
<text x="20" y="28" font-size="18" font-weight="bold">Sucrose = α-D-glucopyranosyl-(1→2)-β-D-fructofuranoside</text>

<!-- glucose pyranose hexagon -->
<g transform="translate(60,90)">
<polygon points="0,50 50,15 140,15 190,50 140,85 50,85" fill="none" stroke="black" stroke-width="2"/>
<text x="45" y="10" font-size="12" font-weight="bold">O</text>
<text x="80" y="110" font-size="13">glucose unit (pyranose)</text>
<text x="130" y="130" font-size="12">C1 — anomeric, α-linked</text>
<line x1="140" y1="85" x2="175" y2="110" stroke="black"/>
</g>

<!-- glycosidic O -->
<text x="300" y="150" font-size="16" font-weight="bold">O</text>
<line x1="260" y1="160" x2="295" y2="150" stroke="black"/>
<line x1="315" y1="150" x2="350" y2="160" stroke="black"/>

<!-- fructose furanose pentagon -->
<g transform="translate(400,80)">
<polygon points="40,0 80,25 65,70 15,70 0,25" fill="none" stroke="black" stroke-width="2"/>
<text x="35" y="-5" font-size="12" font-weight="bold">O</text>
<text x="0" y="105" font-size="13">fructose unit (furanose)</text>
<text x="0" y="125" font-size="12">C2 — anomeric, β-linked</text>
</g>

<text x="20" y="220" font-size="14" fill="#555">The glycosidic bond joins the anomeric carbon of BOTH sugars (glucose C1 to</text>
<text x="20" y="242" font-size="14" fill="#555">fructose C2) — this is a 1,2-glycosidic linkage, unlike most disaccharides which</text>
<text x="20" y="264" font-size="14" fill="#555">link one anomeric carbon to a non-anomeric –OH of the other sugar.</text>
<text x="20" y="296" font-size="14" fill="#555">Consequence: NEITHER ring can open back to a free aldehyde/ketone form, so</text>
<text x="20" y="318" font-size="14" fill="#555">sucrose is a NON-REDUCING sugar (negative Tollens'/Fehling's test) and shows</text>
<text x="20" y="340" font-size="14" fill="#555">no mutarotation. Acid or invertase hydrolysis breaks this bond → "invert sugar"</text>
<text x="20" y="362" font-size="14" fill="#555">(equimolar glucose + fructose), so named because the sign of optical rotation inverts.</text>
</svg>
