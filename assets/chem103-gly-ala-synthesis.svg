<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 380' width='640' height='380' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width='640' height='380' fill='white'/>
<defs><marker id='arrow' markerWidth='10' markerHeight='10' refX='8' refY='3' orient='auto' markerUnits='strokeWidth'><path d='M0,0 L0,6 L9,3 z' fill='#111'/></marker></defs>
<text x='320.0' y='24' font-size='16' font-family='Arial,Helvetica,sans-serif' font-weight='700'  fill='#111' text-anchor='middle'>Protected-Group Synthesis of Gly–Ala</text>
<text x='320.0' y='55' font-size='13' font-family='Arial,Helvetica,sans-serif'   fill='#111' text-anchor='middle'>Cbz–NH–CH₂–COOH   +   H₂N–CH(CH₃)–COOCH₃</text>
<text x='150' y='75' font-size='10' font-family='Arial,Helvetica,sans-serif'  font-style='italic' fill='#555' text-anchor='middle'>protected glycine</text>
<text x='470' y='75' font-size='10' font-family='Arial,Helvetica,sans-serif'  font-style='italic' fill='#555' text-anchor='middle'>protected alanine</text>
<line x1='320' y1='90' x2='320' y2='126' stroke='#111' stroke-width='2' marker-end='url(#arrow)'/>
<text x='330' y='105.12' font-size='12' font-family='Arial,Helvetica,sans-serif'   fill='#111' text-anchor='start'>DCC coupling</text>
<text x='320.0' y='150' font-size='13' font-family='Arial,Helvetica,sans-serif'   fill='#111' text-anchor='middle'>Cbz–NH–CH₂–CO–NH–CH(CH₃)–COOCH₃</text>
<text x='320.0' y='168' font-size='10' font-family='Arial,Helvetica,sans-serif'  font-style='italic' fill='#555' text-anchor='middle'>protected dipeptide</text>
<line x1='320' y1='180' x2='320' y2='216' stroke='#111' stroke-width='2' marker-end='url(#arrow)'/>
<text x='330' y='195.12' font-size='12' font-family='Arial,Helvetica,sans-serif'   fill='#111' text-anchor='start'>H₂/Pd (–Cbz); NaOH (–OCH₃)</text>
<text x='320.0' y='245' font-size='14' font-family='Arial,Helvetica,sans-serif' font-weight='700'  fill='#111' text-anchor='middle'>H₂N–CH₂–CO–NH–CH(CH₃)–COOH</text>
<text x='320.0' y='265' font-size='13' font-family='Arial,Helvetica,sans-serif'  font-style='italic' fill='#555' text-anchor='middle'>Gly – Ala</text>
<line x1='255' y1='275' x2='255' y2='300' stroke='#b00' stroke-width='1.5'/>
<line x1='300' y1='275' x2='300' y2='300' stroke='#b00' stroke-width='1.5'/>
<text x='280' y='320' font-size='12' font-family='Arial,Helvetica,sans-serif' font-weight='700'  fill='#b00' text-anchor='middle'>—CO—NH—</text>
<text x='280' y='338' font-size='10' font-family='Arial,Helvetica,sans-serif'   fill='#b00' text-anchor='middle'>peptide linkage</text>
<text x='130' y='360' font-size='11' font-family='Arial,Helvetica,sans-serif' font-weight='700'  fill='#065' text-anchor='middle'>N-terminal Gly</text>
<text x='430' y='360' font-size='11' font-family='Arial,Helvetica,sans-serif' font-weight='700'  fill='#065' text-anchor='middle'>C-terminal Ala</text>
