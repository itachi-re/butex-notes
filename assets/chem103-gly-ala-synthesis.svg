<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .lbl{font-size:13.5px;fill:#1a1a1a;}
    .small{font-size:12px;fill:#333;}
    .arrow{stroke:#33475b;stroke-width:2;marker-end:url(#ah6);fill:none;}
    .box{fill:#f5f8fc;stroke:#33475b;stroke-width:1.5;}
  </style>
  <defs>
    <marker id="ah6" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#33475b"/>
    </marker>
  </defs>

  <text x="450" y="22" text-anchor="middle" font-size="17" font-weight="bold">Protected-Group Synthesis of Gly-Ala Dipeptide</text>

  <rect class="box" x="15" y="45" width="180" height="50" rx="6"/>
  <text x="105" y="68" text-anchor="middle" class="lbl">Cbz-NH-CH2-COOH</text>
  <text x="105" y="85" text-anchor="middle" class="small">N-protected glycine</text>
  <path class="arrow" d="M195,70 H255"/>
  <text x="225" y="60" text-anchor="middle" class="small">DCC</text>

  <rect class="box" x="255" y="45" width="90" height="50" rx="6"/>
  <text x="300" y="75" text-anchor="middle" class="small">activated ester</text>
  <path class="arrow" d="M345,70 H410"/>

  <rect class="box" x="410" y="45" width="220" height="50" rx="6"/>
  <text x="520" y="68" text-anchor="middle" class="lbl">+ H2N-CH(CH3)-COOCH3</text>
  <text x="520" y="85" text-anchor="middle" class="small">alanine methyl ester (C-protected)</text>

  <path class="arrow" d="M520,95 V140"/>
  <text x="520" y="125" text-anchor="middle" class="small">coupling (amide bond forms)</text>

  <rect class="box" x="330" y="145" width="380" height="55" rx="6"/>
  <text x="520" y="168" text-anchor="middle" class="lbl">Cbz-NH-CH2-CO-NH-CH(CH3)-COOCH3</text>
  <text x="520" y="185" text-anchor="middle" class="small">protected Gly-Ala dipeptide</text>

  <path class="arrow" d="M520,200 V225"/>
  <text x="520" y="220" text-anchor="middle" class="small">H2/Pd (remove Cbz) then NaOH (remove Me ester)</text>

  <text x="520" y="255" text-anchor="middle" class="lbl" font-weight="bold">H2N-CH2-CO-NH-CH(CH3)-COOH  (Gly-Ala, free dipeptide)</text>
</svg>
