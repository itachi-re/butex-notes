<text x="292" y="52" fill="#15803d">F = BIa</text>
<line x1="397.4" y1="251.9" x2="397.4" y2="302" stroke="#15803d" stroke-width="2.5" marker-end="url(#ag)"/>
<text x="407" y="298" fill="#15803d">F = BIa</text>
<line x1="282.6" y1="88.1" x2="282.6" y2="215" stroke="#6b7280" stroke-dasharray="4 3"/>
<line x1="397.4" y1="251.9" x2="397.4" y2="215" stroke="#6b7280" stroke-dasharray="4 3"/>
<line x1="284" y1="205" x2="396" y2="205" stroke="#15803d" stroke-width="1.5" marker-start="url(#ag)" marker-end="url(#ag)"/>
<text x="272" y="200" fill="#15803d" text-anchor="end">arm = b sin θ</text>
<text x="40" y="326" fill="#1f2937">Top view of loop (edge-on), axis through O perpendicular to the page.</text>
<text x="40" y="344" fill="#6b7280">Forces on the other two sides (BIb cos θ) lie along the axis and cancel.</text>
