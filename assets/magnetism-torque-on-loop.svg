<svg xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14" width="680" height="350" viewBox="0 0 680 350" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Torque on a current-carrying loop in a uniform magnetic field (top view)</title>
<defs>
