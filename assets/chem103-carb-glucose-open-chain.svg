<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 410" width="700" height="410" role="img" aria-label="D-glucose open chain Fischer projection with four asymmetric carbons marked" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>D-glucose open chain Fischer projection with four asymmetric carbons marked</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect x="0.5" y="0.5" width="699" height="409" rx="10" fill="#ffffff" stroke="#e5e7eb"/><g transform="translate(20.0,14.0)"><line x1="95.0" y1="38.0" x2="95.0" y2="232.0" stroke="#111827" stroke-width="2.4" stroke-linecap="round"/><text x="95.0" y="32.0" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">CHO</text><text x="95.0" y="256.0" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">CH₂OH</text><text x="18.0" y="32.0" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#6b7280">1</text><text x="18.0" y="79.0" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#6b7280">2</text><line x1="69.0" y1="74.0" x2="121.0" y2="74.0" stroke="#111827" stroke-width="2.4" stroke-linecap="round"/><text x="126.0" y="80.0" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="17" text-anchor="start" font-weight="normal" fill="#111827">OH</text><text x="64.0" y="80.0" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="17" text-anchor="end" font-weight="normal" fill="#111827">H</text><circle cx="95" cy="74.0" r="4.5" fill="#dc2626"/><text x="18.0" y="123.0" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#6b7280">3</text><line x1="69.0" y1="118.0" x2="121.0" y2="118.0" stroke="#111827" stroke-width="2.4" stroke-linecap="round"/><text x="64.0" y="124.0" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="17" text-anchor="end" font-weight="normal" fill="#111827">OH</text><text x="126.0" y="124.0" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="17" text-anchor="start" font-weight="normal" fill="#111827">H</text><circle cx="95" cy="118.0" r="4.5" fill="#dc2626"/><text x="18.0" y="167.0" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#6b7280">4</text><line x1="69.0" y1="162.0" x2="121.0" y2="162.0" stroke="#111827" stroke-width="2.4" stroke-linecap="round"/><text x="126.0" y="168.0" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="17" text-anchor="start" font-weight="normal" fill="#111827">OH</text><text x="64.0" y="168.0" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="17" text-anchor="end" font-weight="normal" fill="#111827">H</text><circle cx="95" cy="162.0" r="4.5" fill="#dc2626"/><text x="18.0" y="211.0" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#6b7280">5</text><line x1="69.0" y1="206.0" x2="121.0" y2="206.0" stroke="#111827" stroke-width="2.4" stroke-linecap="round"/><text x="126.0" y="212.0" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="17" text-anchor="start" font-weight="normal" fill="#111827">OH</text><text x="64.0" y="212.0" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="17" text-anchor="end" font-weight="normal" fill="#111827">H</text><circle cx="95" cy="206.0" r="4.5" fill="#dc2626"/><text x="95.0" y="290.0" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#111827">D-(+)-Glucose</text><text x="95.0" y="309.0" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#6b7280">(open-chain, aldohexose)</text></g><text x="330.0" y="62.0" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#1d4ed8">C-1 : aldehyde carbon</text><text x="330.0" y="150.0" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="15" text-anchor="start" font-weight="bold" fill="#dc2626">C-2, C-3, C-4, C-5 :</text><text x="330.0" y="170.0" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#dc2626">four asymmetric (chiral) carbons</text><text x="330.0" y="190.0" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#6b7280">(each bears H, OH and two different chains)</text><text x="330.0" y="240.0" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="15" text-anchor="start" font-weight="bold" fill="#047857">C-5 : OH on the RIGHT</text><text x="330.0" y="260.0" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#6b7280">is the highest-numbered stereocentre,</text><text x="330.0" y="278.0" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#6b7280">so the sugar belongs to the D-series</text><text x="330.0" y="326.0" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#1d4ed8">C-6 : primary alcohol (CH₂OH) - not chiral</text><circle cx="338" cy="360" r="4.5" fill="#dc2626"/><text x="350.0" y="365.0" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#6b7280">= asymmetric carbon (stereocentre)</text></svg>