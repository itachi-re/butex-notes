<svg viewBox="0 0 600 220" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
  <style>.lbl{font-size:13px;fill:#111827;}</style>
  <path d="M40,150 q20,-60 40,0 q20,-60 40,0 q20,-60 40,0 q20,-60 40,0" fill="none" stroke="#059669" stroke-width="3"/>
  <text x="60" y="190" class="lbl">Coil, current I(t) increasing</text>
  <text x="60" y="30" class="lbl" fill="#dc2626">Self-induced back-emf opposes rise</text>

  <!-- RL rise curve -->
  <g transform="translate(320,20)">
    <line x1="0" y1="160" x2="240" y2="160" stroke="#111827"/>
    <line x1="0" y1="160" x2="0" y2="10" stroke="#111827"/>
    <path d="M0,160 C40,60 80,20 240,15" fill="none" stroke="#2563eb" stroke-width="2"/>
    <text x="10" y="20" class="lbl">I</text>
    <text x="220" y="175" class="lbl">t</text>
    <line x1="0" y1="15" x2="240" y2="15" stroke="#9ca3af" stroke-dasharray="4"/>
    <text x="180" y="10" class="lbl">E0/R</text>
  </g>
</svg>
