<svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg" font-family="Arial" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<text x="280" y="20" text-anchor="middle" font-weight="bold">Coupling reaction and Sulfa drug (sulfanilamide) synthesis</text>

<!-- Coupling reaction -->
<text x="20" y="50" font-weight="bold">Coupling reaction (azo dye formation):</text>
<polygon points="60,90 85,75 110,90 110,115 85,130 60,115" fill="none" stroke="black"/>
<text x="85" y="143" text-anchor="middle" font-size="10">ArN₂⁺Cl⁻</text>
<line x1="110" y1="102" x2="150" y2="102" stroke="black" marker-end="url(#a)"/>
<text x="130" y="95" font-size="10">+ phenol/</text>
<text x="130" y="88" font-size="10">aniline, pH~9</text>
<polygon points="170,90 195,75 220,90 220,115 195,130 170,115" fill="none" stroke="black"/>
<text x="195" y="143" text-anchor="middle" font-size="10">(coupling component)</text>
<line x1="140" y1="60" x2="140" y2="80" stroke="black" marker-end="url(#a)"/>
<text x="195" y="60" text-anchor="middle" font-size="11">→ Ar–N=N–Ar' (azo dye, e.g. p-aminoazobenzene)</text>

<!-- Sulfa drug -->
<text x="20" y="190" font-weight="bold">Sulfa drug (sulfanilamide) synthesis:</text>
<text x="20" y="212" font-size="11">1. Aniline + CH₃COCl → Acetanilide (–NH₂ protected)</text>
<text x="20" y="230" font-size="11">2. Acetanilide + ClSO₃H → p-acetamidobenzenesulfonyl chloride</text>
<text x="20" y="248" font-size="11">3. + NH₃ → p-acetamidobenzenesulfonamide</text>
<text x="20" y="266" font-size="11">4. Hydrolysis (dil. HCl) → Sulfanilamide (p-H₂N-C₆H₄-SO₂NH₂)</text>

<polygon points="380,220 405,205 430,220 430,245 405,260 380,245" fill="none" stroke="black"/>
<text x="350" y="235" font-size="10">H₂N</text>
<line x1="430" y1="232" x2="460" y2="232" stroke="black"/>
<text x="500" y="236" font-size="11">SO₂NH₂</text>
<text x="405" y="290" text-anchor="middle" font-size="10">Sulfanilamide (antibacterial)</text>
</svg>
