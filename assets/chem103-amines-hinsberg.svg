<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .box{fill:#f5f8fc;stroke:#33475b;stroke-width:1.5;}
    .lbl{font-size:15px;fill:#1a1a1a;}
    .small{font-size:12px;fill:#333;}
    .arrow{stroke:#33475b;stroke-width:2;marker-end:url(#ah);fill:none;}
    .res{font-size:13px;font-weight:bold;}
  </style>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#33475b"/>
    </marker>
  </defs>

  <text x="450" y="24" text-anchor="middle" font-size="17" font-weight="bold">Hinsberg Method: Separation of 1°, 2°, 3° Amines</text>

  <rect class="box" x="20" y="50" width="200" height="60" rx="6"/>
  <text x="120" y="75" text-anchor="middle" class="lbl">Mixture of</text>
  <text x="120" y="95" text-anchor="middle" class="lbl">1° + 2° + 3° amines</text>

  <path class="arrow" d="M220,80 H300"/>
  <text x="260" y="72" text-anchor="middle" class="small">C6H5SO2Cl (Hinsberg reagent), KOH</text>

  <rect class="box" x="300" y="50" width="250" height="60" rx="6"/>
  <text x="425" y="75" text-anchor="middle" class="lbl">Sulfonamide mixture:</text>
  <text x="425" y="95" text-anchor="middle" class="small">R-NH-SO2C6H5 (from 1°), R2N-SO2C6H5 (from 2°), R3NH+ salt (3° unreacted)</text>

  <path class="arrow" d="M425,110 V150"/>
  <text x="440" y="135" class="small">shake with KOH(aq)</text>

  <!-- 1 amine branch -->
  <rect class="box" x="60" y="170" width="230" height="80" rx="6"/>
  <text x="175" y="192" text-anchor="middle" class="res">1° amine</text>
  <text x="175" y="212" text-anchor="middle" class="small">R-NH-SO2C6H5 has acidic N-H</text>
  <text x="175" y="230" text-anchor="middle" class="small">→ dissolves in KOH as soluble salt</text>
  <path class="arrow" d="M175,250 V300"/>
  <text x="175" y="320" text-anchor="middle" class="small">acidify + heat → hydrolysis</text>
  <text x="175" y="340" text-anchor="middle" class="res">R-NH2 (1° amine recovered)</text>

  <!-- 2 amine branch -->
  <rect class="box" x="330" y="170" width="230" height="80" rx="6"/>
  <text x="445" y="192" text-anchor="middle" class="res">2° amine</text>
  <text x="445" y="212" text-anchor="middle" class="small">R2N-SO2C6H5 has no N-H</text>
  <text x="445" y="230" text-anchor="middle" class="small">→ insoluble in KOH, filtered off</text>
  <path class="arrow" d="M445,250 V300"/>
  <text x="445" y="320" text-anchor="middle" class="small">hydrolysis (HCl, heat)</text>
  <text x="445" y="340" text-anchor="middle" class="res">R2NH (2° amine recovered)</text>

  <!-- 3 amine branch -->
  <rect class="box" x="600" y="170" width="230" height="80" rx="6"/>
  <text x="715" y="192" text-anchor="middle" class="res">3° amine</text>
  <text x="715" y="212" text-anchor="middle" class="small">R3N does not react with reagent</text>
  <text x="715" y="230" text-anchor="middle" class="small">stays as water-soluble R3NH+ salt</text>
  <path class="arrow" d="M715,250 V300"/>
  <text x="715" y="320" text-anchor="middle" class="small">separated with ether, then</text>
  <text x="715" y="340" text-anchor="middle" class="res">R3N (3° amine recovered)</text>

  <text x="450" y="390" text-anchor="middle" font-size="12" font-style="italic">Key: 1° → soluble sulfonamide | 2° → insoluble sulfonamide | 3° → no sulfonamide formed</text>
</svg>
