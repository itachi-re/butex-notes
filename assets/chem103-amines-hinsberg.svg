<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 300' width='760' height='300' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width='760' height='300' fill='white'/>
<defs><marker id='arrow' markerWidth='10' markerHeight='10' refX='8' refY='3' orient='auto' markerUnits='strokeWidth'><path d='M0,0 L0,6 L9,3 z' fill='#111'/></marker></defs>
<text x='380.0' y='28' font-size='16' font-family='Arial,Helvetica,sans-serif' font-weight='700'  fill='#111' text-anchor='middle'>Hinsberg Separation of 1°, 2° and 3° Amines (PhSO₂Cl / KOH)</text>
<text x='130' y='60' font-size='13' font-family='Arial,Helvetica,sans-serif' font-weight='700'  fill='#111' text-anchor='middle'>1° amine: R–NH₂</text>
<line x1='130' y1='70' x2='130' y2='104' stroke='#111' stroke-width='2' marker-end='url(#arrow)'/>
<text x='140' y='84.28' font-size='11' font-family='Arial,Helvetica,sans-serif'   fill='#111' text-anchor='start'>PhSO₂Cl / KOH</text>
<text x='130' y='122' font-size='13' font-family='Arial,Helvetica,sans-serif'   fill='#111' text-anchor='middle'>Ph–SO₂–NH–R</text>
<line x1='130' y1='132' x2='130' y2='166' stroke='#111' stroke-width='2' marker-end='url(#arrow)'/>
<text x='130' y='184' font-size='12' font-family='Arial,Helvetica,sans-serif'   fill='#111' text-anchor='middle'>soluble in KOH</text>
<text x='130' y='205' font-size='10' font-family='Arial,Helvetica,sans-serif'   fill='#555' text-anchor='middle'>N–H present → acidic → dissolves as salt</text>
<text x='380' y='60' font-size='13' font-family='Arial,Helvetica,sans-serif' font-weight='700'  fill='#111' text-anchor='middle'>2° amine: R₂NH</text>
<line x1='380' y1='70' x2='380' y2='104' stroke='#111' stroke-width='2' marker-end='url(#arrow)'/>
<text x='390' y='84.28' font-size='11' font-family='Arial,Helvetica,sans-serif'   fill='#111' text-anchor='start'>PhSO₂Cl / KOH</text>
<text x='380' y='122' font-size='13' font-family='Arial,Helvetica,sans-serif'   fill='#111' text-anchor='middle'>Ph–SO₂–NR₂</text>
<line x1='380' y1='132' x2='380' y2='166' stroke='#111' stroke-width='2' marker-end='url(#arrow)'/>
<text x='380' y='184' font-size='12' font-family='Arial,Helvetica,sans-serif'   fill='#111' text-anchor='middle'>insoluble in KOH</text>
<text x='380' y='205' font-size='10' font-family='Arial,Helvetica,sans-serif'   fill='#555' text-anchor='middle'>N–H present but hindered → stays solid</text>
<text x='630' y='60' font-size='13' font-family='Arial,Helvetica,sans-serif' font-weight='700'  fill='#111' text-anchor='middle'>3° amine: R₃N</text>
<line x1='630' y1='70' x2='630' y2='104' stroke='#111' stroke-width='2' marker-end='url(#arrow)'/>
<text x='640' y='84.28' font-size='11' font-family='Arial,Helvetica,sans-serif'   fill='#111' text-anchor='start'>PhSO₂Cl : no reaction</text>
<text x='630' y='122' font-size='13' font-family='Arial,Helvetica,sans-serif'   fill='#111' text-anchor='middle'>R₃N + HCl(dil.)</text>
<line x1='630' y1='132' x2='630' y2='166' stroke='#111' stroke-width='2' marker-end='url(#arrow)'/>
<text x='630' y='184' font-size='12' font-family='Arial,Helvetica,sans-serif'   fill='#111' text-anchor='middle'>[R₃NH]⁺Cl⁻ (water-soluble)</text>
<text x='630' y='205' font-size='10' font-family='Arial,Helvetica,sans-serif'   fill='#555' text-anchor='middle'>no N–H, no acidic proton; recovered as salt</text>
<line x1='20' y1='225' x2='740' y2='225' stroke='#ccc' stroke-width='1'/>
<text x='380.0' y='250' font-size='12' font-family='Arial,Helvetica,sans-serif'  font-style='italic' fill='#111' text-anchor='middle'>Worked mixture: ethylamine (1°) + N-methylethylamine (2°) + triethylamine (3°)</text>
<text x='380.0' y='272' font-size='11' font-family='Arial,Helvetica,sans-serif'   fill='#555' text-anchor='middle'>→ regenerated by acid hydrolysis (1°, 2°) or basification (3°) after separation</text>
</svg>
