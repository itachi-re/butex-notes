<svg xmlns='http://www.w3.org/2000/svg' width='760' height='360' viewBox='0 0 760 360'><defs><marker id='ah' markerWidth='10' markerHeight='8' refX='8' refY='4' orient='auto'><path d='M0,0 L9,4 L0,8 z' fill='#c0392b'/></marker><marker id='ab' markerWidth='10' markerHeight='8' refX='8' refY='4' orient='auto'><path d='M0,0 L9,4 L0,8 z' fill='#1f6fb2'/></marker></defs><rect x='1' y='1' width='758' height='358' rx='12' fill='#ffffff' stroke='#1f3a5f' stroke-width='2'/><rect x='1' y='1' width='758' height='38' rx='12' fill='#1f3a5f'/><rect x='1' y='24' width='758' height='15' fill='#1f3a5f'/><text x='248.9' y='27' font-family='Helvetica, Arial, sans-serif' font-size='18' text-anchor='start' font-weight='bold' fill='#ffffff'>Bonding in a Grignard reagent</text><text x='120.4' y='72' font-family='Helvetica, Arial, sans-serif' font-size='17' text-anchor='start' font-weight='bold' fill='#1f3a5f'>Polar C-Mg bond</text><text x='407.2' y='72' font-family='Helvetica, Arial, sans-serif' font-size='17' text-anchor='start' font-weight='bold' fill='#1f3a5f'>Real structure: Mg is solvated by ether</text><line x1='380' y1='55' x2='380' y2='345' stroke='#ccc' stroke-width='1.5' stroke-dasharray='5 5'/><text x='57.6' y='170' font-family='Helvetica, Arial, sans-serif' font-size='34' text-anchor='start' font-weight='bold' fill='#111'>R</text><line x1='92' y1='160' x2='150' y2='160' stroke='#111' stroke-width='2.5' stroke-linecap='round'/><text x='164.5' y='170' font-family='Helvetica, Arial, sans-serif' font-size='34' text-anchor='start' font-weight='bold' fill='#111'>Mg</text><line x1='228' y1='160' x2='286' y2='160' stroke='#111' stroke-width='2.5' stroke-linecap='round'/><text x='305.6' y='170' font-family='Helvetica, Arial, sans-serif' font-size='34' text-anchor='start' font-weight='bold' fill='#111'>X</text><text x='57.1' y='118' font-family='Helvetica, Arial, sans-serif' font-size='22' text-anchor='start' font-weight='bold' fill='#c0392b'>δ−</text><text x='176.5' y='118' font-family='Helvetica, Arial, sans-serif' font-size='22' text-anchor='start' font-weight='bold' fill='#1f6fb2'>δ+</text><text x='305.1' y='118' font-family='Helvetica, Arial, sans-serif' font-size='22' text-anchor='start' font-weight='bold' fill='#c0392b'>δ−</text><text x='63.2' y='235' font-family='Helvetica, Arial, sans-serif' font-size='14' text-anchor='start' font-weight='normal' fill='#111'>Electronegativity:  C = 2.55,  Mg = 1.31</text><text x='51.0' y='258' font-family='Helvetica, Arial, sans-serif' font-size='14' text-anchor='start' font-weight='normal' fill='#111'>ΔEN = 1.24  →  C-Mg bond is strongly polar</text><text x='55.2' y='281' font-family='Helvetica, Arial, sans-serif' font-size='14' text-anchor='start' font-weight='normal' fill='#111'>Carbon carries the partial negative charge</text><text x='89.4' y='304' font-family='Helvetica, Arial, sans-serif' font-size='14' text-anchor='start' font-weight='normal' fill='#c0392b'>→  R acts like a carbanion (R−):</text><text x='60.2' y='325' font-family='Helvetica, Arial, sans-serif' font-size='14' text-anchor='start' font-weight='normal' fill='#c0392b'>strong NUCLEOPHILE and strong BASE</text><circle cx='570' cy='160' r='27' fill='#e8f1fb' stroke='#1f6fb2' stroke-width='2.5'/><text x='552.0' y='168' font-family='Helvetica, Arial, sans-serif' font-size='24' text-anchor='start' font-weight='bold' fill='#111'>Mg</text><line x1='546' y1='146' x2='495' y2='112' stroke='#111' stroke-width='2.5' stroke-linecap='round'/><text x='470.5' y='108' font-family='Helvetica, Arial, sans-serif' font-size='26' text-anchor='start' font-weight='bold' fill='#111'>R</text><line x1='594' y1='146' x2='645' y2='112' stroke='#111' stroke-width='2.5' stroke-linecap='round'/><text x='650.5' y='108' font-family='Helvetica, Arial, sans-serif' font-size='26' text-anchor='start' font-weight='bold' fill='#111'>X</text><line x1='515' y1='216' x2='556' y2='188' stroke='#1f6fb2' stroke-width='2' stroke-dasharray='5 4' marker-end='url(#ab)'/><text x='506.3' y='240' font-family='Helvetica, Arial, sans-serif' font-size='24' text-anchor='start' font-weight='bold' fill='#c0392b'>O</text><line x1='505' y1='246' x2='481' y2='274' stroke='#111' stroke-width='2.5' stroke-linecap='round'/><line x1='525' y1='246' x2='549' y2='274' stroke='#111' stroke-width='2.5' stroke-linecap='round'/><text x='467.4' y='290' font-family='Helvetica, Arial, sans-serif' font-size='15' text-anchor='start' font-weight='normal' fill='#666'>Et</text><text x='547.4' y='290' font-family='Helvetica, Arial, sans-serif' font-size='15' text-anchor='start' font-weight='normal' fill='#666'>Et</text><line x1='625' y1='216' x2='584' y2='188' stroke='#1f6fb2' stroke-width='2' stroke-dasharray='5 4' marker-end='url(#ab)'/><text x='616.3' y='240' font-family='Helvetica, Arial, sans-serif' font-size='24' text-anchor='start' font-weight='bold' fill='#c0392b'>O</text><line x1='615' y1='246' x2='591' y2='274' stroke='#111' stroke-width='2.5' stroke-linecap='round'/><line x1='635' y1='246' x2='659' y2='274' stroke='#111' stroke-width='2.5' stroke-linecap='round'/><text x='577.4' y='290' font-family='Helvetica, Arial, sans-serif' font-size='15' text-anchor='start' font-weight='normal' fill='#666'>Et</text><text x='657.4' y='290' font-family='Helvetica, Arial, sans-serif' font-size='15' text-anchor='start' font-weight='normal' fill='#666'>Et</text><text x='461.2' y='322' font-family='Helvetica, Arial, sans-serif' font-size='12.5' text-anchor='start' font-weight='normal' fill='#666'>RMgX·2 Et<tspan dy='3' font-size='8.8'>2</tspan><tspan dy='-3'>O: lone pairs on O donate</tspan></text><text x='450.4' y='340' font-family='Helvetica, Arial, sans-serif' font-size='12.5' text-anchor='start' font-weight='normal' fill='#666'>into empty orbitals of Mg (tetrahedral Mg)</text></svg>