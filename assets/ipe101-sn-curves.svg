" stroke-linecap="round"/><text x="420.0" y="314.0" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">10³</text><line x1="470.0" y1="292.0" x2="470.0" y2="298.0" stroke="#222" stroke-width="1" stroke-linecap="round"/><text x="470.0" y="314.0" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">10⁴</text><line x1="520.0" y1="292.0" x2="520.0" y2="298.0" stroke="#222" stroke-width="1" stroke-linecap="round"/><text x="520.0" y="314.0" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">10⁵</text><line x1="570.0" y1="292.0" x2="570.0" y2="298.0" stroke="#222" stroke-width="1" stroke-linecap="round"/><text x="570.0" y="314.0" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">10⁶</text><line x1="620.0" y1="292.0" x2="620.0" y2="298.0" stroke="#222" stroke-width="1" stroke-linecap="round"/><text x="620.0" y="314.0" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">10⁷</text><line x1="670.0" y1="292.0" x2="670.0" y2="298.0" stroke="#222" stroke-width="1" stroke-linecap="round"/><text x="670.0" y="314.0" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">10⁸</text><text x="550.0" y="340.0" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">N (cycles)</text><path d="M420,105 C490,125 570,170 690,235" fill="none" stroke="#1d3557" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="670.0" y1="292.0" x2="670.0" y2="225.0" stroke="#d62828" stroke-width="1.2" stroke-dasharray="5 3" stroke-linecap="round"/><line x1="400.0" y1="225.0" x2="670.0" y2="225.0" stroke="#d62828" stroke-width="1.2" stroke-dasharray="5 3" stroke-linecap="round"/><text x="408.0" y="218.0" font-size="14" text-anchor="start" fill="#d62828" font-weight="bold">σ_f</text><text x="460.0" y="262.0" font-size="11" text-anchor="start" fill="#d62828" font-weight="normal">fatigue (endurance) strength at 10⁸ cycles</text><text x="500.0" y="150.0" font-size="11" text-anchor