<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="380" viewBox="0 0 1080 380" font-family="DejaVu Sans, Verdana, Arial, sans-serif" role="img" aria-label="Types of S–N (Wöhler) curves from the fatigue test"><title>Types of S–N (Wöhler) curves from the fatigue test</title><defs><marker id="m222" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#222"/></marker></defs><rect width="1080" height="380" fill="#ffffff"/><text x="540.0" y="28.0" font-size="17" text-anchor="middle" fill="#222" font-weight="bold">Types of S–N (Wöhler) curves from the fatigue test</text><text x="540.0" y="46.0" font-size="12" text-anchor="middle" fill="#555" font-weight="normal">S = stress amplitude, N = cycles to failure (log scale)</text><line x1="60.0" y1="300.0" x2="60.0" y2="70.0" stroke="#222" stroke-width="2" marker-end="url(#m222)" stroke-linecap="round"/><line x1="52.0" y1="292.0" x2="360.0" y2="292.0" stroke="#222" stroke-width="2" marker-end="url(#m222)" stroke-linecap="round"/><text x="200.0" y="62.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">(a) Ferrous metals / Ti</text><text x="48.0" y="80.0" font-size="14" text-anchor="end" fill="#222" font-weight="bold" font-style="italic">S</text><line x1="80.0" y1="292.0" x2="80.0" y2="298.0" stroke="#222" stroke-width="1" stroke-linecap="round"/><text x="80.0" y="314.0" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">10³</text><line x1="130.0" y1="292.0" x2="130.0" y2="298.0" stroke="#222" stroke-width="1" stroke-linecap="round"/><text x="130.0" y="314.0" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">10⁴</text><line x1="180.0" y1="292.0" x2="180.0" y2="298.0" stroke="#222" stroke-width="1" stroke-linecap="round"/><text x="180.0" y="314.0" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">10⁵</text><line x1="230.0" y1="292.0" x2="230.0" y2="298.0