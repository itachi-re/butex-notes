<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="DejaVu Sans, Verdana, Arial, sans-serif" role="img" aria-label="Hollow cylinder under axial load"><title>Hollow cylinder under axial load</title><defs><marker id="md62828" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#d62828"/></marker><marker id="m444" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#444"/></marker></defs><rect width="900" height="380" fill="#ffffff"/><text x="450.0" y="28.0" font-size="17" text-anchor="middle" fill="#222" font-weight="bold">Hollow cylinder under axial load</text><text x="450.0" y="46.0" font-size="12" text-anchor="middle" fill="#555" font-weight="normal">L = 2 m,  D = 60 mm,  d = 40 mm,  P = 35 kN,  E = 250 GPa</text><rect x="90.0" y="125.0" width="390.0" height="90.0" rx="0" fill="#cfd8dc" stroke="#37474f" stroke-width="2"/><path d="M90,125.0 A16,45.0 0 0 0 90,215.0" fill="#b0bec5" stroke="#37474f" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M480,125.0 A16,45.0 0 0 1 480,215.0" fill="#b0bec5" stroke="#37474f" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M480,125.0 A16,45.0 0 0 0 480,215.0" fill="#eceff1" stroke="#37474f" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M472,145 A8,25 0 0 1 472,195 A8,25 0 0 1 472,145" fill="#fff" stroke="#37474f" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><line x1="15.0" y1="170.0" x2="80.0" y2="170.0" stroke="#d62828" stroke-width="4" marker-end="url(#md62828)" stroke-linecap="round"/><line x1="570.0" y1="170.0" x2="505.0" y2="170.0" stroke="#d62828" stroke-width="4" marker-end="url(#md62828)" stroke-linecap="round"/><text x="45.0" y="156.0" font-size="17" text-anchor="middle" fill="#d62828" font-weight="bold">P</text><text x="545.0" y="156.0" font-size="17" text-anchor="middle" fill="#d62828" font-weight="bold">P</text><line x1="285.0" y1="260.0" x2="90.0" y2="260.0" stroke="#444" stroke-width="1.2" marker-end="url(#m444)" stroke-linecap="round"/><line x1="285.0" y1="260.0" x2="480.0" y2="260.0" stroke="#444" stroke-width="1.2" marker-end="url(#m444)" stroke-linecap="round"/><text x="285.0" y="282.0" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">L = 2 m</text><line x1="520.0" y1="100.0" x2="520.0" y2="100.0" stroke="#fff" stroke-width="0" stroke-linecap="round"/><text x="300.0" y="98.0" font-size="13" text-anchor="middle" fill="#222" font-weight="normal" font-style="italic">compressive deformation δ = P L / (A E)</text><circle cx="740.0" cy="160.0" r="70.0" fill="#b0bec5" stroke="#263238" stroke-width="2"/><circle cx="740.0" cy="160.0" r="46.0" fill="#fff" stroke="#263238" stroke-width="2"/><line x1="740.0" y1="255.0" x2="670.0" y2="255.0" stroke="#444" stroke-width="1.2" marker-end="url(#m444)" stroke-linecap="round"/><line x1="740.0" y1="255.0" x2="810.0" y2="255.0" stroke="#444" stroke-width="1.2" marker-end="url(#m444)" stroke-linecap="round"/><text x="740.0" y="275.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">D = 60 mm</text><line x1="740.0" y1="160.0" x2="694.0" y2="160.0" stroke="#d62828" stroke-width="1.2" marker-end="url(#md62828)" stroke-linecap="round"/><line x1="740.0" y1="160.0" x2="786.0" y2="160.0" stroke="#d62828" stroke-width="1.2" marker-end="url(#md62828)" stroke-linecap="round"/><text x="740.0" y="154.0" font-size="12" text-anchor="middle" fill="#d62828" font-weight="bold">d = 40</text><text x="740.0" y="60.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">cross-section</text><text x="70.0" y="320.0" font-size="13" text-anchor="start" fill="#222" font-weight="normal">A = π/4 (60² − 40²) = 1570.8 mm²   →   σ = P/A = 35 000 / 1570.8 = 22.28 MPa</text><text x="70.0" y="342.0" font-size="13" text-anchor="start" fill="#222" font-weight="normal">δ = σ L / E = 22.28 × 2000 / 250 000 = 0.178 mm (shortening)</text></svg>