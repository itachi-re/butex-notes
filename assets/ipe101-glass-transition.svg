<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="DejaVu Sans, Verdana, Arial, sans-serif" role="img" aria-label="Glass transition: specific volume against temperature"><title>Glass transition: specific volume against temperature</title><defs><marker id="m222" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#222"/></marker></defs><rect width="900" height="470" fill="#ffffff"/><text x="450.0" y="28.0" font-size="17" text-anchor="middle" fill="#222" font-weight="bold">Glass transition: specific volume against temperature</text><text x="450.0" y="46.0" font-size="12" text-anchor="middle" fill="#555" font-weight="normal">cooling rate shifts Tg slightly; a crystal shows a sharp discontinuity at Tm</text><line x1="90.0" y1="410.0" x2="90.0" y2="70.0" stroke="#222" stroke-width="2" marker-end="url(#m222)" stroke-linecap="round"/><line x1="80.0" y1="400.0" x2="860.0" y2="400.0" stroke="#222" stroke-width="2" marker-end="url(#m222)" stroke-linecap="round"/><text x="90.0" y="60.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">Specific volume</text><text x="860.0" y="428.0" font-size="13" text-anchor="end" fill="#222" font-weight="bold">Temperature</text><line x1="440.0" y1="200.0" x2="800.0" y2="120.0" stroke="#1d3557" stroke-width="3" stroke-linecap="round"/><line x1="440.0" y1="200.0" x2="200.0" y2="253.3" stroke="#1d3557" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round"/><text x="190.0" y="232.0" font-size="12" text-anchor="start" fill="#1d3557" font-weight="normal">supercooled liquid</text><path d="M120,330 L440,300 L440,200" fill="none" stroke="#2a9d8f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="130.0" y="350.0" font-size="12" text-anchor="start" fill="#2a9d8f" font-weight="bold">crystalline solid</text><polyline points="340.0,222.2 120.0,242.9" fill="none" stroke="#c1121f" stroke-width="3" stroke-linejoin="round"/><line x1="340.0" y1="222.2" x2="340.0" y2="400.0" stroke="#c1121f" stroke-width="1.2" stroke-dasharray="4 3" stroke-linecap="round"/><circle cx="340.0" cy="222.2" r="4.5" fill="#c1121f" stroke="#c1121f" stroke-width="1.5"/><text x="340.0" y="418.0" font-size="11" text-anchor="middle" fill="#c1121f" font-weight="bold">Tg (fast cooling)</text><polyline points="290.0,233.3 120.0,249.3" fill="none" stroke="#6a4c93" stroke-width="3" stroke-linejoin="round"/><line x1="290.0" y1="233.3" x2="290.0" y2="400.0" stroke="#6a4c93" stroke-width="1.2" stroke-dasharray="4 3" stroke-linecap="round"/><circle cx="290.0" cy="233.3" r="4.5" fill="#6a4c93" stroke="#6a4c93" stroke-width="1.5"/><text x="290.0" y="432.0" font-size="11" text-anchor="middle" fill="#6a4c93" font-weight="bold">Tg (slow cooling)</text><line x1="440.0" y1="300.0" x2="440.0" y2="400.0" stroke="#2a9d8f" stroke-width="1.2" stroke-dasharray="4 3" stroke-linecap="round"/><text x="440.0" y="418.0" font-size="12" text-anchor="middle" fill="#2a9d8f" font-weight="bold">Tm</text><text x="640.0" y="170.0" font-size="14" text-anchor="middle" fill="#1d3557" font-weight="bold">LIQUID</text><text x="200.0" y="292.0" font-size="12" text-anchor="start" fill="#c1121f" font-weight="bold">GLASS (amorphous solid)</text><text x="330.0" y="190.0" font-size="11" text-anchor="start" fill="#555" font-weight="normal">Tg: change in slope — no latent heat, no crystallisation</text><text x="540.0" y="345.0" font-size="11" text-anchor="start" fill="#222" font-weight="normal">Typical Tg:  soda-lime glass ≈ 550 °C  ·  fused silica ≈ 1100 °C</text><text x="540.0" y="363.0" font-size="11" text-anchor="start" fill="#222" font-weight="normal">polystyrene ≈ 100 °C  ·  PVC ≈ 80 °C  ·  PE ≈ −120 °C</text></svg>