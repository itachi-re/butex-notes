<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" width="1040" height="640" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Austempering cooling path" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Austempering cooling path</title><desc>Austenitize, rapid transfer to salt bath in bainite range, isothermal hold, cool</desc><defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker><pattern id="lam" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#f3e3c3"/><line x1="0" y1="3" x2="6" y2="3" stroke="#6b3d10" stroke-width="1.6"/></pattern><pattern id="lamf" width="3.5" height="3.5" patternUnits="userSpaceOnUse"><rect width="3.5" height="3.5" fill="#f3e3c3"/><line x1="0" y1="1.7" x2="3.5" y2="1.7" stroke="#6b3d10" stroke-width="1.2"/></pattern><pattern id="lamc" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f3e3c3"/><line x1="0" y1="5" x2="10" y2="5" stroke="#6b3d10" stroke-width="2.2"/></pattern></defs><rect width="100%" height="100%" fill="#fff"/><text x="520.0" y="26" font-size="17" text-anchor="middle" fill="#0b2a55" font-weight="bold"><tspan x="520.0" dy="0.0">Austempering vs Hardening + Tempering</tspan></text><text x="520.0" y="44" font-size="11.5" text-anchor="middle" fill="#555" font-style="italic"><tspan x="520.0" dy="0.0">Schematic – not to scale; bainite range 400–800 °F (lecture)</tspan></text><line x1="100" y1="500" x2="800" y2="500" stroke="#111" stroke-width="2" marker-end="url(#ar)"/><line x1="100" y1="500" x2="100" y2="70" stroke="#111" stroke-width="2" marker-end="url(#ar)"/><text x="450.0" y="534" font-size="12" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="450.0" dy="0.0">Time (log) →</tspan></text><text x="62" y="285.0" font-size="12" text-anchor="middle" fill="#111" font-weight="bold" transform="rotate(-90 62 285.0)"><tspan x="62" dy="0.0">Temperature →</tspan></text><line x1="100" y1="110" x2="800" y2="110" stroke="#33b" stroke-width="1.4" stroke-dasharray="7 4"/><text x="806" y="114" font-size="11.5" text-anchor="start" fill="#33b" font-weight="bold"><tspan x="806" dy="0.0">A₁</tspan></text><path d="M700 112 C500 130 350 160 290 240 C300 300 400 340 520 365" stroke="#c0392b" stroke-width="3" fill="none"/><path d="M750 118 C650 160 500 200 430 250 C440 320 560 370 700 392" stroke="#2b6cb0" stroke-width="3" fill="none"/><line x1="100" y1="400" x2="800" y2="400" stroke="#7a1f1f" stroke-width="1.3" stroke-dasharray="5 4"/><text x="806" y="404" font-size="10.5" text-anchor="start" fill="#7a1f1f" font-weight="bold"><tspan x="806" dy="0.0">Ms</tspan></text><line x1="100" y1="430" x2="800" y2="430" stroke="#7a1f1f" stroke-width="1.3" stroke-dasharray="5 4"/><text x="806" y="434" font-size="10.5" text-anchor="start" fill="#7a1f1f" font-weight="bold"><tspan x="806" dy="0.0">M50</tspan></text><line x1="100" y1="455" x2="800" y2="455" stroke="#7a1f1f" stroke-width="1.3" stroke-dasharray="5 4"/><text x="806" y="459" font-size="10.5" text-anchor="start" fill="#7a1f1f" font-weight="bold"><tspan x="806" dy="0.0">M90</tspan></text><path d="M110 70 L 165 335 L 640 335 L 700 480" stroke="#00695c" stroke-width="3.5" fill="none"/><text x="150" y="318" font-size="11" text-anchor="start" fill="#00695c" font-weight="bold"><tspan x="150" dy="0.0">rapid transfer</tspan></text><text x="400" y="325" font-size="11" text-anchor="middle" fill="#00695c" font-weight="bold"><tspan x="400" dy="0.0">isothermal hold in salt bath (bainite range 400–800 °F)</tspan></text><text x="700" y="500" font-size="11" text-anchor="middle" fill="#00695c"><tspan x="700" dy="0.0">cool to room T</tspan></text><text x="110" y="62" font-size="11" text-anchor="start" fill="#555"><tspan x="110" dy="0.0">① austenitize</tspan></text><path d="M110 70 L 145 480" stroke="#1a237e" stroke-width="2.5" fill="none" stroke-dasharray="8 4"/><text x="170" y="470" font-size="10.5" text-anchor="start" fill="#1a237e"><tspan x="170" dy="0.0">hardening quench → martensite</tspan></text><path d="M145 480 L 145 300 L 250 300" stroke="#1a237e" stroke-width="2.5" fill="none" stroke-dasharray="3 3" marker-end="url(#ar)"/><text x="255" y="304" font-size="10.5" text-anchor="start" fill="#1a237e"><tspan x="255" dy="0.0">then reheat (temper)</tspan></text><rect x="830" y="120" width="190" height="120" rx="8" fill="#d9f2e6" stroke="#1a3c6e" stroke-width="1.6"/><text x="925.0" y="162.4625" font-size="11.5" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="925.0" dy="0.0">AUSTEMPERING</tspan><tspan x="925.0" dy="14.4">austenite → bainite</tspan><tspan x="925.0" dy="14.4">directly; no separate</tspan><tspan x="925.0" dy="14.4">tempering step</tspan></text><rect x="830" y="260" width="190" height="120" rx="8" fill="#e8eaf6" stroke="#1a3c6e" stroke-width="1.6"/><text x="925.0" y="302.4625" font-size="11.5" text-anchor="middle" fill="#111"><tspan x="925.0" dy="0.0">Hardening + tempering</tspan><tspan x="925.0" dy="14.4">austenite → martensite</tspan><tspan x="925.0" dy="14.4">→ reheat → tempered</tspan><tspan x="925.0" dy="14.4">martensite</tspan></text><rect x="30" y="545" width="980" height="80" rx="6" fill="#fff3b0" stroke="#1a3c6e" stroke-width="1.6"/><text x="520.0" y="581.7" font-size="12" text-anchor="middle" fill="#111"><tspan x="520.0" dy="0.0">Limitation: mass/size – the part must cool to the bath temperature fast enough to miss the pearlite nose; lecture: parts less than ≈ 0.5 in. thick.</tspan><tspan x="520.0" dy="15.0">Steps: austenitize → rapid transfer to salt bath → hold until transformation is complete (100 % bainite) → cool. A complete heat treatment.</tspan></text></svg>