<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="920" height="340" role="img" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Electrophilic addition of HBr to ethene</title><desc>Two-step mechanism: the pi bond attacks the hydrogen of HBr to give an ethyl carbocation and bromide, then bromide attacks the carbocation to give bromoethane.</desc><defs><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c0392b"/></marker><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#24292f"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0969da"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1a7f37"/></marker><marker id="mgy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#57606a"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#bc4c00"/></marker></defs><rect width="920" height="340" fill="#ffffff"/><text x="30.0" y="36.0" font-size="16" text-anchor="start" fill="#57606a" font-weight="bold" xml:space="preserve"><tspan>Step 1 (slow, rate-determining): the π electrons of C=C attack the δ+ hydrogen of H–Br</tspan></text><text x="60.0" y="126.4" font-size="24" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="24.0">H</tspan><tspan dy="7.2" font-size="16.8">2</tspan><tspan dy="-7.2" font-size="24.0">C</tspan></text><line x1="107.0" y1="121.6" x2="135.0" y2="121.6" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><line x1="107.0" y1="114.4" x2="135.0" y2="114.4" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="138.0" y="126.4" font-size="24" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="24.0">CH</tspan><tspan dy="7.2" font-size="16.8">2</tspan></text><text x="217.9" y="126.0" font-size="26" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>+</tspan></text><text x="247.9" y="126.4" font-size="24" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>H</tspan></text><line x1="268.2" y1="118.0" x2="296.2" y2="118.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="299.2" y="126.4" font-size="24" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>Br</tspan></text><text x="262.6" y="84.0" font-size="14" text-anchor="middle" fill="#c0392b" font-weight="bold" xml:space="preserve"><tspan>δ+</tspan></text><text x="311.5" y="84.0" font-size="14" text-anchor="middle" fill="#c0392b" font-weight="bold" xml:space="preserve"><tspan>δ−</tspan></text><path d="M121.0,112.0 Q198.8,28.0 247.6,103.0" fill="none" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round" marker-end="url(#mr)"/><path d="M282.2,113.0 Q290.2,74.0 308.5,101.0" fill="none" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round" marker-end="url(#mr)"/><line x1="373.7" y1="118.0" x2="463.7" y2="118.0" stroke="#24292f" stroke-width="2.8" stroke-linecap="round" marker-end="url(#mk)"/><text x="418.7" y="106.0" font-size="15" text-anchor="middle" fill="#c0392b" font-weight="bold" xml:space="preserve"><tspan>slow</tspan></text><text x="418.7" y="141.0" font-size="15" text-anchor="middle" fill="#c0392b" font-weight="normal" xml:space="preserve"><tspan>(rds)</tspan></text><text x="498.7" y="126.4" font-size="24" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="24.0">H</tspan><tspan dy="7.2" font-size="16.8">3</tspan><tspan dy="-7.2" font-size="24.0">C</tspan></text><line x1="545.7" y1="118.0" x2="573.7" y2="118.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="576.7" y="126.4" font-size="24" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="24.0">CH</tspan><tspan dy="7.2" font-size="16.8">2</tspan><tspan dy="-18.0" font-size="16.8">+</tspan></text><text x="662.4" y="126.0" font-size="26" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>+</tspan></text><text x="710.4" y="126.0" font-size="24" text-anchor="middle" fill="#0969da" font-weight="normal" xml:space="preserve"><tspan font-size="24.0">Br</tspan><tspan dy="-10.8" font-size="16.8">−</tspan></text><circle cx="686.4" cy="112.8" r="2" fill="#0969da"/><circle cx="686.4" cy="119.2" r="2" fill="#0969da"/><text x="558.7" y="168.0" font-size="14" text-anchor="start" fill="#57606a" font-weight="normal" xml:space="preserve"><tspan>ethyl carbocation (intermediate)</tspan></text><text x="30.0" y="200.0" font-size="16" text-anchor="start" fill="#57606a" font-weight="bold" xml:space="preserve"><tspan>Step 2 (fast): bromide ion attacks the carbocation</tspan></text><text x="60.0" y="280.4" font-size="24" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="24.0">H</tspan><tspan dy="7.2" font-size="16.8">3</tspan><tspan dy="-7.2" font-size="24.0">C</tspan></text><line x1="107.0" y1="272.0" x2="135.0" y2="272.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="138.0" y="280.4" font-size="24" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="24.0">CH</tspan><tspan dy="7.2" font-size="16.8">2</tspan><tspan dy="-18.0" font-size="16.8">+</tspan></text><text x="281.7" y="280.0" font-size="24" text-anchor="middle" fill="#0969da" font-weight="normal" xml:space="preserve"><tspan>Br</tspan></text><circle cx="259.7" cy="269.8" r="2" fill="#0969da"/><circle cx="259.7" cy="276.2" r="2" fill="#0969da"/><text x="301.7" y="264.0" font-size="18" text-anchor="middle" fill="#0969da" font-weight="normal" xml:space="preserve"><tspan>−</tspan></text><text x="233.7" y="280.0" font-size="26" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>+</tspan></text><path d="M259.7,262.0 Q226.7,210.0 193.7,258.0" fill="none" stroke="#0969da" stroke-width="2.2" stroke-linecap="round" marker-end="url(#mb)"/><line x1="351.7" y1="272.0" x2="441.7" y2="272.0" stroke="#24292f" stroke-width="2.8" stroke-linecap="round" marker-end="url(#mk)"/><text x="396.7" y="260.0" font-size="15" text-anchor="middle" fill="#0969da" font-weight="bold" xml:space="preserve"><tspan>fast</tspan></text><text x="476.7" y="280.4" font-size="24" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="24.0">H</tspan><tspan dy="7.2" font-size="16.8">3</tspan><tspan dy="-7.2" font-size="24.0">C</tspan></text><line x1="523.6" y1="272.0" x2="551.6" y2="272.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="554.6" y="280.4" font-size="24" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="24.0">CH</tspan><tspan dy="7.2" font-size="16.8">2</tspan></text><line x1="601.6" y1="272.0" x2="629.6" y2="272.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="632.6" y="280.4" font-size="24" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>Br</tspan></text><text x="566.7" y="322.0" font-size="14" text-anchor="middle" fill="#57606a" font-weight="normal" xml:space="preserve"><tspan>bromoethane (product)</tspan></text></svg>