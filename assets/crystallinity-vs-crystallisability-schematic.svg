<svg viewBox="0 0 620 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="620" height="260" fill="#ffffff"/>
<text x="310" y="24" text-anchor="middle" font-size="16" font-weight="bold">Degree of Crystallinity vs Crystallisability</text>

<rect x="30" y="55" width="260" height="150" fill="#eef5ff" stroke="#1f5fa8" stroke-width="2"/>
<g stroke="#a83232" stroke-width="2" fill="none">
<path d="M40,80 L40,100 L120,100 L120,80"/>
<path d="M40,105 L40,125 L120,125 L120,105"/>
</g>
<path d="M150,90 C170,70 165,140 190,120 C210,100 200,170 230,150 C250,130 260,90 280,110" stroke="#1f5fa8" stroke-width="2" fill="none"/>
<text x="160" y="200" text-anchor="middle" font-size="12" font-weight="bold">Degree of crystallinity</text>
<text x="160" y="45" text-anchor="middle" font-size="11">= % of sample actually in ordered (crystalline) regions</text>

<rect x="330" y="55" width="260" height="150" fill="#fff7e0" stroke="#a87c00" stroke-width="2"/>
<text x="460" y="100" text-anchor="middle" font-size="30">&#8734;</text>
<text x="460" y="140" text-anchor="middle" font-size="12">Regular, symmetric chain</text>
<text x="460" y="156" text-anchor="middle" font-size="12">(e.g. isotactic PP) &#8594; HIGH</text>
<text x="460" y="172" text-anchor="middle" font-size="12">crystallisability</text>
<text x="460" y="200" text-anchor="middle" font-size="12" font-weight="bold">Crystallisability</text>
<text x="460" y="45" text-anchor="middle" font-size="11">= inherent tendency/ability of a chain to crystallise (structural property)</text>
</svg>
