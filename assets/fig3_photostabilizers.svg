<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="480" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Fig. 3 — Structures of Four Photostabilizers</text>

  <!-- 1. HALS: Tinuvin 770 -->
  <g transform="translate(20,50)">
    <rect x="0" y="0" width="420" height="190" fill="#f6f8fa" stroke="#ccc" rx="6"/>
    <text x="210" y="20" text-anchor="middle" font-size="13" font-weight="bold">1. HALS — bis(2,2,6,6-tetramethyl-4-piperidyl) sebacate (Tinuvin&#174; 770)</text>
    <!-- piperidine ring left -->
    <polygon points="70,60 100,45 130,60 130,90 100,105 70,90" fill="none" stroke="#222" stroke-width="2"/>
    <text x="100" y="40" text-anchor="middle" font-size="12">NH</text>
    <text x="55" y="75" font-size="11">Me Me</text>
    <text x="55" y="100" font-size="11">Me Me</text>
    <line x1="100" y1="105" x2="100" y2="125" stroke="#222" stroke-width="2"/>
    <text x="100" y="140" text-anchor="middle" font-size="12">O&#8211;C(=O)&#8211;</text>
    <line x1="130" y1="140" x2="230" y2="140" stroke="#222" stroke-width="2"/>
    <text x="180" y="160" text-anchor="middle" font-size="11">&#8211;(CH&#8322;)&#8328;&#8211;</text>
    <text x="270" y="140" text-anchor="middle" font-size="12">(=O)C&#8211;O</text>
    <line x1="270" y1="125" x2="270" y2="105" stroke="#222" stroke-width="2"/>
    <!-- piperidine ring right -->
    <polygon points="270,60 300,45 330,60 330,90 300,105 270,90" fill="none" stroke="#222" stroke-width="2"/>
    <text x="300" y="40" text-anchor="middle" font-size="12">NH</text>
    <text x="335" y="75" font-size="11">Me Me</text>
    <text x="335" y="100" font-size="11">Me Me</text>
    <text x="210" y="178" text-anchor="middle" font-size="11" fill="#555">Radical (NO&#8226;) scavenger — quenches alkyl/peroxy radicals</text>
  </g>

  <!-- 2. Benzophenone type -->
  <g transform="translate(460,50)">
    <rect x="0" y="0" width="420" height="190" fill="#f6f8fa" stroke="#ccc" rx="6"/>
    <text x="210" y="20" text-anchor="middle" font-size="13" font-weight="bold">2. Benzophenone — 2-Hydroxy-4-methoxybenzophenone (UV-9)</text>
    <polygon points="80,60 105,48 130,60 130,86 105,98 80,86" fill="none" stroke="#222" stroke-width="2"/>
    <text x="60" y="52" font-size="11">HO</text>
    <line x1="80" y1="60" x2="60" y2="55" stroke="#222" stroke-width="2"/>
    <text x="90" y="112" font-size="11">OMe</text>
    <line x1="105" y1="98" x2="95" y2="108" stroke="#222" stroke-width="2"/>
    <line x1="130" y1="73" x2="165" y2="73" stroke="#222" stroke-width="2"/>
    <text x="150" y="65" font-size="12">C=O</text>
    <line x1="165" y1="73" x2="195" y2="60" stroke="#222" stroke-width="2"/>
    <polygon points="195,60 220,48 245,60 245,86 220,98 195,86" fill="none" stroke="#222" stroke-width="2"/>
    <text x="210" y="150" text-anchor="middle" font-size="11" fill="#555">Absorbs UV (300&#8211;400 nm), dissipates as heat via H-bonded tautomer</text>
  </g>

  <!-- 3. Benzotriazole type -->
  <g transform="translate(20,265)">
    <rect x="0" y="0" width="420" height="190" fill="#f6f8fa" stroke="#ccc" rx="6"/>
    <text x="210" y="20" text-anchor="middle" font-size="13" font-weight="bold">3. Benzotriazole — 2-(2H-benzotriazol-2-yl)-4,6-di-tert-pentylphenol (Tinuvin&#174; 328)</text>
    <polygon points="80,60 105,48 130,60 130,86 105,98 80,86" fill="none" stroke="#222" stroke-width="2"/>
    <text x="55" y="52" font-size="11">HO</text>
    <line x1="80" y1="60" x2="62" y2="55" stroke="#222" stroke-width="2"/>
    <line x1="130" y1="73" x2="160" y2="73" stroke="#222" stroke-width="2"/>
    <!-- triazole ring -->
    <polygon points="160,73 178,55 200,63 200,90 178,98" fill="none" stroke="#222" stroke-width="2"/>
    <text x="185" y="55" font-size="10">N</text>
    <text x="205" y="75" font-size="10">N</text>
    <text x="185" y="112" font-size="10">N</text>
    <line x1="200" y1="63" x2="230" y2="55" stroke="#222" stroke-width="2"/>
    <polygon points="230,55 255,45 280,55 280,80 255,90 230,80" fill="none" stroke="#222" stroke-width="2"/>
    <text x="60" y="112" font-size="11">tert-pentyl</text>
    <text x="140" y="112" font-size="11">tert-pentyl</text>
    <text x="210" y="150" text-anchor="middle" font-size="11" fill="#555">UV absorber — intramolecular H-bond, energy dissipation as heat</text>
  </g>

  <!-- 4. Nickel quencher -->
  <g transform="translate(460,265)">
    <rect x="0" y="0" width="420" height="190" fill="#f6f8fa" stroke="#ccc" rx="6"/>
    <text x="210" y="20" text-anchor="middle" font-size="13" font-weight="bold">4. Nickel Quencher — Nickel dibutyldithiocarbamate</text>
    <text x="180" y="80" font-size="14" text-anchor="middle">Bu&#8322;N&#8211;C(=S)&#8211;S</text>
    <text x="210" y="105" text-anchor="middle" font-size="16" font-weight="bold">Ni</text>
    <text x="240" y="80" font-size="14" text-anchor="middle">S&#8211;C(=S)&#8211;NBu&#8322;</text>
    <line x1="190" y1="85" x2="205" y2="100" stroke="#222" stroke-width="2"/>
    <line x1="230" y1="85" x2="215" y2="100" stroke="#222" stroke-width="2"/>
    <text x="210" y="150" text-anchor="middle" font-size="11" fill="#555">Excited-state quencher — deactivates carbonyl triplet states</text>
  </g>
</svg>
