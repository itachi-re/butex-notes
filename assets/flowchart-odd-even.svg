<svg xmlns="http://www.w3.org/2000/svg" width="500" height="410" viewBox="0 0 500 410" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Flowchart to decide whether an integer is odd or even" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Flowchart to decide whether an integer is odd or even</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker></defs>
<rect x="0.5" y="0.5" width="499" height="409" fill="#ffffff" stroke="#cfd8dc" rx="8"/>
<rect x="190.0" y="12.0" width="120" height="36" rx="18.0" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/><text x="250" y="34.55" font-size="13" text-anchor="middle" font-weight="bold" fill="#1a1a1a" ><tspan x="250" dy="0">Start</tspan></text><polyline points="250,48 250,75" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><polygon points="174.0,75.0 340.0,75.0 326.0,115.0 160.0,115.0" fill="#ffe0b2" stroke="#ef6c00" stroke-width="1.5"/><text x="250" y="99.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="250" dy="0">Read n</tspan></text><polyline points="250,115 250,147" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><polygon points="250,147.0 340.0,185 250,223.0 160.0,185" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/><text x="250" y="189.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="250" dy="0">n % 2 == 0 ?</tspan></text><polyline points="160,185 100,185 100,255" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><text x="128" y="180.2" font-size="12" text-anchor="middle" font-weight="bold" fill="#b71c1c" ><tspan x="128" dy="0">Yes</tspan></text><rect x="30.0" y="255.0" width="140" height="40" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/><text x="100" y="279.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="100" dy="0">Print EVEN</tspan></text><polyline points="340,185 400,185 400,255" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><text x="372" y="180.2" font-size="12" text-anchor="middle" font-weight="bold" fill="#b71c1c" ><tspan x="372" dy="0">No</tspan></text><rect x="330.0" y="255.0" width="140" height="40" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/><text x="400" y="279.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="400" dy="0">Print ODD</tspan></text><polyline points="100,295 100,365 190,365" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><polyline points="400,295 400,365 310,365" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><rect x="190.0" y="347.0" width="120" height="36" rx="18.0" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/><text x="250" y="369.55" font-size="13" text-anchor="middle" font-weight="bold" fill="#1a1a1a" ><tspan x="250" dy="0">End</tspan></text>
</svg>