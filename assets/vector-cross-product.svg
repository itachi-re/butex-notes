<svg viewBox="0 0 480 340" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="480" height="340" fill="white"/>

  <!-- Origin -->
  <circle cx="90" cy="270" r="2.5" fill="#1a1a1a"/>
  <text x="76" y="290" font-size="16">O</text>

  <!-- a vector -->
  <line x1="90" y1="270" x2="330" y2="270" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="336" y="276" font-size="18" font-style="italic">a</text>

  <!-- b vector -->
  <line x1="90" y1="270" x2="200" y2="90" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="180" y="80" font-size="18" font-style="italic">b</text>

  <!-- parallelogram -->
  <polygon points="90,270 330,270 440,90 200,90" fill="#f2d9d6" fill-opacity="0.6" stroke="#b3261e" stroke-width="1.5"/>
  <line x1="330" y1="270" x2="440" y2="90" stroke="#1a1a1a" stroke-width="1.3" stroke-dasharray="4,4"/>
  <line x1="200" y1="90" x2="440" y2="90" stroke="#1a1a1a" stroke-width="1.3" stroke-dasharray="4,4"/>

  <text x="240" y="200" font-size="14" text-anchor="middle" fill="#b3261e">Area = |a × b| = |a||b| sin&#952;</text>

  <!-- normal vector n -->
  <line x1="230" y1="180" x2="230" y2="60" stroke="#1a5fb4" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="238" y="60" font-size="16" fill="#1a5fb4">n&#770; (normal, right-hand rule)</text>

  <!-- angle -->
  <path d="M 150 270 A 60 60 0 0 0 143 217" fill="none" stroke="#1a1a1a" stroke-width="1.3"/>
  <text x="150" y="245" font-size="15" font-style="italic">&#952;</text>
</svg>
