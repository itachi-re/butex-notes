<svg viewBox="0 0 600 220" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
  <style>.lbl{font-size:13px;fill:#111827;}</style>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#111827"/></marker></defs>
  <text x="30" y="20" class="lbl" font-weight="bold">Magnet approaching (N pole)</text>
  <rect x="30" y="60" width="60" height="30" fill="#dc2626"/><text x="45" y="80" class="lbl" fill="white">N</text>
  <rect x="90" y="60" width="60" height="30" fill="#2563eb"/><text x="105" y="80" class="lbl" fill="white">S</text>
  <line x1="150" y1="75" x2="200" y2="75" stroke="#111827" stroke-width="2" marker-end="url(#a)"/>
  <ellipse cx="260" cy="75" rx="20" ry="45" fill="none" stroke="#059669" stroke-width="3"/>
  <text x="220" y="140" class="lbl">Induced N faces magnet -> repels</text>

  <text x="330" y="20" class="lbl" font-weight="bold">Magnet receding (N pole)</text>
  <ellipse cx="410" cy="75" rx="20" ry="45" fill="none" stroke="#059669" stroke-width="3"/>
  <line x1="440" y1="75" x2="480" y2="75" stroke="#111827" stroke-width="2" marker-end="url(#a)"/>
  <rect x="490" y="60" width="60" height="30" fill="#dc2626"/><text x="505" y="80" class="lbl" fill="white">N</text>
  <rect x="550" y="60" width="30" height="30" fill="#2563eb"/>
  <text x="360" y="140" class="lbl">Induced S faces magnet -> attracts</text>
</svg>
