<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" font-family="Georgia, serif" font-size="15" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="420" height="520" fill="#fff"/>
<text x="20" y="28" font-size="18" font-weight="bold">D-glucose — Fischer projection</text>
<g transform="translate(160,50)" text-anchor="middle">
<text x="0" y="0">CHO</text>
<text x="0" y="10" font-size="12" fill="#888">C1 (aldehyde)</text>
<line x1="0" y1="15" x2="0" y2="45" stroke="black"/>
<line x1="-30" y1="55" x2="30" y2="55" stroke="black"/>
<text x="-45" y="59" text-anchor="end">H</text>
<text x="45" y="59" text-anchor="start">OH</text>
<text x="0" y="59">C2*</text>
<line x1="0" y1="65" x2="0" y2="95" stroke="black"/>
<line x1="-30" y1="105" x2="30" y2="105" stroke="black"/>
<text x="-45" y="109" text-anchor="end">HO</text>
<text x="45" y="109" text-anchor="start">H</text>
<text x="0" y="109">C3*</text>
<line x1="0" y1="115" x2="0" y2="145" stroke="black"/>
<line x1="-30" y1="155" x2="30" y2="155" stroke="black"/>
<text x="-45" y="159" text-anchor="end">H</text>
<text x="45" y="159" text-anchor="start">OH</text>
<text x="0" y="159">C4*</text>
<line x1="0" y1="165" x2="0" y2="195" stroke="black"/>
<line x1="-30" y1="205" x2="30" y2="205" stroke="black"/>
<text x="-45" y="209" text-anchor="end">H</text>
<text x="45" y="209" text-anchor="start">OH</text>
<text x="0" y="209">C5*</text>
<line x1="0" y1="215" x2="0" y2="245" stroke="black"/>
<text x="0" y="260">CH2OH</text>
<text x="0" y="272" font-size="12" fill="#888">C6</text>
</g>
<text x="20" y="360" font-size="14" fill="#555">* = asymmetric (chiral / stereogenic) carbon: C2, C3, C4, C5 each bear four</text>
<text x="20" y="380" font-size="14" fill="#555">different groups, giving 2^4 = 16 possible stereoisomers (aldohexoses);</text>
<text x="20" y="400" font-size="14" fill="#555">D/L is fixed by the OH orientation on the LOWEST chiral centre (C5): OH on the</text>
<text x="20" y="420" font-size="14" fill="#555">right = D-sugar (matches D-glyceraldehyde); OH on the left = L-sugar.</text>
<text x="20" y="450" font-size="14" fill="#555">Open-chain (Fischer) form shows the free CHO — explains glucose's reducing</text>
<text x="20" y="470" font-size="14" fill="#555">-sugar reactions (Tollens', Fehling's) that the cyclic hemiacetal form masks at equilibrium.</text>
</svg>
