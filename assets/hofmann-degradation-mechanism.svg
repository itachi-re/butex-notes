<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Georgia, serif" font-size="15" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="800" height="460" fill="#fff"/>
<text x="20" y="28" font-size="20" font-weight="bold">Hofmann bromamide degradation: R–CONH2 → R–NH2 (loses one carbon)</text>

<text x="20" y="60" font-weight="bold">Step 1 — N-bromination</text>
<text x="30" y="82">R–CO–NH2  +  Br2/NaOH  →  R–CO–NHBr  (N-bromoamide) + NaBr + H2O</text>

<text x="20" y="115" font-weight="bold">Step 2 — Deprotonation and rearrangement (the key step)</text>
<text x="30" y="137">R–CO–NHBr + OH⁻ → R–CO–N⁻Br (anion) </text>
<text x="30" y="159">→ concerted 1,2-shift: R migrates from carbonyl-C to N as Br⁻ leaves</text>
<text x="30" y="181">→ gives an isocyanate:   R–N=C=O</text>
<g transform="translate(60,190)">
<text x="0" y="30" font-size="16">R</text>
<line x1="18" y1="24" x2="45" y2="24" stroke="black" stroke-width="1.5" marker-end="url(#ar)"/>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z"/></marker></defs>
<text x="50" y="30" font-size="16">migrates to electron-deficient N (nitrene-like), concerted with Br⁻ loss</text>
</g>

<text x="20" y="260" font-weight="bold">Step 3 — Hydrolysis of the isocyanate</text>
<text x="30" y="282">R–N=C=O  +  H2O  →  R–NH–COOH (unstable carbamic acid)</text>
<text x="30" y="304">R–NH–COOH  →  R–NH2  +  CO2 ↑</text>

<text x="20" y="345" font-weight="bold">Key features</text>
<text x="30" y="368" font-size="14" fill="#555">• Product amine has ONE fewer carbon than the starting amide (R–CONH2 → R–NH2).</text>
<text x="30" y="390" font-size="14" fill="#555">• The migrating group R retains its configuration — the rearrangement is stereospecific</text>
<text x="30" y="412" font-size="14" fill="#555">  and proceeds with retention (R never exists as a free carbocation/radical).</text>
<text x="30" y="434" font-size="14" fill="#555">• Works for 1° amides only; used to step down a homologous series or make anilines from amides.</text>
</svg>
