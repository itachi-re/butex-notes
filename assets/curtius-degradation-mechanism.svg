<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="Georgia, serif" font-size="15" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="800" height="440" fill="#fff"/>
<text x="20" y="28" font-size="20" font-weight="bold">Curtius degradation: acyl azide → isocyanate → amine (loses one carbon)</text>

<text x="20" y="58" font-weight="bold">Step 1 — Form the acyl azide</text>
<text x="30" y="80">R–COCl  +  NaN3  →  R–CO–N3  (acyl azide)  +  NaCl</text>
<text x="30" y="100" font-size="14" fill="#555">(or from R–CO–NHNH2, hydrazide, treated with HNO2)</text>

<text x="20" y="135" font-weight="bold">Step 2 — Thermal decomposition (Curtius rearrangement)</text>
<text x="30" y="157">R–CO–N3   --Δ (heat)-->   R–N=C=O   +   N2 ↑</text>
<text x="30" y="179" font-size="14" fill="#555">Concerted step: R migrates from C to the adjacent N as N2 leaves — directly analogous</text>
<text x="30" y="199" font-size="14" fill="#555">to the Hofmann rearrangement's key migration, but no bromide/base needed; driven by</text>
<text x="30" y="219" font-size="14" fill="#555">loss of very stable N2 gas. Proceeds through a nitrene-free, concerted transition state.</text>

<text x="20" y="255" font-weight="bold">Step 3 — Trap the isocyanate</text>
<text x="30" y="277">R–N=C=O  +  H2O  →  [R–NH–COOH]  →  R–NH2  +  CO2 ↑  (aqueous work-up)</text>
<text x="30" y="297">R–N=C=O  +  R'OH →  R–NH–COOR'  (carbamate, if trapped with an alcohol instead)</text>

<text x="20" y="335" font-weight="bold">Curtius vs Hofmann — quick comparison</text>
<text x="30" y="358" font-size="14" fill="#555">• Both convert R–CO– (acyl) to R–NH2 with loss of one carbon, via an isocyanate intermediate.</text>
<text x="30" y="380" font-size="14" fill="#555">• Hofmann starts from a primary amide + Br2/NaOH; Curtius starts from an acyl azide + heat.</text>
<text x="30" y="402" font-size="14" fill="#555">• Curtius can be trapped with alcohols to isolate a stable carbamate (useful in peptide N-protection).</text>
<text x="30" y="424" font-size="14" fill="#555">• Both proceed with retention of configuration at the migrating carbon R.</text>
</svg>
