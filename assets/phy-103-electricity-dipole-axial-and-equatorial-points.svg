<text x="366.0" y="152.0" fill="#1b1b1b" font-size="16" text-anchor="middle">r</text>
<g fill="#1b1b1b"><text xml:space="preserve" x="318.0" y="366.0" font-size="15" text-anchor="start">axial: V = p/(4πε</text><text xml:space="preserve" x="442.9" y="369.9" font-size="14" text-anchor="start">0</text><text xml:space="preserve" x="451.8" y="366.0" font-size="15" text-anchor="start">r</text><text xml:space="preserve" x="458.0" y="360.3" font-size="14" text-anchor="start">2</text><text xml:space="preserve" x="466.9" y="366.0" font-size="15" text-anchor="start">),  E</text><text xml:space="preserve" x="496.5" y="369.9" font-size="14" text-anchor="start">ax</text><text xml:space="preserve" x="513.4" y="366.0" font-size="15" text-anchor="start"> = 2p/(4πε</text><text xml:space="preserve" x="592.1" y="369.9" font-size="14" text-anchor="start">0</text><text xml:space="preserve" x="601.0" y="366.0" font-size="15" text-anchor="start">r</text><text xml:space="preserve" x="607.2" y="360.3" font-size="14" text-anchor="start">3</text><text xml:space="preserve" x="616.1" y="366.0" font-size="15" text-anchor="start">)</text></g>
<g fill="#1b1b1b"><text xml:space="preserve" x="335.9" y="392.0" font-size="15" text-anchor="start">equatorial: V = 0,  E</text><text xml:space="preserve" x="487.6" y="395.9" font-size="14" text-anchor="start">eq</text><text xml:space="preserve" x="505.1" y="392.0" font-size="15" text-anchor="start"> = p/(4πε</text><text xml:space="preserve" x="574.3" y="395.9" font-size="14" text-anchor="start">0</text><text xml:space="preserve" x="583.2" y="392.0" font-size="15" text-anchor="start">r</text><text xml:space="preserve" x="589.4" y="386.3" font-size="14" text-anchor="start">3</text><text xml:space="preserve" x="598.3" y="392.0" font-size="15" text-anchor="start">)</text></g>
</svg>
