<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
    <rect width="500" height="400" fill="#ffffff"/>
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 Z" fill="#000"/>
        </marker>
        <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 Z" fill="#0072b2"/>
        </marker>
    </defs>
    <!-- Cube (perspective) -->
    <path d="M 100,100 L 250,100 L 250,250 L 100,250 Z" stroke="#333" stroke-width="2" fill="none"/>
    <path d="M 150,50 L 300,50 L 300,200 L 150,200 Z" stroke="#333" stroke-width="2" fill="none"/>
    <path d="M 100,100 L 150,50" stroke="#333" stroke-width="2"/>
    <path d="M 250,100 L 300,50" stroke="#333" stroke-width="2"/>
    <path d="M 250,250 L 300,200" stroke="#333" stroke-width="2"/>
    <path d="M 100,250 L 150,200" stroke="#333" stroke-width="2"/>
    
    <!-- Axes -->
    <path d="M 100,250 L 400,250" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 100,250 L 100,10" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 100,250 L 10,340" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
    
    <text x="390" y="270" font-family="sans-serif" font-size="16">X</text>
    <text x="80" y="20" font-family="sans-serif" font-size="16">Y</text>
    <text x="20" y="340" font-family="sans-serif" font-size="16">Z</text>
    
    <!-- Molecule -->
    <circle cx="180" cy="180" r="5" fill="#d55e00"/>
    <path d="M 180,180 L 230,160" stroke="#0072b2" stroke-width="2" marker-end="url(#arrow-blue)"/>
    
    <text x="235" y="155" font-family="sans-serif" font-size="14" fill="#0072b2">c (c_x, c_y, c_z)</text>
    <text x="205" y="270" font-family="sans-serif" font-size="16">L</text>
    <text x="60" y="180" font-family="sans-serif" font-size="16">L</text>
</svg>