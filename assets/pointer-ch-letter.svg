<svg xmlns="http://www.w3.org/2000/svg" width="700" height="285" viewBox="0 0 700 285" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Pointer ch pointing to variable letter" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Pointer ch pointing to variable letter</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker></defs>
<rect x="0.5" y="0.5" width="699" height="284" fill="#ffffff" stroke="#cfd8dc" rx="8"/>
<text x="350" y="29.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#1a1a1a" font-family="Consolas, Menlo, monospace"><tspan x="350" dy="0">char *ch, letter = 'A';   ch = &amp;letter;</tspan></text><rect x="80" y="70" width="140" height="60" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/><text x="150.0" y="95.875" font-size="15" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="150.0" dy="0">letter</tspan><tspan x="150.0" dy="18.75">'A'</tspan></text><text x="150" y="152.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#78909c" font-family="Consolas, Menlo, monospace"><tspan x="150" dy="0">address 0x1000</tspan></text><rect x="420" y="70" width="160" height="60" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/><text x="500.0" y="95.875" font-size="15" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="500.0" dy="0">ch</tspan><tspan x="500.0" dy="18.75">0x1000</tspan></text><text x="500" y="152.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#78909c" font-family="Consolas, Menlo, monospace"><tspan x="500" dy="0">address 0x2000</tspan></text><polyline points="420,100 222,100" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><text x="321" y="94.2" font-size="12" text-anchor="middle" font-weight="bold" fill="#b71c1c" ><tspan x="321" dy="0">points to</tspan></text><text x="80" y="204.9" font-size="14" text-anchor="start" font-weight="bold" fill="#1a1a1a" font-family="Consolas, Menlo, monospace"><tspan x="80" dy="0">ch</tspan></text><text x="140" y="204.9" font-size="14" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-family="Consolas, Menlo, monospace"><tspan x="140" dy="0">= 0x1000   (holds the ADDRESS of letter)</tspan></text><text x="80" y="228.9" font-size="14" text-anchor="start" font-weight="bold" fill="#1a1a1a" font-family="Consolas, Menlo, monospace"><tspan x="80" dy="0">*ch</tspan></text><text x="140" y="228.9" font-size="14" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-family="Consolas, Menlo, monospace"><tspan x="140" dy="0">= 'A'       (value stored at that address)</tspan></text><text x="80" y="252.9" font-size="14" text-anchor="start" font-weight="bold" fill="#1a1a1a" font-family="Consolas, Menlo, monospace"><tspan x="80" dy="0">&amp;ch</tspan></text><text x="140" y="252.9" font-size="14" text-anchor="start" font-weight="normal" fill="#1a1a1a" font-family="Consolas, Menlo, monospace"><tspan x="140" dy="0">= 0x2000   (address of the pointer ch itself)</tspan></text>
</svg>