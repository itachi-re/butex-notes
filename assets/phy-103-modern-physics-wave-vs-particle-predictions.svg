<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 450" width="810" height="450" role="img" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Wave theory versus photon theory predictions</title>
<desc>Table comparing wave theory predictions with experimental results for threshold frequency, maximum kinetic energy, time lag and photocurrent.</desc>
<defs><marker id="ad" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 z" fill="#222222"/></marker><marker id="ab" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 z" fill="#1f5fbf"/></marker><marker id="ar" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 z" fill="#c0392b"/></marker><marker id="ag" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 z" fill="#2e7d32"/></marker></defs>
<rect x="0" y="0" width="810" height="450" fill="#ffffff"/>
<rect x="210" y="20" width="290" height="50" fill="#1f5fbf" fill-opacity="0.15"/>
<rect x="500" y="20" width="290" height="50" fill="#1f5fbf" fill-opacity="0.15"/>
<rect x="20" y="20" width="190" height="50" fill="#1f5fbf" fill-opacity="0.15"/>
<text x="115" y="52" text-anchor="middle" font-size="17" fill="#222222" font-weight="bold"><tspan>Observation</tspan></text>
<text x="355" y="52" text-anchor="middle" font-size="17" fill="#222222" font-weight="bold"><tspan>Wave theory predicts</tspan></text>
<text x="645" y="52" text-anchor="middle" font-size="17" fill="#222222" font-weight="bold"><tspan>Experiment = photon theory</tspan></text>
<rect x="20" y="70" width="770" height="90" rx="0" fill="none" stroke="#222222" stroke-width="1.5"/>
<line x1="210.0" y1="70.0" x2="210.0" y2="160.0" stroke="#222222" stroke-width="1.5"/>
<line x1="500.0" y1="70.0" x2="500.0" y2="160.0" stroke="#222222" stroke-width="1.5"/>
<text x="115" y="122" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold"><tspan>Threshold frequency</tspan></text>
<path d="M225,95 L243,113 M243,95 L225,113" fill="none" stroke="#c0392b" stroke-width="4"/>
<text x="258" y="108" text-anchor="start" font-size="15" fill="#222222" font-weight="normal"><tspan>Any frequency should work</tspan></text>
<text x="258" y="132" text-anchor="start" font-size="15" fill="#222222" font-weight="normal"><tspan>if the light is intense enough</tspan></text>
<path d="M514,104 L521,112 L534,95" fill="none" stroke="#2e7d32" stroke-width="4"/>
<text x="548" y="108" text-anchor="start" font-size="15" fill="#222222" font-weight="normal"><tspan>No emission below ν</tspan><tspan dy="5" font-size="14">0</tspan><tspan dy="-5">,</tspan></text>
<text x="548" y="132" text-anchor="start" font-size="15" fill="#222222" font-weight="normal"><tspan>however intense (hν &lt; φ)</tspan></text>
<rect x="20" y="160" width="770" height="90" rx="0" fill="none" stroke="#222222" stroke-width="1.5"/>
<line x1="210.0" y1="160.0" x2="210.0" y2="250.0" stroke="#222222" stroke-width="1.5"/>
<line x1="500.0" y1="160.0" x2="500.0" y2="250.0" stroke="#222222" stroke-width="1.5"/>
<text x="115" y="212" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold"><tspan>Maximum KE</tspan></text>
<path d="M225,185 L243,203 M243,185 L225,203" fill="none" stroke="#c0392b" stroke-width="4"/>
<text x="258" y="198" text-anchor="start" font-size="15" fill="#222222" font-weight="normal"><tspan>Should grow with intensity</tspan></text>
<text x="258" y="222" text-anchor="start" font-size="15" fill="#222222" font-weight="normal"><tspan>(larger electric field)</tspan></text>
<path d="M514,194 L521,202 L534,185" fill="none" stroke="#2e7d32" stroke-width="4"/>
<text x="548" y="198" text-anchor="start" font-size="15" fill="#222222" font-weight="normal"><tspan>Depends on ν only:</tspan></text>
<text x="548" y="222" text-anchor="start" font-size="15" fill="#222222" font-weight="normal"><tspan>K</tspan><tspan dy="5" font-size="14">max</tspan><tspan dy="-5"> = hν − φ</tspan></text>
<rect x="20" y="250" width="770" height="90" rx="0" fill="none" stroke="#222222" stroke-width="1.5"/>
<line x1="210.0" y1="250.0" x2="210.0" y2="340.0" stroke="#222222" stroke-width="1.5"/>
<line x1="500.0" y1="250.0" x2="500.0" y2="340.0" stroke="#222222" stroke-width="1.5"/>
<text x="115" y="302" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold"><tspan>Time lag</tspan></text>
<path d="M225,275 L243,293 M243,275 L225,293" fill="none" stroke="#c0392b" stroke-width="4"/>
<text x="258" y="288" text-anchor="start" font-size="15" fill="#222222" font-weight="normal"><tspan>Energy must build up:</tspan></text>
<text x="258" y="312" text-anchor="start" font-size="15" fill="#222222" font-weight="normal"><tspan>delay of seconds to minutes</tspan></text>
<path d="M514,284 L521,292 L534,275" fill="none" stroke="#2e7d32" stroke-width="4"/>
<text x="548" y="288" text-anchor="start" font-size="15" fill="#222222" font-weight="normal"><tspan>Emission is instantaneous</tspan></text>
<text x="548" y="312" text-anchor="start" font-size="15" fill="#222222" font-weight="normal"><tspan>(&lt; 10</tspan><tspan dy="-6" font-size="14">−9</tspan><tspan dy="6"> s): one photon</tspan></text>
<rect x="20" y="340" width="770" height="90" rx="0" fill="none" stroke="#222222" stroke-width="1.5"/>
<line x1="210.0" y1="340.0" x2="210.0" y2="430.0" stroke="#222222" stroke-width="1.5"/>
<line x1="500.0" y1="340.0" x2="500.0" y2="430.0" stroke="#222222" stroke-width="1.5"/>
<text x="115" y="392" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold"><tspan>Photocurrent</tspan></text>
<path d="M224,374 L231,382 L244,365" fill="none" stroke="#2e7d32" stroke-width="4"/>
<text x="258" y="378" text-anchor="start" font-size="15" fill="#222222" font-weight="normal"><tspan>Proportional to intensity</tspan></text>
<text x="258" y="402" text-anchor="start" font-size="15" fill="#222222" font-weight="normal"><tspan>(more energy per second)</tspan></text>
<path d="M514,374 L521,382 L534,365" fill="none" stroke="#2e7d32" stroke-width="4"/>
<text x="548" y="378" text-anchor="start" font-size="15" fill="#222222" font-weight="normal"><tspan>Proportional to intensity:</tspan></text>
<text x="548" y="402" text-anchor="start" font-size="15" fill="#222222" font-weight="normal"><tspan>more photons/s, more electrons</tspan></text>
</svg>
