<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
<title>Lobry de Bruyn-van Ekenstein rearrangement: glucose to fructose</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker><marker id="arrowAccent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a13a2e"/></marker><marker id="arrowAccent2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5a8a"/></marker><marker id="halfArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,2 L10,5 L0,8 z" fill="#1a1a1a"/></marker></defs>
<rect x="0" y="0" width="900" height="400" fill="white"/>
<text x="450.0" y="26.0" font-family="DejaVu Sans" font-size="19" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">Lobry de Bruyn–van Ekenstein Rearrangement</text>
<text x="450.0" y="44.0" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" font-style="normal" fill="#666666" text-anchor="middle">base-catalysed interconversion via a 1,2-enediol</text>
<text x="130.0" y="110.0" font-family="DejaVu Sans" font-size="14" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">CHO</text>
<line x1="130.0" y1="117.0" x2="130.0" y2="144.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
<text x="130.0" y="165.0" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">H–C–OH</text>
<line x1="130.0" y1="172.0" x2="130.0" y2="190.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
<text x="130.0" y="208.0" font-family="DejaVu Sans" font-size="11.5" font-weight="normal" font-style="normal" fill="#666666" text-anchor="middle">(CHOH)₃CH₂OH</text>
<text x="130.0" y="300.0" font-family="DejaVu Sans" font-size="13.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">D-Glucose</text>
<text x="130.0" y="318.0" font-family="DejaVu Sans" font-size="11" font-weight="normal" font-style="normal" fill="#666666" text-anchor="middle">(aldose, C1 = CHO)</text>
<line x1="230" y1="170" x2="330" y2="170" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#halfArrow)"/>
<line x1="330" y1="192" x2="230" y2="192" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#halfArrow)"/>
<text x="280.0" y="158.0" font-family="DejaVu Sans" font-size="11" font-weight="normal" font-style="normal" fill="#666666" text-anchor="middle">OH⁻, –H⁺</text>
<text x="400.0" y="110.0" font-family="DejaVu Sans" font-size="13.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">C1(OH)=C2(OH)</text>
<line x1="400.0" y1="117.0" x2="400.0" y2="144.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
<text x="400.0" y="165.0" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">1,2-enediol</text>
<text x="400.0" y="300.0" font-family="DejaVu Sans" font-size="13.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">1,2-enediol</text>
<text x="400.0" y="318.0" font-family="DejaVu Sans" font-size="11" font-weight="normal" font-style="normal" fill="#666666" text-anchor="middle">intermediate</text>
<line x1="470" y1="170" x2="570" y2="170" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#halfArrow)"/>
<line x1="570" y1="192" x2="470" y2="192" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#halfArrow)"/>
<text x="520.0" y="158.0" font-family="DejaVu Sans" font-size="11" font-weight="normal" font-style="normal" fill="#666666" text-anchor="middle">+H⁺, OH⁻</text>
<text x="660.0" y="110.0" font-family="DejaVu Sans" font-size="14" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">CH₂OH</text>
<line x1="660.0" y1="117.0" x2="660.0" y2="144.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
<text x="660.0" y="165.0" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">C=O</text>
<line x1="660.0" y1="172.0" x2="660.0" y2="190.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
<text x="660.0" y="208.0" font-family="DejaVu Sans" font-size="11.5" font-weight="normal" font-style="normal" fill="#666666" text-anchor="middle">(CHOH)₃CH₂OH</text>
<text x="660.0" y="300.0" font-family="DejaVu Sans" font-size="13.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">D-Fructose</text>
<text x="660.0" y="318.0" font-family="DejaVu Sans" font-size="11" font-weight="normal" font-style="normal" fill="#666666" text-anchor="middle">(ketose, C2 = C=O)</text>
<line x1="400" y1="200" x2="400" y2="255" stroke="#1a1a1a" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<text x="400.0" y="273.0" font-family="DejaVu Sans" font-size="11" font-weight="normal" font-style="normal" fill="#666666" text-anchor="middle">re-ketonises at C2 with the ORIGINAL</text>
<text x="400.0" y="288.0" font-family="DejaVu Sans" font-size="11" font-weight="normal" font-style="normal" fill="#666666" text-anchor="middle">configuration lost → can also give D-MANNOSE (C2 epimer of glucose)</text>
<text x="450.0" y="380.0" font-family="DejaVu Sans" font-size="11.5" font-weight="normal" font-style="italic" fill="#666666" text-anchor="middle">Only C1/C2 are involved — C3–C6 configuration is unchanged in all three sugars.</text>
</svg>
