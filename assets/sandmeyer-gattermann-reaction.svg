<svg viewBox="0 0 560 260" xmlns="http://www.w3.org/2000/svg" font-family="Arial" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<text x="280" y="20" text-anchor="middle" font-weight="bold">Sandmeyer and Gattermann Reactions (via Diazonium Salt)</text>

<polygon points="60,60 85,45 110,60 110,85 85,100 60,85" fill="none" stroke="black"/>
<text x="85" y="113" text-anchor="middle" font-size="10">ArNH₂</text>
<text x="140" y="55" font-size="11">NaNO₂ / HCl, 0–5°C</text>
<line x1="110" y1="72" x2="180" y2="72" stroke="black" marker-end="url(#a)"/>

<polygon points="200,60 225,45 250,60 250,85 225,100 200,85" fill="none" stroke="black"/>
<text x="225" y="30" text-anchor="middle" font-size="11">N₂⁺ Cl⁻</text>
<text x="225" y="113" text-anchor="middle" font-size="10">Diazonium salt</text>

<line x1="250" y1="72" x2="320" y2="72" stroke="black" marker-end="url(#a)"/>
<text x="285" y="55" text-anchor="middle" font-size="10">CuCl/HCl</text>
<text x="285" y="150" text-anchor="middle" font-size="10">or CuBr/HBr</text>

<polygon points="340,60 365,45 390,60 390,85 365,100 340,85" fill="none" stroke="black"/>
<text x="365" y="113" text-anchor="middle" font-size="10">ArCl (or ArBr)</text>
<text x="365" y="15" text-anchor="middle" font-weight="bold" font-size="12">Sandmeyer</text>

<line x1="225" y1="100" x2="225" y2="150" stroke="black" marker-end="url(#a)"/>
<text x="260" y="130" font-size="10">Cu powder / HCl</text>
<text x="260" y="145" font-size="10">(no Cu⁺ salt needed)</text>

<polygon points="200,160 225,145 250,160 250,185 225,200 200,185" fill="none" stroke="black"/>
<text x="225" y="213" text-anchor="middle" font-size="10">ArCl</text>
<text x="225" y="235" text-anchor="middle" font-weight="bold" font-size="12">Gattermann</text>

<text x="480" y="72" font-size="10">CuCN/KCN → ArCN</text>
<text x="480" y="90" font-size="10">H₃PO₂/H₂O → ArH</text>
<text x="480" y="108" font-size="10">KI → ArI (no Cu needed)</text>
</svg>
