<svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="560" height="320" fill="#ffffff"/>
<text x="280" y="24" text-anchor="middle" font-size="16" font-weight="bold">Worked Example: 6 chains@10, 4 chains@20, 2 chains@30</text>

<!-- axes -->
<line x1="60" y1="260" x2="520" y2="260" stroke="#333" stroke-width="2"/>
<line x1="60" y1="260" x2="60" y2="50" stroke="#333" stroke-width="2"/>
<text x="30" y="60" font-size="11">M</text>

<!-- bars for computed averages -->
<rect x="90" y="93" width="60" height="167" fill="#2e7d32"/>
<text x="120" y="80" text-anchor="middle" font-size="12" font-weight="bold">M&#8345;</text>
<text x="120" y="275" text-anchor="middle" font-size="12">16.67</text>

<rect x="190" y="60" width="60" height="200" fill="#a87c00"/>
<text x="220" y="47" text-anchor="middle" font-size="12" font-weight="bold">M&#7519;</text>
<text x="220" y="275" text-anchor="middle" font-size="12">20.0</text>

<rect x="290" y="60" width="60" height="200" fill="#8a6d00"/>
<text x="320" y="47" text-anchor="middle" font-size="12" font-weight="bold">M&#7515; (a=1)</text>
<text x="320" y="275" text-anchor="middle" font-size="12">20.0</text>

<rect x="390" y="32" width="60" height="228" fill="#a83232"/>
<text x="420" y="19" text-anchor="middle" font-size="12" font-weight="bold">M&#7622;</text>
<text x="420" y="275" text-anchor="middle" font-size="12">23.0</text>

<text x="20" y="300" font-size="12" fill="#555">PDI = M&#7519;/M&#8345; = 20/16.67 &#8776; 1.20 &gt; 1  &#8658;  M&#7519; &gt; M&#8345; (confirms polydispersity)</text>
</svg>
