<text x="365.5" y="209.1" text-anchor="start" font-size="12" fill="#57606a" font-weight="normal" xml:space="preserve"><tspan>(two equivalent ortho forms)</tspan></text>
<text x="742.0" y="190.1" text-anchor="start" font-size="15" fill="#1f2328" font-weight="bold" xml:space="preserve"><tspan>Para form</tspan></text>
<text x="51.7" y="254.8" text-anchor="start" font-size="14" fill="#424a53" font-weight="normal" xml:space="preserve"><tspan>Lone pair spread over the ring → less available to accept H</tspan><tspan dy="-6" font-size="10">+</tspan><tspan dy="6"> → aniline is a weaker base than methylamine</tspan></text>
<text x="173.5" y="110.4" text-anchor="start" font-size="16" fill="#0969da" font-weight="bold" xml:space="preserve"><tspan>NH</tspan><tspan dy="5" font-size="12">2</tspan></text>
