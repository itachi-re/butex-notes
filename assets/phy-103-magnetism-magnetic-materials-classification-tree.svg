<svg xmlns="http://www.w3.org/2000/svg" width="900" height="375" viewBox="0 0 900 375" font-family="Arial, Helvetica, sans-serif" font-size="16" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Classification tree of magnetic materials by susceptibility</title><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect width="900" height="375" fill="#ffffff"/><rect x="340" y="20" width="220" height="46" rx="8" stroke="#1f2937" stroke-width="2.5" fill="#1f2937" fill-opacity="0.08"/><text x="450" y="50" fill="#1f2937" font-size="19" text-anchor="middle" font-weight="bold" font-style="normal">Magnetic materials</text><path d="M450,66 L450,100 L95,100 L95,135" stroke="#1f2937" stroke-width="2" fill="none" fill-opacity="1"/><rect x="10" y="135" width="170" height="130" rx="8" stroke="#2563eb" stroke-width="2.5" fill="#2563eb" fill-opacity="0.1"/><text x="95" y="162" fill="#2563eb" font-size="16" text-anchor="middle" font-weight="bold" font-style="normal">Diamagnetic</text><text x="95" y="192" fill="#1f2937" font-size="14" text-anchor="middle" font-weight="normal" font-style="normal">χ &lt; 0 (about −10<tspan dy="-6" font-size="14">-5</tspan><tspan dy="6">​</tspan>)</text><text x="95" y="220" fill="#1f2937" font-size="14" text-anchor="middle" font-weight="normal" font-style="normal">μ<tspan dy="4" font-size="14">r</tspan><tspan dy="-4">​</tspan> slightly &lt; 1</text><text x="95" y="248" fill="#1f2937" font-size="14" text-anchor="middle" font-weight="normal" font-style="normal">Bi, Cu, Au, water</text><path d="M450,66 L450,100 L273,100 L273,135" stroke="#1f2937" stroke-width="2" fill="none" fill-opacity="1"/><rect x="188" y="135" width="170" height="130" rx="8" stroke="#059669" stroke-width="2.5" fill="#059669" fill-opacity="0.1"/><text x="273" y="162" fill="#059669" font-size="16" text-anchor="middle" font-weight="bold" font-style="normal">Paramagnetic</text><text x="273" y="192" fill="#1f2937" font-size="14" text-anchor="middle" font-weight="normal" font-style="normal">χ > 0, small</text><text x="273" y="220" fill="#1f2937" font-size="14" text-anchor="middle" font-weight="normal" font-style="normal">μ<tspan dy="4" font-size="14">r</tspan><tspan dy="-4">​</tspan> slightly > 1</text><text x="273" y="248" fill="#1f2937" font-size="14" text-anchor="middle" font-weight="normal" font-style="normal">Al, Pt, Na, O<tspan dy="4" font-size="14">2</tspan><tspan dy="-4">​</tspan></text><path d="M450,66 L450,100 L451,100 L451,135" stroke="#1f2937" stroke-width="2" fill="none" fill-opacity="1"/><rect x="366" y="135" width="170" height="130" rx="8" stroke="#dc2626" stroke-width="2.5" fill="#dc2626" fill-opacity="0.1"/><text x="451" y="162" fill="#dc2626" font-size="16" text-anchor="middle" font-weight="bold" font-style="normal">Ferromagnetic</text><text x="451" y="192" fill="#1f2937" font-size="14" text-anchor="middle" font-weight="normal" font-style="normal">χ ≫ 1 (10<tspan dy="-6" font-size="14">2</tspan><tspan dy="6">​</tspan> to 10<tspan dy="-6" font-size="14">5</tspan><tspan dy="6">​</tspan>)</text><text x="451" y="220" fill="#1f2937" font-size="14" text-anchor="middle" font-weight="normal" font-style="normal">domains; Curie point</text><text x="451" y="248" fill="#1f2937" font-size="14" text-anchor="middle" font-weight="normal" font-style="normal">Fe, Co, Ni</text><path d="M450,66 L450,100 L629,100 L629,135" stroke="#1f2937" stroke-width="2" fill="none" fill-opacity="1"/><rect x="544" y="135" width="170" height="130" rx="8" stroke="#d97706" stroke-width="2.5" fill="#d97706" fill-opacity="0.1"/><text x="629" y="162" fill="#d97706" font-size="16" text-anchor="middle" font-weight="bold" font-style="normal">Antiferromagnetic</text><text x="629" y="192" fill="#1f2937" font-size="14" text-anchor="middle" font-weight="normal" font-style="normal">χ > 0, small</text><text x="629" y="220" fill="#1f2937" font-size="14" text-anchor="middle" font-weight="normal" font-style="normal">neighbours anti-parallel</text><text x="629" y="248" fill="#1f2937" font-size="14" text-anchor="middle" font-weight="normal" font-style="normal">MnO, Cr</text><path d="M450,66 L450,100 L807,100 L807,135" stroke="#1f2937" stroke-width="2" fill="none" fill-opacity="1"/><rect x="722" y="135" width="170" height="130" rx="8" stroke="#1f2937" stroke-width="2.5" fill="#1f2937" fill-opacity="0.1"/><text x="807" y="162" fill="#1f2937" font-size="16" text-anchor="middle" font-weight="bold" font-style="normal">Ferrimagnetic</text><text x="807" y="192" fill="#1f2937" font-size="14" text-anchor="middle" font-weight="normal" font-style="normal">χ large, unequal</text><text x="807" y="220" fill="#1f2937" font-size="14" text-anchor="middle" font-weight="normal" font-style="normal">anti-parallel moments</text><text x="807" y="248" fill="#1f2937" font-size="14" text-anchor="middle" font-weight="normal" font-style="normal">Fe<tspan dy="4" font-size="14">3</tspan><tspan dy="-4">​</tspan>O<tspan dy="4" font-size="14">4</tspan><tspan dy="-4">​</tspan>, ferrites</text><text x="450" y="315" fill="#1f2937" font-size="16" text-anchor="middle" font-weight="normal" font-style="normal">Classified by the sign and size of the magnetic susceptibility χ (μ<tspan dy="4" font-size="14">r</tspan><tspan dy="-4">​</tspan> = 1 + χ)</text><text x="450" y="345" fill="#1f2937" font-size="14" text-anchor="middle" font-weight="normal" font-style="normal">Syllabus classes: diamagnetic, paramagnetic, ferromagnetic; the last two are extra</text></svg>