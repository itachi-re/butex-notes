<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Reversible adiabatic process is isentropic</title>
<desc>On the T-S diagram a reversible adiabatic process is a vertical line at constant entropy.</desc>
<defs><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="my" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#777777"/></marker></defs>
<rect x="0" y="0" width="760" height="400" fill="#ffffff"/>
<text x="220" y="36" fill="#222222" font-size="16" text-anchor="middle" font-weight="bold">P–V diagram</text>
<text x="585" y="36" fill="#222222" font-size="16" text-anchor="middle" font-weight="bold">T–S diagram</text>
<line x1="60" y1="320" x2="60" y2="60" stroke="#222222" stroke-width="2" marker-end="url(#mk)"/>
<line x1="60" y1="320" x2="380" y2="320" stroke="#222222" stroke-width="2" marker-end="url(#mk)"/>
<text x="46" y="68" fill="#222222" font-size="15" text-anchor="end" font-weight="bold">P</text>
<text x="388" y="325" fill="#222222" font-size="15" text-anchor="start" font-weight="bold">V</text>
<path d="M110,110 Q150,250 330,290" fill="none" stroke="#1f5fbf" stroke-width="2.5"/>
<path d="M110,110 Q125,250 234,300" fill="none" stroke="#c0392b" stroke-width="3" marker-end="url(#mr)"/>
<circle cx="110" cy="110" r="5" fill="#222222" stroke="#222222" stroke-width="1.5"/>
<circle cx="234" cy="300" r="5" fill="#222222" stroke="#222222" stroke-width="1.5"/>
<text x="100" y="106" fill="#222222" font-size="15" text-anchor="end" font-weight="bold">A</text>
<text x="246" y="288" fill="#222222" font-size="15" text-anchor="start" font-weight="bold">B</text>
<text x="300" y="266" fill="#1f5fbf" font-size="14" text-anchor="start" font-weight="normal">isotherm</text>
<text x="246" y="312" fill="#c0392b" font-size="14" text-anchor="start" font-weight="normal">adiabat</text>
<line x1="440" y1="320" x2="440" y2="60" stroke="#222222" stroke-width="2" marker-end="url(#mk)"/>
<line x1="440" y1="320" x2="730" y2="320" stroke="#222222" stroke-width="2" marker-end="url(#mk)"/>
<text x="426" y="68" fill="#222222" font-size="15" text-anchor="end" font-weight="bold">T</text>
<text x="738" y="325" fill="#222222" font-size="15" text-anchor="start" font-weight="bold">S</text>
<line x1="585" y1="100" x2="585" y2="260" stroke="#c0392b" stroke-width="3" marker-end="url(#mr)"/>
<line x1="440" y1="100" x2="585" y2="100" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 5"/>
<line x1="440" y1="260" x2="585" y2="260" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 5"/>
<line x1="585" y1="260" x2="585" y2="320" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 5"/>
<circle cx="585" cy="100" r="5" fill="#222222" stroke="#222222" stroke-width="1.5"/>
<circle cx="585" cy="260" r="5" fill="#222222" stroke="#222222" stroke-width="1.5"/>
<text x="430" y="105" fill="#222222" font-size="15" text-anchor="end" font-weight="bold">T₁</text>
<text x="430" y="265" fill="#222222" font-size="15" text-anchor="end" font-weight="bold">T₂</text>
<text x="585" y="342" fill="#222222" font-size="15" text-anchor="middle" font-weight="bold">S₀</text>
<text x="572" y="104" fill="#222222" font-size="15" text-anchor="end" font-weight="bold">A</text>
<text x="572" y="264" fill="#222222" font-size="15" text-anchor="end" font-weight="bold">B</text>
<text x="602" y="180" fill="#222222" font-size="14" text-anchor="start" font-weight="bold">isentropic:</text>
<text x="602" y="200" fill="#222222" font-size="14" text-anchor="start" font-weight="normal">ΔS = 0, δQ = 0</text>
<text x="380" y="382" fill="#222222" font-size="14" text-anchor="middle" font-weight="normal">Reversible + adiabatic: δQ_rev = 0, so dS = δQ_rev/T = 0 and S stays constant.</text>
</svg>
