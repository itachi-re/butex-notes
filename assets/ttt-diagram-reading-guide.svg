<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" width="980" height="640" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="How to read a TTT diagram" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>How to read a TTT diagram</title><desc>Schematic isothermal transformation diagram for eutectoid steel with labeled regions</desc><defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker><pattern id="lam" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#f3e3c3"/><line x1="0" y1="3" x2="6" y2="3" stroke="#6b3d10" stroke-width="1.6"/></pattern><pattern id="lamf" width="3.5" height="3.5" patternUnits="userSpaceOnUse"><rect width="3.5" height="3.5" fill="#f3e3c3"/><line x1="0" y1="1.7" x2="3.5" y2="1.7" stroke="#6b3d10" stroke-width="1.2"/></pattern><pattern id="lamc" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f3e3c3"/><line x1="0" y1="5" x2="10" y2="5" stroke="#6b3d10" stroke-width="2.2"/></pattern></defs><rect width="100%" height="100%" fill="#fff"/><text x="490.0" y="26" font-size="17" text-anchor="middle" fill="#0b2a55" font-weight="bold"><tspan x="490.0" dy="0.0">Reading a TTT (Isothermal Transformation) Diagram</tspan></text><text x="490.0" y="44" font-size="11.5" text-anchor="middle" fill="#555" font-style="italic"><tspan x="490.0" dy="0.0">Schematic – no numerical coordinates; log time axis</tspan></text><line x1="100" y1="500" x2="800" y2="500" stroke="#111" stroke-width="2" marker-end="url(#ar)"/><line x1="100" y1="500" x2="100" y2="70" stroke="#111" stroke-width="2" marker-end="url(#ar)"/><text x="450.0" y="534" font-size="12" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="450.0" dy="0.0">Time (logarithmic scale) →</tspan></text><text x="62" y="285.0" font-size="12" text-anchor="middle" fill="#111" font-weight="bold" transform="rotate(-90 62 285.0)"><tspan x="62" dy="0.0">Temperature →</tspan></text><line x1="130" y1="500" x2="130" y2="506" stroke="#111" stroke-width="1"/><line x1="205" y1="500" x2="205" y2="506" stroke="#111" stroke-width="1"/><line x1="280" y1="500" x2="280" y2="506" stroke="#111" stroke-width="1"/><line x1="355" y1="500" x2="355" y2="506" stroke="#111" stroke-width="1"/><line x1="430" y1="500" x2="430" y2="506" stroke="#111" stroke-width="1"/><line x1="505" y1="500" x2="505" y2="506" stroke="#111" stroke-width="1"/><line x1="580" y1="500" x2="580" y2="506" stroke="#111" stroke-width="1"/><line x1="655" y1="500" x2="655" y2="506" stroke="#111" stroke-width="1"/><line x1="730" y1="500" x2="730" y2="506" stroke="#111" stroke-width="1"/><line x1="100" y1="110" x2="800" y2="110" stroke="#33b" stroke-width="1.6" stroke-dasharray="7 4"/><text x="806" y="114" font-size="11.5" text-anchor="start" fill="#33b" font-weight="bold"><tspan x="806" dy="0.0">A₁</tspan></text><path d="M700 112 C500 130 350 160 290 240 C300 300 400 340 520 365" stroke="#c0392b" stroke-width="3" fill="none"/><path d="M750 118 C650 160 500 200 430 250 C440 320 560 370 700 392" stroke="#2b6cb0" stroke-width="3" fill="none"/><text x="745" y="158" font-size="11" text-anchor="middle" fill="#2b6cb0" font-weight="bold"><tspan x="745" dy="0.0">end curve</tspan></text><text x="232" y="280" font-size="11" text-anchor="middle" fill="#c0392b" font-weight="bold"><tspan x="232" dy="0.0">start curve</tspan></text><text x="170" y="190" font-size="11.5" text-anchor="middle" fill="#111" font-weight="bold"><tspan x="170" dy="0.0">AUSTENITE</tspan><tspan x="170" dy="14.4">(unstable,</tspan><tspan x="170" dy="14.4">incubation)</tspan></text><text x="110" y="80" font-size="11" text-anchor="start" fill="#555" font-style="italic"><tspan x="110" dy="0.0">stable austenite above A₁</tspan></text><text x="392" y="172" font-size="11" text-anchor="middle" fill="#111"><tspan x="392" dy="0.0">Austenite +</tspan><tspan x="392" dy="13.8">transforming</tspan></text><text x="660" y="208" font-size="13" text-anchor="middle" fill="#6b3d10" font-weight="bold"><tspan x="660" dy="0.0">PEARLITE</tspan></text><text x="660" y="224" font-size="10.5" text-anchor="middle" fill="#111"><tspan x="660" dy="0.0">(coarse → medium → fine</tspan></text><text x="660" y="238" font-size="10.5" text-anchor="middle" fill="#111"><tspan x="660" dy="0.0">as temperature ↓)</tspan></text><text x="690" y="178" font-size="10.5" text-anchor="middle" fill="#111" font-style="italic"><tspan x="690" dy="0.0">coarse</tspan></text><text x="590" y="262" font-size="10.5" text-anchor="middle" fill="#111" font-style="italic"><tspan x="590" dy="0.0">medium</tspan></text><text x="500" y="300" font-size="10.5" text-anchor="middle" fill="#111" font-style="italic"><tspan x="500" dy="0.0">fine</tspan></text><text x="640" y="345" font-size="13" text-anchor="middle" fill="#1a5c2e" font-weight="bold"><tspan x="640" dy="0.0">BAINITE</tspan></text><text x="640" y="361" font-size="10.5" text-anchor="middle" fill="#111"><tspan x="640" dy="0.0">upper (feathery) higher T</tspan></text><text x="640" y="375" font-size="10.5" text-anchor="middle" fill="#111"><tspan x="640" dy="0.0">lower (acicular) lower T</tspan></text><line x1="100" y1="400" x2="800" y2="400" stroke="#7a1f1f" stroke-width="1.6" stroke-dasharray="5 4"/><text x="806" y="404" font-size="10.5" text-anchor="start" fill="#7a1f1f" font-weight="bold"><tspan x="806" dy="0.0">Ms  (martensite start)</tspan></text><line x1="100" y1="430" x2="800" y2="430" stroke="#7a1f1f" stroke-width="1.6" stroke-dasharray="5 4"/><text x="806" y="434" font-size="10.5" text-anchor="start" fill="#7a1f1f" font-weight="bold"><tspan x="806" dy="0.0">M50  (50 % martensite)</tspan></text><line x1="100" y1="455" x2="800" y2="455" stroke="#7a1f1f" stroke-width="1.6" stroke-dasharray="5 4"/><text x="806" y="459" font-size="10.5" text-anchor="start" fill="#7a1f1f" font-weight="bold"><tspan x="806" dy="0.0">M90  (90 % martensite)</tspan></text><text x="300" y="485" font-size="12" text-anchor="middle" fill="#7a1f1f" font-weight="bold"><tspan x="300" dy="0.0">MARTENSITE  (forms on cooling below Ms; temperature-dependent, not time-dependent)</tspan></text><text x="40" y="568" font-size="12" text-anchor="start" fill="#111"><tspan x="40" dy="0.0">Read it like this:  pick a constant temperature → move right along it → first curve = transformation starts; second curve = transformation ends;</tspan></text><text x="40" y="586" font-size="12" text-anchor="start" fill="#111"><tspan x="40" dy="0.0">the region crossed tells the product.  Left of the start curve = still austenite.  Product depends on WHERE the cooling path crosses.</tspan></text><text x="40" y="610" font-size="11.5" text-anchor="start" fill="#7a1f1f" font-style="italic"><tspan x="40" dy="0.0">Do not read numeric values from this sketch – it is a reading guide, not the lecture’s 1080 steel data.</tspan></text></svg>