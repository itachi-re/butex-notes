<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">From Gauss law to Coulomb law</title>
<desc id="d">Charge q1 at the centre of a Gaussian sphere of radius r and a test charge q2 on the sphere. The field of q1 at q2 is radial and the force on q2 is q2 E.</desc>
<defs>
<marker id="ah-ink" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto"><polygon points="0 0,7 3,0 6" fill="#1b1b1b"/></marker>
<marker id="as-ink" markerWidth="7" markerHeight="6" refX="0.5" refY="3" orient="auto"><polygon points="7 0,0 3,7 6" fill="#1b1b1b"/></marker>
<marker id="ah-blue" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto"><polygon points="0 0,7 3,0 6" fill="#1f5fbf"/></marker>
<marker id="as-blue" markerWidth="7" markerHeight="6" refX="0.5" refY="3" orient="auto"><polygon points="7 0,0 3,7 6" fill="#1f5fbf"/></marker>
<marker id="ah-red" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto"><polygon points="0 0,7 3,0 6" fill="#c62828"/></marker>
<marker id="as-red" markerWidth="7" markerHeight="6" refX="0.5" refY="3" orient="auto"><polygon points="7 0,0 3,7 6" fill="#c62828"/></marker>
<marker id="ah-green" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto"><polygon points="0 0,7 3,0 6" fill="#2e7d32"/></marker>
<marker id="as-green" markerWidth="7" markerHeight="6" refX="0.5" refY="3" orient="auto"><polygon points="7 0,0 3,7 6" fill="#2e7d32"/></marker>
<marker id="ah-grey" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto"><polygon points="0 0,7 3,0 6" fill="#8a8a8a"/></marker>
<marker id="as-grey" markerWidth="7" markerHeight="6" refX="0.5" refY="3" orient="auto"><polygon points="7 0,0 3,7 6" fill="#8a8a8a"/></marker>
</defs>
<rect x="0" y="0" width="560" height="380" fill="#ffffff"/>
<circle cx="200.0" cy="190.0" r="130" fill="#1f5fbf" fill-opacity="0.07" stroke="#8a8a8a" stroke-width="2.5"/>
<text x="200.0" y="36.0" fill="#1b1b1b" font-size="18" text-anchor="middle">Gaussian sphere of radius r</text>
<line x1="200.0" y1="190.0" x2="330.0" y2="190.0" stroke="#1b1b1b" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="265.0" y="218.0" fill="#1b1b1b" font-size="18" text-anchor="middle">r</text>
<circle cx="200.0" cy="190.0" r="15" fill="#ffffff" stroke="#c62828" stroke-width="2.5"/>
<line x1="193.0" y1="190.0" x2="207.0" y2="190.0" stroke="#c62828" stroke-width="2.5" stroke-linecap="round"/>
<line x1="200.0" y1="183.0" x2="200.0" y2="197.0" stroke="#c62828" stroke-width="2.5" stroke-linecap="round"/>
<g fill="#1b1b1b"><text xml:space="preserve" x="185.8" y="160.0" font-size="18" text-anchor="start">q</text><text xml:space="preserve" x="197.3" y="164.7" font-size="14" text-anchor="start">1</text></g>
<circle cx="330.0" cy="190.0" r="12" fill="#ffffff" stroke="#c62828" stroke-width="2.5"/>
<line x1="323.0" y1="190.0" x2="337.0" y2="190.0" stroke="#c62828" stroke-width="2.5" stroke-linecap="round"/>
<line x1="330.0" y1="183.0" x2="330.0" y2="197.0" stroke="#c62828" stroke-width="2.5" stroke-linecap="round"/>
<g fill="#1b1b1b"><text xml:space="preserve" x="323.8" y="234.0" font-size="18" text-anchor="start">q</text><text xml:space="preserve" x="335.3" y="238.7" font-size="14" text-anchor="start">2</text></g>
<line x1="344.0" y1="182.0" x2="450.0" y2="182.0" stroke="#1f5fbf" stroke-width="3" stroke-linecap="round" marker-end="url(#ah-blue)"/>
<text x="400.0" y="168.0" fill="#1f5fbf" font-size="18" text-anchor="middle">E</text>
<line x1="344.0" y1="198.0" x2="450.0" y2="198.0" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" marker-end="url(#ah-green)"/>
<g fill="#2e7d32"><text xml:space="preserve" x="377.4" y="234.0" font-size="17" text-anchor="start">F = q</text><text xml:space="preserve" x="423.0" y="238.4" font-size="14" text-anchor="start">2</text><text xml:space="preserve" x="431.9" y="234.0" font-size="17" text-anchor="start">E</text></g>
<g fill="#1b1b1b"><text xml:space="preserve" x="138.0" y="350.0" font-size="15" text-anchor="start">E(4πr</text><text xml:space="preserve" x="178.1" y="344.3" font-size="14" text-anchor="start">2</text><text xml:space="preserve" x="187.0" y="350.0" font-size="15" text-anchor="start">) = q</text><text xml:space="preserve" x="224.4" y="353.9" font-size="14" text-anchor="start">1</text><text xml:space="preserve" x="233.3" y="350.0" font-size="15" text-anchor="start">/ε</text><text xml:space="preserve" x="246.5" y="353.9" font-size="14" text-anchor="start">0</text><text xml:space="preserve" x="255.4" y="350.0" font-size="15" text-anchor="start">  →  F = q</text><text xml:space="preserve" x="327.3" y="353.9" font-size="14" text-anchor="start">1</text><text xml:space="preserve" x="336.2" y="350.0" font-size="15" text-anchor="start">q</text><text xml:space="preserve" x="345.7" y="353.9" font-size="14" text-anchor="start">2</text><text xml:space="preserve" x="354.6" y="350.0" font-size="15" text-anchor="start">/(4πε</text><text xml:space="preserve" x="392.2" y="353.9" font-size="14" text-anchor="start">0</text><text xml:space="preserve" x="401.1" y="350.0" font-size="15" text-anchor="start">r</text><text xml:space="preserve" x="407.3" y="344.3" font-size="14" text-anchor="start">2</text><text xml:space="preserve" x="416.2" y="350.0" font-size="15" text-anchor="start">)</text></g>
</svg>
