<text x="170.0" y="249.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="700">Acetaldehyde, CH₃CHO</text>
<text x="170.0" y="267.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">Fehling's: red ppt.  Schiff's: pink</text>
<rect x="500.0" y="225.0" width="260.0" height="60.0" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="1.5" opacity="1.0"/>
<text x="630.0" y="249.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="700">Acetone, CH₃COCH₃</text>
<text x="630.0" y="267.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">Fehling's: none  Schiff's: none</text>
