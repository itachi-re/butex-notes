<text x="400.0" y="92.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">acetaldehyde or acetone?</text>
<line x1="400.0" y1="100.0" x2="400.0" y2="130.0" stroke="#1f2933" stroke-width="2" stroke-linecap="round"/>
