<svg xmlns="http://www.w3.org/2000/svg" width="782" height="432" viewBox="0 0 782 432" role="img" aria-label="Flow-chart to distinguish acetaldehyde from acetone">
<title>Flow-chart to distinguish acetaldehyde from acetone</title>
<defs><marker id="eflow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4.5 L0,8.5 L2,4.5 z" fill="#d6336c"/></marker></defs>
<rect x="0.5" y="0.5" width="781" height="431" rx="10" fill="#ffffff" stroke="#d0d7de"/>
