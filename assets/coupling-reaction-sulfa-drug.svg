<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="720" height="320" fill="#ffffff"/>
<text x="360" y="26" text-anchor="middle" font-size="18" font-weight="bold">Coupling Reaction &amp; Sulfa Drug</text>

<text x="20" y="58" font-size="14" font-weight="bold">Diazo coupling (electrophilic aromatic substitution)</text>
<text x="20" y="82" font-size="15">Ar&#8211;N&#8801;N&#8314;  +  Ar'&#8211;NR&#8322; (or Ar'&#8211;OH), activated ring, para-position &#8594;</text>
<text x="20" y="104" font-size="15">Ar&#8211;N=N&#8211;Ar'   (azo compound, coloured, &#8211;N=N&#8211; = azo chromophore)</text>

<line x1="20" y1="120" x2="700" y2="120" stroke="#ccc"/>

<text x="20" y="150" font-size="14" font-weight="bold">Sulfa drug example &#8211; Sulfanilamide</text>
<g stroke="#222" stroke-width="2" fill="none">
  <!-- benzene ring hexagon -->
  <polygon points="160,190 190,175 220,190 220,220 190,235 160,220" fill="#fff"/>
  <line x1="160" y1="196" x2="190" y2="181" />
  <line x1="190" y1="211" x2="220" y2="196" />
  <line x1="220" y1="214" x2="190" y2="229" />
</g>
<text x="130" y="207" font-size="14" text-anchor="end">H&#8322;N&#8211;</text>
<text x="228" y="180" font-size="13">SO&#8322;NH&#8322;</text>
<line x1="220" y1="196" x2="255" y2="185" stroke="#222" stroke-width="2"/>

<text x="20" y="270" font-size="13">Sulfanilamide = para-aminobenzenesulfonamide; mimics PABA and blocks</text>
<text x="20" y="290" font-size="13">bacterial folic-acid synthesis (competitive enzyme inhibition) &#8211; antibacterial action.</text>
</svg>
