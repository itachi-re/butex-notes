<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Entropy is a state function</title>
<desc>Two different reversible paths from state A to state B give the same entropy change.</desc>
<defs><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="my" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#777777"/></marker></defs>
<rect x="0" y="0" width="700" height="420" fill="#ffffff"/>
<text x="350" y="28" fill="#222222" font-size="16" text-anchor="middle" font-weight="bold">Entropy is a state function: the same ΔS along every reversible path A → B</text>
<line x1="80" y1="340" x2="80" y2="50" stroke="#222222" stroke-width="2" marker-end="url(#mk)"/>
<line x1="80" y1="340" x2="620" y2="340" stroke="#222222" stroke-width="2" marker-end="url(#mk)"/>
<text x="66" y="58" fill="#222222" font-size="15" text-anchor="end" font-weight="bold">P</text>
<text x="628" y="345" fill="#222222" font-size="15" text-anchor="start" font-weight="bold">V</text>
<path d="M150,280 Q150,120 480,120" fill="none" stroke="#1f5fbf" stroke-width="2.5" marker-end="url(#mb)"/>
<path d="M150,280 Q480,280 480,120" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#mr)"/>
<circle cx="150" cy="280" r="5" fill="#222222" stroke="#222222" stroke-width="1.5"/>
<circle cx="480" cy="120" r="5" fill="#222222" stroke="#222222" stroke-width="1.5"/>
<text x="96" y="306" fill="#222222" font-size="15" text-anchor="start" font-weight="bold">A:  S(A)</text>
<text x="496" y="116" fill="#222222" font-size="15" text-anchor="start" font-weight="bold">B:  S(B)</text>
<text x="300" y="116" fill="#1f5fbf" font-size="14" text-anchor="middle" font-weight="normal">Path 1</text>
<text x="392" y="268" fill="#c0392b" font-size="14" text-anchor="middle" font-weight="normal">Path 2</text>
<text x="350" y="382" fill="#222222" font-size="15" text-anchor="middle" font-weight="bold">ΔS = S(B) − S(A) = ∫ δQ_rev / T   (independent of the path)</text>
<text x="350" y="406" fill="#222222" font-size="14" text-anchor="middle" font-weight="normal">Around any closed reversible loop A → B → A the sum of δQ_rev / T is zero</text>
</svg>
