<svg viewBox="0 0 560 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
<style>.lbl{font-size:13px;fill:#222} .t{font-size:18px;font-weight:bold;fill:#111}</style>
<rect width="560" height="380" fill="#fff"/>
<text x="280" y="26" text-anchor="middle" class="t">Shaper — Main Parts (Side View)</text>

<!-- Base -->
<rect x="60" y="290" width="440" height="24" fill="#999" stroke="#333"/>
<!-- Column -->
<rect x="80" y="90" width="90" height="200" fill="#b0b0b0" stroke="#333"/>
<!-- Ram -->
<rect x="150" y="120" width="220" height="30" fill="#bcbcbc" stroke="#333"/>
<!-- Tool head -->
<rect x="350" y="150" width="20" height="40" fill="#888" stroke="#333"/>
<polygon points="352,190 368,190 364,210 356,210" fill="#555"/>
<!-- Table -->
<rect x="300" y="220" width="120" height="30" fill="#c6c6c6" stroke="#333"/>
<!-- Vice -->
<rect x="330" y="200" width="60" height="20" fill="#999" stroke="#333"/>
<!-- Workpiece -->
<rect x="340" y="188" width="40" height="12" fill="#8a6d3b"/>
<!-- Motion arrow -->
<line x1="150" y1="135" x2="370" y2="135" stroke="#c33" stroke-width="2" marker-end="url(#arrow)"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#c33"/></marker></defs>

<g font-size="13">
<line x1="120" y1="150" x2="120" y2="70" stroke="#666"/><text x="30" y="62">Column</text>
<line x1="260" y1="130" x2="260" y2="70" stroke="#666"/><text x="200" y="62">Ram (reciprocating)</text>
<line x1="360" y1="170" x2="450" y2="170" stroke="#666"/><text x="400" y="164">Tool head</text>
<line x1="358" y1="200" x2="450" y2="200" stroke="#666"/><text x="400" y="204">Single-point tool</text>
<line x1="360" y1="235" x2="450" y2="260" stroke="#666"/><text x="400" y="274">Table (cross feed)</text>
<line x1="360" y1="210" x2="450" y2="230" stroke="#666"/><text x="400" y="234">Work vice</text>
<text x="150" y="120" fill="#c33">Cutting stroke →</text>
</g>
</svg>
