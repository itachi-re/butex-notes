<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="480" height="300" fill="#ffffff"/>
<!-- incident photon -->
<line x1="40" y1="150" x2="220" y2="150" stroke="#000" stroke-width="2" marker-end="url(#ac)"/>
<text x="120" y="140" font-size="13">incident photon (&#955;, h&#957;)</text>
<!-- electron at rest -->
<circle cx="220" cy="150" r="6" fill="#555"/>
<text x="225" y="175" font-size="12">e&#8315; at rest</text>
<!-- scattered photon at angle phi -->
<line x1="220" y1="150" x2="400" y2="90" stroke="#c00000" stroke-width="2" marker-end="url(#ac2)"/>
<text x="330" y="80" font-size="13" fill="#c00000">scattered photon (&#955;&#8242;)</text>
<!-- recoil electron at angle theta -->
<line x1="220" y1="150" x2="350" y2="230" stroke="#1a5fb4" stroke-width="2" marker-end="url(#ac3)"/>
<text x="300" y="255" font-size="13" fill="#1a5fb4">recoil electron</text>
<!-- angle phi arc -->
<path d="M270,150 A 50 50 0 0 0 262,127" stroke="#000" stroke-width="1" fill="none"/>
<text x="255" y="140" font-size="12">&#966;</text>
<!-- angle theta arc -->
<path d="M270,150 A 50 50 0 0 1 258,177" stroke="#000" stroke-width="1" fill="none"/>
<text x="255" y="185" font-size="12">&#952;</text>
<defs>
<marker id="ac" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#000"/></marker>
<marker id="ac2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#c00000"/></marker>
<marker id="ac3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1a5fb4"/></marker>
</defs>
<text x="240" y="20" font-size="16" text-anchor="middle" font-weight="bold">Compton Scattering Geometry</text>
<text x="240" y="285" font-size="12" text-anchor="middle">&#955;&#8242; - &#955; = (h/m&#8320;c)(1 - cos&#966;)</text>
</svg>
