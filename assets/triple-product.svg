<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 290" width="460" height="290" font-family="Arial, Helvetica, sans-serif" font-size="15" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="460" height="290" fill="#ffffff" stroke="#d0d7de"/>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#cf222e"/>
    </marker>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0969da"/>
    </marker>
  </defs>
  <!-- base face -->
  <polygon points="60,240 260,240 330,180 130,180" fill="#ddf4ff" stroke="#24292f" stroke-width="1.5"/>
  <!-- top face -->
  <polygon points="90,110 290,110 360,50 160,50" fill="#fff8c5" fill-opacity="0.6" stroke="#24292f" stroke-width="1.5"/>
  <!-- vertical / slanted edges -->
  <line x1="60" y1="240" x2="90" y2="110" stroke="#24292f" stroke-width="1.5"/>
  <line x1="260" y1="240" x2="290" y2="110" stroke="#24292f" stroke-width="1.5"/>
  <line x1="330" y1="180" x2="360" y2="50" stroke="#24292f" stroke-width="1.5"/>
  <line x1="130" y1="180" x2="160" y2="50" stroke="#24292f" stroke-width="1.5" stroke-dasharray="5,4"/>
  <!-- vectors from O -->
  <line x1="60" y1="240" x2="258" y2="240" stroke="#0969da" stroke-width="3" marker-end="url(#ab)"/>
  <line x1="60" y1="240" x2="127" y2="182" stroke="#0969da" stroke-width="3" marker-end="url(#ab)"/>
  <line x1="60" y1="240" x2="89" y2="113" stroke="#cf222e" stroke-width="3" marker-end="url(#ar)"/>
  <!-- height -->
  <line x1="90" y1="110" x2="90" y2="240" stroke="#1a7f37" stroke-width="2" stroke-dasharray="6,4"/>
  <!-- normal -->
  <line x1="195" y1="212" x2="195" y2="140" stroke="#8250df" stroke-width="3" marker-end="url(#ab)"/>
  <!-- labels -->
  <text x="40" y="258" fill="#24292f">O</text>
  <text x="158" y="258" fill="#0969da" font-weight="bold">b</text>
  <text x="84" y="206" fill="#0969da" font-weight="bold">c</text>
  <text x="40" y="170" fill="#cf222e" font-weight="bold">a</text>
  <text x="96" y="178" fill="#1a7f37">h</text>
  <text x="203" y="150" fill="#8250df" font-weight="bold">n = b × c</text>
  <text x="230" y="272" fill="#24292f">Base area = |b × c|</text>
  <text x="20" y="22" fill="#24292f">V = (base area) × h = |a · (b × c)|</text>
</svg>
