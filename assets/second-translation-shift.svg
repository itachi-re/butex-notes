<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="480" height="240" font-family="Arial, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#222"/></marker></defs>
<line x1="30" y1="190" x2="210" y2="190" stroke="#555" marker-end="url(#arr)"/>
<line x1="40" y1="200" x2="40" y2="40" stroke="#555" marker-end="url(#arr)"/>
<path d="M40,80 C90,80 120,150 200,160" fill="none" stroke="#1565c0" stroke-width="3"/>
<text x="90" y="60" fill="#1565c0">F(t), t ≥ 0</text>
<line x1="260" y1="190" x2="460" y2="190" stroke="#555" marker-end="url(#arr)"/>
<line x1="260" y1="200" x2="260" y2="40" stroke="#555" marker-end="url(#arr)"/>
<line x1="260" y1="190" x2="320" y2="190" stroke="#c62828" stroke-width="3"/>
<line x1="320" y1="190" x2="320" y2="80" stroke="#999" stroke-dasharray="4,4"/>
<path d="M320,80 C370,80 400,150 450,160" fill="none" stroke="#c62828" stroke-width="3"/>
<text x="318" y="210">a</text>
<text x="280" y="60" fill="#c62828">G(t) = F(t - a) for t &gt; a</text>
<text x="280" y="78" fill="#c62828" font-size="12">G(t) = 0 for t &lt; a</text>
<text x="150" y="228" fill="#222">same shape, delayed by a  ⇒  L{G} = e^(-as) f(s)</text>
</svg>
