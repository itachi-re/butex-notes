<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Field on the perpendicular bisector of a dipole</title>
<desc id="d">Charges minus q and plus q a distance 2a apart. At a point P on the perpendicular bisector at distance R from the centre the two fields have equal size, their vertical parts cancel and the resultant is parallel to the axis, opposite to p.</desc>
