<svg viewBox="0 0 420 300" xmlns="http://www.w3.org/2000/svg" font-family="Arial" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<!-- Ring: O5-C1-C2-C3-C4-C5 -->
<polygon points="250,80 300,130 280,200 180,200 130,130 170,80" fill="none" stroke="black" stroke-width="2"/>
<text x="248" y="72" text-anchor="middle">O</text>
<text x="300" y="128" text-anchor="middle" font-weight="bold">C1</text>
<text x="282" y="215" text-anchor="middle" font-weight="bold">C2</text>
<text x="178" y="215" text-anchor="middle" font-weight="bold">C3</text>
<text x="128" y="128" text-anchor="middle" font-weight="bold">C4</text>
<text x="168" y="72" text-anchor="middle" font-weight="bold">C5</text>

<!-- C1 substituents: OH down (alpha), H up -->
<line x1="300" y1="135" x2="320" y2="170" stroke="black"/>
<text x="330" y="180">OH (α)</text>
<line x1="300" y1="125" x2="320" y2="95" stroke="black"/>
<text x="325" y="90">H</text>

<!-- C2 substituents: OH down, H up -->
<line x1="282" y1="205" x2="300" y2="235" stroke="black"/>
<text x="305" y="248">OH</text>
<line x1="282" y1="195" x2="260" y2="170" stroke="black"/>
<text x="248" y="163">H</text>

<!-- C3 substituents: OH up, H down -->
<line x1="178" y1="195" x2="158" y2="165" stroke="black"/>
<text x="130" y="160">OH</text>
<line x1="178" y1="205" x2="198" y2="235" stroke="black"/>
<text x="198" y="250">H</text>

<!-- C4 substituents: OH down, H up -->
<line x1="128" y1="135" x2="100" y2="170" stroke="black"/>
<text x="65" y="180">OH</text>
<line x1="128" y1="125" x2="100" y2="95" stroke="black"/>
<text x="80" y="88">H</text>

<!-- C5 substituent: CH2OH up, H down -->
<line x1="168" y1="72" x2="150" y2="35" stroke="black"/>
<text x="95" y="30">CH₂OH</text>
<line x1="168" y1="88" x2="190" y2="112" stroke="black"/>
<text x="195" y="120">H</text>

<text x="210" y="290" text-anchor="middle" font-style="italic">α-D-Glucopyranose (Haworth projection)</text>
</svg>
