<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640" font-family="DejaVu Sans, Verdana, Arial, sans-serif" role="img" aria-label="Blast furnace: production of pig iron (raw material of cast iron)"><title>Blast furnace: production of pig iron (raw material of cast iron)</title><defs><marker id="m2e7d32" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#2e7d32"/></marker><marker id="m6d4c41" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#6d4c41"/></marker><marker id="m1565c0" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#1565c0"/></marker><marker id="mbf360c" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#bf360c"/></marker><marker id="m757575" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#757575"/></marker></defs><rect width="980" height="640" fill="#ffffff"/><text x="490.0" y="28.0" font-size="17" text-anchor="middle" fill="#222" font-weight="bold">Blast furnace: production of pig iron (raw material of cast iron)</text><text x="490.0" y="46.0" font-size="12" text-anchor="middle" fill="#555" font-weight="normal">charge: iron ore + coke + limestone;  hot blast: 900–1200 °C air through tuyeres</text><polygon points="280.0,100.0 218.0,230.0 218.0,300.0 258.0,410.0 258.0,520.0 402.0,520.0 402.0,410.0 442.0,300.0 442.0,230.0 380.0,100.0" fill="#d7ccc8" stroke="#4e342e" stroke-width="3" stroke-linejoin="round"/><polygon points="290.0,140.0 370.0,140.0 415.0,230.0 245.0,230.0" fill="#fff59d" fill-opacity="0.6" stroke="none" stroke-width="0" stroke-linejoin="round"/><polygon points="260.0,300.0 400.0,300.0 392.0,420.0 268.0,420.0" fill="#ff8a65" fill-opacity="0.55" stroke="none" stroke-width="0" stroke-linejoin="round"/><rect x="270.0" y="450.0" width="120.0" height="66.0" rx="0" fill="#ffab40" fill-opacity="0.9" stroke="none" stroke-width="0"/><rect x="270.0" y="495.0" width="120.0" height="25.0" rx="0" fill="#8d6e63" fill-opacity="0.9" stroke="none" stroke-width="0"/><rect x="260.0" y="80.0" width="140.0" height="20.0" rx="0" fill="#8d6e63" stroke="#4e342e" stroke-width="2"/><line x1="180.0" y1="80.0" x2="258.0" y2="90.0" stroke="#2e7d32" stroke-width="3" marker-end="url(#m2e7d32)" stroke-linecap="round"/><text x="20.0" y="76.0" font-size="12" text-anchor="start" fill="#2e7d32" font-weight="bold">ore + coke +</text><text x="20.0" y="91.0" font-size="12" text-anchor="start" fill="#2e7d32" font-weight="bold">limestone (charge)</text><line x1="342.0" y1="78.0" x2="342.0" y2="60.0" stroke="#6d4c41" stroke-width="2" marker-end="url(#m6d4c41)" stroke-linecap="round"/><line x1="400.0" y1="100.0" x2="480.0" y2="100.0" stroke="#6d4c41" stroke-width="2" marker-end="url(#m6d4c41)" stroke-linecap="round"/><text x="485.0" y="94.0" font-size="12" text-anchor="start" fill="#222" font-weight="normal">top gas (CO, CO₂, N₂)</text><line x1="180.0" y1="450.0" x2="268.0" y2="450.0" stroke="#1565c0" stroke-width="4" marker-end="url(#m1565c0)" stroke-linecap="round"/><line x1="480.0" y1="450.0" x2="392.0" y2="450.0" stroke="#1565c0" stroke-width="4" marker-end="url(#m1565c0)" stroke-linecap="round"/><line x1="180.0" y1="450.0" x2="268.0" y2="450.0" stroke="#1565c0" stroke-width="4" marker-end="url(#m1565c0)" stroke-linecap="round"/><line x1="480.0" y1="450.0" x2="392.0" y2="450.0" stroke="#1565c0" stroke-width="4" marker-end="url(#m1565c0)" stroke-linecap="round"/><text x="170.0" y="440.0" font-size="12" text-anchor="end" fill="#1565c0" font-weight="bold">hot blast</text><text x="170.0" y="455.0" font-size="11" text-anchor="end" fill="#1565c0" font-weight="normal">(tuyeres)</text><line x1="390.0" y1="508.0" x2="480.0" y2="540.0" stroke="#bf360c" stroke-width="3" marker-end="url(#mbf360c)" stroke-linecap="round"/><text x="485.0" y="545.0" font-size="12" text-anchor="start" fill="#222" font-weight="bold">molten pig iron (≈ 4 % C, 1500 °C)</text><line x1="392.0" y1="478.0" x2="480.0" y2="480.0" stroke="#757575" stroke-width="3" marker-end="url(#m757575)" stroke-linecap="round"/><text x="485.0" y="484.0" font-size="12" text-anchor="start" fill="#222" font-weight="normal">slag (CaSiO₃) — floats on iron</text><text x="460.0" y="150.0" font-size="12" text-anchor="start" fill="#222" font-weight="normal"></text><text x="460.0" y="190.0" font-size="12" text-anchor="start" fill="#222" font-weight="normal"></text><text x="460.0" y="240.0" font-size="12" text-anchor="start" fill="#222" font-weight="normal"></text><text x="460.0" y="330.0" font-size="12" text-anchor="start" fill="#222" font-weight="normal"></text><text x="460.0" y="385.0" font-size="12" text-anchor="start" fill="#222" font-weight="normal"></text><text x="460.0" y="440.0" font-size="12" text-anchor="start" fill="#222" font-weight="normal"></text><text x="460.0" y="500.0" font-size="12" text-anchor="start" fill="#222" font-weight="normal"></text><text x="20.0" y="190.0" font-size="11" text-anchor="start" fill="#222" font-weight="normal">stack: drying and</text><text x="20.0" y="204.0" font-size="11" text-anchor="start" fill="#222" font-weight="normal">pre-heating (≈ 400 °C)</text><text x="20.0" y="300.0" font-size="11" text-anchor="start" fill="#222" font-weight="normal">belly: reduction</text><text x="20.0" y="314.0" font-size="11" text-anchor="start" fill="#222" font-weight="normal">of ore (≈ 900 °C)</text><text x="20.0" y="390.0" font-size="11" text-anchor="start" fill="#222" font-weight="normal">bosh: fusion</text><text x="20.0" y="404.0" font-size="11" text-anchor="start" fill="#222" font-weight="normal">zone (≈ 1500 °C)</text><text x="20.0" y="520.0" font-size="11" text-anchor="start" fill="#222" font-weight="normal">hearth: iron + slag</text><rect x="560.0" y="170.0" width="400.0" height="150.0" rx="6" fill="#fffde7" stroke="#f9a825" stroke-width="1.5"/><text x="575.0" y="193.0" font-size="13" text-anchor="start" fill="#222" font-weight="bold">Main chemical reactions</text><text x="575.0" y="220.0" font-size="12" text-anchor="start" fill="#222" font-weight="bold">Combustion:</text><text x="685.0" y="220.0" font-size="12" text-anchor="start" fill="#222" font-weight="normal">C + O₂ → CO₂ ;  CO₂ + C → 2 CO</text><text x="575.0" y="245.0" font-size="12" text-anchor="start" fill="#222" font-weight="bold">Reduction:</text><text x="685.0" y="245.0" font-size="12" text-anchor="start" fill="#222" font-weight="normal">Fe₂O₃ + 3CO → 2Fe + 3CO₂</text><text x="575.0" y="270.0" font-size="12" text-anchor="start" fill="#222" font-weight="bold">Flux:</text><text x="685.0" y="270.0" font-size="12" text-anchor="start" fill="#222" font-weight="normal">CaCO₃ → CaO + CO₂</text><text x="575.0" y="295.0" font-size="12" text-anchor="start" fill="#222" font-weight="bold">Slag:</text><text x="685.0" y="295.0" font-size="12" text-anchor="start" fill="#222" font-weight="normal">CaO + SiO₂ → CaSiO₃</text><text x="20.0" y="610.0" font-size="13" text-anchor="start" fill="#222" font-weight="normal">Pig iron is remelted with scrap in a cupola (coke-fired, air-blast) to give grey iron castings.</text></svg>