<svg xmlns="http://www.w3.org/2000/svg" width="800" height="315" viewBox="0 0 800 315" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Memory layout of a structure versus a union" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Memory layout of a structure versus a union</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker></defs>
<rect x="0.5" y="0.5" width="799" height="314" fill="#ffffff" stroke="#cfd8dc" rx="8"/>
<text x="210" y="28.55" font-size="13" text-anchor="middle" font-weight="bold" fill="#1a1a1a" font-family="Consolas, Menlo, monospace"><tspan x="210" dy="0">struct datasize { int a; float b; int c; }</tspan></text><rect x="60" y="60" width="100" height="60" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/><text x="110.0" y="86.15" font-size="14" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="110.0" dy="0">a</tspan><tspan x="110.0" dy="17.5">4 bytes</tspan></text><text x="110" y="141.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#78909c" font-family="Consolas, Menlo, monospace"><tspan x="110" dy="0">@1000</tspan></text><rect x="160" y="60" width="100" height="60" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/><text x="210.0" y="86.15" font-size="14" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="210.0" dy="0">b</tspan><tspan x="210.0" dy="17.5">4 bytes</tspan></text><text x="210" y="141.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#78909c" font-family="Consolas, Menlo, monospace"><tspan x="210" dy="0">@1004</tspan></text><rect x="260" y="60" width="100" height="60" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="310.0" y="86.15" font-size="14" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="310.0" dy="0">c</tspan><tspan x="310.0" dy="17.5">4 bytes</tspan></text><text x="310" y="141.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#78909c" font-family="Consolas, Menlo, monospace"><tspan x="310" dy="0">@1008</tspan></text><polyline points="60,155 60,165 360,165 360,155" fill="none" stroke="#37474f" stroke-width="1.6"/><text x="210" y="188.55" font-size="13" text-anchor="middle" font-weight="bold" fill="#1a1a1a" ><tspan x="210" dy="0">sizeof = 4 + 4 + 4 = 12 bytes</tspan></text><text x="590" y="28.55" font-size="13" text-anchor="middle" font-weight="bold" fill="#1a1a1a" font-family="Consolas, Menlo, monospace"><tspan x="590" dy="0">union datasize { int a; float b; int c; }</tspan></text><rect x="530" y="60" width="120" height="60" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/><text x="590.0" y="79.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="590.0" dy="0">a / b / c</tspan><tspan x="590.0" dy="15.0">share the</tspan><tspan x="590.0" dy="15.0">SAME 4 bytes</tspan></text><text x="590" y="141.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#78909c" font-family="Consolas, Menlo, monospace"><tspan x="590" dy="0">@1000</tspan></text><polyline points="530,155 530,165 650,165 650,155" fill="none" stroke="#37474f" stroke-width="1.6"/><text x="590" y="188.55" font-size="13" text-anchor="middle" font-weight="bold" fill="#1a1a1a" ><tspan x="590" dy="0">sizeof = max(4,4,4) = 4 bytes</tspan></text><polyline points="450,40 450,250" fill="none" stroke="#b0bec5" stroke-width="1.6"/><text x="210" y="221.425" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="210" dy="0">All members have their own space</tspan><tspan x="210" dy="16.25">→ all values stored together</tspan></text><text x="590" y="221.425" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="590" dy="0">One space for all members</tspan><tspan x="590" dy="16.25">→ only the LAST written value is valid</tspan></text><text x="400" y="294.9" font-size="14" text-anchor="middle" font-weight="bold" fill="#c62828" ><tspan x="400" dy="0">v1 + v2  (structure version)  = 12 + 12 = 24</tspan></text>
</svg>