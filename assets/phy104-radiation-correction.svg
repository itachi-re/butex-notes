<svg viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="680" height="400" fill="#ffffff"/>
  <text x="340" y="26" font-size="18" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Radiation (Cooling) Correction — Temperature vs Time</text>

  <!-- Axes -->
  <line x1="80" y1="340" x2="620" y2="340" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="340" x2="80" y2="50" stroke="#333" stroke-width="2"/>
  <text x="350" y="375" font-size="13" text-anchor="middle" fill="#333">Time, t (min)</text>
  <text x="30" y="195" font-size="13" text-anchor="middle" fill="#333" transform="rotate(-90 30 195)">Temperature, θ (°C)</text>

  <!-- Pre-mixing gentle rise/fall line (slow) -->
  <path d="M100 300 L220 292" stroke="#2b6cb0" stroke-width="2" fill="none"/>
  <text x="140" y="285" font-size="10" fill="#2b6cb0">before mixing</text>

  <!-- Rapid rise at mixing -->
  <path d="M220 292 L260 100" stroke="#c0392b" stroke-width="2.5" fill="none"/>
  <text x="215" y="180" font-size="10" fill="#c0392b" transform="rotate(-72 215 180)">rapid rise on mixing</text>

  <!-- Observed max then falling (radiation loss) -->
  <path d="M260 100 Q 300 108 340 118 Q 420 138 520 170" stroke="#e67e22" stroke-width="2.5" fill="none"/>
  <text x="430" y="150" font-size="10" fill="#e67e22">falling after mixing (heat loss)</text>

  <!-- Observed max point -->
  <circle cx="260" cy="100" r="4" fill="#c0392b"/>
  <text x="270" y="95" font-size="10" fill="#333">θ₂ (observed max)</text>

  <!-- Dashed extrapolation back to mixing instant t0 -->
  <path d="M340 118 L 250 108" stroke="#333" stroke-width="1.5" stroke-dasharray="4,3" fill="none"/>
  <circle cx="250" cy="108" r="4" fill="#1a1a1a"/>
  <text x="185" y="70" font-size="10" fill="#1a1a1a">θ₂′ = corrected (true) temperature</text>
  <line x1="245" y1="75" x2="252" y2="105" stroke="#1a1a1a" stroke-width="1"/>

  <!-- vertical line at t0 -->
  <line x1="220" y1="340" x2="220" y2="292" stroke="#666" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="220" y="355" font-size="10" text-anchor="middle" fill="#666">t₀ (mixing)</text>

  <text x="350" y="30" font-size="0"></text>
  <text x="340" y="395" font-size="11" text-anchor="middle" fill="#555">Correction dθ is obtained from the post-mixing cooling slope and added back to the observed rise</text>
</svg>
