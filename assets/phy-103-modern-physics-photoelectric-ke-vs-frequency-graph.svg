<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" width="700" height="430" role="img" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>K max versus frequency graph</title>
<desc>Straight line of maximum kinetic energy against frequency with slope h, intercept minus phi on the energy axis and threshold frequency nu zero on the frequency axis.</desc>
<defs><marker id="ad" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 z" fill="#222222"/></marker><marker id="ab" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 z" fill="#1f5fbf"/></marker><marker id="ar" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 z" fill="#c0392b"/></marker><marker id="ag" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 z" fill="#2e7d32"/></marker></defs>
<rect x="0" y="0" width="700" height="430" fill="#ffffff"/>
<text x="20" y="30" text-anchor="start" font-size="18" fill="#222222" font-weight="bold"><tspan>Maximum kinetic energy versus frequency</tspan></text>
<line x1="140.0" y1="400.0" x2="140.0" y2="62.0" stroke="#222222" stroke-width="2" marker-end="url(#ad)"/>
<line x1="90.0" y1="300.0" x2="650.0" y2="300.0" stroke="#222222" stroke-width="2" marker-end="url(#ad)"/>
<text x="152" y="72" text-anchor="start" font-size="17" fill="#222222" font-weight="normal"><tspan>K</tspan><tspan dy="5" font-size="14">max</tspan></text>
<text x="640" y="330" text-anchor="end" font-size="17" fill="#222222" font-weight="normal"><tspan>Frequency ν</tspan></text>
<line x1="140.0" y1="380.0" x2="260.0" y2="300.0" stroke="#1f5fbf" stroke-width="2.5" stroke-dasharray="7 5"/>
<line x1="260.0" y1="300.0" x2="600.0" y2="73.0" stroke="#1f5fbf" stroke-width="3"/>
<circle cx="260" cy="300" r="5" fill="#1f5fbf" stroke="#1f5fbf" stroke-width="2"/>
<circle cx="140" cy="380" r="5" fill="#1f5fbf" stroke="#1f5fbf" stroke-width="2"/>
<text x="251.9" y="326" text-anchor="start" font-size="17" fill="#222222" font-weight="normal"><tspan>ν</tspan><tspan dy="5" font-size="14">0</tspan></text>
<text x="260" y="346" text-anchor="middle" font-size="15" fill="#222222" font-weight="normal"><tspan>threshold</tspan></text>
<text x="128" y="386" text-anchor="end" font-size="17" fill="#222222" font-weight="normal"><tspan>−φ</tspan></text>
<text x="72.7" y="406" text-anchor="start" font-size="15" fill="#222222" font-weight="normal"><tspan>(= −hν</tspan><tspan dy="5" font-size="14">0</tspan><tspan dy="-5">)</tspan></text>
<line x1="380.0" y1="220.0" x2="500.0" y2="220.0" stroke="#222222" stroke-width="1.8" stroke-dasharray="5 4"/>
<line x1="500.0" y1="220.0" x2="500.0" y2="140.0" stroke="#222222" stroke-width="1.8" stroke-dasharray="5 4"/>
<text x="440" y="242" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal"><tspan>Δν</tspan></text>
<text x="512" y="186" text-anchor="start" font-size="16" fill="#222222" font-weight="normal"><tspan>ΔK</tspan></text>
<text x="190" y="104" text-anchor="start" font-size="17" fill="#1f5fbf" font-weight="bold"><tspan>slope = ΔK / Δν = h</tspan></text>
<text x="190" y="128" text-anchor="start" font-size="16" fill="#1f5fbf" font-weight="normal"><tspan>(same for every metal)</tspan></text>
<text x="285" y="376" text-anchor="start" font-size="16" fill="#c0392b" font-weight="normal"><tspan>ν &lt; ν</tspan><tspan dy="5" font-size="14">0</tspan><tspan dy="-5">: no emission</tspan></text>
<text x="285" y="400" text-anchor="start" font-size="16" fill="#1f5fbf" font-weight="normal"><tspan>K</tspan><tspan dy="5" font-size="14">max</tspan><tspan dy="-5"> = hν − φ</tspan></text>
</svg>
