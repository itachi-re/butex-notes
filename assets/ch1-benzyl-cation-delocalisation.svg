<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Benzyl cation delocalisation and carbocation stability</title><desc>The benzyl cation carries partial positive charge on ortho and para ring carbons; bar chart ranks carbocation stability.</desc><defs><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c0392b"/></marker><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#24292f"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0969da"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1a7f37"/></marker><marker id="mgy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#57606a"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#bc4c00"/></marker></defs><rect width="900" height="360" fill="#ffffff"/><text x="30.0" y="34.0" font-size="16" text-anchor="start" fill="#57606a" font-weight="bold" xml:space="preserve"><tspan>Benzyl cation: the + charge is delocalised into the ring (a 1° cation that is unusually stable)</tspan></text><polygon points="276.0,190.0 248.0,238.5 192.0,238.5 164.0,190.0 192.0,141.5 248.0,141.5" fill="none" stroke="#24292f" stroke-width="2.4" stroke-linejoin="round"/><circle cx="220" cy="190" r="33.6" fill="none" stroke="#24292f" stroke-width="2"/><line x1="279.0" y1="190.0" x2="307.0" y2="190.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="310.0" y="198.4" font-size="24" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="24.0">CH</tspan><tspan dy="7.2" font-size="16.8">2</tspan><tspan dy="-18.0" font-size="16.8">+</tspan></text><text x="262.0" y="128.0" font-size="15" text-anchor="middle" fill="#c0392b" font-weight="bold" xml:space="preserve"><tspan>δ+</tspan></text><text x="262.0" y="260.0" font-size="15" text-anchor="middle" fill="#c0392b" font-weight="bold" xml:space="preserve"><tspan>δ+</tspan></text><text x="146.0" y="198.0" font-size="15" text-anchor="middle" fill="#c0392b" font-weight="bold" xml:space="preserve"><tspan>δ+</tspan></text><text x="220.0" y="308.0" font-size="14" text-anchor="middle" fill="#57606a" font-weight="normal" xml:space="preserve"><tspan>ortho and para carbons carry part of the charge</tspan></text><text x="220.0" y="328.0" font-size="14" text-anchor="middle" fill="#57606a" font-weight="normal" xml:space="preserve"><tspan>(resonance: CH₂⁺ ↔ ring-cation forms with C=CH₂)</tspan></text><text x="660.0" y="78.0" font-size="16" text-anchor="middle" fill="#24292f" font-weight="bold" xml:space="preserve"><tspan>Relative carbocation stability (qualitative)</tspan></text><line x1="470.0" y1="300.0" x2="470.0" y2="100.0" stroke="#24292f" stroke-width="2" stroke-linecap="round" marker-end="url(#mk)"/><text transform="rotate(-90 458 180)" x="458.0" y="180.0" font-size="13" text-anchor="middle" fill="#57606a" font-weight="normal" xml:space="preserve"><tspan>stability</tspan></text><line x1="470.0" y1="300.0" x2="860.0" y2="300.0" stroke="#24292f" stroke-width="2" stroke-linecap="round"/><rect x="490" y="260" width="52" height="40" fill="#9ec5fe"/><text x="516.0" y="322.0" font-size="15" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>CH₃⁺</tspan></text><rect x="564" y="215" width="52" height="85" fill="#6ea8fe"/><text x="590.0" y="322.0" font-size="15" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>1°</tspan></text><rect x="638" y="175" width="52" height="125" fill="#3d8bfd"/><text x="664.0" y="322.0" font-size="15" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>2°</tspan></text><rect x="712" y="150" width="52" height="150" fill="#0d6efd"/><text x="738.0" y="322.0" font-size="15" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>benzyl</tspan></text><rect x="786" y="125" width="52" height="175" fill="#0a3f9e"/><text x="812.0" y="322.0" font-size="15" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>3°</tspan></text></svg>