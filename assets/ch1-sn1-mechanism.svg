<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>SN1 mechanism of tert-butyl bromide</title><desc>tert-Butyl bromide ionises slowly to a planar carbocation and bromide; the nucleophile then attacks the carbocation quickly to give tert-butyl alcohol.</desc><defs><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c0392b"/></marker><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#24292f"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0969da"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1a7f37"/></marker><marker id="mgy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#57606a"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#bc4c00"/></marker></defs><rect width="900" height="600" fill="#ffffff"/><text x="30.0" y="36.0" font-size="16" text-anchor="start" fill="#57606a" font-weight="bold" xml:space="preserve"><tspan>Step 1 (slow, rate-determining): the C–Br bond ionises on its own</tspan></text><text x="160.0" y="167.7" font-size="22" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>C</tspan></text><line x1="148.0" y1="160.0" x2="112.0" y2="160.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="108.0" y="167.7" font-size="22" text-anchor="end" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="22.0">H</tspan><tspan dy="6.6" font-size="15.4">3</tspan><tspan dy="-6.6" font-size="22.0">C</tspan></text><line x1="172.0" y1="160.0" x2="208.0" y2="160.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="212.0" y="167.7" font-size="22" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>Br</tspan></text><line x1="160.0" y1="146.0" x2="160.0" y2="110.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="160.0" y="104.0" font-size="22" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="22.0">CH</tspan><tspan dy="6.6" font-size="15.4">3</tspan></text><line x1="160.0" y1="174.0" x2="160.0" y2="210.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="160.0" y="231.8" font-size="22" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="22.0">CH</tspan><tspan dy="6.6" font-size="15.4">3</tspan></text><text x="160.0" y="268.0" font-size="14" text-anchor="middle" fill="#57606a" font-weight="normal" xml:space="preserve"><tspan>tert-butyl bromide</tspan></text><line x1="300.0" y1="160.0" x2="410.0" y2="160.0" stroke="#24292f" stroke-width="2.8" stroke-linecap="round" marker-end="url(#mk)"/><text x="355.0" y="148.0" font-size="15" text-anchor="middle" fill="#c0392b" font-weight="bold" xml:space="preserve"><tspan>slow</tspan></text><text x="355.0" y="183.0" font-size="15" text-anchor="middle" fill="#c0392b" font-weight="normal" xml:space="preserve"><tspan>ionisation</tspan></text><text x="560.0" y="167.7" font-size="22" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="22.0">C</tspan><tspan dy="-9.9" font-size="15.4">+</tspan></text><line x1="543.0" y1="160.0" x2="507.0" y2="160.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="503.0" y="167.7" font-size="22" text-anchor="end" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="22.0">H</tspan><tspan dy="6.6" font-size="15.4">3</tspan><tspan dy="-6.6" font-size="22.0">C</tspan></text><line x1="560.0" y1="146.0" x2="560.0" y2="110.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="560.0" y="104.0" font-size="22" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="22.0">CH</tspan><tspan dy="6.6" font-size="15.4">3</tspan></text><line x1="560.0" y1="174.0" x2="560.0" y2="210.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="560.0" y="231.8" font-size="22" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="22.0">CH</tspan><tspan dy="6.6" font-size="15.4">3</tspan></text><text x="560.0" y="268.0" font-size="14" text-anchor="middle" fill="#57606a" font-weight="normal" xml:space="preserve"><tspan>planar sp² carbocation</tspan></text><text x="655.0" y="168.0" font-size="24" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>+</tspan></text><text x="715.0" y="168.0" font-size="24" text-anchor="middle" fill="#0969da" font-weight="normal" xml:space="preserve"><tspan font-size="24.0">Br</tspan><tspan dy="-10.8" font-size="16.8">−</tspan></text><text x="30.0" y="318.0" font-size="16" text-anchor="start" fill="#57606a" font-weight="bold" xml:space="preserve"><tspan>Step 2 (fast): nucleophile attacks the carbocation</tspan></text><text x="160.0" y="437.7" font-size="22" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="22.0">C</tspan><tspan dy="-9.9" font-size="15.4">+</tspan></text><line x1="143.0" y1="430.0" x2="107.0" y2="430.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="103.0" y="437.7" font-size="22" text-anchor="end" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="22.0">H</tspan><tspan dy="6.6" font-size="15.4">3</tspan><tspan dy="-6.6" font-size="22.0">C</tspan></text><line x1="160.0" y1="416.0" x2="160.0" y2="380.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="160.0" y="374.0" font-size="22" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="22.0">CH</tspan><tspan dy="6.6" font-size="15.4">3</tspan></text><line x1="160.0" y1="444.0" x2="160.0" y2="480.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="160.0" y="501.8" font-size="22" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="22.0">CH</tspan><tspan dy="6.6" font-size="15.4">3</tspan></text><text x="262.0" y="438.0" font-size="24" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>+</tspan></text><text x="350.0" y="438.0" font-size="24" text-anchor="middle" fill="#0969da" font-weight="normal" xml:space="preserve"><tspan font-size="24.0">HO</tspan><tspan dy="-10.8" font-size="16.8">−</tspan></text><circle cx="308.0" cy="424.8" r="2" fill="#0969da"/><circle cx="308.0" cy="431.2" r="2" fill="#0969da"/><path d="M304.0,418.0 Q240.0,368.0 186.0,422.0" fill="none" stroke="#0969da" stroke-width="2.2" stroke-linecap="round" marker-end="url(#mb)"/><line x1="440.0" y1="430.0" x2="540.0" y2="430.0" stroke="#24292f" stroke-width="2.8" stroke-linecap="round" marker-end="url(#mk)"/><text x="490.0" y="418.0" font-size="15" text-anchor="middle" fill="#0969da" font-weight="bold" xml:space="preserve"><tspan>fast</tspan></text><text x="690.0" y="437.7" font-size="22" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>C</tspan></text><line x1="678.0" y1="430.0" x2="642.0" y2="430.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="638.0" y="437.7" font-size="22" text-anchor="end" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="22.0">H</tspan><tspan dy="6.6" font-size="15.4">3</tspan><tspan dy="-6.6" font-size="22.0">C</tspan></text><line x1="702.0" y1="430.0" x2="738.0" y2="430.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="742.0" y="437.7" font-size="22" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>OH</tspan></text><line x1="690.0" y1="416.0" x2="690.0" y2="380.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="690.0" y="374.0" font-size="22" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="22.0">CH</tspan><tspan dy="6.6" font-size="15.4">3</tspan></text><line x1="690.0" y1="444.0" x2="690.0" y2="480.0" stroke="#24292f" stroke-width="2.4" stroke-linecap="round"/><text x="690.0" y="501.8" font-size="22" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="22.0">CH</tspan><tspan dy="6.6" font-size="15.4">3</tspan></text><text x="690.0" y="538.0" font-size="14" text-anchor="middle" fill="#57606a" font-weight="normal" xml:space="preserve"><tspan>tert-butyl alcohol (2-methylpropan-2-ol)</tspan></text><text x="30.0" y="570.0" font-size="14" text-anchor="start" fill="#c0392b" font-weight="bold" xml:space="preserve"><tspan>Rate = k[(CH₃)₃CBr]: the nucleophile is not involved in the slow step, so doubling [HO⁻] does not change the rate.</tspan></text></svg>