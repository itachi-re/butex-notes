<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" font-family="Georgia, serif" font-size="16" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="780" height="380" fill="#fff"/>
<text x="20" y="28" font-size="20" font-weight="bold">Sandmeyer &amp; Gattermann reactions of aryl diazonium salts</text>

<text x="20" y="60" font-size="18">Ar–NH2  --(NaNO2 / HCl, 0–5°C)-->  Ar–N≡N⁺ Cl⁻  (aryl diazonium salt)</text>

<g transform="translate(20,90)">
<rect x="0" y="0" width="230" height="110" fill="#eef6ff" stroke="#333"/>
<text x="10" y="20" font-weight="bold">Sandmeyer reaction</text>
<text x="10" y="42">Cu2Cl2/HCl → Ar–Cl</text>
<text x="10" y="60">Cu2Br2/HBr → Ar–Br</text>
<text x="10" y="78">CuCN/KCN  → Ar–CN</text>
<text x="10" y="96" font-size="13" fill="#555">cuprous salt catalyst needed</text>
</g>

<g transform="translate(280,90)">
<rect x="0" y="0" width="230" height="110" fill="#fff4e6" stroke="#333"/>
<text x="10" y="20" font-weight="bold">Gattermann reaction</text>
<text x="10" y="42">Cu powder / HCl → Ar–Cl</text>
<text x="10" y="60">Cu powder / HBr → Ar–Br</text>
<text x="10" y="78">Cu powder / KCN → Ar–CN</text>
<text x="10" y="96" font-size="13" fill="#555">same products, uses Cu metal directly</text>
</g>

<g transform="translate(540,90)">
<rect x="0" y="0" width="220" height="110" fill="#efe6ff" stroke="#333"/>
<text x="10" y="20" font-weight="bold">Mechanism type</text>
<text x="10" y="42">Radical–nucleophilic</text>
<text x="10" y="60">substitution at the</text>
<text x="10" y="78">diazonium carbon;</text>
<text x="10" y="96">N2 gas is released</text>
</g>

<text x="20" y="240" font-weight="bold">Why Cu(I) is essential:</text>
<text x="30" y="264">Cu(I) reduces Ar–N2+ by one electron, generating an aryl radical (Ar•) + N2.</text>
<text x="30" y="288">The aryl radical then abstracts X (Cl, Br, CN) from the copper(II) halide/cyanide complex,</text>
<text x="30" y="312">re-forming Cu(I) and completing the catalytic cycle. Without Cu(I), the diazonium salt</text>
<text x="30" y="336">is unstable and decomposes to phenol (with H2O) instead of giving the halide/nitrile.</text>
<text x="20" y="365" font-size="14" fill="#555">Gattermann = "poor man's Sandmeyer": lower yields, no separate cuprous-salt preparation needed.</text>
</svg>
