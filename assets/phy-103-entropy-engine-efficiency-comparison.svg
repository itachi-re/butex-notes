<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" width="640" height="410" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Actual engine versus Carnot engine efficiency</title>
<desc>Bar chart: actual engine efficiency 21.3 percent versus reversible engine efficiency 26.8 percent.</desc>
<defs><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="my" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#777777"/></marker></defs>
<rect x="0" y="0" width="640" height="410" fill="#ffffff"/>
<text x="320" y="28" fill="#222222" font-size="15" text-anchor="middle" font-weight="bold">Efficiency: actual engine vs perfect reversible engine (100 °C source, 0 °C sink)</text>
<line x1="90" y1="320" x2="90" y2="60" stroke="#222222" stroke-width="2" marker-end="url(#mk)"/>
<line x1="90" y1="320" x2="560" y2="320" stroke="#222222" stroke-width="2" marker-end="url(#mk)"/>
<text x="76" y="68" fill="#222222" font-size="15" text-anchor="end" font-weight="bold"></text>
<text x="568" y="325" fill="#222222" font-size="15" text-anchor="start" font-weight="bold"></text>
<text x="90" y="52" fill="#222222" font-size="15" text-anchor="middle" font-weight="bold">η (%)</text>
<line x1="90" y1="240" x2="560" y2="240" stroke="#777777" stroke-width="1" stroke-dasharray="6 5"/>
<line x1="90" y1="160" x2="560" y2="160" stroke="#777777" stroke-width="1" stroke-dasharray="6 5"/>
<line x1="90" y1="80" x2="560" y2="80" stroke="#777777" stroke-width="1" stroke-dasharray="6 5"/>
<text x="80" y="325" fill="#222222" font-size="14" text-anchor="end" font-weight="normal">0</text>
<text x="80" y="245" fill="#222222" font-size="14" text-anchor="end" font-weight="normal">10</text>
<text x="80" y="165" fill="#222222" font-size="14" text-anchor="end" font-weight="normal">20</text>
<text x="80" y="85" fill="#222222" font-size="14" text-anchor="end" font-weight="normal">30</text>
<rect x="170" y="149.6" width="120" height="170.4" rx="0" fill="#1f5fbf" fill-opacity="0.3" stroke="#1f5fbf" stroke-width="2"/>
<rect x="390" y="105.6" width="120" height="214.4" rx="0" fill="#2e7d32" fill-opacity="0.3" stroke="#2e7d32" stroke-width="2"/>
<text x="230" y="139.6" fill="#1f5fbf" font-size="15" text-anchor="middle" font-weight="bold">η = 21.3 %</text>
<text x="450" y="95.6" fill="#2e7d32" font-size="15" text-anchor="middle" font-weight="bold">η = 26.8 %</text>
<text x="230" y="344" fill="#222222" font-size="14" text-anchor="middle" font-weight="normal">Actual engine</text>
<text x="450" y="344" fill="#222222" font-size="14" text-anchor="middle" font-weight="normal">Reversible (Carnot) engine</text>
<text x="230" y="364" fill="#222222" font-size="14" text-anchor="middle" font-weight="normal">3×10⁶ cal per hp-hour</text>
<text x="450" y="364" fill="#222222" font-size="14" text-anchor="middle" font-weight="normal">1 − T₂/T₁ = 1 − 273/373</text>
<text x="320" y="394" fill="#222222" font-size="15" text-anchor="middle" font-weight="bold">η(actual) / η(Carnot) = 0.795, i.e. about 79.5 % of the ideal</text>
</svg>
