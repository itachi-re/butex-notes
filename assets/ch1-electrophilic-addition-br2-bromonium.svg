<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Electrophilic addition of bromine to ethene via a bromonium ion</title><desc>Ethene attacks Br2 to give a cyclic bromonium ion; bromide opens the ring from the back to give 1,2-dibromoethane.</desc><defs><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c0392b"/></marker><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#24292f"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0969da"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1a7f37"/></marker><marker id="mgy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#57606a"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#bc4c00"/></marker></defs><rect width="900" height="430" fill="#ffffff"/><text x="30.0" y="36.0" font-size="16" text-anchor="start" fill="#57606a" font-weight="bold" xml:space="preserve"><tspan>Step 1: π electrons polarise Br–Br and form a cyclic bromonium ion</tspan></text><text x="50.0" y="123.4" font-size="24" text-anchor="start" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan font-size="24.0">H</tspan><tspan dy="7.2" font-size="16.8">2</tspan><tspan dy="-7.2" font-size="24.0">C</tspan></text><line x1="97.0" y1="118.6" x2="125.0" y2="118.6" stroke="#24292f" stroke-width="2.4" stroke-linecap="roun