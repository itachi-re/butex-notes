<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="520" height="320" font-family="Arial, Helvetica, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Triangle inequality on the Argand diagram</title>
  <rect width="520" height="320" fill="#ffffff"/>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker>
    <marker id="ab" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1f3a8a"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b91c1c"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#047857"/></marker>
  </defs>
  <line x1="30" y1="280" x2="490" y2="280" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="50" y1="300" x2="50" y2="20" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="495" y="285" fill="#333">Re</text>
  <text x="58" y="26" fill="#333">Im</text>
  <line x1="50" y1="280" x2="230" y2="220" stroke="#1f3a8a" stroke-width="3" marker-end="url(#ab)"/>
  <line x1="230" y1="220" x2="360" y2="100" stroke="#b91c1c" stroke-width="3" marker-end="url(#ar)"/>
  <line x1="50" y1="280" x2="360" y2="100" stroke="#047857" stroke-width="3" marker-end="url(#ag)"/>
  <line x1="50" y1="280" x2="180" y2="160" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="180" y1="160" x2="360" y2="100" stroke="#1f3a8a" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="120" y="268" fill="#1f3a8a" font-weight="bold">z1</text>
  <text x="305" y="170" fill="#b91c1c" font-weight="bold">z2</text>
  <text x="170" y="170" fill="#047857" font-weight="bold">z1 + z2</text>
  <text x="365" y="100" fill="#047857">z1 + z2</text>
  <text x="120" y="320" fill="#333">|z1 + z2| ≤ |z1| + |z2|  (one side of a triangle is at most the sum of the other two)</text>
</svg>
