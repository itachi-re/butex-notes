<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="Georgia, serif" font-size="15" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="760" height="320" fill="#fff"/>
<text x="20" y="28" font-size="18" font-weight="bold">Chromophore and auxochrome — azobenzene example</text>

<g transform="translate(60,70)">
<polygon points="0,30 25,15 50,30 50,60 25,75 0,60" fill="none" stroke="black" stroke-width="1.5"/>
<text x="55" y="42" font-size="16">N=N</text>
<polygon points="115,30 140,15 165,30 165,60 140,75 115,60" fill="none" stroke="black" stroke-width="1.5"/>
<line x1="165" y1="45" x2="195" y2="45" stroke="black"/>
<text x="198" y="50" font-size="14">NMe2</text>
</g>
<rect x="105" y="90" width="20" height="45" fill="none" stroke="#c00" stroke-dasharray="3,2"/>
<text x="60" y="170" font-size="14" fill="#c00">chromophore = –N=N– (azo group): a conjugated,</text>
<text x="60" y="190" font-size="14" fill="#c00">unsaturated group that itself absorbs visible/UV light</text>
<rect x="255" y="90" width="55" height="45" fill="none" stroke="#06c" stroke-dasharray="3,2"/>
<text x="270" y="225" font-size="14" fill="#06c">auxochrome = –NMe2 (or –OH, –NH2, –SO3H):</text>
<text x="270" y="245" font-size="14" fill="#06c">an electron-donating/withdrawing group that shifts</text>
<text x="270" y="265" font-size="14" fill="#06c">λmax and intensifies colour, but has no colour alone</text>

<text x="20" y="300" font-size="14" fill="#555">Dye = aromatic system + chromophore + one or more auxochromes (which also often confer water-solubility / fibre affinity).</text>
</svg>
