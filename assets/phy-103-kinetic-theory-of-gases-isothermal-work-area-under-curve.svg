<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
    <rect width="500" height="400" fill="#ffffff"/>
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 Z" fill="#000"/>
        </marker>
    </defs>
    <!-- Axes -->
    <path d="M 60,340 L 450,340" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 60,340 L 60,50" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="240" y="380" font-family="sans-serif" font-size="16">Volume, V</text>
    <text x="10" y="200" font-family="sans-serif" font-size="16" transform="rotate(-90 20,200)">Pressure, P</text>
    
    <!-- Isotherm Curve -->
    <path d="M 100,90 Q 200,160 380,260" stroke="#0072b2" stroke-width="3" fill="none"/>
    
    <!-- Area shaded -->
    <path d="M 130,118 Q 200,160 330,227 L 330,340 L 130,340 Z" fill="#0072b2" opacity="0.2"/>
    
    <!-- Vertical lines -->
    <path d="M 130,118 L 130,340" stroke="#000" stroke-width="1" stroke-dasharray="5,5"/>
    <path d="M 330,227 L 330,340" stroke="#000" stroke-width="1" stroke-dasharray="5,5"/>
    
    <text x="120" y="360" font-family="sans-serif" font-size="14">V_1</text>
    <text x="320" y="360" font-family="sans-serif" font-size="14">V_2</text>
    <text x="110" y="110" font-family="sans-serif" font-size="14">P_1, V_1</text>
    <text x="340" y="225" font-family="sans-serif" font-size="14">P_2, V_2</text>
    
    <!-- Area text -->
    <text x="190" y="280" font-family="sans-serif" font-size="16" fill="#000">Work Done = Area</text>
    
    <!-- Small strip -->
    <rect x="230" y="184" width="10" height="156" fill="#d55e00" opacity="0.5"/>
    <text x="210" y="175" font-family="sans-serif" font-size="14" fill="#d55e00">P</text>
    <text x="225" y="355" font-family="sans-serif" font-size="14" fill="#d55e00">dV</text>
</svg>