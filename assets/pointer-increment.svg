<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Difference between *p++ and (*p)++" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Difference between *p++ and (*p)++</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="259" fill="#ffffff" stroke="#cfd8dc" rx="8"/>
<text x="380" y="26.9" font-size="14" text-anchor="middle" font-weight="bold" fill="#1a1a1a" font-family="Consolas, Menlo, monospace"><tspan x="380" dy="0">b = 3 ;  func2(&amp;b)   →   inside: int *p = &amp;b</tspan></text><text x="190" y="57.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#1a1a1a" font-family="Consolas, Menlo, monospace"><tspan x="190" dy="0">*p++   ≡   *(p++)</tspan></text><rect x="90" y="130" width="90" height="50" fill="#eceff1" stroke="#607d8b" stroke-width="1.5"/><text x="135.0" y="159.9" font-size="14" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="135.0" dy="0">b = 3</tspan></text><rect x="200" y="130" width="90" height="50" fill="#eceff1" stroke="#607d8b" stroke-width="1.5" stroke-dasharray="5,4"/><text x="245.0" y="159.9" font-size="14" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="245.0" dy="0">?</tspan></text><text x="135" y="201.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#78909c" font-family="Consolas, Menlo, monospace"><tspan x="135" dy="0">@1000</tspan></text><text x="245" y="201.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#78909c" font-family="Consolas, Menlo, monospace"><tspan x="245" dy="0">@1004</tspan></text><rect x="140" y="66" width="100" height="30" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/><text x="190.0" y="85.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" font-family="Consolas, Menlo, monospace"><tspan x="190.0" dy="0">p = 1004</tspan></text><polyline points="190,96 245,128" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><text x="570" y="57.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#1a1a1a" font-family="Consolas, Menlo, monospace"><tspan x="570" dy="0">(*p)++</tspan></text><rect x="470" y="130" width="90" height="50" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/><text x="515.0" y="159.9" font-size="14" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="515.0" dy="0">b = 4</tspan></text><rect x="580" y="130" width="90" height="50" fill="#eceff1" stroke="#607d8b" stroke-width="1.5" stroke-dasharray="5,4"/><text x="625.0" y="159.9" font-size="14" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="625.0" dy="0">?</tspan></text><text x="515" y="201.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#78909c" font-family="Consolas, Menlo, monospace"><tspan x="515" dy="0">@1000</tspan></text><text x="625" y="201.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#78909c" font-family="Consolas, Menlo, monospace"><tspan x="625" dy="0">@1004</tspan></text><rect x="520" y="66" width="100" height="30" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/><text x="570.0" y="85.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" font-family="Consolas, Menlo, monospace"><tspan x="570.0" dy="0">p = 1000</tspan></text><polyline points="570,96 515,128" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><text x="190" y="224.425" font-size="13" text-anchor="middle" font-weight="normal" fill="#c62828" ><tspan x="190" dy="0">value read, then the POINTER moves</tspan><tspan x="190" dy="16.25">b is unchanged → b = 3</tspan></text><text x="570" y="224.425" font-size="13" text-anchor="middle" font-weight="normal" fill="#2e7d32" ><tspan x="570" dy="0">the VALUE at p is incremented</tspan><tspan x="570" dy="16.25">b becomes 4</tspan></text><polyline points="380,40 380,250" fill="none" stroke="#b0bec5" stroke-width="1.6"/>
</svg>