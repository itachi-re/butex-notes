<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430" width="660" height="430" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Body in an isothermal enclosure illustrating Kirchhoff law of radiation</title>
<desc id="d">A body with absorptive power a sits inside an enclosure whose walls are at uniform temperature T. It absorbs a times E_b and emits E, and at equilibrium E divided by a equals E_b.</desc>
<defs>
<marker id="ah-ink" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto"><polygon points="0 0,7 3,0 6" fill="#1b1b1b"/></marker>
<marker id="as-ink" markerWidth="7" markerHeight="6" refX="0.5" refY="3" orient="auto"><polygon points="7 0,0 3,7 6" fill="#1b1b1b"/></marker>
<marker id="ah-blue" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto"><polygon points="0 0,7 3,0 6" fill="#1f5fbf"/></marker>
<marker id="as-blue" markerWidth="7" markerHeight="6" refX="0.5" refY="3" orient="auto"><polygon points="7 0,0 3,7 6" fill="#1f5fbf"/></marker>
<marker id="ah-red" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto"><polygon points="0 0,7 3,0 6" fill="#c62828"/></marker>
<marker id="as-red" markerWidth="7" markerHeight="6" refX="0.5" refY="3" orient="auto"><polygon points="7 0,0 3,7 6" fill="#c62828"/></marker>
<marker id="ah-green" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto"><polygon points="0 0,7 3,0 6" fill="#2e7d32"/></marker>
<marker id="as-green" markerWidth="7" markerHeight="6" refX="0.5" refY="3" orient="auto"><polygon points="7 0,0 3,7 6" fill="#2e7d32"/></marker>
<marker id="ah-grey" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto"><polygon points="0 0,7 3,0 6" fill="#8a8a8a"/></marker>
<marker id="as-grey" markerWidth="7" markerHeight="6" refX="0.5" refY="3" orient="auto"><polygon points="7 0,0 3,7 6" fill="#8a8a8a"/></marker>
</defs>
<rect x="0" y="0" width="660" height="430" fill="#ffffff"/>
<rect x="50.0" y="60.0" width="560.0" height="300.0" fill="#8a8a8a" fill-opacity="0.08" stroke="#1b1b1b" stroke-width="3.5"/>
<text x="330.0" y="36.0" fill="#1b1b1b" font-size="18" text-anchor="middle">Enclosure with walls at uniform temperature T</text>
<line x1="490.0" y1="210.0" x2="392.0" y2="210.0" stroke="#1f5fbf" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah-blue)"/>
<line x1="330.0" y1="298.0" x2="330.0" y2="272.0" stroke="#1f5fbf" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah-blue)"/>
<line x1="170.0" y1="210.0" x2="268.0" y2="210.0" stroke="#1f5fbf" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah-blue)"/>
<line x1="330.0" y1="122.0" x2="330.0" y2="148.0" stroke="#1f5fbf" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah-blue)"/>
<line x1="362.5" y1="242.5" x2="414.9" y2="294.9" stroke="#c62828" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah-red)"/>
<line x1="297.5" y1="242.5" x2="245.1" y2="294.9" stroke="#c62828" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah-red)"/>
<line x1="297.5" y1="177.5" x2="245.1" y2="125.1" stroke="#c62828" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah-red)"/>
<line x1="362.5" y1="177.5" x2="414.9" y2="125.1" stroke="#c62828" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah-red)"/>
<circle cx="330.0" cy="210.0" r="40" fill="#8a8a8a" fill-opacity="0.35" stroke="#1b1b1b" stroke-width="2.5"/>
<text x="330.0" y="206.0" fill="#1b1b1b" font-size="16" text-anchor="middle">body</text>
<text x="330.0" y="226.0" fill="#1b1b1b" font-size="16" text-anchor="middle">a, E</text>
<g fill="#1f5fbf"><text xml:space="preserve" x="130.8" y="196.0" font-size="16" text-anchor="start">incident E</text><text xml:space="preserve" x="210.3" y="200.2" font-size="14" text-anchor="start">b</text></g>
<text x="470.0" y="118.0" fill="#c62828" font-size="16" text-anchor="middle">emitted E</text>
<g fill="#1b1b1b"><text xml:space="preserve" x="208.1" y="392.0" font-size="16" text-anchor="start">absorbed = a E</text><text xml:space="preserve" x="331.6" y="396.2" font-size="14" text-anchor="start">b</text><text xml:space="preserve" x="340.5" y="392.0" font-size="16" text-anchor="start">,  emitted = E</text></g>
<g fill="#1b1b1b"><text xml:space="preserve" x="194.9" y="418.0" font-size="16" text-anchor="start">equilibrium: E = a E</text><text xml:space="preserve" x="354.5" y="422.2" font-size="14" text-anchor="start">b</text><text xml:space="preserve" x="363.4" y="418.0" font-size="16" text-anchor="start">  →  E/a = E</text><text xml:space="preserve" x="456.2" y="422.2" font-size="14" text-anchor="start">b</text></g>
</svg>
