<text x="580.3" y="69.7" text-anchor="start" font-size="11" fill="#57606a" font-weight="normal" xml:space="preserve"><tspan>particles stay on the surface</tspan></text>
<text x="39.9" y="289.4" text-anchor="start" font-size="13" fill="#424a53" font-weight="normal" xml:space="preserve"><tspan>soluble · penetrates the fibre · has affinity for it</tspan></text>
<text x="108.5" y="308.1" text-anchor="start" font-size="12" fill="#57606a" font-weight="normal" xml:space="preserve"><tspan>e.g. methyl orange, indigo, alizarin</tspan></text>
<text x="498.2" y="289.4" text-anchor="start" font-size="13" fill="#424a53" font-weight="normal" xml:space="preserve"><tspan>insoluble · applied as dispersion with a binder</tspan></text>
<text x="472.2" y="308.1" text-anchor="start" font-size="12" fill="#57606a" font-weight="normal" xml:space="preserve"><tspan>e.g. TiO</tspan><tspan dy="4" font-size="9">2</tspan><tspan dy="-4">, carbon black, Prussian blue, phthalocyanine blue</tspan></text>
