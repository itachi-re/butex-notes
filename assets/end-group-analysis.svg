<svg viewBox="0 0 560 260" xmlns="http://www.w3.org/2000/svg" font-family="Arial" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<text x="280" y="20" text-anchor="middle" font-weight="bold">End-group analysis of peptides</text>

<text x="20" y="55" font-weight="bold">Sanger's method (N-terminal):</text>
<text x="20" y="78" font-size="11">Peptide + FDNB (1-fluoro-2,4-dinitrobenzene), mild base →</text>
<text x="20" y="98" font-size="11">DNP–peptide (DNP attaches to free N-terminal –NH₂)</text>
<text x="20" y="118" font-size="11">→ complete acid hydrolysis (6N HCl) → DNP-amino acid (yellow,</text>
<text x="20" y="138" font-size="11">identified by chromatography) + free amino acids</text>

<text x="20" y="175" font-weight="bold">Edman degradation (N-terminal, sequential):</text>
<text x="20" y="198" font-size="11">Peptide + PITC (phenylisothiocyanate) → PTC-peptide → mild acid</text>
<text x="20" y="218" font-size="11">cleaves only N-terminal residue as PTH-amino acid (identified),</text>
<text x="20" y="238" font-size="11">shortened peptide remains intact — allows repeated cycles (sequencing)</text>
</svg>
