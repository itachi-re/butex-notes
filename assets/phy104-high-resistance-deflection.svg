<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .lbl { font-size: 15px; fill: #1a1a1a; }
    .small { font-size: 12px; fill: #333333; }
    .wire { stroke: #1a1a1a; stroke-width: 2; fill: none; }
  </style>

  <text x="20" y="28" class="lbl" font-weight="bold">High resistance by the method of deflection</text>

  <!-- Battery -->
  <line x1="70" y1="80" x2="70" y2="200" class="wire"/>
  <line x1="55" y1="120" x2="85" y2="120" class="wire"/>
  <line x1="60" y1="130" x2="80" y2="130" class="wire" stroke-width="4"/>
  <line x1="55" y1="150" x2="85" y2="150" class="wire"/>
  <line x1="60" y1="160" x2="80" y2="160" class="wire" stroke-width="4"/>
  <text x="20" y="145" class="small">Battery</text>
  <text x="20" y="159" class="small">E</text>

  <!-- Key -->
  <line x1="70" y1="80" x2="180" y2="80" class="wire"/>
  <line x1="140" y1="80" x2="160" y2="60" class="wire"/>
  <text x="135" y="50" class="small">Key K</text>

  <!-- Resistance box R -->
  <rect x="180" y="60" width="80" height="40" fill="none" class="wire"/>
  <text x="185" y="55" class="small">Resistance box R</text>
  <text x="195" y="85" class="lbl">R</text>

  <!-- Unknown high resistance X (with a switch to short it out) -->
  <rect x="300" y="60" width="90" height="40" fill="none" class="wire" stroke-dasharray="5,3"/>
  <text x="300" y="55" class="small">Unknown high resistance</text>
  <text x="330" y="85" class="lbl">X</text>
  <line x1="300" y1="45" x2="390" y2="45" class="wire" stroke-dasharray="2,2"/>
  <line x1="345" y1="45" x2="345" y2="30" class="wire" stroke-dasharray="2,2"/>
  <text x="300" y="25" class="small">plug key P (shorts X out for the 1st reading)</text>

  <!-- Wires to galvanometer -->
  <line x1="260" y1="80" x2="300" y2="80" class="wire"/>
  <line x1="390" y1="80" x2="440" y2="80" class="wire"/>
  <line x1="440" y1="80" x2="440" y2="120" class="wire"/>

  <!-- Tangent galvanometer (circular coil with compass) -->
  <circle cx="440" cy="180" r="55" fill="none" class="wire"/>
  <circle cx="440" cy="180" r="55" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="1,4"/>
  <circle cx="440" cy="180" r="14" fill="#f5f5f5" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="440" y1="167" x2="440" y2="193" stroke="#c0392b" stroke-width="2"/>
  <text x="390" y="250" class="small">Tangent galvanometer (coil in the</text>
  <text x="390" y="264" class="small">magnetic meridian, compass at centre)</text>

  <!-- Commutator / reversing key -->
  <text x="500" y="150" class="small">Reversing key</text>
  <text x="500" y="164" class="small">(commutator)</text>

  <!-- close the loop back to battery -->
  <line x1="440" y1="235" x2="440" y2="280" class="wire"/>
  <line x1="440" y1="280" x2="70" y2="280" class="wire"/>
  <line x1="70" y1="280" x2="70" y2="200" class="wire"/>

  <text x="60" y="315" class="small">Circuit: E &#8594; K &#8594; R &#8594; X (with shorting key P) &#8594; tangent galvanometer &#8594; back to E.</text>
</svg>
