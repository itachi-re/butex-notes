<svg xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14" width="680" height="400" viewBox="0 0 680 400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Lenz's law with a magnet and a coil</title>
<defs>
<marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#1f2937"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#1d4ed8"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#dc2626"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#15803d"/></marker>
</defs>
<rect width="680" height="400" fill="#ffffff"/>
<text x="40" y="28" font-weight="bold" fill="#1f2937">(a) Magnet approaches the coil: flux increases</text>
<line x1="75" y1="75" x2="150" y2="75" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ab)"/>
<text x="160" y="80" fill="#1d4ed8">v</text>
<rect x="60" y="100" width="50" height="40" fill="#bfdbfe" stroke="#1f2937"/><text x="80" y="125" fill="#1e3a8a" font-weight="bold">S</text>
<rect x="110" y="100" width="50" height="40" fill="#fecaca" stroke="#1f2937"/><text x="130" y="125" fill="#991b1b" font-weight="bold">N</text>
<ellipse cx="265" cy="120" rx="10" ry="38" fill="none" stroke="#92400e" stroke-width="2.5"/>
<ellipse cx="285" cy="120" rx="10" ry="38" fill="none" stroke="#92400e" stroke-width="2.5"/>
<ellipse cx="305" cy="120" rx="10" ry="38" fill="none" stroke="#92400e" stroke-width="2.5"/>
<ellipse cx="325" cy="120" rx="10" ry="38" fill="none" stroke="#92400e" stroke-width="2.5"/>
<text x="236" y="76" fill="#991b1b" font-weight="bold">N</text>
<text x="348" y="76" fill="#1e3a8a" font-weight="bold">S</text>
<text x="400" y="92" fill="#1f2937">Induced current: anticlockwise</text>
<text x="400" y="110" fill="#6b7280">(seen from the magnet side)</text>
<text x="400" y="134" fill="#1f2937">Face near magnet = N: repels the</text>
<text x="400" y="152" fill="#1f2937">approaching N pole (opposes motion).</text>
<line x1="40" y1="200" x2="640" y2="200" stroke="#d1d5db"/>
<text x="40" y="228" font-weight="bold" fill="#1f2937">(b) Magnet moves away: flux decreases</text>
<line x1="150" y1="275" x2="75" y2="275" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ab)"/>
<text x="160" y="280" fill="#1d4ed8">v</text>
<rect x="60" y="300" width="50" height="40" fill="#bfdbfe" stroke="#1f2937"/><text x="80" y="325" fill="#1e3a8a" font-weight="bold">S</text>
<rect x="110" y="300" width="50" height="40" fill="#fecaca" stroke="#1f2937"/><text x="130" y="325" fill="#991b1b" font-weight="bold">N</text>
<ellipse cx="265" cy="320" rx="10" ry="38" fill="none" stroke="#92400e" stroke-width="2.5"/>
<ellipse cx="285" cy="320" rx="10" ry="38" fill="none" stroke="#92400e" stroke-width="2.5"/>
<ellipse cx="305" cy="320" rx="10" ry="38" fill="none" stroke="#92400e" stroke-width="2.5"/>
<ellipse cx="325" cy="320" rx="10" ry="38" fill="none" stroke="#92400e" stroke-width="2.5"/>
<text x="236" y="276" fill="#1e3a8a" font-weight="bold">S</text>
<text x="348" y="276" fill="#991b1b" font-weight="bold">N</text>
<text x="400" y="292" fill="#1f2937">Induced current: clockwise</text>
<text x="400" y="310" fill="#6b7280">(seen from the magnet side)</text>
<text x="400" y="334" fill="#1f2937">Face near magnet = S: attracts the</text>
<text x="400" y="352" fill="#1f2937">receding N pole (opposes motion).</text>
<text x="40" y="385" fill="#6b7280">Induced emf = - N dΦ/dt : the minus sign is Lenz's law.</text>
</svg>
