<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow08" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#222222"/>
    </marker>
  </defs>
  <rect width="700" height="420" fill="#ffffff"/>

  <!-- axes -->
  <line x1="70" y1="360" x2="640" y2="360" stroke="#222222" stroke-width="2" marker-end="url(#arrow08)"/>
  <line x1="70" y1="360" x2="70" y2="40" stroke="#222222" stroke-width="2" marker-end="url(#arrow08)"/>
  <text x="650" y="365" font-size="15" fill="#222222">V</text>
  <text x="60" y="32" font-size="15" fill="#222222">P</text>

  <!-- outer arbitrary reversible cycle (smooth closed curve) -->
  <path d="M 150,300 C 180,150 300,80 400,80 C 500,80 560,180 560,240 C 560,300 400,340 300,330 C 220,323 160,320 150,300 Z"
        fill="none" stroke="#333333" stroke-width="3"/>
  <text x="380" y="60" text-anchor="middle" font-size="13" fill="#333333" font-weight="bold">Arbitrary reversible cycle</text>

  <!-- staircase of small carnot cells: alternating isotherms (solid, curved) and adiabats (dashed, steeper) -->
  <g stroke-width="1.3">
    <!-- adiabats: near-vertical dashed segments -->
    <path d="M 200,270 C 210,220 220,170 230,120" fill="none" stroke="#b2182b" stroke-dasharray="5,4"/>
    <path d="M 270,310 C 280,240 290,170 300,105" fill="none" stroke="#b2182b" stroke-dasharray="5,4"/>
    <path d="M 350,325 C 365,240 375,150 390,85" fill="none" stroke="#b2182b" stroke-dasharray="5,4"/>
    <path d="M 430,325 C 450,250 470,160 480,95" fill="none" stroke="#b2182b" stroke-dasharray="5,4"/>
    <path d="M 500,310 C 520,250 535,190 545,140" fill="none" stroke="#b2182b" stroke-dasharray="5,4"/>

    <!-- isotherms: gently curved solid segments connecting adiabats, forming small carnot cells -->
    <path d="M 200,270 C 235,255 255,250 270,255" fill="none" stroke="#2166ac"/>
    <path d="M 230,222 C 260,205 280,200 300,203" fill="none" stroke="#2166ac"/>
    <path d="M 240,175 C 270,158 295,153 320,157" fill="none" stroke="#2166ac"/>
    <path d="M 250,130 C 285,112 320,108 350,113" fill="none" stroke="#2166ac"/>

    <path d="M 300,105 C 330,95 355,92 375,95" fill="none" stroke="#2166ac"/>
    <path d="M 320,157 C 350,145 375,140 400,143" fill="none" stroke="#2166ac"/>
    <path d="M 350,203 C 385,192 410,188 430,192" fill="none" stroke="#2166ac"/>
    <path d="M 370,255 C 405,245 430,240 455,244" fill="none" stroke="#2166ac"/>
  </g>

  <!-- legend -->
  <line x1="120" y1="395" x2="150" y2="395" stroke="#2166ac" stroke-width="2.5"/>
  <text x="158" y="399" font-size="12" fill="#222222">isotherm (Q exchanged reversibly)</text>
  <line x1="380" y1="395" x2="410" y2="395" stroke="#b2182b" stroke-width="2.5" stroke-dasharray="5,4"/>
  <text x="418" y="399" font-size="12" fill="#222222">adiabat (no heat exchange)</text>

  <text x="355" y="20" text-anchor="middle" font-size="12" fill="#555555">As the number of small Carnot cells → ∞, the staircase converges onto the true cycle, so Σ δQ/T → ∮ δQ/T.</text>
</svg>
