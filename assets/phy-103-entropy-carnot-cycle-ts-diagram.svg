<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Carnot cycle on a T-S diagram</title>
<desc>The Carnot cycle is a rectangle on the T-S diagram; area equals work.</desc>
<defs><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="my" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#777777"/></marker></defs>
<rect x="0" y="0" width="760" height="410" fill="#ffffff"/>
<text x="380" y="26" fill="#222222" font-size="16" text-anchor="middle" font-weight="bold">Carnot cycle on the T–S diagram (a rectangle)</text>
<line x1="60" y1="340" x2="60" y2="50" stroke="#222222" stroke-width="2" marker-end="url(#mk)"/>
<line x1="60" y1="340" x2="700" y2="340" stroke="#222222" stroke-width="2" marker-end="url(#mk)"/>
<text x="46" y="58" fill="#222222" font-size="15" text-anchor="end" font-weight="bold">T</text>
<text x="708" y="345" fill="#222222" font-size="15" text-anchor="start" font-weight="bold">S</text>
<rect x="300" y="110" width="240" height="140" rx="0" fill="#1f5fbf" fill-opacity="0.08" stroke="#1f5fbf" stroke-width="0"/>
<line x1="60" y1="110" x2="300" y2="110" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 5"/>
<line x1="60" y1="250" x2="300" y2="250" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 5"/>
<line x1="300" y1="250" x2="300" y2="340" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 5"/>
<line x1="540" y1="250" x2="540" y2="340" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 5"/>
<line x1="300" y1="110" x2="420.0" y2="110.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#mr)"/>
<line x1="420.0" y1="110.0" x2="540" y2="110" stroke="#c0392b" stroke-width="2.5"/>
<line x1="540" y1="110" x2="540.0" y2="180.0" stroke="#222222" stroke-width="2.5" marker-end="url(#mk)"/>
<line x1="540.0" y1="180.0" x2="540" y2="250" stroke="#222222" stroke-width="2.5"/>
<line x1="540" y1="250" x2="420.0" y2="250.0" stroke="#1f5fbf" stroke-width="2.5" marker-end="url(#mb)"/>
<line x1="420.0" y1="250.0" x2="300" y2="250" stroke="#1f5fbf" stroke-width="2.5"/>
<line x1="300" y1="250" x2="300.0" y2="180.0" stroke="#222222" stroke-width="2.5" marker-end="url(#mk)"/>
<line x1="300.0" y1="180.0" x2="300" y2="110" stroke="#222222" stroke-width="2.5"/>
<circle cx="300" cy="110" r="4.5" fill="#222222" stroke="#222222" stroke-width="1.5"/>
<circle cx="540" cy="110" r="4.5" fill="#222222" stroke="#222222" stroke-width="1.5"/>
<circle cx="540" cy="250" r="4.5" fill="#222222" stroke="#222222" stroke-width="1.5"/>
<circle cx="300" cy="250" r="4.5" fill="#222222" stroke="#222222" stroke-width="1.5"/>
<text x="50" y="115" fill="#222222" font-size="15" text-anchor="end" font-weight="bold">T₁</text>
<text x="50" y="255" fill="#222222" font-size="15" text-anchor="end" font-weight="bold">T₂</text>
<text x="300" y="362" fill="#222222" font-size="15" text-anchor="middle" font-weight="bold">S₁</text>
<text x="540" y="362" fill="#222222" font-size="15" text-anchor="middle" font-weight="bold">S₂</text>
<text x="288" y="106" fill="#222222" font-size="16" text-anchor="end" font-weight="bold">1</text>
<text x="552" y="106" fill="#222222" font-size="16" text-anchor="start" font-weight="bold">2</text>
<text x="552" y="266" fill="#222222" font-size="16" text-anchor="start" font-weight="bold">3</text>
<text x="288" y="266" fill="#222222" font-size="16" text-anchor="end" font-weight="bold">4</text>
<text x="420" y="92" fill="#c0392b" font-size="14" text-anchor="middle" font-weight="normal">1→2: Q₁ in, ΔS = +Q₁/T₁</text>
<text x="552" y="185" fill="#222222" font-size="14" text-anchor="start" font-weight="normal">2→3: adiabatic, ΔS = 0</text>
<text x="420" y="285" fill="#1f5fbf" font-size="14" text-anchor="middle" font-weight="normal">3→4: Q₂ out, ΔS = −Q₂/T₂</text>
<text x="290" y="185" fill="#222222" font-size="14" text-anchor="end" font-weight="normal">4→1: adiabatic, ΔS = 0</text>
<text x="420" y="172" fill="#222222" font-size="14" text-anchor="middle" font-weight="bold">Area = Q₁ − Q₂ = W</text>
<text x="420" y="200" fill="#222222" font-size="14" text-anchor="middle" font-weight="bold">net ΔS = 0</text>
<text x="380" y="394" fill="#222222" font-size="15" text-anchor="middle" font-weight="bold">ΔS(cycle) = Q₁/T₁ + 0 − Q₂/T₂ + 0 = 0</text>
</svg>
