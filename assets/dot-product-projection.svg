<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" width="520" height="260" font-family="Arial, Helvetica, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Dot product and projection of A on B</title>
  <rect width="520" height="260" fill="#ffffff"/>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1f3a8a"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b91c1c"/></marker>
  </defs>
  <line x1="60" y1="200" x2="440" y2="200" stroke="#1f3a8a" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="60" y1="200" x2="270" y2="80" stroke="#b91c1c" stroke-width="3" marker-end="url(#ar)"/>
  <line x1="270" y1="80" x2="270" y2="200" stroke="#555" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="60" y1="215" x2="270" y2="215" stroke="#047857" stroke-width="3"/>
  <path d="M110,200 A50,50 0 0 0 103,175" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="258" y="188" width="12" height="12" fill="none" stroke="#555"/>
  <text x="448" y="205" fill="#1f3a8a" font-weight="bold">B</text>
  <text x="278" y="78" fill="#b91c1c" font-weight="bold">A</text>
  <text x="118" y="190" fill="#333">θ</text>
  <text x="105" y="240" fill="#047857">projection of A on B = |A| cos θ = A·B / |B|</text>
  <text x="285" y="145" fill="#555">|A| sin θ</text>
</svg>
