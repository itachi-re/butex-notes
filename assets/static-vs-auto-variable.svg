<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Lifetime of static versus auto variables" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Lifetime of static versus auto variables</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="299" fill="#ffffff" stroke="#cfd8dc" rx="8"/>
<text x="480" y="27.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#1a1a1a" ><tspan x="480" dy="0">static vs automatic variable across three calls</tspan></text><text x="290" y="56.55" font-size="13" text-anchor="middle" font-weight="bold" fill="#455a64" ><tspan x="290" dy="0">1st call</tspan></text><text x="500" y="56.55" font-size="13" text-anchor="middle" font-weight="bold" fill="#455a64" ><tspan x="500" dy="0">2nd call</tspan></text><text x="710" y="56.55" font-size="13" text-anchor="middle" font-weight="bold" fill="#455a64" ><tspan x="710" dy="0">3rd call</tspan></text><text x="10" y="101.7" font-size="12" text-anchor="start" font-weight="bold" fill="#1a1a1a" font-family="Consolas, Menlo, monospace"><tspan x="10" dy="0">fun():</tspan><tspan x="10" dy="15.0">static int c = 0;</tspan></text><rect x="195" y="70" width="190" height="70" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/><text x="290.0" y="101.425" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="290.0" dy="0">prints 0</tspan><tspan x="290.0" dy="16.25">c: 0 → 1</tspan></text><polyline points="385,105 405,105" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><rect x="405" y="70" width="190" height="70" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/><text x="500.0" y="101.425" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="500.0" dy="0">prints 1</tspan><tspan x="500.0" dy="16.25">c: 1 → 2</tspan></text><polyline points="595,105 615,105" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><rect x="615" y="70" width="190" height="70" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/><text x="710.0" y="101.425" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="710.0" dy="0">prints 2</tspan><tspan x="710.0" dy="16.25">c: 2 → 3</tspan></text><text x="10" y="211.7" font-size="12" text-anchor="start" font-weight="bold" fill="#1a1a1a" font-family="Consolas, Menlo, monospace"><tspan x="10" dy="0">fun2():</tspan><tspan x="10" dy="15.0">int z = 0;   (auto)</tspan></text><rect x="195" y="180" width="190" height="70" fill="#eceff1" stroke="#607d8b" stroke-width="1.5"/><text x="290.0" y="211.425" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="290.0" dy="0">z = 0</tspan><tspan x="290.0" dy="16.25">destroyed on return</tspan></text><rect x="405" y="180" width="190" height="70" fill="#eceff1" stroke="#607d8b" stroke-width="1.5"/><text x="500.0" y="211.425" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="500.0" dy="0">z = 0</tspan><tspan x="500.0" dy="16.25">destroyed on return</tspan></text><rect x="615" y="180" width="190" height="70" fill="#eceff1" stroke="#607d8b" stroke-width="1.5"/><text x="710.0" y="211.425" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="710.0" dy="0">z = 0</tspan><tspan x="710.0" dy="16.25">destroyed on return</tspan></text><text x="480" y="284.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#455a64" ><tspan x="480" dy="0">static keeps its value between calls · auto is created fresh (garbage/initialised) every call</tspan></text>
</svg>