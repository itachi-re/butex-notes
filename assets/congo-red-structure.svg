<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" font-family="Georgia, serif" font-size="15" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="780" height="300" fill="#fff"/>
<text x="20" y="28" font-size="18" font-weight="bold">Congo red — direct/substantive azo dye (class: diazo, benzidine-based)</text>

<text x="30" y="70" font-size="15">NaO3S—[naphthyl-NH2]—N=N—[biphenyl]—N=N—[naphthyl-NH2]—SO3Na</text>
<line x1="20" y1="90" x2="760" y2="90" stroke="#ccc"/>
<text x="30" y="115" font-size="14" fill="#555">Core: benzidine (biphenyl-4,4'-diamine) diazotised at both ends and coupled</text>
<text x="30" y="137" font-size="14" fill="#555">twice to naphthionic acid (1-amino-naphthalene-4-sulfonic acid) — a symmetric</text>
<text x="30" y="159" font-size="14" fill="#555">bis-azo (disazo) dye: two –N=N– chromophores conjugated through the biphenyl core.</text>

<text x="20" y="195" font-weight="bold">Class:</text>
<text x="90" y="195" font-size="14">Direct (substantive) cotton dye — binds cellulose fibres directly via H-bonding</text>
<text x="90" y="217" font-size="14">and van der Waals forces, no mordant needed (large planar conjugated + polar –SO3Na groups).</text>
<text x="20" y="250" font-size="14" fill="#555">Classic acid–base indicator: blue in strongly acidic solution (pH below ~3), red above.</text>
</svg>
