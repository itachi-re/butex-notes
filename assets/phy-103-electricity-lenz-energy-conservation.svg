<title id="t">Sliding rod on rails in a magnetic field showing energy conservation</title>
<desc id="d">A rod of length l moves right at speed v on rails joined by a resistor R in a field B into the page. The induced current produces a magnetic force opposing the motion, so an external force must do work.</desc>
