<svg viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="560" height="300" fill="#ffffff"/>
<line x1="60" y1="250" x2="540" y2="250" stroke="#000" stroke-width="1.5"/>
<line x1="60" y1="250" x2="60" y2="30" stroke="#000" stroke-width="1.5"/>
<text x="300" y="280" font-size="14" text-anchor="middle">time t &#8594;</text>
<text x="25" y="140" font-size="14" transform="rotate(-90 25 140)">current i(t)</text>
<line x1="60" y1="50" x2="540" y2="50" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
<text x="545" y="54" font-size="12">i&#8320;=V/R</text>
<!-- growth -->
<path d="M60,250 C 140,60 200,50 300,50" stroke="#c00000" stroke-width="2" fill="none"/>
<text x="140" y="90" font-size="13" fill="#c00000">growth: i=i&#8320;(1-e^(-Rt/L))</text>
<!-- decay -->
<path d="M300,50 C 400,50 460,240 540,250" stroke="#1a5fb4" stroke-width="2" fill="none"/>
<text x="400" y="220" font-size="13" fill="#1a5fb4">decay: i=i&#8320;e^(-Rt/L)</text>
<line x1="300" y1="30" x2="300" y2="250" stroke="#000" stroke-width="1" stroke-dasharray="2,4"/>
<text x="300" y="20" font-size="16" text-anchor="middle" font-weight="bold">L-R Circuit: Growth and Decay of Current</text>
<text x="140" y="270" font-size="11" text-anchor="middle">t = L/R (time constant)</text>
</svg>
