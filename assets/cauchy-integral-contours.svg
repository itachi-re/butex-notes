<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320" font-family="Arial, Helvetica, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Contours for the Cauchy integral formula examples</title>
  <rect width="700" height="320" fill="#ffffff"/>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker>
  </defs>
  <text x="20" y="24" fill="#333" font-weight="bold">Q27: |z| = 1</text>
  <line x1="10" y1="160" x2="330" y2="160" stroke="#333" stroke-width="1.2" marker-end="url(#ah)"/>
  <line x1="60" y1="300" x2="60" y2="40" stroke="#333" stroke-width="1.2" marker-end="url(#ah)"/>
  <circle cx="60" cy="160" r="40" fill="#dbeafe" stroke="#1f3a8a" stroke-width="3"/>
  <circle cx="60" cy="160" r="4" fill="#b91c1c"/>
  <text x="68" y="150" fill="#b91c1c">z = 0 (inside)</text>
  <circle cx="220" cy="160" r="4" fill="#6b7280"/>
  <text x="170" y="148" fill="#6b7280">z = 4 (outside)</text>
  <text x="20" y="300" fill="#333">∮ = 2πi · g(0), g(z) = 1/(z−4)²</text>
  <text x="380" y="24" fill="#333" font-weight="bold">Q28: |z| = 3</text>
  <line x1="350" y1="160" x2="690" y2="160" stroke="#333" stroke-width="1.2" marker-end="url(#ah)"/>
  <line x1="520" y1="300" x2="520" y2="30" stroke="#333" stroke-width="1.2" marker-end="url(#ah)"/>
  <circle cx="520" cy="160" r="90" fill="#dbeafe" stroke="#1f3a8a" stroke-width="3"/>
  <circle cx="520" cy="130" r="4" fill="#b91c1c"/>
  <text x="530" y="128" fill="#b91c1c">z = i</text>
  <circle cx="520" cy="190" r="4" fill="#b91c1c"/>
  <text x="530" y="200" fill="#b91c1c">z = −i</text>
  <text x="380" y="300" fill="#333">both poles inside: ∮ = 2πi (sum of residues)</text>
</svg>
