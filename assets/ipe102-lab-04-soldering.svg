<svg viewBox="0 0 560 280" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
<style>.lbl{font-size:13px;fill:#222} .t{font-size:17px;font-weight:bold;fill:#111}</style>
<rect width="560" height="280" fill="#fff"/>
<text x="280" y="26" text-anchor="middle" class="t">Soldering — Low-Temperature Filler Joining</text>

<!-- two workpieces overlapped -->
<rect x="150" y="140" width="180" height="14" fill="#c9a34d" stroke="#333"/>
<rect x="150" y="154" width="180" height="14" fill="#c9a34d" stroke="#333" opacity="0.85"/>
<!-- filler bead at joint -->
<ellipse cx="240" cy="154" rx="35" ry="6" fill="#c0c0c0" stroke="#333"/>
<!-- soldering iron -->
<g transform="translate(300,80)">
<polygon points="0,60 20,60 10,90" fill="#999" stroke="#333"/>
<rect x="-10" y="20" width="30" height="45" fill="#666" stroke="#333"/>
<rect x="-30" y="10" width="20" height="20" fill="#8a5a2b"/>
<text x="0" y="10" text-anchor="middle" class="lbl">Soldering iron (heat source)</text>
</g>
<!-- solder wire -->
<line x1="90" y1="100" x2="150" y2="150" stroke="#bbb" stroke-width="4"/>
<text x="60" y="90" class="lbl">Solder wire (filler, low melting point)</text>

<text x="150" y="200" class="lbl">Base metal (not melted) — only the filler melts and wets the joint</text>
<line x1="240" y1="168" x2="240" y2="230" stroke="#666"/>
<text x="180" y="245" class="lbl">Joint filled with solidified solder</text>
</svg>
