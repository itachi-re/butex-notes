<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Infinitesimal Carnot cycle for the Clausius-Clapeyron equation</title>
<desc>Narrow cycle on a P-v diagram with isothermal vaporisation at T, P and condensation at T-dT, P-dP.</desc>
<defs><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="my" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#777777"/></marker></defs>
<rect x="0" y="0" width="800" height="400" fill="#ffffff"/>
<text x="400" y="24" fill="#222222" font-size="16" text-anchor="middle" font-weight="bold">Infinitesimal Carnot cycle on the liquid–vapour transition (dP, dT exaggerated)</text>
<line x1="70" y1="320" x2="70" y2="50" stroke="#222222" stroke-width="2" marker-end="url(#mk)"/>
<line x1="70" y1="320" x2="560" y2="320" stroke="#222222" stroke-width="2" marker-end="url(#mk)"/>
<text x="56" y="58" fill="#222222" font-size="15" text-anchor="end" font-weight="bold">P</text>
<text x="568" y="325" fill="#222222" font-size="15" text-anchor="start" font-weight="bold">v</text>
<path d="M140,120 L400,120 L406,190 L134,190 Z" fill="#1f5fbf" fill-opacity="0.1" stroke="#1f5fbf" stroke-width="0.01"/>
<line x1="140" y1="120" x2="270.0" y2="120.0" stroke="#c0392b" stroke-width="3" marker-end="url(#mr)"/>
<line x1="270.0" y1="120.0" x2="400" y2="120" stroke="#c0392b" stroke-width="3"/>
<line x1="400" y1="120" x2="403.0" y2="155.0" stroke="#222222" stroke-width="3" marker-end="url(#mk)"/>
<line x1="403.0" y1="155.0" x2="406" y2="190" stroke="#222222" stroke-width="3"/>
<line x1="406" y1="190" x2="270.0" y2="190.0" stroke="#1f5fbf" stroke-width="3" marker-end="url(#mb)"/>
<line x1="270.0" y1="190.0" x2="134" y2="190" stroke="#1f5fbf" stroke-width="3"/>
<line x1="134" y1="190" x2="137.0" y2="155.0" stroke="#222222" stroke-width="3" marker-end="url(#mk)"/>
<line x1="137.0" y1="155.0" x2="140" y2="120" stroke="#222222" stroke-width="3"/>
<circle cx="140" cy="120" r="4.5" fill="#222222" stroke="#222222" stroke-width="1.5"/>
<circle cx="400" cy="120" r="4.5" fill="#222222" stroke="#222222" stroke-width="1.5"/>
<circle cx="406" cy="190" r="4.5" fill="#222222" stroke="#222222" stroke-width="1.5"/>
<circle cx="134" cy="190" r="4.5" fill="#222222" stroke="#222222" stroke-width="1.5"/>
<line x1="70" y1="120" x2="140" y2="120" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 5"/>
<line x1="70" y1="190" x2="134" y2="190" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 5"/>
<line x1="140" y1="190" x2="140" y2="320" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 5"/>
<line x1="400" y1="190" x2="400" y2="320" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="62" y="125" fill="#222222" font-size="15" text-anchor="end" font-weight="bold">P</text>
<text x="62" y="195" fill="#222222" font-size="15" text-anchor="end" font-weight="bold">P − dP</text>
<text x="140" y="342" fill="#222222" font-size="15" text-anchor="middle" font-weight="bold">v₁</text>
<text x="400" y="342" fill="#222222" font-size="15" text-anchor="middle" font-weight="bold">v₂</text>
<text x="130" y="114" fill="#222222" font-size="16" text-anchor="end" font-weight="bold">A</text>
<text x="412" y="114" fill="#222222" font-size="16" text-anchor="start" font-weight="bold">B</text>
<text x="420" y="206" fill="#222222" font-size="16" text-anchor="start" font-weight="bold">C</text>
<text x="118" y="210" fill="#222222" font-size="16" text-anchor="end" font-weight="bold">D</text>
<text x="270" y="82" fill="#c0392b" font-size="14" text-anchor="middle" font-weight="normal">A→B: isothermal at T, P: heat absorbed Q₁ = L</text>
<text x="270" y="160" fill="#222222" font-size="14" text-anchor="middle" font-weight="bold">W = dP (v₂ − v₁)</text>
<text x="436" y="226" fill="#1f5fbf" font-size="14" text-anchor="start" font-weight="normal">C→D: isothermal at T − dT</text>
<text x="436" y="246" fill="#1f5fbf" font-size="14" text-anchor="start" font-weight="normal">heat rejected Q₂</text>
<text x="436" y="152" fill="#222222" font-size="14" text-anchor="start" font-weight="normal">B→C, D→A: adiabatic</text>
<line x1="236" y1="272" x2="142" y2="272" stroke="#222222" stroke-width="2" marker-end="url(#mk)"/>
<line x1="304" y1="272" x2="398" y2="272" stroke="#222222" stroke-width="2" marker-end="url(#mk)"/>
<text x="270" y="277" fill="#222222" font-size="14" text-anchor="middle" font-weight="normal">v₂ − v₁</text>
<text x="400" y="380" fill="#222222" font-size="14" text-anchor="middle" font-weight="bold">η = W/Q₁ = dP (v₂ − v₁)/L   and   η = dT/T   →   dP/dT = L/[T(v₂ − v₁)]</text>
</svg>
