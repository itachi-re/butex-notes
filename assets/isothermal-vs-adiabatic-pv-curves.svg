<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" font-family="Arial, Helvetica, sans-serif">
  <rect width="600" height="420" fill="#ffffff"/>
  <defs>
    <marker id="arr7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <line x1="80" y1="360" x2="560" y2="360" stroke="#222" stroke-width="2" marker-end="url(#arr7)"/>
  <line x1="80" y1="360" x2="80" y2="40" stroke="#222" stroke-width="2" marker-end="url(#arr7)"/>
  <text x="565" y="365" font-size="16" fill="#222">V</text>
  <text x="50" y="40" font-size="16" fill="#222">P</text>
  <!-- isothermal PV = c -->
  <path d="M 120,80 Q 300,200 540,320" fill="none" stroke="#d62728" stroke-width="2.5"/>
  <text x="400" y="180" font-size="15" fill="#d62728">Isothermal (PV = const)</text>
  <!-- adiabatic PV^γ = c, steeper -->
  <path d="M 120,80 Q 220,260 400,340" fill="none" stroke="#1f77b4" stroke-width="2.5"/>
  <text x="280" y="310" font-size="15" fill="#1f77b4">Adiabatic (PV^γ = const)</text>
  <!-- common starting point -->
  <circle cx="120" cy="80" r="5" fill="#222"/>
  <text x="105" y="75" font-size="14" fill="#222">(P₁, V₁)</text>
  <!-- caption -->
  <text x="300" y="400" text-anchor="middle" font-size="13" fill="#222">Adiabatic curve is steeper: slope ratio = γ. For same ΔV, adiabatic work &lt; isothermal work.</text>
</svg>