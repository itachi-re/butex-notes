<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Torque of a force about a pivot</title>
<defs>
<marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#1f2937"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#1d4ed8"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#dc2626"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#15803d"/></marker>
</defs>
<rect width="680" height="300" fill="#ffffff"/>
<line x1="120" y1="120" x2="370" y2="120" stroke="#9ca3af" stroke-width="10" stroke-linecap="round"/>
<circle cx="120" cy="120" r="9" fill="#1f2937"/>
<text x="70" y="150" fill="#1f2937">O (pivot)</text>
<line x1="125" y1="98" x2="365" y2="98" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#ab)"/>
<text x="238" y="90" fill="#1d4ed8">r</text>
<line x1="370" y1="120" x2="440" y2="20" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="448" y="24" fill="#dc2626">F</text>
<line x1="370" y1="120" x2="430" y2="120" stroke="#6b7280" stroke-dasharray="5 4"/>
<path d="M405 120 A35 35 0 0 0 390 92" fill="none" stroke="#1f2937"/>
<text x="412" y="108" fill="#1f2937">θ</text>
<line x1="370" y1="120" x2="287.8" y2="237.5" stroke="#6b7280" stroke-dasharray="5 4"/>
<line x1="120" y1="120" x2="287.8" y2="237.5" stroke="#15803d" stroke-width="2" stroke-dasharray="6 3"/>
<path d="M279.6 231.8 L285.3 223.6 L293.5 229.3" fill="none" stroke="#15803d"/>
<text x="95" y="200" fill="#15803d">d = r sin θ</text>
<text x="95" y="220" fill="#15803d">(lever arm)</text>
<text x="420" y="240" fill="#1f2937">τ = r F sin θ = F × d</text>
<text x="420" y="262" fill="#1f2937">unit: N·m</text>
</svg>
