<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Engine numerical setup</title>
<desc>Engine takes Q1 = 12.6e6 J from a 373 K source, delivers W = 2.6856e6 J per hp-hour and rejects Q2 to a 273 K sink.</desc>
<defs><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="my" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#777777"/></marker></defs>
<rect x="0" y="0" width="800" height="420" fill="#ffffff"/>
<text x="400" y="26" fill="#222222" font-size="16" text-anchor="middle" font-weight="bold">Engine numerical: 3×10⁶ cal of heat per horsepower-hour</text>
<rect x="260" y="50" width="240" height="60" rx="0" fill="#c0392b" fill-opacity="0.12" stroke="#c0392b" stroke-width="2"/>
<text x="380" y="76" fill="#222222" font-size="15" text-anchor="middle" font-weight="bold">Source</text>
<text x="380" y="98" fill="#c0392b" font-size="15" text-anchor="middle" font-weight="bold">T₁ = 373 K (100 °C)</text>
<rect x="260" y="170" width="240" height="80" rx="0" fill="#222222" fill-opacity="0.08" stroke="#222222" stroke-width="2"/>
<text x="380" y="216" fill="#222222" font-size="16" text-anchor="middle" font-weight="bold">Engine</text>
<rect x="260" y="330" width="240" height="60" rx="0" fill="#1f5fbf" fill-opacity="0.12" stroke="#1f5fbf" stroke-width="2"/>
<text x="380" y="356" fill="#222222" font-size="15" text-anchor="middle" font-weight="bold">Sink</text>
<text x="380" y="378" fill="#1f5fbf" font-size="15" text-anchor="middle" font-weight="bold">T₂ = 273 K (0 °C)</text>
<line x1="380" y1="110" x2="380" y2="170" stroke="#c0392b" stroke-width="3" marker-end="url(#mr)"/>
<text x="396" y="146" fill="#c0392b" font-size="14" text-anchor="start" font-weight="normal">Q₁ = 3×10⁶ cal = 12.6×10⁶ J</text>
<line x1="380" y1="250" x2="380" y2="330" stroke="#1f5fbf" stroke-width="3" marker-end="url(#mb)"/>
<text x="396" y="286" fill="#1f5fbf" font-size="14" text-anchor="start" font-weight="normal">Q₂ = Q₁ − W = 9.914×10⁶ J</text>
<line x1="260" y1="210" x2="130" y2="210" stroke="#2e7d32" stroke-width="3" marker-end="url(#mg)"/>
<text x="195" y="190" fill="#2e7d32" font-size="14" text-anchor="middle" font-weight="bold">W = 2.686×10⁶ J</text>
<text x="195" y="236" fill="#2e7d32" font-size="14" text-anchor="middle" font-weight="normal">= 746 W × 3600 s</text>
<text x="540" y="200" fill="#222222" font-size="15" text-anchor="start" font-weight="bold">η = W/Q₁ = 21.3 %</text>
<text x="540" y="224" fill="#222222" font-size="14" text-anchor="start" font-weight="normal">η(Carnot) = 1 − 273/373 = 26.8 %</text>
<text x="540" y="248" fill="#222222" font-size="14" text-anchor="start" font-weight="normal">ratio = 0.795</text>
</svg>
