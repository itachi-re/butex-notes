<text x="298.0" y="430.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" fill="#c2410c" font-weight="normal">α(1→2)β linkage: both anomeric carbons are tied up</text>
<rect x="640.0" y="70.0" width="335.0" height="230.0" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="654.0" y="96.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.3" text-anchor="start" fill="#1f2937" font-weight="normal"><tspan font-weight="bold">Key facts</tspan></text>
<text x="654.0" y="119.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.3" text-anchor="start" fill="#1f2937" font-weight="normal">• non-reducing sugar (no free hemiacetal OH)</text>
<text x="654.0" y="142.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.3" text-anchor="start" fill="#1f2937" font-weight="normal">• no mutarotation, no osazone</text>
<text x="654.0" y="165.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.3" text-anchor="start" fill="#1f2937" font-weight="normal">• [α]D = +66.5° (dextrorotatory)</text>
<text x="654.0" y="188.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.3" text-anchor="start" fill="#1f2937" font-weight="normal">• hydrolysis → D-glucose + D-fructose</text>
<text x="654.0" y="211.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.3" text-anchor="start" fill="#1f2937" font-weight="normal">   (equimolar, “invert sugar”)</text>
<text x="654.0" y="234.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.3" text-anchor="start" fill="#1f2937" font-weight="normal">• octaacetate: 8 free –OH groups</text>
<text x="654.0" y="257.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.3" text-anchor="start" fill="#1f2937" font-weight="normal">• enzyme: invertase / sucrase</text>
<rect x="40.0" y="470.0" width="920.0" height="70.0" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="500.0" y="496.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.3" text-anchor="middle" fill="#1f2937" font-weight="normal">In the Haworth drawing the fructose unit is turned over, so that the α-face of Glc-C1 and the β-face of Fru-C2 meet at one oxygen.</text>
<text x="500.0" y="520.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.3" text-anchor="middle" fill="#6b7280" font-weight="normal">dashed circles = the two anomeric carbons (C-1 of glucose, C-2 of fructose) joined through the C–O–C acetal/ketal bond.</text>
</svg>
