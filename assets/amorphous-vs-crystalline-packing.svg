<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="600" height="300" fill="#ffffff"/>
<text x="300" y="24" text-anchor="middle" font-size="16" font-weight="bold">Amorphous vs Crystalline Polymer Chain Packing</text>

<text x="150" y="55" text-anchor="middle" font-size="14" font-weight="bold">Amorphous</text>
<path d="M40,90 C70,70 60,130 90,110 C120,90 110,150 150,130 C180,110 170,170 210,150 C240,130 230,90 260,110" stroke="#1f5fa8" fill="none" stroke-width="2"/>
<path d="M50,150 C80,180 70,120 110,160 C140,190 130,140 170,175 C200,200 190,150 230,180" stroke="#1f5fa8" fill="none" stroke-width="2"/>
<path d="M45,200 C75,220 90,190 120,215 C150,240 160,205 195,225" stroke="#1f5fa8" fill="none" stroke-width="2"/>
<text x="150" y="270" text-anchor="middle" font-size="12">Random coil, entangled chains &#8211; no long-range order</text>

<text x="450" y="55" text-anchor="middle" font-size="14" font-weight="bold">Crystalline (lamella/spherulite)</text>
<g stroke="#a83232" stroke-width="2" fill="none">
<path d="M330,80 L330,110 L470,110 L470,80"/>
<path d="M330,120 L330,150 L470,150 L470,120"/>
<path d="M330,160 L330,190 L470,190 L470,160"/>
<path d="M330,200 L330,230 L470,230 L470,200"/>
</g>
<text x="400" y="255" text-anchor="middle" font-size="12">Folded chains stacked in ordered lamellae</text>
<text x="400" y="270" text-anchor="middle" font-size="12">(radiating lamellae form spherulites)</text>
</svg>
