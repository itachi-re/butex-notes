e" fill-opacity="1"/><circle cx="550" cy="205" r="2.5" stroke="#2563eb" stroke-width="1" fill="#2563eb" fill-opacity="1"/><circle cx="590" cy="145" r="7" stroke="#2563eb" stroke-width="1.5" fill="none" fill-opacity="1"/><circle cx="590" cy="145" r="2.5" stroke="#2563eb" stroke-width="1" fill="#2563eb" fill-opacity="1"/><circle cx="590" cy="205" r="7" stroke="#2563eb" stroke-width="1.5" fill="none" fill-opacity="1"/><circle cx="590" cy="205" r="2.5" stroke="#2563eb" stroke-width="1" fill="#2563eb" fill-opacity="1"/><circle cx="630" cy="145" r="7" stroke="#2563eb" stroke-width="1.5" fill="none" fill-opacity="1"/><circle cx="630" cy="145" r="2.5" stroke="#2563eb" stroke-width="1" fill="#2563eb" fill-opacity="1"/><circle cx="630" cy="205" r="7" stroke="#2563eb" stroke-width="1.5" fill="none" fill-opacity="1"/><circle cx="630" cy="205" r="2.5" stroke="#2563eb" stroke-width="1" fill="#2563eb" fill-opacity="1"/><text x="653" y="227" fill="#dc2626" font-size="20" text-anchor="middle" font-weight="bold" font-style="normal">+</text><text x="653" y="143" fill="#2563eb" font-size="20" text-anchor="middle" font-weight="bold" font-style="normal">−</text><text x="689" y="227" fill="#dc2626" font-size="20" text-anchor="middle" font-weight="bold" font-style="normal">+</text><text x="689" y="143" fill="#2563eb" font-size="20" text-anchor="middle" font-weight="bold" font-style="normal">−</text><text x="725" y="227" fill="#dc2626" font-size="20" text-anchor="middle" font-weight="bold" font-style="normal">+</text><text x="725" y="143" fill="#2563eb" font-size="20" text-anchor="middle" font-weight="bold" font-style="normal">−</text><text x="761" y="227" fill="#dc2626" font-size="20" text-anchor="middle" font-weight="bold" font-style="normal">+</text><text x="761" y="143" fill="#2563eb" font-size="20" text-anchor="middle" font-weight="bold" font-style="normal">−</text><line x1="670" y1="175" x2="750" y2="175" stroke="#059669" stroke-width="3" marker-end="url(#ag)"/><text x="710" y="166" fill="#059669" font-size="17" text-anchor="middle" font-weight="bold" font-style="normal">v<tspan dy="4" font-size="14">d</tspan><tspan dy="-4">​</tspan></text><line x1="790" y1="205" x2="790" y2="150" stroke="#d97706" stroke-width="3" marker-end="url(#ao)"/><rect x="751.0" y="165.0" width="27.0" height="24" fill="#ffffff"/><text x="782" y="182" fill="#d97706" font-size="17" text-anchor="end" font-weight="bold" font-style="normal">E<tspan dy="4" font-size="14">H</tspan><tspan dy="-4">​</tspan></text><path d="M810,120 L810,95 L875,95 L875,147" stroke="#1f2937" stroke-width="2" fill="none" fill-opacity="1"/><path d="M810,230 L810,255 L875,255 L875,203" stroke="#1f2937" stroke-width="2" fill="none" fill-opacity="1"/><circle cx="875" cy="175" r="28" stroke="#1f2937" stroke-width="2.5" fill="none" fill-opacity="1"/><text x="875" y="181" fill="#1f2937" font-size="17" text-anchor="middle" font-weight="bold" font-style="normal">V<tspan dy="4" font-size="14">H</tspan><tspan dy="-4">​</tspan></text><text x="891" y="92" fill="#1f2937" font-size="22" text-anchor="start" font-weight="bold" font-style="normal">−</text><text x="891" y="262" fill="#1f2937" font-size="22" text-anchor="start" font-weight="bold" font-style="normal">+</text><text x="250" y="300" fill="#1f2937" font-size="14" text-anchor="middle" font-weight="normal" font-style="normal">Electrons drift left; F = −e v<tspan dy="4" font-size="14">d</tspan><tspan dy="-4">​</tspan> × B pushes them to the bottom edge</text><text x="250" y="322" fill="#1f2937" font-size="14" text-anchor="middle" font-weight="normal" font-style="normal">Top edge loses electrons (+), bottom gains them (−)</text><text x="710" y="300" fill="#1f2937" font-size="14" text-anchor="middle" font-weight="normal" font-style="normal">Holes drift right; F = +e v<tspan dy="4" font-size="14">d</tspan><tspan dy="-4">​</tspan> × B pushes them to the bottom edge</text><text x="710" y="322" fill="#1f2937" font-size="14" text-anchor="middle" font-weight="normal" font-style="normal">Top edge is negative, bottom positive: V<tspan dy="4" font-size="14">H</tspan><tspan dy="-4">​</tspan> reverses</text><text x="480" y="365" fill="#2563eb" font-size="15" text-anchor="middle" font-weight="bold" font-style="normal">⊙ B out of page (thickness t along B), width w between the Hall edges</text><text x="480" y="392" fill="#1f2937" font-size="16" text-anchor="middle" font-weight="bold" font-style="normal">At balance: eE<tspan dy="4" font-size="14">H</tspan><tspan dy="-4">​</tspan> = e v<tspan dy="4" font-size="14">d</tspan><tspan dy="-4">​</tspan> B, V<tspan dy="4" font-size="14">H</tspan><tspan dy="-4">​</tspan> = E<tspan dy="4" font-size="14">H</tspan><tspan dy="-4">​</tspan> w = BI/(n e t)</text></svg>