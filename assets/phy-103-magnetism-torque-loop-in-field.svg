"256" fill="#1f2937" font-size="16" text-anchor="end" font-weight="normal" font-style="normal">O</text><text x="211.29336293448068" y="149.73511125691243" fill="#1f2937" font-size="16" text-anchor="end" font-weight="normal" font-style="normal">A</text><text x="388.7066370655193" y="318.26488874308757" fill="#1f2937" font-size="16" text-anchor="start" font-weight="normal" font-style="normal">C</text><text x="520" y="90" fill="#1f2937" font-size="16" text-anchor="start" font-weight="bold" font-style="normal">Side view of a rectangular loop</text><text x="520" y="118" fill="#1f2937" font-size="16" text-anchor="start" font-weight="normal" font-style="normal">Plane ⊥ page, sides a (⊙ / ⊗) and b</text><text x="520" y="160" fill="#1f2937" font-size="16" text-anchor="start" font-weight="normal" font-style="normal">⊙ current out of page (side A)</text><text x="520" y="186" fill="#1f2937" font-size="16" text-anchor="start" font-weight="normal" font-style="normal">⊗ current into page (side C)</text><text x="520" y="228" fill="#059669" font-size="16" text-anchor="start" font-weight="normal" font-style="normal">n = normal to loop plane</text><text x="520" y="254" fill="#d97706" font-size="16" text-anchor="start" font-weight="normal" font-style="normal">θ = angle between n and B</text><text x="520" y="296" fill="#dc2626" font-size="16" text-anchor="start" font-weight="normal" font-style="normal">F = BIa on each side,</text><text x="520" y="320" fill="#dc2626" font-size="16" text-anchor="start" font-weight="normal" font-style="normal">arm = b sinθ each</text><text x="520" y="360" fill="#1f2937" font-size="18" text-anchor="start" font-weight="bold" font-style="normal">τ = BIab sinθ = BIA sinθ</text></svg>