<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="700" height="400" fill="#ffffff"/>
  <text x="350" y="26" font-size="18" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Newton's Law of Cooling — Apparatus &amp; Cooling Curves</text>

  <!-- Calorimeter with double walled enclosure -->
  <rect x="70" y="70" width="180" height="150" rx="4" fill="#f5f5f5" stroke="#555" stroke-width="2"/>
  <text x="160" y="60" font-size="12" text-anchor="middle" fill="#333">Enclosure (constant surrounding temp Tₛ)</text>
  <circle cx="160" cy="150" r="55" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="160" y="155" font-size="11" text-anchor="middle" fill="#333">calorimeter +</text>
  <text x="160" y="170" font-size="11" text-anchor="middle" fill="#333">liquid / water</text>

  <!-- Thermometer & stirrer -->
  <line x1="160" y1="95" x2="160" y2="55" stroke="#c0392b" stroke-width="3"/>
  <circle cx="160" cy="50" r="6" fill="#c0392b"/>
  <line x1="185" y1="95" x2="185" y2="195" stroke="#7a5c2e" stroke-width="2"/>

  <!-- Cooling curves graph -->
  <line x1="330" y1="330" x2="640" y2="330" stroke="#333" stroke-width="2"/>
  <line x1="330" y1="330" x2="330" y2="70" stroke="#333" stroke-width="2"/>
  <text x="485" y="360" font-size="12" text-anchor="middle" fill="#333">Time, t</text>
  <text x="300" y="200" font-size="12" text-anchor="middle" fill="#333" transform="rotate(-90 300 200)">Temperature, θ</text>

  <path d="M345 85 Q 450 150 620 290" stroke="#c0392b" stroke-width="2.5" fill="none"/>
  <text x="560" y="255" font-size="11" fill="#c0392b">water</text>

  <path d="M345 85 Q 420 130 620 250" stroke="#2b6cb0" stroke-width="2.5" fill="none"/>
  <text x="560" y="225" font-size="11" fill="#2b6cb0">test liquid</text>

  <line x1="330" y1="150" x2="640" y2="150" stroke="#666" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="330" y1="200" x2="640" y2="200" stroke="#666" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="335" y="147" font-size="10" fill="#666">θ₁</text>
  <text x="335" y="197" font-size="10" fill="#666">θ₂</text>

  <text x="485" y="385" font-size="11" text-anchor="middle" fill="#555">Time for same fall (θ₁→θ₂) is compared for water and the test liquid, same calorimeter, same Tₛ</text>
</svg>
