4" fill="#059669" font-size="17" text-anchor="middle" font-weight="bold" font-style="normal">v</text><line x1="98" y1="140" x2="165" y2="140" stroke="#2563eb" stroke-width="3" marker-end="url(#ab)"/><text x="132" y="128" fill="#2563eb" font-size="17" text-anchor="middle" font-weight="bold" font-style="normal">B</text><ellipse cx="190" cy="140" rx="14" ry="45" stroke="#1f2937" stroke-width="2.5" fill="#d97706" fill-opacity="0.12"/><ellipse cx="211" cy="140" rx="14" ry="45" stroke="#1f2937" stroke-width="2.5" fill="#d97706" fill-opacity="0.12"/><ellipse cx="232" cy="140" rx="14" ry="45" stroke="#1f2937" stroke-width="2.5" fill="#d97706" fill-opacity="0.12"/><ellipse cx="253" cy="140" rx="14" ry="45" stroke="#1f2937" stroke-width="2.5" fill="#d97706" fill-opacity="0.12"/><ellipse cx="274" cy="140" rx="14" ry="45" stroke="#1f2937" stroke-width="2.5" fill="#d97706" fill-opacity="0.12"/><line x1="272" y1="175" x2="200" y2="175" stroke="#d97706" stroke-width="3" marker-end="url(#ao)"/><text x="236" y="202" fill="#d97706" font-size="17" text-anchor="middle" font-weight="bold" font-style="normal">B<tspan dy="4" font-size="14">ind</tspan><tspan dy="-4">​</tspan></text><circle cx="190" cy="62" r="13" stroke="#dc2626" stroke-width="2" fill="#dc2626" fill-opacity="0.15"/><text x="190" y="68" fill="#dc2626" font-size="16" text-anchor="middle" font-weight="bold" font-style="normal">N</text><circle cx="274" cy="62" r="13" stroke="#2563eb" stroke-width="2" fill="#2563eb" fill-opacity="0.15"/><text x="274" y="68" fill="#2563eb" font-size="16" text-anchor="middle" font-weight="bold" font-style="normal">S</text><path d="M190,185 L190,262 L206,262" stroke="#1f2937" stroke-width="2" fill="none" fill-opacity="1"/><path d="M274,185 L274,262 L258,262" stroke="#1f2937" stroke-width="2" fill="none" fill-opacity="1"/><circle cx="232" cy="262" r="26" stroke="#1f2937" stroke-width="2.5" fill="none" fill-opacity="1"/><text x="232" y="305" fill="#1f2937" font-size="16" text-anchor="middle" font-weight="bold" font-style="normal">G</text><line x1="232" y1="270" x2="250" y2="246" stroke="#dc2626" stroke-width="3"/><path d="M367,250 A22,22 0 1 0 345,272" stroke="#dc2626" stroke-width="3" fill="none" fill-opacity="1" marker-end="url(#ar)"/><text x="345" y="220" fill="#dc2626" font-size="17" text-anchor="middle" font-weight="bold" font-style="normal">I</text><text x="345" y="316" fill="#dc2626" font-size="16" text-anchor="middle" font-weight="bold" font-style="normal">CCW</text><text x="210" y="340" fill="#1f2937" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal">Induced I seen from the magnet side:</text><text x="210" y="362" fill="#1f2937" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal">repels the magnet (near face N)</text><text x="660" y="28" fill="#1f2937" font-size="17" text-anchor="middle" font-weight="bold" font-style="normal">(b) Magnet receding, Φ decreasing</text><rect x="460" y="120" width="40" height="40" rx="0" stroke="#1f2937" stroke-width="2" fill="#2563eb" fill-opacity="0.25"/><rect x="500" y="120" width="40" height="40" rx="0" stroke="#1f2937" stroke-width="2" fill="#dc2626" fill-opacity="0.25"/><text x="480" y="147" fill="#2563eb" font-size="17" text-anchor="middle" font-weight="bold" font-style="normal">S</text><text x="520" y="147" fill="#dc2626" font-size="17" text-anchor="middle" font-weight="bold" font-style="normal">N</text><line x1="530" y1="100" x2="470" y2="100" stroke="#059669" stroke-width="3" marker-end="url(#ag)"/><text x="500" y="84" fill="#059669" font-size="17" text-anchor="middle" font-weight="bold" font-style="normal">v</text><line x1="548" y1="140" x2="615" y2="140" stroke="#2563eb" stroke-width="3" marker-end="url(#ab)"/><text x="582" y="128" fill="#2563eb" font-size="17" text-anchor="middle" font-weight="bold" font-style="normal">B</text><ellipse cx="640" cy="140" rx="14" ry="45" stroke="#1f2937" stroke-width="2.5" fill="#d97706" fill-opacity="0.12"/><ellipse cx="661" cy="140" rx="14" ry="45" stroke="#1f2937" stroke-width="2.5" fill="#d97706" fill-opacity="0.12"/><ellipse cx="682" cy="140" rx="14" ry="45" stroke="#1f2937" stroke-width="2.5" fill="#d97706" fill-opacity="0.12"/><ellipse cx="703" cy="140" rx="14" ry="45" stroke="#1f2937" stroke-width="2.5" fill="#d97706" fill-opacity="0.12"/><ellipse cx="724" cy="140" rx="14" ry="45" stroke="#1f2937" stroke-width="2.5" fill="#d97706" fill-opacity="0.12"/><line x1="650" y1="175" x2="722" y2="175" stroke="#d97706" stroke-width="3" marker-end="url(#ao)"/><text x="686" y="202" fill="#d97706" font-size="17" text-anchor="middle" font-weight="bold" font-style="normal">B<tspan dy="4" font-size="14">ind</tspan><tspan dy="-4">​</tspan></text><circle cx="640" cy="62" r="13" stroke="#2563eb" stroke-width="2" fill="#2563eb" fill-opacity="0.15"/><text x="640" y="68" fill="#2563eb" font-size="16" text-anchor="middle" font-weight="bold" font-style="normal">S</text><circle cx="724" cy="62" r="13" stroke="#dc2626" stroke-width="2" fill="#dc2626" fill-opacity="0.15"/><text x="724" y="68" fill="#dc2626" font-size="16" text-anchor="middle" font-weight="bold" font-style="normal">N</text><path d="M640,185 L640,262 L656,262" stroke="#1f2937" stroke-width="2" fill="none" fill-opacity="1"/><path d="M724,185 L724,262 L708,262" stroke="#1f2937" stroke-width="2" fill="none" fill-opacity="1"/><circle cx="682" cy="262" r="26" stroke="#1f2937" stroke-width="2.5" fill="none" fill-opacity="1"/><text x="682" y="305" fill="#1f2937" font-size="16" text-anchor="middle" font-weight="bold" font-style="normal">G</text><line x1="682" y1="270" x2="664" y2="246" stroke="#dc2626" stroke-width="3"/><path d="M817,250 A22,22 0 1 1 795,228" stroke="#dc2626" stroke-width="3" fill="none" fill-opacity="1" marker-end="url(#ar)"/><text x="795" y="220" fill="#dc2626" font-size="17" text-anchor="middle" font-weight="bold" font-style="normal">I</text><text x="795" y="316" fill="#dc2626" font-size="16" text-anchor="middle" font-weight="bold" font-style="normal">CW</text><text x="660" y="340" fill="#1f2937" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal">Induced I seen from the magnet side:</text><text x="660" y="362" fill="#1f2937" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal">attracts the magnet (near face S)</text><text x="450" y="400" fill="#1f2937" font-size="17" text-anchor="middle" font-weight="bold" font-style="normal">Induced current always opposes the change of flux that causes it</text></svg>