<svg xmlns="http://www.w3.org/2000/svg" width="930" height="445" viewBox="0 0 930 445" font-family="Arial, Helvetica, sans-serif" font-size="16" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Energy flow if induced current opposes the change versus a hypothetical reinforcing current</title><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect width="930" height="445" fill="#ffffff"/><text x="220" y="30" fill="#059669" font-size="18" text-anchor="middle" font-weight="bold" font-style="normal">Actual: induced current opposes</text><text x="690" y="30" fill="#dc2626" font-size="18" text-anchor="middle" font-weight="bold" font-style="normal">Hypothetical: induced current reinforces</text><rect x="30" y="55" width="380" height="70" rx="8" stroke="#d97706" stroke-width="2.5" fill="#d97706" fill-opacity="0.1"/><text x="220.0" y="83" fill="#1f2937" font-size="15" text-anchor="middle" font-weight="bold" font-style="normal">Agent pushes magnet in</text><text x="220.0" y="107" fill="#1f2937" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal">against the repulsion: work W > 0</text><line x1="220" y1="125" x2="220" y2="170" stroke="#1f2937" stroke-width="3" marker-end="url(#ak)"/><rect x="30" y="170" width="380" height="70" rx="8" stroke="#059669" stroke-width="2.5" fill="#059669" fill-opacity="0.1"/><text x="220.0" y="198" fill="#1f2937" font-size="15" text-anchor="middle" font-weight="bold" font-style="normal">Work becomes electrical energy</text><text x="220.0" y="222" fill="#1f2937" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal">emf × current, per second</text><line x1="220" y1="240" x2="220" y2="285" stroke="#1f2937" stroke-width="3" marker-end="url(#ak)"/><rect x="30" y="285" width="380" height="70" rx="8" stroke="#dc2626" stroke-width="2.5" fill="#dc2626" fill-opacity="0.1"/><text x="220.0" y="313" fill="#1f2937" font-size="15" text-anchor="middle" font-weight="bold" font-style="normal">Electrical energy becomes heat</text><text x="220.0" y="337" fill="#1f2937" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal">I<tspan dy="-6" font-size="14">2</tspan><tspan dy="6">​</tspan>R per second in the circuit</text><text x="220" y="395" fill="#059669" font-size="17" text-anchor="middle" font-weight="bold" font-style="normal">Work done = heat produced</text><text x="220" y="420" fill="#059669" font-size="17" text-anchor="middle" font-weight="bold" font-style="normal">Energy is conserved ✓</text><rect x="480" y="55" width="420" height="70" rx="8" stroke="#d97706" stroke-width="2.5" fill="#d97706" fill-opacity="0.1"/><text x="690.0" y="95.0" fill="#1f2937" font-size="15" text-anchor="middle" font-weight="bold" font-style="normal">A tiny push starts the magnet moving in</text><line x1="690" y1="125" x2="690" y2="170" stroke="#1f2937" stroke-width="3" marker-end="url(#ak)"/><rect x="480" y="170" width="420" height="70" rx="8" stroke="#dc2626" stroke-width="2.5" fill="#dc2626" fill-opacity="0.1"/><text x="690.0" y="198" fill="#1f2937" font-size="15" text-anchor="middle" font-weight="bold" font-style="normal">Induced current ATTRACTS the magnet</text><text x="690.0" y="222" fill="#1f2937" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal">it speeds up: KE rises, no work done</text><line x1="690" y1="240" x2="690" y2="285" stroke="#1f2937" stroke-width="3" marker-end="url(#ak)"/><rect x="480" y="285" width="420" height="70" rx="8" stroke="#dc2626" stroke-width="2.5" fill="#dc2626" fill-opacity="0.1"/><text x="690.0" y="313" fill="#1f2937" font-size="15" text-anchor="middle" font-weight="bold" font-style="normal">Flux change grows, emf and current grow</text><text x="690.0" y="337" fill="#1f2937" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal">heat I<tspan dy="-6" font-size="14">2</tspan><tspan dy="6">​</tspan>R is produced as well</text><text x="690" y="395" fill="#dc2626" font-size="17" text-anchor="middle" font-weight="bold" font-style="normal">KE and heat appear from nothing</text><text x="690" y="420" fill="#dc2626" font-size="17" text-anchor="middle" font-weight="bold" font-style="normal">Violates conservation of energy ✗</text><line x1="450" y1="50" x2="450" y2="430" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="6,5"/></svg>