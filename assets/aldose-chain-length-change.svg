<svg viewBox="0 0 560 260" xmlns="http://www.w3.org/2000/svg" font-family="Arial" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<text x="280" y="20" text-anchor="middle" font-weight="bold">Aldose chain lengthening (Kiliani–Fischer) and shortening (Ruff/Wohl)</text>

<text x="20" y="55" font-weight="bold">Chain lengthening — Kiliani–Fischer synthesis:</text>
<text x="20" y="78" font-size="11">Aldose (Cₙ) + HCN → cyanohydrin (mixture of 2 epimers at new C1)</text>
<text x="20" y="98" font-size="11">→ partial hydrolysis → imino-lactone → H₂O → aldonolactone</text>
<text x="20" y="118" font-size="11">→ reduce (Na-Hg/H₂O, controlled) → aldose (Cₙ₊₁) — gives pair of epimeric aldoses</text>

<text x="20" y="155" font-weight="bold">Chain shortening — Ruff degradation:</text>
<text x="20" y="178" font-size="11">Aldose (Cₙ) + Br₂/H₂O → aldonic acid (Cₙ) → Ca-salt</text>
<text x="20" y="198" font-size="11">+ H₂O₂ / Fe₂(SO₄)₃ (Fenton-type oxidative decarboxylation)</text>
<text x="20" y="218" font-size="11">→ –CO₂ → aldose (Cₙ₋₁)</text>
</svg>
