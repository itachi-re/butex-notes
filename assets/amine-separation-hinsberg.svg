<svg viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg" font-family="Arial" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<text x="280" y="20" text-anchor="middle" font-weight="bold">Separation of 1°, 2°, 3° amines — Hinsberg method</text>
<rect x="220" y="35" width="160" height="30" fill="none" stroke="black"/>
<text x="300" y="55" text-anchor="middle">Mixture (1° + 2° + 3° amine)</text>
<text x="300" y="80" text-anchor="middle" font-size="11">+ C₆H₅SO₂Cl (Hinsberg reagent), aq. KOH</text>
<line x1="300" y1="65" x2="300" y2="90" stroke="black" marker-end="url(#a)"/>

<line x1="230" y1="110" x2="120" y2="150" stroke="black"/>
<line x1="300" y1="110" x2="300" y2="150" stroke="black"/>
<line x1="370" y1="110" x2="470" y2="150" stroke="black"/>

<rect x="40" y="150" width="160" height="50" fill="none" stroke="black"/>
<text x="120" y="168" text-anchor="middle" font-size="11">1° amine →</text>
<text x="120" y="184" text-anchor="middle" font-size="11">RNHSO₂C₆H₅ (soluble</text>
<text x="120" y="198" text-anchor="middle" font-size="11">in KOH, N–H acidic)</text>

<rect x="220" y="150" width="160" height="50" fill="none" stroke="black"/>
<text x="300" y="168" text-anchor="middle" font-size="11">2° amine →</text>
<text x="300" y="184" text-anchor="middle" font-size="11">R₂NSO₂C₆H₅ (insoluble</text>
<text x="300" y="198" text-anchor="middle" font-size="11">in KOH, no N–H)</text>

<rect x="400" y="150" width="150" height="50" fill="none" stroke="black"/>
<text x="475" y="168" text-anchor="middle" font-size="11">3° amine →</text>
<text x="475" y="184" text-anchor="middle" font-size="11">unreacted (no N–H,</text>
<text x="475" y="198" text-anchor="middle" font-size="11">separates by extraction)</text>

<text x="120" y="230" text-anchor="middle" font-size="11">Filter/dissolve; acidify + hydrolyse</text>
<text x="120" y="248" text-anchor="middle" font-size="11">(dil. HCl, Δ) → regenerate 1° amine</text>

<text x="300" y="230" text-anchor="middle" font-size="11">Filter insoluble solid; hydrolyse</text>
<text x="300" y="248" text-anchor="middle" font-size="11">(conc. HCl, Δ) → regenerate 2° amine</text>

<text x="475" y="230" text-anchor="middle" font-size="11">Separate by simple</text>
<text x="475" y="248" text-anchor="middle" font-size="11">distillation/extraction</text>
</svg>
