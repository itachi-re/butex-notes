<svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="480" height="320" fill="white"/>
  <!-- Origin -->
  <circle cx="60" cy="260" r="2.5" fill="#1a1a1a"/>
  <text x="48" y="278" font-size="16">O</text>

  <!-- Vector a along x -->
  <line x1="60" y1="260" x2="360" y2="260" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="370" y="266" font-size="18" font-style="italic">a</text>

  <!-- Vector b at angle theta -->
  <line x1="60" y1="260" x2="250" y2="100" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="255" y="95" font-size="18" font-style="italic">b</text>

  <!-- Projection foot -->
  <line x1="250" y1="100" x2="250" y2="260" stroke="#888" stroke-width="1.3" stroke-dasharray="5,4"/>
  <circle cx="250" cy="260" r="2.2" fill="#555"/>

  <!-- Projection segment highlighted -->
  <line x1="60" y1="260" x2="250" y2="260" stroke="#b3261e" stroke-width="3"/>
  <text x="130" y="280" font-size="14" fill="#b3261e">|b| cos&#952;  (projection of b on a)</text>

  <!-- angle arc -->
  <path d="M 110 260 A 50 50 0 0 0 100 219" fill="none" stroke="#1a1a1a" stroke-width="1.3"/>
  <text x="108" y="238" font-size="15" font-style="italic">&#952;</text>

  <text x="150" y="30" font-size="16" text-anchor="middle">a · b = |a| |b| cos&#952;</text>
</svg>
