<svg viewBox="0 0 660 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="660" height="300" fill="#ffffff"/>
<text x="330" y="24" text-anchor="middle" font-size="16" font-weight="bold">Photo-stabilizer &amp; Anti-oxidant Mechanisms</text>

<text x="20" y="55" font-size="14" font-weight="bold" fill="#1f5fa8">Photo-stabilizers</text>
<text x="20" y="78" font-size="12">UV absorbers (e.g. benzotriazoles): absorb UV, dissipate energy harmlessly as heat</text>
<text x="20" y="96" font-size="12">   Ar&#8211;OH&#8901;&#8901;&#8901;N (H-bonded)  +  h&#957;  &#8594;  excited state  &#8594;  fast internal conversion  &#8594;  heat (no radical formed)</text>
<text x="20" y="118" font-size="12">HALS (hindered amine light stabilizers): scavenge radicals formed, regenerate catalytically</text>
<text x="20" y="136" font-size="12">   &gt;NH  &#8594;  &gt;N&#8226;  (nitroxide)  +  R&#8226;  &#8594;  &gt;N&#8211;OR  (regenerates &gt;N&#8226; on further reaction, cyclic action)</text>

<line x1="20" y1="155" x2="640" y2="155" stroke="#ccc"/>

<text x="20" y="185" font-size="14" font-weight="bold" fill="#a83232">Anti-oxidants (chain-breaking, e.g. hindered phenols)</text>
<text x="20" y="208" font-size="12">Ar&#8211;OH (e.g. BHT) donates H to a peroxy radical before it can attack the polymer chain:</text>
<text x="20" y="228" font-size="13" font-weight="bold">ROO&#8226;  +  Ar&#8211;OH  &#8594;  ROOH  +  Ar&#8211;O&#8226;  (stable, resonance-delocalised, non-propagating)</text>
<text x="20" y="252" font-size="12">The stabilized Ar-O&#8226; radical is too hindered/delocalized to re-abstract H, so it does not</text>
<text x="20" y="270" font-size="12">continue the radical chain &#8211; effectively interrupting propagation (chain-breaking donor, CB-D).</text>
</svg>
