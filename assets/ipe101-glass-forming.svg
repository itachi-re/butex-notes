<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="400" viewBox="0 0 1040 400" font-family="DejaVu Sans, Verdana, Arial, sans-serif" role="img" aria-label="Glass-forming methods"><title>Glass-forming methods</title><defs><marker id="m555" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#555"/></marker><marker id="md62828" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#d62828"/></marker></defs><rect width="1040" height="400" fill="#ffffff"/><text x="520.0" y="28.0" font-size="17" text-anchor="middle" fill="#222" font-weight="bold">Glass-forming methods</text><text x="520.0" y="46.0" font-size="12" text-anchor="middle" fill="#555" font-weight="normal">float · pressing · blowing · fibre drawing</text><rect x="15.0" y="60.0" width="240.0" height="270.0" rx="0" fill="#fafafa" stroke="#bbb" stroke-width="1"/><text x="135.0" y="80.0" font-size="12.5" text-anchor="middle" fill="#222" font-weight="bold">(a) Float process (flat glass)</text><rect x="270.0" y="60.0" width="240.0" height="270.0" rx="0" fill="#fafafa" stroke="#bbb" stroke-width="1"/><text x="390.0" y="80.0" font-size="12.5" text-anchor="middle" fill="#222" font-weight="bold">(b) Pressing</text><rect x="525.0" y="60.0" width="240.0" height="270.0" rx="0" fill="#fafafa" stroke="#bbb" stroke-width="1"/><text x="645.0" y="80.0" font-size="12.5" text-anchor="middle" fill="#222" font-weight="bold">(c) Blowing (bottles)</text><rect x="780.0" y="60.0" width="240.0" height="270.0" rx="0" fill="#fafafa" stroke="#bbb" stroke-width="1"/><text x="900.0" y="80.0" font-size="12.5" text-anchor="middle" fill="#222" font-weight="bold">(d) Fibre drawing (glass fibre)</text><rect x="23.0" y="140.0" width="55.0" height="55.0" rx="0" fill="#ff8a65" stroke="#bf360c" stroke-width="2"/><text x="50.0" y="172.0" font-size="11"