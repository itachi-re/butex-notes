<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="920" height="360" role="img" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Rate versus concentration plots</title><desc>SN1 and E1 rates are independent of nucleophile concentration; SN2 and E2 rates rise linearly with it; all are linear in substrate concentration.</desc><defs><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c0392b"/></marker><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#24292f"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0969da"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1a7f37"/></marker><marker id="mgy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#57606a"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#bc4c00"/></marker></defs><rect width="920" height="360" fill="#ffffff"/><text x="230.0" y="34.0" font-size="16" text-anchor="middle" fill="#24292f" font-weight="bold" xml:space="preserve"><tspan>Rate vs [Nu⁻]  (fixed [R–X])</tspan></text><text x="670.0" y="34.0" font-size="16" text-anchor="middle" fill="#24292f" font-weight="bold" xml:space="preserve"><tspan>Rate vs [R–X]  (fixed [Nu⁻])</tspan></text><line x1="60.0" y1="310.0" x2="60.0" y2="62.0" stroke="#24292f" stroke-width="2.2" stroke-linecap="round" marker-end="url(#mk)"/><line x1="60.0" y1="310.0" x2="410.0" y2="310.0" stroke="#24292f" stroke-width="2.2" stroke-linecap="round" marker-end="url(#mk)"/><text transform="rotate(-90 48 190)" x="48.0" y="190.0" font-size="14" text-anchor="middle" fill="#57606a" font-weight="normal" xml:space="preserve"><tspan>Initial rate</tspan></text><text x="235.0" y="340.0" font-size="15" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>[Nu⁻]</tspan></text><line x1="60.0" y1="170.0" x2="400.0" y2="170.0" stroke="#0969da" stroke-width="4" stroke-linecap="round"/><text x="70.0" y="150.0" font-size="14" text-anchor="start" fill="#0969da" font-weight="bold" xml:space="preserve"><tspan>SN1 / E1: independent of [Nu⁻]</tspan></text><line x1="60.0" y1="310.0" x2="400.0" y2="90.0" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/><text x="400.0" y="272.0" font-size="14" text-anchor="end" fill="#c0392b" font-weight="bold" xml:space="preserve"><tspan>SN2 / E2: rate ∝ [Nu⁻]</tspan></text><line x1="500.0" y1="310.0" x2="500.0" y2="62.0" stroke="#24292f" stroke-width="2.2" stroke-linecap="round" marker-end="url(#mk)"/><line x1="500.0" y1="310.0" x2="850.0" y2="310.0" stroke="#24292f" stroke-width="2.2" stroke-linecap="round" marker-end="url(#mk)"/><text transform="rotate(-90 488 190)" x="488.0" y="190.0" font-size="14" text-anchor="middle" fill="#57606a" font-weight="normal" xml:space="preserve"><tspan>Initial rate</tspan></text><text x="675.0" y="340.0" font-size="15" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"><tspan>[R–X]</tspan></text><line x1="500.0" y1="310.0" x2="840.0" y2="160.0" stroke="#0969da" stroke-width="4" stroke-linecap="round"/><line x1="500.0" y1="310.0" x2="840.0" y2="100.0" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/><text x="520.0" y="80.0" font-size="14" text-anchor="start" fill="#c0392b" font-weight="bold" xml:space="preserve"><tspan>SN2 / E2: rate = k[R–X][Nu⁻]</tspan></text><text x="520.0" y="102.0" font-size="14" text-anchor="start" fill="#0969da" font-weight="bold" xml:space="preserve"><tspan>SN1 / E1: rate = k[R–X]</tspan></text><text x="850.0" y="290.0" font-size="13" text-anchor="end" fill="#57606a" font-weight="normal" xml:space="preserve"><tspan>both: straight line through origin</tspan></text><text x="850.0" y="310.0" font-size="10" text-anchor="middle" fill="#24292f" font-weight="normal" xml:space="preserve"></text></svg>