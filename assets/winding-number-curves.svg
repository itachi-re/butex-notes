<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 260" width="660" height="260" font-family="Arial, Helvetica, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Winding numbers 1, 0 and -1</title>
  <rect width="660" height="260" fill="#ffffff"/>
  <circle cx="110" cy="110" r="70" fill="#dbeafe" stroke="#1f3a8a" stroke-width="3"/>
  <polygon points="110,40 124,34 124,46" fill="#1f3a8a"/>
  <circle cx="110" cy="110" r="4" fill="#b91c1c"/>
  <text x="120" y="125" fill="#b91c1c">a</text>
  <text x="38" y="215" fill="#333">anticlockwise, a inside</text>
  <text x="62" y="235" fill="#333" font-weight="bold">n(γ, a) = 1</text>
  <circle cx="330" cy="110" r="70" fill="#dbeafe" stroke="#1f3a8a" stroke-width="3"/>
  <polygon points="330,40 344,34 344,46" fill="#1f3a8a"/>
  <circle cx="450" cy="110" r="4" fill="#b91c1c"/>
  <text x="460" y="125" fill="#b91c1c">a</text>
  <text x="262" y="215" fill="#333">a outside the curve</text>
  <text x="282" y="235" fill="#333" font-weight="bold">n(γ, a) = 0</text>
  <circle cx="570" cy="110" r="70" fill="#dbeafe" stroke="#1f3a8a" stroke-width="3"/>
  <polygon points="570,40 556,34 556,46" fill="#1f3a8a"/>
  <circle cx="570" cy="110" r="4" fill="#b91c1c"/>
  <text x="580" y="125" fill="#b91c1c">a</text>
  <text x="508" y="215" fill="#333">clockwise, a inside</text>
  <text x="522" y="235" fill="#333" font-weight="bold">n(γ, a) = −1</text>
</svg>
