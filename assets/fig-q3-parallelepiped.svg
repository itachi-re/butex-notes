<text x="320.0" y="362.0" text-anchor="middle" font-size="15" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">Volume = (base area) × h = |b × c| · |a| cos θ = |a · (b × c)|,   where h = |a| cos θ</text><text x="320.0" y="362.0" text-anchor="middle" font-size="15" fill="#1f2328">Volume = (base area) × h = |b × c| · |a| cos θ = |a · (b × c)|,   where h = |a| cos θ</text>
