<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="Georgia, serif" font-size="15" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="780" height="420" fill="#fff"/>
<text x="20" y="28" font-size="18" font-weight="bold">Starch — amylose (α-1,4) and amylopectin (α-1,4 + α-1,6 branch)</text>

<text x="20" y="55" font-weight="bold">Amylose (linear, ~20% of starch)</text>
<g transform="translate(40,70)">
<polygon points="0,35 35,10 95,10 130,35 95,60 35,60" fill="none" stroke="black" stroke-width="2"/>
<text x="30" y="5" font-size="11" font-weight="bold">O</text>
</g>
<line x1="180" y1="105" x2="215" y2="105" stroke="black" stroke-width="2"/>
<text x="188" y="98" font-size="12" font-weight="bold">O</text>
<g transform="translate(220,70)">
<polygon points="0,35 35,10 95,10 130,35 95,60 35,60" fill="none" stroke="black" stroke-width="2"/>
<text x="30" y="5" font-size="11" font-weight="bold">O</text>
</g>
<text x="360" y="105" font-size="20">]ₙ</text>
<text x="20" y="140" font-size="13" fill="#555">all α-D-glucopyranose units linked α-1,4, same orientation → coils into a helix</text>

<text x="20" y="185" font-weight="bold">Amylopectin (branched, ~80% of starch)</text>
<g transform="translate(40,200)">
<polygon points="0,35 35,10 95,10 130,35 95,60 35,60" fill="none" stroke="black" stroke-width="2"/>
<text x="30" y="5" font-size="11" font-weight="bold">O</text>
</g>
<line x1="180" y1="235" x2="215" y2="235" stroke="black" stroke-width="2"/>
<g transform="translate(220,200)">
<polygon points="0,35 35,10 95,10 130,35 95,60 35,60" fill="none" stroke="black" stroke-width="2"/>
<text x="30" y="5" font-size="11" font-weight="bold">O</text>
</g>
<!-- branch -->
<line x1="285" y1="200" x2="320" y2="170" stroke="black" stroke-width="2"/>
<text x="290" y="180" font-size="12" font-weight="bold">O (1→6 branch)</text>
<g transform="translate(320,110)">
<polygon points="0,35 35,10 95,10 130,35 95,60 35,60" fill="none" stroke="black" stroke-width="2"/>
<text x="30" y="5" font-size="11" font-weight="bold">O</text>
</g>

<text x="20" y="330" font-size="14" fill="#555">Main chain: α-1,4 links (as in amylose). Every ~24–30 glucose units, a branch</text>
<text x="20" y="352" font-size="14" fill="#555">forms via an α-1,6-glycosidic bond from C6–OH of a chain glucose to C1 of the</text>
<text x="20" y="374" font-size="14" fill="#555">branch's first unit — giving a bushy, highly branched, water-soluble polymer that</text>
<text x="20" y="396" font-size="14" fill="#555">gives starch its characteristic blue-black colour with iodine (amylose channel complex).</text>
</svg>
