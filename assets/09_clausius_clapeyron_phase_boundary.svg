<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow09" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#222222"/>
    </marker>
  </defs>
  <rect width="700" height="420" fill="#ffffff"/>

  <!-- axes -->
  <line x1="90" y1="360" x2="630" y2="360" stroke="#222222" stroke-width="2" marker-end="url(#arrow09)"/>
  <line x1="90" y1="360" x2="90" y2="40" stroke="#222222" stroke-width="2" marker-end="url(#arrow09)"/>
  <text x="640" y="365" font-size="15" fill="#222222">T</text>
  <text x="80" y="32" font-size="15" fill="#222222">P</text>

  <!-- liquid-vapor coexistence curve, from triple point to critical point -->
  <path d="M 180,320 C 260,270 340,200 420,140 C 460,110 490,90 520,75" fill="none" stroke="#2166ac" stroke-width="3.5"/>

  <!-- triple point -->
  <circle cx="180" cy="320" r="5" fill="#111111"/>
  <text x="150" y="340" font-size="12" fill="#111111">Triple point</text>

  <!-- critical point -->
  <circle cx="520" cy="75" r="5" fill="#111111"/>
  <text x="500" y="60" font-size="12" fill="#111111">Critical point</text>

  <!-- region labels -->
  <text x="230" y="130" font-size="14" fill="#333333" font-weight="bold">Liquid</text>
  <text x="480" y="300" font-size="14" fill="#333333" font-weight="bold">Vapor</text>

  <!-- tangent line at a point on the curve with slope label -->
  <g>
    <circle cx="330" cy="215" r="4.5" fill="#b2182b"/>
    <line x1="270" y1="255" x2="390" y2="175" stroke="#b2182b" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="400" y="170" font-size="13" fill="#b2182b" font-weight="bold">slope = dP/dT</text>
  </g>

  <!-- equation box -->
  <rect x="380" y="300" width="230" height="50" rx="8" fill="#fff8e6" stroke="#c9a227" stroke-width="1.5"/>
  <text x="495" y="330" text-anchor="middle" font-size="15" font-weight="bold" fill="#5a4600">dP/dT = L / (T ΔV)</text>

  <text x="355" y="20" text-anchor="middle" font-size="12" fill="#555555">Clausius–Clapeyron equation: slope of the coexistence curve set by latent heat L and volume change ΔV.</text>
</svg>
