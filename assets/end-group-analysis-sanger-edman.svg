<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="640" height="300" fill="#ffffff"/>
<text x="320" y="24" text-anchor="middle" font-size="16" font-weight="bold">Peptide End-Group Analysis</text>

<text x="20" y="55" font-size="14" font-weight="bold" fill="#1f5fa8">N-terminal &#8211; Sanger's method (DNFB)</text>
<text x="20" y="78" font-size="12">1. 2,4-dinitrofluorobenzene (DNFB) reacts with the free &#945;-NH&#8322; of the N-terminal residue</text>
<text x="20" y="96" font-size="12">2. Acid hydrolysis of the peptide bonds gives a yellow DNP&#8211;amino acid</text>
<text x="20" y="114" font-size="12">3. Identify DNP-amino acid (chromatography) &#8594; reveals the N-terminal residue</text>

<text x="20" y="150" font-size="14" font-weight="bold" fill="#1f5fa8">N-terminal &#8211; Edman degradation (repetitive, sequencing method)</text>
<text x="20" y="173" font-size="12">1. Phenyl isothiocyanate (PITC) reacts with the N-terminal &#945;-NH&#8322;</text>
<text x="20" y="191" font-size="12">2. Mild acid cleaves only that terminal residue as a PTH-amino acid</text>
<text x="20" y="209" font-size="12">3. Rest of the peptide is intact &#8594; cycle repeats to read the sequence residue by residue</text>

<text x="20" y="245" font-size="14" font-weight="bold" fill="#a83232">C-terminal &#8211; Hydrazinolysis</text>
<text x="20" y="268" font-size="12">Peptide + NH&#8322;NH&#8322; (anhydrous, heat) &#8594; all residues become amino-acid hydrazides</text>
<text x="20" y="286" font-size="12">except the C-terminal residue, which is released as the free amino acid &#8211; identifies C-terminus.</text>
</svg>
