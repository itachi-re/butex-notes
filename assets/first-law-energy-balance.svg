<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" font-family="Arial, Helvetica, sans-serif">
  <rect width="600" height="360" fill="#ffffff"/>
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <!-- system box -->
  <rect x="220" y="120" width="160" height="120" fill="#e8f0fe" stroke="#1f77b4" stroke-width="2" rx="8"/>
  <text x="300" y="185" text-anchor="middle" font-size="18" fill="#222">System</text>
  <text x="300" y="210" text-anchor="middle" font-size="14" fill="#555">ΔU</text>
  <!-- Q in -->
  <line x1="60" y1="180" x2="215" y2="180" stroke="#d62728" stroke-width="3" marker-end="url(#arr3)"/>
  <text x="130" y="170" text-anchor="middle" font-size="16" fill="#d62728">Q (heat in)</text>
  <!-- W out -->
  <line x1="385" y1="180" x2="540" y2="180" stroke="#2ca02c" stroke-width="3" marker-end="url(#arr3)"/>
  <text x="465" y="170" text-anchor="middle" font-size="16" fill="#2ca02c">W (work out)</text>
  <!-- equation -->
  <text x="300" y="300" text-anchor="middle" font-size="18" fill="#222">δQ = dU + δW</text>
  <text x="300" y="330" text-anchor="middle" font-size="14" fill="#555">First Law: energy balance</text>
</svg>