<svg xmlns="http://www.w3.org/2000/svg" width="840" height="340" viewBox="0 0 840 340" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Call by value versus call by reference" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Call by value versus call by reference</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker></defs>
<rect x="0.5" y="0.5" width="839" height="339" fill="#ffffff" stroke="#cfd8dc" rx="8"/>
<text x="210" y="31.6" font-size="16" text-anchor="middle" font-weight="bold" fill="#1a1a1a" ><tspan x="210" dy="0">Call by VALUE</tspan></text><text x="630" y="31.6" font-size="16" text-anchor="middle" font-weight="bold" fill="#1a1a1a" ><tspan x="630" dy="0">Call by REFERENCE</tspan></text><rect x="110" y="50" width="200" height="66" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/><text x="210.0" y="79.425" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="210.0" dy="0">main()</tspan><tspan x="210.0" dy="16.25">a = 10   (@1000)</tspan></text><rect x="110" y="190" width="200" height="66" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/><text x="210.0" y="219.425" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="210.0" dy="0">swap(int x, int y)</tspan><tspan x="210.0" dy="16.25">x = 10   (@2000)</tspan></text><polyline points="210,116 210,188" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><text x="225" y="157.2" font-size="12" text-anchor="start" font-weight="bold" fill="#b71c1c" ><tspan x="225" dy="0">value 10 is COPIED</tspan></text><rect x="530" y="50" width="200" height="66" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/><text x="630.0" y="79.425" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="630.0" dy="0">main()</tspan><tspan x="630.0" dy="16.25">a = 10   (@1000)</tspan></text><rect x="530" y="190" width="200" height="66" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/><text x="630.0" y="219.425" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="630.0" dy="0">swap(int *p, int *q)</tspan><tspan x="630.0" dy="16.25">p = 1000   (@2000)</tspan></text><polyline points="630,190 630,118" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/><text x="645" y="157.2" font-size="12" text-anchor="start" font-weight="bold" fill="#b71c1c" ><tspan x="645" dy="0">p holds the ADDRESS of a</tspan></text><text x="210" y="292.425" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="210" dy="0">x is only a copy →</tspan><tspan x="210" dy="16.25">changing x leaves a unchanged</tspan></text><text x="630" y="292.425" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a" ><tspan x="630" dy="0">*p = 20 writes into a itself →</tspan><tspan x="630" dy="16.25">a becomes 20</tspan></text><polyline points="420,20 420,330" fill="none" stroke="#b0bec5" stroke-width="1.6"/>
</svg>