<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Melting curve slope of water versus a typical substance</title>
<desc>Water has a negative dP/dT melting curve because ice is less dense than liquid water.</desc>
<defs><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="my" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#777777"/></marker></defs>
<rect x="0" y="0" width="760" height="400" fill="#ffffff"/>
<text x="200" y="36" fill="#222222" font-size="16" text-anchor="middle" font-weight="bold">Ice → water (volume decreases)</text>
<text x="560" y="36" fill="#222222" font-size="16" text-anchor="middle" font-weight="bold">Typical solid → liquid (volume increases)</text>
<line x1="50" y1="320" x2="50" y2="60" stroke="#222222" stroke-width="2" marker-end="url(#mk)"/>
<line x1="50" y1="320" x2="350" y2="320" stroke="#222222" stroke-width="2" marker-end="url(#mk)"/>
<text x="36" y="68" fill="#222222" font-size="15" text-anchor="end" font-weight="bold">P</text>
<text x="358" y="325" fill="#222222" font-size="15" text-anchor="start" font-weight="bold">T</text>
<line x1="190" y1="300" x2="150" y2="90" stroke="#1f5fbf" stroke-width="3"/>
<text x="95" y="200" fill="#222222" font-size="16" text-anchor="middle" font-weight="bold">Solid</text>
<text x="275" y="150" fill="#222222" font-size="16" text-anchor="middle" font-weight="bold">Liquid</text>
<text x="185" y="240" fill="#1f5fbf" font-size="14" text-anchor="start" font-weight="normal">dP/dT &lt; 0</text>
<line x1="410" y1="320" x2="410" y2="60" stroke="#222222" stroke-width="2" marker-end="url(#mk)"/>
<line x1="410" y1="320" x2="710" y2="320" stroke="#222222" stroke-width="2" marker-end="url(#mk)"/>
<text x="396" y="68" fill="#222222" font-size="15" text-anchor="end" font-weight="bold">P</text>
<text x="718" y="325" fill="#222222" font-size="15" text-anchor="start" font-weight="bold">T</text>
<line x1="540" y1="300" x2="590" y2="90" stroke="#c0392b" stroke-width="3"/>
<text x="455" y="200" fill="#222222" font-size="16" text-anchor="middle" font-weight="bold">Solid</text>
<text x="660" y="150" fill="#222222" font-size="16" text-anchor="middle" font-weight="bold">Liquid</text>
<text x="570" y="240" fill="#c0392b" font-size="14" text-anchor="start" font-weight="normal">dP/dT &gt; 0</text>
<text x="200" y="355" fill="#222222" font-size="14" text-anchor="middle" font-weight="normal">v(liquid) &lt; v(solid):  dP/dT &lt; 0</text>
<text x="200" y="378" fill="#1f5fbf" font-size="14" text-anchor="middle" font-weight="bold">Ice: dT/dP ≈ −0.0075 K/atm</text>
<text x="560" y="355" fill="#222222" font-size="14" text-anchor="middle" font-weight="normal">v(liquid) &gt; v(solid):  dP/dT &gt; 0</text>
<text x="560" y="378" fill="#c0392b" font-size="14" text-anchor="middle" font-weight="bold">Melting point rises with pressure</text>
</svg>
