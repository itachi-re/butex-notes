</text><text x="552.7" y="484.1" font-family="Arial, Helvetica, sans-serif" font-size="7.3" fill="#374151" font-weight="normal" xml:space="preserve">2</text><text x="556.8" y="482.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#374151" font-weight="normal" xml:space="preserve"> → CO</text><text x="588.8" y="484.1" font-family="Arial, Helvetica, sans-serif" font-size="7.3" fill="#374151" font-weight="normal" xml:space="preserve">2</text><text x="592.9" y="482.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#374151" font-weight="normal" xml:space="preserve"> + heat (≈ 1500-1800 °C)</text><line x1="400.0" y1="535.0" x2="520.0" y2="535.0" stroke="#9ca3af" stroke-width="1" stroke-linecap="round" stroke-dasharray="2,3"/><text x="525.0" y="533.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111827" text-anchor="start" font-weight="bold">Well</text><text x="525.0" y="547.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#374151" text-anchor="start" font-weight="normal">molten metal &amp; slag collect</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>